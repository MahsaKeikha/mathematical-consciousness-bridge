<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P77 finite-sample full-law model-set separation</title>
  <desc id="desc">What this figure shows: P77 strengthens the P76 finite-sample adequacy audit from selected necessary polynomial constraints to separation of the entire simultaneous confidence region from the entire declared model set. The left panel summarizes the P76 constraint route and its limitation; the right panel shows the complete model family, the empirical-law confidence region, and the certified separation gap required for full-law rejection. How to read it: move from the three P76 constraint families into the limitation card, then follow the attached full-law audit arrow into the P77 geometry. The measured gap runs exactly from the boundary of the declared model set to the boundary of the confidence region. The lower band distinguishes a sound lower bound from an ordinary candidate best fit. Main takeaway: full-law rejection requires a certified lower bound proving that every admissible model is farther away than the sampling radius; a candidate best fit alone cannot certify rejection. Scientific status: finite-sample model-set separation theorem figure. Non-rejection is not model acceptance; the theorem does not identify the latent state with consciousness, and the physical-to-experiential bridge remains open.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, Helvetica, sans-serif; fill: #475569; }
      .panelTitle { font: 700 20px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .body { font: 400 14px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, Helvetica, sans-serif; fill: #64748b; }
      .mini { font: 400 11px Arial, Helvetica, sans-serif; fill: #475569; }
      .eq { font: 600 14px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .white { font: 400 14px Arial, Helvetica, sans-serif; fill: #e2e8f0; }
      .whiteBold { font: 700 17px Arial, Helvetica, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f8fafc"/>
  <rect x="34" y="28" width="1132" height="704" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="68" y="76" class="title">P77 Finite-Sample Full-Law Model-Set Separation</text>
  <text x="68" y="106" class="subtitle">From interpretable necessary constraints to certified separation from the complete declared model family</text>

  <!-- P76 panel -->
  <rect id="p76-panel" x="68" y="138" width="456" height="400" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="94" y="176" class="panelTitle">P76: interpretable necessary constraints</text>
  <text x="94" y="204" class="body">Reject when a tracked P75 polynomial interval excludes zero.</text>

  <rect id="p76-tetrads" x="96" y="236" width="120" height="70" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="112" y="263" class="eq">Tetrads</text>
  <text x="112" y="287" class="body">D1 = 0, D2 = 0</text>

  <rect id="p76-cross-triple" x="228" y="236" width="128" height="70" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="244" y="263" class="eq">Cross-triple</text>
  <text x="244" y="287" class="body">G1, G2, G3 = 0</text>

  <rect id="p76-fourth-moment" x="368" y="236" width="128" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="432" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Fourth moment</text>
  <text x="432" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#334155">H123, H124</text>
  <text x="432" y="299" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#334155">H134</text>

  <line id="tetrad-to-limit" x1="156" y1="306" x2="156" y2="352" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line id="cross-to-limit" x1="292" y1="306" x2="292" y2="352" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line id="moment-to-limit" x1="432" y1="306" x2="432" y2="352" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect id="p76-limitation" x="96" y="352" width="400" height="76" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="116" y="380" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Limitation of selected constraints</text>
  <text x="116" y="404" class="body">A law may satisfy every tracked equation and still fail</text>
  <text x="116" y="422" class="body">membership in the complete declared model set.</text>

  <rect id="p76-open-question" x="96" y="452" width="400" height="56" rx="11" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="116" y="478" class="eq">Question left open:</text>
  <text x="116" y="498" class="body">does any full model law remain compatible with the data?</text>

  <!-- Attached transition between panels -->
  <line id="full-law-audit" x1="524" y1="338" x2="574" y2="338" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="549" y="309" text-anchor="middle" class="small">full-law</text>
  <text x="549" y="324" text-anchor="middle" class="small">audit</text>

  <!-- P77 panel -->
  <rect id="p77-panel" x="574" y="138" width="558" height="400" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="176" class="panelTitle">P77: complete declared model-set separation</text>
  <text x="600" y="202" class="body">Reject only when the entire confidence region is disjoint</text>
  <text x="600" y="220" class="body">from the entire declared model set.</text>

  <!-- Geometric separation schematic -->
  <path id="declared-model-set" d="M642 360 C644 302 700 266 772 264 C848 262 906 286 930 328 C901 378 837 408 766 410 C697 412 638 392 642 360 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="715" y="342" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#075985">Declared model set M</text>
  <text x="690" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0369a1">all laws allowed by the stated model</text>

  <rect id="gap-note" x="812" y="238" width="154" height="44" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="889" y="256" text-anchor="middle" class="mini">Certified separation gap</text>
  <text x="889" y="272" text-anchor="middle" class="mini">after sampling uncertainty</text>
  <line x1="925" y1="282" x2="958" y2="315" stroke="#94a3b8" stroke-width="1.5"/>

  <circle id="confidence-region" cx="1040" cy="328" r="46" fill="#fef2f2" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="1040" y="309" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">empirical law P_hat</text>
  <circle id="empirical-law" cx="1040" cy="332" r="9" fill="#dc2626"/>
  <text x="1040" y="394" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#991b1b">confidence region Cn</text>

  <!-- The measured gap touches both geometric boundaries exactly. -->
  <line id="certified-gap" x1="930" y1="328" x2="994" y2="328" stroke="#334155" stroke-width="2.5"/>
  <line x1="930" y1="320" x2="930" y2="336" stroke="#334155" stroke-width="2"/>
  <line x1="994" y1="320" x2="994" y2="336" stroke="#334155" stroke-width="2"/>

  <rect id="full-law-condition" x="610" y="452" width="486" height="64" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="630" y="476" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#065f46">Full-law rejection condition</text>
  <text x="630" y="497" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#047857">certified lower bound L &gt; sampling radius</text>
  <text x="630" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#047857">=&gt; Cn intersect M = empty</text>

  <!-- Optimization direction -->
  <rect id="optimization-direction" x="68" y="570" width="1064" height="116" rx="16" fill="#0f172a"/>
  <text x="94" y="604" class="whiteBold">Critical optimization direction</text>
  <text x="94" y="632" class="white">A candidate best-fit model gives an upper bound on distance.</text>
  <text x="94" y="655" class="white">It cannot by itself certify rejection; P77 needs a sound lower bound or an equivalent infeasibility proof.</text>
  <text x="94" y="678" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#86efac">Non-rejection is not model acceptance.</text>

  <text x="68" y="710" class="small">Schematic geometry, not metric scale. P77 does not identify the latent state with consciousness.</text>
  <text x="68" y="726" class="small">The physical-to-experiential bridge remains open.</text>
</svg>
