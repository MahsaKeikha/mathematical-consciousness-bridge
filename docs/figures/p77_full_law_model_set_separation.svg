<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P77 finite-sample full-law model-set separation</title>
  <desc id="desc">What this figure shows: Figure 12. P77 full-law model-set separation. P76 provides interpretable finite-sample rejection through selected necessary constraints. P77 defines the stronger full-law criterion: the entire confidence region must be separated from the entire declared model set. An ordinary best-fit candidate is not a rejection certificate because it gives an upper bound on model distance. How to read it: follow only the labeled arrows, axes, panels, set relations, or inequalities shown in the visual and interpret them using the adjacent research text. Main takeaway: the figure summarizes the stated mathematical or scientific dependency; visual proximity alone does not add a claim. Scientific status: Reader-facing research figure; formal status is controlled by the linked proof or source record.</desc>

  <rect x="0" y="0" width="1200" height="760" rx="22" fill="#f8fafc"/>
  <rect x="36" y="32" width="1128" height="696" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="70" y="84" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#0f172a">P77 Finite-Sample Full-Law Model-Set Separation</text>
  <text x="70" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">From selected necessary constraints to confidence-region separation from the complete declared model set</text>

  <rect x="70" y="152" width="470" height="410" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="98" y="190" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">P76: interpretable necessary constraints</text>
  <text x="98" y="220" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Reject when a tracked P75 polynomial interval excludes zero.</text>

  <rect x="110" y="254" width="170" height="70" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="132" y="283" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#312e81">Tetrads</text>
  <text x="132" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4338ca">D1 = 0, D2 = 0</text>

  <rect x="330" y="254" width="170" height="70" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="348" y="283" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#164e63">Cross-triple</text>
  <text x="348" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0e7490">G1, G2, G3 = 0</text>

  <rect x="220" y="352" width="170" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="241" y="381" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#14532d">Fourth moment</text>
  <text x="247" y="405" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#15803d">H123, H124, H134</text>

  <path d="M195 326 C195 338 243 340 279 352" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M415 326 C415 338 367 340 331 352" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <rect x="118" y="462" width="374" height="66" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="141" y="488" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#9a3412">Limitation</text>
  <text x="141" y="512" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7c2d12">A law may satisfy tracked constraints yet fail full model membership.</text>

  <rect x="575" y="152" width="555" height="410" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="603" y="190" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">P77: complete declared model-set separation</text>
  <text x="603" y="220" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Reject only when the whole confidence region is disjoint from the model set.</text>

  <path d="M651 372 C665 287 754 257 839 273 C920 288 986 347 1019 431 C947 480 867 502 788 487 C710 473 650 435 651 372 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="754" y="360" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#075985">Declared model set M</text>
  <text x="730" y="385" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0369a1">all four-view laws allowed by the stated model</text>

  <circle cx="1060" cy="294" r="11" fill="#dc2626"/>
  <text x="1020" y="268" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#991b1b">empirical law P_hat</text>
  <circle cx="1060" cy="294" r="56" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="997" y="372" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#991b1b">confidence region Cn</text>

  <line x1="1005" y1="329" x2="964" y2="357" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="950" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#334155">gap remains after uncertainty</text>

  <rect x="615" y="462" width="475" height="66" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="637" y="489" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#065f46">Full-law rejection condition</text>
  <text x="637" y="513" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#047857">certified lower bound L &gt; sampling radius  =>  Cn intersect M = empty</text>

  <rect x="70" y="594" width="1060" height="104" rx="16" fill="#0f172a"/>
  <text x="98" y="627" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Critical optimization direction</text>
  <text x="98" y="654" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2e8f0">A candidate best-fit model gives an upper bound on distance. It cannot by itself certify rejection of a continuous model family.</text>
  <text x="98" y="679" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#cbd5e1">P77 requires a sound lower bound or equivalent certified feasibility result. Non-rejection is not model acceptance.</text>

  <text x="70" y="718" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Schematic geometry, not metric scale. P77 does not identify the latent state with consciousness; the physical-to-experiential bridge remains open.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
