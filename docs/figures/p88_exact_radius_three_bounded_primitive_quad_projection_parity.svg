  <text class="white title" x="54" y="50">P88 Radius-Three Bounded-Primitive Four-Event Certificate</text>
  <text class="white subtitle" x="54" y="79">Expanding the exact primitive coefficient radius from 2 to 3 produces a new strict shared-parameter witness.</text>

