  <text class="ink formula" x="98" y="318">(6⁴ − 2·2⁴) / 2 = 632</text>
  <text class="muted body" x="98" y="340">global-sign duplicates removed</text>
  <rect class="soft" x="78" y="374" rx="12" width="290" height="88"/>
