<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="p88-title p88-desc">
  <title id="p88-title">P88 Radius-Three Bounded-Primitive Four-Event Parity Certificate</title>
  <desc id="p88-desc">What this figure shows: Figure 2. P88 exact radius-three bounded-primitive four-event parity certificate. P88 exhausts 632 primitive sign-normalized coefficient patterns across each of 330 four-event subsets, giving 208,560 exact functionals. On the established exact rational witness, the coefficients (1,-1,-3,2) give empirical value -11/8 outside the exact P75 interval [-1,2], with gap 3/8, centered norm 24, and certified full-law lower bound L88 = 1/64, strictly strengthening L87 = 1/96. This is a conditional model-separation theorem for the declared P75 family; it does not identify consciousness, establish nonphysicality, or close the physical-to-experiential bridge. How to read it: follow only the labeled arrows, axes, panels, set relations, or inequalities shown in the visual and interpret them using the adjacent research text. Main takeaway: the figure summarizes the stated mathematical or scientific dependency; visual proximity alone does not add a claim. Scientific status: Reader-facing research figure; formal status is controlled by the linked proof or source record.</desc>
