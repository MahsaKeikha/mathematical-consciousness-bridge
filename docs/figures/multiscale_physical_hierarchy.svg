<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">Multiscale physical hierarchy for the consciousness bridge program</title>
  <desc id="desc">Master figure connecting physical dynamics, network state, certified moving subsystems, intervention-resolved causal structure, temporal and compositional theorems, empirical measurement, and the open physical-to-experiential bridge.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 40px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .head{font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .body{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#334155}
      .small{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}
      .label{font:700 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.8px;fill:#64748b}
      .eq{font:600 17px Georgia,'Times New Roman',serif;fill:#0f172a}
      .eqdark{font:600 18px Georgia,'Times New Roman',serif;fill:#e2e8f0}
      .arrow{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:1.6;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1800" height="1260" fill="#ffffff"/>
  <text x="80" y="68" class="title">Multiscale Physical Hierarchy of the Research Program</text>
  <text x="80" y="103" class="subtitle">Physical scale, mathematical structure, measurement, and bridge interpretation remain distinct.</text>

  <text x="80" y="155" class="label">PHYSICAL MODELING</text>
  <text x="650" y="155" class="label">STRUCTURAL THEOREMS</text>
  <text x="1220" y="155" class="label">EMPIRICAL + BRIDGE</text>

  <!-- Left column -->
  <g>
    <rect x="80" y="180" width="500" height="150" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="115" y="218" class="head">1. Local physical dynamics</text>
    <text x="115" y="258" class="eq">dXₜ = f(Xₜ,uₜ)dt + G(Xₜ,uₜ)dWₜ</text>
    <text x="115" y="296" class="body">state · noise · forces · energy exchange</text>
    <text x="115" y="308" class="small">stochastic dynamics and nonequilibrium physics</text>
  </g>

  <g>
    <rect x="80" y="370" width="500" height="150" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="115" y="408" class="head">2. Network state at chosen scale</text>
    <text x="115" y="448" class="eq">Xₜ₊Δₜ ∼ KΔₜ( · | Xₜ,uₜ )</text>
    <text x="115" y="486" class="body">neural · physiological · engineered variables</text>
    <text x="115" y="498" class="small">P17 makes the choice of physical scale explicit.</text>
  </g>

  <g>
    <rect x="80" y="560" width="500" height="165" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="115" y="598" class="head">3. Dynamically distinct subsystem</text>
    <text x="115" y="638" class="eq">W = (S₀, … , Sₜ₋₁)</text>
    <text x="115" y="676" class="body">integration · insulation · persistence · flow</text>
    <text x="115" y="700" class="small">Spatiotemporal Observer Mathematics layer.</text>
  </g>

  <g>
    <rect x="80" y="765" width="500" height="190" rx="18" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="115" y="803" class="head">4. Intervention causal structure</text>
    <text x="115" y="843" class="eq">Pₚᵘ,τ = ℒ(Yₜ₊τⱽ | do(u), p)</text>
    <text x="115" y="882" class="body">response geometry G · directed influence A</text>
    <text x="115" y="908" class="body">partition irreducibility K</text>
    <text x="115" y="934" class="small">P11-P13: construction and minimality audits</text>
  </g>

  <path class="arrow" d="M330 330 V358"/>
  <path class="arrow" d="M330 520 V548"/>
  <path class="arrow" d="M330 725 V753"/>

  <!-- Center column -->
  <g>
    <rect x="650" y="180" width="500" height="175" rx="18" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="685" y="218" class="head">Temporal continuation</text>
    <text x="685" y="258" class="eq">D̄([c],[c′]) = minₕ D(c,hc′)</text>
    <text x="685" y="297" class="eq">V₀:T = Σₜ D̄([cₜ],[cₜ₊₁])</text>
    <text x="685" y="329" class="small">P14-P15: temporal paths + finite-error certification</text>
  </g>

  <g>
    <rect x="650" y="400" width="500" height="175" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="685" y="438" class="head">Composition and coupling</text>
    <text x="685" y="478" class="eq">PAB = PA ⊗ PB  under independence</text>
    <text x="685" y="517" class="eq">χAB = sup ‖PAB − PA⊗PB‖TV</text>
    <text x="685" y="549" class="small">P16: independent null + measurable coupling defect</text>
  </g>

  <g>
    <rect x="650" y="620" width="500" height="175" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="685" y="658" class="head">Scale change and coarse-graining</text>
    <text x="685" y="700" class="eq">‖C#P − C#Q‖TV ≤ ‖P − Q‖TV</text>
    <text x="685" y="740" class="body">bijections preserve distance</text>
    <text x="685" y="766" class="body">many-to-one maps can erase distinctions</text>
  </g>

  <g>
    <rect x="650" y="840" width="500" height="160" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="685" y="878" class="head">Finite-data observability</text>
    <text x="685" y="918" class="eq">γS &gt; 4ε</text>
    <text x="685" y="956" class="body">error · samples · protocol design · recovery</text>
    <text x="685" y="978" class="small">P7-P10 and P15 separate population and data claims.</text>
  </g>

  <path class="dash" d="M580 855 H638"/>

  <!-- Right column -->
  <g>
    <rect x="1220" y="180" width="500" height="180" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="1255" y="218" class="head">Measured state and perturbation data</text>
    <text x="1255" y="258" class="body">EEG · MEG · fMRI · intracranial · physiology</text>
    <text x="1255" y="286" class="body">behavior · report · controlled perturbation</text>
    <text x="1255" y="310" class="small">Casali · Sarasso · Siclari · Claassen · Luppi</text>
    <text x="1255" y="334" class="small">Measurements constrain theory, not experience.</text>
  </g>

  <g>
    <rect x="1220" y="405" width="500" height="165" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="1255" y="443" class="head">Extreme-environment robustness</text>
    <text x="1255" y="483" class="body">sleep disruption · isolation · workload</text>
    <text x="1255" y="511" class="body">radiation · altered gravity · mission stress</text>
    <text x="1255" y="543" class="small">NASA HRP is an application and validation domain.</text>
  </g>

  <g>
    <rect x="1220" y="615" width="500" height="175" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="1255" y="653" class="head">Competing bridge theories</text>
    <text x="1255" y="693" class="body">IIT · GNWT · recurrent · higher-order</text>
    <text x="1255" y="721" class="body">predictive and representational families</text>
    <text x="1255" y="755" class="eq">𝔗ⱼ = (Fⱼ, Bⱼ, Mⱼ, Πⱼ)</text>
  </g>

  <g>
    <rect x="1220" y="835" width="500" height="190" rx="18" fill="#0f172a"/>
    <text x="1255" y="875" style="font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc">Open mathematical bridge</text>
    <text x="1255" y="920" class="eqdark">B̄ : QP → QE</text>
    <text x="1255" y="960" style="font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1">Find an independently physical signature whose classes</text>
    <text x="1255" y="985" style="font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1">match a formally justified experiential equivalence.</text>
  </g>

  <path class="arrow" d="M1150 265 H1208"/>
  <path class="arrow" d="M1150 487 H1208"/>
  <path class="arrow" d="M1150 702 H1208"/>
  <path class="arrow" d="M1470 790 V823"/>

  <!-- Footer -->
  <rect x="80" y="1080" width="1640" height="115" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="115" y="1118" class="label">FOUNDATIONAL LINEAGE</text>
  <text x="115" y="1152" class="body">Shannon · Amari · Landauer · Seifert · Pearl · Tegmark</text>
  <text x="115" y="1178" class="small">Empirical and theory-specific sources are separated in the role-aware bibliographies.</text>
</svg>