<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P64 fast certified heterogeneous-cost integer approximation</title>
  <desc id="desc">A visual showing the exact continuous P62 allocation, flooring to a feasible integer design, the instance-specific floor ratio, and the resulting approximation guarantee relative to the exact P63 optimum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/></filter>
    <style>
      .h1{font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:400 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}.bt{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}.tx{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155}.math{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f172a}.small{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}.arrow{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="h1">P64: Fast certified approximation when exact integer DP is expensive</text>
  <text x="60" y="88" class="sub">Floor the P62 continuous optimum, keep feasibility automatically, and quantify exactly how much objective quality can be lost.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="140" width="310" height="160" rx="18" fill="#eef2ff" stroke="#6366f1"/>
    <text x="82" y="177" class="bt">1. Solve P62 continuously</text>
    <text x="82" y="214" class="math">nₑ* = (B/T)bₑ^(2/3)cₑ^(-2/3)</text>
    <text x="82" y="246" class="tx">Fast closed-form ideal allocation.</text>
    <text x="82" y="275" class="small">P64 regime: every nₑ* ≥ 1.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="445" y="140" width="310" height="160" rx="18" fill="#ecfdf5" stroke="#10b981"/>
    <text x="472" y="177" class="bt">2. Round down</text>
    <text x="472" y="214" class="math">kₑ = floor(nₑ*)</text>
    <text x="472" y="246" class="math">Σ cₑkₑ ≤ Σ cₑnₑ* = B</text>
    <text x="472" y="275" class="small">Whole measurements and automatically budget-feasible.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="835" y="140" width="310" height="160" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="862" y="177" class="bt">3. Measure rounding loss</text>
    <text x="862" y="214" class="math">rₑ = floor(nₑ*) / nₑ*</text>
    <text x="862" y="246" class="math">rmin = minₑ rₑ</text>
    <text x="862" y="275" class="small">Closer to 1 means almost no rounding loss.</text>
  </g>

  <path d="M365 220 L445 220" class="arrow"/>
  <path d="M755 220 L835 220" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="160" y="385" width="880" height="145" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="1.6"/>
    <text x="195" y="423" class="bt">4. Certified approximation to the unknown exact P63 optimum</text>
    <text x="195" y="466" class="math">U(kfloor) ≤ (1 / √rmin) U*cont(B) ≤ (1 / √rmin) U*int(B)</text>
    <text x="195" y="501" class="tx">No budget-scale dynamic program is required to compute this certificate.</text>
  </g>

  <path d="M990 300 C950 345 810 360 755 385" class="arrow"/>
  <path d="M600 300 L600 385" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="90" y="600" width="470" height="110" rx="18" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="118" y="636" class="bt">Simple uniform guarantee</text>
    <text x="118" y="670" class="math">nₑ* ≥ ν &gt; 1 ⇒ factor ≤ √[ν/(ν−1)]</text>
    <text x="118" y="694" class="small">The factor approaches 1 as continuous counts grow.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="600" width="470" height="110" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="668" y="636" class="bt">Scalability</text>
    <text x="668" y="670" class="math">O(m) after the P62 closed form</text>
    <text x="668" y="694" class="small">If any nₑ* &lt; 1, P64 refuses to overclaim and P63 remains available.</text>
  </g>

  <path d="M420 530 C405 565 350 578 325 600" class="arrow"/>
  <path d="M780 530 C795 565 850 578 875 600" class="arrow"/>
  <text x="60" y="746" class="small">Boundary: P64 is a certified approximation for the declared calibration surrogate, not a claim about consciousness or quantum incompleteness.</text>
</svg>
