<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">P64 fast certified heterogeneous cost integer approximation</title>
  <desc id="desc">A publication-safe diagram showing the P62 continuous allocation, flooring to a feasible integer design, the instance-specific floor ratio, and the approximation guarantee relative to the exact P63 optimum.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#334155"/>
    </marker>
    <style>
      .h1{font:700 40px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .sub{font:400 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
      .bt{font:700 25px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .tx{font:400 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155}
      .math{font:600 20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f172a}
      .small{font:400 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}
      .arrow{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
      .card{stroke-width:2}
    </style>
  </defs>

  <rect width="1800" height="1050" rx="28" fill="#f8fafc"/>
  <text x="70" y="70" class="h1">P64: Fast certified approximation when exact integer DP is expensive</text>
  <text x="70" y="112" class="sub">Floor the P62 continuous optimum, preserve feasibility automatically, and quantify the resulting objective loss.</text>

  <g id="p64-continuous" data-qa-block="true" data-x="70" data-y="175" data-width="500" data-height="250">
    <rect class="card" x="70" y="175" width="500" height="250" rx="22" fill="#eef2ff" stroke="#6366f1"/>
    <text x="115" y="222" class="bt">1. Solve P62 continuously</text>
    <text x="115" y="265" class="math">nₑ* = (B/T)</text>
    <text x="115" y="298" class="math">× bₑ^(2/3)cₑ^(-2/3)</text>
    <text x="115" y="343" class="tx">Fast closed-form ideal allocation.</text>
    <text x="115" y="385" class="small">P64 regime: every nₑ* ≥ 1.</text>
  </g>

  <g id="p64-floor" data-qa-block="true" data-x="650" data-y="175" data-width="500" data-height="250">
    <rect class="card" x="650" y="175" width="500" height="250" rx="22" fill="#ecfdf5" stroke="#10b981"/>
    <text x="695" y="222" class="bt">2. Round down</text>
    <text x="695" y="272" class="math">kₑ = floor(nₑ*)</text>
    <text x="695" y="312" class="math">Σ cₑkₑ ≤ Σ cₑnₑ* = B</text>
    <text x="695" y="360" class="small">Whole counts remain budget feasible.</text>
  </g>

  <g id="p64-ratio" data-qa-block="true" data-x="1230" data-y="175" data-width="500" data-height="250">
    <rect class="card" x="1230" y="175" width="500" height="250" rx="22" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1275" y="222" class="bt">3. Measure rounding loss</text>
    <text x="1275" y="272" class="math">rₑ = floor(nₑ*) / nₑ*</text>
    <text x="1275" y="312" class="math">rmin = minₑ rₑ</text>
    <text x="1275" y="360" class="small">Values near 1 mean small rounding loss.</text>
  </g>

  <path d="M570 300 H638" class="arrow" data-from="p64-continuous" data-to="p64-floor"/>
  <path d="M1150 300 H1218" class="arrow" data-from="p64-floor" data-to="p64-ratio"/>

  <g id="p64-certificate" data-qa-block="true" data-x="245" data-y="520" data-width="1310" data-height="250">
    <rect class="card" x="245" y="520" width="1310" height="250" rx="24" fill="#fff7ed" stroke="#f97316"/>
    <text x="295" y="570" class="bt">4. Certified approximation to the exact P63 optimum</text>
    <text x="295" y="630" class="math">U(kfloor) ≤ (1 / √rmin) U*cont(B)</text>
    <text x="295" y="675" class="math">U(kfloor) ≤ (1 / √rmin) U*int(B)</text>
    <text x="295" y="725" class="tx">The certificate requires no budget-scale dynamic program.</text>
  </g>

  <path d="M900 425 V508" class="arrow" data-from="p64-floor" data-to="p64-certificate"/>
  <path d="M1480 425 C1450 480 1325 490 1240 520" class="arrow" data-from="p64-ratio" data-to="p64-certificate"/>

  <g id="p64-uniform" data-qa-block="true" data-x="120" data-y="845" data-width="710" data-height="145">
    <rect class="card" x="120" y="845" width="710" height="145" rx="20" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="165" y="892" class="bt">Simple uniform guarantee</text>
    <text x="165" y="928" class="math">nₑ* ≥ ν &gt; 1 ⇒ factor ≤ √[ν/(ν - 1)]</text>
    <text x="165" y="958" class="small">The factor approaches 1 as continuous counts grow.</text>
  </g>

  <g id="p64-scale" data-qa-block="true" data-x="970" data-y="845" data-width="710" data-height="145">
    <rect class="card" x="970" y="845" width="710" height="145" rx="20" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1015" y="892" class="bt">Scalability</text>
    <text x="1015" y="928" class="math">O(m) after the P62 closed form</text>
    <text x="1015" y="958" class="small">If any nₑ* &lt; 1, P63 remains the exact fallback.</text>
  </g>

  <path d="M560 770 C520 815 475 820 475 833" class="arrow" data-from="p64-certificate" data-to="p64-uniform"/>
  <path d="M1240 770 C1280 815 1325 820 1325 833" class="arrow" data-from="p64-certificate" data-to="p64-scale"/>

  <text x="900" y="1025" text-anchor="middle" class="small">Boundary: P64 is a certified approximation for the declared calibration surrogate, not a claim about consciousness or quantum incompleteness.</text>
</svg>
