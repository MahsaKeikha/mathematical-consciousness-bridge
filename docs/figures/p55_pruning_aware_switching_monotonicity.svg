<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">P55 pruning-aware metric switching-cost monotonicity</title>
  <desc id="desc">What this figure shows: P55 proves deterministic monotonicity of the exact P54 execution optimum when a valid sequential update makes every residual demand weakly smaller, while acquisition cost, switching metric, and setup start remain fixed. Metric shortcutting makes the optimal route value nonincreasing under support deletion, so total cost release decomposes exactly into nonnegative acquisition release plus nonnegative route release. How to read it: the three upper cards specify the fixed comparison regime, the earlier residual state, and the later componentwise-smaller state. Their attached arrows feed the central support-deletion theorem and exact cost-release identity. The lower cards separate the support-preserving case, the computable shortcut lower certificate, and the sequential experimental implication. Main takeaway: every released residual sample saves its acquisition cost, while deleting a preparation from the positive-demand support can add further switching savings; this monotonicity depends on a fixed metric and fixed start. Scientific status: Deterministic scheduling theorem conditional on valid residual demands and valid pruning decisions. It does not justify pruning, prove statistical minimaxity of the underlying thresholds, identify a route or graph quantity with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Arial,sans-serif;fill:#475569}
      .head{font:700 18px Arial,sans-serif;fill:#0f172a}
      .copy{font:400 15px Arial,sans-serif;fill:#334155}
      .small{font:400 13.5px Arial,sans-serif;fill:#475569}
      .eq{font:600 15px Georgia,'Times New Roman',serif;fill:#0f172a}
      .strong{font:700 16px Arial,sans-serif;fill:#0f172a}
      .route{font:700 13px Arial,sans-serif;fill:#475569}
      .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="1000" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P55  Pruning-aware metric switching-cost monotonicity</text>
  <text x="60" y="90" class="subtitle">Under a fixed metric and fixed setup start, residual-demand decrease cannot increase the exact P54 execution optimum.</text>

  <g id="block-regime" data-x="55" data-y="130" data-w="330" data-h="185">
    <rect x="55" y="130" width="330" height="185" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="80" y="168" class="head">1. Fixed comparison regime</text>
    <text x="80" y="205" class="strong">same a, metric c, start s</text>
    <text x="80" y="239" class="copy">a is per-sample acquisition cost.</text>
    <text x="80" y="269" class="copy">c is a finite switching metric.</text>
    <text x="80" y="296" class="small">Triangle inequality drives shortcutting.</text>
  </g>

  <g id="block-old" data-x="435" data-y="130" data-w="330" data-h="185">
    <rect x="435" y="130" width="330" height="185" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="460" y="168" class="head">2. Earlier residual state</text>
    <text x="460" y="205" class="strong">r with support S(r)</text>
    <text x="460" y="239" class="eq">C*(r;s)=a Σrᵢ+L*(S(r);s)</text>
    <text x="460" y="271" class="copy">Exact P54 deterministic optimum.</text>
    <text x="460" y="296" class="small">Positive residuals define route support.</text>
  </g>

  <g id="block-new" data-x="815" data-y="130" data-w="330" data-h="185">
    <rect x="815" y="130" width="330" height="185" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="840" y="168" class="head">3. Later residual state</text>
    <text x="840" y="205" class="strong">r′ ≤ r componentwise</text>
    <text x="840" y="239" class="eq">S(r′) ⊆ S(r)</text>
    <text x="840" y="271" class="copy">More samples or valid safe pruning</text>
    <text x="840" y="296" class="small">may release residual demand.</text>
  </g>

  <path id="arrow-1" class="arrow" d="M220 315 V350 H360 V385" data-source="block-regime" data-target="block-core"/>
  <path id="arrow-2" class="arrow" d="M600 315 V385" data-source="block-old" data-target="block-core"/>
  <path id="arrow-3" class="arrow" d="M980 315 V350 H840 V385" data-source="block-new" data-target="block-core"/>

  <text x="600" y="367" class="route" text-anchor="middle">delete removed vertices from an old optimal route and shortcut them by triangle inequality</text>

  <g id="block-core" data-x="110" data-y="385" data-w="980" data-h="270">
    <rect x="110" y="385" width="980" height="270" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="600" y="425" text-anchor="middle" class="head">4. Support deletion and exact P55 release identity</text>
    <text x="600" y="466" text-anchor="middle" class="strong">L*(S(r′);s) ≤ L*(S(r);s)</text>
    <text x="600" y="507" text-anchor="middle" class="eq">C*(r;s)-C*(r′;s)</text>
    <text x="600" y="537" text-anchor="middle" class="eq">= a[Σrᵢ-Σr′ᵢ] + [L*(S(r);s)-L*(S(r′);s)]</text>
    <text x="600" y="577" text-anchor="middle" class="copy">Both release terms are nonnegative in the declared fixed-metric, fixed-start regime.</text>
    <text x="600" y="612" text-anchor="middle" class="strong">C*(r′;s) ≤ C*(r;s)</text>
    <text x="600" y="638" text-anchor="middle" class="small">Every released sample gives direct acquisition saving; support deletion may add route saving.</text>
  </g>

  <g id="block-support" data-x="55" data-y="705" data-w="330" data-h="160">
    <rect x="55" y="705" width="330" height="160" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="743" class="head">5. Support preserved</text>
    <text x="80" y="778" class="eq">S(r′)=S(r)</text>
    <text x="80" y="810" class="strong">route release = 0 exactly</text>
    <text x="80" y="839" class="small">Total release is acquisition release only.</text>
  </g>

  <g id="block-shortcut" data-x="435" data-y="705" data-w="330" data-h="160">
    <rect x="435" y="705" width="330" height="160" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="460" y="743" class="head">6. Shortcut lower certificate</text>
    <text x="460" y="777" class="eq">Δshortcut=L*old-Csw(πkeep)</text>
    <text x="460" y="808" class="eq">0 ≤ Δshortcut ≤ route release</text>
    <text x="460" y="839" class="small">Computable from the old optimal route.</text>
  </g>

  <g id="block-sequential" data-x="815" data-y="705" data-w="330" data-h="160">
    <rect x="815" y="705" width="330" height="160" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="840" y="743" class="head">7. Sequential implication</text>
    <text x="840" y="777" class="strong">valid release: r′ ≤ r</text>
    <text x="840" y="809" class="eq">⇒ C*(r′;s) ≤ C*(r;s)</text>
    <text x="840" y="839" class="small">P55 does not validate the pruning step.</text>
  </g>

  <path id="arrow-4" class="arrow" d="M300 655 V680 H220 V705" data-source="block-core" data-target="block-support"/>
  <path id="arrow-5" class="arrow" d="M600 655 V705" data-source="block-core" data-target="block-shortcut"/>
  <path id="arrow-6" class="arrow" d="M900 655 V680 H980 V705" data-source="block-core" data-target="block-sequential"/>

  <g id="block-boundary" data-x="90" data-y="885" data-w="1020" data-h="110">
    <rect x="90" y="885" width="1020" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="118" y="913" class="head">Deterministic and scientific boundary</text>
    <text x="118" y="937" class="small">P55 requires fixed metric and fixed start; nonmetric costs can lose monotonicity, and a moving start requires P56.</text>
    <text x="118" y="959" class="small">Pruning validity and threshold optimality remain external. Quantum incompleteness is not implied.</text>
    <text x="118" y="981" class="small">No scheduling quantity is identified with consciousness; the physical-to-experiential bridge remains open.</text>
  </g>
</svg>
