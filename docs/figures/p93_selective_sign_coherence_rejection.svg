<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">P93 Selective Finite-Sample Sign-Coherence Rejection</title>
  <desc id="desc">What this figure shows: Proposition 93 converts the P92 nonlinear three-minor sign-coherence obstruction into a finite-sample P75 rejection gate using only seven selected observable cells. Fixed per-cell error budgets are converted to certified rational P79 Hoeffding radii, then propagated through exact determinant interval bounds. The actual n=24 witness is not certified. For prospective replicated tables with the same exact proportions, a uniform seven-cell 95 percent allocation certifies at n=1632, while one separately declared unequal allocation certifies at n=1464 and fails at n=1440. The direct sixteen-cell P77 route using the P92 distance first clears the compatible replicated-witness design at n=1872. Scientific status: conditional rejection of the declared P75 family only; the physical-to-experiential bridge remains open.</desc>

  <rect width="1600" height="1000" rx="36" fill="#f7f8fb"/>
  <rect x="48" y="42" width="1504" height="164" rx="28" fill="#111827"/>
  <text x="90" y="98" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#a5b4fc">PROPOSITION 93</text>
  <text x="90" y="146" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#ffffff">Selective Finite-Sample Sign-Coherence Rejection</text>
  <text x="90" y="184" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#d1d5db">Seven relevant cells carry the P92 nonlinear certificate into finite data.</text>

  <rect x="48" y="236" width="900" height="480" rx="28" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="82" y="284" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#111827">Exact selective confidence pipeline</text>
  <text x="82" y="320" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4b5563">Budgets are fixed before the table is interpreted.</text>

  <rect x="82" y="354" width="238" height="132" rx="20" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="201" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#312e81">7 selected cells</text>
  <text x="201" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">t000 t001 t010 t011</text>
  <text x="201" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">t100 t101 t111</text>

  <path d="M330 420 H390" fill="none" stroke="#6b7280" stroke-width="4"/>
  <polygon points="390,420 374,411 374,429" fill="#6b7280"/>

  <rect x="402" y="354" width="238" height="132" rx="20" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="521" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#155e75">P79 radii</text>
  <text x="521" y="426" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">fixed alpha_x</text>
  <text x="521" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">exact rational upper bounds</text>

  <path d="M650 420 H710" fill="none" stroke="#6b7280" stroke-width="4"/>
  <polygon points="710,420 694,411 694,429" fill="#6b7280"/>

  <rect x="722" y="354" width="190" height="132" rx="20" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="817" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#166534">3 determinant</text>
  <text x="817" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#166534">intervals</text>
  <text x="817" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">exact box image</text>

  <rect x="82" y="526" width="830" height="150" rx="22" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="116" y="566" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#9a3412">Finite-sample rejection condition</text>
  <text x="116" y="610" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">U1 &lt; 0,  L2 &gt; 0,  L3 &gt; 0</text>
  <text x="116" y="647" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4b5563">forces signs (-,+,+), contradicting every P75 law with D1 D2 D3 &gt;= 0</text>

  <rect x="980" y="236" width="572" height="480" rx="28" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="1014" y="284" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#111827">95 percent replicated-witness record</text>
  <text x="1014" y="320" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#4b5563">Same exact proportions as the fixed P92 witness.</text>

  <rect x="1014" y="352" width="504" height="72" rx="18" fill="#fef2f2" stroke="#fecaca"/>
  <text x="1040" y="383" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#991b1b">Actual table</text>
  <text x="1482" y="383" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">n = 24</text>
  <text x="1040" y="410" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">not finite-sample certified</text>

  <rect x="1014" y="440" width="504" height="72" rx="18" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="1040" y="471" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#065f46">Prospective unequal allocation</text>
  <text x="1482" y="471" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">n = 1464</text>
  <text x="1040" y="498" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">certifies; same allocation fails at n = 1440</text>

  <rect x="1014" y="528" width="504" height="72" rx="18" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="1040" y="559" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#3730a3">Uniform seven-cell allocation</text>
  <text x="1482" y="559" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">n = 1632</text>
  <text x="1040" y="586" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">alpha_x = 1/140 for all seven cells</text>

  <rect x="1014" y="616" width="504" height="72" rx="18" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="1040" y="647" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#374151">Direct P77 sixteen-cell route</text>
  <text x="1482" y="647" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">n = 1872</text>
  <text x="1040" y="674" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">uses the exact P92 distance 1/24</text>

  <rect x="48" y="752" width="1504" height="196" rx="28" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="82" y="798" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#111827">What changed from P92</text>
  <text x="82" y="840" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#374151">P92: exact population distance and nonlinear sign obstruction.</text>
  <text x="82" y="876" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#374151">P93: simultaneous finite-data intervals that can force the forbidden sign pattern with controlled familywise error.</text>
  <text x="82" y="922" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6b7280">Scientific boundary: rejecting the declared P75 family does not identify consciousness, establish nonphysicality, or close the physical-to-experiential bridge.</text>
</svg>
