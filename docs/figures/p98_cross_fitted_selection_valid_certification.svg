<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">P98 Cross-Fitted Selection-Valid Certification</title>
  <desc id="desc">What this figure shows: P98 rotates the P96 selection-versus-certification separation across mutually independent data blocks. In each fold, the plan is learned only from the other blocks, frozen, and then certified on the excluded block. Fold certificates may be statistically dependent because their selection information overlaps, so a fold-level union bound, not an independence product, gives simultaneous validity. In the balanced two-fold, two-regime, dependence-range-one checkpoint, the local crossing is 4045 observations per regime and the first denominator-24 exact replication is 4056, giving 16180 and 16224 unique observations across the two certification blocks. Main takeaway: every independent block can contribute once to certification while being reused as selection information elsewhere, provided there is no own-fold leakage and all fold budgets are included in the global error budget. Scientific status: conditional theorem under genuine block independence, P94/P95 within-fold assumptions, and exact error-budget accounting. It does not validate arbitrary splitting of one dependent stream, model acceptance, consciousness identification, nonphysicality, or completion of the physical-to-experiential bridge.</desc>
  <rect width="1400" height="900" fill="#f8fafc"/>
  <rect x="40" y="35" width="1320" height="830" rx="24" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>

  <text x="80" y="92" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">P98 Cross-Fitted Selection-Valid Certification</text>
  <text x="80" y="128" font-family="Arial, sans-serif" font-size="19" fill="#334155">Rotate independent holdouts so every block contributes to certification</text>

  <rect x="80" y="175" width="560" height="290" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="218" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">Fold 1</text>
  <rect x="115" y="252" width="205" height="105" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="287" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Block B</text>
  <text x="145" y="318" font-family="Arial, sans-serif" font-size="16" fill="#334155">selection information</text>
  <text x="145" y="342" font-family="Arial, sans-serif" font-size="16" fill="#334155">choose and freeze plan</text>
  <path d="M 330 305 L 402 305" stroke="#0f172a" stroke-width="4" fill="none"/>
  <polygon points="402,305 383,294 383,316" fill="#0f172a"/>
  <rect x="412" y="252" width="190" height="105" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="442" y="287" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#065f46">Block A</text>
  <text x="442" y="318" font-family="Arial, sans-serif" font-size="16" fill="#334155">certification only</text>
  <text x="442" y="342" font-family="Arial, sans-serif" font-size="16" fill="#334155">apply P96/P95/P94</text>
  <text x="110" y="410" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">Block A is excluded from Fold 1 plan selection.</text>

  <rect x="760" y="175" width="560" height="290" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="790" y="218" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#5b21b6">Fold 2</text>
  <rect x="795" y="252" width="205" height="105" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="825" y="287" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#5b21b6">Block A</text>
  <text x="825" y="318" font-family="Arial, sans-serif" font-size="16" fill="#334155">selection information</text>
  <text x="825" y="342" font-family="Arial, sans-serif" font-size="16" fill="#334155">choose and freeze plan</text>
  <path d="M 1010 305 L 1082 305" stroke="#0f172a" stroke-width="4" fill="none"/>
  <polygon points="1082,305 1063,294 1063,316" fill="#0f172a"/>
  <rect x="1092" y="252" width="190" height="105" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1122" y="287" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#065f46">Block B</text>
  <text x="1122" y="318" font-family="Arial, sans-serif" font-size="16" fill="#334155">certification only</text>
  <text x="1122" y="342" font-family="Arial, sans-serif" font-size="16" fill="#334155">apply P96/P95/P94</text>
  <text x="790" y="410" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#5b21b6">Block B is excluded from Fold 2 plan selection.</text>

  <rect x="80" y="510" width="1240" height="145" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="110" y="552" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Simultaneous fold guarantee</text>
  <text x="110" y="592" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Each fold: Pr(fold certificate fails) &lt;= beta_k after conditioning on its selection information.</text>
  <text x="110" y="626" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Across folds: sum_k beta_k &lt;= alpha implies simultaneous confidence &gt;= 1 - alpha. Fold independence is not required.</text>

  <rect x="80" y="695" width="600" height="120" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="110" y="735" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#3730a3">Balanced 95 percent checkpoint</text>
  <text x="110" y="768" font-family="Arial, sans-serif" font-size="16" fill="#312e81">K=2 folds, B=2 regimes, m=1, local alpha=1/80</text>
  <text x="110" y="794" font-family="Arial, sans-serif" font-size="16" fill="#312e81">4045 per regime; exact 4056; unique totals 16180 / 16224</text>

  <rect x="710" y="695" width="610" height="120" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="740" y="735" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9a3412">Scientific boundary</text>
  <text x="740" y="768" font-family="Arial, sans-serif" font-size="16" fill="#7c2d12">Requires genuine block independence and no own-fold leakage.</text>
  <text x="740" y="794" font-family="Arial, sans-serif" font-size="16" fill="#7c2d12">No model acceptance, consciousness identification, nonphysicality,</text>
  <text x="740" y="818" font-family="Arial, sans-serif" font-size="16" fill="#7c2d12">or completed physical-to-experiential bridge is established.</text>
</svg>
