<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P75 target-model adequacy and four-view overidentification</title>
  <desc id="desc">What this figure shows: Figure 10. P75 target-model adequacy theorem. Three binary views are generically just-identified under the declared latent model. A fourth view creates six generic overidentifying degrees of freedom and observable adequacy obligations. Passing means compatibility with the declared model, not proof that the model is uniquely true, and not identification of the latent state with consciousness. How to read it: follow only the labeled arrows, axes, panels, set relations, or inequalities shown in the visual and interpret them using the adjacent research text. Main takeaway: the figure summarizes the stated mathematical or scientific dependency; visual proximity alone does not add a claim. Scientific status: Reader-facing research figure; formal status is controlled by the linked proof or source record.</desc>
  <rect x="0" y="0" width="1200" height="760" fill="#f7fafc"/>
  <text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#102a43">P75 Target-Model Adequacy and Four-View Overidentification</text>
  <text x="60" y="92" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#486581">Identifiability is not the same as validating the target-measurement model</text>

  <rect x="55" y="125" width="520" height="245" rx="18" fill="#ffffff" stroke="#9fb3c8" stroke-width="2"/>
  <text x="85" y="165" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334e68">Three binary views</text>
  <text x="85" y="202" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243b53">Observed law: 2^3 - 1 = 7 degrees</text>
  <text x="85" y="234" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243b53">Latent model: 1 + 2(3) = 7 parameters</text>
  <rect x="85" y="260" width="455" height="54" rx="12" fill="#e8f1fb"/>
  <text x="105" y="294" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1f5f99">7 = 7  |  generically just-identified</text>
  <text x="85" y="342" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#627d98">P73 can recover parameters on the admissible nondegenerate region.</text>
  <text x="85" y="365" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#9b2c2c">But fit alone leaves no generic equality reserve for adequacy testing.</text>

  <rect x="625" y="125" width="520" height="245" rx="18" fill="#ffffff" stroke="#7fb7a4" stroke-width="2"/>
  <text x="655" y="165" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#285e61">Four binary views</text>
  <text x="655" y="202" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243b53">Observed law: 2^4 - 1 = 15 degrees</text>
  <text x="655" y="234" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243b53">Latent model: 1 + 2(4) = 9 parameters</text>
  <rect x="655" y="260" width="455" height="54" rx="12" fill="#e3f8f0"/>
  <text x="675" y="294" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#147d64">15 - 9 = 6 overidentifying degrees</text>
  <text x="655" y="342" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#486581">The fourth view creates independent observable restrictions.</text>
  <text x="655" y="365" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#486581">The declared target model can now be falsified rather than only fitted.</text>

  <line x1="315" y1="397" x2="315" y2="430" stroke="#829ab1" stroke-width="3"/>
  <line x1="885" y1="397" x2="885" y2="430" stroke="#829ab1" stroke-width="3"/>

  <rect x="55" y="430" width="1090" height="208" rx="18" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/>
  <text x="85" y="468" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#102a43">Observable P75 adequacy obligations</text>

  <rect x="85" y="493" width="310" height="105" rx="12" fill="#f0f4f8"/>
  <text x="105" y="523" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334e68">1. Covariance tetrads</text>
  <text x="105" y="553" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#243b53">C12 C34 = C13 C24</text>
  <text x="105" y="579" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#243b53">= C14 C23</text>

  <rect x="445" y="493" width="310" height="105" rx="12" fill="#f0f4f8"/>
  <text x="465" y="523" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334e68">2. Cross-triple agreement</text>
  <text x="465" y="553" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#243b53">q123 = q124 = q134 = q234</text>
  <text x="465" y="579" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#486581">qijk = Mijk^2 / (Cij Cik Cjk)</text>

  <rect x="805" y="493" width="310" height="105" rx="12" fill="#f0f4f8"/>
  <text x="825" y="523" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334e68">3. Fourth-moment consistency</text>
  <text x="825" y="553" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#243b53">M1234 = (1 + q) C12 C34</text>
  <text x="825" y="579" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#486581">and equivalent covariance pairings</text>

  <rect x="185" y="654" width="830" height="66" rx="14" fill="#fff5f5" stroke="#e6a3a3" stroke-width="2"/>
  <text x="215" y="682" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#9b2c2c">Full-law audit:</text>
  <text x="340" y="682" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243b53">recover an anchor triple, infer view 4, reconstruct all 16 cells</text>
  <text x="215" y="707" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#627d98">Passing means model compatibility, not truth. P75 does not identify the latent state with consciousness.</text>
</svg>
