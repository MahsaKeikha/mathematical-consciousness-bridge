<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">P63 exact heterogeneous-cost integer calibration</title>
  <desc id="desc">What this figure shows: P63 solves the declared heterogeneous-cost whole-measurement calibration problem exactly when transition costs and the total budget are positive integers. It replaces the equal-cost P61 greedy argument with an exact-spend Bellman dynamic program because unequal costs destroy the exchange proof behind the equal-unit rule. How to read it: move left to right across the top row from the failure of the P61 greedy argument to the exact integer problem and its exact-spend Bellman state. The two attached center arrows feed the exact Bellman recurrence and final hard-budget optimum. From that theorem panel, follow the three lower branches to exact gcd cost compression, pseudo-polynomial complexity, and the P62 continuous lower bound. Main takeaway: P63 is an exact unrestricted integer solver for the declared integer-cost separable calibration problem; its straightforward running time is pseudo-polynomial in the compressed numeric budget, which by itself is not an NP-hardness claim. Scientific status: Discrete optimization theorem for the declared calibration surrogate. It does not validate the uncertainty model as an experiential law, identify a calibration variable with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Arial,sans-serif;fill:#475569}
      .head{font:700 18px Arial,sans-serif;fill:#0f172a}
      .copy{font:400 15px Arial,sans-serif;fill:#334155}
      .small{font:400 14px Arial,sans-serif;fill:#475569}
      .eq{font:600 16px Georgia,'Times New Roman',serif;fill:#0f172a}
      .strong{font:700 17px Arial,sans-serif;fill:#0f172a}
      .route{font:700 13px Arial,sans-serif;fill:#475569}
      .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="1000" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P63  Exact heterogeneous-cost integer calibration</text>
  <text x="60" y="90" class="subtitle">Unequal costs require an exact discrete solver; P61's equal-unit greedy proof does not carry over.</text>

  <g id="block-greedy" data-x="55" data-y="130" data-w="330" data-h="220">
    <rect x="55" y="130" width="330" height="220" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="80" y="168" class="head">1. Why P61 cannot be reused</text>
    <text x="80" y="207" class="eq">one increment may cost 2</text>
    <text x="80" y="235" class="eq">another may cost 7</text>
    <text x="80" y="274" class="copy">Raw marginal gain is not an</text>
    <text x="80" y="298" class="copy">equal-resource comparison.</text>
    <text x="80" y="322" class="small">Gain-per-cost ranking also lacks</text>
    <text x="80" y="343" class="small">a proved P61 exchange rule.</text>
  </g>

  <g id="block-problem" data-x="435" data-y="130" data-w="330" data-h="220">
    <rect x="435" y="130" width="330" height="220" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="460" y="168" class="head">2. Exact integer problem</text>
    <text x="460" y="207" class="eq">kₑ ∈ {1,2,3,...}</text>
    <text x="460" y="239" class="eq">Σₑ cₑkₑ ≤ B</text>
    <text x="460" y="276" class="copy">Minimize Σₑ bₑ / √kₑ.</text>
    <text x="460" y="310" class="small">Feasible exactly when</text>
    <text x="460" y="334" class="small">B ≥ Σₑ cₑ.</text>
  </g>

  <g id="block-state" data-x="815" data-y="130" data-w="330" data-h="220">
    <rect x="815" y="130" width="330" height="220" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="840" y="168" class="head">3. Exact-spend state</text>
    <text x="840" y="208" class="strong">Fᵢ(s)</text>
    <text x="840" y="244" class="copy">Best uncertainty for the first</text>
    <text x="840" y="268" class="copy">i edges at exact spend s.</text>
    <text x="840" y="302" class="eq">F₀(0)=0</text>
    <text x="840" y="331" class="small">F₀(s)=+∞ for s &gt; 0.</text>
  </g>

  <path id="arrow-1" class="arrow" d="M385 240 H435" data-source="block-greedy" data-target="block-problem"/>
  <path id="arrow-2" class="arrow" d="M765 240 H815" data-source="block-problem" data-target="block-state"/>

  <text x="600" y="390" class="route" text-anchor="middle">exact Bellman optimization over the integer cost lattice</text>

  <g id="block-bellman" data-x="120" data-y="410" data-w="960" data-h="220">
    <rect x="120" y="410" width="960" height="220" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="600" y="448" text-anchor="middle" class="head">4. Exact Bellman recurrence and hard-budget optimum</text>
    <text x="600" y="487" text-anchor="middle" class="eq">Fᵢ(s) = min over k ≥ 1, cᵢk ≤ s of</text>
    <text x="600" y="520" text-anchor="middle" class="eq">[ Fᵢ₋₁(s - cᵢk) + bᵢ / √k ]</text>
    <text x="600" y="560" text-anchor="middle" class="strong">U*int(B) = min over 0 ≤ s ≤ B of Fₘ(s)</text>
    <text x="600" y="596" text-anchor="middle" class="copy">Predecessor states reconstruct a globally optimal whole-measurement allocation.</text>
  </g>

  <path id="arrow-3" class="arrow" d="M600 350 V410" data-source="block-problem" data-target="block-bellman"/>
  <path id="arrow-4" class="arrow" d="M980 350 V380 H900 V410" data-source="block-state" data-target="block-bellman"/>

  <g id="block-gcd" data-x="55" data-y="690" data-w="330" data-h="170">
    <rect x="55" y="690" width="330" height="170" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="728" class="head">5. Exact gcd compression</text>
    <text x="80" y="767" class="eq">g = gcd{cₑ}</text>
    <text x="80" y="797" class="eq">B' = floor(B/g)</text>
    <text x="80" y="830" class="small">A remainder below g is unusable</text>
    <text x="80" y="851" class="small">on the declared cost lattice.</text>
  </g>

  <g id="block-complexity" data-x="435" data-y="690" data-w="330" data-h="170">
    <rect x="435" y="690" width="330" height="170" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="460" y="728" class="head">6. Exact computational cost</text>
    <text x="460" y="770" class="strong">O(m B'^2)</text>
    <text x="460" y="801" class="small">Pseudo-polynomial in numeric B'.</text>
    <text x="460" y="826" class="small">O(B') working objective memory.</text>
    <text x="460" y="851" class="small">Not an NP-hardness claim by itself.</text>
  </g>

  <g id="block-benchmark" data-x="815" data-y="690" data-w="330" data-h="170">
    <rect x="815" y="690" width="330" height="170" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="840" y="728" class="head">7. P62 lower benchmark</text>
    <text x="840" y="770" class="strong">U*cont(B) ≤ U*int(B)</text>
    <text x="840" y="806" class="small">Additive and multiplicative gaps</text>
    <text x="840" y="829" class="small">are instance-specific certificates.</text>
    <text x="840" y="852" class="small">No universal small-gap claim is made.</text>
  </g>

  <path id="arrow-5" class="arrow" d="M300 630 V660 H220 V690" data-source="block-bellman" data-target="block-gcd"/>
  <path id="arrow-6" class="arrow" d="M600 630 V690" data-source="block-bellman" data-target="block-complexity"/>
  <path id="arrow-7" class="arrow" d="M900 630 V660 H980 V690" data-source="block-bellman" data-target="block-benchmark"/>

  <g id="block-boundary" data-x="90" data-y="870" data-w="1020" data-h="125">
    <rect x="90" y="870" width="1020" height="125" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="118" y="898" class="head">Exactness and scientific boundary</text>
    <text x="118" y="922" class="small">P63 is exact for the declared integer-cost separable calibration problem.</text>
    <text x="118" y="944" class="small">Unspent budget is allowed when the cost lattice cannot fund another admissible increment.</text>
    <text x="118" y="966" class="small">It does not validate the uncertainty model or identify a calibration variable with consciousness.</text>
    <text x="118" y="988" class="small">It does not establish a physical-to-experiential bridge or imply quantum incompleteness.</text>
  </g>
</svg>
