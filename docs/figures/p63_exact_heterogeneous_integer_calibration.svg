<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P63 exact heterogeneous-cost integer calibration</title>
  <desc id="desc">A visual showing why unequal-cost integer calibration needs dynamic programming rather than the equal-cost greedy rule, together with the Bellman recurrence and continuous lower bound.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/></filter>
    <style>
      .h1{font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:400 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}.bt{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}.tx{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155}.math{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f172a}.small{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}.arrow{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="h1">P63: Exact whole-measurement allocation when costs differ</text>
  <text x="60" y="88" class="sub">Unequal costs break the P61 equal-unit greedy proof, so P63 solves the discrete problem exactly with Bellman dynamic programming.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="135" width="310" height="165" rx="18" fill="#fff7ed" stroke="#f97316"/>
    <text x="82" y="172" class="bt">Why P61 is not enough</text>
    <text x="82" y="207" class="math">increment A costs 2</text>
    <text x="82" y="235" class="math">increment B costs 7</text>
    <text x="82" y="265" class="tx">Largest raw gain is no longer a fair</text>
    <text x="82" y="287" class="tx">comparison between interchangeable choices.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="445" y="135" width="310" height="165" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="472" y="172" class="bt">Integer experiment</text>
    <text x="472" y="207" class="math">kₑ ∈ {1,2,3,…}</text>
    <text x="472" y="235" class="math">Σ cₑ kₑ ≤ B</text>
    <text x="472" y="265" class="tx">Whole observations only, with a hard</text>
    <text x="472" y="287" class="tx">time / money / capacity budget.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="835" y="135" width="310" height="165" rx="18" fill="#eef2ff" stroke="#6366f1"/>
    <text x="862" y="172" class="bt">State of the exact solver</text>
    <text x="862" y="207" class="math">Fᵢ(s)</text>
    <text x="862" y="235" class="tx">Best uncertainty using first i edges</text>
    <text x="862" y="260" class="tx">with exactly s units of cost spent.</text>
    <text x="862" y="287" class="small">Every feasible integer allocation maps to a state path.</text>
  </g>

  <path d="M365 218 L445 218" class="arrow"/>
  <path d="M755 218 L835 218" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="145" y="380" width="910" height="145" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
    <text x="180" y="417" class="bt">Exact Bellman recurrence</text>
    <text x="180" y="458" class="math">Fᵢ(s) = minₖ≥1 [ Fᵢ₋₁(s − cᵢk) + bᵢ/√k ]</text>
    <text x="180" y="493" class="math">U*int(B) = min₀≤s≤B Fₘ(s)</text>
    <text x="180" y="514" class="small">Predecessor states reconstruct the globally optimal whole-measurement allocation.</text>
  </g>

  <path d="M990 300 C940 345 780 355 720 380" class="arrow"/>
  <path d="M600 300 L600 380" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="90" y="590" width="470" height="120" rx="18" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="118" y="626" class="bt">Exact computational guarantee</text>
    <text x="118" y="659" class="math">O(m B′²) straightforward time</text>
    <text x="118" y="686" class="tx">B′ uses exact gcd cost compression.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="590" width="470" height="120" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="668" y="626" class="bt">Continuous benchmark from P62</text>
    <text x="668" y="659" class="math">U*cont(B) ≤ U*int(B)</text>
    <text x="668" y="686" class="tx">The exact integrality gap is reported per instance.</text>
  </g>

  <path d="M420 525 C400 555 350 565 325 590" class="arrow"/>
  <path d="M780 525 C800 555 850 565 875 590" class="arrow"/>
  <text x="60" y="746" class="small">Boundary: P63 solves the declared separable calibration surrogate for integer costs; it makes no claim about consciousness or quantum incompleteness.</text>
</svg>
