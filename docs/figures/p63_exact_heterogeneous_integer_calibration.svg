<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Proposition 63: exact heterogeneous-cost integer transition calibration</title>
  <desc id="desc">What this figure shows: Proved exact pseudo-polynomial discrete optimization theorem. P62 gives the unique continuous transition-calibration allocation when different transition measurements have different positive costs. P63 converts that model to executable whole-measurement counts when costs and the total budget are positive integers.. Visible guideposts include: Unequal costs break the P61 equal-unit greedy proof, so P63 solves the discrete problem exactly with Bellman dynamic programming.; Why P61 is not enough; increment A costs 2; increment B costs 7; Raw marginal gain is no longer; a fair comparison across choices.. How to read it: follow the diagram in the direction of its arrows and use each box, panel, inequality, or highlighted region only with the meaning printed beside it. Main takeaway: this is the visual companion to Proposition 63; the proposition document supplies the assumptions, proof, and exact scope of every implication. Scientific status: Proposition 63 theorem/certificate visual. It is not independent empirical evidence and does not, by itself, identify a physical or latent variable with consciousness.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#334155"/>
    </marker>
    <style>
      .h1{font:700 40px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .sub{font:400 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
      .bt{font:700 25px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .tx{font:400 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155}
      .math{font:600 20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f172a}
      .small{font:400 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}
      .arrow{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
      .card{stroke-width:2}
    </style>
  </defs>

  <rect width="1800" height="1050" rx="28" fill="#f8fafc"/>
  <text x="70" y="70" class="h1">P63: Exact whole-measurement allocation when costs differ</text>
  <text x="70" y="112" class="sub">Unequal costs break the P61 equal-unit greedy proof, so P63 solves the discrete problem exactly with Bellman dynamic programming.</text>

  <g id="p63-why" data-qa-block="true" data-x="70" data-y="175" data-width="500" data-height="245">
    <rect class="card" x="70" y="175" width="500" height="245" rx="22" fill="#fff7ed" stroke="#f97316"/>
    <text x="115" y="222" class="bt">Why P61 is not enough</text>
    <text x="115" y="270" class="math">increment A costs 2</text>
    <text x="115" y="305" class="math">increment B costs 7</text>
    <text x="115" y="352" class="tx">Raw marginal gain is no longer</text>
    <text x="115" y="384" class="tx">a fair comparison across choices.</text>
  </g>

  <g id="p63-experiment" data-qa-block="true" data-x="650" data-y="175" data-width="500" data-height="245">
    <rect class="card" x="650" y="175" width="500" height="245" rx="22" fill="#ffffff" stroke="#94a3b8"/>
    <text x="695" y="222" class="bt">Integer experiment</text>
    <text x="695" y="270" class="math">kₑ ∈ {1,2,3,...}</text>
    <text x="695" y="305" class="math">Σ cₑ kₑ ≤ B</text>
    <text x="695" y="352" class="tx">Whole observations only, under</text>
    <text x="695" y="384" class="tx">a hard resource budget.</text>
  </g>

  <g id="p63-state" data-qa-block="true" data-x="1230" data-y="175" data-width="500" data-height="245">
    <rect class="card" x="1230" y="175" width="500" height="245" rx="22" fill="#eef2ff" stroke="#6366f1"/>
    <text x="1275" y="222" class="bt">State of the exact solver</text>
    <text x="1275" y="270" class="math">Fᵢ(s)</text>
    <text x="1275" y="307" class="tx">Best uncertainty using</text>
    <text x="1275" y="337" class="tx">the first i edges with exactly</text>
    <text x="1275" y="367" class="tx">s units of cost spent.</text>
    <text x="1275" y="388" class="small">Allocations map to state paths.</text>
  </g>

  <path d="M570 297.5 H638" class="arrow" data-from="p63-why" data-to="p63-experiment"/>
  <path d="M1150 297.5 H1218" class="arrow" data-from="p63-experiment" data-to="p63-state"/>

  <g id="p63-bellman" data-qa-block="true" data-x="245" data-y="515" data-width="1310" data-height="255">
    <rect class="card" x="245" y="515" width="1310" height="255" rx="24" fill="#ecfdf5" stroke="#10b981"/>
    <text x="295" y="565" class="bt">Exact Bellman recurrence</text>
    <text x="295" y="625" class="math">Fᵢ(s) = min over k ≥ 1 of [ Fᵢ₋₁(s - cᵢk) + bᵢ/√k ]</text>
    <text x="295" y="675" class="math">U*int(B) = min over 0 ≤ s ≤ B of Fₘ(s)</text>
    <text x="295" y="725" class="small">Predecessor states reconstruct the globally optimal whole-measurement allocation.</text>
  </g>

  <path d="M900 420 V503" class="arrow" data-from="p63-experiment" data-to="p63-bellman"/>
  <path d="M1480 420 C1450 475 1325 485 1240 515" class="arrow" data-from="p63-state" data-to="p63-bellman"/>

  <g id="p63-complexity" data-qa-block="true" data-x="120" data-y="845" data-width="710" data-height="145">
    <rect class="card" x="120" y="845" width="710" height="145" rx="20" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="165" y="892" class="bt">Exact computational guarantee</text>
    <text x="165" y="928" class="math">O(m B′²) straightforward time</text>
    <text x="165" y="958" class="tx">B′ uses exact gcd cost compression.</text>
  </g>

  <g id="p63-benchmark" data-qa-block="true" data-x="970" data-y="845" data-width="710" data-height="145">
    <rect class="card" x="970" y="845" width="710" height="145" rx="20" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1015" y="892" class="bt">Continuous benchmark from P62</text>
    <text x="1015" y="928" class="math">U*cont(B) ≤ U*int(B)</text>
    <text x="1015" y="958" class="tx">Exact integrality gap reported per instance.</text>
  </g>

  <path d="M560 770 C520 815 475 820 475 833" class="arrow" data-from="p63-bellman" data-to="p63-complexity"/>
  <path d="M1240 770 C1280 815 1325 820 1325 833" class="arrow" data-from="p63-bellman" data-to="p63-benchmark"/>

  <text x="900" y="1025" text-anchor="middle" class="small">Boundary: P63 solves the declared separable calibration surrogate for integer costs. It makes no claim about consciousness or quantum incompleteness.</text>
</svg>
