<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Equation-to-evidence map for consciousness research</title>
  <desc id="desc">A structured map showing equations, physical meanings, empirical interfaces, and evidential status across information theory, causal intervention, temporal dynamics, thermodynamics, and bridge theory.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 40px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .head{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .body{font:400 13.5px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .eq{font:600 15px Georgia,'Times New Roman',serif;fill:#0f172a}
      .tag{font:700 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.5px}
      .arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1050" fill="#ffffff"/>
  <text x="75" y="64" class="title">Equation → Physical Meaning → Measurement → Evidence</text>
  <text x="75" y="99" class="subtitle">The repository keeps mathematical validity, physical interpretation, empirical measurement, and consciousness inference as separate layers.</text>

  <text x="75" y="148" class="head">Equation family</text>
  <text x="505" y="148" class="head">Physical meaning</text>
  <text x="935" y="148" class="head">Measurement interface</text>
  <text x="1365" y="148" class="head">Research status</text>

  <!-- Row 1 -->
  <rect x="75" y="172" width="380" height="135" rx="14" fill="#fffdf5" stroke="#ca8a04"/>
  <text x="101" y="211" class="eq">I(X;Y)=Dₖₗ(PXY ‖ PX PY)</text>
  <text x="101" y="248" class="body">Statistical dependence / shared information</text>
  <text x="101" y="278" class="body">Shannon; Cover &amp; Thomas</text>
  <rect x="505" y="172" width="380" height="135" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="531" y="211" class="body">Quantifies dependence between variables;</text>
  <text x="531" y="234" class="body">does not specify causal direction.</text>
  <text x="531" y="270" class="eq">information ≠ experience</text>
  <rect x="935" y="172" width="380" height="135" rx="14" fill="#f5fcf8" stroke="#059669"/>
  <text x="961" y="211" class="body">EEG/fMRI time series, network variables,</text>
  <text x="961" y="234" class="body">partial-information decomposition.</text>
  <text x="961" y="270" class="body">Luppi et al. 2024</text>
  <rect x="1365" y="172" width="360" height="135" rx="14" fill="#f7fbff" stroke="#3b82f6"/>
  <text x="1391" y="211" class="body">Mathematics: established</text>
  <text x="1391" y="234" class="body">Consciousness relation: empirical / theory-specific</text>
  <rect x="1391" y="260" width="160" height="25" rx="7" fill="#dbeafe"/><text x="1408" y="277" class="tag" fill="#1d4ed8">FOUNDATIONAL TOOL</text>

  <!-- Row 2 -->
  <rect x="75" y="332" width="380" height="135" rx="14" fill="#f5fcfd" stroke="#0891b2"/>
  <text x="101" y="371" class="eq">dτ(u,v)=‖Pᵤ,τ−Pᵥ,τ‖TV</text>
  <text x="101" y="408" class="body">Intervention-response differentiation</text>
  <text x="101" y="438" class="body">Pearl; repository P11</text>
  <rect x="505" y="332" width="380" height="135" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="531" y="371" class="body">Measures how controlled perturbations separate</text>
  <text x="531" y="394" class="body">future physical response laws.</text>
  <text x="531" y="430" class="eq">do(u) distinguishes intervention from correlation</text>
  <rect x="935" y="332" width="380" height="135" rx="14" fill="#fffaf7" stroke="#ea580c"/>
  <text x="961" y="371" class="body">TMS-EEG, stimulation, anesthesia transitions,</text>
  <text x="961" y="394" class="body">controlled artificial-system perturbations.</text>
  <text x="961" y="430" class="body">Casali et al. 2013</text>
  <rect x="1365" y="332" width="360" height="135" rx="14" fill="#f5fcf8" stroke="#059669"/>
  <text x="1391" y="371" class="body">Physical candidate: theorem-level construction</text>
  <text x="1391" y="394" class="body">Bridge relation: under investigation</text>
  <rect x="1391" y="420" width="155" height="25" rx="7" fill="#d1fae5"/><text x="1408" y="437" class="tag" fill="#047857">REPOSITORY CORE</text>

  <!-- Row 3 -->
  <rect x="75" y="492" width="380" height="135" rx="14" fill="#faf8ff" stroke="#7c3aed"/>
  <text x="101" y="531" class="eq">V = Σt D̄([ct],[ct+1])</text>
  <text x="101" y="568" class="body">Representation-invariant temporal variation</text>
  <text x="101" y="598" class="body">repository P14-P15</text>
  <rect x="505" y="492" width="380" height="135" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="531" y="531" class="body">Separates endpoint equality from nontrivial</text>
  <text x="531" y="554" class="body">intermediate physical trajectories.</text>
  <text x="531" y="590" class="eq">path property ≠ endpoint score</text>
  <rect x="935" y="492" width="380" height="135" rx="14" fill="#f5fcf8" stroke="#059669"/>
  <text x="961" y="531" class="body">Time-resolved neural, physiological, or artificial</text>
  <text x="961" y="554" class="body">system response fingerprints with error bars.</text>
  <text x="961" y="590" class="body">Anesthesia / sleep / recovery studies</text>
  <rect x="1365" y="492" width="360" height="135" rx="14" fill="#f5fcf8" stroke="#059669"/>
  <text x="1391" y="531" class="body">Temporal mathematics: proved</text>
  <text x="1391" y="554" class="body">Experiential interpretation: open</text>
  <rect x="1391" y="580" width="170" height="25" rx="7" fill="#d1fae5"/><text x="1408" y="597" class="tag" fill="#047857">CERTIFIED PHYSICS</text>

  <!-- Row 4 -->
  <rect x="75" y="652" width="380" height="135" rx="14" fill="#fff8f9" stroke="#e11d48"/>
  <text x="101" y="691" class="eq">Werase ≥ kBT ln 2</text>
  <text x="101" y="728" class="body">Lower bound for logically irreversible erasure</text>
  <text x="101" y="758" class="body">Landauer 1961</text>
  <rect x="505" y="652" width="380" height="135" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="531" y="691" class="body">Connects information processing to energetic</text>
  <text x="531" y="714" class="body">cost and thermodynamic irreversibility.</text>
  <text x="531" y="750" class="eq">Σentropy ≥ 0</text>
  <rect x="935" y="652" width="380" height="135" rx="14" fill="#f7fbff" stroke="#3b82f6"/>
  <text x="961" y="691" class="body">Energy dissipation, metabolism, temperature,</text>
  <text x="961" y="714" class="body">nonequilibrium fluxes, computational hardware.</text>
  <text x="961" y="750" class="body">Seifert 2012</text>
  <rect x="1365" y="652" width="360" height="135" rx="14" fill="#fffdf5" stroke="#ca8a04"/>
  <text x="1391" y="691" class="body">Physics: established</text>
  <text x="1391" y="714" class="body">Consciousness-specific necessity: not established</text>
  <rect x="1391" y="740" width="200" height="25" rx="7" fill="#fef3c7"/><text x="1408" y="757" class="tag" fill="#92400e">CONSTRAINT, NOT BRIDGE</text>

  <!-- Row 5 -->
  <rect x="75" y="812" width="380" height="135" rx="14" fill="#f8fafc" stroke="#64748b"/>
  <text x="101" y="851" class="eq">B̄ : 𝒬P → 𝒬E</text>
  <text x="101" y="888" class="body">Physical-to-experiential assignment</text>
  <text x="101" y="918" class="body">Kleiner; repository P1-P17</text>
  <rect x="505" y="812" width="380" height="135" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="531" y="851" class="body">The unresolved bridge: which physical invariants,</text>
  <text x="531" y="874" class="body">if any, correspond to experiential invariants?</text>
  <text x="531" y="910" class="eq">complete + identifiable + falsifiable</text>
  <rect x="935" y="812" width="380" height="135" rx="14" fill="#fffaf7" stroke="#ea580c"/>
  <text x="961" y="851" class="body">Cross-theory adversarial protocols, clinical states,</text>
  <text x="961" y="874" class="body">cross-substrate and counterexample programs.</text>
  <text x="961" y="910" class="body">Cogitate 2025; theory-family comparisons</text>
  <rect x="1365" y="812" width="360" height="135" rx="14" fill="#fff8f9" stroke="#e11d48"/>
  <text x="1391" y="851" class="body">Formal target: explicit</text>
  <text x="1391" y="874" class="body">Scientific solution: active research problem</text>
  <rect x="1391" y="900" width="145" height="25" rx="7" fill="#ffe4e6"/><text x="1408" y="917" class="tag" fill="#be123c">OPEN FRONTIER</text>

  <path class="arrow" d="M455 239 H493"/><path class="arrow" d="M885 239 H923"/><path class="arrow" d="M1315 239 H1353"/>
  <path class="arrow" d="M455 399 H493"/><path class="arrow" d="M885 399 H923"/><path class="arrow" d="M1315 399 H1353"/>
  <path class="arrow" d="M455 559 H493"/><path class="arrow" d="M885 559 H923"/><path class="arrow" d="M1315 559 H1353"/>
  <path class="arrow" d="M455 719 H493"/><path class="arrow" d="M885 719 H923"/><path class="arrow" d="M1315 719 H1353"/>
  <path class="arrow" d="M455 879 H493"/><path class="arrow" d="M885 879 H923"/><path class="arrow" d="M1315 879 H1353"/>

  <text x="75" y="1010" class="subtitle">Rule of interpretation: a mathematically valid equation becomes evidence about consciousness only through a declared measurement model and a separately justified bridge hypothesis.</text>
</svg>