<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">P54 metric switching-cost residual scheduling</title>
  <desc id="desc">What this figure shows: P54 proves that when preparation-switching costs form a declared finite metric, repeated alternation between positive-demand preparations is never required for an optimal deterministic residual schedule. Any expanded feasible schedule can be converted to its first-visit block order without increasing switching cost, so the exact optimum separates into fixed acquisition burden plus a shortest Hamiltonian path through the positive-demand preparations. How to read it: the three upper cards specify the residual workload, the metric switching geometry, and an arbitrary expanded schedule. Their attached arrows feed the central batching theorem, where repeated visits are deleted and shortcut by triangle inequality, then each retained preparation is expanded into one contiguous zero-self-cost block. The lower cards show the exact Hamiltonian-path reduction, the Held-Karp finite-instance audit, and the operational interpretation. Main takeaway: residual magnitudes determine acquisition burden while support geometry and the declared metric determine switching burden; the metric assumption is essential to the batching reduction. Scientific status: Deterministic experimental scheduling theorem conditional on a declared residual-demand vector and valid finite metric. It does not establish statistical minimaxity of upstream thresholds, validate pruning, identify any route or scheduling quantity with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Arial,sans-serif;fill:#475569}
      .head{font:700 18px Arial,sans-serif;fill:#0f172a}
      .copy{font:400 15px Arial,sans-serif;fill:#334155}
      .small{font:400 13.5px Arial,sans-serif;fill:#475569}
      .eq{font:600 15px Georgia,'Times New Roman',serif;fill:#0f172a}
      .strong{font:700 16px Arial,sans-serif;fill:#0f172a}
      .route{font:700 13px Arial,sans-serif;fill:#475569}
      .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="1000" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P54  Metric switching-cost residual scheduling</text>
  <text x="60" y="90" class="subtitle">A declared metric turns repeated preparation switching into an exact block-routing problem with fixed acquisition burden.</text>

  <g id="block-residual" data-x="55" data-y="130" data-w="330" data-h="185">
    <rect x="55" y="130" width="330" height="185" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="168" class="head">1. Residual workload</text>
    <text x="80" y="205" class="strong">rᵢ ∈ Z≥0, V+={i:rᵢ&gt;0}</text>
    <text x="80" y="239" class="eq">R=Σᵢrᵢ, fixed acquisition=aR</text>
    <text x="80" y="271" class="copy">Only switching order is optimized.</text>
    <text x="80" y="296" class="small">Residual demands are declared inputs.</text>
  </g>

  <g id="block-metric" data-x="435" data-y="130" data-w="330" data-h="185">
    <rect x="435" y="130" width="330" height="185" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="460" y="168" class="head">2. Switching geometry</text>
    <text x="460" y="205" class="strong">finite metric c on setup points</text>
    <text x="460" y="238" class="eq">c(u,u)=0, c(u,v)=c(v,u)</text>
    <text x="460" y="268" class="eq">c(u,w) ≤ c(u,v)+c(v,w)</text>
    <text x="460" y="296" class="small">Optional current setup start: s.</text>
  </g>

  <g id="block-schedule" data-x="815" data-y="130" data-w="330" data-h="185">
    <rect x="815" y="130" width="330" height="185" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="840" y="168" class="head">3. Arbitrary feasible schedule</text>
    <text x="840" y="205" class="strong">σ=(σ₁,...,σR)</text>
    <text x="840" y="239" class="copy">i appears exactly rᵢ times.</text>
    <text x="840" y="269" class="copy">Repeated visits allowed initially.</text>
    <text x="840" y="296" class="small">Acquisition count remains R.</text>
  </g>

  <path id="arrow-1" class="arrow" d="M220 315 V350 H360 V385" data-source="block-residual" data-target="block-batching"/>
  <path id="arrow-2" class="arrow" d="M600 315 V385" data-source="block-metric" data-target="block-batching"/>
  <path id="arrow-3" class="arrow" d="M980 315 V350 H840 V385" data-source="block-schedule" data-target="block-batching"/>

  <text x="600" y="367" class="route" text-anchor="middle">keep first appearances, shortcut deleted repeats by triangle inequality, then expand each retained preparation into one block</text>

  <g id="block-batching" data-x="110" data-y="385" data-w="980" data-h="270">
    <rect x="110" y="385" width="980" height="270" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="600" y="425" text-anchor="middle" class="head">4. Metric batching theorem</text>
    <text x="600" y="466" text-anchor="middle" class="eq">π(σ)=(v₁,...,vₘ) = preparations in first-appearance order</text>
    <text x="600" y="505" text-anchor="middle" class="eq">σbar=(v₁×rᵥ₁, v₂×rᵥ₂, ..., vₘ×rᵥₘ)</text>
    <text x="600" y="546" text-anchor="middle" class="strong">Csw(σbar) ≤ Csw(σ)</text>
    <text x="600" y="582" text-anchor="middle" class="copy">Deleting repeated visits cannot lengthen a metric route; within-block self transitions cost zero.</text>
    <text x="600" y="616" text-anchor="middle" class="strong">An optimal schedule exists with one contiguous block per preparation.</text>
    <text x="600" y="641" text-anchor="middle" class="small">The sample multiplicities are preserved exactly, so acquisition cost is unchanged.</text>
  </g>

  <g id="block-routing" data-x="55" data-y="705" data-w="330" data-h="165">
    <rect x="55" y="705" width="330" height="165" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="80" y="743" class="head">5. Exact routing reduction</text>
    <text x="80" y="778" class="strong">C*total=aΣrᵢ+L*(V+;s)</text>
    <text x="80" y="811" class="eq">L* = min over permutations of V+</text>
    <text x="80" y="841" class="small">Shortest Hamiltonian path; no return.</text>
    <text x="80" y="861" class="small">Start s is optional.</text>
  </g>

  <g id="block-dp" data-x="435" data-y="705" data-w="330" data-h="165">
    <rect x="435" y="705" width="330" height="165" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="460" y="743" class="head">6. Held-Karp exact audit</text>
    <text x="460" y="775" class="eq">D(S,j)=min k∈S\{j}</text>
    <text x="460" y="803" class="eq">[D(S\{j},k)+c(k,j)]</text>
    <text x="460" y="832" class="strong">L*=minⱼ D(V+,j)</text>
    <text x="460" y="859" class="small">O(m²2ᵐ) time; O(m2ᵐ) states.</text>
  </g>

  <g id="block-interpretation" data-x="815" data-y="705" data-w="330" data-h="165">
    <rect x="815" y="705" width="330" height="165" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="840" y="743" class="head">7. Operational interpretation</text>
    <text x="840" y="777" class="small">Magnitudes rᵢ set acquisition cost.</text>
    <text x="840" y="805" class="small">Support V+ and c set switching cost.</text>
    <text x="840" y="833" class="small">Valid pruning may reduce both burdens.</text>
    <text x="840" y="859" class="small">P54 does not validate pruning.</text>
  </g>

  <path id="arrow-4" class="arrow" d="M300 655 V680 H220 V705" data-source="block-batching" data-target="block-routing"/>
  <path id="arrow-5" class="arrow" d="M600 655 V705" data-source="block-batching" data-target="block-dp"/>
  <path id="arrow-6" class="arrow" d="M900 655 V680 H980 V705" data-source="block-batching" data-target="block-interpretation"/>

  <g id="block-boundary" data-x="90" data-y="890" data-w="1020" data-h="105">
    <rect x="90" y="890" width="1020" height="105" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="118" y="918" class="head">Deterministic and scientific boundary</text>
    <text x="118" y="942" class="small">The metric assumption is essential: with nonmetric costs, repeated detours can be cheaper and batching need not be optimal.</text>
    <text x="118" y="964" class="small">Threshold optimality and pruning validity are upstream questions; P55 handles residual monotonicity after valid release.</text>
    <text x="118" y="986" class="small">No scheduling quantity is identified with consciousness; the physical-to-experiential bridge remains open and quantum incompleteness is not implied.</text>
  </g>
</svg>
