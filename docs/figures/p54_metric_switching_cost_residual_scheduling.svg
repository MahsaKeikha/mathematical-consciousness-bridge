<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">P54 metric switching-cost residual scheduling</title>
<desc id="desc">Diagram showing repeated preparation visits compressed to one block per preparation under a metric switching cost, followed by a shortest Hamiltonian path optimization.</desc>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="60" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">P54 · Metric switching-cost residual scheduling</text>
<text x="60" y="110" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#374151">Residual acquisition burden + preparation-transition geometry</text>

<rect x="60" y="155" width="500" height="225" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="90" y="198" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111827">Arbitrary feasible schedule</text>
<text x="90" y="238" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#374151">A → B → A → C → B → D → C</text>
<line x1="110" y1="290" x2="510" y2="290" stroke="#64748b" stroke-width="4"/>
<circle cx="120" cy="290" r="18" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="114" y="297" font-family="Arial" font-size="18">A</text>
<circle cx="185" cy="290" r="18" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="179" y="297" font-family="Arial" font-size="18">B</text>
<circle cx="250" cy="290" r="18" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="244" y="297" font-family="Arial" font-size="18">A</text>
<circle cx="315" cy="290" r="18" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="309" y="297" font-family="Arial" font-size="18">C</text>
<circle cx="380" cy="290" r="18" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="374" y="297" font-family="Arial" font-size="18">B</text>
<circle cx="445" cy="290" r="18" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="439" y="297" font-family="Arial" font-size="18">D</text>
<circle cx="510" cy="290" r="18" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="504" y="297" font-family="Arial" font-size="18">C</text>
<text x="90" y="345" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Repeated visits may create avoidable switching overhead.</text>

<text x="582" y="265" font-family="Arial, Helvetica, sans-serif" font-size="50" fill="#64748b">⇒</text>
<text x="575" y="315" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">triangle inequality</text>

<rect x="650" y="155" width="490" height="225" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="680" y="198" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111827">First-visit block schedule</text>
<text x="680" y="238" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#374151">A×rA → B×rB → C×rC → D×rD</text>
<line x1="705" y1="290" x2="1085" y2="290" stroke="#64748b" stroke-width="4"/>
<circle cx="720" cy="290" r="24" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="712" y="297" font-family="Arial" font-size="18">A</text>
<circle cx="840" cy="290" r="24" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="832" y="297" font-family="Arial" font-size="18">B</text>
<circle cx="960" cy="290" r="24" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="952" y="297" font-family="Arial" font-size="18">C</text>
<circle cx="1080" cy="290" r="24" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="1072" y="297" font-family="Arial" font-size="18">D</text>
<text x="680" y="345" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Switching cost cannot increase; acquisition count is unchanged.</text>

<rect x="60" y="430" width="1080" height="245" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="90" y="477" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#111827">Exact optimization after batching</text>
<text x="90" y="525" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#111827">C*total = a Σᵢ rᵢ + minπ [ c(s,π₁) + Σₖ c(πₖ,πₖ₊₁) ]</text>
<text x="90" y="570" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#374151">Fixed acquisition term</text>
<text x="345" y="570" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#374151">+</text>
<text x="385" y="570" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#374151">shortest Hamiltonian path through positive-demand preparations</text>
<text x="90" y="618" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Held-Karp exact audit: O(m²2ᵐ) time, O(m2ᵐ) states for m = |V₊|.</text>
<text x="90" y="650" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#64748b">Scientific boundary: deterministic scheduling theorem under a declared metric; no claim of statistical minimaxity or experiential ontology.</text>
</svg>
