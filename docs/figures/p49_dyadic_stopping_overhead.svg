<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">P49 dyadic stopping overhead</title>
  <desc id="desc">A theorem map showing a P48 threshold N, the first dyadic checkpoint D(N), the strict less-than-two overshoot, and logarithmic certification-look count.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box-title { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .math { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .small { font: 400 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .flow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .axis { stroke: #64748b; stroke-width: 2; }
      .tick { stroke: #64748b; stroke-width: 1.4; }
      .threshold { stroke: #dc2626; stroke-width: 2.2; stroke-dasharray: 7 6; }
      .dyadic { stroke: #2563eb; stroke-width: 2.4; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P49: Dyadic certification schedules</text>
  <text x="60" y="88" class="subtitle">Logarithmically many certification looks with less than a factor of two stopping-threshold overhead.</text>

  <g filter="url(#shadow)">
    <rect x="65" y="130" width="300" height="140" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="92" y="165" class="box-title">P48 sufficient threshold</text>
    <text x="92" y="202" class="math">N ≥ 1</text>
    <text x="92" y="232" class="body">Correct sign is guaranteed for every local count n ≥ N.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="130" width="300" height="140" rx="18" fill="#eef2ff" stroke="#6366f1"/>
    <text x="477" y="165" class="box-title">First dyadic checkpoint</text>
    <text x="477" y="202" class="math">D(N)=2^⌈log₂N⌉</text>
    <text x="477" y="232" class="body">Check only at 1, 2, 4, 8, ...</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="835" y="130" width="300" height="140" rx="18" fill="#ecfdf5" stroke="#10b981"/>
    <text x="862" y="165" class="box-title">Exact overhead theorem</text>
    <text x="862" y="202" class="math">N ≤ D(N) &lt; 2N</text>
    <text x="862" y="232" class="body">Sample-count overshoot is always strictly below 2×.</text>
  </g>

  <path d="M365 200 L450 200" class="flow"/>
  <path d="M750 200 L835 200" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="90" y="335" width="1020" height="180" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="120" y="372" class="box-title">Checkpoint geometry on the sample axis</text>
    <line x1="140" y1="448" x2="1060" y2="448" class="axis"/>
    <line x1="160" y1="430" x2="160" y2="466" class="tick"/>
    <line x1="260" y1="430" x2="260" y2="466" class="tick"/>
    <line x1="390" y1="430" x2="390" y2="466" class="tick"/>
    <line x1="550" y1="430" x2="550" y2="466" class="tick"/>
    <line x1="750" y1="418" x2="750" y2="478" class="threshold"/>
    <line x1="940" y1="410" x2="940" y2="486" class="dyadic"/>
    <text x="150" y="495" class="small">1</text>
    <text x="250" y="495" class="small">2</text>
    <text x="380" y="495" class="small">4</text>
    <text x="540" y="495" class="small">8</text>
    <text x="718" y="405" class="small">P48 threshold N</text>
    <text x="902" y="397" class="small">first dyadic D(N)</text>
    <path d="M760 420 C805 380 885 380 930 420" class="flow"/>
    <text x="794" y="370" class="math">overshoot &lt; N</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="95" y="565" width="460" height="100" rx="18" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="125" y="602" class="box-title">Certification-look complexity</text>
    <text x="125" y="635" class="math">L(N)=⌈log₂N⌉+1</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="645" y="565" width="460" height="100" rx="18" fill="#fff7ed" stroke="#f97316"/>
    <text x="675" y="602" class="box-title">Linear cost overhead</text>
    <text x="675" y="635" class="math">Cdyad(K) &lt; 2 Cfull(K)</text>
  </g>

  <text x="60" y="700" class="small">P49 changes checkpoint frequency, not the scientific interpretation: validity still comes from P47 and finite sign separation still requires the P48 nonzero-gap premise.</text>
</svg>
