<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">P43 optimal quantum-target uncertainty allocation</title>
  <desc id="desc">P42 sampling coefficients, weighted cost, cube-root optimum, integer rounding bound, and scientific boundary.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0 0 L0 8 L10 4 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .sub{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .head{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .body{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .eq{font:600 16px Georgia,'Times New Roman',serif;fill:#0f172a}
      .label{font:700 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.8px;fill:#64748b}
      .arrow{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#ffffff"/>
  <text x="70" y="65" class="title">P43 - Optimal Quantum-Target Uncertainty Allocation</text>
  <text x="70" y="100" class="sub">The arbitrary P42 gap split is replaced by the unique weighted-cost optimum.</text>

  <rect x="70" y="155" width="390" height="205" rx="18" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="100" y="190" class="label">P42 TARGET BURDEN</text>
  <text x="100" y="225" class="head">Target coefficient</text>
  <text x="100" y="266" class="eq">AY = 2k² log(2Kk/αY) / Δ²</text>
  <text x="100" y="305" class="eq">nY ≥ AY / λ²</text>
  <text x="100" y="332" class="body">Weighted by declared target cost cY.</text>

  <rect x="555" y="155" width="390" height="205" rx="18" fill="#ecfdf5" stroke="#10b981"/>
  <text x="585" y="190" class="label">P42 QUANTUM BURDEN</text>
  <text x="585" y="225" class="head">Quantum coefficient</text>
  <text x="585" y="266" class="eq">AQ = 8L²κR²m² log(2Km/αQ) / Δ²</text>
  <text x="585" y="305" class="eq">nQ ≥ AQ / (1−λ)²</text>
  <text x="585" y="332" class="body">Weighted by declared quantum cost cQ.</text>

  <rect x="1040" y="155" width="390" height="205" rx="18" fill="#fff7ed" stroke="#f97316"/>
  <text x="1070" y="190" class="label">WEIGHTED DESIGN COST</text>
  <text x="1070" y="225" class="head">Strictly convex objective</text>
  <text x="1070" y="266" class="eq">C(λ)=cYAY/λ²+cQAQ/(1−λ)²</text>
  <text x="1070" y="305" class="eq">C''(λ)&gt;0</text>
  <text x="1070" y="332" class="body">One global minimizer exists in (0,1).</text>

  <path class="arrow" d="M460 258 H543"/>
  <path class="arrow" d="M945 258 H1028"/>

  <rect x="175" y="455" width="530" height="200" rx="18" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="205" y="490" class="label">CUBE-ROOT OPTIMUM</text>
  <text x="205" y="525" class="head">Exact gap allocation</text>
  <text x="205" y="570" class="eq">λ* = (cYAY)^(1/3) / [(cYAY)^(1/3)+(cQAQ)^(1/3)]</text>
  <text x="205" y="610" class="eq">C* = [(cYAY)^(1/3)+(cQAQ)^(1/3)]³</text>

  <rect x="795" y="455" width="530" height="200" rx="18" fill="#fff1f2" stroke="#e11d48"/>
  <text x="825" y="490" class="label">INTEGER IMPLEMENTATION</text>
  <text x="825" y="525" class="head">Round sufficient sample counts upward</text>
  <text x="825" y="570" class="eq">NY=ceil(AY/λ*²),  NQ=ceil(AQ/(1−λ*)²)</text>
  <text x="825" y="610" class="eq">C* ≤ Cint ≤ C*+cY+cQ</text>

  <path class="arrow" d="M1235 360 V410 H440 V443"/>
  <path class="arrow" d="M705 555 H783"/>

  <rect x="70" y="730" width="1360" height="115" rx="18" fill="#0f172a"/>
  <text x="105" y="767" style="font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.8px;fill:#cbd5e1">SCIENTIFIC BOUNDARY</text>
  <text x="105" y="802" style="font:600 18px Georgia,'Times New Roman',serif;fill:#f8fafc">optimal allocation inside P42 assumptions ≠ evidence of quantum incompleteness</text>
  <text x="105" y="830" style="font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1">The costs are design weights. The theorem optimizes declared sampling resources, not ontology or experiential interpretation.</text>
</svg>