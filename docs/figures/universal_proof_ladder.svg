<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 1800 1360" role="img" aria-labelledby="title desc">
  <title id="title">Universal consciousness proof criteria</title>
  <desc id="desc">Twelve required layers grouped into domain definition, physical-signature structure, empirical discrimination, finite-data certification, and generality.</desc>
  <defs>
    <style>
      .title{font:700 40px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .subtitle{font:400 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
      .group{font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.8px;fill:#64748b}
      .num{font:800 15px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#ffffff}
      .head{font:700 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .body{font:400 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
      .eq{font:600 19px Georgia,"Times New Roman",serif;fill:#0f172a}
      .dark-head{font:700 19px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc}
      .dark-body{font:400 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#cbd5e1}
      .card{stroke-width:2}
    </style>
  </defs>

  <rect width="1800" height="1360" fill="#ffffff"/>
  <text x="70" y="66" class="title">Universal Proof Target - Twelve Required Layers</text>
  <text x="70" y="104" class="subtitle">Mathematical validity, physical interpretation, empirical identifiability, and finite-data support are tracked as separate requirements.</text>

  <text x="70" y="158" class="group">I. DEFINE THE PHYSICAL AND EXPERIENTIAL DOMAINS</text>

  <g id="u1" data-qa-block="true" data-x="70" data-y="180" data-width="800" data-height="165">
    <rect class="card" x="70" y="180" width="800" height="165" rx="16" fill="#f7fbff" stroke="#3b82f6"/>
    <circle cx="110" cy="220" r="21" fill="#3b82f6"/><text x="99" y="225" class="num">U1</text>
    <text x="150" y="218" class="head">Physical well-definedness</text>
    <text x="110" y="260" class="body">State space, dynamics, interventions, observables, and representation quotient.</text>
    <text x="110" y="305" class="eq">Qₚ = P / ∼ₚ</text>
  </g>

  <g id="u2" data-qa-block="true" data-x="930" data-y="180" data-width="800" data-height="165">
    <rect class="card" x="930" y="180" width="800" height="165" rx="16" fill="#fffaf7" stroke="#ea580c"/>
    <circle cx="970" cy="220" r="21" fill="#ea580c"/><text x="959" y="225" class="num">U2</text>
    <text x="1010" y="218" class="head">Experiential well-definedness</text>
    <text x="970" y="260" class="body">Formal experiential structures and an explicit experiential equivalence relation.</text>
    <text x="970" y="305" class="eq">Qₑ = E / ∼ₑ</text>
  </g>

  <g id="u3" data-qa-block="true" data-x="70" data-y="370" data-width="800" data-height="165">
    <rect class="card" x="70" y="370" width="800" height="165" rx="16" fill="#faf8ff" stroke="#7c3aed"/>
    <circle cx="110" cy="410" r="21" fill="#7c3aed"/><text x="99" y="415" class="num">U3</text>
    <text x="150" y="408" class="head">Non-definitional bridge</text>
    <text x="110" y="450" class="body">Bridge premises require justification independent of the conclusion they support.</text>
    <text x="110" y="493" class="body">The experiential conclusion cannot be hidden inside the physical premise.</text>
  </g>

  <g id="u4" data-qa-block="true" data-x="930" data-y="370" data-width="800" data-height="165">
    <rect class="card" x="930" y="370" width="800" height="165" rx="16" fill="#f5fcfd" stroke="#0891b2"/>
    <circle cx="970" cy="410" r="21" fill="#0891b2"/><text x="959" y="415" class="num">U4</text>
    <text x="1010" y="408" class="head">Representation invariance</text>
    <text x="970" y="450" class="body">Equivalent physical descriptions cannot change the bridge assignment.</text>
    <text x="970" y="493" class="body">Supported by Proposition 1.</text>
  </g>

  <text x="70" y="590" class="group">II. CHARACTERIZE A COMPLETE PHYSICAL SIGNATURE</text>

  <g id="u5" data-qa-block="true" data-x="70" data-y="612" data-width="520" data-height="185">
    <rect class="card" x="70" y="612" width="520" height="185" rx="16" fill="#f5fcf8" stroke="#059669"/>
    <circle cx="105" cy="650" r="21" fill="#059669"/><text x="94" y="655" class="num">U5</text>
    <text x="140" y="648" class="head">Physical-feature sufficiency</text>
    <text x="110" y="690" class="body">Feature-matched systems must not</text>
    <text x="110" y="718" class="body">split canonical bridge classes.</text>
    <text x="110" y="752" class="eq">F(p)=F(p′) ⇒ B̄(p)=B̄(p′)</text>
    <text x="110" y="780" class="body">Exact criterion: Proposition 5.</text>
  </g>

  <g id="u6" data-qa-block="true" data-x="640" data-y="612" data-width="520" data-height="185">
    <rect class="card" x="640" y="612" width="520" height="185" rx="16" fill="#f5fcf8" stroke="#059669"/>
    <circle cx="675" cy="650" r="21" fill="#059669"/><text x="664" y="655" class="num">U6</text>
    <text x="710" y="648" class="head">Bridge completeness</text>
    <text x="680" y="690" class="body">Physical-signature fibers must coincide</text>
    <text x="680" y="718" class="body">with bridge-equivalence classes.</text>
    <text x="680" y="766" class="body">Canonical target: Proposition 6.</text>
  </g>

  <g id="u9" data-qa-block="true" data-x="1210" data-y="612" data-width="520" data-height="185">
    <rect class="card" x="1210" y="612" width="520" height="185" rx="16" fill="#f5fcfd" stroke="#0891b2"/>
    <circle cx="1245" cy="650" r="21" fill="#0891b2"/><text x="1234" y="655" class="num">U9</text>
    <text x="1280" y="648" class="head">Experimental recoverability</text>
    <text x="1250" y="690" class="body">The proposed complete signature must be</text>
    <text x="1250" y="718" class="body">inferable from the experiment class.</text>
    <text x="1250" y="766" class="body">Exact criterion: Proposition 7.</text>
  </g>

  <text x="70" y="855" class="group">III. EXPOSE THE BRIDGE TO COMPETING THEORIES AND DATA</text>

  <g id="u7" data-qa-block="true" data-x="70" data-y="877" data-width="520" data-height="185">
    <rect class="card" x="70" y="877" width="520" height="185" rx="16" fill="#fffdf5" stroke="#ca8a04"/>
    <circle cx="105" cy="915" r="21" fill="#ca8a04"/><text x="94" y="920" class="num">U7</text>
    <text x="140" y="913" class="head">Empirical identifiability</text>
    <text x="110" y="955" class="body">A bridge disagreement must alter</text>
    <text x="110" y="983" class="body">an observable law in the experiment class.</text>
    <text x="110" y="1031" class="body">Supported by Propositions 2-3.</text>
  </g>

  <g id="u8" data-qa-block="true" data-x="640" data-y="877" data-width="520" data-height="185">
    <rect class="card" x="640" y="877" width="520" height="185" rx="16" fill="#fffdf5" stroke="#ca8a04"/>
    <circle cx="675" cy="915" r="21" fill="#ca8a04"/><text x="664" y="920" class="num">U8</text>
    <text x="710" y="913" class="head">Cross-theory discrimination</text>
    <text x="680" y="955" class="body">IIT, GNWT, recurrent, higher-order,</text>
    <text x="680" y="983" class="body">predictive, and new bridge families</text>
    <text x="680" y="1011" class="body">share one declared test interface.</text>
    <text x="680" y="1039" class="body">Experiment design: Proposition 4.</text>
  </g>

  <g id="u12" data-qa-block="true" data-x="1210" data-y="877" data-width="520" data-height="185">
    <rect class="card" x="1210" y="877" width="520" height="185" rx="16" fill="#fff8f9" stroke="#e11d48"/>
    <circle cx="1245" cy="915" r="21" fill="#e11d48"/><text x="1230" y="920" class="num">U12</text>
    <text x="1280" y="913" class="head">Falsification and generality</text>
    <text x="1250" y="955" class="body">Temporal, compositional, substrate,</text>
    <text x="1250" y="983" class="body">and empirical tests must expose</text>
    <text x="1250" y="1011" class="body">the theory to possible failure.</text>
  </g>

  <text x="70" y="1120" class="group">IV. FINITE-DATA CERTIFICATION</text>

  <g id="u10" data-qa-block="true" data-x="70" data-y="1142" data-width="520" data-height="145">
    <rect class="card" x="70" y="1142" width="520" height="145" rx="16" fill="#faf8ff" stroke="#7c3aed"/>
    <circle cx="105" cy="1180" r="21" fill="#7c3aed"/><text x="90" y="1185" class="num">U10</text>
    <text x="140" y="1178" class="head">Finite-measurement certification</text>
    <text x="110" y="1220" class="eq">γₛ &gt; 4ε</text>
    <text x="245" y="1220" class="body">Robust recovery: Proposition 8.</text>
  </g>

  <g id="u11" data-qa-block="true" data-x="640" data-y="1142" data-width="520" data-height="145">
    <rect class="card" x="640" y="1142" width="520" height="145" rx="16" fill="#faf8ff" stroke="#7c3aed"/>
    <circle cx="675" cy="1180" r="21" fill="#7c3aed"/><text x="660" y="1185" class="num">U11</text>
    <text x="710" y="1178" class="head">Explicit sample complexity</text>
    <text x="680" y="1220" class="body">Finite trials at confidence 1 - α.</text>
    <text x="680" y="1252" class="body">Current theorem: Proposition 9.</text>
  </g>

  <g id="final-package" data-qa-block="true" data-x="1210" data-y="1142" data-width="520" data-height="145">
    <rect class="card" x="1210" y="1142" width="520" height="145" rx="16" fill="#0f172a" stroke="#0f172a"/>
    <text x="1250" y="1178" class="dark-head">Final theorem-and-evidence package</text>
    <text x="1250" y="1220" class="dark-body">Connect all layers without defining</text>
    <text x="1250" y="1252" class="dark-body">the conclusion into the physical feature.</text>
  </g>

  <text x="900" y="1330" text-anchor="middle" class="body">Scientific boundary: these are requirements for a universal proof target, not a claim that the target has already been established.</text>
</svg>
