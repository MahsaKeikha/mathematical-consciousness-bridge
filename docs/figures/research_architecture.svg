<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Research architecture</title>
  <desc id="desc">What this figure shows: the Mathematical Consciousness Bridge research architecture as eight staged scientific layers. The program moves from physical realization and quotienting to a candidate physical signature, an explicitly unresolved bridge structure, an experiential quotient, observable predictions, finite-data recovery, and falsification. How to read it: follow the arrows clockwise from the upper-left card. The color families distinguish physical modeling, quotient and invariance structure, causal signature construction, open bridge assumptions, experiential formalization, observable predictions, finite-data certification, and falsification. Main takeaway: physical description, bridge assumptions, empirical tests, and experiential formalization remain separate scientific objects. Scientific status: reader-facing research architecture. The diagram does not claim that the physical-to-experiential bridge has been solved.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0 0 L0 8 L10 4 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 44px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 21px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .boxTitle{font:700 23px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .body{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#334155}
      .eq{font:600 20px Georgia,'Times New Roman',serif;fill:#0f172a}
      .status{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.8px}
      .arrow{stroke:#64748b;stroke-width:2.8;fill:none;marker-end:url(#arrow)}
      .divider{stroke:#cbd5e1;stroke-width:1.2}
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#ffffff"/>
  <text x="70" y="66" class="title">Mathematical Consciousness Bridge: Research Architecture</text>
  <text x="70" y="104" class="subtitle">A staged mathematical-physics program that keeps physical structure, bridge assumptions, empirical tests, and experiential formalization distinct.</text>

  <g>
    <rect x="60" y="160" width="395" height="250" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="88" y="202" class="boxTitle">1. Physical realization</text>
    <line x1="88" y1="218" x2="427" y2="218" class="divider"/>
    <text x="88" y="255" class="eq">p = (X, D, I, O)</text>
    <text x="88" y="292" class="body">State space and dynamics</text>
    <text x="88" y="321" class="body">Admissible interventions</text>
    <text x="88" y="350" class="body">Observable and measurement maps</text>
    <rect x="88" y="369" width="142" height="30" rx="9" fill="#dbeafe"/>
    <text x="106" y="389" class="status" fill="#1d4ed8">PHYSICAL MODEL</text>
  </g>

  <g>
    <rect x="485" y="160" width="395" height="250" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="513" y="202" class="boxTitle">2. Physical quotient</text>
    <line x1="513" y1="218" x2="852" y2="218" class="divider"/>
    <text x="513" y="255" class="eq">Qₚ = P / ∼ₚ</text>
    <text x="513" y="292" class="body">Removes representation artifacts:</text>
    <text x="533" y="321" class="body">coordinates, units, labels, encodings</text>
    <text x="513" y="350" class="body">Keeps declared physical content</text>
    <rect x="513" y="369" width="148" height="30" rx="9" fill="#cffafe"/>
    <text x="531" y="389" class="status" fill="#0e7490">P1 INVARIANCE</text>
  </g>

  <g>
    <rect x="910" y="160" width="395" height="250" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="938" y="202" class="boxTitle">3. Candidate physical signature</text>
    <line x1="938" y1="218" x2="1277" y2="218" class="divider"/>
    <text x="938" y="255" class="eq">F<tspan baseline-shift="sub" font-size="13">causal</tspan>(p) = [Cₚ]≅</text>
    <text x="938" y="292" class="body">Response geometry Gₚ</text>
    <text x="938" y="321" class="body">Directed interventional influence Aₚ</text>
    <text x="938" y="350" class="body">Partition irreducibility Kₚ</text>
    <rect x="938" y="369" width="164" height="30" rx="9" fill="#d1fae5"/>
    <text x="956" y="389" class="status" fill="#047857">P11-P13 AUDITED</text>
  </g>

  <g>
    <rect x="1335" y="160" width="395" height="250" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1363" y="202" class="boxTitle">4. Bridge structure</text>
    <line x1="1363" y1="218" x2="1702" y2="218" class="divider"/>
    <text x="1363" y="255" class="eq">B̄ : Qₚ → Qₑ</text>
    <text x="1363" y="292" class="body">Explicit bridge principles</text>
    <text x="1363" y="321" class="body">Independent justification required</text>
    <text x="1363" y="350" class="body">Empirical consequences required</text>
    <rect x="1363" y="369" width="178" height="30" rx="9" fill="#ede9fe"/>
    <text x="1381" y="389" class="status" fill="#6d28d9">UNRESOLVED LAYER</text>
  </g>

  <path class="arrow" d="M455 285 H473"/>
  <path class="arrow" d="M880 285 H898"/>
  <path class="arrow" d="M1305 285 H1323"/>

  <g>
    <rect x="1335" y="525" width="395" height="250" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="1363" y="567" class="boxTitle">5. Experiential quotient</text>
    <line x1="1363" y1="583" x2="1702" y2="583" class="divider"/>
    <text x="1363" y="620" class="eq">Qₑ = E / ∼ₑ</text>
    <text x="1363" y="657" class="body">Formal experiential structures</text>
    <text x="1363" y="686" class="body">Experiential equivalence relation</text>
    <text x="1363" y="715" class="body">Independent target-side semantics</text>
    <rect x="1363" y="734" width="178" height="30" rx="9" fill="#ffedd5"/>
    <text x="1381" y="754" class="status" fill="#c2410c">CORE OPEN PROBLEM</text>
  </g>

  <g>
    <rect x="910" y="525" width="395" height="250" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="938" y="567" class="boxTitle">6. Observable predictions</text>
    <line x1="938" y1="583" x2="1277" y2="583" class="divider"/>
    <text x="938" y="620" class="eq">P<tspan baseline-shift="sub" font-size="13">T</tspan>(π, q)</text>
    <text x="938" y="657" class="body">Theory-specific probability laws</text>
    <text x="938" y="686" class="body">Generated under declared protocols</text>
    <text x="938" y="715" class="body">Compared with independent evidence</text>
    <rect x="938" y="734" width="170" height="30" rx="9" fill="#fef3c7"/>
    <text x="956" y="754" class="status" fill="#a16207">P2-P4 TESTABLE</text>
  </g>

  <g>
    <rect x="485" y="525" width="395" height="250" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="513" y="567" class="boxTitle">7. Finite-data recovery</text>
    <line x1="513" y1="583" x2="852" y2="583" class="divider"/>
    <text x="513" y="620" class="eq">γₛ &gt; 4ε</text>
    <text x="513" y="657" class="body">Explicit confidence requirements</text>
    <text x="513" y="686" class="body">Finite trial-count guarantees</text>
    <text x="513" y="715" class="body">Certification separated from fit</text>
    <rect x="513" y="734" width="182" height="30" rx="9" fill="#dcfce7"/>
    <text x="531" y="754" class="status" fill="#15803d">P7-P10 CERTIFIED</text>
  </g>

  <g>
    <rect x="60" y="525" width="395" height="250" rx="18" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <text x="88" y="567" class="boxTitle">8. Falsification</text>
    <line x1="88" y1="583" x2="427" y2="583" class="divider"/>
    <text x="88" y="620" class="eq">Counterexample or no-go theorem</text>
    <text x="88" y="657" class="body">Representation and identifiability</text>
    <text x="88" y="686" class="body">Minimality, temporal, composition</text>
    <text x="88" y="715" class="body">Empirical counterexamples</text>
    <rect x="88" y="734" width="164" height="30" rx="9" fill="#ffe4e6"/>
    <text x="106" y="754" class="status" fill="#be123c">ACTIVE PROGRAM</text>
  </g>

  <path class="arrow" d="M1533 410 V513"/>
  <path class="arrow" d="M1335 650 H1317"/>
  <path class="arrow" d="M910 650 H892"/>
  <path class="arrow" d="M485 650 H467"/>

  <rect x="60" y="855" width="1670" height="155" rx="18" fill="#0f172a"/>
  <text x="94" y="895" style="font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc">Strongest target</text>
  <text x="94" y="934" style="font:600 20px Georgia,'Times New Roman',serif;fill:#e2e8f0">physical first principles + validated bridge premises + finite-data certification</text>
  <text x="94" y="965" style="font:600 20px Georgia,'Times New Roman',serif;fill:#e2e8f0">→ formal experiential property</text>
  <line x1="1500" y1="880" x2="1500" y2="985" stroke="#475569"/>
  <text x="1535" y="912" style="font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.8px;fill:#94a3b8">RESEARCH STATUS</text>
  <text x="1535" y="955" style="font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#f59e0b">OPEN</text>
</svg>