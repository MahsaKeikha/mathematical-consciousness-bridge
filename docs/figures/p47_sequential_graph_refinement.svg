<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sequential graph refinement</title>
  <desc id="desc">What this figure shows: Figure 25. Adaptive evidence collection. The experiment may choose what to sample next based on previous observations, but validity is protected by a shared time-uniform confidence event. How to read it: follow only the labeled arrows, axes, panels, set relations, or inequalities shown in the visual and interpret them using the adjacent research text. Main takeaway: the figure summarizes the stated mathematical or scientific dependency; visual proximity alone does not add a claim. Scientific status: Reader-facing research figure; formal status is controlled by the linked proof or source record.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box-title { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .math { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .small { font: 400 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .flow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P47: Anytime-valid sequential witness-graph refinement</text>
  <text x="60" y="88" class="subtitle">Adaptive experimental design is allowed inside one predeclared simultaneous confidence event.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="130" width="250" height="150" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="85" y="165" class="box-title">1. Declared family</text>
    <text x="85" y="195" class="box-text">Preparations V and witness edges E</text>
    <text x="85" y="220" class="math">Mₑ = dY,e − Lₑ dQ,e</text>
    <text x="85" y="247" class="small">Lₑ and error budgets fixed before certification.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="365" y="130" width="260" height="150" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="390" y="165" class="box-title">2. Adaptive policy</text>
    <text x="390" y="195" class="box-text">Choose next preparation and modality</text>
    <text x="390" y="220" class="math">Nᵢ(t) depends on history Fₜ₋₁</text>
    <text x="390" y="247" class="small">No peeking at unobserved outcomes.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="130" width="300" height="150" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="705" y="165" class="box-title">3. Local confidence sequences</text>
    <text x="705" y="195" class="box-text">Every preparation, every local sample size</text>
    <text x="705" y="220" class="math">αᵢ,n = 6 αᵢ /(π² n²)</text>
    <text x="705" y="247" class="small">P47 also permits sharper all-time constructions.</text>
  </g>

  <path d="M310 205 L365 205" class="flow"/>
  <path d="M625 205 L680 205" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="250" y="345" width="700" height="125" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="285" y="382" class="box-title">4. One simultaneous event controls the whole adaptive experiment</text>
    <text x="285" y="414" class="math">P(E*) ≥ 1 − αY − αQ</text>
    <text x="285" y="442" class="box-text">On E*:  lowerₑ(t) ≤ Mₑ ≤ upperₑ(t)  for every declared edge e and every global time t.</text>
  </g>

  <path d="M830 280 C830 315 760 326 720 345" class="flow"/>
  <path d="M495 280 C495 315 515 325 535 345" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="60" y="545" width="310" height="120" rx="18" fill="#ecfdf5" stroke="#10b981"/>
    <text x="85" y="580" class="box-title">Stop and certify</text>
    <text x="85" y="610" class="math">maxₑ lowerₑ(t) &gt; 0</text>
    <text x="85" y="638" class="box-text">Selected population margin is positive.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="445" y="545" width="310" height="120" rx="18" fill="#fff7ed" stroke="#f97316"/>
    <text x="470" y="580" class="box-title">Prune safely</text>
    <text x="470" y="610" class="math">upperₑ(t) &lt; 0</text>
    <text x="470" y="638" class="box-text">Eliminate edge; prune vertex if all incident edges fail.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="545" width="310" height="120" rx="18" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="855" y="580" class="box-title">Continue efficiently</text>
    <text x="855" y="610" class="box-text">P45 shared precision + P46 budget selection</text>
    <text x="855" y="638" class="small">These affect efficiency, not validity.</text>
  </g>

  <path d="M430 470 C330 500 240 515 215 545" class="flow"/>
  <path d="M600 470 L600 545" class="flow"/>
  <path d="M770 470 C875 500 955 515 985 545" class="flow"/>
  <path d="M985 545 C1090 450 1100 315 980 225" class="flow"/>

  <text x="60" y="700" class="small">Scientific boundary: a positive margin rejects only the declared regular bridge class for the declared physical and target models.</text>
</svg>
