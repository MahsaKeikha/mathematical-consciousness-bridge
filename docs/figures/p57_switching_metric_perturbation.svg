<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Proposition 57: Switching-metric perturbation reoptimization stability</title>
  <desc id="desc">What this figure shows: Proved deterministic metric-perturbation theorem. P57 removes the fixed-metric limitation stated explicitly in P56. It quantifies how much the exact P54 switching optimum can change when the declared transition metric itself changes between sequential reoptimization steps.. Visible guideposts include: Sequential reoptimization remains quantitatively controlled when residual demand, setup origin, and transition geometry all change.; Old experiment state; (r, s, c); Residual demand r; Current setup s, switching metric c; New experiment state. How to read it: follow the diagram in the direction of its arrows and use each box, panel, inequality, or highlighted region only with the meaning printed beside it. Main takeaway: this is the visual companion to Proposition 57; the proposition document supplies the assumptions, proof, and exact scope of every implication. Scientific status: Proposition 57 theorem/certificate visual. It is not independent empirical evidence and does not, by itself, identify a physical or latent variable with consciousness.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.13"/>
    </filter>
    <style>
      .h1 { font: 700 30px system-ui,-apple-system,"Segoe UI",sans-serif; fill:#0f172a; }
      .sub { font: 400 16px system-ui,-apple-system,"Segoe UI",sans-serif; fill:#475569; }
      .bt { font: 700 18px system-ui,-apple-system,"Segoe UI",sans-serif; fill:#0f172a; }
      .tx { font: 400 14px system-ui,-apple-system,"Segoe UI",sans-serif; fill:#334155; }
      .math { font: 600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#0f172a; }
      .small { font: 400 12px system-ui,-apple-system,"Segoe UI",sans-serif; fill:#64748b; }
      .arrow { fill:none; stroke:#334155; stroke-width:2.2; marker-end:url(#arrow); }
      .thin { fill:none; stroke:#64748b; stroke-width:1.5; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="h1">P57: Switching-metric perturbation stability</text>
  <text x="60" y="88" class="sub">Sequential reoptimization remains quantitatively controlled when residual demand, setup origin, and transition geometry all change.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="135" width="300" height="150" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="82" y="170" class="bt">Old experiment state</text>
    <text x="82" y="202" class="math">(r, s, c)</text>
    <text x="82" y="232" class="tx">Residual demand r</text>
    <text x="82" y="255" class="tx">Current setup s, switching metric c</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="845" y="135" width="300" height="150" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="872" y="170" class="bt">New experiment state</text>
    <text x="872" y="202" class="math">(r′, s′, c′)</text>
    <text x="872" y="232" class="tx">r′ ≤ r after new evidence / safe pruning</text>
    <text x="872" y="255" class="tx">Setup and metric may both move</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="120" width="340" height="180" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
    <text x="458" y="157" class="bt">Uniform metric drift</text>
    <text x="458" y="191" class="math">δ = maxₓ,ᵧ |c(x,y) − c′(x,y)|</text>
    <text x="458" y="226" class="tx">A feasible route uses at most q(S;s)</text>
    <text x="458" y="250" class="tx">nontrivial transition edges.</text>
    <text x="458" y="278" class="math">|L*c − L*c′| ≤ q δ</text>
  </g>

  <path d="M355 210 L430 210" class="arrow"/>
  <path d="M770 210 L845 210" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="70" y="365" width="310" height="150" rx="18" fill="#ecfdf5" stroke="#10b981"/>
    <text x="97" y="400" class="bt">P55 residual release</text>
    <text x="97" y="433" class="math">Δfixed = C*c(r;s) − C*c(r′;s)</text>
    <text x="97" y="463" class="math">Δfixed ≥ 0</text>
    <text x="97" y="490" class="small">Acquisition release + support-deletion route release.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="445" y="365" width="310" height="150" rx="18" fill="#fff7ed" stroke="#f97316"/>
    <text x="472" y="400" class="bt">P56 start-motion term</text>
    <text x="472" y="433" class="math">|L*(S;s) − L*(S;s′)| ≤ c(s,s′)</text>
    <text x="472" y="463" class="tx">Moving the apparatus origin can erode</text>
    <text x="472" y="487" class="tx">a fixed-start saving by at most one distance.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="820" y="365" width="310" height="150" rx="18" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="847" y="400" class="bt">P57 metric-drift term</text>
    <text x="847" y="433" class="math">|L*c − L*c′| ≤ q δ</text>
    <text x="847" y="463" class="tx">The route optimum is Lipschitz in the</text>
    <text x="847" y="487" class="tx">finite metric under sup-norm perturbation.</text>
  </g>

  <path d="M205 285 C205 320 220 335 225 365" class="arrow"/>
  <path d="M600 300 L600 365" class="arrow"/>
  <path d="M995 285 C995 320 980 335 975 365" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="190" y="585" width="820" height="120" rx="22" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
    <text x="225" y="620" class="bt">Combined P55 + P56 + P57 certificate</text>
    <text x="225" y="654" class="math">C*c(r;s) − C*c′(r′;s′) ≥ Δfixed − P57</text>
    <text x="225" y="682" class="math">P57 = min{ c(s,s′)+q(S′;s′)δ , q(S′;s)δ+c′(s,s′) }</text>
  </g>

  <path d="M225 515 C225 555 360 565 440 585" class="arrow"/>
  <path d="M600 515 L600 585" class="arrow"/>
  <path d="M975 515 C975 555 840 565 760 585" class="arrow"/>

  <rect x="425" y="715" width="350" height="30" rx="15" fill="#ecfdf5" stroke="#10b981"/>
  <text x="600" y="735" text-anchor="middle" class="math">Δfixed &gt; P57  ⇒  strict total-cost decrease</text>

  <text x="60" y="742" class="small">Boundary: c and c′ are declared valid metrics. Metric-estimation uncertainty is a separate theorem target.</text>
</svg>
