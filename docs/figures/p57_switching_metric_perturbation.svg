<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">P57 deterministic switching-metric perturbation stability</title>
  <desc id="desc">What this figure shows: P57 controls exact P54 reoptimization when residual demand, setup origin, and a declared finite switching metric all change. The theorem assumes two valid finite metrics on one common relevant point set and measures their uniform difference by delta. How to read it: the three upper input cards specify the old exact state, the new exact state, and the sharp q-times-delta stability bound for changing only the metric at a fixed support and start. All three feed the central P55-P56-P57 certificate, where the fixed-geometry release is reduced by the smaller of two valid start-motion-plus-metric-drift penalties. The lower cards explain the sharp route-edge factor, the sufficient strict-decrease condition, and a route-reuse upper bound that can be tighter than the uniform perturbation penalty. Main takeaway: if the fixed-geometry release exceeds the certified perturbation penalty then the new exact total cost is strictly smaller, but the converse is not claimed because the penalty is worst-case. Scientific status: Deterministic robustness theorem for operational scheduling under two declared finite metrics. It does not estimate a metric from data, validate pruning, prove minimax adaptive efficiency, identify a metric or route quantity with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Arial,sans-serif;fill:#475569}
      .head{font:700 18px Arial,sans-serif;fill:#0f172a}
      .copy{font:400 15px Arial,sans-serif;fill:#334155}
      .small{font:400 13.5px Arial,sans-serif;fill:#475569}
      .eq{font:600 15px Georgia,'Times New Roman',serif;fill:#0f172a}
      .strong{font:700 16px Arial,sans-serif;fill:#0f172a}
      .route{font:700 13px Arial,sans-serif;fill:#475569}
      .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="1000" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P57  Deterministic switching-metric perturbation stability</text>
  <text x="60" y="90" class="subtitle">Exact reoptimization remains auditable when residual demand shrinks, the setup origin moves, and the declared switching geometry changes.</text>

  <g id="block-old" data-x="55" data-y="130" data-w="330" data-h="190">
    <rect x="55" y="130" width="330" height="190" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="168" class="head">1. Old exact state</text>
    <text x="80" y="207" class="strong">(r, s, c)</text>
    <text x="80" y="240" class="eq">C*c(r;s)</text>
    <text x="80" y="271" class="copy">Residual demand r; setup start s.</text>
    <text x="80" y="298" class="small">c is a declared valid finite metric.</text>
  </g>

  <g id="block-new" data-x="435" data-y="130" data-w="330" data-h="190">
    <rect x="435" y="130" width="330" height="190" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="460" y="168" class="head">2. New exact state</text>
    <text x="460" y="207" class="strong">(r′, s′, c′)</text>
    <text x="460" y="240" class="eq">r′ ≤ r</text>
    <text x="460" y="271" class="copy">Demand may shrink; setup may move.</text>
    <text x="460" y="298" class="small">c′ is another valid finite metric.</text>
  </g>

  <g id="block-metric" data-x="815" data-y="130" data-w="330" data-h="190">
    <rect x="815" y="130" width="330" height="190" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="840" y="168" class="head">3. Uniform metric drift</text>
    <text x="840" y="205" class="eq">δ = maxₓ,ᵧ |c(x,y)-c′(x,y)|</text>
    <text x="840" y="239" class="eq">|L*c(S;s)-L*c′(S;s)|</text>
    <text x="840" y="267" class="strong">≤ q(S;s) δ</text>
    <text x="840" y="298" class="small">Common relevant point set is required.</text>
  </g>

  <path id="arrow-1" class="arrow" d="M220 320 V365 H360 V390" data-source="block-old" data-target="block-combined"/>
  <path id="arrow-2" class="arrow" d="M600 320 V390" data-source="block-new" data-target="block-combined"/>
  <path id="arrow-3" class="arrow" d="M980 320 V365 H840 V390" data-source="block-metric" data-target="block-combined"/>

  <text x="600" y="372" class="route" text-anchor="middle">combine P55 fixed-geometry release with the two valid P56-P57 perturbation orders</text>

  <g id="block-combined" data-x="120" data-y="390" data-w="960" data-h="260">
    <rect x="120" y="390" width="960" height="260" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="600" y="430" text-anchor="middle" class="head">4. Combined deterministic reoptimization certificate</text>
    <text x="600" y="469" text-anchor="middle" class="eq">Δfixed = C*c(r;s) - C*c(r′;s) ≥ 0</text>
    <text x="600" y="505" text-anchor="middle" class="eq">A = c(s,s′) + q(S′;s′)δ</text>
    <text x="600" y="536" text-anchor="middle" class="eq">B = q(S′;s)δ + c′(s,s′)</text>
    <text x="600" y="569" text-anchor="middle" class="strong">P57 = min{A, B}</text>
    <text x="600" y="607" text-anchor="middle" class="strong">C*c(r;s) - C*c′(r′;s′) ≥ Δfixed - P57</text>
    <text x="600" y="635" text-anchor="middle" class="small">S′ = S(r′). The minimum keeps the better of the two valid perturbation orders.</text>
  </g>

  <g id="block-q" data-x="55" data-y="700" data-w="330" data-h="160">
    <rect x="55" y="700" width="330" height="160" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="738" class="head">5. Sharp qδ stability</text>
    <text x="80" y="772" class="eq">q=|S|-1: no start or s∈S</text>
    <text x="80" y="802" class="eq">q=|S|: s∉S</text>
    <text x="80" y="832" class="small">q counts nontrivial route edges.</text>
    <text x="80" y="852" class="small">The coefficient is sharp in general.</text>
  </g>

  <g id="block-strict" data-x="435" data-y="700" data-w="330" data-h="160">
    <rect x="435" y="700" width="330" height="160" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="460" y="738" class="head">6. Strict-decrease certificate</text>
    <text x="460" y="775" class="strong">Δfixed &gt; P57</text>
    <text x="460" y="809" class="eq">⇒ C*c′(r′;s′) &lt; C*c(r;s)</text>
    <text x="460" y="834" class="small">Sufficient only; converse not claimed.</text>
    <text x="460" y="854" class="small">Worst-case perturbation penalty.</text>
  </g>

  <g id="block-reuse" data-x="815" data-y="700" data-w="330" data-h="160">
    <rect x="815" y="700" width="330" height="160" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="840" y="738" class="head">7. Route-reuse upper bound</text>
    <text x="840" y="772" class="eq">L*c′(S;s′) ≤ ℓc′(π*c;s′)</text>
    <text x="840" y="802" class="eq">L*c′ - L*c ≤</text>
    <text x="840" y="827" class="eq">ℓc′(π*c;s′) - L*c</text>
    <text x="840" y="853" class="small">Can be tighter than the uniform qδ bound.</text>
  </g>

  <path id="arrow-4" class="arrow" d="M300 650 V675 H220 V700" data-source="block-combined" data-target="block-q"/>
  <path id="arrow-5" class="arrow" d="M600 650 V700" data-source="block-combined" data-target="block-strict"/>
  <path id="arrow-6" class="arrow" d="M900 650 V675 H980 V700" data-source="block-combined" data-target="block-reuse"/>

  <g id="block-boundary" data-x="90" data-y="880" data-w="1020" data-h="115">
    <rect x="90" y="880" width="1020" height="115" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="118" y="908" class="head">Deterministic and scientific boundary</text>
    <text x="118" y="932" class="small">Both c and c′ must be valid finite metrics on the common relevant point set; metric estimation is a separate statistical problem.</text>
    <text x="118" y="952" class="small">Pruning validity and adaptive statistical efficiency are external to this deterministic perturbation theorem.</text>
    <text x="118" y="971" class="small">P57 concerns operational scheduling geometry; it does not identify a metric or route quantity with consciousness.</text>
    <text x="118" y="988" class="small">It does not establish a physical-to-experiential bridge or imply quantum incompleteness.</text>
  </g>
</svg>
