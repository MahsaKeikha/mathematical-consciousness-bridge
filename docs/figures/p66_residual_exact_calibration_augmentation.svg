<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">P66 residual-exact augmentation after P65 flooring</title>
  <desc id="desc">What this figure shows: P66 starts from the exact lower-bounded continuous P65 optimum, floors it to an executable baseline-safe integer design, proves that the leftover budget R is strictly smaller than one baseline cost B0, and solves the best floor-dominating integer augmentation exactly by dynamic programming on that residual budget. How to read it: move left to right across the three upper cards from the P65 optimum to the residual-budget identity and then to the exact residual dynamic program. From the DP card, follow the two attached lower branches: the left panel records objective and approximation improvements over the P65 floor; the right panel records why the computation stays localized to the residual scale. Main takeaway: P66 is globally exact only inside the class k greater than or equal to the P65 floor f; it does not replace P63 as the unrestricted exact integer solver. Scientific status: Discrete resource-allocation theorem for the declared calibration surrogate. It is not a consciousness theorem, empirical consciousness result, physical-to-experiential bridge theorem, or quantum-ontology claim.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Arial,sans-serif;fill:#475569}
      .head{font:700 18px Arial,sans-serif;fill:#0f172a}
      .copy{font:400 15px Arial,sans-serif;fill:#334155}
      .small{font:400 14px Arial,sans-serif;fill:#475569}
      .strong{font:700 17px Arial,sans-serif;fill:#0f172a}
      .route{font:700 13px Arial,sans-serif;fill:#475569}
      .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="800" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P66  Residual-exact augmentation after P65 flooring</text>
  <text x="60" y="92" class="subtitle">Use the bounded leftover budget exactly; P63 remains the unrestricted exact integer solver.</text>

  <g id="block-continuous" data-x="55" data-y="135" data-w="330" data-h="220">
    <rect x="55" y="135" width="330" height="220" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="80" y="171" class="head">1. P65 bounded optimum</text>
    <text x="80" y="204" class="copy">n*_e = max{1,</text>
    <text x="80" y="228" class="copy">tau(b_e/c_e)^(2/3)}</text>
    <text x="80" y="263" class="small">The continuous optimum uses</text>
    <text x="80" y="286" class="small">the available budget tightly.</text>
    <text x="80" y="318" class="strong">f_e = floor(n*_e) ≥ 1</text>
    <text x="80" y="343" class="small">f is executable and feasible.</text>
  </g>

  <g id="block-residual" data-x="435" data-y="135" data-w="330" data-h="220">
    <rect x="435" y="135" width="330" height="220" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="460" y="171" class="head">2. Residual-budget identity</text>
    <text x="460" y="211" class="copy">R = B - sum c_e f_e</text>
    <text x="460" y="245" class="copy">R = sum c_e frac(n*_e)</text>
    <text x="460" y="289" class="strong">0 ≤ R &lt; Σ c_e = B₀</text>
    <text x="460" y="317" class="small">Leftover scale is bounded by</text>
    <text x="460" y="337" class="small">one mandatory-observation</text>
    <text x="460" y="352" class="small">baseline.</text>
  </g>

  <g id="block-dp" data-x="815" data-y="135" data-w="330" data-h="220">
    <rect x="815" y="135" width="330" height="220" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="840" y="171" class="head">3. Exact residual DP</text>
    <text x="840" y="207" class="copy">k_e = f_e + z_e,  z_e ∈ Z≥0</text>
    <text x="840" y="237" class="copy">Σ c_e z_e ≤ R</text>
    <text x="840" y="272" class="small">Bellman search uses only the</text>
    <text x="840" y="296" class="small">bounded residual-budget axis.</text>
    <text x="840" y="331" class="strong">Globally exact within k ≥ f.</text>
  </g>

  <line id="arrow-1" class="arrow" x1="385" y1="245" x2="435" y2="245" data-source="block-continuous" data-target="block-residual"/>
  <line id="arrow-2" class="arrow" x1="765" y1="245" x2="815" y2="245" data-source="block-residual" data-target="block-dp"/>

  <text x="475" y="405" class="route" text-anchor="middle">quality improvement</text>
  <text x="875" y="405" class="route" text-anchor="middle">localized computation</text>

  <g id="block-improvement" data-x="100" data-y="430" data-w="455" data-h="190">
    <rect x="100" y="430" width="455" height="190" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="128" y="468" class="head">Improvement over the P65 floor</text>
    <text x="128" y="508" class="copy">U(k⁶⁶) ≤ U(f)</text>
    <text x="128" y="542" class="copy">r₆₆ = min_e k⁶⁶_e / n*_e ≥ r₆₅</text>
    <text x="128" y="576" class="strong">factor₆₆ ≤ factor₆₅ ≤ √2</text>
    <text x="128" y="603" class="small">Residual optimization cannot worsen f.</text>
  </g>

  <g id="block-complexity" data-x="645" data-y="430" data-w="455" data-h="190">
    <rect x="645" y="430" width="455" height="190" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="673" y="468" class="head">Residual-budget complexity</text>
    <text x="673" y="508" class="copy">g = gcd{c_e},  R' = floor(R/g)</text>
    <text x="673" y="542" class="copy">DP axis uses R', not B/g.</text>
    <text x="673" y="576" class="strong">R &lt; B₀ keeps augmentation localized.</text>
    <text x="673" y="603" class="small">P63 remains the unrestricted exact solver.</text>
  </g>

  <line id="arrow-3" class="arrow" x1="900" y1="355" x2="470" y2="430" data-source="block-dp" data-target="block-improvement"/>
  <line id="arrow-4" class="arrow" x1="1035" y1="355" x2="850" y2="430" data-source="block-dp" data-target="block-complexity"/>

  <g id="block-boundary" data-x="90" data-y="650" data-w="1020" data-h="120">
    <rect x="90" y="650" width="1020" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="118" y="682" class="head">Scientific and exactness boundary</text>
    <text x="118" y="710" class="small">P66 is exact only within the componentwise floor-dominating class k ≥ f.</text>
    <text x="118" y="735" class="small">P63 remains globally exact for the unrestricted heterogeneous-cost integer problem.</text>
    <text x="118" y="760" class="small">This is a resource-allocation theorem, not a consciousness, bridge, or quantum-ontology theorem.</text>
  </g>
</svg>
