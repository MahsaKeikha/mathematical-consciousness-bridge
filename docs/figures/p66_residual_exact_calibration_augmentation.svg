<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Proposition 66: residual-exact augmentation of the P65 floor design</title>
  <desc id="desc">What this figure shows: P66 strengthens the executable heterogeneous-cost calibration chain without changing the scientific boundary of the repository. It is a theorem about how to spend calibration resources under the separable uncertainty surrogate inherited from P58-P65. It is not a theorem about consciousness, subjective experience, quantum ontology, or the completeness of.. Visible guideposts include: Exact on the bounded leftover budget; P63 remains the unrestricted exact integer solver.; 1. P65 bounded optimum; n* = max{1, τ(b/c)^(2/3)}; Continuous budget is tight.; Executable floor:; f_e = floor(n*_e) ≥ 1. How to read it: follow the diagram in the direction of its arrows and use each box, panel, inequality, or highlighted region only with the meaning printed beside it. Main takeaway: this is the visual companion to Proposition 66; the proposition document supplies the assumptions, proof, and exact scope of every implication. Scientific status: Proposition 66 theorem/certificate visual. It is not independent empirical evidence and does not, by itself, identify a physical or latent variable with consciousness.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="60" y="66" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">P66  Residual-exact augmentation after P65 flooring</text>
  <text x="60" y="99" font-family="Arial, sans-serif" font-size="16" fill="#475569">Exact on the bounded leftover budget; P63 remains the unrestricted exact integer solver.</text>

  <g id="block-continuous" data-x="60" data-y="145" data-w="330" data-h="210">
    <rect x="60" y="145" width="330" height="210" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="84" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">1. P65 bounded optimum</text>
    <text x="84" y="216" font-family="Arial, sans-serif" font-size="16" fill="#334155">n* = max{1, τ(b/c)^(2/3)}</text>
    <text x="84" y="252" font-family="Arial, sans-serif" font-size="15" fill="#475569">Continuous budget is tight.</text>
    <text x="84" y="286" font-family="Arial, sans-serif" font-size="15" fill="#475569">Executable floor:</text>
    <text x="84" y="316" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">f_e = floor(n*_e) ≥ 1</text>
  </g>

  <g id="block-residual" data-x="435" data-y="145" data-w="330" data-h="210">
    <rect x="435" y="145" width="330" height="210" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="459" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">2. Residual budget bound</text>
    <text x="459" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">R = B − Σ c_e f_e</text>
    <text x="459" y="257" font-family="Arial, sans-serif" font-size="16" fill="#334155">= Σ c_e frac(n*_e)</text>
    <text x="459" y="299" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">0 ≤ R &lt; Σ c_e = B₀</text>
    <text x="459" y="330" font-family="Arial, sans-serif" font-size="14" fill="#475569">Residual scale does not grow with B.</text>
  </g>

  <g id="block-dp" data-x="810" data-y="145" data-w="330" data-h="210">
    <rect x="810" y="145" width="330" height="210" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="834" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">3. Exact residual DP</text>
    <text x="834" y="217" font-family="Arial, sans-serif" font-size="15" fill="#334155">k_e = f_e + z_e,  z_e ∈ Z≥0</text>
    <text x="834" y="250" font-family="Arial, sans-serif" font-size="15" fill="#334155">Σ c_e z_e ≤ R</text>
    <text x="834" y="286" font-family="Arial, sans-serif" font-size="14" fill="#334155">F_i(s)=min_z [F_(i−1)(s−c_i z)</text>
    <text x="834" y="310" font-family="Arial, sans-serif" font-size="14" fill="#334155">+ b_i / sqrt(f_i+z)]</text>
    <text x="834" y="337" font-family="Arial, sans-serif" font-size="14" fill="#475569">Globally exact within k ≥ f.</text>
  </g>

  <line id="arrow-1" x1="390" y1="250" x2="435" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" data-source="block-continuous" data-target="block-residual"/>
  <line id="arrow-2" x1="765" y1="250" x2="810" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" data-source="block-residual" data-target="block-dp"/>

  <g id="block-improvement" data-x="120" data-y="430" data-w="430" data-h="190">
    <rect x="120" y="430" width="430" height="190" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="146" y="468" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Improvement over the P65 floor</text>
    <text x="146" y="510" font-family="Arial, sans-serif" font-size="17" fill="#334155">U(k⁶⁶) ≤ U(f)</text>
    <text x="146" y="546" font-family="Arial, sans-serif" font-size="16" fill="#334155">r₆₆ = min_e k⁶⁶_e / n*_e ≥ r₆₅</text>
    <text x="146" y="584" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">factor₆₆ ≤ factor₆₅ ≤ √2</text>
  </g>

  <g id="block-complexity" data-x="650" data-y="430" data-w="430" data-h="190">
    <rect x="650" y="430" width="430" height="190" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="676" y="468" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Residual-budget complexity</text>
    <text x="676" y="508" font-family="Arial, sans-serif" font-size="16" fill="#334155">g = gcd{c_e},  R′ = floor(R/g)</text>
    <text x="676" y="546" font-family="Arial, sans-serif" font-size="16" fill="#334155">DP axis uses R′, not B/g.</text>
    <text x="676" y="583" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">R &lt; B₀ keeps augmentation localized.</text>
  </g>

  <line id="arrow-3" x1="975" y1="355" x2="865" y2="430" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" data-source="block-dp" data-target="block-complexity"/>
  <line id="arrow-4" x1="860" y1="355" x2="500" y2="430" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" data-source="block-dp" data-target="block-improvement"/>

  <g id="block-boundary" data-x="120" data-y="660" data-w="960" data-h="62">
    <rect x="120" y="660" width="960" height="62" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="145" y="686" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Scientific boundary: resource-allocation theorem for the declared calibration surrogate.</text>
    <text x="145" y="710" font-family="Arial, sans-serif" font-size="14" fill="#475569">Restricted-exact above P65 floor; P63 remains globally exact; not a consciousness or quantum-ontology theorem.</text>
  </g>
</svg>
