<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P79 Robust Rejection Under Bounded Target-View Dependence</title>
  <desc id="desc">A three-stage schematic. First, each latent-state target-view law is compared with the product of its one-view marginals to define a local-dependence defect. Second, the prevalence-weighted defect places the observed law inside a controlled neighborhood around the P75 conditionally independent model family. Third, P77 and P78 rejection remains valid when the certified model-distance lower bound exceeds the sum of sampling uncertainty and the declared dependence allowance.</desc>

  <rect x="0" y="0" width="1200" height="760" rx="22" fill="#f8fafc"/>
  <rect x="36" y="32" width="1128" height="696" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="70" y="82" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0f172a">P79 Robust Rejection Under Bounded Target-View Dependence</text>
  <text x="70" y="114" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">Local dependence becomes an explicit scientific allowance, not a hidden assumption</text>

  <rect x="70" y="154" width="318" height="390" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="96" y="191" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">1. Quantify local dependence</text>
  <text x="96" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Within each latent target state s</text>

  <rect x="105" y="250" width="248" height="68" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="124" y="278" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#312e81">True conditional law</text>
  <text x="124" y="301" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4338ca">R_s(x1,x2,x3,x4)</text>

  <path d="M229 321 L229 347" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="105" y="358" width="248" height="68" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="124" y="386" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#164e63">Product projection</text>
  <text x="124" y="409" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0e7490">Pi_s = product of one-view marginals</text>

  <rect x="105" y="452" width="248" height="62" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="124" y="480" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Dependence defect</text>
  <text x="124" y="501" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#c2410c">delta_s = ||R_s - Pi_s||</text>

  <path d="M397 350 L443 350" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="455" y="154" width="310" height="390" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="481" y="191" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">2. Build the robustness envelope</text>
  <text x="481" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Weight defects by latent prevalence</text>

  <rect x="490" y="252" width="240" height="78" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="508" y="281" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#14532d">Declared dependence budget</text>
  <text x="508" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#15803d">rho = (1-pi) delta_- + pi delta_+</text>

  <rect x="490" y="355" width="240" height="112" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="508" y="385" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#312e81">Population consequence</text>
  <text x="508" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4338ca">d(P, M_P75) &lt;= rho</text>
  <text x="508" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Bounded local dependence can move the law</text>
  <text x="508" y="459" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">only inside a controlled model neighborhood.</text>

  <text x="490" y="505" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Budget must be independent of the rejection discrepancy.</text>

  <path d="M774 350 L820 350" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="832" y="154" width="298" height="390" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="858" y="191" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">3. Apply the robust gate</text>
  <text x="858" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Combine P78, P77, and P79</text>

  <rect x="865" y="251" width="232" height="70" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="883" y="279" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#065f46">P78 certified lower bound</text>
  <text x="883" y="302" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#047857">L &lt;= d(P_hat, M_P75)</text>

  <rect x="865" y="343" width="232" height="70" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="883" y="371" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#713f12">Allowances</text>
  <text x="883" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#854d0e">sampling epsilon + dependence rho</text>

  <rect x="865" y="435" width="232" height="79" rx="12" fill="#0f172a"/>
  <text x="883" y="464" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Robust rejection</text>
  <text x="883" y="490" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#86efac">L &gt; epsilon + rho</text>

  <rect x="70" y="579" width="1060" height="102" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="98" y="612" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Interpretation</text>
  <text x="98" y="641" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">If the certified separation exceeds both sampling uncertainty and the independently justified local-dependence allowance, the bounded-dependence extension is rejected.</text>
  <text x="98" y="666" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b">Non-rejection is inconclusive. It does not validate the target model or solve the physical-to-experiential bridge.</text>

  <text x="70" y="716" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">P79 is a robustness theorem for a declared target-measurement allowance. The physical-to-experiential bridge remains open.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>