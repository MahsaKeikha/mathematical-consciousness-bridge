<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P81 projection-event model separation certificate</title>
  <desc id="desc">What this figure shows: P81 strengthens the P80 continuous P75 model-distance certificate by adding exact parameter-box intervals for all nonempty projected binary events. How to read it: a P75 parameter box first gives exact marginal and higher-order cylinder-event ranges; any mismatch between an empirical event probability and its exact interval is divided by the number of full sixteen-cell outcomes in that event to obtain a valid lower bound on full-law L-infinity distance. P81 takes the maximum of this projection bound and the P80 simplex-coupled bound. A strict witness fixes the first-view marginal at two-fifths while a uniform empirical law has one-half, yielding P81 equal to one-eightieth even though P80 is zero. Main takeaway: projected-event constraints can detect box-level incompatibility hidden by individual cell intervals plus normalization. Scientific status: exact-rational computational-certification theorem figure. It does not identify a latent variable with consciousness, does not validate the P75 model, and the physical-to-experiential bridge remains open.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f8fafc"/>
  <rect x="34" y="28" width="1132" height="704" rx="24" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>

  <text x="70" y="78" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0f172a">P81 Projection-Event Model Separation Certificate</text>
  <text x="70" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16.5" fill="#475569">Exact projected-event constraints that strengthen the P80 continuous P75 lower bound</text>

  <!-- STEP 1 -->
  <rect x="70" y="145" width="310" height="408" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="145" width="310" height="82" rx="18" fill="#eef2ff"/>
  <rect x="70" y="209" width="310" height="18" fill="#eef2ff"/>
  <circle cx="101" cy="178" r="17" fill="#4f46e5"/>
  <text x="101" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">1</text>
  <text x="128" y="173" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="700" fill="#1e1b4b">Project the box</text>
  <text x="94" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13.4" fill="#475569">Marginalize unselected binary views exactly</text>

  <rect x="94" y="248" width="262" height="101" rx="12" fill="#f8faff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="114" y="276" font-family="Arial, Helvetica, sans-serif" font-size="15.2" font-weight="700" fill="#312e81">Cylinder event C(J,a)</text>
  <text x="114" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#4338ca">fix views J to assignment a</text>
  <text x="114" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#4338ca">event size = 2^(4-|J|) cells</text>

  <path d="M225 349 L225 374" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="94" y="374" width="262" height="113" rx="12" fill="#f0fdf4" stroke="#34d399" stroke-width="1.8"/>
  <text x="114" y="402" font-family="Arial, Helvetica, sans-serif" font-size="15.2" font-weight="700" fill="#065f46">Exact event interval</text>
  <text x="114" y="429" font-family="Arial, Helvetica, sans-serif" font-size="12.6" fill="#047857">l_Ja(B) &lt;= m_Ja(theta) &lt;= u_Ja(B)</text>
  <text x="114" y="453" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#047857">endpoint products + affine prevalence</text>
  <text x="114" y="475" font-family="Arial, Helvetica, sans-serif" font-size="12.3" fill="#047857">exact Fraction arithmetic; no optimizer</text>

  <text x="96" y="515" font-family="Arial, Helvetica, sans-serif" font-size="12.7" fill="#64748b">All 80 nonempty projected events are audited.</text>
  <text x="96" y="535" font-family="Arial, Helvetica, sans-serif" font-size="12.7" fill="#64748b">Full four-view events recover the P78 cells.</text>

  <!-- CONNECTOR 1 -->
  <path d="M380 349 L445 349" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- STEP 2 -->
  <rect x="445" y="145" width="310" height="408" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="145" width="310" height="82" rx="18" fill="#ecfdf5"/>
  <rect x="445" y="209" width="310" height="18" fill="#ecfdf5"/>
  <circle cx="476" cy="178" r="17" fill="#059669"/>
  <text x="476" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">2</text>
  <text x="503" y="171" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#064e3b">Transfer mismatch</text>
  <text x="469" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13.2" fill="#475569">Event discrepancy implies full-law distance</text>

  <rect x="469" y="248" width="262" height="92" rx="12" fill="#f0fdf4" stroke="#34d399" stroke-width="1.8"/>
  <text x="489" y="276" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#065f46">Finite-event Lipschitz bound</text>
  <text x="489" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#047857">|p(C)-q(C)| &lt;= |C| ||p-q||_inf</text>
  <text x="489" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#047857">triangle inequality over the event cells</text>

  <path d="M600 340 L600 365" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="469" y="365" width="262" height="99" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="489" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">Projection certificate</text>
  <text x="489" y="419" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#334155">L_proj = max d(p_C,[l_C,u_C]) / |C|</text>
  <text x="489" y="443" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#334155">L_proj(B) &lt;= distance to true box image</text>

  <rect x="469" y="483" width="262" height="54" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="600" y="506" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#155e75">L81(B) = max(L80, L_proj)</text>
  <text x="600" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#155e75">therefore L81 &gt;= L80 &gt;= L78</text>

  <!-- CONNECTOR 2 -->
  <path d="M755 349 L820 349" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- STEP 3 -->
  <rect x="820" y="145" width="310" height="408" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="145" width="310" height="82" rx="18" fill="#fff7ed"/>
  <rect x="820" y="209" width="310" height="18" fill="#fff7ed"/>
  <circle cx="851" cy="178" r="17" fill="#ea580c"/>
  <text x="851" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">3</text>
  <text x="878" y="171" font-family="Arial, Helvetica, sans-serif" font-size="17.5" font-weight="700" fill="#7c2d12">Strict improvement</text>
  <text x="844" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13.1" fill="#475569">A marginal can fail while P80 still overlaps</text>

  <rect x="844" y="248" width="262" height="116" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <text x="864" y="276" font-family="Arial, Helvetica, sans-serif" font-size="15.2" font-weight="700" fill="#9a3412">Exact witness box</text>
  <text x="864" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12.7" fill="#c2410c">pi = 1/2; q1- = q1+ = 3/5</text>
  <text x="864" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12.7" fill="#c2410c">uniform empirical law: p_x = 1/16</text>
  <text x="864" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12.7" fill="#c2410c">P80(B) = 0</text>

  <path d="M975 364 L975 388" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="844" y="388" width="262" height="96" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="864" y="416" font-family="Arial, Helvetica, sans-serif" font-size="14.8" font-weight="700" fill="#312e81">But X1 = 0 is forced</text>
  <text x="864" y="442" font-family="Arial, Helvetica, sans-serif" font-size="12.7" fill="#4338ca">model = 2/5; empirical = 1/2</text>
  <text x="864" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#4338ca">L81(B) = (1/10)/8 = 1/80</text>

  <rect x="844" y="498" width="262" height="39" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.6"/>
  <text x="975" y="523" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.1" font-weight="700" fill="#14532d">P79 gate: L81 &gt; epsilon_upper =&gt; reject</text>

  <!-- BOTTOM BAND -->
  <rect x="70" y="578" width="1060" height="108" rx="16" fill="#0f172a"/>
  <text x="98" y="611" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Why P81 matters</text>
  <text x="98" y="639" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2e8f0">Cell intervals plus normalization do not retain every marginal constraint implied by one P75 parameter box.</text>
  <text x="98" y="664" font-family="Arial, Helvetica, sans-serif" font-size="14.6" fill="#86efac">P81 recovers those projected constraints without changing the latent model or the one-sided rejection logic.</text>

  <text x="70" y="718" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#64748b">P81 is a computational certificate, not a consciousness-identification theorem. The physical-to-experiential bridge remains open.</text>
</svg>
