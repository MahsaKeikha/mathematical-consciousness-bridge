  <title>Pure-dephasing coherence decay</title>
  <desc>What this figure shows: Pure dephasing suppresses off-diagonal density-matrix coherence while leaving basis populations unchanged. Governing relation: |rho_01(t)|=|rho_01(0)| exp(-Gamma t). How to read it: Read time horizontally and the magnitude of the off-diagonal density-matrix element vertically. Its exponential decay shows loss of phase coherence at rate Gamma; in the pure-dephasing model this decay does not imply population relaxation between the basis states. Main takeaway: Pure dephasing removes phase coherence even when basis-state populations are unchanged. Scientific status: Lindblad pure-dephasing model. This is a standard quantum-mechanics or quantum-information figure. It does not show that consciousness is quantum, that consciousness causes wave-function collapse, that quantum mechanics is incomplete, or that consciousness is an additional physical dimension.</desc>
