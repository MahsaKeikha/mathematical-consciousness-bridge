  <title>Two-qubit entanglement entropy</title>
  <desc>What this figure shows: The reduced-state entropy is zero for product states and reaches one bit at maximal entanglement. Governing relation: |psi&gt;=cos(theta)|00&gt;+sin(theta)|11&gt;. How to read it: Read the Schmidt mixing angle theta horizontally and the entropy of either one-qubit reduced state vertically. The entropy vanishes at product-state endpoints and reaches one bit when the two Schmidt weights are equal, marking maximal entanglement for this two-qubit family. Main takeaway: For a globally pure bipartite state, reduced-state entropy quantifies entanglement across the partition. Scientific status: Standard pure-state bipartite entanglement result. This is a standard quantum-mechanics or quantum-information figure. It does not show that consciousness is quantum, that consciousness causes wave-function collapse, that quantum mechanics is incomplete, or that consciousness is an additional physical dimension.</desc>
