<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P72 Target Measurement Channel Robustness</title>
  <desc id="desc">Scientific diagram showing conditional data processing from a latent target to a noisy observed target, witness erasure, binary symmetric attenuation, and the finite-sample measurement-aware certificate.</desc>
  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>

  <text x="60" y="62" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827">P72 Target Measurement Channel Robustness</text>
  <text x="60" y="94" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5563">Independent target provenance is not enough. The target observation process must also be modeled.</text>

  <rect x="55" y="125" width="525" height="270" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="160" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#111827">A. Conditional data processing</text>

  <rect x="85" y="205" width="105" height="66" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="137" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#312e81">Omega</text>
  <text x="137" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4338ca">state</text>

  <line x1="190" y1="238" x2="280" y2="238" stroke="#475569" stroke-width="2.5"/>
  <polygon points="280,238 268,231 268,245" fill="#475569"/>

  <rect x="285" y="205" width="115" height="66" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="342" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#065f46">E*</text>
  <text x="342" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#047857">latent target</text>

  <line x1="400" y1="238" x2="485" y2="238" stroke="#475569" stroke-width="2.5"/>
  <polygon points="485,238 473,231 473,245" fill="#475569"/>

  <rect x="490" y="205" width="65" height="66" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="522" y="232" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#9a3412">Y</text>
  <text x="522" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#c2410c">observed</text>

  <rect x="170" y="292" width="295" height="38" rx="9" fill="#ffffff" stroke="#94a3b8"/>
  <text x="317" y="317" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Y independent of Omega given (E*, T)</text>

  <text x="317" y="359" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">I(Y; Omega | T) ≤ I(E*; Omega | T)</text>
  <text x="317" y="383" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Positive observed population residual transfers to the latent target.</text>

  <rect x="620" y="125" width="525" height="270" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="645" y="160" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#111827">B. Noise can hide a real witness</text>

  <text x="650" y="205" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155">Erasure counterexample</text>
  <text x="650" y="235" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">T constant, E* = Omega, Y constant</text>
  <text x="650" y="270" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#065f46">I(E*; Omega | T) = log 2</text>
  <text x="650" y="303" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#9a3412">I(Y; Omega | T) = 0</text>
  <line x1="650" y1="323" x2="1115" y2="323" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="650" y="350" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Therefore a null observed residual is inconclusive without target-channel stability.</text>
  <text x="650" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#7c2d12">Measurement can erase evidence. It cannot be treated as a transparent readout.</text>

  <rect x="55" y="430" width="525" height="275" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="465" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#111827">C. Binary symmetric target channel</text>
  <text x="80" y="494" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">Y = E* xor N,  N ~ Bernoulli(eta)</text>
  <text x="80" y="527" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0f172a">TV(Y) = |1 - 2 eta| TV(E*)</text>
  <text x="80" y="555" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">gamma = |1 - 2 eta|</text>

  <line x1="100" y1="660" x2="525" y2="660" stroke="#64748b" stroke-width="1.5"/>
  <line x1="100" y1="590" x2="100" y2="660" stroke="#64748b" stroke-width="1.5"/>
  <polyline points="100,590 185,604 270,625 312,660 355,625 440,604 525,590" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="100" y="684" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">0</text>
  <text x="312" y="684" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">0.5</text>
  <text x="525" y="684" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">1</text>
  <text x="312" y="702" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">eta</text>
  <text x="88" y="596" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">1</text>
  <text x="88" y="663" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">0</text>
  <text x="112" y="579" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2563eb">gamma</text>

  <rect x="620" y="430" width="525" height="275" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="645" y="465" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#111827">D. Finite-sample witness transfer</text>
  <text x="645" y="499" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Two same-T cases, categorical observed target Y, declared alphabet size dY</text>
  <text x="645" y="535" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">LY = max{0, TV(Pa_hat, Pb_hat) - tau_a - tau_b}</text>
  <text x="645" y="566" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">With probability at least 1 - alpha:</text>
  <text x="665" y="596" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#065f46">TV(E*a, E*b) ≥ TV(Ya, Yb) ≥ LY</text>
  <line x1="645" y1="618" x2="1115" y2="618" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="645" y="647" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">If channel stability gamma ≥ gamma0 and latent gap ≥ DeltaE, a sufficient</text>
  <text x="645" y="672" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a">n &gt; 2 dY² log(4 dY / alpha) / (gamma0² DeltaE²)</text>
  <text x="645" y="697" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7c2d12">As gamma0 approaches zero, the sufficient sample burden diverges.</text>

  <text x="60" y="738" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">Scientific boundary: E* is a declared latent target, not an assumed definition of consciousness. Channel validity and identifiability remain separate obligations.</text>
</svg>