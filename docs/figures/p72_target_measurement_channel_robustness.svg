<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P72 target-measurement channel robustness</title>
  <desc id="desc">What this figure shows: P72 separates an independently declared latent target from the noisy process used to observe it. The top-left panel gives conditional data processing, the top-right panel shows that measurement noise can erase a real witness, the lower-left panel gives the binary symmetric channel stability factor, and the lower-right panel transfers an observed finite-sample witness back to the latent target. How to read it: read each panel as a distinct theorem component; inside panel A, follow the attached state-to-target-to-observation arrows. Main takeaway: nondifferential target noise can weaken or erase evidence but cannot create a positive population residual from a screened-off latent target. Scientific status: target-measurement robustness theorem figure. The latent target is declared for testing and is not an assumed definition of consciousness; channel validity and the physical-to-experiential bridge remain separate obligations.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 29px Arial,Helvetica,sans-serif;fill:#0f172a}
      .subtitle{font:400 15.5px Arial,Helvetica,sans-serif;fill:#475569}
      .panelTitle{font:700 18px Arial,Helvetica,sans-serif;fill:#0f172a}
      .body{font:400 14px Arial,Helvetica,sans-serif;fill:#334155}
      .eq{font:600 15px Arial,Helvetica,sans-serif;fill:#0f172a}
      .small{font:400 12.5px Arial,Helvetica,sans-serif;fill:#64748b}
      .boundary{font:600 12.5px Arial,Helvetica,sans-serif;fill:#475569}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="32" y="26" width="1136" height="708" rx="22" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
  <text x="60" y="64" class="title">P72 Target Measurement Channel Robustness</text>
  <text x="60" y="94" class="subtitle">Independent target provenance is not enough: the target observation process must also be modeled.</text>

  <g id="data-processing-panel">
    <rect x="60" y="126" width="520" height="266" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="84" y="160" class="panelTitle">A. Conditional data processing</text>

    <rect x="90" y="196" width="105" height="62" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="142" y="222" text-anchor="middle" class="eq" fill="#312e81">Omega</text>
    <text x="142" y="244" text-anchor="middle" class="small" fill="#4338ca">state</text>

    <path d="M195 227 L273 227" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <rect x="280" y="196" width="120" height="62" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="340" y="222" text-anchor="middle" class="eq" fill="#065f46">E*</text>
    <text x="340" y="244" text-anchor="middle" class="small" fill="#047857">latent target</text>

    <path d="M400 227 L473 227" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <rect x="480" y="196" width="70" height="62" rx="11" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="515" y="222" text-anchor="middle" class="eq" fill="#9a3412">Y</text>
    <text x="515" y="244" text-anchor="middle" class="small" fill="#c2410c">observed</text>

    <rect x="135" y="280" width="370" height="40" rx="9" fill="#ffffff" stroke="#94a3b8"/>
    <text x="320" y="305" text-anchor="middle" class="body">Y independent of Omega given (E*, T)</text>
    <text x="320" y="350" text-anchor="middle" class="eq">I(Y; Omega | T) ≤ I(E*; Omega | T)</text>
    <text x="320" y="376" text-anchor="middle" class="small">A positive observed residual transfers to the latent target.</text>
  </g>

  <g id="erasure-panel">
    <rect x="620" y="126" width="520" height="266" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="644" y="160" class="panelTitle">B. Noise can hide a real witness</text>
    <text x="644" y="198" class="eq">Erasure counterexample</text>
    <text x="644" y="226" class="body">T constant, E* = Omega, Y constant</text>
    <text x="644" y="264" class="eq" fill="#065f46">I(E*; Omega | T) = log 2</text>
    <text x="644" y="298" class="eq" fill="#9a3412">I(Y; Omega | T) = 0</text>
    <line x1="644" y1="320" x2="1116" y2="320" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="644" y="346" class="body">A null observed residual is inconclusive without</text>
    <text x="644" y="368" class="body">target-channel stability.</text>
    <text x="644" y="386" class="small" fill="#7c2d12">Measurement can erase evidence; it is not a transparent readout.</text>
  </g>

  <g id="binary-channel-panel">
    <rect x="60" y="424" width="520" height="276" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="84" y="458" class="panelTitle">C. Binary symmetric target channel</text>
    <text x="84" y="490" class="body">Y = E* xor N, N ~ Bernoulli(eta)</text>
    <text x="84" y="522" class="eq">TV(Y) = |1 - 2 eta| TV(E*)</text>
    <text x="84" y="548" class="body">gamma = |1 - 2 eta|</text>

    <line x1="120" y1="658" x2="520" y2="658" stroke="#64748b" stroke-width="1.5"/>
    <line x1="120" y1="582" x2="120" y2="658" stroke="#64748b" stroke-width="1.5"/>
    <polyline points="120,586 320,658 520,586" fill="none" stroke="#2563eb" stroke-width="4"/>
    <circle cx="120" cy="586" r="4" fill="#2563eb"/>
    <circle cx="320" cy="658" r="4" fill="#2563eb"/>
    <circle cx="520" cy="586" r="4" fill="#2563eb"/>
    <text x="120" y="680" text-anchor="middle" class="small">0</text>
    <text x="320" y="680" text-anchor="middle" class="small">0.5</text>
    <text x="520" y="680" text-anchor="middle" class="small">1</text>
    <text x="320" y="696" text-anchor="middle" class="small">eta</text>
    <text x="106" y="590" text-anchor="end" class="small">1</text>
    <text x="106" y="661" text-anchor="end" class="small">0</text>
    <text x="132" y="576" class="small" fill="#2563eb">gamma</text>
  </g>

  <g id="finite-sample-panel">
    <rect x="620" y="424" width="520" height="276" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="644" y="458" class="panelTitle">D. Finite-sample witness transfer</text>
    <text x="644" y="490" class="body">Two same-T cases with categorical observed target Y.</text>
    <text x="644" y="512" class="small">Declared observed-target alphabet size: dY.</text>
    <text x="644" y="548" class="eq">LY = max{0, TV(Pa_hat, Pb_hat) - tau_a - tau_b}</text>
    <text x="644" y="578" class="body">With probability at least 1 - alpha:</text>
    <text x="664" y="608" class="eq" fill="#065f46">TV(E*a, E*b) ≥ TV(Ya, Yb) ≥ LY</text>
    <line x1="644" y1="626" x2="1116" y2="626" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="644" y="650" class="small">If gamma ≥ gamma0 and latent gap ≥ DeltaE, a sufficient bound is</text>
    <text x="644" y="676" class="eq">n &gt; 2 dY^2 log(4 dY / alpha) / (gamma0^2 DeltaE^2)</text>
    <text x="644" y="696" class="small" fill="#7c2d12">As gamma0 approaches zero, the sufficient sample burden diverges.</text>
  </g>

  <text x="60" y="728" class="boundary">Scientific boundary: E* is a declared latent target, not an assumed definition of consciousness. Channel validity, target meaning, and the physical-to-experiential bridge remain separate obligations.</text>
</svg>
