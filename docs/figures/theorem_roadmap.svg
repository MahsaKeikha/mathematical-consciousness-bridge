  <rect width="1600" height="1120" fill="#ffffff"/>
  <text x="70" y="64" class="title">Theorem Roadmap - Propositions 1 through 15</text>
  <text x="70" y="96" class="subtitle">General bridge mathematics leads to a structured physical candidate, internal minimality tests, temporal geometry, and finite-error certification.</text>

  <text x="70" y="145" class="layer">A. GENERAL BRIDGE AND IDENTIFIABILITY FOUNDATIONS</text>

  <rect x="70" y="165" width="275" height="135" rx="14" fill="#f7fbff" stroke="#3b82f6"/>
  <circle cx="100" cy="196" r="18" fill="#3b82f6"/><text x="91" y="201" class="num">P1</text>
  <text x="128" y="194" class="cardTitle">Representation invariance</text>
  <text x="94" y="229" class="cardText">Bridge objects must descend to physical</text>
  <text x="94" y="250" class="cardText">equivalence classes.</text>
  <text x="94" y="278" class="eq">p ∼ₚ p′ ⇒ B(p)=B(p′)</text>

  <rect x="375" y="165" width="275" height="135" rx="14" fill="#fffdf5" stroke="#ca8a04"/>
  <circle cx="405" cy="196" r="18" fill="#ca8a04"/><text x="396" y="201" class="num">P2</text>
  <text x="433" y="194" class="cardTitle">Bridge identifiability</text>
  <text x="399" y="229" class="cardText">Observable theory separation across the</text>
  <text x="399" y="250" class="cardText">declared experiment class.</text>
  <text x="399" y="278" class="eq">Δ<tspan baseline-shift="sub" font-size="10">Π</tspan> = sup<tspan baseline-shift="sub" font-size="10">π</tspan> ‖P₁-P₂‖<tspan baseline-shift="sub" font-size="10">TV</tspan></text>

  <rect x="680" y="165" width="275" height="135" rx="14" fill="#fffdf5" stroke="#ca8a04"/>
  <circle cx="710" cy="196" r="18" fill="#ca8a04"/><text x="701" y="201" class="num">P3</text>
  <text x="738" y="194" class="cardTitle">Observational quotient</text>
  <text x="704" y="229" class="cardText">The experiment class identifies theory</text>
  <text x="704" y="250" class="cardText">equivalence classes, not labels.</text>
  <text x="704" y="278" class="eq">Θ / ∼<tspan baseline-shift="sub" font-size="10">Π,q</tspan> ≅ Im(Φ<tspan baseline-shift="sub" font-size="10">Π,q</tspan>)</text>

  <rect x="985" y="165" width="275" height="135" rx="14" fill="#fffdf5" stroke="#ca8a04"/>
  <circle cx="1015" cy="196" r="18" fill="#ca8a04"/><text x="1006" y="201" class="num">P4</text>
  <text x="1043" y="194" class="cardTitle">Experiment design</text>
  <text x="1009" y="229" class="cardText">Maximin separation and finite set-cover</text>
  <text x="1009" y="250" class="cardText">design for competing theories.</text>
  <text x="1009" y="278" class="eq">U(S)&gt;0 ⇔ complete pair coverage</text>

  <rect x="1290" y="165" width="240" height="135" rx="14" fill="#f5fcf8" stroke="#059669"/>
  <circle cx="1320" cy="196" r="18" fill="#059669"/><text x="1311" y="201" class="num">P5</text>
  <text x="1348" y="194" class="cardTitle">Feature sufficiency</text>
  <text x="1314" y="229" class="cardText">Feature fibers cannot split</text>
  <text x="1314" y="250" class="cardText">bridge classes.</text>
  <text x="1314" y="278" class="eq">B̄ = g ∘ F</text>

