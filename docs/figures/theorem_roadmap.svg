  <text x="70" y="355" class="layer">B. COMPLETE-SIGNATURE RECOVERY AND FINITE-DATA DESIGN</text>

  <rect x="70" y="375" width="275" height="130" rx="14" fill="#f5fcf8" stroke="#059669"/>
  <circle cx="100" cy="406" r="18" fill="#059669"/><text x="91" y="411" class="num">P6</text>
  <text x="128" y="404" class="cardTitle">Canonical complete signature</text>
  <text x="94" y="439" class="cardText">Exact bridge-equivalence target.</text>
  <text x="94" y="472" class="eq">Cᴮ(p)=Cᴮ(p′) ⇔ B̄(p)=B̄(p′)</text>

  <rect x="375" y="375" width="275" height="130" rx="14" fill="#faf8ff" stroke="#7c3aed"/>
  <circle cx="405" cy="406" r="18" fill="#7c3aed"/><text x="396" y="411" class="num">P7</text>
  <text x="433" y="404" class="cardTitle">Experimental recoverability</text>
  <text x="399" y="439" class="cardText">Observable fingerprints must determine</text>
  <text x="399" y="460" class="cardText">the target physical signature.</text>

  <rect x="680" y="375" width="275" height="130" rx="14" fill="#faf8ff" stroke="#7c3aed"/>
  <circle cx="710" cy="406" r="18" fill="#7c3aed"/><text x="701" y="411" class="num">P8</text>
  <text x="738" y="404" class="cardTitle">Robust finite-error recovery</text>
  <text x="704" y="444" class="eq">γ<tspan baseline-shift="sub" font-size="10">S</tspan> &gt; 4ε</text>
  <text x="704" y="474" class="cardText">Exact partition recovery under error.</text>

  <rect x="985" y="375" width="275" height="130" rx="14" fill="#faf8ff" stroke="#7c3aed"/>
  <circle cx="1015" cy="406" r="18" fill="#7c3aed"/><text x="1006" y="411" class="num">P9</text>
  <text x="1043" y="404" class="cardTitle">Sample complexity</text>
  <text x="1009" y="439" class="cardText">Explicit categorical trial bound at</text>
  <text x="1009" y="460" class="cardText">confidence 1-α.</text>

  <rect x="1290" y="375" width="240" height="130" rx="14" fill="#faf8ff" stroke="#7c3aed"/>
  <circle cx="1320" cy="406" r="18" fill="#7c3aed"/><text x="1307" y="411" class="num">P10</text>
  <text x="1348" y="404" class="cardTitle">Robust protocol design</text>
  <text x="1314" y="439" class="cardText">Signal gain must exceed</text>
  <text x="1314" y="460" class="cardText">nuisance inflation.</text>

