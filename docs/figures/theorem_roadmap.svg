<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Theorem roadmap through Proposition 15</title>
  <desc id="desc">Publication-style dependency map from physical well-definedness and theory identifiability through intervention-resolved causal structure, minimality audits, temporal continuation, and finite-sample temporal certification.</desc>
