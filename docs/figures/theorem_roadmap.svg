<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2180" viewBox="0 0 1600 2180" role="img" aria-labelledby="title desc">
  <title id="title">Theorem roadmap through Proposition 24</title>
  <desc id="desc">Publication-style dependency map from invariance and identifiability through causal structure, scale, physical sufficiency, residual certification, refinement, adaptive selection, and anytime-valid stopping-time control.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0 0 L0 8 L10 4 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 36px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .head{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .body{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .eq{font:600 15px Georgia,'Times New Roman',serif;fill:#0f172a}
      .label{font:700 10px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.8px;fill:#64748b}
      .arrow{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="2180" fill="#ffffff"/>
  <text x="70" y="62" class="title">Theorem Roadmap - P1 through P24</text>
  <text x="70" y="94" class="subtitle">The chain separates physical structure, finite-data certification, refinement, adaptive selection, and repeated-look validity.</text>

  <rect x="95" y="145" width="420" height="180" rx="18" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="125" y="178" class="label">FOUNDATION · P1-P4</text>
  <text x="125" y="212" class="head">Invariance and identifiability</text>
  <text x="125" y="248" class="body">P1 representation invariance</text>
  <text x="125" y="272" class="body">P2-P3 empirical equivalence and identifiability</text>
  <text x="125" y="296" class="body">P4 discriminating experiment design</text>

  <rect x="590" y="145" width="420" height="180" rx="18" fill="#faf5ff" stroke="#8b5cf6"/>
  <text x="620" y="178" class="label">SUFFICIENCY · P5-P10</text>
  <text x="620" y="212" class="head">Recovery under finite data</text>
  <text x="620" y="248" class="body">P5-P7 feature sufficiency and recoverability</text>
  <text x="620" y="272" class="body">P8 finite-error recovery</text>
  <text x="620" y="296" class="body">P9-P10 sample complexity and robust design</text>

  <rect x="1085" y="145" width="420" height="180" rx="18" fill="#ecfdf5" stroke="#10b981"/>
  <text x="1115" y="178" class="label">PHYSICAL CANDIDATE · P11-P13</text>
  <text x="1115" y="212" class="head">Causal structure and no-go tests</text>
  <text x="1115" y="248" class="body">P11 intervention-resolved causal structure</text>
  <text x="1115" y="272" class="body">P12 single-component insufficiency</text>
  <text x="1115" y="296" class="body">P13 pairwise irredundancy</text>

  <path class="arrow" d="M515 235 H578"/>
  <path class="arrow" d="M1010 235 H1073"/>

  <rect x="95" y="410" width="420" height="180" rx="18" fill="#fff7ed" stroke="#f97316"/>
  <text x="125" y="443" class="label">TIME · P14-P15</text>
  <text x="125" y="477" class="head">Temporal continuation</text>
  <text x="125" y="513" class="body">P14 quotient temporal geometry</text>
  <text x="125" y="537" class="body">P15 finite-error temporal certification</text>
  <text x="125" y="566" class="eq">|d̂ − d| ≤ εs + εt</text>

  <rect x="590" y="410" width="420" height="180" rx="18" fill="#f0fdfa" stroke="#14b8a6"/>
  <text x="620" y="443" class="label">COMPOSITION · P16</text>
  <text x="620" y="477" class="head">Independent systems and coupling</text>
  <text x="620" y="513" class="body">Product response gives the independence null.</text>
  <text x="620" y="537" class="body">Cross-system coupling is a factorization defect.</text>
  <text x="620" y="566" class="eq">χA|B = κAB(πA|B)</text>

  <rect x="1085" y="410" width="420" height="180" rx="18" fill="#fff1f2" stroke="#e11d48"/>
  <text x="1115" y="443" class="label">SCALE · P17-P18</text>
  <text x="1115" y="477" class="head">Loss and recoverable sufficiency</text>
  <text x="1115" y="513" class="body">P17 coarse-graining contracts distinguishability.</text>
  <text x="1115" y="537" class="body">P18 reconstruction bounds scale distortion.</text>
  <text x="1115" y="566" class="eq">δc ≥ δf − 2ρF</text>

  <path class="arrow" d="M1295 325 V360 H305 V398"/>
  <path class="arrow" d="M515 500 H578"/>
  <path class="arrow" d="M1010 500 H1073"/>

  <rect x="225" y="675" width="1150" height="205" rx="20" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8"/>
  <text x="265" y="712" class="label">FUNDAMENTAL PHYSICAL SUFFICIENCY · P19</text>
  <text x="265" y="750" class="head">Population factorization and residual tests</text>
  <text x="265" y="782" class="body">Can target E be reconstructed from the declared descriptor T?</text>
  <text x="265" y="820" class="eq">E = BT ∘ T  iff  T(Ω)=T(Ω′) ⇒ E(Ω)=E(Ω′)</text>
  <text x="265" y="851" class="eq">stochastic criterion: I(E;Ω | T) = 0</text>
  <text x="925" y="820" class="eq">rank D(T,E) = rank DT</text>
  <text x="925" y="851" class="body">Residuals first test the completeness of T.</text>

  <path class="arrow" d="M1295 590 V635 H800 V663"/>
  <path class="arrow" d="M800 880 V920"/>

  <rect x="225" y="932" width="1150" height="180" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="265" y="969" class="label">FINITE-SAMPLE RESIDUAL CERTIFICATION · P20</text>
  <text x="265" y="1007" class="head">Confidence interval for the P19 stochastic residual</text>
  <text x="265" y="1040" class="body">IID finite-alphabet data give a joint-TV radius and entropy bound.</text>
  <text x="265" y="1074" class="eq">|I(E;Ω | T) − În| ≤ ΔCMI(τn(α))</text>
  <text x="925" y="1074" class="eq">Ln &gt; 0 ⇒ residual certified at 1−α</text>

  <path class="arrow" d="M800 1112 V1150"/>

  <rect x="225" y="1162" width="1150" height="188" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="265" y="1199" class="label">OMITTED-PHYSICS CONTROL · P21</text>
  <text x="265" y="1237" class="head">Descriptor refinement and residual persistence</text>
  <text x="265" y="1271" class="body">Valid refinement cannot increase the unresolved residual.</text>
  <text x="265" y="1306" class="eq">R(Tc) = I(E;Tf | Tc) + R(Tf)</text>
  <text x="925" y="1306" class="eq">R0 ≥ R1 ≥ ··· ≥ Rm ≥ 0</text>
  <text x="265" y="1336" class="body">Each decrease is target information captured by added physical detail.</text>

  <path class="arrow" d="M800 1350 V1385"/>

  <rect x="225" y="1397" width="1150" height="188" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="265" y="1434" class="label">SIMULTANEOUS CHAIN CERTIFICATION · P22</text>
  <text x="265" y="1472" class="head">One base confidence event controls the full chain</text>
  <text x="265" y="1506" class="body">Deterministic pushforwards inherit one joint-TV confidence event.</text>
  <text x="265" y="1541" class="eq">Pr(Rk ∈ IkR ∀k, Gk ∈ IkG ∀k) ≥ 1−α</text>
  <text x="925" y="1541" class="eq">no α/(2m+1) split</text>
  <text x="265" y="1571" class="body">Alphabet size, not level count, is the main finite-sample bottleneck here.</text>

  <path class="arrow" d="M800 1585 V1620"/>

  <rect x="225" y="1632" width="1150" height="188" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="265" y="1669" class="label">POST-SELECTION CONTROL · P23</text>
  <text x="265" y="1707" class="head">Adaptive descriptor selection remains certifiable</text>
  <text x="265" y="1741" class="body">One base event controls every deterministic candidate.</text>
  <text x="265" y="1776" class="eq">f̂ ∈ arg maxf Ĝf</text>
  <text x="925" y="1776" class="eq">G* − Gf̂ ≤ maxf Uf − Lf̂ ≤ 2Γmax</text>
  <text x="265" y="1806" class="body">Selected residual excess equals refinement-gain regret.</text>

  <path class="arrow" d="M800 1820 V1855"/>

  <rect x="225" y="1867" width="1150" height="188" rx="20" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
  <text x="265" y="1904" class="label">ANYTIME-VALID CONTROL · P24</text>
  <text x="265" y="1942" class="head">Repeated inspection and finite stopping remain certifiable</text>
  <text x="265" y="1976" class="body">A summable error schedule creates one event valid for every sample size.</text>
  <text x="265" y="2011" class="eq">αn = 6α/(π²n²),  Σn≥1 αn = α</text>
  <text x="805" y="2011" class="eq">Pr(∀n: ‖P−P̂n‖TV ≤ τnany) ≥ 1−α</text>
  <text x="265" y="2041" class="body">P23 selection and regret bounds therefore remain valid at any realized finite stopping time.</text>

  <path class="arrow" d="M800 2055 V2090"/>

  <rect x="95" y="2102" width="1410" height="62" rx="14" fill="#0f172a"/>
  <text x="125" y="2127" style="font:700 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.8px;fill:#cbd5e1">OPEN BRIDGE FRONTIER</text>
  <text x="125" y="2150" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc">Sharper time-uniform inference, physical completeness, replication, and experiential formalization remain open.</text>
</svg>
