<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">Theorem roadmap through Proposition 16</title>
  <desc id="desc">Publication-style theorem dependency map from representation invariance and theory identifiability through causal-structure construction, minimality tests, temporal certification, and independent composition.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 38px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .layer{font:700 13px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.8px;fill:#64748b}
      .num{font:800 13px Inter,Segoe UI,Arial,sans-serif;fill:#ffffff}
      .cardTitle{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .cardText{font:400 12.5px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .eq{font:600 13.5px Georgia,'Times New Roman',serif;fill:#0f172a}
      .arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1180" fill="#ffffff"/>
  <text x="70" y="64" class="title">Theorem Roadmap - Propositions 1 through 16</text>
  <text x="70" y="98" class="subtitle">The program moves from well-defined physical and empirical objects to a structured causal candidate, temporal certification, and composition theorems.</text>

  <text x="70" y="145" class="layer">A. GENERAL BRIDGE, IDENTIFIABILITY, AND COMPLETE-SIGNATURE FOUNDATIONS</text>

  <rect x="70" y="170" width="270" height="126" rx="14" fill="#f7fbff" stroke="#3b82f6"/>
  <circle cx="100" cy="200" r="18" fill="#3b82f6"/><text x="91" y="205" class="num">P1</text>
  <text x="130" y="198" class="cardTitle">Representation invariance</text>
  <text x="94" y="232" class="cardText">Bridge assignments descend to physical</text>
  <text x="94" y="253" class="cardText">equivalence classes.</text>
  <text x="94" y="278" class="eq">p ∼ₚ p′ ⇒ B(p)=B(p′)</text>

  <rect x="365" y="170" width="270" height="126" rx="14" fill="#fffdf5" stroke="#ca8a04"/>
  <circle cx="395" cy="200" r="18" fill="#ca8a04"/><text x="386" y="205" class="num">P2</text>
  <text x="425" y="198" class="cardTitle">Bridge identifiability</text>
  <text x="389" y="232" class="cardText">Theory separation across a declared</text>
  <text x="389" y="253" class="cardText">experiment class.</text>
  <text x="389" y="278" class="eq">Δ<tspan baseline-shift="sub" font-size="10">Π</tspan> = sup<tspan baseline-shift="sub" font-size="10">π</tspan> ‖P₁-P₂‖<tspan baseline-shift="sub" font-size="10">TV</tspan></text>

  <rect x="660" y="170" width="270" height="126" rx="14" fill="#fffdf5" stroke="#ca8a04"/>
  <circle cx="690" cy="200" r="18" fill="#ca8a04"/><text x="681" y="205" class="num">P3</text>
  <text x="720" y="198" class="cardTitle">Observational quotient</text>
  <text x="684" y="232" class="cardText">Indistinguishable theories form empirical</text>
  <text x="684" y="253" class="cardText">equivalence classes.</text>

  <rect x="955" y="170" width="270" height="126" rx="14" fill="#fffdf5" stroke="#ca8a04"/>
  <circle cx="985" cy="200" r="18" fill="#ca8a04"/><text x="976" y="205" class="num">P4</text>
  <text x="1015" y="198" class="cardTitle">Experiment design</text>
  <text x="979" y="232" class="cardText">Maximin separation and set-cover design</text>
  <text x="979" y="253" class="cardText">for competing theories.</text>

  <rect x="1250" y="170" width="280" height="126" rx="14" fill="#f5fcf8" stroke="#059669"/>
  <circle cx="1280" cy="200" r="18" fill="#059669"/><text x="1271" y="205" class="num">P5</text>
  <text x="1310" y="198" class="cardTitle">Feature sufficiency</text>
  <text x="1274" y="232" class="cardText">Feature fibers may not split bridge classes.</text>
  <text x="1274" y="271" class="eq">B̄ = g ∘ F</text>

  <path class="arrow" d="M340 233 H353"/><path class="arrow" d="M635 233 H648"/><path class="arrow" d="M930 233 H943"/><path class="arrow" d="M1225 233 H1238"/>

  <text x="70" y="347" class="layer">B. RECOVERABILITY, FINITE DATA, AND ROBUST EXPERIMENT DESIGN</text>

  <rect x="70" y="372" width="270" height="126" rx="14" fill="#f5fcf8" stroke="#059669"/>
  <circle cx="100" cy="402" r="18" fill="#059669"/><text x="91" y="407" class="num">P6</text>
  <text x="130" y="400" class="cardTitle">Canonical complete signature</text>
  <text x="94" y="434" class="cardText">Exact physical equivalence target for a</text>
  <text x="94" y="455" class="cardText">bridge-complete signature.</text>

  <rect x="365" y="372" width="270" height="126" rx="14" fill="#faf8ff" stroke="#7c3aed"/>
  <circle cx="395" cy="402" r="18" fill="#7c3aed"/><text x="386" y="407" class="num">P7</text>
  <text x="425" y="400" class="cardTitle">Experimental recoverability</text>
  <text x="389" y="434" class="cardText">Observable fingerprints must determine</text>
  <text x="389" y="455" class="cardText">the target physical signature.</text>

  <rect x="660" y="372" width="270" height="126" rx="14" fill="#faf8ff" stroke="#7c3aed"/>
  <circle cx="690" cy="402" r="18" fill="#7c3aed"/><text x="681" y="407" class="num">P8</text>
  <text x="720" y="400" class="cardTitle">Robust finite-error recovery</text>
  <text x="684" y="440" class="eq">γ<tspan baseline-shift="sub" font-size="10">S</tspan> &gt; 4ε</text>
  <text x="684" y="470" class="cardText">Exact recovery under bounded error.</text>

  <rect x="955" y="372" width="270" height="126" rx="14" fill="#faf8ff" stroke="#7c3aed"/>
  <circle cx="985" cy="402" r="18" fill="#7c3aed"/><text x="976" y="407" class="num">P9</text>
  <text x="1015" y="400" class="cardTitle">Sample complexity</text>
  <text x="979" y="434" class="cardText">Explicit categorical trial bound at</text>
  <text x="979" y="455" class="cardText">confidence 1−α.</text>

  <rect x="1250" y="372" width="280" height="126" rx="14" fill="#faf8ff" stroke="#7c3aed"/>
  <circle cx="1280" cy="402" r="18" fill="#7c3aed"/><text x="1267" y="407" class="num">P10</text>
  <text x="1310" y="400" class="cardTitle">Robust protocol design</text>
  <text x="1274" y="434" class="cardText">Added measurements help only when signal</text>
  <text x="1274" y="455" class="cardText">gain exceeds nuisance inflation.</text>

  <path class="arrow" d="M1390 296 C1390 330 205 330 205 360"/>
  <path class="arrow" d="M340 435 H353"/><path class="arrow" d="M635 435 H648"/><path class="arrow" d="M930 435 H943"/><path class="arrow" d="M1225 435 H1238"/>

  <text x="70" y="550" class="layer">C. CAUSAL-STRUCTURE CONSTRUCTION AND INTERNAL FALSIFICATION</text>

  <rect x="70" y="575" width="455" height="176" rx="16" fill="#f5fcfd" stroke="#0891b2" stroke-width="1.6"/>
  <circle cx="103" cy="608" r="20" fill="#0891b2"/><text x="90" y="614" class="num">P11</text>
  <text x="140" y="606" class="cardTitle">Intervention-resolved causal structure</text>
  <text x="98" y="643" class="cardText">Retains response geometry G, directed influence A,</text>
  <text x="98" y="666" class="cardText">and partition irreducibility K.</text>
  <text x="98" y="700" class="eq">F<tspan baseline-shift="sub" font-size="10">causal</tspan>(p) = [𝔠<tspan baseline-shift="sub" font-size="10">p</tspan>]≅</text>
  <text x="98" y="727" class="cardText">Structured physical candidate; no experiential assignment.</text>

  <rect x="572" y="575" width="455" height="176" rx="16" fill="#fff8f9" stroke="#e11d48" stroke-width="1.6"/>
  <circle cx="605" cy="608" r="20" fill="#e11d48"/><text x="592" y="614" class="num">P12</text>
  <text x="642" y="606" class="cardTitle">Single-component insufficiency</text>
  <text x="600" y="643" class="cardText">Constructive collisions show that one-component</text>
  <text x="600" y="666" class="cardText">and simple scalar reductions lose information.</text>
  <text x="600" y="700" class="eq">H(x)=H(x′), F(x)≠F(x′)</text>

  <rect x="1074" y="575" width="456" height="176" rx="16" fill="#fffaf7" stroke="#ea580c" stroke-width="1.6"/>
  <circle cx="1107" cy="608" r="20" fill="#ea580c"/><text x="1094" y="614" class="num">P13</text>
  <text x="1144" y="606" class="cardTitle">Pairwise component irredundancy</text>
  <text x="1102" y="643" class="cardText">Every two-component projection admits a collision</text>
  <text x="1102" y="666" class="cardText">on the declared audit domain.</text>
  <text x="1102" y="700" class="eq">(G,A), (G,K), (A,K) each incomplete</text>

  <path class="arrow" d="M1390 498 C1390 535 300 535 300 563"/>
  <path class="arrow" d="M525 663 H560"/><path class="arrow" d="M1027 663 H1062"/>

  <text x="70" y="807" class="layer">D. TEMPORAL GEOMETRY, FINITE-SAMPLE CERTIFICATION, AND COMPOSITION</text>

  <rect x="70" y="832" width="455" height="205" rx="16" fill="#f5fcf8" stroke="#059669" stroke-width="1.6"/>
  <circle cx="103" cy="867" r="20" fill="#059669"/><text x="90" y="873" class="num">P14</text>
  <text x="140" y="865" class="cardTitle">Temporal continuation</text>
  <text x="98" y="902" class="cardText">A quotient metric removes admissible relabelings</text>
  <text x="98" y="925" class="cardText">before comparing causal-structure states.</text>
  <text x="98" y="960" class="eq">D̄<tspan baseline-shift="sub" font-size="10">w</tspan>([c],[c′]) = min<tspan baseline-shift="sub" font-size="10">h</tspan> D<tspan baseline-shift="sub" font-size="10">w</tspan>(c,hc′)</text>
  <text x="98" y="993" class="cardText">Path variation detects nontrivial intermediate excursions.</text>

  <rect x="572" y="832" width="455" height="205" rx="16" fill="#faf8ff" stroke="#7c3aed" stroke-width="1.6"/>
  <circle cx="605" cy="867" r="20" fill="#7c3aed"/><text x="592" y="873" class="num">P15</text>
  <text x="642" y="865" class="cardTitle">Finite-sample temporal certification</text>
  <text x="600" y="902" class="cardText">Fingerprint uncertainty becomes rigorous bounds on</text>
  <text x="600" y="925" class="cardText">temporal distance, path variation, and maximum jump.</text>
  <text x="600" y="960" class="eq">|d̂-d| ≤ ε<tspan baseline-shift="sub" font-size="10">s</tspan>+ε<tspan baseline-shift="sub" font-size="10">t</tspan></text>
  <text x="600" y="993" class="cardText">Decision states: above, below, or unresolved.</text>

  <rect x="1074" y="832" width="456" height="205" rx="16" fill="#f7fbff" stroke="#2563eb" stroke-width="1.6"/>
  <circle cx="1107" cy="867" r="20" fill="#2563eb"/><text x="1094" y="873" class="num">P16</text>
  <text x="1144" y="865" class="cardTitle">Independent composition and coupling</text>
  <text x="1102" y="902" class="cardText">Product-response composition gives zero cross influence</text>
  <text x="1102" y="925" class="cardText">and zero irreducibility across the A|B split.</text>
  <text x="1102" y="960" class="eq">χ<tspan baseline-shift="sub" font-size="10">A|B</tspan>(τ)=κ<tspan baseline-shift="sub" font-size="10">AB</tspan><tspan baseline-shift="super" font-size="10">τ</tspan>(π<tspan baseline-shift="sub" font-size="10">A|B</tspan>)</text>
  <text x="1102" y="993" class="cardText">Positive defect certifies departure from response factorization.</text>

  <path class="arrow" d="M1302 751 C1302 790 300 790 300 820"/>
  <path class="arrow" d="M525 934 H560"/><path class="arrow" d="M1027 934 H1062"/>

  <rect x="70" y="1082" width="1460" height="52" rx="12" fill="#0f172a"/>
  <text x="94" y="1114" style="font:600 14px Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0">Current frontier: finite-sample coupling certification, split/merge events, moving world-tube interface, and independently testable physical-to-experiential bridge principles.</text>
</svg>