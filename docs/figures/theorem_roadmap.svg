<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Propositions 1 through 13 theorem roadmap</title>
  <desc id="desc">Visual dependency map organizing representation invariance, theory identifiability, signature completeness, finite-data recovery, experiment design, intervention-resolved causal structure, and internal minimality tests.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker><style>.title{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.sub{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.layer{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.7px;fill:#64748b}.pnum{font:800 14px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.ptitle{font:700 13.5px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.ptext{font:400 11.5px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="820" fill="#f8fafc"/>
  <text x="55" y="55" class="title">Theorem Roadmap - P1 through P13</text>
  <text x="55" y="82" class="sub">The program moves from well-defined physical objects to theory discrimination, complete signatures, finite-data recovery, and internal stress tests of the first physical candidate.</text>

  <text x="55" y="122" class="layer">A. PHYSICAL WELL-DEFINEDNESS</text>
  <rect x="55" y="138" width="235" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7"/><circle cx="84" cy="169" r="18" fill="#0284c7"/><text x="76" y="174" class="pnum">P1</text><text x="111" y="166" class="ptitle">Representation invariance</text><text x="111" y="190" class="ptext">bridge descends to physical quotient</text><text x="111" y="208" class="ptext">iff constant on physical classes</text>

  <text x="325" y="122" class="layer">B. THEORY IDENTIFIABILITY</text>
  <rect x="325" y="138" width="235" height="80" rx="14" fill="#fefce8" stroke="#ca8a04"/><circle cx="354" cy="167" r="18" fill="#ca8a04"/><text x="346" y="172" class="pnum">P2</text><text x="381" y="164" class="ptitle">Bridge identifiability</text><text x="381" y="188" class="ptext">TV discriminability + no-go</text>
  <rect x="325" y="235" width="235" height="80" rx="14" fill="#fefce8" stroke="#ca8a04"/><circle cx="354" cy="264" r="18" fill="#ca8a04"/><text x="346" y="269" class="pnum">P3</text><text x="381" y="261" class="ptitle">Theory equivalence classes</text><text x="381" y="285" class="ptext">quotient by observable fingerprints</text>
  <rect x="325" y="332" width="235" height="80" rx="14" fill="#fefce8" stroke="#ca8a04"/><circle cx="354" cy="361" r="18" fill="#ca8a04"/><text x="346" y="366" class="pnum">P4</text><text x="381" y="358" class="ptitle">Discriminating experiments</text><text x="381" y="382" class="ptext">maximin separation + set cover</text>

  <text x="595" y="122" class="layer">C. SUFFICIENCY + COMPLETENESS</text>
  <rect x="595" y="138" width="250" height="80" rx="14" fill="#ecfdf5" stroke="#059669"/><circle cx="624" cy="167" r="18" fill="#059669"/><text x="616" y="172" class="pnum">P5</text><text x="651" y="164" class="ptitle">Feature sufficiency</text><text x="651" y="188" class="ptext">exact fiber/factorization criterion</text>
  <rect x="595" y="235" width="250" height="80" rx="14" fill="#ecfdf5" stroke="#059669"/><circle cx="624" cy="264" r="18" fill="#059669"/><text x="616" y="269" class="pnum">P6</text><text x="651" y="261" class="ptitle">Canonical bridge signature</text><text x="651" y="285" class="ptext">exact completeness target</text>

  <text x="880" y="122" class="layer">D. RECOVERY + DESIGN</text>
  <rect x="880" y="138" width="265" height="72" rx="14" fill="#f5f3ff" stroke="#7c3aed"/><circle cx="909" cy="165" r="18" fill="#7c3aed"/><text x="901" y="170" class="pnum">P7</text><text x="936" y="162" class="ptitle">Experimental recoverability</text><text x="936" y="185" class="ptext">observable fingerprint criterion</text>
  <rect x="880" y="227" width="265" height="72" rx="14" fill="#f5f3ff" stroke="#7c3aed"/><circle cx="909" cy="254" r="18" fill="#7c3aed"/><text x="901" y="259" class="pnum">P8</text><text x="936" y="251" class="ptitle">Robust finite-error recovery</text><text x="936" y="274" class="ptext">gamma &gt; 4 epsilon</text>
  <rect x="880" y="316" width="265" height="72" rx="14" fill="#f5f3ff" stroke="#7c3aed"/><circle cx="909" cy="343" r="18" fill="#7c3aed"/><text x="901" y="348" class="pnum">P9</text><text x="936" y="340" class="ptitle">Sample complexity</text><text x="936" y="363" class="ptext">explicit finite trial requirement</text>
  <rect x="880" y="405" width="265" height="72" rx="14" fill="#f5f3ff" stroke="#7c3aed"/><circle cx="909" cy="432" r="18" fill="#7c3aed"/><text x="897" y="437" class="pnum">P10</text><text x="936" y="429" class="ptitle">Robust experiment design</text><text x="936" y="452" class="ptext">between-vs-within gap</text>

  <text x="55" y="535" class="layer">E. ORIGINAL PHYSICAL CANDIDATE + INTERNAL STRESS TESTS</text>
  <rect x="55" y="553" width="340" height="118" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><circle cx="87" cy="587" r="20" fill="#0891b2"/><text x="74" y="592" class="pnum">P11</text><text x="120" y="584" class="ptitle">Intervention-resolved causal structure</text><text x="120" y="610" class="ptext">response geometry + directed influence</text><text x="120" y="628" class="ptext">+ partition irreducibility</text><text x="120" y="650" class="ptext">structured physical candidate</text>
  <rect x="430" y="553" width="340" height="118" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><circle cx="462" cy="587" r="20" fill="#e11d48"/><text x="449" y="592" class="pnum">P12</text><text x="495" y="584" class="ptitle">Single-component insufficiency</text><text x="495" y="610" class="ptext">constructive collisions for G, A, K</text><text x="495" y="628" class="ptext">and simple scalar reductions</text><text x="495" y="650" class="ptext">physical information-loss audit</text>
  <rect x="805" y="553" width="340" height="118" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><circle cx="837" cy="587" r="20" fill="#ea580c"/><text x="824" y="592" class="pnum">P13</text><text x="870" y="584" class="ptitle">Pairwise component irredundancy</text><text x="870" y="610" class="ptext">(G,A), (G,K), (A,K)</text><text x="870" y="628" class="ptext">each admits a collision</text><text x="870" y="650" class="ptext">on the declared audit domain</text>

  <path class="arrow" d="M290 180 H317"/><path class="arrow" d="M560 180 H587"/><path class="arrow" d="M845 180 H872"/><path class="arrow" d="M442 218 V227"/><path class="arrow" d="M442 315 V324"/><path class="arrow" d="M720 218 V227"/><path class="arrow" d="M1012 210 V219"/><path class="arrow" d="M1012 299 V308"/><path class="arrow" d="M1012 388 V397"/><path class="arrow" d="M1012 477 C1012 515 230 510 230 545"/><path class="arrow" d="M395 612 H422"/><path class="arrow" d="M770 612 H797"/>

  <rect x="55" y="720" width="1090" height="55" rx="12" fill="#0f172a"/>
  <text x="75" y="744" style="font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc">Current frontier</text>
  <text x="75" y="764" style="font:400 12.5px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1">temporal continuation, composition, observer-to-bridge interface, cross-theory adversarial experiments, and biological/artificial counterexamples</text>
</svg>