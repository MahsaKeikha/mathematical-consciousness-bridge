  <text x="70" y="565" class="layer">C. PHYSICAL CANDIDATE, INTERNAL FALSIFICATION, AND TEMPORAL CERTIFICATION</text>

  <rect x="70" y="590" width="280" height="205" rx="16" fill="#f5fcfd" stroke="#0891b2" stroke-width="1.6"/>
  <circle cx="102" cy="625" r="20" fill="#0891b2"/><text x="89" y="631" class="num">P11</text>
  <text x="137" y="622" class="cardTitle">Causal-structure candidate</text>
  <text x="96" y="658" class="cardText">Full controlled-response structure:</text>
  <text x="96" y="682" class="cardText">response geometry G, directed influence A,</text>
  <text x="96" y="706" class="cardText">partition irreducibility K.</text>
  <text x="96" y="741" class="eq">F<tspan baseline-shift="sub" font-size="10">causal</tspan>(p) = [𝔠<tspan baseline-shift="sub" font-size="10">p</tspan>]≅</text>
  <text x="96" y="770" class="cardText">Candidate physical signature, not bridge conclusion.</text>

  <rect x="375" y="590" width="280" height="205" rx="16" fill="#fff8f9" stroke="#e11d48" stroke-width="1.6"/>
  <circle cx="407" cy="625" r="20" fill="#e11d48"/><text x="394" y="631" class="num">P12</text>
  <text x="442" y="622" class="cardTitle">Single-component no-go</text>
  <text x="401" y="658" class="cardText">Constructive collisions show G, A, K and</text>
  <text x="401" y="682" class="cardText">several scalar summaries are incomplete alone.</text>
  <text x="401" y="721" class="eq">H(x)=H(x′), F(x)≠F(x′)</text>
  <text x="401" y="756" class="cardText">Compression can erase physical distinctions.</text>

  <rect x="680" y="590" width="280" height="205" rx="16" fill="#fffaf7" stroke="#ea580c" stroke-width="1.6"/>
  <circle cx="712" cy="625" r="20" fill="#ea580c"/><text x="699" y="631" class="num">P13</text>
  <text x="747" y="622" class="cardTitle">Pairwise irredundancy</text>
  <text x="706" y="658" class="cardText">Every two-component projection admits a</text>
  <text x="706" y="682" class="cardText">collision on the declared audit domain.</text>
  <text x="706" y="721" class="eq">(G,A), (G,K), (A,K) incomplete</text>
  <text x="706" y="756" class="cardText">Each component carries independent information.</text>

  <rect x="985" y="590" width="280" height="205" rx="16" fill="#f5fcf8" stroke="#059669" stroke-width="1.6"/>
  <circle cx="1017" cy="625" r="20" fill="#059669"/><text x="1004" y="631" class="num">P14</text>
  <text x="1052" y="622" class="cardTitle">Temporal continuation</text>
  <text x="1011" y="658" class="cardText">Quotient metric aligns physically irrelevant</text>
  <text x="1011" y="682" class="cardText">relabelings before comparing time points.</text>
  <text x="1011" y="721" class="eq">D̄<tspan baseline-shift="sub" font-size="10">w</tspan>([c],[c′]) = min<tspan baseline-shift="sub" font-size="10">h</tspan> D<tspan baseline-shift="sub" font-size="10">w</tspan>(c,hc′)</text>
  <text x="1011" y="756" class="cardText">Path variation detects intermediate excursions.</text>

  <rect x="1290" y="590" width="240" height="205" rx="16" fill="#faf8ff" stroke="#7c3aed" stroke-width="1.6"/>
  <circle cx="1322" cy="625" r="20" fill="#7c3aed"/><text x="1309" y="631" class="num">P15</text>
  <text x="1357" y="622" class="cardTitle">Temporal certification</text>
  <text x="1316" y="658" class="cardText">Finite fingerprint error propagates</text>
  <text x="1316" y="682" class="cardText">to temporal-distance intervals.</text>
  <text x="1316" y="721" class="eq">|d̂-d| ≤ ε<tspan baseline-shift="sub" font-size="10">s</tspan>+ε<tspan baseline-shift="sub" font-size="10">t</tspan></text>
  <text x="1316" y="756" class="cardText">Above / below / unresolved threshold.</text>

