<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">Theorem roadmap through Proposition 15</title>
  <desc id="desc">Publication-style theorem roadmap from bridge foundations through identifiability, complete-signature recovery, intervention-resolved causal structure, minimality audits, temporal continuation, and finite-sample temporal certification.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0 0 L0 8 L10 4 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 42px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 19px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .section{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.9px;fill:#64748b}
      .num{font:800 13px Inter,Segoe UI,Arial,sans-serif;fill:#ffffff}
      .cardTitle{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .body{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .eq{font:600 15px Georgia,'Times New Roman',serif;fill:#0f172a}
      .arrow{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .divider{stroke:#d7dee8;stroke-width:1}
    </style>
  </defs>

  <rect width="1800" height="1320" fill="#ffffff"/>
  <text x="80" y="68" class="title">Theorem Roadmap - Propositions 1 through 15</text>
  <text x="80" y="104" class="subtitle">A staged program from physical well-definedness and theory identifiability to causal-structure minimality, temporal continuation, and finite-data certification.</text>

  <!-- Row 1 -->
  <text x="80" y="158" class="section">A. BRIDGE FOUNDATIONS AND THEORY IDENTIFIABILITY</text>

  <g>
    <rect x="80" y="180" width="380" height="180" rx="16" fill="#f7fbff" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="113" cy="214" r="20" fill="#3b82f6"/><text x="103" y="219" class="num">P1</text>
    <text x="148" y="211" class="cardTitle">Representation invariance</text>
    <line x1="104" y1="232" x2="436" y2="232" class="divider"/>
    <text x="104" y="263" class="body">Bridge assignments must be constant on</text>
    <text x="104" y="286" class="body">declared physical-equivalence classes.</text>
    <text x="104" y="326" class="eq">p ∼ₚ p′  ⇒  B(p)=B(p′)</text>
  </g>

  <g>
    <rect x="500" y="180" width="380" height="180" rx="16" fill="#fffdf5" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="533" cy="214" r="20" fill="#ca8a04"/><text x="523" y="219" class="num">P2</text>
    <text x="568" y="211" class="cardTitle">Bridge identifiability</text>
    <line x1="524" y1="232" x2="856" y2="232" class="divider"/>
    <text x="524" y="263" class="body">Total-variation separation quantifies whether</text>
    <text x="524" y="286" class="body">an experiment class can distinguish theories.</text>
    <text x="524" y="326" class="eq">ΔΠ = supπ ‖P₁−P₂‖TV</text>
  </g>

  <g>
    <rect x="920" y="180" width="380" height="180" rx="16" fill="#fffdf5" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="953" cy="214" r="20" fill="#ca8a04"/><text x="943" y="219" class="num">P3</text>
    <text x="988" y="211" class="cardTitle">Observational equivalence classes</text>
    <line x1="944" y1="232" x2="1276" y2="232" class="divider"/>
    <text x="944" y="263" class="body">Observable fingerprints determine empirical</text>
    <text x="944" y="286" class="body">theory classes rather than theory labels.</text>
    <text x="944" y="326" class="eq">Θ / ∼Π,q  ≅  Im(ΦΠ,q)</text>
  </g>

  <g>
    <rect x="1340" y="180" width="380" height="180" rx="16" fill="#fffdf5" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="1373" cy="214" r="20" fill="#ca8a04"/><text x="1363" y="219" class="num">P4</text>
    <text x="1408" y="211" class="cardTitle">Discriminating experiment design</text>
    <line x1="1364" y1="232" x2="1696" y2="232" class="divider"/>
    <text x="1364" y="263" class="body">Maximin separation and set-cover logic select</text>
    <text x="1364" y="286" class="body">protocol families that resolve competing theories.</text>
    <text x="1364" y="326" class="eq">U(S)&gt;0  ⇔  complete pair coverage</text>
  </g>

  <path class="arrow" d="M460 270 H488"/>
  <path class="arrow" d="M880 270 H908"/>
  <path class="arrow" d="M1300 270 H1328"/>

  <!-- Row 2 -->
  <text x="80" y="425" class="section">B. PHYSICAL-FEATURE SUFFICIENCY, COMPLETENESS, AND RECOVERY</text>

  <g>
    <rect x="80" y="447" width="380" height="180" rx="16" fill="#f5fcf8" stroke="#059669" stroke-width="1.5"/>
    <circle cx="113" cy="481" r="20" fill="#059669"/><text x="103" y="486" class="num">P5</text>
    <text x="148" y="478" class="cardTitle">Physical-feature sufficiency</text>
    <line x1="104" y1="499" x2="436" y2="499" class="divider"/>
    <text x="104" y="530" class="body">A bridge factors through feature F exactly when</text>
    <text x="104" y="553" class="body">feature fibers do not split bridge classes.</text>
    <text x="104" y="593" class="eq">B̄ = g ∘ F</text>
  </g>

  <g>
    <rect x="500" y="447" width="380" height="180" rx="16" fill="#f5fcf8" stroke="#059669" stroke-width="1.5"/>
    <circle cx="533" cy="481" r="20" fill="#059669"/><text x="523" y="486" class="num">P6</text>
    <text x="568" y="478" class="cardTitle">Canonical complete signature</text>
    <line x1="524" y1="499" x2="856" y2="499" class="divider"/>
    <text x="524" y="530" class="body">The canonical target is the exact physical</text>
    <text x="524" y="553" class="body">equivalence structure induced by the bridge.</text>
    <text x="524" y="593" class="eq">Cᴮ(p)=Cᴮ(p′)  ⇔  B̄(p)=B̄(p′)</text>
  </g>

  <g>
    <rect x="920" y="447" width="380" height="180" rx="16" fill="#faf8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="953" cy="481" r="20" fill="#7c3aed"/><text x="943" y="486" class="num">P7</text>
    <text x="988" y="478" class="cardTitle">Experimental recoverability</text>
    <line x1="944" y1="499" x2="1276" y2="499" class="divider"/>
    <text x="944" y="530" class="body">Observable physical fingerprints must determine</text>
    <text x="944" y="553" class="body">the target physical signature.</text>
    <text x="944" y="593" class="eq">ΨΠ(p)=ΨΠ(p′)  ⇒  F*(p)=F*(p′)</text>
  </g>

  <g>
    <rect x="1340" y="447" width="380" height="180" rx="16" fill="#faf8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="1373" cy="481" r="20" fill="#7c3aed"/><text x="1363" y="486" class="num">P8</text>
    <text x="1408" y="478" class="cardTitle">Robust finite-error recovery</text>
    <line x1="1364" y1="499" x2="1696" y2="499" class="divider"/>
    <text x="1364" y="530" class="body">Between-class separation must dominate both</text>
    <text x="1364" y="553" class="body">within-class spread and estimation error.</text>
    <text x="1364" y="593" class="eq">γS &gt; 4ε</text>
  </g>

  <path class="arrow" d="M1530 360 V400 H270 V435"/>
  <path class="arrow" d="M460 537 H488"/>
  <path class="arrow" d="M880 537 H908"/>
  <path class="arrow" d="M1300 537 H1328"/>

  <!-- Row 3 -->
  <text x="80" y="692" class="section">C. FINITE-DATA DESIGN AND THE INTERVENTION-RESOLVED CAUSAL-STRUCTURE CANDIDATE</text>

  <g>
    <rect x="80" y="714" width="380" height="180" rx="16" fill="#faf8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="113" cy="748" r="20" fill="#7c3aed"/><text x="103" y="753" class="num">P9</text>
    <text x="148" y="745" class="cardTitle">Categorical sample complexity</text>
    <line x1="104" y1="766" x2="436" y2="766" class="divider"/>
    <text x="104" y="797" class="body">A finite trial bound certifies exact signature</text>
    <text x="104" y="820" class="body">recovery at a declared confidence level.</text>
    <text x="104" y="860" class="eq">n ∝ γS⁻² log(1/α)</text>
  </g>

  <g>
    <rect x="500" y="714" width="380" height="180" rx="16" fill="#faf8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="533" cy="748" r="20" fill="#7c3aed"/><text x="519" y="753" class="num">P10</text>
    <text x="568" y="745" class="cardTitle">Robust protocol-family design</text>
    <line x1="524" y1="766" x2="856" y2="766" class="divider"/>
    <text x="524" y="797" class="body">An added protocol helps only when its signal gain</text>
    <text x="524" y="820" class="body">exceeds the nuisance variation it introduces.</text>
    <text x="524" y="860" class="eq">ΔΓ = signal gain − nuisance inflation</text>
  </g>

  <g>
    <rect x="920" y="714" width="380" height="180" rx="16" fill="#f5fcfd" stroke="#0891b2" stroke-width="1.5"/>
    <circle cx="953" cy="748" r="20" fill="#0891b2"/><text x="940" y="753" class="num">P11</text>
    <text x="988" y="745" class="cardTitle">Intervention-resolved causal structure</text>
    <line x1="944" y1="766" x2="1276" y2="766" class="divider"/>
    <text x="944" y="797" class="body">Structured physical candidate retaining response</text>
    <text x="944" y="820" class="body">geometry G, directed influence A, and irreducibility K.</text>
    <text x="944" y="860" class="eq">Fcausal(p) = [𝔠p]≅</text>
  </g>

  <g>
    <rect x="1340" y="714" width="380" height="180" rx="16" fill="#fff8f9" stroke="#e11d48" stroke-width="1.5"/>
    <circle cx="1373" cy="748" r="20" fill="#e11d48"/><text x="1360" y="753" class="num">P12</text>
    <text x="1408" y="745" class="cardTitle">Single-component insufficiency</text>
    <line x1="1364" y1="766" x2="1696" y2="766" class="divider"/>
    <text x="1364" y="797" class="body">Constructive collisions show G, A, K and simple</text>
    <text x="1364" y="820" class="body">scalar reductions are incomplete individually.</text>
    <text x="1364" y="860" class="eq">H(x)=H(x′), F(x)≠F(x′)</text>
  </g>

  <path class="arrow" d="M1530 627 V667 H270 V702"/>
  <path class="arrow" d="M460 804 H488"/>
  <path class="arrow" d="M880 804 H908"/>
  <path class="arrow" d="M1300 804 H1328"/>

  <!-- Row 4 -->
  <text x="80" y="959" class="section">D. MINIMALITY, TEMPORAL CONTINUATION, AND FINITE-SAMPLE TEMPORAL CERTIFICATION</text>

  <g>
    <rect x="80" y="981" width="500" height="190" rx="16" fill="#fffaf7" stroke="#ea580c" stroke-width="1.5"/>
    <circle cx="113" cy="1015" r="20" fill="#ea580c"/><text x="100" y="1020" class="num">P13</text>
    <text x="148" y="1012" class="cardTitle">Pairwise component irredundancy</text>
    <line x1="104" y1="1033" x2="556" y2="1033" class="divider"/>
    <text x="104" y="1064" class="body">Every two-component projection admits a collision</text>
    <text x="104" y="1087" class="body">on the declared audit domain.</text>
    <text x="104" y="1128" class="eq">(G,A), (G,K), (A,K) are each incomplete</text>
  </g>

  <g>
    <rect x="650" y="981" width="500" height="190" rx="16" fill="#f5fcf8" stroke="#059669" stroke-width="1.5"/>
    <circle cx="683" cy="1015" r="20" fill="#059669"/><text x="670" y="1020" class="num">P14</text>
    <text x="718" y="1012" class="cardTitle">Temporal continuation on quotient space</text>
    <line x1="674" y1="1033" x2="1126" y2="1033" class="divider"/>
    <text x="674" y="1064" class="body">Physically irrelevant relabelings are aligned before</text>
    <text x="674" y="1087" class="body">comparing candidate structures across time.</text>
    <text x="674" y="1128" class="eq">D̄w([c],[c′]) = minh Dw(c,hc′)</text>
  </g>

  <g>
    <rect x="1220" y="981" width="500" height="190" rx="16" fill="#faf8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="1253" cy="1015" r="20" fill="#7c3aed"/><text x="1240" y="1020" class="num">P15</text>
    <text x="1288" y="1012" class="cardTitle">Finite-sample temporal certification</text>
    <line x1="1244" y1="1033" x2="1696" y2="1033" class="divider"/>
    <text x="1244" y="1064" class="body">Finite fingerprint uncertainty propagates into</text>
    <text x="1244" y="1087" class="body">certified temporal-distance intervals.</text>
    <text x="1244" y="1128" class="eq">|d̂−d| ≤ εs + εt</text>
  </g>

  <path class="arrow" d="M1530 894 V936 H330 V969"/>
  <path class="arrow" d="M580 1076 H638"/>
  <path class="arrow" d="M1150 1076 H1208"/>

  <!-- Interpretation boundary -->
  <rect x="80" y="1220" width="1640" height="60" rx="14" fill="#0f172a"/>
  <text x="108" y="1257" style="font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0">Current boundary: the program has a certified physical theorem chain through temporal structure; the physical-to-experiential bridge remains the next distinct research layer.</text>
</svg>