  <text x="70" y="855" class="layer">D. CURRENT INTERPRETATION BOUNDARY AND NEXT STRUCTURAL FRONTIER</text>

  <rect x="70" y="875" width="710" height="150" rx="16" fill="#0f172a"/>
  <text x="96" y="912" style="font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc">What the current chain establishes</text>
  <text x="96" y="945" style="font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1">A representation-invariant, structured physical candidate can be compared through time</text>
  <text x="96" y="970" style="font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1">and finite measurement uncertainty can be propagated to certified temporal bounds.</text>
  <text x="96" y="998" style="font:600 14px Georgia,'Times New Roman',serif;fill:#e2e8f0">This is a physical theorem chain, not a consciousness bridge theorem.</text>

  <rect x="820" y="875" width="710" height="150" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="846" y="912" class="cardTitle">Next structural frontier</text>
  <text x="846" y="945" class="cardText">Composition and controlled coupling; splitting and merging of physical blocks;</text>
  <text x="846" y="970" class="cardText">world-tube / causal-structure interface; estimator-specific concentration;</text>
  <text x="846" y="995" class="cardText">irregular-time normalization; experiential-space formalization after physical tests.</text>

  <text x="70" y="1080" class="subtitle">Scientific status: P1-P15 are theorem-level mathematical results or explicit candidate constructions under stated assumptions; no proposition proves consciousness.</text>
</svg>