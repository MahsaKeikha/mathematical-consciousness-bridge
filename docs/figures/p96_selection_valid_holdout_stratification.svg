<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">P96 selection-valid holdout stratification</title>
  <desc id="desc">Pilot data choose and freeze a regime plan. Independent holdout data are then certified regime by regime with the P95 and P94 sign-coherence gate. Conditional validity integrates to the same unconditional familywise confidence without an extra selection alpha penalty. The figure also shows the two-regime one-step-dependence checkpoint of 3645 holdout observations per regime and 3648 for the first exact replication.</desc>
  <rect width="1400" height="860" fill="#f8fafc"/>
  <rect x="40" y="35" width="1320" height="790" rx="24" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="80" y="92" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">P96 Selection-Valid Holdout Stratification</text>
  <text x="80" y="128" font-family="Arial, sans-serif" font-size="19" fill="#334155">Adaptive pilot selection, frozen plan, independent certification</text>

  <rect x="80" y="175" width="355" height="280" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="220" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">1. Pilot selection</text>
  <text x="110" y="258" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Use pilot information S to choose:</text>
  <text x="128" y="294" font-family="Arial, sans-serif" font-size="17" fill="#334155">B - number of regimes</text>
  <text x="128" y="326" font-family="Arial, sans-serif" font-size="17" fill="#334155">R_b - regime definitions</text>
  <text x="128" y="358" font-family="Arial, sans-serif" font-size="17" fill="#334155">m_b - dependence ranges</text>
  <text x="128" y="390" font-family="Arial, sans-serif" font-size="17" fill="#334155">alpha_b - rational error budgets</text>
  <text x="110" y="430" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Then freeze the complete plan.</text>

  <path d="M 445 315 L 520 315" stroke="#0f172a" stroke-width="4" fill="none"/>
  <polygon points="520,315 501,304 501,326" fill="#0f172a"/>

  <rect x="525" y="175" width="300" height="280" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="555" y="220" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#854d0e">2. Independence gate</text>
  <text x="555" y="270" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#713f12">C independent of S</text>
  <text x="555" y="312" font-family="Arial, sans-serif" font-size="17" fill="#3f3f46">Holdout statistics cannot be</text>
  <text x="555" y="342" font-family="Arial, sans-serif" font-size="17" fill="#3f3f46">used to redesign segmentation.</text>
  <line x1="570" y1="375" x2="780" y2="375" stroke="#ca8a04" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="555" y="414" font-family="Arial, sans-serif" font-size="17" fill="#713f12">No reuse of certification data</text>

  <path d="M 835 315 L 910 315" stroke="#0f172a" stroke-width="4" fill="none"/>
  <polygon points="910,315 891,304 891,326" fill="#0f172a"/>

  <rect x="915" y="175" width="405" height="280" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="945" y="220" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#065f46">3. Holdout certification</text>
  <text x="945" y="260" font-family="Arial, sans-serif" font-size="17" fill="#1f2937">For each selected regime:</text>
  <text x="965" y="295" font-family="Arial, sans-serif" font-size="17" fill="#334155">common holdout marginal P_b</text>
  <text x="965" y="327" font-family="Arial, sans-serif" font-size="17" fill="#334155">declared m_b dependence</text>
  <text x="965" y="359" font-family="Arial, sans-serif" font-size="17" fill="#334155">P94 local exact gate</text>
  <text x="965" y="391" font-family="Arial, sans-serif" font-size="17" fill="#334155">P95 familywise union bound</text>
  <text x="945" y="430" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#065f46">Reject if any selected regime certifies.</text>

  <rect x="80" y="500" width="1240" height="135" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="110" y="540" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Conditional validity becomes unconditional validity</text>
  <text x="110" y="580" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">Pr(all A_b | S) &gt;= 1 - sum_b alpha_b &gt;= 1 - alpha</text>
  <text x="760" y="580" font-family="Arial, sans-serif" font-size="20" fill="#1e293b">implies   Pr(all A_b) &gt;= 1 - alpha</text>
  <text x="110" y="615" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">Extra alpha penalty for pilot-selection complexity: 0</text>

  <rect x="80" y="675" width="600" height="105" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="110" y="714" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#3730a3">Balanced exact checkpoint</text>
  <text x="110" y="748" font-family="Arial, sans-serif" font-size="17" fill="#312e81">B=2, m=1: 3645 holdout per regime; exact replication 3648</text>

  <rect x="710" y="675" width="610" height="105" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="740" y="714" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9a3412">Scientific boundary</text>
  <text x="740" y="746" font-family="Arial, sans-serif" font-size="16" fill="#7c2d12">Same-data redesign, within-regime drift, model acceptance,</text>
  <text x="740" y="770" font-family="Arial, sans-serif" font-size="16" fill="#7c2d12">consciousness identification, and bridge completion are not established.</text>
</svg>
