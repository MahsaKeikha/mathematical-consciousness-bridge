<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="p88-title p88-desc">
  <title id="p88-title">P88 Complete Parity-Linear Primal-Dual Certificate</title>
  <desc id="p88-desc">What this figure shows: Proposition 88 replaces the finite four-event coefficient search of P87 with the complete real linear span of all eleven nontrivial parity coordinates. How to read it: move left to right from the finite P87 family, through the complete eleven-dimensional primal-dual linear program, to the exact rational strict witness. Main takeaway: the P87 lower bound one over 96 is strictly improved to five over 168, and matching rational primal and dual certificates prove that five over 168 is the optimum over all linear parity functionals for the witness box. Scientific status: this is a conditional exact model-separation theorem for the declared P75 family. It does not establish that parity coordinates are complete for the full law, identify consciousness, or solve the physical-to-experiential bridge.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #cfd8e6; stroke-width: 1.5; }
      .panelSoft { fill: #f3f7fb; stroke: #cfd8e6; stroke-width: 1.2; }
      .accent { fill: #173b65; }
      .accentSoft { fill: #eaf2fb; stroke: #8fb0d4; stroke-width: 1.3; }
      .success { fill: #eef8f1; stroke: #8eb89a; stroke-width: 1.3; }
      .warn { fill: #fff7e8; stroke: #d6b267; stroke-width: 1.3; }
      .ink { fill: #172235; font-family: Arial, Helvetica, sans-serif; }
      .muted { fill: #5d6a7c; font-family: Arial, Helvetica, sans-serif; }
      .white { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; }
      .section { font-size: 20px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .formula { font-size: 16px; font-weight: 700; }
      .metric { font-size: 23px; font-weight: 700; }
      .tiny { font-size: 12px; }
      .arrow { stroke: #6c87a7; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6c87a7"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <rect class="accent" x="0" y="0" width="1280" height="112"/>
  <text class="white title" x="54" y="50">P88 Complete Parity-Linear Primal-Dual Certificate</text>
  <text class="white subtitle" x="54" y="79">P88 closes the linear parity-witness class instead of enlarging another finite coefficient box.</text>

  <rect class="panel" x="48" y="144" rx="16" ry="16" width="350" height="448"/>
  <text class="ink section" x="72" y="181">1. What P87 still restricts</text>
  <text class="muted body" x="72" y="208">P87 is complete only inside a finite four-event family.</text>

  <rect class="panelSoft" x="78" y="238" rx="10" ry="10" width="290" height="76"/>
  <text class="ink label" x="98" y="266">Four nonzero parity terms</text>
  <text class="muted body" x="98" y="290">Seven of eleven coordinates are forced to zero.</text>

  <rect class="panelSoft" x="78" y="326" rx="10" ry="10" width="290" height="76"/>
  <text class="ink label" x="98" y="354">Bounded integer coefficients</text>
  <text class="muted body" x="98" y="378">Primitive coefficients satisfy 0 &lt; |c_i| &lt;= 2.</text>

  <rect class="accentSoft" x="78" y="414" rx="10" ry="10" width="290" height="76"/>
  <text class="ink label" x="98" y="442">Complete P87 family</text>
  <text class="ink formula" x="98" y="468">39,600 exact functionals</text>

  <rect class="warn" x="78" y="502" rx="10" ry="10" width="290" height="70"/>
  <text class="ink label" x="98" y="529">Open question</text>
  <text class="muted body" x="98" y="552">What is best over every real parity-linear c?</text>

  <path class="arrow" d="M406 368 C430 368, 438 368, 462 368"/>

  <rect class="panel" x="470" y="144" rx="16" ry="16" width="350" height="448"/>
  <text class="ink section" x="494" y="181">2. P88 solves the full linear class</text>
  <text class="muted body" x="494" y="207">Use all eleven nontrivial even-parity coordinates.</text>

  <rect class="accentSoft" x="500" y="232" rx="12" ry="12" width="290" height="92"/>
  <text class="ink label" x="520" y="259">Centered transfer norm</text>
  <text class="ink formula" x="520" y="285">D(c) = min_a ||A c - a 1||_1</text>
  <text class="muted body" x="520" y="307">D(c) &gt; 0 for every nonzero c in R^11.</text>

  <rect class="panelSoft" x="500" y="338" rx="12" ry="12" width="290" height="96"/>
  <text class="ink label" x="520" y="365">Exact primal LP</text>
  <text class="muted body" x="520" y="389">Maximize empirical parity support gap</text>
  <text class="muted body" x="520" y="410">over D(c) &lt;= 1 and all c in R^11.</text>

  <rect class="panelSoft" x="500" y="448" rx="12" ry="12" width="290" height="116"/>
  <text class="ink label" x="520" y="475">Exact dual certificate</text>
  <text class="muted body" x="520" y="499">lambda = convex weights on box vertices</text>
  <text class="muted body" x="520" y="520">A^T r = h(emp) - sum lambda_v h(v)</text>
  <text class="muted body" x="520" y="541">minimize ||r||_infinity with sum r = 0</text>

  <path class="arrow" d="M828 368 C850 368, 862 368, 884 368"/>

  <rect class="panel" x="892" y="144" rx="16" ry="16" width="340" height="448"/>
  <text class="ink section" x="916" y="181">3. Exact strict optimum</text>
  <text class="muted body" x="916" y="207">Same rational box and empirical law as P86-P87.</text>

  <rect class="success" x="920" y="232" rx="11" ry="11" width="284" height="64"/>
  <text class="ink label" x="940" y="258">Previous complete certificate</text>
  <text class="ink metric" x="940" y="286">L87 = 1/96</text>

  <rect class="accentSoft" x="920" y="310" rx="11" ry="11" width="284" height="112"/>
  <text class="ink label" x="940" y="337">P88 primal witness</text>
  <text class="muted body" x="940" y="361">c = (0,2,1,-1,-1,-1,2,1,</text>
  <text class="muted body" x="940" y="381">     3,-2,3)</text>
  <text class="ink formula" x="940" y="405">Q(emp) = 13/6; Q(B) in [3, 51/8]</text>

  <rect class="warn" x="920" y="436" rx="11" ry="11" width="284" height="62"/>
  <text class="ink label" x="940" y="462">Exact mismatch and transfer</text>
  <text class="ink formula" x="940" y="486">gap = 5/6; D(c) = 28</text>

  <rect class="success" x="920" y="512" rx="11" ry="11" width="284" height="60"/>
  <text class="ink label" x="940" y="538">Matching primal = dual</text>
  <text class="ink metric" x="940" y="564">L88 = 5/168</text>

  <rect class="accent" x="48" y="620" rx="14" ry="14" width="1184" height="92"/>
  <text class="white label" x="72" y="650">Scientific boundary</text>
  <text class="white body" x="72" y="676">P88 is optimal only within the complete linear span of the eleven declared parity observables for the P75 family.</text>
  <text class="white body" x="72" y="697">It does not make parity observables complete for consciousness, establish nonphysicality, or close the physical-to-experiential bridge.</text>

  <text class="muted tiny" x="48" y="742">Mathematical Consciousness Bridge | Proposition 88 | exact rational primal-dual certificate</text>
</svg>