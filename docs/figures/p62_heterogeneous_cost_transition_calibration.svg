<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">P62 exact heterogeneous-cost continuous calibration</title>
  <desc id="desc">What this figure shows: P62 solves the declared separable inverse-square-root calibration surrogate exactly in the continuous domain when each transition edge has its own positive per-observation cost. How to read it: the two upper input cards feed the central constrained problem, which then feeds the unique strict-convexity optimum. From the theorem panel, follow the three lower branches to the optimal measurement-count law, the distinct optimal budget-share law, and the exact target-budget threshold. Main takeaway: expensive edges receive fewer observations all else equal, yet can still consume more total budget because sample count and budget share scale with different powers of cost. P62 is a continuous theorem; heterogeneous integer counts are a separate P63 problem. Scientific status: Continuous resource-allocation theorem for the declared calibration surrogate. It does not validate the full robust-route uncertainty model, identify an operational variable with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Arial,sans-serif;fill:#475569}
      .head{font:700 18px Arial,sans-serif;fill:#0f172a}
      .copy{font:400 15px Arial,sans-serif;fill:#334155}
      .small{font:400 14px Arial,sans-serif;fill:#475569}
      .eq{font:600 16px Georgia,'Times New Roman',serif;fill:#0f172a}
      .strong{font:700 17px Arial,sans-serif;fill:#0f172a}
      .route{font:700 13px Arial,sans-serif;fill:#475569}
      .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="1000" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P62  Exact heterogeneous-cost continuous calibration</text>
  <text x="60" y="90" class="subtitle">Balance uncertainty importance against per-observation cost under one shared continuous budget.</text>

  <g id="block-importance" data-x="55" data-y="130" data-w="330" data-h="200">
    <rect x="55" y="130" width="330" height="200" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="168" class="head">Input A: edge importance</text>
    <text x="80" y="210" class="strong">bₑ = wₑ aₑ &gt; 0</text>
    <text x="80" y="249" class="copy">aₑ: estimation difficulty</text>
    <text x="80" y="274" class="copy">wₑ: declared sensitivity weight</text>
    <text x="80" y="303" class="small">Larger bₑ favors more</text>
    <text x="80" y="324" class="small">calibration effort.</text>
  </g>

  <g id="block-problem" data-x="435" data-y="130" data-w="330" data-h="200">
    <rect x="435" y="130" width="330" height="200" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="460" y="168" class="head">1. Continuous problem</text>
    <text x="460" y="208" class="eq">min Σₑ bₑ / √nₑ</text>
    <text x="460" y="242" class="eq">Σₑ cₑnₑ = B</text>
    <text x="460" y="276" class="eq">nₑ &gt; 0,  B &gt; 0</text>
    <text x="460" y="310" class="small">Strictly convex on the positive orthant.</text>
  </g>

  <g id="block-cost" data-x="815" data-y="130" data-w="330" data-h="200">
    <rect x="815" y="130" width="330" height="200" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="840" y="168" class="head">Input B: per-observation cost</text>
    <text x="840" y="210" class="strong">cₑ &gt; 0</text>
    <text x="840" y="249" class="copy">Time, equipment, stabilization,</text>
    <text x="840" y="274" class="copy">or operator burden may differ.</text>
    <text x="840" y="309" class="small">Larger cₑ discourages sample count.</text>
  </g>

  <path id="arrow-1" class="arrow" d="M385 230 H435" data-source="block-importance" data-target="block-problem"/>
  <path id="arrow-2" class="arrow" d="M815 230 H765" data-source="block-cost" data-target="block-problem"/>

  <text x="600" y="370" class="route" text-anchor="middle">strict-convexity and Lagrange-multiplier solution</text>

  <g id="block-optimum" data-x="120" data-y="390" data-w="960" data-h="225">
    <rect x="120" y="390" width="960" height="225" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="600" y="428" text-anchor="middle" class="head">2. Unique exact continuous optimum</text>
    <text x="600" y="468" text-anchor="middle" class="eq">T = Σⱼ bⱼ^(2/3)cⱼ^(1/3)</text>
    <text x="600" y="505" text-anchor="middle" class="strong">nₑ* = (B/T) bₑ^(2/3)cₑ^(-2/3)</text>
    <text x="600" y="544" text-anchor="middle" class="strong">U*(B) = T^(3/2) / √B</text>
    <text x="600" y="581" text-anchor="middle" class="copy">Strict convexity makes this stationary point the unique global continuous optimum.</text>
  </g>

  <path id="arrow-3" class="arrow" d="M600 330 V390" data-source="block-problem" data-target="block-optimum"/>

  <g id="block-count" data-x="55" data-y="680" data-w="330" data-h="170">
    <rect x="55" y="680" width="330" height="170" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="718" class="head">3. Measurement-count law</text>
    <text x="80" y="760" class="eq">nₑ* ∝ bₑ^(2/3)cₑ^(-2/3)</text>
    <text x="80" y="798" class="small">For equal bₑ, an 8x cost gives</text>
    <text x="80" y="822" class="small">one quarter as many observations.</text>
  </g>

  <g id="block-share" data-x="435" data-y="680" data-w="330" data-h="170">
    <rect x="435" y="680" width="330" height="170" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="460" y="718" class="head">4. Budget-share law</text>
    <text x="460" y="760" class="eq">cₑnₑ* ∝ bₑ^(2/3)cₑ^(1/3)</text>
    <text x="460" y="798" class="small">For equal bₑ, an 8x cost can use</text>
    <text x="460" y="822" class="small">twice the total budget.</text>
  </g>

  <g id="block-target" data-x="815" data-y="680" data-w="330" data-h="170">
    <rect x="815" y="680" width="330" height="170" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="840" y="718" class="head">5. Target-budget threshold</text>
    <text x="840" y="757" class="eq">U*(B) ≤ ε</text>
    <text x="840" y="789" class="strong">iff B ≥ T^3 / ε^2</text>
    <text x="840" y="820" class="small">A ceiling can integerize total cost.</text>
    <text x="840" y="842" class="small">Per-edge integer counts are P63.</text>
  </g>

  <path id="arrow-4" class="arrow" d="M300 615 V650 H220 V680" data-source="block-optimum" data-target="block-count"/>
  <path id="arrow-5" class="arrow" d="M600 615 V680" data-source="block-optimum" data-target="block-share"/>
  <path id="arrow-6" class="arrow" d="M900 615 V650 H980 V680" data-source="block-optimum" data-target="block-target"/>

  <g id="block-boundary" data-x="90" data-y="870" data-w="1020" data-h="125">
    <rect x="90" y="870" width="1020" height="125" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="118" y="898" class="head">Scope and scientific boundary</text>
    <text x="118" y="922" class="small">If cₑ = c for every edge, P62 reduces exactly to P59 with interchangeable count N = B/c.</text>
    <text x="118" y="944" class="small">Fractional nₑ are continuous design variables; heterogeneous integer counts are the separate P63 problem.</text>
    <text x="118" y="966" class="small">P62 does not validate full robust-route uncertainty or identify an operational variable with consciousness.</text>
    <text x="118" y="988" class="small">It does not establish a physical-to-experiential bridge or imply quantum incompleteness.</text>
  </g>
</svg>
