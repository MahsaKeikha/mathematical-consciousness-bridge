<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">P62 heterogeneous cost transition calibration allocation</title>
  <desc id="desc">A publication-safe diagram showing how uncertainty importance and per-measurement cost determine the exact continuous calibration allocation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#334155"/>
    </marker>
    <style>
      .h1{font:700 40px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .sub{font:400 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
      .bt{font:700 25px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .tx{font:400 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155}
      .math{font:600 20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f172a}
      .small{font:400 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}
      .arrow{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
      .card{stroke-width:2}
    </style>
  </defs>

  <rect width="1800" height="1050" rx="28" fill="#f8fafc"/>
  <text x="70" y="70" class="h1">P62: When some measurements cost more than others</text>
  <text x="70" y="112" class="sub">The exact continuous design balances uncertainty, scientific importance, and the actual cost of each transition measurement.</text>

  <g id="p62-importance" data-qa-block="true" data-x="70" data-y="175" data-width="500" data-height="250">
    <rect class="card" x="70" y="175" width="500" height="250" rx="22" fill="#ffffff" stroke="#94a3b8"/>
    <text x="115" y="222" class="bt">1. Why measure an edge?</text>
    <text x="115" y="272" class="math">bₑ = wₑ aₑ</text>
    <text x="115" y="315" class="tx">aₑ: edge estimation difficulty</text>
    <text x="115" y="347" class="tx">wₑ: uncertainty importance</text>
    <text x="115" y="392" class="small">Larger bₑ favors more measurements.</text>
  </g>

  <g id="p62-cost" data-qa-block="true" data-x="650" data-y="175" data-width="500" data-height="250">
    <rect class="card" x="650" y="175" width="500" height="250" rx="22" fill="#fff7ed" stroke="#f97316"/>
    <text x="695" y="222" class="bt">2. What does it cost?</text>
    <text x="695" y="272" class="math">cost per observation = cₑ</text>
    <text x="695" y="315" class="tx">Setup and stabilization vary.</text>
    <text x="695" y="347" class="tx">Time or equipment can differ.</text>
    <text x="695" y="392" class="small">Larger cₑ favors fewer observations.</text>
  </g>

  <g id="p62-budget" data-qa-block="true" data-x="1230" data-y="175" data-width="500" data-height="250">
    <rect class="card" x="1230" y="175" width="500" height="250" rx="22" fill="#eef2ff" stroke="#6366f1"/>
    <text x="1275" y="222" class="bt">3. Hard total budget</text>
    <text x="1275" y="272" class="math">Σₑ cₑ nₑ = B</text>
    <text x="1275" y="315" class="tx">All measurements share one common</text>
    <text x="1275" y="347" class="tx">time, money, or capacity budget.</text>
    <text x="1275" y="392" class="small">Continuous nₑ is the exact relaxation.</text>
  </g>

  <path d="M570 300 H638" class="arrow" data-from="p62-importance" data-to="p62-cost"/>
  <path d="M1150 300 H1218" class="arrow" data-from="p62-cost" data-to="p62-budget"/>

  <g id="p62-optimum" data-qa-block="true" data-x="245" data-y="520" data-width="1310" data-height="250">
    <rect class="card" x="245" y="520" width="1310" height="250" rx="24" fill="#ecfdf5" stroke="#10b981"/>
    <text x="295" y="570" class="bt">4. Exact P62 continuous optimum</text>
    <text x="295" y="625" class="math">T = Σⱼ bⱼ^(2/3) cⱼ^(1/3)</text>
    <text x="295" y="675" class="math">nₑ* = (B/T) bₑ^(2/3) cₑ^(-2/3)</text>
    <text x="975" y="675" class="math">U*(B) = T^(3/2) / √B</text>
    <text x="295" y="725" class="small">Strict convexity makes this the unique global continuous optimum.</text>
  </g>

  <path d="M900 425 V508" class="arrow" data-from="p62-cost" data-to="p62-optimum"/>

  <g id="p62-count" data-qa-block="true" data-x="120" data-y="845" data-width="710" data-height="145">
    <rect class="card" x="120" y="845" width="710" height="145" rx="20" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="165" y="892" class="bt">Measurement count</text>
    <text x="165" y="928" class="math">nₑ* ∝ bₑ^(2/3) cₑ^(-2/3)</text>
    <text x="165" y="958" class="tx">More expensive edges receive fewer observations.</text>
  </g>

  <g id="p62-share" data-qa-block="true" data-x="970" data-y="845" data-width="710" data-height="145">
    <rect class="card" x="970" y="845" width="710" height="145" rx="20" fill="#fff7ed" stroke="#f97316"/>
    <text x="1015" y="892" class="bt">Budget share</text>
    <text x="1015" y="928" class="math">cₑ nₑ* ∝ bₑ^(2/3) cₑ^(1/3)</text>
    <text x="1015" y="958" class="tx">Expensive edges may still use more total budget.</text>
  </g>

  <path d="M560 770 C520 815 475 820 475 833" class="arrow" data-from="p62-optimum" data-to="p62-count"/>
  <path d="M1240 770 C1280 815 1325 820 1325 833" class="arrow" data-from="p62-optimum" data-to="p62-share"/>

  <text x="900" y="1025" text-anchor="middle" class="small">Boundary: P62 solves a declared continuous calibration surrogate. Heterogeneous cost integer allocation is a separate discrete problem.</text>
</svg>
