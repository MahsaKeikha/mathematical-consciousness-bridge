<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Proposition 19 fundamental physical sufficiency and residual tests</title>
  <desc id="desc">A publication-style theorem map showing a candidate fundamental state, a declared physical descriptor, an independently defined target descriptor, exact factorization, conditional-information residuals, and a differential no-go criterion.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0 0 L0 8 L10 4 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 36px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .head{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .body{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .small{font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}
      .label{font:700 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.7px;fill:#64748b}
      .eq{font:600 17px Georgia,'Times New Roman',serif;fill:#0f172a}
      .arrow{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="70" y="62" class="title">P19 — Fundamental Physical Sufficiency and Residual Tests</text>
  <text x="70" y="96" class="subtitle">Test whether an independently defined target is fixed by the declared physical descriptor before adding a new primitive.</text>

  <rect x="570" y="145" width="460" height="120" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="800" y="183" class="head" text-anchor="middle">Candidate fundamental state</text>
  <text x="800" y="222" class="eq" text-anchor="middle">Ω ∈ 𝓜</text>
  <text x="800" y="247" class="small" text-anchor="middle">No preferred metaphysics is assumed by the theorem.</text>

  <path class="arrow" d="M800 265 V315 H400 V350"/>
  <path class="arrow" d="M800 265 V315 H1200 V350"/>

  <rect x="135" y="350" width="530" height="180" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="165" y="386" class="label">DECLARED PHYSICAL DESCRIPTOR</text>
  <text x="165" y="425" class="eq">T(Ω) = (G(Ω), Q(Ω), C(Ω))</text>
  <text x="165" y="463" class="body">Geometry, quantum-operational predictions, and</text>
  <text x="165" y="487" class="body">intervention-resolved causal structure may enter T.</text>
  <text x="165" y="512" class="small">The theorem also applies to any other declared physical descriptor.</text>

  <rect x="935" y="350" width="530" height="180" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="965" y="386" class="label">INDEPENDENT TARGET DESCRIPTOR</text>
  <text x="965" y="425" class="eq">E : 𝓜 → 𝓠E</text>
  <text x="965" y="463" class="body">For an experiential application, E must be defined</text>
  <text x="965" y="487" class="body">independently of the physical descriptor T.</text>
  <text x="965" y="512" class="small">Otherwise the bridge becomes definitional rather than explanatory.</text>

  <path class="arrow" d="M400 530 V600 H535"/>
  <path class="arrow" d="M1200 530 V600 H1065"/>

  <rect x="200" y="600" width="380" height="190" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="230" y="636" class="head">P19A · Exact factorization</text>
  <text x="230" y="677" class="eq">E = BT ∘ T</text>
  <text x="230" y="715" class="body">iff E is constant on every fiber of T.</text>
  <text x="230" y="754" class="eq">T(Ω)=T(Ω′) ⇒ E(Ω)=E(Ω′)</text>

  <rect x="610" y="600" width="380" height="190" rx="18" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="640" y="636" class="head">P19C · Stochastic criterion</text>
  <text x="640" y="677" class="eq">E ⟂ Ω | T</text>
  <text x="640" y="715" class="body">For finite alphabets this is equivalent to</text>
  <text x="640" y="754" class="eq">I(E;Ω | T) = 0</text>

  <rect x="1020" y="600" width="380" height="190" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="1050" y="636" class="head">P19D · Differential no-go</text>
  <text x="1050" y="677" class="eq">d⊥ = rank D(T,E) − rank DT</text>
  <text x="1050" y="715" class="body">A local smooth factorization requires d⊥=0.</text>
  <text x="1050" y="754" class="eq">d⊥ &gt; 0 ⇒ no local smooth factorization</text>

  <rect x="135" y="835" width="1330" height="100" rx="15" fill="#0f172a"/>
  <text x="165" y="868" style="font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.7px;fill:#cbd5e1">SCIENTIFIC INTERPRETATION RULE</text>
  <text x="165" y="898" style="font:600 14px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc">A residual first challenges the completeness of the declared physical descriptor.</text>
  <text x="165" y="922" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1">Measurement error, omitted physics, system boundaries, timescale, and intervention coverage must be tested before introducing a new primitive.</text>
</svg>