<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">P93 Localized Finite-Sample Sign-Coherence Rejection</title>
<desc id="desc">What this figure shows: P93 converts the P92 nonlinear three-minor sign-coherence obstruction into a finite-sample rejection rule using only seven observable cells. The established profile has determinant signs minus, plus, plus and exact sign-stability radii one over twenty-four, three over fifty-six, and five over seventy-two. At 95 percent confidence, the seven-cell Hoeffding radius crosses the limiting one-over-twenty-four boundary between sample sizes 1622 and 1623, while the first exact replication of the original 24-count profile that clears the certificate is 1632. A separate generic P77 fixed-margin sufficient condition crosses at 7444. Scientific status: this is a conditional finite-sample rejection theorem for the declared P75 family under IID sampling; it does not identify consciousness, establish nonphysicality, or close the physical-to-experiential bridge.</desc>
<rect width="1440" height="900" fill="#ffffff"/>
<text x="72" y="72" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#111827">P93 · Localized finite-sample sign-coherence rejection</text>
<text x="72" y="116" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#374151">P92 supplies the nonlinear invariant. P93 asks how much finite IID data are needed to certify its violation.</text>

<rect x="58" y="158" width="414" height="554" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="88" y="204" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">1 · Localize the confidence event</text>
<text x="88" y="246" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">The three P92 minors use only 7 cells.</text>
<rect x="92" y="282" width="344" height="88" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="264" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">Simultaneous seven-cell radius</text>
<text x="264" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">eps = sqrt(log(14/alpha)/(2n))</text>
<text x="88" y="414" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">One Hoeffding event controls every cell</text>
<text x="88" y="444" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">appearing in the nonlinear witness.</text>
<line x1="88" y1="486" x2="442" y2="486" stroke="#cbd5e1" stroke-width="2"/>
<text x="88" y="530" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111827">Reject when both hold:</text>
<text x="104" y="570" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">• empirical determinant product &lt; 0</text>
<text x="104" y="604" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">• certified eps &lt; smallest sign radius</text>
<text x="88" y="658" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Then the unknown population keeps the</text>
<text x="88" y="684" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">same impossible determinant sign pattern.</text>

<rect x="493" y="158" width="414" height="554" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="523" y="204" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">2 · Exact P92 sign geometry</text>
<text x="523" y="246" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Established empirical determinant signs:</text>
<rect x="527" y="282" width="108" height="78" rx="14" fill="#ffffff" stroke="#94a3b8"/>
<rect x="646" y="282" width="108" height="78" rx="14" fill="#ffffff" stroke="#94a3b8"/>
<rect x="765" y="282" width="108" height="78" rx="14" fill="#ffffff" stroke="#94a3b8"/>
<text x="581" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">D1</text>
<text x="700" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">D2</text>
<text x="819" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">D3</text>
<text x="581" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">-1/48</text>
<text x="700" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">1/64</text>
<text x="819" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">5/192</text>
<text x="523" y="408" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Exact sign-stability radii:</text>
<text x="545" y="451" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#111827">r1 = 1/24</text>
<text x="545" y="488" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#111827">r2 = 3/56</text>
<text x="545" y="525" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#111827">r3 = 5/72</text>
<rect x="527" y="566" width="346" height="100" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="700" y="604" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">Limiting observed radius</text>
<text x="700" y="642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">r_min = 1/24</text>

<rect x="928" y="158" width="454" height="554" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="958" y="204" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">3 · Exact 95% threshold audit</text>
<text x="958" y="246" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">P79 certifies the radius direction exactly.</text>
<rect x="962" y="282" width="186" height="92" rx="16" fill="#ffffff" stroke="#94a3b8"/>
<rect x="1160" y="282" width="186" height="92" rx="16" fill="#ffffff" stroke="#94a3b8"/>
<text x="1055" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">n = 1622</text>
<text x="1253" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">n = 1623</text>
<text x="1055" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111827">eps &gt; 1/24</text>
<text x="1253" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111827">eps &lt; 1/24</text>
<text x="958" y="424" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">First exact replication of 24-count profile:</text>
<text x="958" y="466" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">n = 1632 = 68 x 24</text>
<line x1="958" y1="510" x2="1350" y2="510" stroke="#cbd5e1" stroke-width="2"/>
<text x="958" y="554" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">Separate generic P77 fixed-margin bound:</text>
<text x="958" y="594" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#111827">n = 7444</text>
<text x="958" y="634" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Different guarantee: P77 is full-law and generic.</text>
<text x="958" y="659" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">P93 is localized to the observed P92 sign witness.</text>

<rect x="58" y="752" width="1324" height="106" rx="24" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="88" y="794" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#111827">Scientific interpretation</text>
<text x="306" y="794" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">P93 turns P92's exact nonlinear population obstruction into a finite-data rejection certificate.</text>
<text x="88" y="831" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Non-rejection remains inconclusive. The result tests one declared statistical model family and does not identify consciousness or close the physical-to-experiential bridge.</text>
</svg>
