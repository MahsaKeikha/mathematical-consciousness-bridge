<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P79 Joint Statistical-Computational Power</title>
  <desc id="desc">A schematic of the P79 full-law rejection power theorem. The left panel shows the three-way decision from a certified empirical model-distance bracket and the P77 sampling radius. The center panel decomposes the required population separation into an alpha rejection radius, a beta alternative concentration radius, and the P78 certified optimization gap. The right panel shows how sample size and optimization accuracy trade against a declared separation margin.</desc>

  <rect x="0" y="0" width="1200" height="760" rx="22" fill="#f8fafc"/>
  <rect x="36" y="32" width="1128" height="696" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="70" y="82" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#0f172a">P79 Joint Statistical-Computational Power</text>
  <text x="70" y="114" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">A joint sample-size and certified-computation budget for P77-P78 full-law rejection</text>

  <rect x="70" y="150" width="318" height="408" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="96" y="188" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">1. Three-way certified decision</text>
  <text x="96" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Certified bracket: L  &lt;=  d_inf(P_hat,M)  &lt;=  U</text>

  <line x1="110" y1="285" x2="344" y2="285" stroke="#475569" stroke-width="4"/>
  <circle cx="170" cy="285" r="7" fill="#6366f1"/>
  <circle cx="286" cy="285" r="7" fill="#10b981"/>
  <line x1="230" y1="253" x2="230" y2="317" stroke="#ef4444" stroke-width="3"/>
  <text x="160" y="267" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#4338ca">L</text>
  <text x="281" y="267" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#047857">U</text>
  <text x="218" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">r</text>

  <rect x="96" y="365" width="266" height="48" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="113" y="395" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#991b1b">L &gt; r  :  certified rejection</text>

  <rect x="96" y="427" width="266" height="48" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="113" y="457" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#065f46">U &lt;= r  :  explicit overlap witness</text>

  <rect x="96" y="489" width="266" height="48" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="113" y="519" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#9a3412">L &lt;= r &lt; U  :  unresolved bracket</text>

  <rect x="421" y="150" width="350" height="408" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="447" y="188" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">2. Separation budget</text>
  <text x="447" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Sufficient power condition</text>

  <rect x="455" y="250" width="282" height="70" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="474" y="279" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#312e81">Population separation Delta_0</text>
  <text x="474" y="303" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4338ca">must exceed all three error budgets</text>

  <rect x="455" y="350" width="84" height="104" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="475" y="385" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#991b1b">eps_a</text>
  <text x="470" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b91c1c">Type I</text>
  <text x="465" y="433" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b91c1c">radius</text>

  <text x="547" y="408" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#475569">+</text>

  <rect x="570" y="350" width="84" height="104" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="590" y="385" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#164e63">eps_b</text>
  <text x="585" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0e7490">power</text>
  <text x="585" y="433" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0e7490">radius</text>

  <text x="662" y="408" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#475569">+</text>

  <rect x="685" y="350" width="52" height="104" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="703" y="385" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#9a3412">eta</text>
  <text x="694" y="413" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c2410c">P78</text>
  <text x="691" y="431" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c2410c">gap</text>

  <text x="468" y="493" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Delta_0 &gt; eps_a + eps_b + eta</text>
  <text x="468" y="521" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">Type I &lt;= alpha, power &gt;= 1-beta</text>

  <rect x="804" y="150" width="326" height="408" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="830" y="188" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">3. Sample-computation tradeoff</text>
  <text x="830" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">For fixed Delta_0, alpha, beta</text>

  <line x1="850" y1="480" x2="1088" y2="480" stroke="#64748b" stroke-width="2"/>
  <line x1="850" y1="480" x2="850" y2="260" stroke="#64748b" stroke-width="2"/>
  <text x="924" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">sample size n</text>
  <text x="816" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">required</text>
  <text x="814" y="265" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">margin</text>

  <path d="M872 300 C925 346 972 390 1068 445" fill="none" stroke="#6366f1" stroke-width="4"/>
  <line x1="850" y1="440" x2="1088" y2="440" stroke="#f97316" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="870" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#4338ca">eps_a + eps_b + eta</text>
  <text x="962" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Delta_0</text>
  <circle cx="1076" cy="440" r="7" fill="#16a34a"/>
  <text x="876" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Smaller eta leaves more margin</text>
  <text x="876" y="557" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">for statistical uncertainty.</text>

  <rect x="70" y="590" width="1060" height="92" rx="16" fill="#0f172a"/>
  <text x="98" y="624" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Prospective guarantee, not model acceptance</text>
  <text x="98" y="653" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2e8f0">Delta_0 must be prespecified or independently justified. Failure of the sufficient inequality does not prove low power.</text>

  <text x="70" y="716" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">P79 budgets statistical and certified computational uncertainty. It does not identify consciousness. The physical-to-experiential bridge remains open.</text>
</svg>