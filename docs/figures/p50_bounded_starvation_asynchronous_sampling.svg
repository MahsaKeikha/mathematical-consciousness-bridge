<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Proposition 50: Bounded-starvation asynchronous sampling</title>
  <desc id="desc">What this figure shows: Proved global-round stopping theorem for asynchronous priority-based sampling under an explicit bounded-starvation condition.. Visible guideposts include: Priority-based sampling remains finite-time certifiable when every still-active preparation receives service within H rounds.; Adaptive priority scheduler; One active preparation is selected per global round.; a; b; c. How to read it: follow the diagram in the direction of its arrows and use each box, panel, inequality, or highlighted region only with the meaning printed beside it. Main takeaway: this is the visual companion to Proposition 50; the proposition document supplies the assumptions, proof, and exact scope of every implication. Scientific status: Proposition 50 theorem/certificate visual. It is not independent empirical evidence and does not, by itself, identify a physical or latent variable with consciousness.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box-title { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .math { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .small { font: 400 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .flow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #dc2626; stroke-width: 2.2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .node { stroke: #64748b; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P50: Bounded-starvation asynchronous sampling</text>
  <text x="60" y="88" class="subtitle">Priority-based sampling remains finite-time certifiable when every still-active preparation receives service within H rounds.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="128" width="300" height="160" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="82" y="163" class="box-title">Adaptive priority scheduler</text>
    <text x="82" y="195" class="body">One active preparation is selected per global round.</text>
    <circle cx="112" cy="238" r="16" fill="#e2e8f0" class="node"/>
    <circle cx="165" cy="238" r="16" fill="#dbeafe" class="node"/>
    <circle cx="218" cy="238" r="16" fill="#e2e8f0" class="node"/>
    <circle cx="271" cy="238" r="16" fill="#e2e8f0" class="node"/>
    <text x="104" y="243" class="small">a</text>
    <text x="157" y="243" class="small">b</text>
    <text x="210" y="243" class="small">c</text>
    <text x="263" y="243" class="small">d</text>
    <text x="82" y="273" class="small">Priority may depend on P45-P49 evidence.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="128" width="300" height="160" rx="18" fill="#eef2ff" stroke="#6366f1"/>
    <text x="477" y="163" class="box-title">H-fair starvation guard</text>
    <text x="477" y="195" class="body">If vertex i stays active for every round in any H-block,</text>
    <text x="477" y="225" class="math">i must be sampled ≥ 1 time</text>
    <text x="477" y="255" class="small">Unequal service is allowed; indefinite omission is not.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="845" y="128" width="300" height="160" rx="18" fill="#ecfdf5" stroke="#10b981"/>
    <text x="872" y="163" class="box-title">Local-count growth</text>
    <text x="872" y="198" class="math">Nᵢ(T) ≥ ⌊T/H⌋</text>
    <text x="872" y="232" class="math">T = HN ⇒ Nᵢ(T) ≥ N</text>
    <text x="872" y="262" class="small">Valid for any vertex active throughout those rounds.</text>
  </g>

  <path d="M355 208 L450 208" class="flow"/>
  <path d="M750 208 L845 208" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="75" y="360" width="485" height="155" rx="19" fill="#ecfdf5" stroke="#10b981"/>
    <text x="105" y="398" class="box-title">Positive witness exists</text>
    <text x="105" y="432" class="math">K₊ = min{Nₑ : Mₑ &gt; 0}</text>
    <text x="105" y="465" class="math">τ₊,H ≤ H K₊</text>
    <text x="105" y="494" class="body">A true positive edge cannot be pruned on the P47 good event, so both endpoints keep receiving H-fair service.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="360" width="485" height="155" rx="19" fill="#fff7ed" stroke="#f97316"/>
    <text x="670" y="398" class="box-title">Every declared edge is negative</text>
    <text x="670" y="432" class="math">K₋ = max{Nₑ : e ∈ E}</text>
    <text x="670" y="465" class="math">τ₀,H ≤ H K₋</text>
    <text x="670" y="494" class="body">Each edge is either eliminated early or accumulates enough endpoint samples to force a negative upper margin.</text>
  </g>

  <path d="M995 288 C925 320 480 320 320 360" class="flow"/>
  <path d="M995 288 C1010 320 940 335 880 360" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="80" y="585" width="490" height="110" rx="18" fill="#fee2e2" stroke="#ef4444"/>
    <text x="110" y="621" class="box-title">Without a progress condition</text>
    <text x="110" y="653" class="math">Nᵢ(t) can remain 0 for arbitrary t</text>
    <text x="110" y="678" class="small">P47 validity survives, but no finite global stopping-time bound follows from P48 local thresholds alone.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="585" width="490" height="110" rx="18" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="660" y="621" class="box-title">Composition with P49</text>
    <text x="660" y="653" class="math">H D(Nₑ) &lt; 2 H Nₑ</text>
    <text x="660" y="678" class="small">Dyadic certification batching and asynchronous fairness factors compose multiplicatively.</text>
  </g>

  <path d="M450 288 C330 320 230 520 260 585" class="dashed"/>
  <path d="M845 288 C760 350 805 520 820 585" class="flow"/>

  <text x="60" y="735" class="small">Scientific boundary: P50 converts local precision requirements into global scheduling bounds; it does not strengthen the underlying regularity witness into an ontological or experiential claim.</text>
</svg>
