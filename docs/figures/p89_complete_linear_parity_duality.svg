<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="p89-title p89-desc">
  <title id="p89-title">P89 Complete Linear Parity-Functional Duality Certificate</title>
  <desc id="p89-desc">What this figure shows: Proposition 89 removes the finite coefficient-radius and four-observable support restrictions of P88 by optimizing over every real linear functional of all eleven canonical P83 parity coordinates. Exact finite-dimensional duality matches a linear-functional lower certificate to a convex box-vertex plus zero-mass perturbation upper certificate. On the established exact rational witness, coefficients (0,-2,-1,1,1,1,-2,-1,-3,2,-3) give empirical value -13/6 outside the exact P75 interval [-51/8,-3], with gap 5/6 and centered norm 28, producing 5/168. A matching signed perturbation has infinity norm 5/168, proving this is the exact unrestricted linear-parity optimum and strictly improving P88 = 1/64. This remains a conditional model-separation theorem and does not identify consciousness, establish nonphysicality, or solve the physical-to-experiential bridge.</desc>
