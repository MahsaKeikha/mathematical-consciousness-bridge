    <style>
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#cfd8e6;stroke-width:1.5}.soft{fill:#f3f7fb;stroke:#cfd8e6;stroke-width:1.2}.accent{fill:#173b65}.accentSoft{fill:#eaf2fb;stroke:#8fb0d4;stroke-width:1.3}.success{fill:#eef8f1;stroke:#8eb89a;stroke-width:1.3}.warn{fill:#fff7e8;stroke:#d6b267;stroke-width:1.3}.ink{fill:#172235;font-family:Arial,Helvetica,sans-serif}.muted{fill:#5d6a7c;font-family:Arial,Helvetica,sans-serif}.white{fill:#fff;font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px}.section{font-size:20px;font-weight:700}.label{font-size:15px;font-weight:700}.body{font-size:14px}.formula{font-size:16px;font-weight:700}.metric{font-size:23px;font-weight:700}.tiny{font-size:12px}.arrow{stroke:#6c87a7;stroke-width:2;fill:none;marker-end:url(#arrowhead)}
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6c87a7"/></marker>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <rect class="accent" width="1280" height="112"/>
  <text class="white title" x="54" y="50">P89 Complete Linear Parity-Functional Duality Certificate</text>
  <text class="white subtitle" x="54" y="79">Close the entire real linear direction space on all 11 canonical parity observables, not another finite coefficient box.</text>

  <rect class="panel" x="48" y="144" rx="16" width="350" height="448"/>
  <text class="ink section" x="72" y="181">1. Remove P88 restrictions</text>
  <text class="muted body" x="72" y="210">P88: exactly four parity coordinates</text>
  <text class="muted body" x="72" y="232">and primitive integer coefficients |cᵢ| ≤ 3.</text>
  <rect class="accentSoft" x="78" y="262" rx="12" width="290" height="98"/>
  <text class="ink label" x="98" y="290">P89 coefficient space</text>
  <text class="ink formula" x="98" y="320">c ∈ R¹¹ \ {0}</text>
  <text class="muted body" x="98" y="344">arbitrary support · arbitrary magnitude</text>
  <rect class="soft" x="78" y="382" rx="12" width="290" height="96"/>
  <text class="ink label" x="98" y="410">Exact P75 interval</text>
  <text class="ink formula" x="98" y="438">Iᴮ(c) = [minᵥ cᵀv, maxᵥ cᵀv]</text>
  <text class="muted body" x="98" y="461">box-vertex support is exact by multi-affinity</text>
  <rect class="success" x="78" y="500" rx="12" width="290" height="56"/>
  <text class="ink label" x="98" y="524">Complete linear class</text>
  <text class="ink formula" x="98" y="548">no coefficient-radius ceiling</text>

  <path class="arrow" d="M406 368 C430 368,438 368,462 368"/>
  <rect class="panel" x="470" y="144" rx="16" width="350" height="448"/>
  <text class="ink section" x="494" y="181">2. Matching exact duality</text>
  <text class="muted body" x="494" y="210">Lower side: one unrestricted linear functional.</text>
  <text class="muted body" x="494" y="232">Upper side: convex vertices + zero-mass δ.</text>
  <rect class="soft" x="500" y="260" rx="12" width="290" height="94"/>
  <text class="ink label" x="520" y="289">Centered transfer norm</text>
  <text class="ink formula" x="520" y="318">D(c)=minₐ Σₓ|(Ac)ₓ−a|</text>
  <text class="muted body" x="520" y="341">full-law L∞ transfer remains exact</text>
  <rect class="accentSoft" x="500" y="376" rx="12" width="290" height="100"/>
  <text class="ink label" x="520" y="404">Universal upper certificate</text>
  <text class="ink formula" x="520" y="433">ŷ = Σᵣ λᵣvʳ + Aᵀδ</text>
  <text class="ink formula" x="520" y="457">1ᵀδ = 0</text>
  <text class="muted body" x="520" y="474">⇒ every linear bound ≤ ||δ||∞</text>
  <rect class="success" x="500" y="496" rx="12" width="290" height="60"/>
  <text class="ink label" x="520" y="522">Finite LP strong duality</text>
  <text class="ink formula" x="520" y="546">Llin(B) = RB(ŷ)</text>

  <path class="arrow" d="M828 368 C850 368,862 368,884 368"/>
  <rect class="panel" x="892" y="144" rx="16" width="340" height="448"/>
  <text class="ink section" x="916" y="181">3. Exact strict witness</text>
  <text class="muted body" x="916" y="210">c = (0,−2,−1,1,1,1,−2,−1,−3,2,−3)</text>
  <rect class="soft" x="920" y="246" rx="11" width="284" height="84"/>
  <text class="ink label" x="940" y="272">Empirical / exact P75 interval</text>
  <text class="ink formula" x="940" y="298">Q(emp) = −13/6</text>
  <text class="ink formula" x="940" y="319">Q(P75 box) ∈ [−51/8, −3]</text>
  <rect class="warn" x="920" y="346" rx="11" width="284" height="64"/>
  <text class="ink label" x="940" y="372">Exact lower certificate</text>
  <text class="ink metric" x="940" y="401">gap 5/6 · D = 28</text>
  <rect class="accentSoft" x="920" y="426" rx="11" width="284" height="58"/>
  <text class="ink label" x="940" y="452">Matching upper radius</text>
  <text class="ink metric" x="940" y="477">||δ||∞ = 5/168</text>
  <rect class="success" x="920" y="500" rx="11" width="284" height="64"/>
  <text class="ink label" x="940" y="526">Exact complete-linear optimum</text>
  <text class="ink metric" x="940" y="555">1/64 &lt; 5/168</text>

  <rect class="accent" x="48" y="620" rx="14" width="1184" height="92"/>
  <text class="white label" x="72" y="650">Scientific boundary</text>
  <text class="white body" x="72" y="676">P89 is complete for real linear combinations of the 11 declared parity observables on the stated P75 box. It is not complete for all nonlinear</text>
  <text class="white body" x="72" y="697">model constraints, and it does not identify consciousness, establish nonphysicality, or solve the physical-to-experiential bridge.</text>
  <text class="muted tiny" x="48" y="742">Mathematical Consciousness Bridge | Proposition 89 | exact rational matching certificate</text>
