<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">P65 lower-bounded heterogeneous calibration</title>
  <desc id="desc">What this figure shows: P65 removes the regime restriction in P64 by solving the heterogeneous-cost continuous allocation problem with the mandatory one-observation lower bound built in before rounding. How to read it: move left to right across the top row from the P64 failure mode to the constrained P65 problem and its thresholded active set. The two center arrows then feed the exact lower-bounded water-filling theorem. From that theorem, follow the two lower arrows to the baseline-safe integer floor and its certified objective-quality bound. Main takeaway: the continuous P65 allocation is uniquely optimal for the declared lower-bounded problem; flooring it is always feasible and is certified within an instance-specific factor no worse than square-root two, but the floor is not claimed to be the exact unrestricted integer optimum. Scientific status: Calibration resource-allocation theorem for the declared separable surrogate. It does not identify a calibration variable with consciousness, establish a physical-to-experiential bridge, or imply that quantum mechanics is incomplete.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Arial,sans-serif;fill:#475569}
      .head{font:700 18px Arial,sans-serif;fill:#0f172a}
      .copy{font:400 15px Arial,sans-serif;fill:#334155}
      .small{font:400 14px Arial,sans-serif;fill:#475569}
      .eq{font:600 16px Georgia,'Times New Roman',serif;fill:#0f172a}
      .strong{font:700 17px Arial,sans-serif;fill:#0f172a}
      .route{font:700 13px Arial,sans-serif;fill:#475569}
      .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="960" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P65  Lower-bounded heterogeneous calibration</text>
  <text x="60" y="90" class="subtitle">Solve the mandatory one-observation baseline inside the continuous optimization, then round safely.</text>

  <g id="block-p64-limit" data-x="55" data-y="130" data-w="330" data-h="220">
    <rect x="55" y="130" width="330" height="220" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="80" y="168" class="head">1. Why P64 can fail</text>
    <text x="80" y="208" class="eq">P62 may give n*ₑ &lt; 1</text>
    <text x="80" y="244" class="copy">Direct flooring can then</text>
    <text x="80" y="268" class="copy">produce zero observations.</text>
    <text x="80" y="304" class="small">That violates the mandatory</text>
    <text x="80" y="328" class="small">one-observation baseline.</text>
  </g>

  <g id="block-problem" data-x="435" data-y="130" data-w="330" data-h="220">
    <rect x="435" y="130" width="330" height="220" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="460" y="168" class="head">2. P65 continuous problem</text>
    <text x="460" y="207" class="eq">min Σₑ bₑ / √nₑ</text>
    <text x="460" y="239" class="eq">Σₑ cₑnₑ ≤ B</text>
    <text x="460" y="271" class="eq">nₑ ≥ 1</text>
    <text x="460" y="306" class="small">Feasible exactly when</text>
    <text x="460" y="330" class="small">B ≥ B₀ = Σₑ cₑ.</text>
  </g>

  <g id="block-active" data-x="815" data-y="130" data-w="330" data-h="220">
    <rect x="815" y="130" width="330" height="220" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="840" y="168" class="head">3. Thresholded active set</text>
    <text x="840" y="207" class="eq">aₑ = (bₑ / cₑ)^(2/3)</text>
    <text x="840" y="239" class="eq">tₑ = (cₑ / bₑ)^(2/3)</text>
    <text x="840" y="276" class="copy">Free edge: τ &gt; tₑ</text>
    <text x="840" y="304" class="copy">Otherwise: n*ₑ = 1</text>
    <text x="840" y="332" class="small">Sort thresholds; find free edges.</text>
  </g>

  <path id="arrow-1" class="arrow" d="M385 240 H435" data-source="block-p64-limit" data-target="block-problem"/>
  <path id="arrow-2" class="arrow" d="M765 240 H815" data-source="block-problem" data-target="block-active"/>

  <text x="600" y="388" class="route" text-anchor="middle">constrained KKT solution</text>

  <g id="block-water" data-x="120" data-y="410" data-w="960" data-h="205">
    <rect x="120" y="410" width="960" height="205" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="600" y="448" text-anchor="middle" class="head">4. Exact lower-bounded water-filling theorem</text>
    <text x="600" y="490" text-anchor="middle" class="eq">n*ₑ = max{1, τ (bₑ / cₑ)^(2/3)}</text>
    <text x="600" y="525" text-anchor="middle" class="eq">Σₑ cₑ max{1, τ (bₑ / cₑ)^(2/3)} = B</text>
    <text x="600" y="558" text-anchor="middle" class="copy">Strict convexity gives a unique continuous optimum; sorting thresholds gives O(m log m) comparison work.</text>
    <text x="600" y="587" text-anchor="middle" class="small">The lower bound is solved before any integer rounding occurs.</text>
  </g>

  <path id="arrow-3" class="arrow" d="M600 350 V410" data-source="block-problem" data-target="block-water"/>
  <path id="arrow-4" class="arrow" d="M980 350 V380 H900 V410" data-source="block-active" data-target="block-water"/>

  <text x="350" y="653" class="route" text-anchor="middle">floor the exact continuous optimum</text>
  <text x="850" y="653" class="route" text-anchor="middle">certify the floor</text>

  <g id="block-floor" data-x="100" data-y="675" data-w="455" data-h="155">
    <rect x="100" y="675" width="455" height="155" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="128" y="712" class="head">5. Baseline-safe integer construction</text>
    <text x="128" y="751" class="eq">kₑ = ⌊n*ₑ⌋ ≥ 1</text>
    <text x="128" y="784" class="eq">Σₑ cₑkₑ ≤ B</text>
    <text x="128" y="813" class="small">Flooring is automatically feasible.</text>
  </g>

  <g id="block-certificate" data-x="645" data-y="675" data-w="455" data-h="155">
    <rect x="645" y="675" width="455" height="155" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="673" y="712" class="head">6. Certified objective quality</text>
    <text x="673" y="748" class="eq">U(k) ≤ U*int(B) / √rmin</text>
    <text x="673" y="778" class="eq">rmin ≥ 1/2</text>
    <text x="673" y="808" class="strong">U(k) ≤ √2 U*int(B)</text>
  </g>

  <path id="arrow-5" class="arrow" d="M420 615 V675" data-source="block-water" data-target="block-floor"/>
  <path id="arrow-6" class="arrow" d="M780 615 V675" data-source="block-water" data-target="block-certificate"/>

  <g id="block-boundary" data-x="90" data-y="850" data-w="1020" data-h="90">
    <rect x="90" y="850" width="1020" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="118" y="880" class="head">Exactness and scientific boundary</text>
    <text x="118" y="905" class="small">P63 remains the exact integer solver. It makes no claim that a calibration variable is consciousness or that quantum mechanics is incomplete.</text>
    <text x="118" y="928" class="small">P65 also does not establish a physical-to-experiential bridge.</text>
  </g>
</svg>
