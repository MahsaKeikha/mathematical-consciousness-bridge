<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">P58 finite-data switching-metric uncertainty</title>
  <desc id="desc">A theorem map from noisy pairwise transition measurements to simultaneous edge confidence intervals, lower and upper route envelopes, robust routing, and strict reoptimization comparison.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.13"/>
    </filter>
    <style>
      .h1{font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .sub{font:400 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
      .bt{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .tx{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155}
      .math{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f172a}
      .small{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}
      .arrow{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="780" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="h1">P58: Finite-data switching-metric uncertainty</text>
  <text x="60" y="88" class="sub">Noisy transition measurements become a simultaneous confidence envelope for the unknown true P54 routing optimum.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="135" width="270" height="160" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="82" y="170" class="bt">1. Pairwise calibration</text>
    <text x="82" y="203" class="math">Zₑ,1 … Zₑ,n</text>
    <text x="82" y="232" class="tx">Bounded transition observations</text>
    <text x="82" y="257" class="math">ĉₑ = sample mean</text>
    <text x="82" y="279" class="small">The empirical table may be nonmetric.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="365" y="135" width="310" height="160" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="392" y="170" class="bt">2. Simultaneous edge event</text>
    <text x="392" y="203" class="math">ρₑ = Bₑ √[log(2/αₑ)/(2nₑ)]</text>
    <text x="392" y="232" class="math">|ĉₑ − cₑ| ≤ ρₑ  ∀e</text>
    <text x="392" y="257" class="math">P(Ec) ≥ 1 − α</text>
    <text x="392" y="279" class="small">Finite-family union bound; no pair independence needed.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="715" y="135" width="430" height="160" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="742" y="170" class="bt">3. Routewise lower / upper envelopes</text>
    <text x="742" y="203" class="math">cₑ⁻ = max(0, ĉₑ−ρₑ)</text>
    <text x="742" y="230" class="math">cₑ⁺ = ĉₑ+ρₑ</text>
    <text x="742" y="257" class="math">ℓ⁻(π) ≤ ℓc(π) ≤ ℓ⁺(π)  for every route π</text>
    <text x="742" y="279" class="small">The auxiliary envelope tables do not need triangle inequalities.</text>
  </g>

  <path d="M325 215 L365 215" class="arrow"/>
  <path d="M675 215 L715 215" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="135" y="370" width="410" height="170" rx="20" fill="#ecfdf5" stroke="#10b981"/>
    <text x="165" y="407" class="bt">4. Unknown optimum is bracketed</text>
    <text x="165" y="442" class="math">L⁻ = minπ ℓ⁻(π)</text>
    <text x="165" y="470" class="math">L⁺ = minπ ℓ⁺(π)</text>
    <text x="165" y="505" class="math">L⁻ ≤ L*c ≤ L⁺</text>
    <text x="165" y="526" class="small">Exact Held-Karp optimization over the fixed block-route family.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="655" y="370" width="410" height="170" rx="20" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="685" y="407" class="bt">5. Robust route and regret</text>
    <text x="685" y="442" class="math">πrob ∈ arg minπ ℓ⁺(π)</text>
    <text x="685" y="470" class="math">ℓc(πrob) − L*c ≤ L⁺ − L⁻</text>
    <text x="685" y="505" class="tx">Interval width becomes a certified upper bound</text>
    <text x="685" y="527" class="tx">on route regret under the unknown true metric.</text>
  </g>

  <path d="M850 295 C810 330 590 345 470 370" class="arrow"/>
  <path d="M930 295 C930 330 910 345 885 370" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="250" y="615" width="700" height="115" rx="22" fill="#fff7ed" stroke="#f97316"/>
    <text x="282" y="650" class="bt">6. Robust sequential comparison</text>
    <text x="282" y="684" class="math">C₀⁻ &gt; C₁⁺  ⇒  true new reoptimized cost is strictly lower</text>
    <text x="282" y="710" class="small">This remains a scheduling statement. Valid pruning and adaptive calibration require their own statistical premises.</text>
  </g>

  <path d="M340 540 C365 585 470 595 520 615" class="arrow"/>
  <path d="M860 540 C835 585 730 595 680 615" class="arrow"/>

  <text x="60" y="760" class="small">P58 boundary: the unknown true transition cost is assumed metric; the noisy empirical center is not required to be metric.</text>
</svg>
