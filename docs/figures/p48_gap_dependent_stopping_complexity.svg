<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P48 gap-dependent stopping complexity</title>
  <desc id="desc">A theorem map from shrinking preparation-level confidence sequences to edge uncertainty, an explicit local sample bound, and positive or all-negative sequential stopping guarantees.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box-title { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .math { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .small { font: 400 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .flow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .axis { stroke: #64748b; stroke-width: 1.4; fill: none; }
      .curve { stroke: #2563eb; stroke-width: 3; fill: none; }
      .threshold { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P48: Gap-dependent stopping complexity</text>
  <text x="60" y="88" class="subtitle">P47 supplies validity. P48 supplies an explicit sufficient stopping bound.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="125" width="330" height="150" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="82" y="160" class="box-title">Preparation confidence envelope</text>
    <text x="82" y="194" class="math">radiusᵢ(n) ≤ Aᵢ √[log(Bᵢ n²)/n]</text>
    <text x="82" y="226" class="body">Target and quantum streams remain time-uniform.</text>
    <text x="82" y="249" class="small">The theorem only assumes this envelope, not one specific estimator.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="435" y="125" width="330" height="150" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="462" y="160" class="box-title">Edge uncertainty</text>
    <text x="462" y="194" class="math">Uₑ(n) ≤ Aₑ √[log(Bₑ n²)/n]</text>
    <text x="462" y="226" class="math">Aₑ = AYi+AYj+Lₑ(AQi+AQj)</text>
    <text x="462" y="249" class="small">Shared endpoint errors are combined before sign certification.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="815" y="125" width="330" height="150" rx="18" fill="#eef2ff" stroke="#6366f1"/>
    <text x="842" y="160" class="box-title">Explicit sufficient local count</text>
    <text x="842" y="194" class="math">qₑ = (2Aₑ/gₑ)²,  Qₑ=max(qₑ,1)</text>
    <text x="842" y="222" class="math">Nₑ = ⌈4Qₑ log(4Qₑ√Bₑ)⌉</text>
    <text x="842" y="249" class="small">For every n ≥ Nₑ: Uₑ(n) &lt; gₑ/2.</text>
  </g>

  <path d="M385 200 L435 200" class="flow"/>
  <path d="M765 200 L815 200" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="70" y="340" width="500" height="270" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="98" y="378" class="box-title">Why the gap controls the data requirement</text>
    <line x1="130" y1="550" x2="515" y2="550" class="axis"/>
    <line x1="130" y1="430" x2="130" y2="550" class="axis"/>
    <path d="M150 445 C220 470 260 490 315 505 C370 520 425 530 500 538" class="curve"/>
    <line x1="130" y1="505" x2="515" y2="505" class="threshold"/>
    <line x1="315" y1="430" x2="315" y2="550" class="threshold"/>
    <text x="145" y="421" class="small">uncertainty Uₑ(n)</text>
    <text x="440" y="575" class="small">local samples n</text>
    <text x="420" y="497" class="small">gₑ / 2</text>
    <text x="300" y="575" class="small">Nₑ</text>
    <text x="98" y="598" class="body">Smaller |Mₑ| pushes the crossing farther right.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="340" width="500" height="118" rx="18" fill="#ecfdf5" stroke="#10b981"/>
    <text x="658" y="377" class="box-title">Positive-witness case</text>
    <text x="658" y="410" class="math">K₊ = min { Nₑ : Mₑ &gt; 0 }</text>
    <text x="658" y="437" class="body">A true positive edge cannot be safely pruned on the P47 event.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="492" width="500" height="118" rx="18" fill="#fff7ed" stroke="#f97316"/>
    <text x="658" y="529" class="box-title">All-negative case</text>
    <text x="658" y="562" class="math">K₋ = max { Nₑ : e ∈ E }</text>
    <text x="658" y="589" class="body">By K₋ every declared negative edge has a certified negative upper bound.</text>
  </g>

  <path d="M980 275 C980 308 880 318 880 340" class="flow"/>
  <path d="M980 275 C1090 330 1080 455 1040 492" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="175" y="660" width="850" height="62" rx="16" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="205" y="686" class="math">Cactive(K) ≤ Cfull(K) = K Σᵢ cᵢ</text>
    <text x="205" y="708" class="small">Safe P47 pruning can only reduce realized acquisition cost relative to the P48 full-family bound.</text>
  </g>

  <text x="60" y="746" class="small">Boundary: zero population margin has no generic finite sign-separation guarantee; P48 is a sufficient upper bound, not an optimality claim.</text>
</svg>
