<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P82 exact nested projection-contrast certificate</title>
  <desc id="desc">What this figure shows: P82 strengthens the P81 continuous P75 model-distance certificate by adding exact residual events A minus B from nested cylinder pairs. How to read it: a parent cylinder A and strict child B define a generally non-cylinder residual event. Inside each P75 latent branch, conditional independence factorizes the residual probability as P_s(A) times one minus P_s(D), where D contains the added child constraints. Parent and added-view factors use disjoint response coordinates, so exact box endpoints are simultaneously attainable; affine prevalence mixing then gives the exact residual interval. The residual mismatch divided by its support size is a valid full-law L-infinity lower bound. P82 audits 256 genuinely new nested contrasts and takes the maximum with P81. A strict exact-rational witness gives P80 equal to zero, P81 equal to one sixteenth, and P82 equal to one twelfth. Scientific status: conditional exact-rational computational-certification theorem. It does not identify a latent variable with consciousness, does not validate non-rejected models, and the physical-to-experiential bridge remains open.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f8fafc"/>
  <rect x="34" y="28" width="1132" height="704" rx="24" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>

  <text x="70" y="77" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#0f172a">P82 Exact Nested Projection-Contrast Certificate</text>
  <text x="70" y="108" font-family="Arial, Helvetica, sans-serif" font-size="16.2" fill="#475569">Exact residual-event ranges that retain nested structure discarded by separate P81 event tests</text>

  <!-- STEP 1 -->
  <rect x="70" y="145" width="310" height="410" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="145" width="310" height="82" rx="18" fill="#eef2ff"/>
  <rect x="70" y="209" width="310" height="18" fill="#eef2ff"/>
  <circle cx="101" cy="178" r="17" fill="#4f46e5"/>
  <text x="101" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">1</text>
  <text x="128" y="173" font-family="Arial, Helvetica, sans-serif" font-size="18.2" font-weight="700" fill="#1e1b4b">Build a residual event</text>
  <text x="94" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13.1" fill="#475569">Use a nested parent-child cylinder pair</text>

  <rect x="94" y="248" width="262" height="104" rx="12" fill="#f8faff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="114" y="276" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#312e81">Nested cylinders</text>
  <text x="114" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#4338ca">A = C(J,a),  B = C(K,b),  B subset A</text>
  <text x="114" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#4338ca">child adds at least two binary views</text>

  <path d="M225 352 L225 376" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="94" y="376" width="262" height="112" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <text x="114" y="404" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#9a3412">New observable residual</text>
  <text x="114" y="430" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#c2410c">1_A - 1_B = 1_(A\B)</text>
  <text x="114" y="454" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#c2410c">support = 2^(4-|J|) - 2^(4-|K|)</text>
  <text x="114" y="476" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#c2410c">generally not one of P81's 80 cylinders</text>

  <text x="96" y="516" font-family="Arial, Helvetica, sans-serif" font-size="12.7" fill="#64748b">Standard P82 family: 256 genuinely new pairs.</text>
  <text x="96" y="537" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#64748b">One-view refinements reduce to P81 sibling events.</text>

  <!-- CONNECTOR 1 -->
  <path d="M380 350 L445 350" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- STEP 2 -->
  <rect x="445" y="145" width="310" height="410" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="145" width="310" height="82" rx="18" fill="#ecfdf5"/>
  <rect x="445" y="209" width="310" height="18" fill="#ecfdf5"/>
  <circle cx="476" cy="178" r="17" fill="#059669"/>
  <text x="476" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">2</text>
  <text x="503" y="173" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#064e3b">Extremize exactly</text>
  <text x="469" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13.1" fill="#475569">Exploit the declared P75 factorization directly</text>

  <rect x="469" y="248" width="262" height="108" rx="12" fill="#f0fdf4" stroke="#34d399" stroke-width="1.8"/>
  <text x="489" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14.8" font-weight="700" fill="#065f46">Branchwise identity</text>
  <text x="489" y="304" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#047857">P_s(A\B) = P_s(A) [1 - P_s(D)]</text>
  <text x="489" y="329" font-family="Arial, Helvetica, sans-serif" font-size="12.3" fill="#047857">A and added-view D use disjoint q coordinates</text>
  <text x="489" y="349" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#047857">so endpoint extrema are jointly attainable</text>

  <path d="M600 356 L600 380" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="469" y="380" width="262" height="108" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="489" y="408" font-family="Arial, Helvetica, sans-serif" font-size="14.8" font-weight="700" fill="#155e75">Exact box interval</text>
  <text x="489" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#155e75">r_s in [a_s^L(1-d_s^U), a_s^U(1-d_s^L)]</text>
  <text x="489" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#155e75">then extremize affine prevalence at pi endpoints</text>
  <text x="489" y="479" font-family="Arial, Helvetica, sans-serif" font-size="12.1" fill="#155e75">exact Fraction arithmetic; no numerical optimizer</text>

  <rect x="469" y="505" width="262" height="35" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="600" y="528" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#334155">exact interval can be strictly tighter than subtraction</text>

  <!-- CONNECTOR 2 -->
  <path d="M755 350 L820 350" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- STEP 3 -->
  <rect x="820" y="145" width="310" height="410" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="145" width="310" height="82" rx="18" fill="#fff7ed"/>
  <rect x="820" y="209" width="310" height="18" fill="#fff7ed"/>
  <circle cx="851" cy="178" r="17" fill="#ea580c"/>
  <text x="851" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">3</text>
  <text x="878" y="173" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7c2d12">Transfer and tighten</text>
  <text x="844" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13.1" fill="#475569">Residual mismatch certifies full-law separation</text>

  <rect x="844" y="248" width="262" height="105" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="864" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14.8" font-weight="700" fill="#312e81">Residual certificate</text>
  <text x="864" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#4338ca">L_nest = max d(p_R,[l_R,u_R]) / |R|</text>
  <text x="864" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#4338ca">L82(B) = max(L81(B), L_nest(B))</text>
  <text x="864" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#4338ca">therefore L82 &gt;= L81 &gt;= L80 &gt;= L78</text>

  <path d="M975 353 L975 377" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="844" y="377" width="262" height="111" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <text x="864" y="405" font-family="Arial, Helvetica, sans-serif" font-size="14.8" font-weight="700" fill="#9a3412">Strict exact-rational witness</text>
  <text x="864" y="431" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#c2410c">q3- = q3+ = q4- = q4+ = 1/2</text>
  <text x="864" y="455" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#c2410c">parent support 4; residual support 3</text>
  <text x="864" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13.3" font-weight="700" fill="#c2410c">L80 = 0,  L81 = 1/16,  L82 = 1/12</text>

  <rect x="844" y="505" width="262" height="35" rx="9" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="975" y="528" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.4" font-weight="700" fill="#14532d">P79 gate: L82 &gt; epsilon_upper =&gt; reject</text>

  <!-- BOTTOM BAND -->
  <rect x="70" y="580" width="1060" height="106" rx="16" fill="#0f172a"/>
  <text x="98" y="612" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">What P82 adds</text>
  <text x="98" y="640" font-family="Arial, Helvetica, sans-serif" font-size="14.8" fill="#e2e8f0">P81 asks whether each cylinder event is compatible with the box. P82 also asks whether nested event differences are compatible.</text>
  <text x="98" y="665" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#86efac">The new interval is exact for the declared P75 box because parent, added-view, branch, and prevalence coordinates separate cleanly.</text>

  <text x="70" y="718" font-family="Arial, Helvetica, sans-serif" font-size="12.7" fill="#64748b">P82 certifies a declared model-distance bound. It is not a consciousness-identification theorem. The physical-to-experiential bridge remains open.</text>
</svg>
