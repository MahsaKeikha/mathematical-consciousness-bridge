<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P83 exact projection-parity certificate</title>
  <desc id="desc">What this figure shows: P83 strengthens P82 by adding 22 exact parity observables on two, three, and four binary views. How to read it: conditional independence inside each P75 latent branch gives an exact Bernoulli parity identity involving the product of one minus twice each response probability. That product is multi-affine, so its extrema on a rational parameter box occur at endpoint vertices. The two branch extrema can be combined exactly and prevalence is affine, yielding an exact latent-mixture parity interval. Event-mass mismatch divided by eight gives a full-law L-infinity lower bound. A strict witness fixes the third observed channel to one half in both latent branches; P82 is zero while P83 certifies one sixteenth from the even parity of views three and four. Scientific status: conditional exact-rational computational-certification theorem. It does not identify a latent variable with consciousness, does not validate non-rejected models, and the physical-to-experiential bridge remains open.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f8fafc"/>
  <rect x="34" y="28" width="1132" height="704" rx="24" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>

  <text x="70" y="77" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#0f172a">P83 Exact Projection-Parity Certificate</text>
  <text x="70" y="108" font-family="Arial, Helvetica, sans-serif" font-size="16.2" fill="#475569">A dependency-aware exact-rational observable that can separate P75 boxes left compatible by P82</text>

  <!-- STEP 1 -->
  <rect x="70" y="145" width="310" height="410" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="145" width="310" height="82" rx="18" fill="#eef2ff"/>
  <rect x="70" y="209" width="310" height="18" fill="#eef2ff"/>
  <circle cx="101" cy="178" r="17" fill="#4f46e5"/>
  <text x="101" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">1</text>
  <text x="128" y="173" font-family="Arial, Helvetica, sans-serif" font-size="18.2" font-weight="700" fill="#1e1b4b">Choose a parity event</text>
  <text x="94" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13.1" fill="#475569">Test interaction structure, not one cylinder</text>

  <rect x="94" y="248" width="262" height="116" rx="12" fill="#f8faff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="114" y="276" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#312e81">Projection parity</text>
  <text x="114" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#4338ca">H(J,b) = {x : XOR(j in J) x_j = b}</text>
  <text x="114" y="329" font-family="Arial, Helvetica, sans-serif" font-size="12.6" fill="#4338ca">|J| = 2, 3, or 4;  b = 0 or 1</text>
  <text x="114" y="351" font-family="Arial, Helvetica, sans-serif" font-size="12.6" fill="#4338ca">every event contains exactly 8 of 16 cells</text>

  <path d="M225 364 L225 388" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="94" y="388" width="262" height="100" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <text x="114" y="416" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Small declared family</text>
  <text x="114" y="443" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#c2410c">2 [C(4,2)+C(4,3)+C(4,4)] = 22</text>
  <text x="114" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12.3" fill="#c2410c">one-view parity is already a P81 cylinder</text>

  <text x="96" y="518" font-family="Arial, Helvetica, sans-serif" font-size="12.6" fill="#64748b">P83 is complementary to P82 nested residuals.</text>
  <text x="96" y="539" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#64748b">It targets dependence constraints hidden by broad marginals.</text>

  <!-- CONNECTOR 1 -->
  <path d="M380 350 L445 350" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- STEP 2 -->
  <rect x="445" y="145" width="310" height="410" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="145" width="310" height="82" rx="18" fill="#ecfdf5"/>
  <rect x="445" y="209" width="310" height="18" fill="#ecfdf5"/>
  <circle cx="476" cy="178" r="17" fill="#059669"/>
  <text x="476" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">2</text>
  <text x="503" y="173" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#064e3b">Extremize exactly</text>
  <text x="469" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13.1" fill="#475569">Use the P75 branch factorization directly</text>

  <rect x="469" y="248" width="262" height="112" rx="12" fill="#f0fdf4" stroke="#34d399" stroke-width="1.8"/>
  <text x="489" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14.8" font-weight="700" fill="#065f46">Branchwise identity</text>
  <text x="489" y="304" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#047857">P_s(H) = [1 + (-1)^b Z_s] / 2</text>
  <text x="489" y="329" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#047857">Z_s = product_j (1 - 2 q_(j,s))</text>
  <text x="489" y="351" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#047857">multi-affine product: extrema occur at vertices</text>

  <path d="M600 360 L600 384" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="469" y="384" width="262" height="104" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="489" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14.8" font-weight="700" fill="#155e75">Exact box interval</text>
  <text x="489" y="439" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#155e75">evaluate at most 2^4 endpoint products per branch</text>
  <text x="489" y="463" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#155e75">then extremize affine prevalence at pi endpoints</text>
  <text x="489" y="483" font-family="Arial, Helvetica, sans-serif" font-size="12.1" fill="#155e75">Fraction arithmetic throughout; no floating optimizer</text>

  <rect x="469" y="505" width="262" height="35" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="600" y="528" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#334155">L83(B) = max(L82(B), L_parity(B))</text>

  <!-- CONNECTOR 2 -->
  <path d="M755 350 L820 350" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- STEP 3 -->
  <rect x="820" y="145" width="310" height="410" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="145" width="310" height="82" rx="18" fill="#fff7ed"/>
  <rect x="820" y="209" width="310" height="18" fill="#fff7ed"/>
  <circle cx="851" cy="178" r="17" fill="#ea580c"/>
  <text x="851" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">3</text>
  <text x="878" y="173" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7c2d12">Expose hidden dependence</text>
  <text x="844" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13.1" fill="#475569">A strict witness separates P83 from P82</text>

  <rect x="844" y="248" width="262" height="112" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="864" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14.8" font-weight="700" fill="#312e81">Fair-channel constraint</text>
  <text x="864" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#4338ca">q3- = q3+ = 1/2; q4 remains free</text>
  <text x="864" y="329" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#4338ca">model forces P(X3 XOR X4 = 0) = 1/2</text>
  <text x="864" y="351" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#4338ca">even though separate joint cylinders stay broad</text>

  <path d="M975 360 L975 384" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="844" y="384" width="262" height="104" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <text x="864" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14.8" font-weight="700" fill="#9a3412">Exact-rational empirical witness</text>
  <text x="864" y="439" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#c2410c">p(x) = 1/8 when x3 = x4, otherwise 0</text>
  <text x="864" y="463" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#c2410c">empirical even parity = 1; support = 8</text>
  <text x="864" y="483" font-family="Arial, Helvetica, sans-serif" font-size="13.3" font-weight="700" fill="#c2410c">L82 = 0,  L83 = 1/16</text>

  <rect x="844" y="505" width="262" height="35" rx="9" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="975" y="528" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.4" font-weight="700" fill="#14532d">P79 gate: L83 &gt; epsilon_upper =&gt; reject</text>

  <!-- BOTTOM BAND -->
  <rect x="70" y="580" width="1060" height="106" rx="16" fill="#0f172a"/>
  <text x="98" y="612" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">What P83 adds</text>
  <text x="98" y="640" font-family="Arial, Helvetica, sans-serif" font-size="14.8" fill="#e2e8f0">P82 can accept every tested cylinder and nested residual interval while a parity constraint implied by P75 is still violated.</text>
  <text x="98" y="665" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#86efac">P83 captures that interaction with 22 exact observables and preserves the established one-sided certification logic.</text>

  <text x="70" y="718" font-family="Arial, Helvetica, sans-serif" font-size="12.7" fill="#64748b">P83 certifies a declared model-distance bound. It is not a consciousness-identification theorem. The physical-to-experiential bridge remains open.</text>
</svg>
