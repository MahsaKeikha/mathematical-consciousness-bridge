<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P79 Three-Way Full-Law Decision</title>
  <desc id="desc">A scientific decision map combining a certified P78 model-distance bracket with certified lower and upper bounds on the P77 sampling radius. The signed decision interval yields three outcomes: rejection when the entire interval is positive, certified non-separation when the entire interval is nonpositive, and unresolved computation when the interval straddles zero. Non-separation is explicitly not model acceptance.</desc>

  <rect x="0" y="0" width="1200" height="760" rx="22" fill="#f8fafc"/>
  <rect x="36" y="32" width="1128" height="696" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="70" y="82" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#0f172a">P79 Three-Way Full-Law Decision</text>
  <text x="70" y="114" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">Use both sides of the P78 distance bracket and both directions of the P77 sampling-radius enclosure</text>

  <rect x="70" y="150" width="320" height="210" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="96" y="190" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0f172a">1. Certified inputs</text>

  <rect x="96" y="218" width="268" height="54" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="112" y="242" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#312e81">P78 model-distance bracket</text>
  <text x="112" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4338ca">L  &lt;=  d_inf(P_hat,M)  &lt;=  U</text>

  <rect x="96" y="290" width="268" height="54" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="112" y="314" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#164e63">P77 radius enclosure</text>
  <text x="112" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0e7490">epsilon_low  &lt;=  epsilon_n  &lt;=  epsilon_high</text>

  <path d="M398 256 L450 256" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="462" y="150" width="668" height="210" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="488" y="190" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0f172a">2. Enclose the signed P77 decision margin</text>
  <text x="488" y="220" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Delta = d_inf(P_hat,M) - epsilon_n</text>

  <rect x="498" y="244" width="596" height="76" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="524" y="273" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#9a3412">L - epsilon_high  &lt;=  Delta  &lt;=  U - epsilon_low</text>
  <text x="524" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7c2d12">The exact decision is now reduced to the sign of one certified interval.</text>

  <text x="70" y="412" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">3. Three logically distinct outcomes</text>

  <rect x="70" y="442" width="330" height="178" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="96" y="480" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#991b1b">REJECT</text>
  <text x="96" y="512" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">L &gt; epsilon_high</text>
  <text x="96" y="543" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7f1d1d">The whole signed interval is positive.</text>
  <text x="96" y="568" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7f1d1d">P77 confidence region is separated</text>
  <text x="96" y="589" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#7f1d1d">from the declared model family.</text>

  <rect x="435" y="442" width="330" height="178" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="461" y="480" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#065f46">NON-SEPARATION</text>
  <text x="461" y="512" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#047857">U &lt;= epsilon_low</text>
  <text x="461" y="543" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#065f46">For compact P75, the confidence ball</text>
  <text x="461" y="568" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#065f46">intersects the model family.</text>
  <text x="461" y="593" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#065f46">This is not model acceptance.</text>

  <rect x="800" y="442" width="330" height="178" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="826" y="480" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#92400e">UNRESOLVED</text>
  <text x="826" y="512" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#b45309">Decision interval overlaps zero</text>
  <text x="826" y="543" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#78350f">Further P78 refinement, tighter radius</text>
  <text x="826" y="568" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#78350f">certification, or new data may be needed.</text>
  <text x="826" y="593" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#78350f">Only this state justifies more optimization.</text>

  <rect x="70" y="650" width="1060" height="52" rx="14" fill="#0f172a"/>
  <text x="94" y="681" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2e8f0">Decision uncertainty width = (U - L) + (epsilon_high - epsilon_low). If it is smaller than a nonzero exact margin, the decision must resolve.</text>

  <text x="70" y="720" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">P79 is a statistical/computational stopping theorem. It does not validate the latent model or solve the physical-to-experiential bridge.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>