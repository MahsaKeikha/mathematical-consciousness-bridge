<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="p88-title p88-desc">
  <title id="p88-title">P88 Expanded Bounded Primitive Four-Event Parity Certificate</title>
  <desc id="p88-desc">Proposition 88 enlarges the complete primitive four-coefficient box from absolute coefficient at most two to absolute coefficient at most three across four distinct canonical even-parity observables. There are 632 sign-normalized primitive coefficient patterns per four-event subset and 208,560 exact functionals in total. On the exact rational witness, P87 gives one over 96 while P88 selects coefficients 1,-1,-3,2 with empirical value minus 11 over 8 outside the exact P75 interval minus one to two. The gap is three over eight, the centered coefficient norm is 24, and the certified full-law L-infinity lower bound is one over 64. This is a conditional model-separation theorem and does not identify the latent state with consciousness or solve the physical-to-experiential bridge.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #cfd8e6; stroke-width: 1.5; }
      .panelSoft { fill: #f3f7fb; stroke: #cfd8e6; stroke-width: 1.2; }
      .accent { fill: #173b65; }
      .accentSoft { fill: #eaf2fb; stroke: #8fb0d4; stroke-width: 1.3; }
      .success { fill: #eef8f1; stroke: #8eb89a; stroke-width: 1.3; }
      .warn { fill: #fff7e8; stroke: #d6b267; stroke-width: 1.3; }
      .ink { fill: #172235; font-family: Arial, Helvetica, sans-serif; }
      .muted { fill: #5d6a7c; font-family: Arial, Helvetica, sans-serif; }
      .white { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; }
      .section { font-size: 20px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .formula { font-size: 16px; font-weight: 700; }
      .metric { font-size: 23px; font-weight: 700; }
      .tiny { font-size: 12px; }
      .arrow { stroke: #6c87a7; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6c87a7"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <rect class="accent" x="0" y="0" width="1280" height="112"/>
  <text class="white title" x="54" y="50">P88 Expanded Bounded Primitive Four-Event Certificate</text>
  <text class="white subtitle" x="54" y="79">The first larger complete primitive coefficient box, |cᵢ| ≤ 3, yields a strict new exact separation beyond P87.</text>

  <rect class="panel" x="48" y="144" rx="16" ry="16" width="350" height="448"/>
  <text class="ink section" x="72" y="181">1. Enlarge the complete box</text>
  <text class="muted body" x="72" y="210">Four distinct canonical even-parity observables</text>
  <text class="muted body" x="72" y="232">with primitive nonzero coefficients in {−3,…,−1,1,…,3}.</text>

  <rect class="accentSoft" x="78" y="262" rx="12" ry="12" width="290" height="92"/>
  <text class="ink label" x="98" y="290">Primitive pattern count</text>
  <text class="ink formula" x="98" y="318">(6⁴ − 2·2⁴) / 2 = 632</text>
  <text class="muted body" x="98" y="340">gcd 2 and gcd 3 families removed</text>

  <rect class="panelSoft" x="78" y="374" rx="12" ry="12" width="290" height="88"/>
  <text class="ink label" x="98" y="402">Four-event subsets</text>
  <text class="ink formula" x="98" y="430">C(11,4) = 330</text>
  <text class="muted body" x="98" y="451">same canonical P83 parity coordinates</text>

  <rect class="success" x="78" y="482" rx="12" ry="12" width="290" height="74"/>
  <text class="ink label" x="98" y="510">Complete P88 family</text>
  <text class="ink metric" x="98" y="541">208,560 exact functionals</text>

  <path class="arrow" d="M406 368 C430 368, 438 368, 462 368"/>

  <rect class="panel" x="470" y="144" rx="16" ry="16" width="350" height="448"/>
  <text class="ink section" x="494" y="181">2. Exact certification</text>
  <text class="muted body" x="494" y="210">The branch functional remains multi-affine.</text>
  <text class="muted body" x="494" y="232">Response and prevalence endpoints still suffice.</text>

  <rect class="panelSoft" x="500" y="262" rx="12" ry="12" width="290" height="92"/>
  <text class="ink label" x="520" y="290">Exact P75 interval</text>
  <text class="ink formula" x="520" y="318">Iᴮ(Q) = [Qᴸ, Qᵁ]</text>
  <text class="muted body" x="520" y="340">finite rational endpoint enumeration</text>

  <rect class="panelSoft" x="500" y="374" rx="12" ry="12" width="290" height="96"/>
  <text class="ink label" x="520" y="402">Mass-conservation transfer</text>
  <text class="ink formula" x="520" y="430">D(Q)=minₐ Σₓ |g(x)−a|</text>
  <text class="muted body" x="520" y="453">gap / D(Q) lower-bounds full-law L∞</text>

  <rect class="accentSoft" x="500" y="490" rx="12" ry="12" width="290" height="66"/>
  <text class="ink label" x="520" y="518">Hierarchy</text>
  <text class="ink formula" x="520" y="544">L88 = max(L87, Lbp4,3)</text>

  <path class="arrow" d="M828 368 C850 368, 862 368, 884 368"/>

  <rect class="panel" x="892" y="144" rx="16" ry="16" width="340" height="448"/>
  <text class="ink section" x="916" y="181">3. Exact strict witness</text>
  <text class="muted body" x="916" y="210">Q = P(H02) − P(H13) − 3P(H123) + 2P(H0123)</text>

  <rect class="panelSoft" x="920" y="246" rx="11" ry="11" width="284" height="76"/>
  <text class="ink label" x="940" y="272">Empirical / P75 interval</text>
  <text class="ink formula" x="940" y="298">Q(emp) = −11/8</text>
  <text class="ink formula" x="940" y="316">Q(P75 box) ∈ [−1, 2]</text>

  <rect class="warn" x="920" y="338" rx="11" ry="11" width="284" height="62"/>
  <text class="ink label" x="940" y="364">Exact mismatch</text>
  <text class="ink metric" x="940" y="391">gap = 3/8</text>

  <rect class="panelSoft" x="920" y="416" rx="11" ry="11" width="284" height="62"/>
  <text class="ink label" x="940" y="442">Centered norm</text>
  <text class="ink metric" x="940" y="469">D(Q) = 24</text>

  <rect class="success" x="920" y="494" rx="11" ry="11" width="284" height="70"/>
  <text class="ink label" x="940" y="520">Strict hierarchy improvement</text>
  <text class="ink metric" x="940" y="551">1/96 &lt; 1/64</text>

  <rect class="accent" x="48" y="620" rx="14" ry="14" width="1184" height="92"/>
  <text class="white label" x="72" y="650">Scientific boundary</text>
  <text class="white body" x="72" y="676">P88 strengthens rejection of the declared P75 latent measurement family. It does not identify the latent state with consciousness,</text>
  <text class="white body" x="72" y="697">prove consciousness is nonphysical, validate an alternative model, or solve the physical-to-experiential bridge.</text>

  <text class="muted tiny" x="48" y="742">Mathematical Consciousness Bridge | Proposition 88 | exact rational certificate</text>
</svg>
