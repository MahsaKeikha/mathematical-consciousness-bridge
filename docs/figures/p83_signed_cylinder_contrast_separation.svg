<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P83 exact signed cylinder-contrast certificate</title>
  <desc id="desc">What this figure shows: P83 strengthens P82 by testing signed differences between non-nested cylinder events that must be generated by one common P75 parameter vector. The standard family contains 2,696 genuinely new unordered non-nested cylinder pairs. Inside each latent branch, the signed contrast is multi-affine in at most four response coordinates, so exact rational extrema occur at at most sixteen endpoint vertices per branch. Affine prevalence mixing is then extremized at the prevalence endpoints. The empirical contrast mismatch divided by the symmetric-difference support gives a valid full-law L-infinity lower bound. A strict exact-rational witness has P80, P81, and P82 equal to zero while P83 equals five one-hundred-twenty-eighths, and an explicit model at prevalence five sixteenths attains the same distance. Scientific status: conditional exact-rational computational-certification theorem. It does not identify a latent state with consciousness, does not validate non-rejected models, and the physical-to-experiential bridge remains open.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>
  <rect x="0" y="0" width="1200" height="760" fill="#f8fafc"/>
  <rect x="34" y="28" width="1132" height="704" rx="24" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
  <text x="70" y="77" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#0f172a">P83 Exact Signed Cylinder-Contrast Certificate</text>
  <text x="70" y="108" font-family="Arial, Helvetica, sans-serif" font-size="16.2" fill="#475569">Dependency-aware exact intervals for event differences that separate P82-compatible marginals</text>

  <rect x="70" y="145" width="310" height="410" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="145" width="310" height="82" rx="18" fill="#eef2ff"/><rect x="70" y="209" width="310" height="18" fill="#eef2ff"/>
  <circle cx="101" cy="178" r="17" fill="#4f46e5"/><text x="101" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">1</text>
  <text x="128" y="173" font-family="Arial, Helvetica, sans-serif" font-size="18.2" font-weight="700" fill="#1e1b4b">Couple two events</text>
  <text x="94" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13.1" fill="#475569">Use one signed observable instead of two interval tests</text>
  <rect x="94" y="248" width="262" height="107" rx="12" fill="#f8faff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="114" y="276" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#312e81">Non-nested cylinders</text>
  <text x="114" y="302" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#4338ca">A = C(J,a),  B = C(K,b)</text>
  <text x="114" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#4338ca">phi(x) = 1_A(x) - 1_B(x)</text>
  <text x="114" y="347" font-family="Arial, Helvetica, sans-serif" font-size="12.3" fill="#4338ca">neither event contains the other</text>
  <path d="M225 355 L225 379" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="94" y="379" width="262" height="108" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <text x="114" y="407" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Exact transfer norm</text>
  <text x="114" y="433" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#c2410c">||phi||_1 = |A triangle B|</text>
  <text x="114" y="457" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#c2410c">|E_p phi - E_q phi| &lt;= ||phi||_1 ||p-q||_inf</text>
  <text x="114" y="478" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#c2410c">signed mismatch transfers to full-law distance</text>
  <text x="96" y="516" font-family="Arial, Helvetica, sans-serif" font-size="12.7" fill="#64748b">Standard P83 family: 2,696 new non-nested pairs.</text>
  <text x="96" y="537" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#64748b">Nested pairs are already covered by P81/P82.</text>

  <path d="M380 350 L445 350" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="445" y="145" width="310" height="410" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="145" width="310" height="82" rx="18" fill="#ecfdf5"/><rect x="445" y="209" width="310" height="18" fill="#ecfdf5"/>
  <circle cx="476" cy="178" r="17" fill="#059669"/><text x="476" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">2</text>
  <text x="503" y="173" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#064e3b">Extremize jointly</text>
  <text x="469" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13.1" fill="#475569">Keep the common P75 parameter dependence intact</text>
  <rect x="469" y="248" width="262" height="108" rx="12" fill="#f0fdf4" stroke="#34d399" stroke-width="1.8"/>
  <text x="489" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14.8" font-weight="700" fill="#065f46">Branchwise contrast</text>
  <text x="489" y="304" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#047857">g_s(q_s) = P_s(A) - P_s(B)</text>
  <text x="489" y="329" font-family="Arial, Helvetica, sans-serif" font-size="12.3" fill="#047857">multi-affine in at most four response coordinates</text>
  <text x="489" y="349" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#047857">exact extrema at at most 16 rational vertices</text>
  <path d="M600 356 L600 380" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="469" y="380" width="262" height="108" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="489" y="408" font-family="Arial, Helvetica, sans-serif" font-size="14.8" font-weight="700" fill="#155e75">Exact mixture interval</text>
  <text x="489" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#155e75">E_q phi = (1-pi) g_- + pi g_+</text>
  <text x="489" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#155e75">branch extrema combine independently</text>
  <text x="489" y="479" font-family="Arial, Helvetica, sans-serif" font-size="12.1" fill="#155e75">affine prevalence extremized at pi endpoints</text>
  <rect x="469" y="505" width="262" height="35" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="600" y="528" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#334155">exact Fraction arithmetic; no floating optimizer</text>

  <path d="M755 350 L820 350" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="820" y="145" width="310" height="410" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="145" width="310" height="82" rx="18" fill="#fff7ed"/><rect x="820" y="209" width="310" height="18" fill="#fff7ed"/>
  <circle cx="851" cy="178" r="17" fill="#ea580c"/><text x="851" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">3</text>
  <text x="878" y="173" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7c2d12">Certify separation</text>
  <text x="844" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13.1" fill="#475569">Use the exact contrast interval as a dual witness</text>
  <rect x="844" y="248" width="262" height="105" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="864" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14.8" font-weight="700" fill="#312e81">P83 lower bound</text>
  <text x="864" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12.0" fill="#4338ca">L_signed = max d(c_hat,[l,u]) / |A triangle B|</text>
  <text x="864" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#4338ca">L83(B) = max(L82(B), L_signed(B))</text>
  <text x="864" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#4338ca">L83 &gt;= L82 &gt;= L81 &gt;= L80 &gt;= L78</text>
  <path d="M975 353 L975 377" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="844" y="377" width="262" height="111" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <text x="864" y="405" font-family="Arial, Helvetica, sans-serif" font-size="14.8" font-weight="700" fill="#9a3412">Strict exact-rational witness</text>
  <text x="864" y="431" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#c2410c">A = {1100},  B = {1101}</text>
  <text x="864" y="455" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#c2410c">model contrast = 0; empirical contrast = 5/64</text>
  <text x="864" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13.1" font-weight="700" fill="#c2410c">L82 = 0,  L83 = 5/128 = exact distance</text>
  <rect x="844" y="505" width="262" height="35" rx="9" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="975" y="528" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.3" font-weight="700" fill="#14532d">upper witness: pi = 5/16 gives distance 5/128</text>

  <rect x="70" y="580" width="1060" height="106" rx="16" fill="#0f172a"/>
  <text x="98" y="612" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">What P83 adds</text>
  <text x="98" y="640" font-family="Arial, Helvetica, sans-serif" font-size="14.8" fill="#e2e8f0">P82 can accept event probabilities separately even when their jointly constrained difference is impossible under one P75 parameter vector.</text>
  <text x="98" y="665" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#86efac">P83 preserves that shared-parameter dependence with exact signed contrasts and can close the true box-model distance on the strict witness.</text>
  <text x="70" y="718" font-family="Arial, Helvetica, sans-serif" font-size="12.7" fill="#64748b">P83 certifies a declared model-distance bound. It is not a consciousness-identification theorem. The physical-to-experiential bridge remains open.</text>
</svg>
