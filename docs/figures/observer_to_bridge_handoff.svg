<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Research handoff from Spatiotemporal Observer Mathematics to Mathematical Consciousness Bridge</title>
  <desc id="desc">Two-repository research map showing measured dynamics, world-tube identification and finite-sample certification in Spatiotemporal Observer Mathematics, followed by intervention-resolved causal structure, temporal-compositional-scale analysis, and the open physical-to-experiential bridge.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 40px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.subtitle{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#475569}.repo{font:700 25px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.head{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.body{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#334155}.small{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}.label{font:700 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.8px;fill:#64748b}.eq{font:600 17px Georgia,'Times New Roman',serif;fill:#0f172a}.eqdark{font:600 18px Georgia,'Times New Roman',serif;fill:#e2e8f0}.arrow{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1000" fill="#ffffff"/>
  <text x="80" y="68" class="title">Research Continuation: Physical Observer Structure to the Consciousness Bridge</text>
  <text x="80" y="103" class="subtitle">Repository 1 identifies and certifies a physical subsystem.</text>
  <text x="80" y="130" class="subtitle">Repository 2 studies the additional causal and bridge structure.</text>
  <rect x="80" y="165" width="760" height="700" rx="22" fill="#f8fbff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="120" y="213" class="repo">Spatiotemporal Observer Mathematics</text><text x="120" y="241" class="small">github.com/MahsaKeikha/spatiotemporal-observer-math</text><text x="120" y="281" class="label">PHYSICAL SUBSYSTEM IDENTIFICATION</text>
  <rect x="120" y="307" width="680" height="120" rx="15" fill="#eff6ff" stroke="#60a5fa"/><text x="150" y="343" class="head">Measured dynamical process</text><text x="150" y="378" class="eq">Xₜ₊₁ = AₜXₜ + εₜ</text><text x="150" y="408" class="body">physical time series · uncertainty · timescale</text>
  <path class="arrow" d="M460 427 V457"/>
  <rect x="120" y="470" width="680" height="145" rx="15" fill="#ecfdf5" stroke="#34d399"/><text x="150" y="506" class="head">Time-dependent subsystem boundary</text><text x="150" y="542" class="eq">W = (S₀, … , Sₜ₋₁)</text><text x="150" y="577" class="body">integration · insulation · persistence · transport</text><text x="150" y="602" class="small">The physical boundary is inferred rather than fixed in advance.</text>
  <path class="arrow" d="M460 615 V645"/>
  <rect x="120" y="658" width="680" height="160" rx="15" fill="#fefce8" stroke="#eab308"/><text x="150" y="694" class="head">Recovery and finite-sample certification</text><text x="150" y="732" class="body">population recovery · symmetry · impossibility</text><text x="150" y="760" class="body">covariance uncertainty · temporal calibration</text><text x="150" y="788" class="body">innovation whitening · covariance-to-path bridge</text><text x="150" y="810" class="small">Output: a statistically certified physical subsystem.</text>
  <rect x="880" y="280" width="160" height="445" rx="22" fill="#0f172a"/><text x="960" y="337" text-anchor="middle" style="font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;letter-spacing:.8px">RESEARCH</text><text x="960" y="361" text-anchor="middle" style="font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8;letter-spacing:.8px">HANDOFF</text><text x="960" y="420" text-anchor="middle" class="eqdark">pW ∈ QP</text><path d="M920 470 H1000" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#arrow)"/><text x="960" y="525" text-anchor="middle" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1">certified</text><text x="960" y="547" text-anchor="middle" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1">physical</text><text x="960" y="569" text-anchor="middle" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1">object</text><text x="960" y="635" text-anchor="middle" style="font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8">no experiential</text><text x="960" y="655" text-anchor="middle" style="font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8">property added</text><text x="960" y="675" text-anchor="middle" style="font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8">at this step</text>
  <rect x="1080" y="165" width="640" height="700" rx="22" fill="#fcfbff" stroke="#7c3aed" stroke-width="1.8"/><text x="1120" y="213" class="repo">Mathematical Consciousness Bridge</text><text x="1120" y="241" class="small">github.com/MahsaKeikha/mathematical-consciousness-bridge</text><text x="1120" y="281" class="label">NEXT MATHEMATICAL-PHYSICS LAYER</text>
  <rect x="1120" y="307" width="560" height="145" rx="15" fill="#f5f3ff" stroke="#a78bfa"/><text x="1150" y="343" class="head">Intervention-resolved causal structure</text><text x="1150" y="379" class="eq">Pᵤ,τ(p) = ℒ(Yᵛ(t + τ) | do(u), p)</text><text x="1150" y="412" class="body">response geometry G · directed influence A</text><text x="1150" y="438" class="body">partition irreducibility K</text>
  <path class="arrow" d="M1400 452 V482"/>
  <rect x="1120" y="495" width="560" height="145" rx="15" fill="#fff7ed" stroke="#fb923c"/><text x="1150" y="531" class="head">Time, composition, scale, and uncertainty</text><text x="1150" y="567" class="body">P14-P15 · temporal continuation + finite error</text><text x="1150" y="597" class="body">P16 · independent composition + coupling</text><text x="1150" y="627" class="body">P17 · coarse-graining + refinement limits</text>
  <path class="arrow" d="M1400 640 V670"/>
  <rect x="1120" y="683" width="560" height="135" rx="15" fill="#0f172a"/><text x="1150" y="721" style="font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc">Open physical-to-experiential bridge</text><text x="1150" y="760" class="eqdark">B̄ : QP → QE</text><text x="1150" y="792" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1">Requires experiential formalization, theory discrimination,</text><text x="1150" y="814" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1">finite-data evidence, and falsification.</text>
  <path class="arrow" d="M840 515 H872"/><path class="arrow" d="M1040 515 H1072"/>
  <rect x="80" y="895" width="1640" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="110" y="925" class="body">The second repository extends the physical program.</text><text x="110" y="951" class="body">It does not redefine the observer theorem as a consciousness result.</text>
</svg>