<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P74 finite-sample target-channel recovery</title>
  <desc id="desc">What this figure shows: P74 converts one finite-sample confidence event for the observed eight-cell law into a guarded version of the P73 target-channel inversion. How to read it: follow the four attached top-row stages from observed data to the shared confidence event, then to the nondegeneracy gate, and finally to certified output. The lower-left panel shows the interval inversion formulas; the lower-right panel states what successful certification and gate failure mean. Main takeaway: recovery is reported only when finite-sample uncertainty stays away from the covariance singularity. Gate failure means not certified by the current data, not population degeneracy. Scientific status: finite-sample certification theorem figure conditional on the P73 model. It does not validate conditional independence, identify the latent state with consciousness, or close the physical-to-experiential bridge.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 30px Arial,Helvetica,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Arial,Helvetica,sans-serif;fill:#475569}
      .step{font:700 17px Arial,Helvetica,sans-serif;fill:#0f172a}
      .body{font:400 14px Arial,Helvetica,sans-serif;fill:#334155}
      .eq{font:600 14px Arial,Helvetica,sans-serif;fill:#0f172a}
      .small{font:400 12.5px Arial,Helvetica,sans-serif;fill:#64748b}
      .panelTitle{font:700 19px Arial,Helvetica,sans-serif;fill:#0f172a}
      .boundary{font:600 13px Arial,Helvetica,sans-serif;fill:#334155}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="32" y="26" width="1136" height="708" rx="22" fill="#ffffff" stroke="#d7e0ea" stroke-width="2"/>
  <text x="60" y="64" class="title">P74 Finite-Sample Target-Channel Recovery</text>
  <text x="60" y="94" class="subtitle">Finite data support the P73 inversion only when uncertainty stays away from the singular covariance boundary.</text>

  <g id="observed-data-panel">
    <rect x="60" y="130" width="240" height="220" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="82" y="162" class="step">1. Observed data</text>
    <text x="82" y="198" class="body">n IID triples</text>
    <text x="82" y="224" class="eq">(X1, X2, X3) in {-1,+1}^3</text>
    <text x="82" y="258" class="eq">8-cell empirical law P_hat</text>
    <text x="82" y="292" class="small">No latent labels are observed.</text>
    <text x="82" y="316" class="small">Sampling starts from the observed law.</text>
  </g>

  <path d="M300 240 L334 240" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g id="confidence-event-panel">
    <rect x="340" y="130" width="240" height="220" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="362" y="158" class="step">2. One shared</text>
    <text x="362" y="180" class="step">confidence event</text>
    <text x="362" y="216" class="body">eps = sqrt(log(16/alpha)/(2n))</text>
    <text x="362" y="244" class="body">delta = min{2, 8 eps}</text>
    <text x="362" y="278" class="eq">|C_hat - C| &lt;= 3 delta</text>
    <text x="362" y="306" class="eq">|M_hat - M| &lt;= 13 delta</text>
    <text x="362" y="330" class="small">One event controls all reported bounds.</text>
  </g>

  <path d="M580 240 L614 240" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g id="nondegeneracy-gate-panel">
    <rect x="620" y="130" width="240" height="220" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="642" y="158" class="step" fill="#7c2d12">3. Nondegeneracy</text>
    <text x="642" y="180" class="step" fill="#7c2d12">gate</text>
    <text x="642" y="216" class="eq" fill="#7c2d12">L12 &gt; 0, L13 &gt; 0, L23 &gt; 0</text>
    <text x="642" y="246" class="body" fill="#7c2d12">covariance sign product &gt; 0</text>
    <text x="642" y="282" class="step" fill="#9a3412">If not: NOT CERTIFIED</text>
    <text x="642" y="310" class="small" fill="#9a3412">Do not invert through a</text>
    <text x="642" y="330" class="small" fill="#9a3412">near-zero denominator.</text>
  </g>

  <path d="M860 240 L894 240" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g id="certified-output-panel">
    <rect x="900" y="130" width="240" height="220" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="922" y="158" class="step" fill="#14532d">4. Certified output</text>
    <text x="922" y="204" class="body" fill="#166534">q in [qL, qU]</text>
    <text x="922" y="232" class="body" fill="#166534">|m| and v intervals</text>
    <text x="922" y="260" class="body" fill="#166534">prevalence orbit</text>
    <text x="922" y="294" class="eq" fill="#14532d">gamma_j in [Lj, Uj]</text>
    <text x="922" y="322" class="small" fill="#166534">All intervals hold together</text>
    <text x="922" y="340" class="small" fill="#166534">on the shared event.</text>
  </g>

  <g id="inversion-panel">
    <rect x="60" y="390" width="520" height="250" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="84" y="426" class="panelTitle">P73 inversion with finite-data intervals</text>
    <text x="84" y="466" class="eq">qL = LM^2 / (U12 U13 U23)</text>
    <text x="84" y="496" class="eq">qU = UM^2 / (L12 L13 L23)</text>
    <text x="84" y="534" class="eq">v in [ 4/(qU+4), 4/(qL+4) ]</text>
    <text x="84" y="574" class="eq">gamma_1,L = sqrt( L12 L13 / (vU U23) )</text>
    <text x="84" y="604" class="small">Use cyclic permutations for gamma_2 and gamma_3.</text>
    <text x="84" y="626" class="small">Every denominator is protected by the top-row gate.</text>
  </g>

  <g id="meaning-panel">
    <rect x="620" y="390" width="520" height="250" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="644" y="426" class="panelTitle" fill="#1e3a8a">What the certificate means</text>
    <text x="644" y="466" class="body" fill="#1e40af">With probability at least 1-alpha, all reported</text>
    <text x="644" y="488" class="body" fill="#1e40af">intervals hold simultaneously.</text>
    <text x="644" y="526" class="eq" fill="#1e40af">gamma_123 &gt;= max_j gamma_j,L</text>
    <text x="644" y="564" class="body" fill="#1e40af">Away from covariance degeneracy, the intervals</text>
    <text x="644" y="586" class="body" fill="#1e40af">contract as n grows.</text>
    <text x="644" y="616" class="small" fill="#7c2d12">Gate failure = insufficient current resolution,</text>
    <text x="644" y="634" class="small" fill="#7c2d12">not proof of population degeneracy.</text>
  </g>

  <g id="scientific-boundary">
    <rect x="60" y="672" width="1080" height="48" rx="12" fill="#f1f5f9"/>
    <text x="82" y="696" class="boundary">Scientific boundary: P74 quantifies sampling uncertainty conditional on the P73 model. It does not validate conditional independence,</text>
    <text x="82" y="714" class="boundary">does not identify the latent state with consciousness, and does not establish the physical-to-experiential bridge.</text>
  </g>
</svg>
