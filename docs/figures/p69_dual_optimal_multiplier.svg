<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">P69 certified dual-optimal multiplier search</title>
  <desc id="desc">A theorem map from the P68 dual family to exact edgewise minimizing spends, a supergradient interval, monotone multiplier bracketing, supporting-line bounds, and a certified strongest-dual-value approximation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="840" rx="24" fill="#f8fafc"/>
  <text x="58" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">P69  Certified dual-optimal multiplier search</text>
  <text x="58" y="92" font-family="Arial, sans-serif" font-size="16" fill="#475569">Optimize the P68 lower-bound family without assuming strong duality.</text>

  <g id="block-dual" data-x="45" data-y="135" data-w="310" data-h="190">
    <rect x="45" y="135" width="310" height="190" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="68" y="172" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">1. P68 dual family</text>
    <text x="68" y="211" font-family="Arial, sans-serif" font-size="14" fill="#334155">q(lambda) = sum edge minima</text>
    <text x="68" y="238" font-family="Arial, sans-serif" font-size="14" fill="#334155">- lambda B</text>
    <text x="68" y="278" font-family="Arial, sans-serif" font-size="14" fill="#475569">Every lambda &gt; 0 gives a valid</text>
    <text x="68" y="301" font-family="Arial, sans-serif" font-size="14" fill="#475569">P63 lower bound.</text>
  </g>

  <g id="block-spend" data-x="445" data-y="135" data-w="310" data-h="190">
    <rect x="445" y="135" width="310" height="190" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="468" y="172" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">2. Exact minimizing spends</text>
    <text x="468" y="210" font-family="Arial, sans-serif" font-size="14" fill="#334155">M_e(lambda): exact integer minima</text>
    <text x="468" y="244" font-family="Arial, sans-serif" font-size="14" fill="#334155">S_min = sum c_e min M_e</text>
    <text x="468" y="274" font-family="Arial, sans-serif" font-size="14" fill="#334155">S_max = sum c_e max M_e</text>
    <text x="468" y="302" font-family="Arial, sans-serif" font-size="14" fill="#475569">Both decrease with lambda.</text>
  </g>

  <g id="block-gradient" data-x="845" data-y="135" data-w="310" data-h="190">
    <rect x="845" y="135" width="310" height="190" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="868" y="172" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">3. Supergradient interval</text>
    <text x="868" y="213" font-family="Arial, sans-serif" font-size="14" fill="#334155">[S_min - B, S_max - B]</text>
    <text x="868" y="251" font-family="Arial, sans-serif" font-size="14" fill="#475569">Contains 0: exact dual optimum.</text>
    <text x="868" y="282" font-family="Arial, sans-serif" font-size="14" fill="#475569">Positive: move right.</text>
    <text x="868" y="306" font-family="Arial, sans-serif" font-size="14" fill="#475569">Negative: move left.</text>
  </g>

  <line id="arrow-1" x1="355" y1="230" x2="445" y2="230" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" data-source="block-dual" data-target="block-spend"/>
  <line id="arrow-2" x1="755" y1="230" x2="845" y2="230" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" data-source="block-spend" data-target="block-gradient"/>

  <g id="block-bracket" data-x="120" data-y="400" data-w="400" data-h="190">
    <rect x="120" y="400" width="400" height="190" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="145" y="438" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">4. Sign-changing bracket</text>
    <text x="145" y="478" font-family="Arial, sans-serif" font-size="15" fill="#334155">g_L &gt; 0 at lambda_L</text>
    <text x="145" y="510" font-family="Arial, sans-serif" font-size="15" fill="#334155">g_R &lt; 0 at lambda_R</text>
    <text x="145" y="548" font-family="Arial, sans-serif" font-size="14" fill="#475569">Bisection preserves the optimizer</text>
    <text x="145" y="571" font-family="Arial, sans-serif" font-size="14" fill="#475569">inside the bracket.</text>
  </g>

  <g id="block-support" data-x="680" data-y="400" data-w="400" data-h="190">
    <rect x="680" y="400" width="400" height="190" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="705" y="438" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">5. Supporting-line certificate</text>
    <text x="705" y="478" font-family="Arial, sans-serif" font-size="15" fill="#334155">Q_low = best evaluated q</text>
    <text x="705" y="510" font-family="Arial, sans-serif" font-size="15" fill="#334155">Q_up = intersecting supports</text>
    <text x="705" y="548" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Q_low &lt;= q* &lt;= Q_up</text>
    <text x="705" y="575" font-family="Arial, sans-serif" font-size="14" fill="#475569">Stop when Q_up - Q_low &lt;= eps.</text>
  </g>

  <line id="arrow-3" x1="1000" y1="325" x2="455" y2="400" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" data-source="block-gradient" data-target="block-bracket"/>
  <line id="arrow-4" x1="520" y1="495" x2="680" y2="495" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" data-source="block-bracket" data-target="block-support"/>

  <g id="block-boundary" data-x="135" data-y="655" data-w="930" data-h="130">
    <rect x="135" y="655" width="930" height="130" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="160" y="691" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Scientific and mathematical boundary</text>
    <text x="160" y="727" font-family="Arial, sans-serif" font-size="14" fill="#334155">P69 certifies the strongest P68 dual value to tolerance. It does not assume q* = U*_int.</text>
    <text x="160" y="754" font-family="Arial, sans-serif" font-size="14" fill="#475569">Dual optimality is not, by itself, primal exactness and is not evidence about consciousness or quantum ontology.</text>
  </g>
  <line id="arrow-5" x1="880" y1="590" x2="880" y2="655" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" data-source="block-support" data-target="block-boundary"/>
</svg>
