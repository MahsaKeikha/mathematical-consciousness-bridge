<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">P100 Anytime-Valid Sequential E-Process</title>
  <desc id="desc">What this figure shows: Figure 2. P100 anytime-valid sequential e-process. Each fresh P99 certification round produces a conditionally valid e-value E_t. A predictable stake eta_t chosen from past information only forms the factor F_t = (1 - eta_t) + eta_t E_t, and the product M_t is a nonnegative supermartingale. Ville's inequality makes the first crossing of 1/alpha anytime-valid. The exact checkpoint shows two individually non-decisive rounds with E_t = 25/2 and eta_t = 1/2: each factor is 27/4, so M_2 = 729/16 = 45.5625 exceeds the 95 percent threshold 20. How to read it: follow the round sequence from left to right, then compare the cumulative process with the horizontal threshold. Main takeaway: valid fresh-round evidence can accumulate across adaptive inspection times without a new alpha split, provided current-round choices are predictable and current certification data remain conditionally fresh. Scientific status: Reader-facing research figure; formal status is controlled by the linked proof and provenance record.</desc>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">P100 Anytime-Valid Sequential E-Process</text>
  <text x="700" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#374151">Fresh P99 evidence accumulates through predictable stakes and remains valid under repeated inspection</text>

  <rect x="65" y="145" width="375" height="250" rx="22" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="252" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111827">Round 1</text>
  <text x="92" y="224" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">Plan, calibration, eta1 frozen from the past</text>
  <text x="92" y="257" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">Fresh P99 certification data</text>
  <text x="92" y="305" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">E1 = 25 / 2 = 12.5</text>
  <text x="92" y="340" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2937">eta1 = 1 / 2  ->  F1 = 27 / 4</text>
  <text x="92" y="374" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4b5563">M1 = 27 / 4 = 6.75 &lt; 20</text>

  <path d="M440 270 L520 270" fill="none" stroke="#475569" stroke-width="3"/>
  <polygon points="520,270 505,261 505,279" fill="#475569"/>
  <text x="480" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">past updates next plan</text>

  <rect x="520" y="145" width="375" height="250" rx="22" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
  <text x="707" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#312e81">Round 2</text>
  <text x="547" y="224" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">Plan may adapt to Round 1 history</text>
  <text x="547" y="257" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">Current data still conditionally fresh</text>
  <text x="547" y="305" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">E2 = 25 / 2 = 12.5</text>
  <text x="547" y="340" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2937">eta2 = 1 / 2  ->  F2 = 27 / 4</text>
  <text x="547" y="374" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#312e81">M2 = 729 / 16 = 45.5625 &gt; 20</text>

  <path d="M895 270 L975 270" fill="none" stroke="#475569" stroke-width="3"/>
  <polygon points="975,270 960,261 960,279" fill="#475569"/>
  <text x="935" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">continue if needed</text>

  <rect x="975" y="145" width="360" height="250" rx="22" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="1155" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111827">General round t</text>
  <text x="1002" y="225" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">E[E_t | F_(t-1)] &lt;= 1</text>
  <text x="1002" y="263" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">F_t = (1 - eta_t) + eta_t E_t</text>
  <text x="1002" y="303" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">M_t = product F_s</text>
  <text x="1002" y="342" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">eta_t predictable from past only</text>
  <text x="1002" y="374" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4b5563">No current-round leakage</text>

  <rect x="90" y="445" width="1220" height="165" rx="24" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
  <text x="700" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111827">Anytime-valid crossing rule</text>
  <line x1="170" y1="548" x2="1230" y2="548" stroke="#9ca3af" stroke-width="3"/>
  <line x1="170" y1="510" x2="1230" y2="510" stroke="#b45309" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1240" y="516" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#92400e">1 / alpha = 20</text>
  <circle cx="390" cy="563" r="9" fill="#334155"/>
  <text x="390" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#374151">M1 = 6.75</text>
  <circle cx="760" cy="490" r="10" fill="#4338ca"/>
  <text x="760" y="473" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#312e81">M2 = 45.5625, first crossing</text>
  <text x="220" y="535" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">Ville: P(sup_t M_t &gt;= 1 / alpha) &lt;= alpha</text>

  <rect x="90" y="650" width="560" height="155" rx="20" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="370" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#312e81">Exact checkpoint accounting</text>
  <text x="120" y="730" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1f2937">One round: 15,096 unique observations</text>
  <text x="120" y="760" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1f2937">First exact replication: 15,168 per round</text>
  <text x="120" y="790" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1f2937">Two-round crossing: 30,192 / 30,336</text>

  <rect x="750" y="650" width="560" height="155" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1030" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#9a3412">Scientific boundary</text>
  <text x="780" y="728" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#431407">Fresh means conditionally valid given the accumulated past.</text>
  <text x="780" y="758" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#431407">No current-round stake/calibration leakage or reused-data relabeling.</text>
  <text x="780" y="788" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#431407">No model acceptance, consciousness identification, nonphysicality, or bridge completion.</text>

  <text x="700" y="856" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7280">Reserve example: eta = 1/2 and E_t = 0 gives F_t = 1/2, so the process is reduced rather than annihilated.</text>
</svg>