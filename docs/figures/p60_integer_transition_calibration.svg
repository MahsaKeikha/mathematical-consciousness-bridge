<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">P60 integer transition calibration allocation</title>
  <desc id="desc">A publication-safe diagram showing how the P59 continuous allocation is converted into whole measurement counts under a hard total budget with an explicit overhead bound.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#334155"/></marker>
    <style>
      .h1{font:700 40px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .sub{font:400 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
      .bt{font:700 25px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .tx{font:400 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155}
      .math{font:600 20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f172a}
      .small{font:400 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}
      .arrow{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
      .card{stroke-width:2}
    </style>
  </defs>
  <rect width="1800" height="1050" rx="28" fill="#f8fafc"/>
  <text x="70" y="70" class="h1">P60: Turn the ideal allocation into whole measurements</text>
  <text x="70" y="112" class="sub">P59 gives fractional counts. P60 gives a hard-budget integer construction and an explicit worst-case overhead bound.</text>

  <g id="p60-budget" data-qa-block="true" data-x="70" data-y="175" data-width="500" data-height="245">
    <rect class="card" x="70" y="175" width="500" height="245" rx="22" fill="#ffffff" stroke="#94a3b8"/>
    <text x="115" y="222" class="bt">1. Hard integer budget</text>
    <text x="115" y="272" class="math">B measurements, m edges</text>
    <text x="115" y="320" class="tx">Reserve at most one rounding unit</text>
    <text x="115" y="352" class="tx">per calibrated transition.</text>
  </g>

  <g id="p60-reduced" data-qa-block="true" data-x="650" data-y="175" data-width="500" data-height="245">
    <rect class="card" x="650" y="175" width="500" height="245" rx="22" fill="#eef2ff" stroke="#6366f1"/>
    <text x="695" y="222" class="bt">2. Solve P59 on B - m</text>
    <text x="695" y="272" class="math">n~ₑ = n*ₑ(B - m)</text>
    <text x="695" y="320" class="tx">Use the exact continuous allocation</text>
    <text x="695" y="352" class="tx">on the reduced effective budget.</text>
  </g>

  <g id="p60-round" data-qa-block="true" data-x="1230" data-y="175" data-width="500" data-height="245">
    <rect class="card" x="1230" y="175" width="500" height="245" rx="22" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1275" y="222" class="bt">3. Round upward</text>
    <text x="1275" y="272" class="math">kₑ = ceil(n~ₑ)</text>
    <text x="1275" y="320" class="tx">Every count becomes a whole number.</text>
    <text x="1275" y="352" class="math">Σₑ kₑ ≤ B</text>
  </g>

  <path d="M570 297.5 H638" class="arrow" data-from="p60-budget" data-to="p60-reduced"/>
  <path d="M1150 297.5 H1218" class="arrow" data-from="p60-reduced" data-to="p60-round"/>

  <g id="p60-uncertainty" data-qa-block="true" data-x="245" data-y="515" data-width="620" data-height="250">
    <rect class="card" x="245" y="515" width="620" height="250" rx="24" fill="#ecfdf5" stroke="#10b981"/>
    <text x="295" y="565" class="bt">Certified uncertainty</text>
    <text x="295" y="625" class="math">U(k) ≤ U*(B - m)</text>
    <text x="295" y="680" class="tx">Rounding upward adds measurements,</text>
    <text x="295" y="712" class="tx">so the surrogate cannot worsen.</text>
  </g>

  <g id="p60-loss" data-qa-block="true" data-x="935" data-y="515" data-width="620" data-height="250">
    <rect class="card" x="935" y="515" width="620" height="250" rx="24" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="985" y="565" class="bt">Loss relative to ideal full budget</text>
    <text x="985" y="625" class="math">U(k) / U*(B) ≤ √[B/(B-m)]</text>
    <text x="985" y="680" class="tx">The ratio approaches 1 as B grows</text>
    <text x="985" y="712" class="tx">relative to the edge count m.</text>
  </g>

  <path d="M1480 420 C1440 470 1320 485 1245 515" class="arrow" data-from="p60-round" data-to="p60-loss"/>
  <path d="M1480 420 C1280 470 690 480 555 515" class="arrow" data-from="p60-round" data-to="p60-uncertainty"/>

  <g id="p60-target" data-qa-block="true" data-x="420" data-y="855" data-width="960" data-height="130">
    <rect class="card" x="420" y="855" width="960" height="130" rx="22" fill="#fff7ed" stroke="#f97316"/>
    <text x="470" y="902" class="bt">Target uncertainty ε: sufficient hard integer budget</text>
    <text x="900" y="950" text-anchor="middle" class="math">B ≥ m + ceil(S³ / ε²)</text>
  </g>

  <path d="M900 765 V843" class="arrow" data-from="p60-uncertainty" data-to="p60-target"/>
  <path d="M1245 765 C1180 810 1040 820 1000 855" class="arrow" data-from="p60-loss" data-to="p60-target"/>

  <text x="900" y="1025" text-anchor="middle" class="small">Boundary: P60 proves a feasible integer design with a certified overhead bound. Exact integer optimality is established only in P61.</text>
</svg>
