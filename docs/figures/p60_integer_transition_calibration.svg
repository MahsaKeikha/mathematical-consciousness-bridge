<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">P60 integer transition-calibration allocation</title>
  <desc id="desc">A visual showing how the P59 continuous allocation is converted into whole measurement counts under a hard total budget with an explicit overhead bound.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/></filter>
    <style>
      .h1{font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:400 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}.bt{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}.tx{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155}.math{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f172a}.small{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}.arrow{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="740" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="h1">P60: Turn the ideal allocation into whole measurements</text>
  <text x="60" y="88" class="sub">P59 gives fractional counts. P60 gives an implementable hard-budget integer construction and quantifies its worst-case loss.</text>

  <g filter="url(#shadow)"><rect x="70" y="145" width="300" height="150" rx="18" fill="#ffffff" stroke="#94a3b8"/><text x="98" y="180" class="bt">1. Hard integer budget</text><text x="98" y="214" class="math">B measurements, m edges</text><text x="98" y="245" class="tx">Reserve at most one rounding unit</text><text x="98" y="268" class="tx">per calibrated transition.</text></g>
  <g filter="url(#shadow)"><rect x="450" y="145" width="300" height="150" rx="18" fill="#eef2ff" stroke="#6366f1"/><text x="478" y="180" class="bt">2. Solve P59 on B - m</text><text x="478" y="214" class="math">n~ₑ = n*ₑ(B - m)</text><text x="478" y="245" class="tx">Use the exact continuous allocation</text><text x="478" y="268" class="tx">on the reduced effective budget.</text></g>
  <g filter="url(#shadow)"><rect x="830" y="145" width="300" height="150" rx="18" fill="#ffffff" stroke="#94a3b8"/><text x="858" y="180" class="bt">3. Round upward</text><text x="858" y="214" class="math">kₑ = ceil(n~ₑ)</text><text x="858" y="245" class="tx">Every count is a whole number and</text><text x="858" y="268" class="math">Σₑ kₑ ≤ B</text></g>
  <path d="M370 220 L450 220" class="arrow"/><path d="M750 220 L830 220" class="arrow"/>

  <g filter="url(#shadow)"><rect x="160" y="390" width="390" height="145" rx="20" fill="#ecfdf5" stroke="#10b981"/><text x="190" y="428" class="bt">Certified uncertainty</text><text x="190" y="464" class="math">U(k) ≤ U*(B - m)</text><text x="190" y="498" class="tx">Rounding upward only adds measurements,</text><text x="190" y="521" class="tx">so the surrogate cannot get worse.</text></g>
  <g filter="url(#shadow)"><rect x="650" y="390" width="390" height="145" rx="20" fill="#eff6ff" stroke="#3b82f6"/><text x="680" y="428" class="bt">Loss relative to ideal full budget</text><text x="680" y="464" class="math">U(k) / U*(B) ≤ √[B/(B-m)]</text><text x="680" y="498" class="tx">The ratio approaches 1 as the budget</text><text x="680" y="521" class="tx">becomes large compared with edge count.</text></g>
  <path d="M980 295 C930 345 830 360 810 390" class="arrow"/><path d="M980 295 C760 345 430 360 350 390" class="arrow"/>

  <g filter="url(#shadow)"><rect x="260" y="610" width="680" height="85" rx="20" fill="#fff7ed" stroke="#f97316"/><text x="295" y="645" class="bt">Target uncertainty ε: sufficient hard integer budget</text><text x="600" y="678" text-anchor="middle" class="math">B ≥ m + ceil(S³ / ε²)</text></g>
  <path d="M600 535 L600 610" class="arrow"/>
  <text x="60" y="725" class="small">Boundary: P60 proves a closed-form feasible integer design with a certified overhead bound. It does not yet claim exact integer optimality.</text>
</svg>
