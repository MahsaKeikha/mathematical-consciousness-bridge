<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">P60 hard-budget integer rounding with certified overhead</title>
  <desc id="desc">What this figure shows: P60 converts the exact P59 continuous unit-cost calibration design into executable whole-measurement counts while respecting a hard integer budget. It solves P59 at the deliberately reduced budget N0 = B - m, rounds every edge count upward, and certifies both feasibility and the resulting uncertainty overhead relative to the full-budget continuous optimum. How to read it: move left to right across the top row from the hard budget to the reduced P59 allocation and then to ceiling rounding. The center theorem panel combines the budget-feasibility proof with the deterministic uncertainty guarantee. Follow the three lower branches to the full-budget multiplicative overhead, the sufficient target-uncertainty budget, and the distinction between this constructive guarantee and P61 exact integer optimality. Main takeaway: P60 gives a closed-form auditable integer construction with an explicit worst-case overhead; it is conservative and is not claimed to be the exact integer optimum. Scientific status: Deterministic rounding and experimental-budget theorem for the declared calibration surrogate. It does not validate the observation model or sensitivity weights, identify a transition metric with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Arial,sans-serif;fill:#475569}
      .head{font:700 18px Arial,sans-serif;fill:#0f172a}
      .copy{font:400 15px Arial,sans-serif;fill:#334155}
      .small{font:400 14px Arial,sans-serif;fill:#475569}
      .eq{font:600 16px Georgia,'Times New Roman',serif;fill:#0f172a}
      .strong{font:700 17px Arial,sans-serif;fill:#0f172a}
      .route{font:700 13px Arial,sans-serif;fill:#475569}
      .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="1000" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P60  Hard-budget integer rounding with certified overhead</text>
  <text x="60" y="90" class="subtitle">Turn the P59 fractional optimum into whole measurements without exceeding the declared budget.</text>

  <g id="block-budget" data-x="55" data-y="130" data-w="330" data-h="200">
    <rect x="55" y="130" width="330" height="200" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="168" class="head">1. Hard integer budget</text>
    <text x="80" y="207" class="strong">B &gt; m = |E|</text>
    <text x="80" y="239" class="copy">m calibrated transition edges</text>
    <text x="80" y="274" class="eq">N₀ = B - m &gt; 0</text>
    <text x="80" y="303" class="small">Reserve at most one rounding</text>
    <text x="80" y="324" class="small">unit per calibrated edge.</text>
  </g>

  <g id="block-continuous" data-x="435" data-y="130" data-w="330" data-h="200">
    <rect x="435" y="130" width="330" height="200" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="460" y="168" class="head">2. Reduced P59 optimum</text>
    <text x="460" y="204" class="eq">S = Σₑ bₑ^(2/3)</text>
    <text x="460" y="236" class="eq">ñₑ = N₀ bₑ^(2/3) / S</text>
    <text x="460" y="270" class="eq">U*(N₀) = S^(3/2)</text>
    <text x="460" y="296" class="eq">/ √N₀</text>
    <text x="460" y="322" class="small">Exact continuous design at N₀.</text>
  </g>

  <g id="block-round" data-x="815" data-y="130" data-w="330" data-h="200">
    <rect x="815" y="130" width="330" height="200" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="840" y="168" class="head">3. Ceiling to whole counts</text>
    <text x="840" y="210" class="strong">kₑ = ceil(ñₑ)</text>
    <text x="840" y="249" class="copy">Every kₑ is executable.</text>
    <text x="840" y="284" class="eq">Σₑ kₑ ≤ B - 1 &lt; B</text>
    <text x="840" y="315" class="small">Hence the hard budget is respected.</text>
  </g>

  <path id="arrow-1" class="arrow" d="M385 230 H435" data-source="block-budget" data-target="block-continuous"/>
  <path id="arrow-2" class="arrow" d="M765 230 H815" data-source="block-continuous" data-target="block-round"/>

  <text x="600" y="370" class="route" text-anchor="middle">ceiling monotonicity gives a deterministic implementability certificate</text>

  <g id="block-certificate" data-x="120" data-y="390" data-w="960" data-h="225">
    <rect x="120" y="390" width="960" height="225" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="600" y="428" text-anchor="middle" class="head">4. Feasible integer design with certified uncertainty</text>
    <text x="600" y="469" text-anchor="middle" class="copy">Because ceil(x) &lt; x + 1 and Σₑ ñₑ = B - m, the rounded total is strictly below B.</text>
    <text x="600" y="507" text-anchor="middle" class="copy">Because every surrogate term bₑ / √nₑ decreases as its count increases, rounding upward cannot worsen it.</text>
    <text x="600" y="548" text-anchor="middle" class="strong">U(k) ≤ U*(B - m) = S^(3/2) / √(B - m)</text>
    <text x="600" y="585" text-anchor="middle" class="small">This is an implementability guarantee, not a proof of exact integer optimality.</text>
  </g>

  <path id="arrow-3" class="arrow" d="M600 330 V390" data-source="block-continuous" data-target="block-certificate"/>
  <path id="arrow-4" class="arrow" d="M980 330 V360 H900 V390" data-source="block-round" data-target="block-certificate"/>

  <g id="block-overhead" data-x="55" data-y="680" data-w="330" data-h="170">
    <rect x="55" y="680" width="330" height="170" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="718" class="head">5. Full-budget overhead</text>
    <text x="80" y="757" class="eq">U(k) / U*(B) ≤</text>
    <text x="80" y="789" class="strong">√[B / (B - m)]</text>
    <text x="80" y="821" class="small">For fixed m, this tends to 1</text>
    <text x="80" y="843" class="small">as B becomes large.</text>
  </g>

  <g id="block-target" data-x="435" data-y="680" data-w="330" data-h="170">
    <rect x="435" y="680" width="330" height="170" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="460" y="718" class="head">6. Target ε budget</text>
    <text x="460" y="757" class="eq">B ≥ m + ceil(</text>
    <text x="460" y="788" class="strong">S³ / ε² )</text>
    <text x="460" y="821" class="small">is sufficient to guarantee</text>
    <text x="460" y="843" class="small">U(k) ≤ ε.</text>
  </g>

  <g id="block-scope" data-x="815" data-y="680" data-w="330" data-h="170">
    <rect x="815" y="680" width="330" height="170" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="840" y="718" class="head">7. Guarantee, not optimum</text>
    <text x="840" y="758" class="copy">Unused budget can remain.</text>
    <text x="840" y="792" class="small">P60 favors a closed-form bound.</text>
    <text x="840" y="818" class="small">P61 gives the exact integer</text>
    <text x="840" y="840" class="small">optimum for unit costs.</text>
  </g>

  <path id="arrow-5" class="arrow" d="M300 615 V650 H220 V680" data-source="block-certificate" data-target="block-overhead"/>
  <path id="arrow-6" class="arrow" d="M600 615 V680" data-source="block-certificate" data-target="block-target"/>
  <path id="arrow-7" class="arrow" d="M900 615 V650 H980 V680" data-source="block-certificate" data-target="block-scope"/>

  <g id="block-boundary" data-x="90" data-y="870" data-w="1020" data-h="125">
    <rect x="90" y="870" width="1020" height="125" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="118" y="898" class="head">Theorem and scientific boundary</text>
    <text x="118" y="922" class="small">P60 certifies a conservative integer implementation of the declared P59 separable calibration surrogate.</text>
    <text x="118" y="944" class="small">It does not prove that this rounded allocation is the exact integer optimum; that stronger result is P61.</text>
    <text x="118" y="966" class="small">It does not validate the observation model or sensitivity weights, or identify a transition metric with consciousness.</text>
    <text x="118" y="988" class="small">It does not establish a physical-to-experiential bridge or imply quantum incompleteness.</text>
  </g>
</svg>
