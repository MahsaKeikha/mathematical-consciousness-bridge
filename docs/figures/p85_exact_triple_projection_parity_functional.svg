<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="p85-title p85-desc">
  <title id="p85-title">P85 Three-Event Shared-Parameter Parity Certificate</title>
  <desc id="p85-desc">What this figure shows: Proposition 85 strengthens the P84 pairwise parity certificate by testing signed functionals of three distinct canonical parity observables under one shared P75 parameter assignment. How to read it: move left to right from the limitation of one-event and two-event compatibility, through the common-parameter three-event functional, to the exact rational strict witness. Main takeaway: the displayed witness has P84 lower bound zero while P85 detects an exact 3/8 functional gap; dividing by the centered coefficient norm 12 gives the certified full-law L-infinity lower bound 1/32. Scientific status: this is a conditional exact model-separation theorem for the declared P75 family. It does not identify a latent variable with consciousness, prove consciousness is nonphysical, validate an alternative model, or solve the physical-to-experiential bridge.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #cfd8e6; stroke-width: 1.5; }
      .panelSoft { fill: #f3f7fb; stroke: #cfd8e6; stroke-width: 1.2; }
      .accent { fill: #173b65; }
      .accentSoft { fill: #eaf2fb; stroke: #8fb0d4; stroke-width: 1.3; }
      .success { fill: #eef8f1; stroke: #8eb89a; stroke-width: 1.3; }
      .warn { fill: #fff7e8; stroke: #d6b267; stroke-width: 1.3; }
      .ink { fill: #172235; font-family: Arial, Helvetica, sans-serif; }
      .muted { fill: #5d6a7c; font-family: Arial, Helvetica, sans-serif; }
      .white { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 31px; font-weight: 700; }
      .subtitle { font-size: 16px; }
      .section { font-size: 20px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .formula { font-size: 16px; font-weight: 700; }
      .metric { font-size: 23px; font-weight: 700; }
      .tiny { font-size: 12px; }
      .arrow { stroke: #6c87a7; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6c87a7"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <rect class="accent" x="0" y="0" width="1280" height="112"/>
  <text class="white title" x="54" y="50">P85 Three-Event Shared-Parameter Parity Certificate</text>
  <text class="white subtitle" x="54" y="79">Pairwise compatibility can survive even when three observables cannot share one P75 parameter assignment.</text>

  <rect class="panel" x="48" y="144" rx="16" ry="16" width="350" height="448"/>
  <text class="ink section" x="72" y="181">1. What P84 can still miss</text>
  <text class="muted body" x="72" y="207">P83 checks one parity observable at a time.</text>
  <text class="muted body" x="72" y="228">P84 checks every genuinely coupled pair.</text>

  <rect class="panelSoft" x="78" y="258" rx="10" ry="10" width="290" height="72"/>
  <text class="ink label" x="98" y="286">Observable A and B</text>
  <text class="muted body" x="98" y="309">Compatible under some shared parameters</text>

  <rect class="panelSoft" x="78" y="344" rx="10" ry="10" width="290" height="72"/>
  <text class="ink label" x="98" y="372">Observable A and C</text>
  <text class="muted body" x="98" y="395">Compatible under some shared parameters</text>

  <rect class="panelSoft" x="78" y="430" rx="10" ry="10" width="290" height="72"/>
  <text class="ink label" x="98" y="458">Observable B and C</text>
  <text class="muted body" x="98" y="481">Compatible under some shared parameters</text>

  <rect class="warn" x="78" y="520" rx="10" ry="10" width="290" height="48"/>
  <text class="ink label" x="98" y="549">Pairwise pass does not imply triple pass.</text>

  <path class="arrow" d="M406 368 C430 368, 438 368, 462 368"/>

  <rect class="panel" x="470" y="144" rx="16" ry="16" width="350" height="448"/>
  <text class="ink section" x="494" y="181">2. P85 keeps all three tied</text>
  <text class="muted body" x="494" y="207">Choose three distinct canonical even-parity events</text>
  <text class="muted body" x="494" y="228">and one sign-normalized functional.</text>

  <rect class="accentSoft" x="500" y="258" rx="12" ry="12" width="290" height="91"/>
  <text class="ink formula" x="520" y="289">T = s1 P(H1) + s2 P(H2) + s3 P(H3)</text>
  <text class="muted body" x="520" y="316">s1 = +1; s2,s3 in {-1,+1}</text>
  <text class="muted body" x="520" y="337">660 standard three-event functionals</text>

  <rect class="panelSoft" x="500" y="365" rx="12" ry="12" width="290" height="91"/>
  <text class="ink label" x="520" y="394">Exact P75 box interval</text>
  <text class="muted body" x="520" y="419">Multi-affine branch extrema occur at endpoints.</text>
  <text class="muted body" x="520" y="441">Prevalence is affine, so its endpoints suffice.</text>

  <rect class="panelSoft" x="500" y="472" rx="12" ry="12" width="290" height="91"/>
  <text class="ink label" x="520" y="501">Exact full-law transfer</text>
  <text class="muted body" x="520" y="526">D(T) = min_c sum_x |g(x) - c|</text>
  <text class="muted body" x="520" y="548">L85 = max(L84, gap / D(T))</text>

  <path class="arrow" d="M828 368 C850 368, 862 368, 884 368"/>

  <rect class="panel" x="892" y="144" rx="16" ry="16" width="340" height="448"/>
  <text class="ink section" x="916" y="181">3. Exact strict witness</text>
  <text class="muted body" x="916" y="207">T = P(H{0,3}) + P(H{1,3}) + P(H{0,1,3})</text>

  <rect class="success" x="920" y="244" rx="11" ry="11" width="284" height="62"/>
  <text class="ink label" x="940" y="270">Complete P84 certificate</text>
  <text class="ink metric" x="940" y="295">L84 = 0</text>

  <rect class="accentSoft" x="920" y="320" rx="11" ry="11" width="284" height="82"/>
  <text class="ink label" x="940" y="347">Three-event functional</text>
  <text class="ink formula" x="940" y="374">T(empirical) = 19/8</text>
  <text class="ink formula" x="940" y="394">T(P75 box) in [0, 2]</text>

  <rect class="warn" x="920" y="416" rx="11" ry="11" width="284" height="62"/>
  <text class="ink label" x="940" y="442">Exact mismatch</text>
  <text class="ink metric" x="940" y="469">gap = 3/8</text>

  <rect class="panelSoft" x="920" y="492" rx="11" ry="11" width="284" height="72"/>
  <text class="ink body" x="940" y="518">Centered coefficient norm D(T) = 12</text>
  <text class="ink metric" x="940" y="551">L85 = (3/8)/12 = 1/32</text>

  <rect class="accent" x="48" y="620" rx="14" ry="14" width="1184" height="92"/>
  <text class="white label" x="72" y="650">Scientific boundary</text>
  <text class="white body" x="72" y="676">P85 strengthens rejection of the declared P75 latent measurement family. It does not identify the latent state with consciousness,</text>
  <text class="white body" x="72" y="697">prove consciousness is nonphysical, validate an alternative model, or solve the physical-to-experiential bridge.</text>

  <text class="muted tiny" x="48" y="742">Mathematical Consciousness Bridge | Proposition 85 | exact rational certificate</text>
</svg>