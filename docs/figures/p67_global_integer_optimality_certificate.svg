<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">P67 global integer optimality certificate</title>
  <desc id="desc">What this figure shows: P67 gives a sufficient common-multiplier certificate that can upgrade one feasible integer allocation to the unrestricted P63 optimum. How to read it: move left to right across the three upper cards. First require a feasible positive-integer allocation that spends the budget exactly. Next form the edgewise multiplier intervals implied by discrete marginal gains. Then test whether all intervals share one positive multiplier. From that common-intersection gate, follow the labeled pass branch to exact global optimality or the labeled fail branch to an explicitly inconclusive result. Main takeaway: a tight budget plus one common multiplier proves global optimality for the declared integer calibration problem; failure of the sufficient certificate does not prove suboptimality. Scientific status: optimization-certificate theorem figure for the declared surrogate. It is not a consciousness theorem, physical-to-experiential bridge theorem, or quantum-completeness claim.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Arial,sans-serif;fill:#475569}
      .head{font:700 18px Arial,sans-serif;fill:#0f172a}
      .copy{font:400 15px Arial,sans-serif;fill:#334155}
      .small{font:400 14px Arial,sans-serif;fill:#475569}
      .strong{font:700 17px Arial,sans-serif;fill:#0f172a}
      .route{font:700 13px Arial,sans-serif;fill:#475569}
      .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="800" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P67  Global integer optimality certificate</text>
  <text x="60" y="92" class="subtitle">A sufficient common-multiplier test for upgrading a feasible candidate to the unrestricted P63 optimum.</text>

  <g id="block-candidate" data-x="55" data-y="135" data-w="330" data-h="220">
    <rect x="55" y="135" width="330" height="220" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="80" y="173" class="head">1. Feasible candidate</text>
    <text x="80" y="211" class="copy">k_e are positive integers</text>
    <text x="80" y="244" class="copy">sum c_e k_e = B</text>
    <text x="80" y="281" class="small">P66 output is one possible</text>
    <text x="80" y="305" class="small">candidate, but P67 accepts any</text>
    <text x="80" y="329" class="small">candidate satisfying the gate.</text>
  </g>

  <g id="block-intervals" data-x="435" data-y="135" data-w="330" data-h="220">
    <rect x="435" y="135" width="330" height="220" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="460" y="169" class="head">2. Edgewise multiplier</text>
    <text x="460" y="192" class="head">intervals</text>
    <text x="460" y="224" class="copy">Delta_e(j)=b_e[j^(-1/2)</text>
    <text x="460" y="247" class="copy">- (j+1)^(-1/2)]</text>
    <text x="460" y="278" class="copy">L_e = Delta_e(k_e)/c_e</text>
    <text x="460" y="303" class="copy">H_e = Delta_e(k_e-1)/c_e</text>
    <text x="460" y="328" class="small">At k_e=1, only the lower</text>
    <text x="460" y="348" class="small">gate applies.</text>
  </g>

  <g id="block-intersection" data-x="815" data-y="135" data-w="330" data-h="220">
    <rect x="815" y="135" width="330" height="220" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="840" y="173" class="head">3. Common-multiplier gate</text>
    <text x="840" y="216" class="copy">lambda_low = max_e L_e</text>
    <text x="840" y="250" class="copy">lambda_high = min_e H_e</text>
    <text x="840" y="293" class="strong">lambda_low &lt;= lambda_high</text>
    <text x="840" y="324" class="small">Any common positive lambda</text>
    <text x="840" y="346" class="small">is a valid witness.</text>
  </g>

  <line id="arrow-1" class="arrow" x1="385" y1="245" x2="435" y2="245" data-source="block-candidate" data-target="block-intervals"/>
  <line id="arrow-2" class="arrow" x1="765" y1="245" x2="815" y2="245" data-source="block-intervals" data-target="block-intersection"/>

  <text x="480" y="405" class="route" text-anchor="middle">gate passes</text>
  <text x="870" y="405" class="route" text-anchor="middle">gate fails or budget is not tight</text>

  <g id="block-certified" data-x="100" data-y="430" data-w="455" data-h="190">
    <rect x="100" y="430" width="455" height="190" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="128" y="470" class="head">Certificate succeeds</text>
    <text x="128" y="509" class="copy">Every k_e minimizes its one-edge</text>
    <text x="128" y="533" class="copy">Lagrangian term for the same lambda.</text>
    <text x="128" y="571" class="strong">U(k) = U*_int(B)</text>
    <text x="128" y="598" class="small">Certified unrestricted P63 global optimum.</text>
  </g>

  <g id="block-inconclusive" data-x="645" data-y="430" data-w="455" data-h="190">
    <rect x="645" y="430" width="455" height="190" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="673" y="470" class="head">Certificate does not succeed</text>
    <text x="673" y="509" class="copy">No common multiplier, or the</text>
    <text x="673" y="533" class="copy">candidate leaves budget slack.</text>
    <text x="673" y="571" class="strong">Status: not certified</text>
    <text x="673" y="598" class="small">This does not prove suboptimality.</text>
  </g>

  <line id="arrow-3" class="arrow" x1="900" y1="355" x2="470" y2="430" data-source="block-intersection" data-target="block-certified"/>
  <line id="arrow-4" class="arrow" x1="1035" y1="355" x2="850" y2="430" data-source="block-intersection" data-target="block-inconclusive"/>

  <g id="block-boundary" data-x="90" data-y="665" data-w="1020" data-h="88">
    <rect x="90" y="665" width="1020" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="118" y="696" class="head">Scientific boundary</text>
    <text x="118" y="724" class="small">P67 certifies only the integer resource-allocation optimum for the declared calibration surrogate.</text>
    <text x="118" y="747" class="small">It is not a consciousness theorem, bridge theorem, empirical consciousness result, or quantum-completeness claim.</text>
  </g>
</svg>
