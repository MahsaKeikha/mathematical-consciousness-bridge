<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Proposition 67: a Lagrangian certificate for unrestricted integer optimality</title>
  <desc id="desc">What this figure shows: P63 solves the heterogeneous-cost whole-measurement calibration problem exactly by a pseudo-polynomial dynamic program over the full budget. P65 provides a scalable baseline-safe floor construction. P66 then spends the residual budget exactly inside the class of integer allocations that componentwise dominate the P65 floor.. Visible guideposts include: A sufficient common-multiplier test for upgrading a candidate to the unrestricted P63 optimum.; 1. Candidate allocation; k_e in positive integers; sum c_e k_e = B; P66 output is one candidate.; Budget must be tight.. How to read it: follow the diagram in the direction of its arrows and use each box, panel, inequality, or highlighted region only with the meaning printed beside it. Main takeaway: this is the visual companion to Proposition 67; the proposition document supplies the assumptions, proof, and exact scope of every implication. Scientific status: Proposition 67 theorem/certificate visual. It is not independent empirical evidence and does not, by itself, identify a physical or latent variable with consciousness.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="780" rx="24" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">P67  Global integer optimality certificate</text>
  <text x="60" y="96" font-family="Arial, sans-serif" font-size="16" fill="#475569">A sufficient common-multiplier test for upgrading a candidate to the unrestricted P63 optimum.</text>

  <g id="block-candidate" data-x="55" data-y="145" data-w="330" data-h="210">
    <rect x="55" y="145" width="330" height="210" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="78" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">1. Candidate allocation</text>
    <text x="78" y="216" font-family="Arial, sans-serif" font-size="16" fill="#334155">k_e in positive integers</text>
    <text x="78" y="250" font-family="Arial, sans-serif" font-size="16" fill="#334155">sum c_e k_e = B</text>
    <text x="78" y="286" font-family="Arial, sans-serif" font-size="15" fill="#475569">P66 output is one candidate.</text>
    <text x="78" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">Budget must be tight.</text>
  </g>

  <g id="block-intervals" data-x="435" data-y="145" data-w="330" data-h="210">
    <rect x="435" y="145" width="330" height="210" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="458" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">2. Multiplier intervals</text>
    <text x="458" y="216" font-family="Arial, sans-serif" font-size="15" fill="#334155">Delta_e(j) = b_e[j^(-1/2)</text>
    <text x="458" y="241" font-family="Arial, sans-serif" font-size="15" fill="#334155">- (j+1)^(-1/2)]</text>
    <text x="458" y="278" font-family="Arial, sans-serif" font-size="15" fill="#334155">Delta_e(k_e)/c_e &lt;= lambda</text>
    <text x="458" y="303" font-family="Arial, sans-serif" font-size="15" fill="#334155">&lt;= Delta_e(k_e-1)/c_e</text>
    <text x="458" y="333" font-family="Arial, sans-serif" font-size="14" fill="#475569">At k_e = 1, lower bound only.</text>
  </g>

  <g id="block-intersection" data-x="815" data-y="145" data-w="330" data-h="210">
    <rect x="815" y="145" width="330" height="210" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="838" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">3. Common intersection</text>
    <text x="838" y="220" font-family="Arial, sans-serif" font-size="16" fill="#334155">lambda_low = max_e L_e</text>
    <text x="838" y="254" font-family="Arial, sans-serif" font-size="16" fill="#334155">lambda_high = min_e H_e</text>
    <text x="838" y="294" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">lambda_low &lt;= lambda_high</text>
    <text x="838" y="329" font-family="Arial, sans-serif" font-size="14" fill="#475569">A common lambda is the witness.</text>
  </g>

  <line id="arrow-1" x1="385" y1="250" x2="435" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" data-source="block-candidate" data-target="block-intervals"/>
  <line id="arrow-2" x1="765" y1="250" x2="815" y2="250" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" data-source="block-intervals" data-target="block-intersection"/>

  <g id="block-certified" data-x="125" data-y="430" data-w="430" data-h="190">
    <rect x="125" y="430" width="430" height="190" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="150" y="468" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Certificate succeeds</text>
    <text x="150" y="508" font-family="Arial, sans-serif" font-size="16" fill="#334155">Each k_e minimizes its Lagrangian term.</text>
    <text x="150" y="545" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">U(k) = U*_int(B)</text>
    <text x="150" y="582" font-family="Arial, sans-serif" font-size="15" fill="#475569">Global optimum for unrestricted P63.</text>
  </g>

  <g id="block-inconclusive" data-x="645" data-y="430" data-w="430" data-h="190">
    <rect x="645" y="430" width="430" height="190" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="670" y="468" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Certificate does not succeed</text>
    <text x="670" y="508" font-family="Arial, sans-serif" font-size="16" fill="#334155">Budget slack or no common lambda.</text>
    <text x="670" y="545" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Status: not certified</text>
    <text x="670" y="582" font-family="Arial, sans-serif" font-size="15" fill="#475569">This does not prove suboptimality.</text>
  </g>

  <line id="arrow-3" x1="925" y1="355" x2="490" y2="430" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" data-source="block-intersection" data-target="block-certified"/>
  <line id="arrow-4" x1="1035" y1="355" x2="865" y2="430" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)" data-source="block-intersection" data-target="block-inconclusive"/>

  <g id="block-boundary" data-x="105" data-y="665" data-w="990" data-h="72">
    <rect x="105" y="665" width="990" height="72" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="130" y="693" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Scientific boundary:</text>
    <text x="273" y="693" font-family="Arial, sans-serif" font-size="15" fill="#334155">P67 certifies an integer resource-allocation optimum for the declared surrogate.</text>
    <text x="130" y="719" font-family="Arial, sans-serif" font-size="14" fill="#475569">It is not a consciousness theorem, bridge theorem, or claim about quantum completeness.</text>
  </g>
</svg>
