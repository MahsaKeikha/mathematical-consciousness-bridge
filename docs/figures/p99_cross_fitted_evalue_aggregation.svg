<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">P99 Cross-Fitted E-Value Aggregation</title>
  <desc id="desc">What this figure shows: Figure 2. P99 cross-fitted e-value aggregation. P99 converts a selection-valid level-tau fold rejection into the exact e-value R(tau)/tau. Finite threshold mixtures remain valid when their calibration is frozen before own-fold evaluation. Fixed convex averaging across folds remains valid even when the cross-fitted fold certificates are dependent, because the proof uses expectation linearity rather than independence. How to read it: follow only the labeled arrows, axes, panels, set relations, or inequalities shown in the visual and interpret them using the adjacent research text. Main takeaway: the figure summarizes the stated mathematical or scientific dependency; visual proximity alone does not add a claim. Scientific status: Reader-facing research figure; formal status is controlled by the linked proof or source record.</desc>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">P99 Cross-Fitted E-Value Aggregation</text>
  <text x="700" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">Selection-valid fold tests become exact evidence and combine without fold-independence assumptions</text>

  <rect x="60" y="150" width="400" height="250" rx="22" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="260" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111827">Fold 1</text>
  <text x="90" y="228" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">Plan and calibration chosen from</text>
  <text x="90" y="255" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">other blocks.</text>
  <text x="90" y="290" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">Own certification block excluded</text>
  <text x="90" y="317" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">from selection.</text>
  <text x="90" y="352" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">tau = 1/25</text>
  <text x="90" y="380" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1f2937">If fold rejects: E1 = 25</text>

  <rect x="940" y="150" width="400" height="250" rx="22" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="1140" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111827">Fold 2</text>
  <text x="970" y="228" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">Plan and calibration chosen from</text>
  <text x="970" y="255" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">other blocks.</text>
  <text x="970" y="290" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">Own certification block excluded</text>
  <text x="970" y="317" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">from selection.</text>
  <text x="970" y="352" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">tau = 1/25</text>
  <text x="970" y="380" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1f2937">If fold rejects: E2 = 25</text>

  <path d="M460 275 C565 275 600 335 640 410" fill="none" stroke="#475569" stroke-width="3"/>
  <path d="M940 275 C835 275 800 335 760 410" fill="none" stroke="#475569" stroke-width="3"/>
  <polygon points="634,399 646,416 627,411" fill="#475569"/>
  <polygon points="766,399 754,416 773,411" fill="#475569"/>

  <rect x="490" y="405" width="420" height="190" rx="24" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
  <text x="700" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#312e81">Exact convex e-value average</text>
  <text x="700" y="495" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1f2937">E_CF = (E1 + E2) / 2</text>
  <text x="700" y="540" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#111827">25 &gt;= 20 = 1 / alpha</text>
  <text x="700" y="573" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">Global rejection at alpha = 1/20</text>

  <rect x="60" y="640" width="620" height="180" rx="20" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="370" y="680" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">Matched balanced checkpoint</text>
  <text x="95" y="720" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">P98: 4045 per regime, exact replication 4056</text>
  <text x="95" y="753" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937">P99: 3774 per regime, exact replication 3792</text>
  <text x="95" y="785" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5563">Configuration-specific gain: 271 observations per regime</text>

  <rect x="720" y="640" width="620" height="205" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1030" y="680" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#9a3412">Scientific boundary</text>
  <text x="755" y="718" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#431407">No own-fold leakage or post-hoc calibration search.</text>
  <text x="755" y="747" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#431407">Independent certification blocks and declared dependence</text>
  <text x="755" y="774" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#431407">assumptions remain required.</text>
  <text x="755" y="801" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#431407">No model acceptance, consciousness identification,</text>
  <text x="755" y="825" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#431407">nonphysicality, or bridge completion.</text>

  <text x="700" y="880" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7280">P99 accumulates distributed fold evidence. It does not uniformly dominate P98.</text>
</svg>
