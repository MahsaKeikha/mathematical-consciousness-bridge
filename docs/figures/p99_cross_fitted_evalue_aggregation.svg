<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">P99 Cross-Fitted E-Value Aggregation</title>
  <desc id="desc">What this figure shows: P99 converts selection-valid fold rejections into exact e-values, averages dependent cross-fitted fold evidence without assuming fold independence, and reaches a global 95 percent rejection threshold with the declared two-fold distributed-evidence checkpoint at 3774 observations per regime.</desc>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">P99 Cross-Fitted E-Value Aggregation</text>
  <text x="700" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#374151">Selection-valid fold tests become exact evidence and combine without fold-independence assumptions</text>

  <rect x="70" y="150" width="360" height="250" rx="22" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="250" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111827">Fold 1</text>
  <text x="95" y="230" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1f2937">Plan and calibration chosen from other blocks</text>
  <text x="95" y="265" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1f2937">Own certification block excluded from selection</text>
  <text x="95" y="310" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#111827">tau = 1/25</text>
  <text x="95" y="345" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2937">If fold rejects: E1 = 25</text>
  <text x="95" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5563">3774 per regime, exact replication 3792</text>

  <rect x="970" y="150" width="360" height="250" rx="22" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="1150" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111827">Fold 2</text>
  <text x="995" y="230" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1f2937">Plan and calibration chosen from other blocks</text>
  <text x="995" y="265" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1f2937">Own certification block excluded from selection</text>
  <text x="995" y="310" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#111827">tau = 1/25</text>
  <text x="995" y="345" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2937">If fold rejects: E2 = 25</text>
  <text x="995" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5563">3774 per regime, exact replication 3792</text>

  <path d="M430 275 C560 275 585 335 640 410" fill="none" stroke="#475569" stroke-width="3"/>
  <path d="M970 275 C840 275 815 335 760 410" fill="none" stroke="#475569" stroke-width="3"/>
  <polygon points="634,399 646,416 627,411" fill="#475569"/>
  <polygon points="766,399 754,416 773,411" fill="#475569"/>

  <rect x="500" y="405" width="400" height="190" rx="24" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
  <text x="700" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#312e81">Exact convex e-value average</text>
  <text x="700" y="495" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#1f2937">E_CF = (E1 + E2) / 2</text>
  <text x="700" y="540" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#111827">25 >= 20 = 1 / alpha</text>
  <text x="700" y="573" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">Global rejection at alpha = 1/20</text>

  <rect x="90" y="650" width="560" height="155" rx="20" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="370" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">Matched balanced checkpoint</text>
  <text x="120" y="730" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1f2937">P98: 4045 per regime, exact replication 4056</text>
  <text x="120" y="765" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1f2937">P99: 3774 per regime, exact replication 3792</text>
  <text x="120" y="795" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4b5563">Configuration-specific gain: 271 observations per regime</text>

  <rect x="750" y="650" width="560" height="155" rx="20" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1030" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#9a3412">Scientific boundary</text>
  <text x="780" y="730" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#431407">No own-fold leakage or post-hoc calibration search.</text>
  <text x="780" y="760" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#431407">Independent certification blocks and declared dependence assumptions remain required.</text>
  <text x="780" y="790" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#431407">No model acceptance, consciousness identification, nonphysicality, or bridge completion.</text>

  <text x="700" y="855" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b7280">P99 accumulates distributed fold evidence. It does not uniformly dominate P98.</text>
</svg>
