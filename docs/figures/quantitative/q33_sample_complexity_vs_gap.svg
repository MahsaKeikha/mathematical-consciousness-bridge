  <title>Categorical sample complexity versus gap</title>
  <desc>What this figure shows: The sufficient sample requirement scales quadratically as the inverse robust separation gap. The plotted object is generated from n &gt;= 8 K^2/gamma_S^2 * log(2 N_P N_pi K / alpha). How to read it: compare the labeled axes, curves, contours, matrix entries, bars, or markers exactly as defined in the atlas entry; the visible trend is the numerical realization of the stated equation or construction. Scientific status: Direct visualization of Proposition 9. Unless explicitly identified otherwise, this is not empirical consciousness data.</desc>
