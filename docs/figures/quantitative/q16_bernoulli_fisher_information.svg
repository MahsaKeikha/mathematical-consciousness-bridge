  <title>Bernoulli Fisher information</title>
  <desc>What this figure shows: Under direct Bernoulli parameterization, Fisher information is smallest at p=1/2 and diverges toward the boundaries. The plotted object is generated from I(p)=1/[p(1-p)]. How to read it: compare the labeled axes, curves, contours, matrix entries, bars, or markers exactly as defined in the atlas entry; the visible trend is the numerical realization of the stated equation or construction. Scientific status: Closed-form information-geometry fact. Unless explicitly identified otherwise, this is not empirical consciousness data.</desc>
