  <desc>What this figure shows: Under an illustrative 1/sqrt(n) error schedule, certified temporal-distance intervals shrink at the same rate. The plotted object is generated from |d_hat - d| &lt;= epsilon_s + epsilon_t. How to read it: compare the labeled axes, curves, contours, matrix entries, bars, or markers exactly as defined in the atlas entry; the visible trend is the numerical realization of the stated equation or construction. Scientific status: Proposition 15 bound visualization. Unless explicitly identified otherwise, this is not empirical consciousness data.</desc>
