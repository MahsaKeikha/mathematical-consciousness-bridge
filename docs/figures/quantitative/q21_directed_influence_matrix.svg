  <title>Directed interventional influence matrix</title>
  <desc>What this figure shows: Directed influence is generally asymmetric; source-to-target effects need not equal target-to-source effects. The plotted object is generated from A_ij^p(tau)=sup TV(P_j^u, P_j^v) over source-i intervention pairs. How to read it: compare the labeled axes, curves, contours, matrix entries, bars, or markers exactly as defined in the atlas entry; the visible trend is the numerical realization of the stated equation or construction. Scientific status: Synthetic causal-structure example. Unless explicitly identified otherwise, this is not empirical consciousness data.</desc>
