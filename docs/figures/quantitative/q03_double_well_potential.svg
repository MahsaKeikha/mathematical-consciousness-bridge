  <title>Double-well potential</title>
  <desc>What this figure shows: Two minima separated by a barrier form a canonical model of noise-driven switching. The plotted object is generated from U(x)=a x^4/4 - b x^2/2. How to read it: compare the labeled axes, curves, contours, matrix entries, bars, or markers exactly as defined in the atlas entry; the visible trend is the numerical realization of the stated equation or construction. Scientific status: Equation-driven physical illustration. Unless explicitly identified otherwise, this is not empirical consciousness data.</desc>
