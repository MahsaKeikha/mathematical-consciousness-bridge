  <title>Controllability Gramian growth</title>
  <desc>What this figure shows: For this stable controllable system, the finite-horizon Gramian grows toward a finite infinite-horizon limit. The plotted object is generated from Wc(T)=integral_0^T exp(At) B B^T exp(A^T t) dt. How to read it: compare the labeled axes, curves, contours, matrix entries, bars, or markers exactly as defined in the atlas entry; the visible trend is the numerical realization of the stated equation or construction. Scientific status: Equation-driven control-theory example. Unless explicitly identified otherwise, this is not empirical consciousness data.</desc>
