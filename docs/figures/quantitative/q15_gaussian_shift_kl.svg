  <title>KL divergence for Gaussian mean shifts</title>
  <desc>What this figure shows: With equal variance, Gaussian KL divergence grows quadratically with normalized mean separation. The plotted object is generated from D_KL = (mu1-mu2)^2/(2 sigma^2). How to read it: compare the labeled axes, curves, contours, matrix entries, bars, or markers exactly as defined in the atlas entry; the visible trend is the numerical realization of the stated equation or construction. Scientific status: Closed-form information-theoretic fact. Unless explicitly identified otherwise, this is not empirical consciousness data.</desc>
