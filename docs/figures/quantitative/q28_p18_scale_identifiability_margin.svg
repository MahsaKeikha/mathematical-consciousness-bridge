  <title>P18 scale-identifiability margin</title>
  <desc>What this figure shows: The coarse family is certified identifiable whenever fine-family separation exceeds twice the reconstruction defect. The plotted object is generated from delta_c &gt;= max(0, delta_f - 2 rho_F). How to read it: compare the labeled axes, curves, contours, matrix entries, bars, or markers exactly as defined in the atlas entry; the visible trend is the numerical realization of the stated equation or construction. Scientific status: Direct visualization of Proposition 18. Unless explicitly identified otherwise, this is not empirical consciousness data.</desc>
