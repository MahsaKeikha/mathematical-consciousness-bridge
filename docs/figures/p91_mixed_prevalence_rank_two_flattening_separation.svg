<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">P91 Mixed-Prevalence Rank-Two Flattening Separation</title>
<desc id="desc">What this figure shows: P91 removes the P90 extreme-prevalence restriction. Every two-component P75 mixture has rank at most two after the X1,X4 versus X2,X3 flattening. The selected empirical three-by-three minor has determinant one over five hundred twelve. At L-infinity radius one over forty-two, all five hundred twelve nonnegative interval-box vertices retain positive determinant, while an explicit mixed P75 point lies at distance one over twenty-four.</desc>
<rect width="1440" height="900" fill="#ffffff"/>
<text x="72" y="72" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" fill="#111827">P91 · Mixed-prevalence rank-two flattening separation</text>
<text x="72" y="116" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#374151">The nonlinear separation survives arbitrary latent prevalence by moving from a rank-one slice to a rank-two full-tensor flattening.</text>

<rect x="58" y="158" width="430" height="560" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="88" y="206" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#111827">1 · Empirical flattening</text>
<text x="88" y="242" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Rows: (X1,X4) · columns: (X2,X3)</text>
<text x="88" y="276" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">Selected rows 01, 10, 11 · columns 00, 01, 11</text>
<rect x="105" y="320" width="105" height="78" fill="#ffffff" stroke="#64748b"/><rect x="210" y="320" width="105" height="78" fill="#ffffff" stroke="#64748b"/><rect x="315" y="320" width="105" height="78" fill="#ffffff" stroke="#64748b"/>
<rect x="105" y="398" width="105" height="78" fill="#ffffff" stroke="#64748b"/><rect x="210" y="398" width="105" height="78" fill="#ffffff" stroke="#64748b"/><rect x="315" y="398" width="105" height="78" fill="#ffffff" stroke="#64748b"/>
<rect x="105" y="476" width="105" height="78" fill="#ffffff" stroke="#64748b"/><rect x="210" y="476" width="105" height="78" fill="#ffffff" stroke="#64748b"/><rect x="315" y="476" width="105" height="78" fill="#ffffff" stroke="#64748b"/>
<text x="157" y="369" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111827">1/24</text><text x="262" y="369" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111827">1/12</text><text x="367" y="369" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111827">1/8</text>
<text x="157" y="447" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111827">1/8</text><text x="262" y="447" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111827">0</text><text x="367" y="447" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111827">0</text>
<text x="157" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111827">1/24</text><text x="262" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111827">5/24</text><text x="367" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111827">1/8</text>
<text x="88" y="608" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#111827">det A = 1/512 &gt; 0</text>
<text x="88" y="650" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">The empirical flattening has rank at least three.</text>

<rect x="505" y="158" width="430" height="560" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="535" y="206" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#111827">2 · Full mixed P75 constraint</text>
<text x="535" y="262" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827">F = (1-pi) u- v-^T + pi u+ v+^T</text>
<text x="535" y="310" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#111827">rank(F) &lt;= 2 for every pi in [0,1]</text>
<text x="535" y="356" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">So every 3 by 3 minor must vanish.</text>
<line x1="555" y1="410" x2="885" y2="410" stroke="#94a3b8" stroke-width="2"/>
<text x="535" y="462" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111827">Closed radius: e = 1/42</text>
<text x="535" y="505" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Probability clipping keeps every entry nonnegative.</text>
<text x="535" y="548" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Determinant is multi-affine in 9 entries.</text>
<text x="535" y="591" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Exact vertices checked: 2^9 = 512</text>
<text x="535" y="640" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#111827">min det = 23/677376 &gt; 0</text>
<text x="535" y="680" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475569">Therefore rank two is impossible throughout the closed ball.</text>

<rect x="952" y="158" width="430" height="560" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="982" y="206" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#111827">3 · Global mixed-prevalence bracket</text>
<text x="982" y="260" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Lower certificate, entire P75 cube:</text>
<text x="982" y="307" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827">d_inf &gt; 1/42</text>
<line x1="982" y1="350" x2="1348" y2="350" stroke="#94a3b8" stroke-width="2"/>
<text x="982" y="402" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Explicit rational P75 point:</text>
<text x="982" y="444" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111827">pi = 4/5</text>
<text x="982" y="480" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Both latent mixture weights are positive.</text>
<text x="982" y="532" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#111827">full-law distance = 1/24</text>
<rect x="982" y="578" width="346" height="82" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="1155" y="611" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Certified P91 result</text>
<text x="1155" y="642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#111827">1/42 &lt; d_inf &lt;= 1/24</text>
<text x="982" y="695" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">The upper endpoint is not claimed to be globally exact.</text>

<rect x="58" y="754" width="1324" height="104" rx="24" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="88" y="796" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111827">What changed after P90</text>
<text x="300" y="796" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111827">P90: exact rank-one slice result on pi = 0</text>
<text x="775" y="796" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111827">P91: rank-two flattening certificate for arbitrary pi</text>
<text x="88" y="833" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Scientific boundary: this is conditional separation for the declared P75 model family. It does not identify consciousness, establish nonphysicality, or close the physical-to-experiential bridge.</text>
</svg>
