<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of Intervention-Resolved Causal Geometry</title>
  <desc id="desc">A visual decomposition of IRCG into response geometry, directed interventional influence, and partition irreducibility, all derived from controlled intervention-conditioned response laws.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#475569"/></marker>
    <style>
      .title{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .sub{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .head{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .body{font:400 13.5px Inter,Segoe UI,Arial,sans-serif;fill:#334155}
      .eq{font:600 15px 'Times New Roman',serif;fill:#0f172a}
      .small{font:600 11px Inter,Segoe UI,Arial,sans-serif;fill:#64748b;letter-spacing:.5px}
      .arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="55" y="55" class="title">Candidate A - Intervention-Resolved Causal Geometry (IRCG)</text>
  <text x="55" y="83" class="sub">The candidate is a structured causal object built from controlled perturbations. No single component is identified with consciousness.</text>

  <rect x="55" y="125" width="1090" height="105" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="80" y="158" class="head">Controlled physical perturbation and delayed response</text>
  <text x="80" y="191" class="eq">P_p^(u,tau) = Law(Y_(t+tau)^V | do(u), p)</text>
  <text x="695" y="158" class="body">u = admissible intervention</text>
  <text x="695" y="181" class="body">tau = physical response delay</text>
  <text x="695" y="204" class="body">V = physical subsystem blocks</text>

  <path class="arrow" d="M600 230 V280"/>

  <g>
    <rect x="55" y="295" width="330" height="225" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="80" y="330" class="head">A. Response geometry  G_p</text>
    <text x="80" y="365" class="eq">d_p^tau(u,v) = ||P^u - P^v||_TV</text>
    <text x="80" y="397" class="body">What it measures</text>
    <text x="80" y="421" class="body">- differentiation among perturbations</text>
    <text x="80" y="444" class="body">- temporal evolution of response distances</text>
    <text x="80" y="467" class="body">- response-equivalence classes</text>
    <rect x="80" y="485" width="228" height="23" rx="8" fill="#d1fae5"/>
    <text x="91" y="501" class="small" fill="#047857">P12: INCOMPLETE BY ITSELF</text>
  </g>

  <g>
    <rect x="435" y="295" width="330" height="225" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="460" y="330" class="head">B. Directed influence  A_p</text>
    <text x="460" y="365" class="eq">A_ij(tau) = sup ||P_j^u - P_j^v||_TV</text>
    <text x="460" y="397" class="body">What it measures</text>
    <text x="460" y="421" class="body">- source-specific causal propagation</text>
    <text x="460" y="444" class="body">- timing and direction of influence</text>
    <text x="460" y="467" class="body">- recurrent return-loop certificates</text>
    <rect x="460" y="485" width="228" height="23" rx="8" fill="#ede9fe"/>
    <text x="471" y="501" class="small" fill="#6d28d9">P12: INCOMPLETE BY ITSELF</text>
  </g>

  <g>
    <rect x="815" y="295" width="330" height="225" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="840" y="330" class="head">C. Partition landscape  K_p</text>
    <text x="840" y="365" class="eq">kappa_p^tau(pi) = sup ||P - product P_B||_TV</text>
    <text x="840" y="397" class="body">What it measures</text>
    <text x="840" y="421" class="body">- failure of block-wise factorization</text>
    <text x="840" y="444" class="body">- partition-specific joint dependence</text>
    <text x="840" y="467" class="body">- irreducibility across physical cuts</text>
    <rect x="840" y="485" width="228" height="23" rx="8" fill="#ffedd5"/>
    <text x="851" y="501" class="small" fill="#c2410c">P12: INCOMPLETE BY ITSELF</text>
  </g>

  <path class="arrow" d="M220 520 V575 H500"/>
  <path class="arrow" d="M600 520 V575"/>
  <path class="arrow" d="M980 520 V575 H700"/>

  <rect x="320" y="585" width="560" height="115" rx="20" fill="#0f172a"/>
  <text x="350" y="620" style="font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc">Full structured candidate</text>
  <text x="350" y="653" style="font:600 17px 'Times New Roman',serif;fill:#e2e8f0">F_IRCG(p) = [(V, U_p, T, G_p, A_p, K_p)]_isomorphism</text>
  <text x="350" y="681" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8">P11 constructs it. P12 proves that collapsing to G, A, K or simple scalars loses information.</text>

  <rect x="920" y="595" width="225" height="95" rx="14" fill="#fff1f2" stroke="#e11d48"/>
  <text x="940" y="622" class="small" fill="#be123c">OPEN BRIDGE QUESTION</text>
  <text x="940" y="649" class="body">Do IRCG equivalence classes</text>
  <text x="940" y="670" class="body">match experiential classes?</text>
</svg>