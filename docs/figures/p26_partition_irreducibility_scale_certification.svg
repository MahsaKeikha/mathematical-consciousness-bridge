<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">P26 partition-irreducibility scale certification</title>
  <desc id="desc">Publication-style theorem map showing block-compatible coarse observation, total-variation contraction, reconstruction-controlled loss, threshold preservation, and the distinction between observation loss and physical fusion.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0 0 L0 8 L10 4 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 36px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .label{font:700 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.8px;fill:#64748b}
      .head{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .body{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .eq{font:600 17px Georgia,'Times New Roman',serif;fill:#0f172a}
      .arrow{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="1180" fill="#ffffff"/>
  <text x="70" y="64" class="title">P26 - Partition-Irreducibility Scale Certification</text>
  <text x="70" y="96" class="subtitle">P11 partition structure + P17 contraction + P18 reconstruction, under block-compatible observation.</text>

  <rect x="85" y="150" width="440" height="215" rx="18" fill="#eff6ff" stroke="#2563eb"/>
  <text x="115" y="185" class="label">FINE PHYSICAL RESPONSE</text>
  <text x="115" y="222" class="head">Declared partition π</text>
  <text x="115" y="260" class="eq">Pπ = ⊗B∈π PB</text>
  <text x="115" y="304" class="eq">κf(π) = ‖P − Pπ‖TV</text>
  <text x="115" y="336" class="body">Irreducibility is distance from the partition-product null.</text>

  <rect x="580" y="150" width="440" height="215" rx="18" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="610" y="185" class="label">BLOCK-COMPATIBLE OBSERVATION</text>
  <text x="610" y="222" class="head">Coordinatewise / blockwise coarse map</text>
  <text x="610" y="260" class="eq">C = C1 × ··· × Cm</text>
  <text x="610" y="304" class="eq">C#Pπ = ⊗B∈π (CB)#PB</text>
  <text x="610" y="336" class="body">Productization commutes with the declared observation map.</text>

  <rect x="1075" y="150" width="440" height="215" rx="18" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1105" y="185" class="label">COARSE PHYSICAL RESPONSE</text>
  <text x="1105" y="222" class="head">Same partition semantics after observation</text>
  <text x="1105" y="260" class="eq">κc(π) = ‖C#P − C#Pπ‖TV</text>
  <text x="1105" y="304" class="eq">κc(π) ≤ κf(π)</text>
  <text x="1105" y="336" class="body">Coarse observation can preserve or erase, not create, dependence.</text>

  <path class="arrow" d="M525 258 H568"/>
  <path class="arrow" d="M1020 258 H1063"/>

  <rect x="155" y="445" width="1290" height="215" rx="20" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8"/>
  <text x="195" y="483" class="label">P18 RECONSTRUCTION-CONTROLLED LOSS</text>
  <text x="195" y="524" class="head">Apply the pairwise scale theorem to P and its partition-product reference Pπ</text>
  <text x="195" y="571" class="eq">0 ≤ κf(π) − κc(π) ≤ ρ(P) + ρ(Pπ)</text>
  <text x="195" y="614" class="body">The two terms expose separate reconstruction burdens for the actual law and the factorized null.</text>

  <path class="arrow" d="M800 365 V433"/>

  <rect x="155" y="735" width="590" height="210" rx="18" fill="#ecfdf5" stroke="#059669"/>
  <text x="185" y="772" class="label">EXACT / THRESHOLD PRESERVATION</text>
  <text x="185" y="812" class="eq">ρ(P)=ρ(Pπ)=0 ⇒ κc(π)=κf(π)</text>
  <text x="185" y="858" class="eq">κf(π) &gt; θ + ε  ⇒  κc(π) &gt; θ</text>
  <text x="185" y="902" class="body">A coarse threshold crossing implies the corresponding fine crossing.</text>

  <rect x="855" y="735" width="590" height="210" rx="18" fill="#fff1f2" stroke="#e11d48"/>
  <text x="885" y="772" class="label">COUNTEREXAMPLE / SCIENTIFIC BOUNDARY</text>
  <text x="885" y="812" class="head">Dependence may disappear completely</text>
  <text x="885" y="858" class="eq">κf(π)=0.4,  κc(π)=0</text>
  <text x="885" y="902" class="body">Collapsing one coordinate can erase fine dependence. This is observation loss, not proof of fusion.</text>

  <path class="arrow" d="M800 660 V704 H450 V723"/>
  <path class="arrow" d="M800 704 H1150 V723"/>

  <rect x="85" y="1020" width="1430" height="100" rx="16" fill="#0f172a"/>
  <text x="120" y="1055" style="font:700 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.8px;fill:#cbd5e1">BOUNDARY</text>
  <text x="120" y="1086" style="font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc">P26 certifies one declared partition under block-compatible observation. Partition-lattice aggregation, genuine physical fusion, complete P11 scale equivalence, and experiential interpretation remain open.</text>
</svg>
