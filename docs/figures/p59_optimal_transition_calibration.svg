<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">P59 optimal transition calibration allocation</title>
  <desc id="desc">A publication-safe diagram showing how a fixed calibration budget is optimally divided across transition measurements according to uncertainty and scientific importance.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#334155"/></marker>
    <style>
      .h1{font:700 40px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .sub{font:400 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
      .bt{font:700 25px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .tx{font:400 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155}
      .math{font:600 20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f172a}
      .small{font:400 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}
      .arrow{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
      .card{stroke-width:2}
    </style>
  </defs>
  <rect width="1800" height="1050" rx="28" fill="#f8fafc"/>
  <text x="70" y="70" class="h1">P59: Spend calibration effort where it matters most</text>
  <text x="70" y="112" class="sub">P58 quantifies transition uncertainty. P59 divides a fixed measurement budget optimally across those transitions.</text>

  <g id="p59-uncertainty" data-qa-block="true" data-x="70" data-y="175" data-width="500" data-height="250">
    <rect class="card" x="70" y="175" width="500" height="250" rx="22" fill="#ffffff" stroke="#94a3b8"/>
    <text x="115" y="222" class="bt">1. Transition uncertainty</text>
    <text x="115" y="272" class="math">ρₑ(nₑ) = aₑ / √nₑ</text>
    <text x="115" y="320" class="tx">More data lowers uncertainty.</text>
    <text x="115" y="352" class="tx">Larger aₑ means harder estimates.</text>
    <text x="115" y="395" class="small">Each edge has a calibration scale.</text>
  </g>

  <g id="p59-importance" data-qa-block="true" data-x="650" data-y="175" data-width="500" data-height="250">
    <rect class="card" x="650" y="175" width="500" height="250" rx="22" fill="#eef2ff" stroke="#6366f1"/>
    <text x="695" y="222" class="bt">2. Transition importance</text>
    <text x="695" y="272" class="math">wₑ &gt; 0</text>
    <text x="695" y="320" class="tx">Larger weight means this edge</text>
    <text x="695" y="352" class="tx">matters more to the surrogate.</text>
    <text x="695" y="395" class="small">wₑaₑ combines importance and scale.</text>
  </g>

  <g id="p59-budget" data-qa-block="true" data-x="1230" data-y="175" data-width="500" data-height="250">
    <rect class="card" x="1230" y="175" width="500" height="250" rx="22" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1275" y="222" class="bt">3. Fixed calibration budget</text>
    <text x="1275" y="272" class="math">Σₑ nₑ = N</text>
    <text x="1275" y="320" class="tx">No transition can be measured</text>
    <text x="1275" y="352" class="tx">arbitrarily many times.</text>
    <text x="1275" y="395" class="small">The design decides how to divide N.</text>
  </g>

  <path d="M570 300 H638" class="arrow" data-from="p59-uncertainty" data-to="p59-importance"/>
  <path d="M1150 300 H1218" class="arrow" data-from="p59-importance" data-to="p59-budget"/>

  <g id="p59-optimum" data-qa-block="true" data-x="245" data-y="520" data-width="1310" data-height="250">
    <rect class="card" x="245" y="520" width="1310" height="250" rx="24" fill="#ecfdf5" stroke="#10b981"/>
    <text x="295" y="570" class="bt">Exact P59 optimum</text>
    <text x="295" y="630" class="math">nₑ* = N (wₑaₑ)^(2/3) / Σⱼ (wⱼaⱼ)^(2/3)</text>
    <text x="295" y="680" class="tx">Harder or more important transitions receive more measurements.</text>
    <text x="295" y="725" class="small">The dependence is a two-thirds-power law, not a linear allocation rule.</text>
  </g>

  <path d="M900 425 V508" class="arrow" data-from="p59-importance" data-to="p59-optimum"/>

  <g id="p59-best" data-qa-block="true" data-x="120" data-y="845" data-width="710" data-height="145">
    <rect class="card" x="120" y="845" width="710" height="145" rx="20" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="165" y="892" class="bt">Best achievable surrogate uncertainty</text>
    <text x="165" y="938" class="math">U*(N) = S^(3/2) / √N</text>
  </g>

  <g id="p59-target" data-qa-block="true" data-x="970" data-y="845" data-width="710" data-height="145">
    <rect class="card" x="970" y="845" width="710" height="145" rx="20" fill="#fff7ed" stroke="#f97316"/>
    <text x="1015" y="892" class="bt">Budget needed for target ε</text>
    <text x="1015" y="938" class="math">N ≥ S³ / ε²</text>
  </g>

  <path d="M560 770 C520 815 475 820 475 833" class="arrow" data-from="p59-optimum" data-to="p59-best"/>
  <path d="M1240 770 C1280 815 1325 820 1325 833" class="arrow" data-from="p59-optimum" data-to="p59-target"/>

  <text x="900" y="1025" text-anchor="middle" class="small">Boundary: P59 exactly solves a declared convex uncertainty surrogate. It does not solve the full combinatorial robust-routing design problem.</text>
</svg>
