<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P59 optimal transition-calibration allocation</title>
  <desc id="desc">A plain visual showing how a fixed calibration budget is optimally divided across transition measurements according to the two-thirds power of uncertainty and importance.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/></filter>
    <style>
      .h1{font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .sub{font:400 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
      .bt{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .tx{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155}
      .math{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f172a}
      .small{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}
      .arrow{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="h1">P59: Spend calibration effort where it matters most</text>
  <text x="60" y="88" class="sub">P58 tells us how uncertain each transition is. P59 tells us how to divide a limited measurement budget optimally.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="135" width="300" height="170" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="88" y="172" class="bt">1. Each transition has uncertainty</text>
    <text x="88" y="207" class="math">ρₑ(nₑ) = aₑ / √nₑ</text>
    <text x="88" y="238" class="tx">More measurements → smaller uncertainty.</text>
    <text x="88" y="264" class="tx">Large aₑ means the transition is harder</text>
    <text x="88" y="286" class="tx">to estimate accurately.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="135" width="300" height="170" rx="18" fill="#eef2ff" stroke="#6366f1"/>
    <text x="478" y="172" class="bt">2. Each transition has importance</text>
    <text x="478" y="207" class="math">wₑ &gt; 0</text>
    <text x="478" y="238" class="tx">A larger weight means uncertainty on</text>
    <text x="478" y="261" class="tx">this transition matters more to the</text>
    <text x="478" y="284" class="tx">declared route-uncertainty surrogate.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="840" y="135" width="300" height="170" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="868" y="172" class="bt">3. Fixed total calibration budget</text>
    <text x="868" y="207" class="math">Σₑ nₑ = N</text>
    <text x="868" y="238" class="tx">We cannot measure every transition</text>
    <text x="868" y="261" class="tx">arbitrarily many times.</text>
    <text x="868" y="284" class="tx">The question is how to divide N.</text>
  </g>

  <path d="M360 220 L450 220" class="arrow"/>
  <path d="M750 220 L840 220" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="190" y="390" width="820" height="160" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="1.7"/>
    <text x="225" y="430" class="bt">Exact P59 optimum</text>
    <text x="225" y="468" class="math">nₑ* = N · (wₑ aₑ)^(2/3) / Σⱼ (wⱼ aⱼ)^(2/3)</text>
    <text x="225" y="505" class="tx">Harder or more important transitions receive more measurements—but only according to a two-thirds-power law.</text>
    <text x="225" y="531" class="small">Example: 8× larger effective importance/uncertainty → 4× more calibration effort, not 8×.</text>
  </g>

  <path d="M600 305 L600 390" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="120" y="625" width="430" height="90" rx="18" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="147" y="658" class="bt">Best achievable surrogate uncertainty</text>
    <text x="147" y="690" class="math">U*(N) = S^(3/2) / √N</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="625" width="430" height="90" rx="18" fill="#fff7ed" stroke="#f97316"/>
    <text x="677" y="658" class="bt">Budget needed for target ε</text>
    <text x="677" y="690" class="math">N ≥ S³ / ε²</text>
  </g>

  <path d="M430 550 C410 590 365 605 335 625" class="arrow"/>
  <path d="M770 550 C790 590 835 605 865 625" class="arrow"/>

  <text x="60" y="747" class="small">Boundary: P59 exactly solves a declared convex uncertainty surrogate; it does not solve the full combinatorial robust-routing design problem.</text>
</svg>
