<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="920" rx="24" fill="#f8fafc"/>
  <text x="700" y="48" text-anchor="middle" font-size="30" font-family="Arial, sans-serif" font-weight="700" fill="#0f172a">P70: exact primal-dual gap decomposition</text>
  <text x="700" y="82" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#334155">Make the P68 certificate gap inspectable without assuming strong duality</text>

  <g id="block-candidate" data-x="60" data-y="130" data-w="360" data-h="160">
    <rect x="60" y="130" width="360" height="160" rx="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="84" y="164" font-size="18" font-family="Arial, sans-serif" font-weight="700" fill="#0c4a6e">Feasible integer candidate k</text>
    <text x="84" y="198" font-size="15" font-family="Arial, sans-serif" fill="#0f172a">U(k) = sum_e b_e / sqrt(k_e)</text>
    <text x="84" y="230" font-size="15" font-family="Arial, sans-serif" fill="#0f172a">C(k) = sum_e c_e k_e &lt;= B</text>
    <text x="84" y="262" font-size="15" font-family="Arial, sans-serif" fill="#334155">Choose any lambda &gt; 0</text>
  </g>

  <g id="block-dual" data-x="520" data-y="130" data-w="360" data-h="160">
    <rect x="520" y="130" width="360" height="160" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="544" y="164" font-size="18" font-family="Arial, sans-serif" font-weight="700" fill="#5b21b6">P68 dual lower bound</text>
    <text x="544" y="198" font-size="15" font-family="Arial, sans-serif" fill="#0f172a">q(lambda) = sum_e phi_e - lambda B</text>
    <text x="544" y="230" font-size="15" font-family="Arial, sans-serif" fill="#0f172a">phi_e = min_j ell_e(j; lambda)</text>
    <text x="544" y="262" font-size="15" font-family="Arial, sans-serif" fill="#334155">q(lambda) &lt;= U*_int(B)</text>
  </g>

  <g id="block-gap" data-x="980" data-y="130" data-w="360" data-h="160">
    <rect x="980" y="130" width="360" height="160" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="1004" y="164" font-size="19" font-family="Arial, sans-serif" font-weight="700" fill="#92400e">Certificate gap</text>
    <text x="1004" y="202" font-size="17" font-family="Arial, sans-serif" fill="#0f172a">G(lambda) = U(k) - q(lambda)</text>
    <text x="1004" y="238" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">Always nonnegative</text>
    <text x="1004" y="268" font-size="15" font-family="Arial, sans-serif" fill="#334155">P70 explains every term</text>
  </g>

  <line id="arrow-candidate-dual" data-source="block-candidate" data-target="block-dual" x1="420" y1="210" x2="510" y2="210" stroke="#334155" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="arrow-dual-gap" data-source="block-dual" data-target="block-gap" x1="880" y1="210" x2="970" y2="210" stroke="#334155" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="block-edge" data-x="110" data-y="380" data-w="500" data-h="190">
    <rect x="110" y="380" width="500" height="190" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="136" y="416" font-size="20" font-family="Arial, sans-serif" font-weight="700" fill="#166534">Edgewise Lagrangian regret</text>
    <text x="136" y="450" font-size="15" font-family="Arial, sans-serif" fill="#0f172a">r_e = ell_e(k_e; lambda)</text>
    <text x="136" y="478" font-size="15" font-family="Arial, sans-serif" fill="#0f172a">minus min_j ell_e(j; lambda)</text>
    <text x="136" y="506" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">r_e &gt;= 0 for every edge</text>
    <text x="136" y="534" font-size="15" font-family="Arial, sans-serif" fill="#334155">Zero iff k_e is edgewise minimizing</text>
    <text x="136" y="558" font-size="13" font-family="Arial, sans-serif" fill="#475569">Diagnostic mismatch, not one-edge primal improvement</text>
  </g>

  <g id="block-slack" data-x="790" data-y="380" data-w="500" data-h="190">
    <rect x="790" y="380" width="500" height="190" rx="18" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="816" y="416" font-size="20" font-family="Arial, sans-serif" font-weight="700" fill="#991b1b">Unused-budget penalty</text>
    <text x="816" y="454" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">s(k) = B - sum_e c_e k_e</text>
    <text x="816" y="490" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">p_slack = lambda s(k) &gt;= 0</text>
    <text x="816" y="526" font-size="15" font-family="Arial, sans-serif" fill="#334155">Zero iff the candidate uses all budget</text>
    <text x="816" y="552" font-size="13" font-family="Arial, sans-serif" fill="#475569">Separate from coordinate mismatch</text>
  </g>

  <line id="arrow-gap-edge" data-source="block-gap" data-target="block-edge" x1="1080" y1="290" x2="600" y2="370" stroke="#334155" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="arrow-gap-slack" data-source="block-gap" data-target="block-slack" x1="1220" y1="290" x2="1040" y2="370" stroke="#334155" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="block-identity" data-x="240" data-y="625" data-w="920" data-h="140">
    <rect x="240" y="625" width="920" height="140" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <text x="270" y="658" font-size="20" font-family="Arial, sans-serif" font-weight="700" fill="#0f172a">Exact P70 identity</text>
    <text x="270" y="694" font-size="18" font-family="Arial, sans-serif" fill="#0f172a">U(k) - q(lambda) = sum_e r_e(k_e; lambda)</text>
    <text x="270" y="724" font-size="18" font-family="Arial, sans-serif" fill="#0f172a">+ lambda [B - sum_e c_e k_e]</text>
    <text x="270" y="752" font-size="14" font-family="Arial, sans-serif" fill="#475569">Zero decomposition = tight budget + common edgewise minimizer = P67 certificate</text>
  </g>

  <line id="arrow-edge-identity" data-source="block-edge" data-target="block-identity" x1="360" y1="570" x2="500" y2="615" stroke="#334155" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="arrow-slack-identity" data-source="block-slack" data-target="block-identity" x1="1040" y1="570" x2="900" y2="615" stroke="#334155" stroke-width="3" marker-end="url(#arrowhead)"/>

  <g id="block-p69" data-x="100" data-y="800" data-w="560" data-h="86">
    <rect x="100" y="800" width="560" height="86" rx="16" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="124" y="834" font-size="18" font-family="Arial, sans-serif" font-weight="700" fill="#6b21a8">P69 strongest-dual diagnostic</text>
    <text x="124" y="864" font-size="16" font-family="Arial, sans-serif" fill="#0f172a">G_low &lt;= U(k) - q* &lt;= G_up</text>
  </g>

  <g id="block-boundary" data-x="740" data-y="800" data-w="560" data-h="86">
    <rect x="740" y="800" width="560" height="86" rx="16" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="764" y="830" font-size="18" font-family="Arial, sans-serif" font-weight="700" fill="#334155">Scientific boundary</text>
    <text x="764" y="854" font-size="13" font-family="Arial, sans-serif" fill="#0f172a">Optimization diagnostic, not evidence about consciousness</text>
    <text x="764" y="876" font-size="13" font-family="Arial, sans-serif" fill="#0f172a">or quantum ontology</text>
  </g>

  <line id="arrow-identity-p69" data-source="block-identity" data-target="block-p69" x1="520" y1="765" x2="420" y2="790" stroke="#334155" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line id="arrow-identity-boundary" data-source="block-identity" data-target="block-boundary" x1="880" y1="765" x2="980" y2="790" stroke="#334155" stroke-width="3" marker-end="url(#arrowhead)"/>
</svg>
