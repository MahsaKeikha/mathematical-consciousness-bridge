<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">P61 exact unit-cost integer transition calibration</title>
  <desc id="desc">What this figure shows: P61 solves the declared equal-unit-cost whole-measurement calibration problem exactly. It starts from one mandatory measurement per calibrated edge, assigns each remaining unit to the edge with the largest current marginal reduction in the separable uncertainty objective, and proves global optimality from strictly diminishing per-edge gains and prefix feasibility. How to read it: move left to right across the top row from the mandatory baseline to the current marginal gain and the greedy allocation step. The center theorem panel explains why diminishing gain sequences make that rule exact. Follow the three lower branches to the checkable exchange certificate, the exact global optimum and tie behavior, and the priority-queue complexity. Main takeaway: P61 closes the equal-unit-cost integer allocation problem for the declared separable surrogate; it does not extend the same greedy proof to heterogeneous costs. Scientific status: exact discrete resource-allocation theorem for experimental calibration. It does not validate the full robust-route model, identify a calibration quantity with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px Arial,sans-serif;fill:#475569}
      .head{font:700 18px Arial,sans-serif;fill:#0f172a}
      .copy{font:400 15px Arial,sans-serif;fill:#334155}
      .small{font:400 14px Arial,sans-serif;fill:#475569}
      .eq{font:600 16px Georgia,'Times New Roman',serif;fill:#0f172a}
      .strong{font:700 17px Arial,sans-serif;fill:#0f172a}
      .route{font:700 13px Arial,sans-serif;fill:#475569}
      .arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="1000" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P61  Exact unit-cost integer transition calibration</text>
  <text x="60" y="90" class="subtitle">Allocate each remaining measurement where its current marginal uncertainty reduction is largest.</text>

  <g id="block-baseline" data-x="55" data-y="130" data-w="330" data-h="200">
    <rect x="55" y="130" width="330" height="200" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="80" y="168" class="head">1. Mandatory baseline</text>
    <text x="80" y="207" class="eq">B ≥ m = |E|</text>
    <text x="80" y="239" class="strong">kₑ = 1 for every edge</text>
    <text x="80" y="275" class="eq">R = B - m</text>
    <text x="80" y="309" class="small">R extra unit-cost measurements remain.</text>
  </g>

  <g id="block-gain" data-x="435" data-y="130" data-w="330" data-h="200">
    <rect x="435" y="130" width="330" height="200" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="460" y="168" class="head">2. Current marginal gain</text>
    <text x="460" y="211" class="eq">Δₑ(k) = bₑ [</text>
    <text x="460" y="239" class="eq">1/√k - 1/√(k+1) ]</text>
    <text x="460" y="278" class="copy">This is the uncertainty reduction</text>
    <text x="460" y="303" class="copy">from one more measurement.</text>
  </g>

  <g id="block-greedy" data-x="815" data-y="130" data-w="330" data-h="200">
    <rect x="815" y="130" width="330" height="200" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="840" y="168" class="head">3. Greedy allocation step</text>
    <text x="840" y="211" class="eq">eₜ ∈ arg maxₑ Δₑ(kₑ)</text>
    <text x="840" y="249" class="strong">kₑₜ ← kₑₜ + 1</text>
    <text x="840" y="286" class="copy">Recompute that edge's next gain</text>
    <text x="840" y="311" class="copy">and repeat for all R units.</text>
  </g>

  <path id="arrow-1" class="arrow" d="M385 230 H435" data-source="block-baseline" data-target="block-gain"/>
  <path id="arrow-2" class="arrow" d="M765 230 H815" data-source="block-gain" data-target="block-greedy"/>

  <text x="600" y="370" class="route" text-anchor="middle">diminishing gains plus prefix feasibility give exactness</text>

  <g id="block-exactness" data-x="120" data-y="390" data-w="960" data-h="225">
    <rect x="120" y="390" width="960" height="225" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="600" y="428" text-anchor="middle" class="head">4. Why the greedy rule is exact</text>
    <text x="600" y="470" text-anchor="middle" class="strong">Δₑ(k+1) &lt; Δₑ(k) for every edge and k ≥ 1</text>
    <text x="600" y="507" text-anchor="middle" class="copy">A final count kₑ = 1 + rₑ collects exactly the first rₑ gains from edge e.</text>
    <text x="600" y="538" text-anchor="middle" class="copy">Every feasible allocation therefore selects decreasing prefixes with total length R.</text>
    <text x="600" y="575" text-anchor="middle" class="strong">Repeatedly taking the largest available next gain is globally optimal.</text>
    <text x="600" y="600" text-anchor="middle" class="small">This exchange argument depends on equal unit measurement cost.</text>
  </g>

  <path id="arrow-3" class="arrow" d="M600 330 V390" data-source="block-gain" data-target="block-exactness"/>
  <path id="arrow-4" class="arrow" d="M980 330 V360 H900 V390" data-source="block-greedy" data-target="block-exactness"/>

  <g id="block-certificate" data-x="55" data-y="680" data-w="330" data-h="170">
    <rect x="55" y="680" width="330" height="170" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="80" y="718" class="head">5. Optimality certificate</text>
    <text x="80" y="758" class="small">Smallest selected last gain</text>
    <text x="80" y="782" class="strong">≥ largest next unused gain</text>
    <text x="80" y="816" class="small">If this fails, a profitable</text>
    <text x="80" y="838" class="small">one-unit exchange exists.</text>
  </g>

  <g id="block-global" data-x="435" data-y="680" data-w="330" data-h="170">
    <rect x="435" y="680" width="330" height="170" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="460" y="718" class="head">6. Exact global optimum</text>
    <text x="460" y="758" class="eq">Σₑ kₑ = B</text>
    <text x="460" y="790" class="strong">U(kᴾ⁶¹) ≤ U(k)</text>
    <text x="460" y="818" class="small">for every feasible full-budget k.</text>
    <text x="460" y="842" class="small">Ties can give multiple optimal allocations.</text>
  </g>

  <g id="block-complexity" data-x="815" data-y="680" data-w="330" data-h="170">
    <rect x="815" y="680" width="330" height="170" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="840" y="718" class="head">7. Priority-queue cost</text>
    <text x="840" y="758" class="strong">O(m + (B-m) log m)</text>
    <text x="840" y="791" class="eq">memory O(m)</text>
    <text x="840" y="824" class="small">P60 remains a simpler closed-form</text>
    <text x="840" y="846" class="small">approximation with an explicit ratio.</text>
  </g>

  <path id="arrow-5" class="arrow" d="M300 615 V650 H220 V680" data-source="block-exactness" data-target="block-certificate"/>
  <path id="arrow-6" class="arrow" d="M600 615 V680" data-source="block-exactness" data-target="block-global"/>
  <path id="arrow-7" class="arrow" d="M900 615 V650 H980 V680" data-source="block-exactness" data-target="block-complexity"/>

  <g id="block-boundary" data-x="90" data-y="870" data-w="1020" data-h="125">
    <rect x="90" y="870" width="1020" height="125" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="118" y="898" class="head">Exactness and scientific boundary</text>
    <text x="118" y="922" class="small">P61 is exact for the declared equal-unit-cost separable integer calibration surrogate.</text>
    <text x="118" y="944" class="small">The same greedy proof is not asserted for heterogeneous costs; P62 and P63 treat that extension.</text>
    <text x="118" y="966" class="small">P61 does not validate the full robust-route model or identify a calibration quantity with consciousness.</text>
    <text x="118" y="988" class="small">It does not establish a physical-to-experiential bridge or imply quantum incompleteness.</text>
  </g>
</svg>
