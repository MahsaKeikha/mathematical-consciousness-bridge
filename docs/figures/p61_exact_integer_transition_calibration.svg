<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">P61 exact integer transition calibration allocation</title>
  <desc id="desc">A publication-safe diagram showing the exact greedy allocation of whole calibration measurements by repeatedly choosing the largest current marginal uncertainty reduction.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#334155"/></marker>
    <style>
      .h1{font:700 40px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .sub{font:400 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#475569}
      .bt{font:700 25px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
      .tx{font:400 20px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#334155}
      .math{font:600 20px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0f172a}
      .small{font:400 17px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#64748b}
      .arrow{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
      .card{stroke-width:2}
    </style>
  </defs>
  <rect width="1800" height="1050" rx="28" fill="#f8fafc"/>
  <text x="70" y="70" class="h1">P61: Exact whole-measurement calibration allocation</text>
  <text x="70" y="112" class="sub">Each extra measurement is assigned where it produces the largest current reduction in the declared uncertainty objective.</text>

  <g id="p61-start" data-qa-block="true" data-x="70" data-y="175" data-width="500" data-height="245">
    <rect class="card" x="70" y="175" width="500" height="245" rx="22" fill="#ffffff" stroke="#94a3b8"/>
    <text x="115" y="222" class="bt">1. Start with one per edge</text>
    <text x="115" y="272" class="math">kₑ = 1 for every e</text>
    <text x="115" y="320" class="tx">This uses m units and makes every</text>
    <text x="115" y="352" class="tx">calibrated transition estimable.</text>
  </g>

  <g id="p61-gain" data-qa-block="true" data-x="650" data-y="175" data-width="500" data-height="245">
    <rect class="card" x="650" y="175" width="500" height="245" rx="22" fill="#eef2ff" stroke="#6366f1"/>
    <text x="695" y="222" class="bt">2. Compute next-step benefit</text>
    <text x="695" y="272" class="math">Δₑ(k) = bₑ(1/√k - 1/√(k+1))</text>
    <text x="695" y="320" class="tx">One more measurement reduces</text>
    <text x="695" y="352" class="tx">edge uncertainty by Δₑ(k).</text>
  </g>

  <g id="p61-choose" data-qa-block="true" data-x="1230" data-y="175" data-width="500" data-height="245">
    <rect class="card" x="1230" y="175" width="500" height="245" rx="22" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1275" y="222" class="bt">3. Choose the largest gain</text>
    <text x="1275" y="272" class="math">e* ∈ arg maxₑ Δₑ(kₑ)</text>
    <text x="1275" y="320" class="tx">Increase that edge count by one,</text>
    <text x="1275" y="352" class="tx">then repeat until B is exhausted.</text>
  </g>

  <path d="M570 297.5 H638" class="arrow" data-from="p61-start" data-to="p61-gain"/>
  <path d="M1150 297.5 H1218" class="arrow" data-from="p61-gain" data-to="p61-choose"/>

  <g id="p61-diminishing" data-qa-block="true" data-x="245" data-y="515" data-width="620" data-height="250">
    <rect class="card" x="245" y="515" width="620" height="250" rx="24" fill="#ecfdf5" stroke="#10b981"/>
    <text x="295" y="565" class="bt">Why greedy is exact</text>
    <text x="295" y="625" class="math">Δₑ(k+1) &lt; Δₑ(k)</text>
    <text x="295" y="680" class="tx">Each edge has diminishing gains.</text>
    <text x="295" y="712" class="tx">Chosen gains form valid prefixes.</text>
  </g>

  <g id="p61-certificate" data-qa-block="true" data-x="935" data-y="515" data-width="620" data-height="250">
    <rect class="card" x="935" y="515" width="620" height="250" rx="24" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="985" y="565" class="bt">Exact optimality certificate</text>
    <text x="985" y="625" class="math">min selected last gain</text>
    <text x="985" y="660" class="math">≥ max next unused gain</text>
    <text x="985" y="712" class="tx">Then no one-unit exchange improves U.</text>
  </g>

  <path d="M900 420 C780 475 590 480 555 515" class="arrow" data-from="p61-gain" data-to="p61-diminishing"/>
  <path d="M1480 420 C1450 470 1320 485 1245 515" class="arrow" data-from="p61-choose" data-to="p61-certificate"/>

  <g id="p61-global" data-qa-block="true" data-x="330" data-y="855" data-width="1140" data-height="130">
    <rect class="card" x="330" y="855" width="1140" height="130" rx="22" fill="#fff7ed" stroke="#f97316"/>
    <text x="900" y="902" text-anchor="middle" class="bt">P61 solves the declared integer surrogate globally</text>
    <text x="900" y="950" text-anchor="middle" class="math">U(kP61) ≤ U(k) for every feasible full-budget integer allocation k</text>
  </g>

  <path d="M555 765 C620 820 760 825 830 855" class="arrow" data-from="p61-diminishing" data-to="p61-global"/>
  <path d="M1245 765 C1180 820 1040 825 970 855" class="arrow" data-from="p61-certificate" data-to="p61-global"/>

  <text x="900" y="1025" text-anchor="middle" class="small">Boundary: exactness applies to the declared separable unit-cost calibration surrogate, not the full combinatorial robust-routing problem.</text>
</svg>
