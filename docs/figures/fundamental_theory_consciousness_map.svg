<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">Fundamental Theory to Consciousness map</title>
  <desc id="desc">What this figure shows: a declared candidate fundamental relational state can be projected into geometry/spacetime, quantum-operational, causal/intervention, and independently formalized experiential structures. How to read it: follow the four solid arrows from the candidate fundamental state to the four declared projections. The geometry, quantum, and causal projections then converge through three separate solid arrows into the complete declared physical map T=(G,Q,C). The experiential projection does not enter T; instead, its dashed independent route joins the final bridge factorization/residual test from the right, while T enters that test from above. Main takeaway: the bridge test compares an independently specified experiential structure against a complete declared physical descriptor rather than silently folding experience into the physical descriptor. Scientific status: research-architecture figure. It formalizes a sufficiency question and an open bridge requirement; it does not assert a fifth spatial dimension, nonphysical substance, simulation ontology, failure of quantum mechanics, or that the physical-to-experiential bridge has been solved.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0 0 L0 8 L10 4 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 42px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 19px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .head{font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
      .copy{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .math{font:600 18px Georgia,'Times New Roman',serif;fill:#0f172a}
      .small{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}
      .routeLabel{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}
      .arrow{stroke:#64748b;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:2.2;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1800" height="1260" fill="#ffffff"/>
  <text x="80" y="70" class="title">Fundamental Theory → Consciousness: a falsifiable bridge architecture</text>
  <text x="80" y="108" class="subtitle">Do not assume spacetime or consciousness is the deepest layer. Test whether experiential structure factors through a complete physical quotient.</text>

  <rect x="530" y="155" width="740" height="150" rx="20" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="900" y="202" class="head" text-anchor="middle">Candidate fundamental relational state</text>
  <text x="900" y="238" class="math" text-anchor="middle">Ω ∈ 𝓜</text>
  <text x="900" y="264" class="copy" text-anchor="middle">Theory-neutral primitive may be fields, algebras, causal relations,</text>
  <text x="900" y="284" class="copy" text-anchor="middle">strings, spin networks, tensor data, or another declared ontology.</text>

  <path id="arrow-fundamental-geometry" class="arrow" d="M900 305 V360 H260 V405" data-source="fundamental" data-target="geometry"/>
  <path id="arrow-fundamental-quantum" class="arrow" d="M900 305 V360 H690 V405" data-source="fundamental" data-target="quantum"/>
  <path id="arrow-fundamental-causal" class="arrow" d="M900 305 V360 H1110 V405" data-source="fundamental" data-target="causal"/>
  <path id="arrow-fundamental-experiential" class="arrow" d="M900 305 V360 H1540 V405" data-source="fundamental" data-target="experiential"/>

  <rect x="90" y="405" width="340" height="220" rx="18" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="260" y="448" class="head" text-anchor="middle">Geometry / spacetime</text>
  <text x="260" y="484" class="math" text-anchor="middle">G: 𝓜 → 𝓠_G</text>
  <text x="260" y="525" class="copy" text-anchor="middle">Metric, causal geometry,</text>
  <text x="260" y="550" class="copy" text-anchor="middle">emergent spacetime observables</text>
  <text x="260" y="592" class="small" text-anchor="middle">Example testbeds: holography,</text>
  <text x="260" y="604" class="small" text-anchor="middle">entanglement equilibrium</text>

  <rect x="520" y="405" width="340" height="220" rx="18" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="690" y="448" class="head" text-anchor="middle">Quantum operational</text>
  <text x="690" y="484" class="math" text-anchor="middle">Q: 𝓜 → 𝓠_Q</text>
  <text x="690" y="525" class="copy" text-anchor="middle">States, channels, POVMs,</text>
  <text x="690" y="550" class="copy" text-anchor="middle">trace distance, predictions</text>
  <text x="690" y="592" class="small" text-anchor="middle">Operational equivalence under</text>
  <text x="690" y="604" class="small" text-anchor="middle">the declared experiment class</text>

  <rect x="940" y="405" width="340" height="220" rx="18" fill="#ecfdf5" stroke="#059669"/>
  <text x="1110" y="448" class="head" text-anchor="middle">Causal / intervention</text>
  <text x="1110" y="484" class="math" text-anchor="middle">C: 𝓜 → 𝓠_C</text>
  <text x="1110" y="525" class="copy" text-anchor="middle">Response geometry, directed</text>
  <text x="1110" y="550" class="copy" text-anchor="middle">influence, irreducibility</text>
  <text x="1110" y="592" class="small" text-anchor="middle">Connects directly to</text>
  <text x="1110" y="604" class="small" text-anchor="middle">P11-P18</text>

  <rect x="1370" y="405" width="340" height="220" rx="18" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1540" y="448" class="head" text-anchor="middle">Experiential layer</text>
  <text x="1540" y="484" class="math" text-anchor="middle">E: 𝓜 → 𝓠_E</text>
  <text x="1540" y="525" class="copy" text-anchor="middle">Independently formalized</text>
  <text x="1540" y="550" class="copy" text-anchor="middle">phenomenal equivalence</text>
  <text x="1540" y="592" class="small" text-anchor="middle">Must not be defined using</text>
  <text x="1540" y="604" class="small" text-anchor="middle">the candidate physical signature</text>

  <text x="900" y="672" class="routeLabel" text-anchor="middle">Three physical projections enter T; the experiential route stays separate.</text>
  <path id="arrow-geometry-physical" class="arrow" d="M260 625 V655 H760 V690" data-source="geometry" data-target="physical-map"/>
  <path id="arrow-quantum-physical" class="arrow" d="M690 625 V690" data-source="quantum" data-target="physical-map"/>
  <path id="arrow-causal-physical" class="arrow" d="M1110 625 V690" data-source="causal" data-target="physical-map"/>

  <rect x="610" y="690" width="580" height="165" rx="20" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="900" y="735" class="head" text-anchor="middle">Complete declared physical map</text>
  <text x="900" y="774" class="math" text-anchor="middle">T(Ω) = (G(Ω), Q(Ω), C(Ω))</text>
  <text x="900" y="808" class="copy" text-anchor="middle">Gauge / representation invariance + finite data</text>
  <text x="900" y="830" class="copy" text-anchor="middle">completeness + scale certification</text>

  <path id="arrow-physical-bridge" class="arrow" d="M900 855 V930" data-source="physical-map" data-target="bridge-test"/>
  <path id="arrow-experiential-bridge" class="dash" d="M1540 625 V1032 H1380" data-source="experiential" data-target="bridge-test"/>
  <text x="1460" y="1012" class="routeLabel" text-anchor="middle">independent E route</text>

  <rect x="420" y="930" width="960" height="205" rx="22" fill="#fffdf5" stroke="#ca8a04" stroke-width="2"/>
  <text x="900" y="975" class="head" text-anchor="middle">Bridge factorization / residual test</text>
  <text x="900" y="1017" class="math" text-anchor="middle">H₀:  E = B_T ∘ T</text>
  <text x="900" y="1055" class="math" text-anchor="middle">d_TOE^⊥ = rank D(Ψ_T, Ψ_E) − rank DΨ_T</text>
  <text x="900" y="1092" class="copy" text-anchor="middle">Exact witness: T(Ω)=T(Ω′) but E(Ω)≠E(Ω′) ⇒ no bridge depending only on T can fit both.</text>

  <text x="80" y="1192" class="small">Scientific boundary: a positive residual would indicate non-factorization relative to the declared physical representation.</text>
  <text x="80" y="1218" class="small">It would not by itself prove a fifth spatial dimension, nonphysical substance, simulation ontology, or failure of quantum mechanics.</text>
</svg>