<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">P97 Simultaneous Finite Candidate-Family Selection</title>
  <desc id="desc">What this figure shows: P97 permits the same certification data to be used to compare and select among a finite family of candidate regime plans when the complete family is fixed before the certification statistics are inspected. Each candidate receives its own familywise error budget and is certified by the P95 regime-wise theorem. A second union bound across candidates gives one simultaneous event on which all candidate certificates are valid. The final candidate may then be selected after inspection without invalidating the selected certificate. The price, unlike P96, is an explicit multiplicity cost. Main takeaway: predeclared finite same-data search can be selection-valid when all candidate certificates are covered simultaneously. Scientific status: conditional theorem under the declared finite candidate family, local P94 assumptions, and exact error-budget accounting. It does not validate newly generated post-inspection candidates, model acceptance, consciousness identification, nonphysicality, or completion of the physical-to-experiential bridge.</desc>
  <rect width="1400" height="900" fill="#f8fafc"/>
  <rect x="40" y="35" width="1320" height="830" rx="24" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>

  <text x="80" y="92" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">P97 Simultaneous Finite Candidate-Family Selection</text>
  <text x="80" y="128" font-family="Arial, sans-serif" font-size="19" fill="#334155">Same-data model-plan selection with explicit multiplicity accounting</text>

  <rect x="80" y="175" width="330" height="290" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="220" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">1. Predeclare candidates</text>
  <text x="110" y="258" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">Fix K candidate plans before</text>
  <text x="110" y="286" font-family="Arial, sans-serif" font-size="17" fill="#1e293b">certification statistics are inspected.</text>
  <text x="128" y="326" font-family="Arial, sans-serif" font-size="17" fill="#334155">regime definitions</text>
  <text x="128" y="358" font-family="Arial, sans-serif" font-size="17" fill="#334155">dependence ranges</text>
  <text x="128" y="390" font-family="Arial, sans-serif" font-size="17" fill="#334155">candidate and local alpha budgets</text>
  <text x="110" y="432" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">No post-inspection new candidate.</text>

  <path d="M 420 320 L 500 320" stroke="#0f172a" stroke-width="4" fill="none"/>
  <polygon points="500,320 481,309 481,331" fill="#0f172a"/>

  <rect x="505" y="175" width="385" height="290" rx="18" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="535" y="220" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#854d0e">2. Certify every candidate</text>
  <text x="535" y="260" font-family="Arial, sans-serif" font-size="17" fill="#3f3f46">For each candidate k, apply P95</text>
  <text x="535" y="288" font-family="Arial, sans-serif" font-size="17" fill="#3f3f46">to all of its declared regimes.</text>
  <text x="555" y="330" font-family="Arial, sans-serif" font-size="17" fill="#713f12">sum_b alpha_kb &lt;= alpha_k</text>
  <text x="555" y="365" font-family="Arial, sans-serif" font-size="17" fill="#713f12">candidate failure &lt;= alpha_k</text>
  <line x1="550" y1="392" x2="845" y2="392" stroke="#ca8a04" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="535" y="430" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#854d0e">Candidates may reuse the same data.</text>

  <path d="M 900 320 L 980 320" stroke="#0f172a" stroke-width="4" fill="none"/>
  <polygon points="980,320 961,309 961,331" fill="#0f172a"/>

  <rect x="985" y="175" width="335" height="290" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1015" y="220" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#065f46">3. Select after inspection</text>
  <text x="1015" y="262" font-family="Arial, sans-serif" font-size="17" fill="#1f2937">Choose any candidate after</text>
  <text x="1015" y="290" font-family="Arial, sans-serif" font-size="17" fill="#1f2937">viewing all certified results.</text>
  <text x="1015" y="338" font-family="Arial, sans-serif" font-size="17" fill="#334155">Selection can be arbitrary</text>
  <text x="1015" y="370" font-family="Arial, sans-serif" font-size="17" fill="#334155">within the fixed finite family.</text>
  <text x="1015" y="420" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#065f46">Selected certificate stays valid.</text>

  <rect x="80" y="510" width="1240" height="145" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="110" y="552" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Two-level union bound</text>
  <text x="110" y="592" font-family="Arial, sans-serif" font-size="19" fill="#1e293b">Within candidate k:   Pr(candidate k fails) &lt;= alpha_k</text>
  <text x="110" y="627" font-family="Arial, sans-serif" font-size="19" fill="#1e293b">Across K candidates: sum_k alpha_k &lt;= alpha   implies   simultaneous confidence &gt;= 1 - alpha</text>

  <rect x="80" y="695" width="600" height="120" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="110" y="735" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#3730a3">Balanced 95 percent checkpoint</text>
  <text x="110" y="770" font-family="Arial, sans-serif" font-size="17" fill="#312e81">K=2 candidates, B=2 regimes, m=1</text>
  <text x="110" y="798" font-family="Arial, sans-serif" font-size="17" fill="#312e81">4045 per regime; exact denominator-24 replication 4056</text>

  <rect x="710" y="695" width="610" height="120" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="740" y="735" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9a3412">Scientific boundary</text>
  <text x="740" y="768" font-family="Arial, sans-serif" font-size="16" fill="#7c2d12">Finite predeclared family only. New post-inspection candidates,</text>
  <text x="740" y="794" font-family="Arial, sans-serif" font-size="16" fill="#7c2d12">within-regime drift, model acceptance, consciousness identification,</text>
  <text x="740" y="818" font-family="Arial, sans-serif" font-size="16" fill="#7c2d12">nonphysicality, and bridge completion are not established.</text>
</svg>
