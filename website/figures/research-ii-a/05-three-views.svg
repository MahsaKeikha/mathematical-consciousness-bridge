<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="840" viewBox="0 0 1300 840" role="img" aria-label="Three-view target-channel identification"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4.5" orient="auto" viewBox="0 0 9 9" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 z" fill="#49617b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="650" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142f52">Three-view target-channel identification</text><text x="650" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#53677e">Conditional independence, nondegeneracy and a declared latent-class model are essential</text><rect x="505" y="125" width="290" height="97" rx="14" fill="#233b60" stroke="#23405b" stroke-width="1.4"/><text x="650" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Binary latent target S</text><text x="650" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Interior class prevalence</text><rect x="80" y="318" width="300" height="100" rx="14" fill="#397aa9" stroke="#23405b" stroke-width="1.4"/><text x="230" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Observed view X1</text><text x="230" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Conditional independence</text><text x="230" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Nonzero channel loading</text><path d="M580 222 C510 258 360 278 230 316" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="500" y="318" width="300" height="100" rx="14" fill="#218982" stroke="#23405b" stroke-width="1.4"/><text x="650" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Observed view X2</text><text x="650" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Conditional independence</text><text x="650" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Nonzero channel loading</text><path d="M650 222 V315" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="920" y="318" width="300" height="100" rx="14" fill="#539875" stroke="#23405b" stroke-width="1.4"/><text x="1070" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Observed view X3</text><text x="1070" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Conditional independence</text><text x="1070" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Nonzero channel loading</text><path d="M720 222 C790 258 940 278 1070 316" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="280" y="530" width="740" height="110" rx="14" fill="#7658a3" stroke="#23405b" stroke-width="1.4"/><text x="650" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Observed moments</text><text x="650" y="587" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Pair covariances + centered third moment</text><text x="650" y="607" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Determine a model-relative inversion</text><path d="M230 419 V472 Q230 505 420 527" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M650 419 V527" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1070 419 V472 Q1070 505 880 527" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="280" y="690" width="740" height="93" rx="14" fill="#b54c68" stroke="#23405b" stroke-width="1.4"/><text x="650" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Identifiable up to label swapping</text><text x="650" y="747" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Two observed views generally do not identify channel reliabilities</text><path d="M 650 642 L 650 685" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/></svg>