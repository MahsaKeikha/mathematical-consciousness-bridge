<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="575" viewBox="0 0 1300 575" role="img" aria-label="Non-circular target provenance and measurement"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4.5" orient="auto" viewBox="0 0 9 9" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 z" fill="#49617b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="650" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142f52">Non-circular target provenance and measurement</text><text x="650" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#53677e">A zero residual can be guaranteed by target construction alone</text><rect x="45" y="150" width="375" height="105" rx="14" fill="#397aa9" stroke="#23405b" stroke-width="1.4"/><text x="232.5" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Tested physical descriptor</text><text x="232.5" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">T = f(Ω)</text><rect x="455" y="150" width="375" height="105" rx="14" fill="#7658a3" stroke="#23405b" stroke-width="1.4"/><text x="642.5" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Circularly derived target</text><text x="642.5" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Eₕ = h(T)</text><rect x="865" y="150" width="375" height="105" rx="14" fill="#233b60" stroke="#23405b" stroke-width="1.4"/><text x="1052.5" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Tautological residual</text><text x="1052.5" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">I(Eₕ; Ω | T) = 0</text><path d="M 420 203 L 452 203" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M 830 203 L 862 203" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="45" y="375" width="375" height="116" rx="14" fill="#b54c68" stroke="#23405b" stroke-width="1.4"/><text x="232.5" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Independent target E*</text><text x="232.5" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Provenance outside tested T</text><rect x="455" y="375" width="375" height="116" rx="14" fill="#ce8f25" stroke="#23405b" stroke-width="1.4"/><text x="642.5" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Observed channel Y</text><text x="642.5" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Y independent of Ω given (E*, T)</text><rect x="865" y="375" width="375" height="116" rx="14" fill="#218982" stroke="#23405b" stroke-width="1.4"/><text x="1052.5" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Conditional contraction</text><text x="1052.5" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">I(Y; Ω | T) ≤ I(E*; Ω | T)</text><path d="M 420 432 L 452 432" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M 830 432 L 862 432" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="645" y="328" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#354f6c">Provenance and observation are separate obligations</text></svg>