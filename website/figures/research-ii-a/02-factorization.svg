<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="735" viewBox="0 0 1300 735" role="img" aria-label="Factorization and conditional sufficiency"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#49617b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="650" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142f52">Factorization and conditional sufficiency</text><text x="650" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#53677e">T and E are compared against a common underlying state</text><rect x="70" y="142" width="335" height="115" rx="14" fill="#233b60" stroke="#23405b" stroke-width="1.4"/><text x="237.5" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Underlying state</text><text x="237.5" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Ω: declared state or history</text><rect x="475" y="142" width="335" height="115" rx="14" fill="#397aa9" stroke="#23405b" stroke-width="1.4"/><text x="642.5" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Descriptor T</text><text x="642.5" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Declared physical summary</text><rect x="880" y="142" width="335" height="115" rx="14" fill="#b54c68" stroke="#23405b" stroke-width="1.4"/><text x="1047.5" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Target E</text><text x="1047.5" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Independently specified outcome</text><path d="M 405 200 L 470 200" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M 245 258 V300 Q245 320 410 345" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M 1050 258 V300 Q1050 320 875 345" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="385" y="350" width="515" height="112" rx="14" fill="#254b78" stroke="#23405b" stroke-width="1.4"/><text x="642.5" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Exact factorization criterion</text><text x="642.5" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">E = B(T) iff E is constant on T-fibers</text><rect x="85" y="565" width="510" height="102" rx="14" fill="#218982" stroke="#23405b" stroke-width="1.4"/><text x="340" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Conditional-information test</text><text x="340" y="622" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">I(E; Ω | T) = 0 under the finite model</text><rect x="705" y="565" width="510" height="102" rx="14" fill="#ce8f25" stroke="#23405b" stroke-width="1.4"/><text x="960" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Positive certified residual</text><text x="960" y="622" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Rejects sufficiency of T, not all physical accounts</text><path d="M535 464 V518 Q535 536 350 565" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M755 464 V518 Q755 536 955 565" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/></svg>