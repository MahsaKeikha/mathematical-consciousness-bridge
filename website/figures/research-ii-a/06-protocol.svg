<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640" role="img" aria-label="End-to-end physical-sufficiency protocol"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#49617b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="650" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#142f52">End-to-end physical-sufficiency protocol</text><text x="650" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#53677e">Declared model, valid target, finite-data uncertainty, and restrained interpretation</text><rect x="32" y="170" width="165" height="127" rx="14" fill="#254b78" stroke="#23405b" stroke-width="1.4"/><text x="114.5" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">1. Declare T</text><text x="114.5" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Descriptor and refinements</text><path d="M 197 234 L 209 234" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="213" y="170" width="165" height="127" rx="14" fill="#397aa9" stroke="#23405b" stroke-width="1.4"/><text x="295.5" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">2. Declare E</text><text x="295.5" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Independent target</text><path d="M 378 234 L 390 234" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="394" y="170" width="165" height="127" rx="14" fill="#218982" stroke="#23405b" stroke-width="1.4"/><text x="476.5" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">3. Model channel</text><text x="476.5" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Noise or multiple views</text><path d="M 559 234 L 571 234" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="575" y="170" width="165" height="127" rx="14" fill="#539875" stroke="#23405b" stroke-width="1.4"/><text x="657.5" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">4. Test sufficiency</text><text x="657.5" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Residual and fiber checks</text><path d="M 740 234 L 752 234" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="756" y="170" width="165" height="127" rx="14" fill="#7658a3" stroke="#23405b" stroke-width="1.4"/><text x="838.5" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">5. Quantify error</text><text x="838.5" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Finite-data certificates</text><path d="M 921 234 L 933 234" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="937" y="170" width="165" height="127" rx="14" fill="#b54c68" stroke="#23405b" stroke-width="1.4"/><text x="1019.5" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">6. Check adequacy</text><text x="1019.5" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Model restrictions</text><path d="M 1102 234 L 1114 234" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1118" y="170" width="165" height="127" rx="14" fill="#ce8f25" stroke="#23405b" stroke-width="1.4"/><text x="1200.5" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">7. Report limits</text><text x="1200.5" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Bounded interpretation</text><rect x="85" y="450" width="330" height="120" rx="14" fill="#233b60" stroke="#23405b" stroke-width="1.4"/><text x="250" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Refusal conditions</text><text x="250" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Circular target or unidentified channel</text><text x="250" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Degenerate or inadmissible data</text><rect x="485" y="450" width="330" height="120" rx="14" fill="#b54c68" stroke="#23405b" stroke-width="1.4"/><text x="650" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Rejection language</text><text x="650" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">Only the declared model or descriptor</text><text x="650" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">is rejected by a valid certificate</text><rect x="885" y="450" width="330" height="120" rx="14" fill="#539875" stroke="#23405b" stroke-width="1.4"/><text x="1050" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">Explicit nonclaims</text><text x="1050" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">No proof of nonphysicality</text><text x="1050" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">No direct measurement of qualia</text><path d="M285 300 V370 Q285 410 250 450" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M755 300 V375 Q755 410 650 450" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M1150 300 V375 Q1150 410 1050 450" stroke="#49617b" stroke-width="3" fill="none" marker-end="url(#arr)"/></svg>