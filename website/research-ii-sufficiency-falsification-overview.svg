<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Research II sufficiency test in four steps</title>
  <desc id="desc">A compact four step Research II diagram. Declare a physical or computational descriptor, define the target independently, match cases that are equivalent under the descriptor, then test whether the independent target distinguishes those cases. No separation means the descriptor survives this test without being validated. Separation means the declared descriptor is insufficient for that target.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6482b8"/>
    </marker>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .display { font-family: Georgia, "Times New Roman", serif; }
      .kicker { font-size: 14px; font-weight: 800; letter-spacing: 2.2px; fill: #365aa8; }
      .title { font-size: 31px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 16px; fill: #586477; }
      .num { font-size: 15px; font-weight: 800; fill: #365aa8; }
      .step { font-size: 13px; font-weight: 800; letter-spacing: 1.1px; fill: #365aa8; }
      .cardTitle { font-size: 20px; font-weight: 760; fill: #172033; }
      .formula { font-size: 22px; font-weight: 720; fill: #233a75; }
      .body { font-size: 15px; fill: #586477; }
      .outcomeKicker { font-size: 12px; font-weight: 800; letter-spacing: 0.9px; }
      .outcomeTitle { font-size: 18px; font-weight: 760; fill: #172033; }
      .outcomeBody { font-size: 14px; fill: #586477; }
      .boundary { font-size: 13px; fill: #586477; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="20" fill="#f8faff"/>

  <text x="48" y="44" class="ui kicker">RESEARCH II</text>
  <text x="48" y="82" class="display title">Sufficiency test in four steps</text>
  <text x="48" y="110" class="ui subtitle">The target must be defined independently of the descriptor being tested.</text>

  <g class="ui">
    <rect x="48" y="150" width="242" height="215" rx="18" fill="#ffffff" stroke="#cfd9e8" stroke-width="2"/>
    <circle cx="82" cy="184" r="18" fill="#e9f0ff"/>
    <text x="82" y="189" text-anchor="middle" class="num">1</text>
    <text x="108" y="189" class="step">DECLARE</text>
    <text x="70" y="232" class="cardTitle">Descriptor D</text>
    <text x="70" y="270" class="body">
      <tspan x="70" dy="0">State the exact physical</tspan>
      <tspan x="70" dy="22">or computational content</tspan>
      <tspan x="70" dy="22">claimed to be sufficient.</tspan>
    </text>

    <rect x="344" y="150" width="242" height="215" rx="18" fill="#ffffff" stroke="#cfd9e8" stroke-width="2"/>
    <circle cx="378" cy="184" r="18" fill="#e9f0ff"/>
    <text x="378" y="189" text-anchor="middle" class="num">2</text>
    <text x="404" y="189" class="step">MEASURE</text>
    <text x="366" y="232" class="cardTitle">Independent target Y</text>
    <text x="366" y="270" class="body">
      <tspan x="366" dy="0">Define the target through</tspan>
      <tspan x="366" dy="22">an independent route.</tspan>
      <tspan x="366" dy="22">Do not derive it from D.</tspan>
    </text>

    <rect x="640" y="150" width="242" height="215" rx="18" fill="#ffffff" stroke="#cfd9e8" stroke-width="2"/>
    <circle cx="674" cy="184" r="18" fill="#e9f0ff"/>
    <text x="674" y="189" text-anchor="middle" class="num">3</text>
    <text x="700" y="189" class="step">MATCH</text>
    <text x="662" y="232" class="cardTitle">Equivalent cases</text>
    <text x="662" y="274" class="formula">D(x₁) = D(x₂)</text>
    <text x="662" y="309" class="body">
      <tspan x="662" dy="0">Choose cases that D</tspan>
      <tspan x="662" dy="22">treats as equivalent.</tspan>
    </text>

    <rect x="936" y="150" width="216" height="215" rx="18" fill="#ffffff" stroke="#cfd9e8" stroke-width="2"/>
    <circle cx="970" cy="184" r="18" fill="#e9f0ff"/>
    <text x="970" y="189" text-anchor="middle" class="num">4</text>
    <text x="996" y="189" class="step">TEST</text>
    <text x="958" y="232" class="cardTitle">Test target Y</text>
    <text x="958" y="274" class="formula">Y(x₁) ?= Y(x₂)</text>
    <text x="958" y="309" class="body">
      <tspan x="958" dy="0">Does target Y still</tspan>
      <tspan x="958" dy="22">distinguish the cases?</tspan>
    </text>
  </g>

  <line x1="290" y1="258" x2="344" y2="258" stroke="#6482b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="586" y1="258" x2="640" y2="258" stroke="#6482b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="882" y1="258" x2="936" y2="258" stroke="#6482b8" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M1044 365 L1044 405 L753 405 L753 442" fill="none" stroke="#6482b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1044 405 L1044 442" fill="none" stroke="#6482b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g class="ui">
    <rect x="608" y="442" width="290" height="105" rx="16" fill="#eef5ff" stroke="#b9d0ee" stroke-width="2"/>
    <text x="632" y="470" class="outcomeKicker" fill="#315e9d">NO TARGET SEPARATION</text>
    <text x="632" y="498" class="outcomeTitle">Survives this test</text>
    <text x="632" y="525" class="outcomeBody">Compatible, not validated.</text>

    <rect x="916" y="442" width="236" height="105" rx="16" fill="#fff4ed" stroke="#ebc3ae" stroke-width="2"/>
    <text x="940" y="470" class="outcomeKicker" fill="#b5532f">TARGET DIFFERS</text>
    <text x="940" y="498" class="outcomeTitle">Sufficiency fails</text>
    <text x="940" y="525" class="outcomeBody">Descriptor is insufficient.</text>
  </g>

  <line x1="48" y1="580" x2="1152" y2="580" stroke="#d5deeb" stroke-width="1.5"/>
  <text x="48" y="605" class="ui boundary">Boundary: rejection is relative to the declared descriptor. Richer physical descriptions may remain possible.</text>
</svg>