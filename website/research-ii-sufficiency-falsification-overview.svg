<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Research II sufficiency test</title>
  <desc id="desc">A compact two-column Research II flow. First declare the physical or computational descriptor. Second define the target independently. Third match cases that are equivalent under the descriptor. Fourth test whether the independent target still distinguishes them. No target separation leaves the descriptor compatible with this test but not validated. Target separation rejects sufficiency for that declared descriptor.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" refX="7.2" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0.8,0.8 L7.2,4 L0.8,7.2 Z" fill="#6b87b8"/>
    </marker>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .kicker { font-size: 13px; font-weight: 800; letter-spacing: 1.8px; fill: #365aa8; }
      .num { font-size: 15px; font-weight: 800; fill: #365aa8; }
      .step { font-size: 13px; font-weight: 800; letter-spacing: 1.2px; fill: #365aa8; }
      .cardTitle { font-size: 22px; font-weight: 750; fill: #172033; }
      .formula { font-size: 22px; font-weight: 720; fill: #233a75; }
      .body { font-size: 16px; fill: #586477; }
      .outcomeLabel { font-size: 12px; font-weight: 800; letter-spacing: 1px; }
      .outcomeTitle { font-size: 18px; font-weight: 760; fill: #172033; }
      .outcomeBody { font-size: 14px; fill: #586477; }
      .boundaryLabel { font-size: 11px; font-weight: 800; letter-spacing: 1.4px; fill: #365aa8; }
      .boundary { font-size: 12px; fill: #586477; }
      .connector { stroke:#6b87b8; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="620" rx="20" fill="#f8faff"/>
  <text x="40" y="30" class="ui kicker">RESEARCH II TESTING LOGIC</text>

  <g class="ui">
    <rect x="40" y="50" width="390" height="150" rx="18" fill="#ffffff" stroke="#cfd9e8" stroke-width="2"/>
    <circle cx="76" cy="86" r="18" fill="#e9f0ff"/>
    <text x="76" y="91" text-anchor="middle" class="num">1</text>
    <text x="104" y="91" class="step">DECLARE</text>
    <text x="68" y="128" class="cardTitle">Descriptor D</text>
    <text x="68" y="158" class="body">Specify exactly what information</text>
    <text x="68" y="181" class="body">is claimed to be sufficient.</text>

    <rect x="530" y="50" width="390" height="150" rx="18" fill="#ffffff" stroke="#cfd9e8" stroke-width="2"/>
    <circle cx="566" cy="86" r="18" fill="#e9f0ff"/>
    <text x="566" y="91" text-anchor="middle" class="num">2</text>
    <text x="594" y="91" class="step">DEFINE TARGET</text>
    <text x="558" y="128" class="cardTitle">Independent target Y</text>
    <text x="558" y="158" class="body">Measure or define Y independently.</text>
    <text x="558" y="181" class="body">Do not derive Y from D.</text>

    <rect x="40" y="245" width="390" height="150" rx="18" fill="#ffffff" stroke="#cfd9e8" stroke-width="2"/>
    <circle cx="76" cy="281" r="18" fill="#e9f0ff"/>
    <text x="76" y="286" text-anchor="middle" class="num">3</text>
    <text x="104" y="286" class="step">MATCH CASES</text>
    <text x="68" y="326" class="formula">D(x₁) = D(x₂)</text>
    <text x="68" y="358" class="body">Choose cases the descriptor treats</text>
    <text x="68" y="381" class="body">as equivalent.</text>

    <rect x="530" y="245" width="390" height="150" rx="18" fill="#ffffff" stroke="#cfd9e8" stroke-width="2"/>
    <circle cx="566" cy="281" r="18" fill="#e9f0ff"/>
    <text x="566" y="286" text-anchor="middle" class="num">4</text>
    <text x="594" y="286" class="step">TEST</text>
    <text x="558" y="326" class="formula">Y(x₁) ?= Y(x₂)</text>
    <text x="558" y="358" class="body">Does the independent target still</text>
    <text x="558" y="381" class="body">distinguish the matched cases?</text>
  </g>

  <line x1="430" y1="125" x2="530" y2="125" class="connector"/>
  <path d="M725 200 L725 222 L235 222 L235 245" class="connector"/>
  <line x1="430" y1="320" x2="530" y2="320" class="connector"/>

  <path d="M725 395 L725 420 L260 420 L260 450" class="connector"/>
  <path d="M725 420 L700 420 L700 450" class="connector"/>

  <g class="ui">
    <rect x="90" y="450" width="340" height="92" rx="16" fill="#eef5ff" stroke="#b9d0ee" stroke-width="2"/>
    <text x="116" y="477" class="outcomeLabel" fill="#315e9d">NO TARGET SEPARATION</text>
    <text x="116" y="505" class="outcomeTitle">Compatible with this test</text>
    <text x="116" y="528" class="outcomeBody">Not validated as true.</text>

    <rect x="530" y="450" width="340" height="92" rx="16" fill="#fff4ed" stroke="#ebc3ae" stroke-width="2"/>
    <text x="556" y="477" class="outcomeLabel" fill="#b5532f">TARGET SEPARATION</text>
    <text x="556" y="505" class="outcomeTitle">Sufficiency rejected</text>
    <text x="556" y="528" class="outcomeBody">For this declared descriptor.</text>
  </g>

  <line x1="40" y1="575" x2="920" y2="575" stroke="#d5deeb" stroke-width="1.5"/>
  <text x="40" y="597" class="ui boundaryLabel">SCIENTIFIC BOUNDARY</text>
  <text x="194" y="597" class="ui boundary">Rejection is relative to the declared descriptor; richer physical descriptions may remain possible.</text>
</svg>