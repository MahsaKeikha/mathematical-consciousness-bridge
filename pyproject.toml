[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathematical-consciousness-bridge"
version = "0.54.0"
description = "Formal tools for physical-to-experiential bridge theory, intervention-resolved causal structure, temporal continuation, finite-sample certification, composition, coarse-graining, scale-sufficiency certification, fundamental physical-sufficiency and residual tests, finite-sample residual certification, descriptor-refinement residual-persistence audits, simultaneous refinement-chain certification, adaptive descriptor-selection certification, anytime-valid refinement certification, directed-influence scale certification, partition-irreducibility scale certification, partition-lattice node aggregation, intervention node-aggregation compatibility, response-geometry node aggregation, full P11 scale compatibility, intervention-quotient compatibility, complete operational-scale certification, quantum operational sufficiency, finite-data quantum model-set non-factorization, continuous quantum-region regularity obstruction, trace-ball quantum envelope certification, budget-constrained witness-graph selection, anytime-valid sequential witness-graph refinement, gap-dependent sequential stopping complexity, dyadic certification scheduling, bounded-starvation asynchronous sampling, heterogeneous finite-window service-rate stopping, capacity-optimal service allocation, residual-demand reoptimization, metric switching-cost residual scheduling, robust experiment design, recoverability, and falsifiable experiment design."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"scripts/generate_quantitative_atlas.py" = ["E402", "E501", "I001"]
"scripts/generate_quantum_foundations_atlas.py" = ["E501", "I001"]

[tool.pytest.ini_options]
pythonpath = ["src"]
