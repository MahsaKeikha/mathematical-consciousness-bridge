description = "Formal tools for physical-to-experiential bridge theory, intervention-resolved causal structure, temporal continuation, finite-sample certification, composition, coarse-graining, scale-sufficiency certification, fundamental physical-sufficiency and residual tests, finite-sample residual certification, descriptor-refinement residual-persistence audits, simultaneous refinement-chain certification, adaptive descriptor-selection certification, anytime-valid refinement certification, target-provenance non-circularity, descriptor-derived target vacuity, target-measurement channel robustness, noisy-witness transfer, three-view target-channel identifiability, target-channel stability recovery, finite-sample target-channel recovery certification, covariance nondegeneracy gating, target-model adequacy, four-view overidentification, latent-channel goodness-of-fit diagnostics, finite-sample target-model adequacy rejection, denominator-free polynomial adequacy certification, finite-sample full-law model-set separation, certified model-distance lower-bound rejection, confidence-region inversion, certified continuous P75 model separation, exact-rational branch-and-bound model-distance certification, certified rational P77 sampling-radius envelopes, exact-rational logarithm and dyadic square-root certification, simplex-coupled interval relaxations, exact-rational probability-simplex distance certification, directed-influence scale certification, partition-irreducibility scale certification, partition-lattice node aggregation, intervention node-aggregation compatibility, response-geometry node aggregation, full P11 scale compatibility, intervention-quotient compatibility, complete operational-scale certification, quantum operational sufficiency, finite-data quantum model-set non-factorization, continuous quantum-region regularity obstruction, trace-ball quantum envelope certification, budget-constrained witness-graph selection, anytime-valid sequential witness-graph refinement, gap-dependent sequential stopping complexity, dyadic certification scheduling, bounded-starvation asynchronous sampling, heterogeneous finite-window service-rate stopping, capacity-optimal service allocation, residual-demand reoptimization, metric switching-cost residual scheduling, pruning-aware metric switching-cost monotonicity, moving-start metric reoptimization stability, switching-metric perturbation stability, finite-data switching-metric uncertainty, optimal transition-calibration allocation, integer transition-calibration allocation, exact integer transition-calibration allocation, heterogeneous-cost transition-calibration allocation, exact heterogeneous-cost integer calibration, fast certified heterogeneous integer approximation, lower-bounded heterogeneous calibration, residual-exact calibration augmentation, global integer optimality certification, Lagrangian optimality gap certification, certified dual multiplier optimization, primal-dual gap decomposition, robust experiment design, recoverability, and falsifiable experiment design."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"scripts/generate_quantitative_atlas.py" = ["E402", "E501", "I001"]
"scripts/generate_quantum_foundations_atlas.py" = ["E501", "I001"]

[tool.pytest.ini_options]
