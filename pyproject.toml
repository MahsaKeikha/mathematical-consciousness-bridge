[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathematical-consciousness-bridge"
version = "0.14.0"
description = "Formal tools for physical-to-experiential bridge theory, intervention-resolved causal structure, temporal continuation, finite-data certification, and falsifiable experiment design."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
