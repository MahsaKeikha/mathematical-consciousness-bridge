[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathematical-consciousness-bridge"
version = "0.11.0"
description = "Formal tools for physical-to-experiential bridge theory, complete-signature recovery, robust experiment design, and intervention-resolved causal geometry."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
