name: integrate-p55-publication

on:
  push:
    branches:
      - p55-publication-integration

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply P55 publication integration
        run: python scripts/integrate_p55_publication.py

      - name: Remove one-time integration scaffolding
        run: |
          rm scripts/integrate_p55_publication.py
          rm .github/workflows/integrate-p55-publication.yml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run lint
        run: ruff check .

      - name: Commit publication integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate P55 into the main research paper"
          git push origin HEAD:p55-publication-integration
