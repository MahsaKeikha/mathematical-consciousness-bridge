name: integrate-p22-once

on:
  push:
    branches:
      - p22-simultaneous-refinement-chain-certification

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: p22-simultaneous-refinement-chain-certification
          fetch-depth: 0

      - name: Apply P22 release integration
        run: python .github/integrate_p22_release.py

      - name: Remove one-time integration scaffolding before validation
        run: |
          rm .github/integrate_p22_release.py
          rm .github/workflows/integrate-p22-once.yml

      - name: Validate on Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install and test on Python 3.10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test on Python 3.11
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test on Python 3.12
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Commit verified P22 release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No release changes to commit"; exit 1; }
          git commit -m "Integrate P22 simultaneous refinement-chain certification"
          git push origin HEAD:p22-simultaneous-refinement-chain-certification
