name: integrate-p56-publication

on:
  push:
    branches: ["p56-publication-integration-run"]
    paths:
      - "scripts/integrate_p56_publication.py"
      - ".github/workflows/integrate-p56-publication.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p56-publication-integration-run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/integrate_p56_publication.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_moving_start_metric_reoptimization.py tests/test_moving_start_metric_reoptimization_publication.py tests/test_release_metadata_consistency.py tests/test_main_page_visual_paper.py
      - run: ruff check scripts/integrate_p56_publication.py tests/test_moving_start_metric_reoptimization_publication.py
      - name: Commit integrated publication files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/theorem_roadmap.md docs/research_navigation.md docs/equation_and_citation_map.md pyproject.toml CITATION.cff CHANGELOG.md tests/test_main_page_visual_paper.py tests/test_pruning_aware_switching_publication.py tests/test_release_metadata_consistency.py tests/test_moving_start_metric_reoptimization_publication.py
          if ! git diff --cached --quiet; then
            git commit -m "Integrate P56 into the public research record"
            git push origin HEAD:p56-publication-integration-run
          fi
