name: p83-publication-contract-sync

on:
  push:
    branches:
      - research/p83-exact-projection-parity
    paths:
      - scripts/p83_publication_contract_sync.py
      - .github/workflows/p83-publication-contract-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout P83 branch
        uses: actions/checkout@v4
        with:
          ref: research/p83-exact-projection-parity
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Synchronize publication contract
        run: python scripts/p83_publication_contract_sync.py

      - name: Validate synchronized surfaces
        run: |
          python scripts/normalize_typography.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          required = {
              'README.md': 'Read the complete P1 to P83 detailed proposition record',
              'src/consciousness_bridge/projection_parity_model_separation.py': 'identify a latent state with consciousness',
              'website/research-map.html': 'p82_equation_provenance.md',
              'CHANGELOG.md': '# 0.82.0 - 2026-09-12',
          }
          for path, token in required.items():
              text = Path(path).read_text(encoding='utf-8')
              if token not in text:
                  raise SystemExit(f'missing publication token: {path}: {token}')
          PY
          git diff --name-only

      - name: Remove one-shot machinery
        run: |
          rm scripts/p83_publication_contract_sync.py
          rm .github/workflows/p83-publication-contract-sync.yml

      - name: Commit synchronized publication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Synchronize final P83 publication contract"
          git push origin HEAD:research/p83-exact-projection-parity
