name: p99-promoter-roadmap-eof-fix

on:
  push:
    branches: ["p99-cross-fitted-evalue-aggregation"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-clean:
    if: ${{ !contains(github.event.head_commit.message, '[p99-promoter-eof-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p99-cross-fitted-evalue-aggregation
          fetch-depth: 0
      - name: Canonicalize theorem roadmap output in promoter
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/promote_p99_public_frontier.py')
          text = path.read_text(encoding='utf-8')
          marker = '# Theorem roadmap.\npath = "docs/theorem_roadmap.md"'
          start = text.index(marker)
          old = 'write(path, text)'
          pos = text.index(old, start)
          text = text[:pos] + 'write(path, text.rstrip() + "\\n")' + text[pos + len(old):]
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/promote_p99_public_frontier.py
      - name: Remove one-time helper and commit
        run: |
          rm .github/workflows/p99-promoter-roadmap-eof-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/promote_p99_public_frontier.py .github/workflows/p99-promoter-roadmap-eof-fix.yml
          git commit -m "Canonicalize P99 promoter roadmap EOF [p99-promoter-eof-fixed]"
          git push origin HEAD:p99-cross-fitted-evalue-aggregation
