name: promote-p87-public-frontier

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/promote-p87-public-frontier.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Repair and run P87 publication promotion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/promote_p87_public_frontier.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          lines = [
              line
              for line in lines
              if not (
                  "tests/test_weighted_quad_projection_parity_functional_separation.py" in line
                  and "P87_TEST" in line
              )
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python -m py_compile scripts/promote_p87_public_frontier.py
          python scripts/promote_p87_public_frontier.py
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-reproducibility.txt
      - name: Validate promoted P87 frontier
        run: |
          python scripts/verify_frontier_publication.py
          python scripts/sync_figure_publication.py --check
          python scripts/generate_all_figures.py --validate-only
          python scripts/verify_repository.py
          python -m pytest -q \
            tests/test_bounded_primitive_quad_projection_parity_functional_separation.py \
            tests/test_frontier_publication_consistency.py \
            tests/test_frontier_reader_narrative.py \
            tests/test_readme_research_orientation.py \
            tests/test_reader_documentation_consistency.py \
            tests/test_figure_publication_sync.py
          python -m ruff check \
            scripts/promote_p87_public_frontier.py \
            scripts/sync_figure_publication.py \
            scripts/prepare_website.py \
            scripts/verify_repository.py \
            tests/test_bounded_primitive_quad_projection_parity_functional_separation.py
          git diff --check
      - name: Commit guarded P87 frontier promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize public research frontier to P87"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
