name: temporary-p90-final-reader-persist

on:
  workflow_dispatch:
  push:
    branches:
      - p90-exact-nonlinear-rank-one-separation

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p90-exact-nonlinear-rank-one-separation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install exact reference environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-reproducibility.txt
      - name: Apply final P90 reader canonicalization
        run: python scripts/repair_p90_reader_residuals.py
      - name: Validate final P90 reader contract
        run: |
          python -m pytest -q tests/test_p90_reader_surface_coherence.py
          python -m ruff check scripts/repair_p90_reader_residuals.py scripts/promote_p90_public_frontier.py tests/test_p90_reader_surface_coherence.py
          git diff --check
      - name: Persist canonical reader state and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/plain-language.html website/start-here.html scripts/promote_p90_public_frontier.py
          git rm scripts/repair_p90_reader_residuals.py
          git commit -m "Finalize P90 reader publication state"
          git push origin HEAD:p90-exact-nonlinear-rank-one-separation
