name: Run P84 presentation repair

on:
  push:
    paths:
      - scripts/polish_p84_presentation_once.py
      - .github/workflows/run-p84-presentation-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply P84 presentation repair
        run: |
          python scripts/polish_p84_presentation_once.py
          python scripts/enrich_figure_documentation.py
      - name: Commit repaired publication surfaces
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add website/styles.css website/index.html website/visual-atlas.html website/implementation.html docs/proposition_84_exact_projection_parity_contrast.md docs/theorem_roadmap.md docs/research_navigation.md docs/figures/p84_exact_joint_projection_parity_contrast.svg docs/figure_catalog.md scripts/prepare_website.py
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
          else
            git commit -m "Polish P84 website and documentation presentation"
            git push origin HEAD:main
          fi

# Touch after registration so the path-filtered workflow runs on the default branch.
