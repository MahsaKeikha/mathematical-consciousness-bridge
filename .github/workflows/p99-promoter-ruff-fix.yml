name: p99-promoter-ruff-fix

on:
  push:
    branches: ["p99-cross-fitted-evalue-aggregation"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-clean:
    if: ${{ !contains(github.event.head_commit.message, '[p99-ruff-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p99-cross-fitted-evalue-aggregation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install ruff==0.16.7
      - name: Fix temporary promoter escapes
        run: |
          python -m ruff check scripts/promote_p99_public_frontier.py --fix
          python -m ruff check scripts/promote_p99_public_frontier.py
          python -m py_compile scripts/promote_p99_public_frontier.py
      - name: Remove one-time repair workflow and commit
        run: |
          rm .github/workflows/p99-promoter-ruff-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/promote_p99_public_frontier.py .github/workflows/p99-promoter-ruff-fix.yml
          git commit -m "Fix P99 promoter LaTeX escapes [p99-ruff-fixed]"
          git push origin HEAD:p99-cross-fitted-evalue-aggregation
