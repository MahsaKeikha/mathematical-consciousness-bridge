name: P100 canonicalize figure catalog

on:
  push:
    branches:
      - p100-anytime-sequential-eprocess
    paths:
      - .github/workflows/p100-canonicalize-figure-catalog.yml

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install exact figure environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-figures.txt
      - name: Generate canonical publication record
        run: python scripts/generate_all_figures.py
      - name: Require only the expected catalog drift
        run: |
          git diff --check
          changed="$(git status --porcelain | awk '{print $2}')"
          if [ "$changed" != "docs/figure_catalog.md" ]; then
            echo "Unexpected generated drift:"
            git status --short
            exit 1
          fi
          python scripts/sync_figure_publication.py --check
          python scripts/verify_repository.py
      - name: Commit canonical catalog and remove one-shot workflow
        run: |
          rm .github/workflows/p100-canonicalize-figure-catalog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/figure_catalog.md .github/workflows/p100-canonicalize-figure-catalog.yml
          git commit -m "Canonicalize P100 figure catalog"
          git push origin HEAD:p100-anytime-sequential-eprocess
