name: Patch P77-P80 research map

on:
  push:
    branches:
      - p80-simplex-coupled-box-certificate

permissions:
  contents: write

jobs:
  patch-research-map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p80-simplex-coupled-box-certificate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch research map
        run: python scripts/patch_p77_p80_research_map.py
      - name: Commit permanent research-map update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sequence P77-P80 clearly on research map"
          git push origin HEAD:p80-simplex-coupled-box-certificate
