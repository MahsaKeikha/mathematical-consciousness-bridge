name: temporary-promote-p89-balanced-reader

on:
  push:
    branches: ["p89-complete-linear-parity-duality"]
    paths:
      - ".github/workflows/temporary-promote-p89-balanced-reader.yml"
      - "scripts/patch_p89_navigation_sync.py"
      - "scripts/patch_p89_promoter_contract.py"
      - "scripts/migrate_p89_publication_contract.py"
      - "scripts/promote_p89_public_frontier.py"
      - "scripts/synchronize_p89_reader_frontier_phrases.py"
      - "scripts/repair_p89_navigation_and_documentation_punctuation.py"
      - "tests/test_documentation_punctuation.py"
      - "src/consciousness_bridge/complete_linear_parity_duality.py"
      - "tests/test_complete_linear_parity_duality.py"
      - "docs/proposition_89_complete_linear_parity_duality.md"
      - "docs/p89_equation_provenance.md"
      - "docs/figures/p89_complete_linear_parity_duality.svg"

permissions:
  contents: write

concurrency:
  group: temporary-promote-p89-balanced-reader
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p89-complete-linear-parity-duality
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate P89 exact duality core
        run: |
          python -m pytest -q tests/test_complete_linear_parity_duality.py
          python -m py_compile \
            src/consciousness_bridge/complete_linear_parity_duality.py \
            scripts/migrate_p89_publication_contract.py \
            scripts/promote_p89_public_frontier.py \
            scripts/synchronize_p89_reader_frontier_phrases.py \
            scripts/repair_p89_navigation_and_documentation_punctuation.py
      - name: Migrate permanent publication machinery to P89
        run: |
          python scripts/patch_p89_navigation_sync.py
          python scripts/patch_p89_promoter_contract.py
          python scripts/migrate_p89_publication_contract.py
          python scripts/repair_p89_navigation_and_documentation_punctuation.py
          python scripts/synchronize_p89_reader_frontier_phrases.py
          python scripts/promote_p89_public_frontier.py
          python scripts/sync_figure_publication.py
          python scripts/synchronize_research_three_website.py
          python scripts/repair_p89_navigation_and_documentation_punctuation.py
      - name: Validate P89 publication and balanced reader contracts
        run: |
          python -m pytest -q \
            tests/test_complete_linear_parity_duality.py \
            tests/test_documentation_punctuation.py \
            tests/test_figure_publication_sync.py \
            tests/test_p89_reader_surface_coherence.py \
            tests/test_research_website_integrity.py \
            tests/test_website_research_orientation.py \
            tests/test_website_link_integrity.py \
            tests/test_website_build.py
          python scripts/sync_figure_publication.py --check
          python scripts/verify_repository.py
          git diff --check
          grep -q 'id="three-stage-progress"' website/plain-language.html
          grep -q 'id="program-stages"' website/start-here.html
          grep -q '<strong>Research I</strong><span>physical-system identification</span>' website/plain-language.html
          grep -q '<strong>Research II</strong><span>89 results · current frontier P89</span>' website/plain-language.html
          grep -q '<strong>Research III</strong><span>measurement science under uncertainty</span>' website/plain-language.html
          grep -q '<strong>Research I</strong><span>physical-system identification</span>' website/start-here.html
          grep -q '<strong>Research II</strong><span>89 results · current frontier P89</span>' website/start-here.html
          grep -q '<strong>Research III</strong><span>measurement science under uncertainty</span>' website/start-here.html
          grep -q 'The 89 Research II propositions by scientific role' website/start-here.html
      - name: Commit P89 publication migration
        run: |
          if git diff --quiet; then
            echo "P89 publication surfaces already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md START_HERE.md CITATION.md docs figures scripts tests website
          git commit -m "Synchronize P89 publication and balanced reader contracts"
          git fetch origin p89-complete-linear-parity-duality
          git rebase origin/p89-complete-linear-parity-duality
          git push origin HEAD:p89-complete-linear-parity-duality
