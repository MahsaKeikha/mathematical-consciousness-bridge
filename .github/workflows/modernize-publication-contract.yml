name: modernize-publication-contract

on:
  push:
    branches: ["website-research-iii-sync"]
    paths:
      - "scripts/modernize_publication_contract.py"
      - "scripts/finalize_publication_contract.py"
      - "scripts/migrate_layered_publication_tests.py"
      - "scripts/sync_figure_publication.py"
      - "scripts/synchronize_research_three_website.py"
      - "docs/figures/p88_exact_radius_three_bounded_primitive_quad_projection_parity.svg"
      - ".github/workflows/modernize-publication-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modernize-publication-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modernize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply layered publication migration
        run: |
          # The earlier modernize/finalize scripts are completed one-shot migrations.
          # The current staging pipeline is intentionally idempotent.
          python scripts/migrate_layered_publication_tests.py
          python scripts/sync_figure_publication.py
          python scripts/synchronize_research_three_website.py

      - name: Normalize generated text endings
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/detailed_proposition_record.md")
          path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY

      - name: Verify maintained scripts compile
        run: |
          python -m py_compile \
            scripts/modernize_publication_contract.py \
            scripts/finalize_publication_contract.py \
            scripts/migrate_layered_publication_tests.py \
            scripts/sync_figure_publication.py \
            scripts/synchronize_research_three_website.py \
            scripts/prepare_website.py

      - name: Verify synchronized Research III source
        run: python scripts/synchronize_research_three_website.py --check

      - name: Verify P88 figure publication mirror
        run: python scripts/sync_figure_publication.py --check

      - name: Run targeted reader-contract tests
        run: |
          python -m pip install -e ".[dev]"
          pytest -q \
            tests/test_readme_research_orientation.py \
            tests/test_main_page_visual_paper.py \
            tests/test_public_reader_layering.py \
            tests/test_public_reader_punctuation.py \
            tests/test_website_research_orientation.py \
            tests/test_scholarly_provenance_surface.py \
            tests/test_reader_experience.py \
            tests/test_document_link_integrity.py \
            tests/test_reader_guide_links.py \
            tests/test_citation_surface.py \
            tests/test_release_metadata_consistency.py \
            tests/test_fundamental_theory_program.py \
            tests/test_theorem_roadmap_caption.py \
            tests/test_website_build.py \
            tests/test_website_research_lineage.py \
            tests/test_figure_publication_sync.py \
            tests/test_p75_research_integration.py \
            tests/test_p76_research_integration.py \
            tests/test_p77_research_integration.py \
            tests/test_p78_research_integration.py \
            tests/test_p79_research_integration.py

      - name: Verify diff hygiene
        run: git diff --check

      - name: Commit modernization
        run: |
          if git diff --quiet; then
            echo "Publication contract already modernized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Modernize layered P88 publication contracts"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
