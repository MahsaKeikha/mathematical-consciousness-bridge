name: Refactor README proposition record

on:
  push:
    paths:
      - '.github/workflows/readme-proposition-record-refactor.yml'

permissions:
  contents: write

jobs:
  refactor-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move detailed proposition chronology out of README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          record_path = Path('docs/detailed_proposition_record.md')
          text = readme_path.read_text(encoding='utf-8')

          heading = '# Detailed proposition record'
          start = text.find(heading)
          if start < 0:
              raise SystemExit('Detailed proposition record heading not found in README.md')

          details_open = text.find('<details>', start)
          summary_close = text.find('</summary>', details_open)
          details_close = text.find('</details>', summary_close)
          if min(details_open, summary_close, details_close) < 0:
              raise SystemExit('Detailed proposition record details block is incomplete')

          chronology = text[summary_close + len('</summary>'):details_close].strip()
          if '**P70**' not in chronology or '**P1-P10**' not in chronology:
              raise SystemExit('Chronology sanity check failed; refusing to rewrite README')

          record = '''# Detailed proposition record

This page preserves the complete proposition-by-proposition research chronology for readers who want the development history, dependency lineage, and exact progression from P1 through P70.

It is intentionally kept outside the main README reading flow. The repository front page is organized for first-time readers around the scientific problem, status discipline, physical and mathematical structure, evidence, and open questions rather than the internal chronological order in which the results were developed.

For the dependency-oriented view, see the [Theorem roadmap](theorem_roadmap.md). For topic-oriented navigation, see [Research navigation](research_navigation.md).

---

## Complete P1-P70 chronology

''' + chronology + '\n'
          record_path.write_text(record, encoding='utf-8')

          replacement = '''# Detailed proposition record

[Read the complete P1-P70 proposition chronology →](docs/detailed_proposition_record.md)'''
          new_text = text[:start] + replacement + text[details_close + len('</details>'):]
          readme_path.write_text(new_text, encoding='utf-8')
          PY

      - name: Commit focused documentation refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/detailed_proposition_record.md
          git diff --cached --check
          git commit -m "docs: move detailed proposition chronology out of README"
          git push
