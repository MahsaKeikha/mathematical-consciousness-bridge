name: One Shot P100 Roadmap Artifact

on:
  push:
    branches:
      - static-p100-reader-metadata-coherence
    paths:
      - .github/workflows/one-shot-p100-roadmap-coherence.yml
      - scripts/one_shot_p100_roadmap_patch.py

jobs:
  build-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out coherence branch
        uses: actions/checkout@v4

      - name: Generate corrected roadmap and reader files
        run: python scripts/one_shot_p100_roadmap_patch.py

      - name: Verify targeted regression test
        run: python -m pytest tests/test_p100_roadmap_coherence.py -q

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Upload corrected files
        uses: actions/upload-artifact@v4
        with:
          name: p100-roadmap-coherence
          path: |
            docs/theorem_roadmap.md
            website/research-map.html
            website/plain-language.html
            tests/test_p100_roadmap_coherence.py
          if-no-files-found: error
