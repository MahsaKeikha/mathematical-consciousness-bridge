name: One Shot P100 Roadmap Artifact

on:
  push:
    branches:
      - static-p100-reader-metadata-coherence
    paths:
      - .github/workflows/one-shot-p100-roadmap-coherence.yml
      - scripts/one_shot_p100_roadmap_patch.py

permissions:
  contents: write

jobs:
  build-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out coherence branch
        uses: actions/checkout@v4
        with:
          ref: static-p100-reader-metadata-coherence

      - name: Generate corrected roadmap and reader files
        run: python scripts/one_shot_p100_roadmap_patch.py

      - name: Normalize generated regression-test imports
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_p100_roadmap_coherence.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from pathlib import Path\nimport re\n',
              'import re\nfrom pathlib import Path\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify targeted coherence contract
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('.')
          roadmap = (root / 'docs' / 'theorem_roadmap.md').read_text(encoding='utf-8')
          block = roadmap.split('## 3. Complete proposition index', 1)[1].split(
              '## 4. Calibration branch remains separate', 1
          )[0]
          rows = re.findall(r'^\| \[P(\d+)\]\(', block, flags=re.MULTILINE)
          assert rows == [str(number) for number in range(1, 101)], rows[-20:]
          assert '\n\n| [P90]' not in block
          assert '\n\n| [P96]' not in block
          assert '## 5. Current frontier and remaining scientific boundary' in roadmap
          assert 'None of P71-P100 identifies a latent variable with consciousness.' in roadmap
          assert 'After P89, the target-side chain' not in roadmap
          assert 'None of P71-P95' not in roadmap
          assert roadmap.count('&\\text{P90:') == 1

          research_map = (root / 'website' / 'research-map.html').read_text(encoding='utf-8')
          assert 'through Proposition 100' in research_map
          assert 'through Proposition 99' not in research_map

          plain = (root / 'website' / 'plain-language.html').read_text(encoding='utf-8')
          assert 'A 100-result sufficiency and falsification architecture' in plain
          assert 'The 100-result proposition program asks' in plain
          assert 'The current theorem frontier is P100.' in plain
          assert 'A 99-result sufficiency and falsification architecture' not in plain
          assert 'The 99-result proposition program asks' not in plain
          assert 'The current theorem frontier is P99.' not in plain
          PY

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Commit verified coherence files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/theorem_roadmap.md website/research-map.html website/plain-language.html tests/test_p100_roadmap_coherence.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Complete P1-P100 roadmap and static reader frontier"
          git push origin HEAD:static-p100-reader-metadata-coherence
