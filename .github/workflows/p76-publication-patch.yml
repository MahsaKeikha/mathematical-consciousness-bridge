name: p76-publication-patch

on:
  push:
    branches:
      - p76-finite-sample-target-model-adequacy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p76-finite-sample-target-model-adequacy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight script guard ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/p76_publication_patch.py')
          text = p.read_text(encoding='utf-8')
          old = '"| 3. Bridge sufficiency and target validity | **P19-P24, P71-P75** |"'
          new = '"| 3. Bridge sufficiency and target validity | **P19-P24, P71-P76** |"'
          if old not in text:
              raise SystemExit('expected preflight script token not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply guarded publication patch
        run: python scripts/p76_publication_patch.py
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run focused publication and P76 tests
        run: |
          pytest \
            tests/test_finite_sample_target_model_adequacy.py \
            tests/test_p76_figure_geometry.py \
            tests/test_readme_research_orientation.py \
            tests/test_main_page_visual_paper.py \
            tests/test_public_reader_navigation_frontier.py \
            tests/test_research_website_integrity.py \
            tests/test_website_research_orientation.py \
            tests/test_citation_surface.py \
            tests/test_release_metadata_consistency.py
          ruff check src/consciousness_bridge/finite_sample_target_model_adequacy.py tests/test_finite_sample_target_model_adequacy.py tests/test_p76_figure_geometry.py
      - name: Commit publication integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md CITATION.md docs website tests src/consciousness_bridge/finite_sample_target_model_adequacy.py scripts/p76_publication_patch.py
          git commit -m "Integrate P76 publication surfaces"
          git push origin HEAD:p76-finite-sample-target-model-adequacy
