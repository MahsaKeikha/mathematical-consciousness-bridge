name: p76-publication-patch

on:
  push:
    branches:
      - p76-finite-sample-target-model-adequacy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p76-finite-sample-target-model-adequacy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight script guard ordering and wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/p76_publication_patch.py')
          text = p.read_text(encoding='utf-8')
          replacements = [
              (
                  '"| 3. Bridge sufficiency and target validity | **P19-P24, P71-P75** |"',
                  '"| 3. Bridge sufficiency and target validity | **P19-P24, P71-P76** |"',
              ),
              (
                  '"**[Read the complete P1 to P76 detailed proposition record](docs/detailed_proposition_record.md).**",\n        "**[Read the complete P1 to P76 detailed proposition record](docs/detailed_proposition_record.md).**",',
                  '"**[Read the complete P1 to P75 detailed proposition record](docs/detailed_proposition_record.md).**",\n        "**[Read the complete P1 to P76 detailed proposition record](docs/detailed_proposition_record.md).**",',
              ),
              (
                  '"P76 propagates one shared sixteen-cell Hoeffding event through those polynomial restrictions."',
                  '"P76 propagates one shared sixteen-cell Hoeffding event through those polynomial restrictions. This is not an acceptance test."',
              ),
              (
                  'If the data do not reject it, P76 deliberately does not call the model validated.',
                  'If the data do not reject it, P76 deliberately does not call the model validated: non-rejection is not model acceptance.',
              ),
              (
                  'P76 asks when finite experimental data are strong enough to demonstrate that one of those requirements has genuinely failed.',
                  'P76 asks when finite data are strong enough to demonstrate that one of those requirements has genuinely failed.',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected preflight script token not found: {old[:100]}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Apply guarded publication patch
        run: python scripts/p76_publication_patch.py
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run focused publication and P76 tests
        run: |
          pytest \
            tests/test_finite_sample_target_model_adequacy.py \
            tests/test_p76_figure_geometry.py \
            tests/test_readme_research_orientation.py \
            tests/test_main_page_visual_paper.py \
            tests/test_public_reader_navigation_frontier.py \
            tests/test_research_website_integrity.py \
            tests/test_website_research_orientation.py \
            tests/test_citation_surface.py \
            tests/test_release_metadata_consistency.py
          ruff check src/consciousness_bridge/finite_sample_target_model_adequacy.py tests/test_finite_sample_target_model_adequacy.py tests/test_p76_figure_geometry.py
      - name: Commit publication integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md CITATION.md docs website tests src/consciousness_bridge/finite_sample_target_model_adequacy.py scripts/p76_publication_patch.py
          git commit -m "Integrate P76 publication surfaces"
          git push origin HEAD:p76-finite-sample-target-model-adequacy
