name: normalize-scholarly-typography

on:
  push:
    paths:
      - ".github/workflows/normalize-scholarly-typography.yml"
      - "scripts/normalize_scholarly_typography.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize scholarly typography
        run: python scripts/normalize_scholarly_typography.py
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run scholarly and typography tests
        run: >-
          python -m pytest
          tests/test_reference_and_prose_style.py
          tests/test_typography_policy.py
          tests/test_scholarly_provenance_surface.py
          tests/test_reader_experience.py
          tests/test_website_build.py
      - name: Verify repository contract
        run: python scripts/verify_repository.py
      - name: Check patch formatting
        run: git diff --check
      - name: Commit normalized scholarly text
        run: |
          if git diff --quiet -- docs/claim_evidence_standard.md website/sources.html website/start-here.html; then
            echo "No scholarly typography changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/claim_evidence_standard.md website/sources.html website/start-here.html
          git commit -m "Normalize scholarly citation typography"
          git push
