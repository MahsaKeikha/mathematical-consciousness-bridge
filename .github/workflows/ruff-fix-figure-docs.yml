name: Ruff-fix figure documentation tooling

on:
  push:
    branches:
      - p80-simplex-coupled-box-certificate

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p80-simplex-coupled-box-certificate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Apply mechanical Ruff fixes
        run: ruff check . --fix
      - name: Verify lint after fixes
        run: ruff check .
      - name: Remove one-shot workflow
        run: rm .github/workflows/ruff-fix-figure-docs.yml
      - name: Commit lint-clean tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lint-clean figure documentation tooling"
          git push origin HEAD:p80-simplex-coupled-box-certificate
