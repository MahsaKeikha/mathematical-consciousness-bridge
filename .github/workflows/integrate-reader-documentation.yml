name: integrate-reader-documentation

on:
  push:
    branches:
      - docs-first-reader-experience-p81
    paths:
      - .github/workflows/integrate-reader-documentation.yml
      - scripts/integrate_reader_documentation.py
      - scripts/fix_reader_validation.py
      - scripts/generate_all_figures.py
      - tests/test_reader_documentation_consistency.py
      - figures/**
      - scripts/*.md

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-first-reader-experience-p81
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reader documentation integration
        run: |
          python scripts/integrate_reader_documentation.py
          python scripts/fix_reader_validation.py
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Format maintenance edits
        run: python -m ruff check . --fix
      - name: Validate complete repository
        run: |
          python -m pytest
          python -m ruff check .
          python scripts/generate_all_figures.py --validate-only
          python scripts/verify_repository.py
      - name: Remove temporary integration files and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/integrate-reader-documentation.yml
          git rm scripts/integrate_reader_documentation.py
          git rm scripts/fix_reader_validation.py
          git add -A
          git commit -m "Complete first-reader and reproducibility documentation"
          git push origin HEAD:docs-first-reader-experience-p81
