name: fix-mobile-publication-layout

on:
  push:
    paths:
      - ".github/workflows/fix-mobile-publication-layout.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair mobile output layout and cache contract
        run: |
          python - <<'PY'
          from pathlib import Path

          prepare_path = Path("scripts/prepare_website.py")
          prepare = prepare_path.read_text(encoding="utf-8")

          old_version = 'ASSET_VERSION = "20260912-nav15-p86"'
          new_version = 'ASSET_VERSION = "20260913-mobile16-p86"'
          if old_version not in prepare:
              raise SystemExit("expected website asset version not found")
          prepare = prepare.replace(old_version, new_version, 1)

          old_tags = '''SCRIPT_TAG = f'<script defer src="app.js?v={ASSET_VERSION}"></script>'
          READER_LINKS_SCRIPT_TAG = '<script defer src="reader-links.js"></script>'
          FOOTER_SCRIPT_TAG = '<script defer src="footer.js"></script>'
          NAVIGATION_STYLE_TAG = '<link rel="stylesheet" href="navigation.css" />' '''.strip()
          new_tags = '''SCRIPT_TAG = f'<script defer src="app.js?v={ASSET_VERSION}"></script>'
          READER_LINKS_SCRIPT_TAG = '<script defer src="reader-links.js"></script>'
          FOOTER_SCRIPT_TAG = '<script defer src="footer.js"></script>'
          BASE_STYLE_TAG = f'<link rel="stylesheet" href="styles.css?v={ASSET_VERSION}" />'
          NAVIGATION_STYLE_TAG = '<link rel="stylesheet" href="navigation.css" />' '''.strip()
          if old_tags not in prepare:
              raise SystemExit("expected shared asset tag block not found")
          prepare = prepare.replace(old_tags, new_tags, 1)

          old_patterns = '''APP_SCRIPT_PATTERN = re.compile(
              r'<script\\s+defer\\s+src="app\\.js(?:\\?v=[^\"]+)?"></script>'
          )
          NAVIGATION_V2_STYLE_PATTERN = re.compile('''.strip()
          new_patterns = '''APP_SCRIPT_PATTERN = re.compile(
              r'<script\\s+defer\\s+src="app\\.js(?:\\?v=[^\"]+)?"></script>'
          )
          BASE_STYLE_PATTERN = re.compile(
              r'<link\\s+rel="stylesheet"\\s+href="styles\\.css(?:\\?v=[^\"]+)?"\\s*/?>'
          )
          NAVIGATION_V2_STYLE_PATTERN = re.compile('''.strip()
          if old_patterns not in prepare:
              raise SystemExit("expected asset pattern block not found")
          prepare = prepare.replace(old_patterns, new_patterns, 1)

          old_normalize = '''    text = APP_SCRIPT_PATTERN.sub(SCRIPT_TAG, text)
              text = NAVIGATION_V2_STYLE_PATTERN.sub(NAVIGATION_V2_STYLE_TAG, text)'''.strip()
          new_normalize = '''    text = APP_SCRIPT_PATTERN.sub(SCRIPT_TAG, text)
              text = BASE_STYLE_PATTERN.sub(BASE_STYLE_TAG, text)
              text = NAVIGATION_V2_STYLE_PATTERN.sub(NAVIGATION_V2_STYLE_TAG, text)'''.strip()
          if old_normalize not in prepare:
              raise SystemExit("expected asset normalization block not found")
          prepare = prepare.replace(old_normalize, new_normalize, 1)

          old_additions = '''        additions: list[str] = []
                  if NAVIGATION_STYLE_TAG not in text:'''.strip()
          new_additions = '''        additions: list[str] = []
                  if BASE_STYLE_TAG not in text:
                      additions.append(BASE_STYLE_TAG)
                  if NAVIGATION_STYLE_TAG not in text:'''.strip()
          if old_additions not in prepare:
              raise SystemExit("expected shared asset additions block not found")
          prepare = prepare.replace(old_additions, new_additions, 1)
          prepare_path.write_text(prepare, encoding="utf-8")

          css_path = Path("website/reader-experience-v2.css")
          css = css_path.read_text(encoding="utf-8")
          old_wrap = '''.equation,
          pre,
          code,
          .figure-card,
          .frontier-summary-card,
          .reader-primer-card,
          .reader-step-card {
            overflow-wrap: anywhere;
          }'''
          new_wrap = '''.equation,
          .figure-card,
          .frontier-summary-card,
          .reader-primer-card,
          .reader-step-card {
            overflow-wrap: anywhere;
          }

          /* Technical paths should wrap only when they truly need to, never letter-by-letter. */
          code {
            overflow-wrap: break-word;
            word-break: normal;
          }

          pre {
            overflow-x: auto;
            overflow-wrap: normal;
            word-break: normal;
          }'''
          if old_wrap not in css:
              raise SystemExit("expected reader wrapping block not found")
          css = css.replace(old_wrap, new_wrap, 1)

          mobile_marker = '''@media (max-width: 680px) {
            .theorem-figure-shell img {'''
          mobile_replacement = '''@media (max-width: 680px) {
            /*
             * Phone contract: resource/output collections are cards, never squeezed
             * desktop columns. !important intentionally overrides legacy page-local
             * grid declarations in old reader surfaces.
             */
            .source-grid,
            .implementation-index,
            .implementation-links,
            .research-card-grid,
            .reader-trail-grid,
            .lineage-callout-actions,
            .frontier-summary-grid {
              grid-template-columns: minmax(0, 1fr) !important;
            }

            .source-grid > *,
            .implementation-index > *,
            .implementation-links > *,
            .research-card-grid > *,
            .reader-trail-grid > *,
            .lineage-callout-actions > *,
            .frontier-summary-grid > * {
              min-width: 0;
              max-width: 100%;
            }

            .source-grid a,
            .implementation-index a,
            .implementation-links a {
              width: 100%;
              min-height: 0 !important;
              overflow-wrap: normal;
              word-break: normal;
            }

            .source-grid code,
            .implementation-index code,
            .implementation-links code,
            .source-grid small,
            .implementation-links small {
              overflow-wrap: break-word;
              word-break: normal;
            }

            .theorem-figure-shell img {'''
          if mobile_marker not in css:
              raise SystemExit("expected mobile reader breakpoint not found")
          css = css.replace(mobile_marker, mobile_replacement, 1)
          css_path.write_text(css, encoding="utf-8")

          test_path = Path("tests/test_website_build.py")
          tests = test_path.read_text(encoding="utf-8")
          old_import = '''    ASSET_VERSION,
              CONTRAST_STYLE_TAG,'''.strip()
          new_import = '''    ASSET_VERSION,
              BASE_STYLE_TAG,
              CONTRAST_STYLE_TAG,'''.strip()
          if old_import not in tests:
              raise SystemExit("expected website-build import block not found")
          tests = tests.replace(old_import, new_import, 1)

          old_counts = '''        assert built.count(SCRIPT_TAG) == 1
                  assert built.count(READER_LINKS_SCRIPT_TAG) == 1'''.strip()
          new_counts = '''        assert built.count(SCRIPT_TAG) == 1
                  assert built.count(BASE_STYLE_TAG) == 1
                  assert built.count(READER_LINKS_SCRIPT_TAG) == 1'''.strip()
          if old_counts not in tests:
              raise SystemExit("expected shared asset count assertions not found")
          tests = tests.replace(old_counts, new_counts, 1)

          old_stale = '''    assert f'app.js?v={ASSET_VERSION}' in built
              assert f'navigation-v2.css?v={ASSET_VERSION}' in built'''.strip()
          new_stale = '''    assert f'app.js?v={ASSET_VERSION}' in built
              assert f'styles.css?v={ASSET_VERSION}' in built
              assert f'navigation-v2.css?v={ASSET_VERSION}' in built'''.strip()
          if old_stale not in tests:
              raise SystemExit("expected stale asset assertions not found")
          tests = tests.replace(old_stale, new_stale, 1)

          old_bare = '''    assert '<script defer src="app.js"></script>' not in built
              assert 'href="navigation-v2.css"' not in built'''.strip()
          new_bare = '''    assert '<script defer src="app.js"></script>' not in built
              assert 'href="styles.css"' not in built
              assert 'href="navigation-v2.css"' not in built'''.strip()
          if old_bare not in tests:
              raise SystemExit("expected bare asset assertions not found")
          tests = tests.replace(old_bare, new_bare, 1)

          anchor = '''def test_publication_type_scale_stays_restrained() -> None:
          '''
          if anchor not in tests:
              raise SystemExit("expected website-build test insertion point not found")
          mobile_test = '''def test_mobile_resource_grids_collapse_without_shattering_paths() -> None:
              css = Path("website/reader-experience-v2.css").read_text(encoding="utf-8")

              assert ".implementation-links," in css
              assert ".source-grid," in css
              assert "grid-template-columns: minmax(0, 1fr) !important" in css
              assert "overflow-wrap: break-word" in css
              assert "pre {\\n  overflow-x: auto;\\n  overflow-wrap: normal" in css


          '''
          tests = tests.replace(anchor, mobile_test + anchor, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run targeted website tests
        run: python -m pytest tests/test_website_build.py tests/test_implementation_reader_path.py tests/test_website_link_integrity.py
      - name: Build canonical website
        run: python scripts/prepare_website.py --source website --output _site
      - name: Assert mobile cache and card contract in built site
        run: |
          grep -q 'styles.css?v=20260913-mobile16-p86' _site/implementation.html
          grep -q 'reader-experience-v2.css?v=20260913-mobile16-p86' _site/implementation.html
          grep -q 'grid-template-columns:1fr' _site/implementation.html
          grep -q 'grid-template-columns: minmax(0, 1fr) !important' _site/reader-experience-v2.css
      - name: Verify repository contract
        run: python scripts/verify_repository.py
      - run: git diff --check
      - name: Commit repaired mobile publication contract
        run: |
          if git diff --quiet -- scripts/prepare_website.py website/reader-experience-v2.css tests/test_website_build.py; then
            echo "No mobile publication changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prepare_website.py website/reader-experience-v2.css tests/test_website_build.py
          git commit -m "Fix mobile research output layout and stylesheet cache"
          git push