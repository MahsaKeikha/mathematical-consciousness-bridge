name: temporary-overview-orientation

on:
  push:
    branches:
      - overview-p88-provenance-clarity
    paths:
      - .github/workflows/tmp-overview-orientation.yml

permissions:
  contents: write

jobs:
  harden-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overview-p88-provenance-clarity
          fetch-depth: 0
      - name: Harden P88 source and Overview contracts
        run: echo '' | base64 --decode | python
      - name: Commit source-contract hardening
        run: |
          if git diff --quiet; then
            echo "Publication contracts already hardened."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/promote_p88_public_frontier.py tests/test_reader_experience.py
          git commit -m "Harden P88 provenance and Overview contracts"
          git push origin HEAD:overview-p88-provenance-clarity
