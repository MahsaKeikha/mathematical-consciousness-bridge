name: temporary-overview-orientation

on:
  push:
    branches:
      - overview-p88-provenance-clarity
    paths:
      - .github/workflows/tmp-overview-orientation.yml
      - website/index.html

permissions:
  contents: write

jobs:
  update-overview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overview-p88-provenance-clarity
          fetch-depth: 0
      - name: Insert first-reader three-stage orientation
        run: echo '' | base64 --decode | python
      - name: Commit generated Overview source
        run: |
          if git diff --quiet; then
            echo "Overview orientation already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/index.html
          git commit -m "Add three-stage Overview orientation"
          git push origin HEAD:overview-p88-provenance-clarity
