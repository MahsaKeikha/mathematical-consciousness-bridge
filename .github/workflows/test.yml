name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  integrate-figure-docs:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'p80-simplex-coupled-box-certificate') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/p80-simplex-coupled-box-certificate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p80-simplex-coupled-box-certificate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add quantum semantics to the permanent figure enricher
        if: hashFiles('scripts/patch_figure_enricher_for_quantum.py') != ''
        run: python scripts/patch_figure_enricher_for_quantum.py
      - name: Apply complete figure documentation
        run: python scripts/enrich_figure_documentation.py
      - name: Validate strict SVG XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in sorted(Path("docs/figures").rglob("*.svg")):
              ET.parse(path)
          PY
      - name: Remove one-shot patch helper
        run: rm -f scripts/patch_figure_enricher_for_quantum.py
      - name: Commit integrated figure artifacts
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No figure-documentation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No staged figure-documentation changes to commit."
            exit 0
          fi
          git commit -m "Make all quantum figures visually self-explanatory"
          git push origin HEAD:p80-simplex-coupled-box-certificate

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run pytest with captured diagnostics
        shell: bash
        run: |
          set -o pipefail
          pytest 2>&1 | tee pytest-output-${{ matrix.python-version }}.txt
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ matrix.python-version }}
          path: pytest-output-${{ matrix.python-version }}.txt
          if-no-files-found: error
      - run: ruff check .
