name: polish-scientific-main-page

on:
  push:
    branches:
      - professional-scientific-main-page
    paths:
      - scripts/polish_scientific_main_page.py
      - .github/workflows/polish-scientific-main-page.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: professional-scientific-main-page
          fetch-depth: 0
      - name: Polish scientific README
        run: python scripts/polish_scientific_main_page.py
      - name: Validate reader-facing architecture
        run: |
          grep -Fq '# How to read this study' README.md
          grep -Fq 'universal_proof_ladder.svg' README.md
          grep -Fq 'conscious_state_measurement_map.svg' README.md
          grep -Fq 'information_geometry_response_manifold.svg' README.md
          grep -Fq 'observer_to_bridge_handoff.svg' README.md
          grep -Fq 'theory_comparison_map.svg' README.md
          ! grep -Fq 'p70_primal_dual_gap_decomposition.svg' README.md
          grep -Fq 'Permanent proof, figure, code, and test index: P39-P60' README.md
          git diff --check
      - name: Commit scientific polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tests/
          git diff --cached --quiet && exit 0
          git commit -m "docs: polish main page for first-time scientific readers"
          git push origin HEAD:professional-scientific-main-page
