# Temporary guarded publication workflow. Removed before merge. Ruff-corrected rerun.
name: publish-p69

on:
  workflow_dispatch:
  push:
    branches:
      - p69_dual_optimal_multiplier
    paths:
      - scripts/publish_p69.py
      - .github/workflows/publish-p69.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p69_dual_optimal_multiplier
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply P69 publication integration
        run: python scripts/publish_p69.py
      - name: Run targeted publication tests
        run: |
          python -m pip install -e ".[dev]"
          pytest tests/test_dual_optimal_multiplier.py tests/test_p69_figure_geometry.py tests/test_public_reader_navigation_frontier.py tests/test_release_metadata_consistency.py tests/test_research_website_integrity.py tests/test_p68_publication_integration.py tests/test_p65_publication_integration.py
          ruff check src/consciousness_bridge/dual_optimal_multiplier.py tests/test_dual_optimal_multiplier.py tests/test_p69_figure_geometry.py scripts/publish_p69.py
      - name: Commit integrated publication record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/theorem_roadmap.md docs/research_navigation.md docs/equation_and_citation_map.md website/index.html website/research-map.html pyproject.toml CITATION.cff CHANGELOG.md tests/test_release_metadata_consistency.py tests/test_research_website_integrity.py tests/test_p68_publication_integration.py tests/test_p65_publication_integration.py
          git diff --cached --quiet && exit 0
          git commit -m "Integrate P69 public research record"
          git push origin HEAD:p69_dual_optimal_multiplier
