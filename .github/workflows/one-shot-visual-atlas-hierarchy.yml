name: One Shot Visual Atlas Hierarchy

on:
  push:
    branches:
      - visual-atlas-frontier-hierarchy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: visual-atlas-frontier-hierarchy
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Normalize Visual Atlas hierarchy
        run: python scripts/one_shot_visual_atlas_hierarchy.py

      - name: Run focused reader contracts
        run: |
          python -m pytest -q \
            tests/test_visual_atlas_frontier_hierarchy.py \
            tests/test_p95_reader_surface_coherence.py \
            tests/test_p96_reader_surface_coherence.py \
            tests/test_p97_reader_surface_coherence.py \
            tests/test_p98_reader_surface_coherence.py \
            tests/test_p99_reader_surface_coherence.py \
            tests/test_research_map_p77_p100_sequence.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit normalized permanent files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/visual-atlas.html website/start-here.html website/research-map.html website/research-lineage.html tests/test_visual_atlas_frontier_hierarchy.py
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Normalize Visual Atlas frontier hierarchy"
          git push origin HEAD:visual-atlas-frontier-hierarchy
