name: strengthen-source-links-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/strengthen-source-links-once.yml

permissions:
  contents: write

jobs:
  strengthen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply direct source links
        run: python .github/strengthen_source_links.py

      - name: Validate on Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Commit verified source navigation
        run: |
          rm .github/workflows/strengthen-source-links-once.yml
          rm .github/strengthen_source_links.py
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src -maxdepth 1 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/foundational_physics_mathematics_bibliography.md docs/proposition_19_fundamental_physical_sufficiency.md docs/equation_and_citation_map.md docs/reference_audit.md docs/research_navigation.md .github/workflows/strengthen-source-links-once.yml .github/strengthen_source_links.py
          git commit -m "Link scientific claims directly to sources and audits"
          git push origin HEAD:main

# one-time citation-navigation pass; removes itself after all validations pass
