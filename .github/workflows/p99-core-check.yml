name: p99-core-check

on:
  push:
    branches: ["p99-cross-fitted-evalue-aggregation"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -e ".[dev]"
      - name: Run P99 exact tests
        run: python -m pytest -q tests/test_cross_fitted_evalue_aggregation.py
      - name: Run Ruff
        run: python -m ruff check src/consciousness_bridge/cross_fitted_evalue_aggregation.py tests/test_cross_fitted_evalue_aggregation.py
      - name: Check formatting drift
        run: git diff --check
