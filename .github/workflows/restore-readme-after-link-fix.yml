# Temporary recovery workflow. Removed before merge.
name: restore-readme-after-link-fix

on:
  workflow_dispatch:
  push:
    branches:
      - p70_primal_dual_gap_decomposition
    paths:
      - scripts/restore_readme_after_link_fix.py
      - .github/workflows/restore-readme-after-link-fix.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p70_primal_dual_gap_decomposition
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore exact README and fix quantum link
        run: python scripts/restore_readme_after_link_fix.py
      - name: Validate restored README
        run: |
          python -m pip install -e ".[dev]"
          pytest tests/test_readme_research_orientation.py tests/test_document_link_integrity.py tests/test_documentation_integrity.py tests/test_public_reader_navigation_frontier.py tests/test_p70_publication_integration.py
      - name: Commit exact restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Restore organized README and fix quantum entry link"
          git push origin HEAD:p70_primal_dual_gap_decomposition
