name: P100 restore full changelog

on:
  push:
    branches:
      - p100-anytime-sequential-eprocess
    paths:
      - .github/workflows/p100-restore-changelog.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full changelog from clean P100 head and add final audit bullet
        run: |
          git show 0c2db093cd2256e38f5aff191b9031f0fbfff132:CHANGELOG.md > CHANGELOG.md
          python - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          anchor = "- Added the canonical P100 figure, equation/novelty provenance, reader-surface contracts, and publication synchronization while keeping the formal release at v0.82.0."
          addition = "- Finalized Start Here and current-frontier reader coherence so P100 is the public capstone while P99 and P98 remain explicitly auditable historical predecessors."
          if addition not in text:
              if anchor not in text:
                  raise SystemExit("P100 changelog anchor missing")
              text = text.replace(anchor, anchor + "\n" + addition, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Remove one-shot workflow and commit restoration
        run: |
          rm .github/workflows/p100-restore-changelog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete changelog history for P100"
          git push origin HEAD:p100-anytime-sequential-eprocess
