name: sync-pr192-publication

on:
  push:
    branches:
      - professionalize-scientific-figure-connectors

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: professionalize-scientific-figure-connectors
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin validated Research III revision
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '1ceea4c428d835ec9a8a417cbf238d9bcfe1d7c3'
          new = '4082a357929beecc2158fe5bc159e42562de19bf'
          paths = [
              Path('website/atlas-architecture-refresh.js'),
              Path('website/source-section-visuals.js'),
              Path('tests/test_atlas_architecture_refresh.py'),
              Path('tests/test_sources_section_visual_anchors.py'),
              Path('tests/test_unified_atlas_galleries.py'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected old Research III pin missing from {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Synchronize canonical figure publication record
        run: python scripts/sync_figure_publication.py
      - name: Verify synchronization inputs
        run: |
          python scripts/sync_figure_publication.py --check
          python - <<'PY'
          from pathlib import Path
          old = '1ceea4c428d835ec9a8a417cbf238d9bcfe1d7c3'
          roots = [Path('website'), Path('tests')]
          hits = []
          for root in roots:
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.js', '.py', '.html', '.md'}:
                      if old in path.read_text(encoding='utf-8', errors='ignore'):
                          hits.append(str(path))
          if hits:
              raise SystemExit(f'stale Research III pin remains: {hits}')
          PY
          git diff --check
      - name: Commit synchronized records
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No synchronization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add figures/manifest.json figures/current_frontier.svg website/atlas-architecture-refresh.js website/source-section-visuals.js tests/test_atlas_architecture_refresh.py tests/test_sources_section_visual_anchors.py tests/test_unified_atlas_galleries.py
          git commit -m 'Synchronize polished figures and Research III pin'
          git push origin HEAD:professionalize-scientific-figure-connectors
