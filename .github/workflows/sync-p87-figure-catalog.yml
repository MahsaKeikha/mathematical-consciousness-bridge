name: sync-p87-figure-catalog

on:
  push:
    branches: ["p87-publication"]
    paths:
      - ".github/workflows/sync-p87-figure-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p87-publication
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Regenerate canonical figure catalog
        run: python scripts/enrich_figure_documentation.py
      - name: Require catalog-only deterministic change
        run: |
          python - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          unexpected = set(changed) - {"docs/figure_catalog.md"}
          if unexpected:
              raise SystemExit(
                  "unexpected generated changes: " + ", ".join(sorted(unexpected))
              )
          if "docs/figure_catalog.md" not in changed:
              raise SystemExit("figure catalog generator produced no catalog update")
          PY
          grep -q 'Current catalog:.*145 SVG figures' docs/figure_catalog.md
          grep -q '70 proposition/theorem visuals' docs/figure_catalog.md
          grep -q 'P87 Bounded Primitive Four-Event Parity Certificate' docs/figure_catalog.md
          if grep -q '^## P87 exact bounded primitive four-event projection-parity certificate$' docs/figure_catalog.md; then
            echo "Manual duplicate P87 catalog section remains."
            exit 1
          fi
          git diff --check
      - name: Commit generated P87 catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/figure_catalog.md
          git commit -m "Regenerate figure catalog for P87"
          git push origin HEAD:p87-publication
