name: promote-p92-branch

on:
  push:
    branches:
      - p92-exact-global-mixed-distance
    paths:
      - "scripts/promote_p92_public_frontier.py"
      - "scripts/fix_p92_branch_migration_contracts.py"
      - ".github/workflows/promote-p92-branch.yml"

permissions:
  contents: write

concurrency:
  group: promote-p92-branch
  cancel-in-progress: true

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p92-exact-global-mixed-distance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Promote P92 publication surfaces
        run: python scripts/promote_p92_public_frontier.py
      - name: Repair narrow P92 migration contracts
        run: python scripts/fix_p92_branch_migration_contracts.py
      - name: Synchronize figure publication record
        run: python scripts/sync_figure_publication.py
      - name: Keep all workflow files out of the bot migration commit
        run: git checkout -- .github/workflows
      - name: Validate migration diff
        run: git diff --check
      - name: Commit branch-only migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Promote P92 public frontier"
          git push origin HEAD:p92-exact-global-mixed-distance

# Branch-only migration workflow. Delete before merge.
