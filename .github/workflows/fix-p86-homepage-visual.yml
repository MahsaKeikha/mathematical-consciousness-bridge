name: fix-p86-homepage-visual

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-p86-homepage-visual.yml"
      - "scripts/repair_p86_homepage_visual.py"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Prepare permanent homepage figure contract
        run: python scripts/repair_p86_homepage_visual.py
      - name: Synchronize P86 visual publication surfaces
        run: python scripts/sync_figure_publication.py
      - name: Install repository test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify figure and reader contracts
        run: |
          python scripts/sync_figure_publication.py --check
          python -m pytest -q tests/test_figure_publication_sync.py tests/test_figure_documentation_integrity.py tests/test_reader_experience.py tests/test_website_research_orientation.py
          python scripts/verify_repository.py
      - name: Verify exact Pages build ordering
        run: |
          python scripts/prepare_website.py --source website --output _site
          test -f _site/figures/p86_exact_minimally_weighted_quad_projection_parity.svg
          grep -q 'src="figures/p86_exact_minimally_weighted_quad_projection_parity.svg"' _site/index.html
          grep -q 'src="figures/p86_exact_minimally_weighted_quad_projection_parity.svg"' _site/visual-atlas.html
          python -c "from pathlib import Path; t=Path('_site/index.html').read_text(encoding='utf-8'); p=t.index('id=\"p86-frontier\"'); assert p < t.index('id=\"plain-language\"'); assert p < t.index('id=\"p84-frontier\"'); assert p < t.index('id=\"p85-frontier\"')"
          python -c "from pathlib import Path; t=Path('_site/visual-atlas.html').read_text(encoding='utf-8'); assert t.index('id=\"p86-frontier\"') < t.index('id=\"p85-frontier\"')"
          git diff --check
      - name: Commit synchronized homepage visual contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync_figure_publication.py tests/test_figure_publication_sync.py .github/workflows/figures.yml .github/workflows/pages.yml website/index.html website/visual-atlas.html figures docs/figures/README.md
          git add -u scripts/sync_visual_frontier.py tests/test_visual_frontier_sync.py
          if git diff --cached --quiet; then
            echo "No synchronized changes required."
            exit 0
          fi
          git commit -m "Make P86 the primary website theorem visual"
          git push
