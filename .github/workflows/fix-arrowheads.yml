name: fix-arrowheads

on:
  push:
    branches:
      - fix-repository-wide-arrowheads

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-repository-wide-arrowheads
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show legacy arrowhead count before repair
        run: |
          echo "strokeWidth markers before:"
          grep -RIl 'markerUnits="strokeWidth"' docs/figures website figures --include='*.svg' | wc -l
          echo "all marker-bearing SVGs before:"
          grep -RIl '<marker' docs/figures website figures --include='*.svg' | wc -l
      - name: Normalize every reader-facing SVG arrowhead
        run: python scripts/normalize_svg_arrowheads.py
      - name: Synchronize canonical publication record
        run: python scripts/sync_figure_publication.py
      - name: Verify repaired arrowheads and publication state
        run: |
          python scripts/normalize_svg_arrowheads.py --check
          python scripts/sync_figure_publication.py --check
          python -m pytest -q tests/test_reader_facing_arrowheads.py tests/test_publication_connector_design.py
          if grep -RIn 'markerUnits="strokeWidth"' docs/figures website figures --include='*.svg'; then
            echo 'stroke-scaled marker remains'
            exit 1
          fi
          git diff --check
      - name: Commit canonical repaired SVG record
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No SVG normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/figures website figures
          git commit -m 'Normalize reader-facing arrowheads repository-wide'
          git push origin HEAD:fix-repository-wide-arrowheads
