name: promote-p85-publication

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/promote-p85.yml"
      - "scripts/promote_p85_publication.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize P85 publication surfaces
        run: python scripts/promote_p85_publication.py
      - name: Check patch formatting
        run: git diff --check
      - name: Commit synchronized publication state
        run: |
          if git diff --quiet; then
            echo "Publication state already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md START_HERE.md CHANGELOG.md CITATION.cff CITATION.md docs website
          git commit -m "Promote P85 across public research surfaces"
          git push origin HEAD:main
