name: promote-p91-branch

on:
  push:
    branches:
      - p91-mixed-prevalence-rank-two-flattening
    paths:
      - "scripts/promote_p91_public_frontier.py"
      - ".github/workflows/promote-p91-branch.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p91-mixed-prevalence-rank-two-flattening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Promote P91 reader surfaces
        run: python scripts/promote_p91_public_frontier.py
      - name: Synchronize canonical visual gateway
        run: python scripts/sync_figure_publication.py
      - name: Normalize reader-facing punctuation
        run: python scripts/normalize_documentation_punctuation.py
      - name: Keep permanent workflows out of the generated promotion commit
        run: |
          git restore .github/workflows/figures.yml .github/workflows/reproducibility.yml
      - name: Validate generated patch shape
        run: |
          git diff --check
          git status --short
      - name: Commit promoted P91 publication state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "P91 publication state already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote P91 public frontier"
          git push origin HEAD:p91-mixed-prevalence-rank-two-flattening
