name: Fix theorem roadmap P2-P3 line

on:
  push:
    branches: [visual-audit-theorem-roadmap]
    paths:
      - .github/workflows/fix-theorem-roadmap-p23-line.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-audit-theorem-roadmap
      - name: Shorten P2-P3 label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/figures/theorem_roadmap.svg')
          text = path.read_text(encoding='utf-8')
          old = 'P2-P3 empirical equivalence and identity tests'
          new = 'P2-P3 empirical equivalence and tests'
          if old not in text:
              raise SystemExit(f'missing guarded source phrase: {old!r}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/figures/theorem_roadmap.svg
          git commit -m 'Shorten P2-P3 roadmap label'
          git push origin HEAD:visual-audit-theorem-roadmap
