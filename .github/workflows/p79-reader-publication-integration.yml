name: P79 reader publication integration

on:
  push:
    branches: ["p79-certified-sampling-radius"]
    paths:
      - ".github/workflows/p79-reader-publication-integration.yml"
      - "scripts/integrate_p79_publication.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p79-certified-sampling-radius
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply P79 publication integration
        run: python scripts/integrate_p79_publication.py
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run complete test suite
        run: pytest -q
      - name: Run lint
        run: ruff check .
      - name: Commit integrated publication record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Integrate P79 across public research surfaces"
            git push origin HEAD:p79-certified-sampling-radius
          fi
