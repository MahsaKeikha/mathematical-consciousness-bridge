name: P79 reader publication integration

on:
  push:
    paths:
      - .github/workflows/p79-reader-publication-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p79-certified-sampling-radius
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate P79 across reader-facing surfaces
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          ROOT = Path('.')

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f'missing anchor for {label}: {old[:120]!r}')
              return text.replace(old, new, 1)

          def insert_before(text: str, marker: str, addition: str, label: str) -> str:
              if marker not in text:
                  raise RuntimeError(f'missing insertion marker for {label}: {marker[:120]!r}')
              return text.replace(marker, addition + marker, 1)

          # ------------------------------------------------------------------
          # README: make P79 part of the coherent public scientific narrative.
          # ------------------------------------------------------------------
          path = 'README.md'
          text = read(path)
          text = text.replace('version-0.78.0-2563eb', 'version-0.79.0-2563eb')

          p78_plain = (
              'P78 addresses the computational problem that P77 deliberately leaves open for the continuous four-view target model. '
              'The P75 model does not contain a finite list of candidate distributions; it contains a continuous family generated by nine parameters. '
              'Testing a few parameter choices, or even finding an excellent numerical fit, cannot prove that every allowed model is far from the data. '
              'P78 therefore partitions the entire parameter region into boxes and computes a mathematically guaranteed lower bound for every box. '
              'Because those boxes still cover every allowed parameter choice, the smallest box bound is a genuine lower bound on the distance to the whole continuous model family. '
              'At the same time, any explicit candidate model supplies an upper bound. Refining the boxes narrows the gap between the two. '
              'The implementation keeps the empirical count law and the adaptive box boundaries in exact rational arithmetic so the global optimization certificate is not created by rounding a local floating-point optimizer. '
              'When the certified global lower bound is larger than a separately valid upper bound on the P77 sampling radius, the full continuous model family is rejected with the P77 statistical guarantee. '
              'A small lower bound remains inconclusive; P78 does not turn failure to reject into model validation.'
          )
          p79_plain = (
              '\n\nP79 closes a smaller but important numerical-certification gap. P77’s sampling radius contains a logarithm and a square root. '
              'An ordinary floating-point evaluation may be excellent numerically, but a formal rejection certificate needs the inequality direction to be guaranteed. '
              'P79 therefore constructs an exact rational upper bound on that radius: it brackets the logarithm with a positive convergent series and explicit tail, then encloses the square root using integer arithmetic. '
              'The P77/P78/P79 rejection handoff is valid only when the P78 lower bound is strictly larger than the P79 upper bound. '
              'This closes a numerical-direction gap; it does not make non-rejection into model acceptance, and the physical-to-experiential bridge remains open.'
          )
          if p79_plain.strip() not in text:
              text = replace_once(text, p78_plain, p78_plain + p79_plain, 'README plain-language P79')

          text = text.replace(
              'The research currently contains **78 proposition-level results** and **66 equation-driven quantitative figures**. The theorem frontier is P78.',
              'The research currently contains **79 proposition-level results** and **67 equation-driven quantitative figures**. The theorem frontier is P79.'
          )

          p79_section = r'''
## 1.13 P79: certified rational sampling-radius envelope

P77 defines the simultaneous finite-alphabet sampling radius and P78 supplies a certified lower bound on distance to the complete continuous P75 model family. The remaining rejection comparison has to preserve its inequality direction numerically: **P78 lower-bounds model distance**, while **P79 upper-bounds the P77 sampling radius**.

For alphabet size $K$, sample size $n$, and confidence level $1-\alpha$,

$$
\varepsilon_{n,K}(\alpha)
=
\sqrt{\frac{\log(2K/\alpha)}{2n}}.
$$

P79 reduces the positive rational logarithm argument exactly, evaluates the logarithm through a positive atanh-series partial sum with an explicit rational remainder bound, and then encloses the square root by integer-certified dyadic floor and ceiling operations. The resulting rational bracket satisfies

$$
\boxed{
\underline\varepsilon_{n,K}(\alpha)
\le
\varepsilon_{n,K}(\alpha)
\le
\overline\varepsilon_{n,K}(\alpha).
}
$$

The strict full-law rejection handoff is therefore directionally safe:

$$
\boxed{
L_{\mathrm{model}} > \overline\varepsilon_{n,K}(\alpha)
\quad\Longrightarrow\quad
L_{\mathrm{model}} > \varepsilon_{n,K}(\alpha),
}
$$

where $L_{\mathrm{model}}$ is a certified P78 lower bound. This closes a numerical-certification gap in the P77/P78 chain. It does not make a non-rejected model true, does not identify the P75 latent state with consciousness, and does not solve the physical-to-experiential bridge.

![P79 certified rational sampling-radius envelope](docs/figures/p79_certified_sampling_radius.svg)

**Figure 14. P79 one-sided numerical certification.** Exact statistical inputs are reduced to rational logarithm bounds and an integer-certified dyadic square-root enclosure. The final decision uses a lower bound on model distance against an upper bound on sampling uncertainty, so decimal rounding cannot silently reverse the rejection inequality.

Direct proof: [Proposition 79](docs/proposition_79_certified_sampling_radius.md). Equation and literature classification: [P79 provenance record](docs/p79_equation_provenance.md). Implementation: [`certified_sampling_radius.py`](src/consciousness_bridge/certified_sampling_radius.py). Tests: [`test_certified_sampling_radius.py`](tests/test_certified_sampling_radius.py) and [`test_p79_figure_geometry.py`](tests/test_p79_figure_geometry.py).

'''
          if '## 1.13 P79: certified rational sampling-radius envelope' not in text:
              text = insert_before(text, '\n---\n\n# 2. From physical dynamics to operational structure', '\n' + p79_section, 'README P79 theorem section')

          text = text.replace(
              'P78 then supplies an exact-rational branch-and-bound lower-bound certificate for the continuous P75 latent family. The remaining challenges are faster and tighter global certification, sharper power, and broader dependent-view alternatives.',
              'P78 then supplies an exact-rational branch-and-bound lower-bound certificate for the continuous P75 latent family. P79 completes the one-sided numerical handoff by certifying an exact-rational upper envelope for the P77 sampling radius. The remaining challenges are faster and tighter global optimization, sharper statistical power, and broader dependent-view alternatives.'
          )

          if '21. P79 closes the numerical-direction gap' not in text:
              text = text.replace(
                  '20. P78 supplies a certified global L-infinity lower bound for the continuous P75 family by exact-rational multi-affine box refinement, with an explicit mesh-gap guarantee and a direct P77 rejection handoff.\n21. The experiment-design branch provides scheduling, stopping, calibration, integer optimization, and primal-dual certification without promoting those results into consciousness ontology.',
                  '20. P78 supplies a certified global L-infinity lower bound for the continuous P75 family by exact-rational multi-affine box refinement, with an explicit mesh-gap guarantee and a direct P77 rejection handoff.\n21. P79 closes the numerical-direction gap in that handoff by giving an exact-rational upper certificate for the P77 sampling radius and requiring a strict P78-lower-bound versus P79-upper-bound comparison.\n22. The experiment-design branch provides scheduling, stopping, calibration, integer optimization, and primal-dual certification without promoting those results into consciousness ontology.'
              )

          text = text.replace(
              "- extend P78's certified continuous-family computation with tighter pruning, sharper relaxations, and power-aware stopping criteria;",
              "- extend the P78-P79 certified full-law pipeline with tighter pruning, sharper relaxations, and power-aware stopping criteria;"
          )
          text = text.replace(
              'The most immediate target-side problem after P78 is **tighter certified computation and power for full-law adequacy**. P78 supplies a rigorous exact-rational branch-and-bound lower bound for the continuous P75 family, but the nine-dimensional search can be expensive. The next methodological target is stronger certified pruning or relaxation, potentially using interval tightening or polynomial moment-SOS lower bounds, together with sharper power analysis and broader target-view dependence models.',
              'After P79, the immediate target-side problem is **tighter certified computation and sharper power for full-law adequacy**. P78 supplies the rigorous global model-distance lower bound and P79 supplies the rigorous sampling-radius upper bound, so the direction of the rejection inequality is now fully certified. The remaining computational burden is the nine-dimensional continuous search. Stronger certified pruning, interval tightening, or polynomial moment-SOS lower bounds may reduce that cost; the remaining statistical burden is sharper power analysis and broader target-view dependence models.'
          )

          p78_fals = '| Continuous P75 full-law separation is certified | A P78 global lower bound exceeds a valid P77 sampling-radius upper bound | Treating an incomplete parameter search or ordinary floating approximation as a formal certificate |'
          p79_fals = '| P77/P78 rejection comparison is numerically certified | A P78 model-distance lower bound is strictly larger than the P79 exact-rational sampling-radius upper bound | Comparing rounded decimal approximations without a one-sided enclosure |'
          if p79_fals not in text:
              text = replace_once(text, p78_fals, p78_fals + '\n' + p79_fals, 'README falsification P79 row')

          p78_evidence = '| [P78 equation and provenance record](docs/p78_equation_provenance.md) | Multi-affine box enclosures, global branch-and-bound lower bounds, mesh-gap certification, and P77 handoff provenance |'
          p79_evidence = '| [P79 equation and provenance record](docs/p79_equation_provenance.md) | Exact-rational logarithm bounds, dyadic square-root enclosure, and the directionally safe P78/P79 rejection handoff |'
          if p79_evidence not in text:
              text = replace_once(text, p78_evidence, p78_evidence + '\n' + p79_evidence, 'README evidence P79 row')

          text = text.replace('Read the complete P1 to P78 detailed proposition record', 'Read the complete P1 to P79 detailed proposition record')
          text = text.replace('P1 through P78 with explicit dependency branches', 'P1 through P79 with explicit dependency branches')
          text = text.replace('| Public theorem frontier | **P78** |', '| Public theorem frontier | **P79** |')
          text = text.replace('| Documented version | **v0.78.0** |', '| Documented version | **v0.79.0** |')
          text = text.replace('| Proposition-level results | **78** |', '| Proposition-level results | **79** |')
          text = text.replace('| Equation-driven quantitative figures | **66** |', '| Equation-driven quantitative figures | **67** |')
          p78_status = '| Continuous-family full-law optimization certificate | **P78 proved for the P75 four-view binary latent family using exact-rational multi-affine box lower bounds and an explicit mesh-gap guarantee** |'
          p79_status = '| One-sided sampling-radius numerical certificate | **P79 proved with exact-rational logarithm bracketing and integer-certified dyadic square-root enclosure for the P77 radius** |'
          if p79_status not in text and p78_status in text:
              text = text.replace(p78_status, p78_status + '\n' + p79_status, 1)

          # Add a concise P79 statement to the formal abstract just before the next top-level section.
          if 'P79 adds a one-sided exact-rational numerical certificate' not in text:
              abstract_marker = '\n# Scientific status discipline'
              if abstract_marker in text:
                  text = text.replace(
                      abstract_marker,
                      '\nP79 adds a one-sided exact-rational numerical certificate for the P77 sampling radius. Rational logarithm brackets and integer-certified dyadic square-root enclosures produce a mathematically valid upper bound that can be compared strictly with the P78 certified model-distance lower bound without relying on decimal-rounding direction.\n\n' + abstract_marker,
                      1,
                  )
          write(path, text)

          # ------------------------------------------------------------------
          # Theorem roadmap: P79 becomes an explicit dependency node and index.
          # ------------------------------------------------------------------
          path = 'docs/theorem_roadmap.md'
          text = read(path)
          text = text.replace('frontier is **P78**', 'frontier is **P79**')
          text = text.replace('**P1 through P78 with explicit dependency branches**', '**P1 through P79 with explicit dependency branches**')
          text = text.replace('P71-P78 return', 'P71-P79 return')
          dep_old = '&\\text{P78: continuous P75 model distance must be lower-bounded globally and certifiably}'
          dep_new = dep_old + '\\\\\n&\\Downarrow\\\\\n&\\text{P79: the P77 sampling radius must be upper-bounded with certified numerical direction}'
          if 'P79: the P77 sampling radius must be upper-bounded' not in text:
              text = replace_once(text, dep_old, dep_new, 'roadmap dependency P79')
          text = text.replace(
              'The proposition number records development order. It does not imply that P78 depends on P70. P78 depends scientifically on P77 and the P75 continuous target-model family, which descend from P19 and the P71-P76 target-side lineage.',
              'The proposition number records development order. It does not imply that P79 depends on P70. P78 depends scientifically on P77 and the P75 continuous target-model family; P79 then certifies the numerical upper side of the P77 sampling-radius comparison. Both descend from P19 and the P71-P77 target-side lineage.'
          )

          p79_roadmap = r'''
### P79: certified rational sampling-radius envelope

P77 supplies the analytic finite-alphabet sampling radius, while P78 supplies a certified lower bound on distance to the continuous P75 model family. P79 makes the remaining comparison numerically one-sided rather than relying on the sign of floating-point rounding.

For

\[
\varepsilon_{n,K}(\alpha)
=
\sqrt{\frac{\log(2K/\alpha)}{2n}},
\]

P79 constructs exact rational values \(\underline\varepsilon\) and \(\overline\varepsilon\) satisfying

\[
\boxed{\underline\varepsilon\le\varepsilon_{n,K}(\alpha)\le\overline\varepsilon.}
\]

The logarithm is enclosed by a positive atanh expansion with an explicit rational tail bound after exact power-of-two argument reduction. The square root is enclosed by integer comparisons on a dyadic denominator. Consequently, if the P78 certified model-distance lower bound \(L_{\mathrm{model}}\) satisfies

\[
\boxed{L_{\mathrm{model}}>\overline\varepsilon,}
\]

then the strict P77 rejection condition is certified without a decimal-rounding assumption. Failure of this strict inequality is inconclusive, not model acceptance.

![P79 certified rational sampling-radius envelope](figures/p79_certified_sampling_radius.svg)

Direct proof: [P79](proposition_79_certified_sampling_radius.md). Provenance: [P79 equation record](p79_equation_provenance.md). Implementation: [`certified_sampling_radius.py`](../src/consciousness_bridge/certified_sampling_radius.py). Tests: [`test_certified_sampling_radius.py`](../tests/test_certified_sampling_radius.py).

'''
          if '### P79: certified rational sampling-radius envelope' not in text:
              text = insert_before(text, '\n## 3. Complete proposition index', '\n' + p79_roadmap, 'roadmap P79 section')
          p78_row = '| [P78](proposition_78_certified_continuous_model_separation.md) | multi-affine box lower bounds and mesh-gap convergence | certified continuous P75 full-law model separation | proved conditional computational theorem |'
          p79_row = '| [P79](proposition_79_certified_sampling_radius.md) | exact-rational logarithm and dyadic square-root enclosure | certified upper bound for the P77 sampling radius and strict P78/P79 rejection handoff | proved numerical-certification theorem |'
          if p79_row not in text:
              text = replace_once(text, p78_row, p78_row + '\n' + p79_row, 'roadmap P79 index row')
          text = text.replace('## 5. Current open frontier\n\nAfter P78, the target side has eight explicit requirements:', '## 5. Current open frontier\n\nAfter P79, the target side has nine explicit requirements:')
          if '9. the analytic sampling radius must be converted' not in text:
              text = text.replace(
                  '8. when the declared family is continuous, the required separation distance must be lower-bounded globally rather than inferred from a local best fit.',
                  '8. when the declared family is continuous, the required separation distance must be lower-bounded globally rather than inferred from a local best fit;\n9. the analytic sampling radius must be converted into a directionally valid numerical upper certificate before a strict rejection comparison is claimed.'
              )
          text = text.replace(
              'P78 closes the eighth item for the specific P75 four-view binary latent family in L-infinity distance. It supplies an exact-rational multi-affine box certificate and an explicit mesh-gap guarantee. The remaining computational problem is efficiency: stronger pruning, tighter relaxations, or moment-SOS lower bounds may reduce the number of boxes required for a decisive certificate. The remaining statistical problems include sharper power and target-view models that allow residual dependence, shared bias, temporal drift, or learned measurement pipelines.',
              'P78 closes the eighth item for the specific P75 four-view binary latent family in L-infinity distance. P79 closes the ninth numerical-direction item by producing an exact-rational upper envelope for the P77 sampling radius. Together they make the rejection handoff lower-bound versus upper-bound explicit. The remaining computational problem is efficiency: stronger pruning, tighter relaxations, or moment-SOS lower bounds may reduce the number of boxes required for a decisive certificate. The remaining statistical problems include sharper power and target-view models that allow residual dependence, shared bias, temporal drift, or learned measurement pipelines.'
          )
          write(path, text)

          # ------------------------------------------------------------------
          # Research navigation: no reader should have to guess where P79 lives.
          # ------------------------------------------------------------------
          path = 'docs/research_navigation.md'
          text = read(path)
          text = text.replace('frontier is **P78**', 'frontier is **P79**')
          text = text.replace('**P1 through P78**', '**P1 through P79**')
          text = text.replace('P71-P78 form', 'P71-P79 form')
          text = text.replace('from P1 through P78.', 'from P1 through P79.')

          lines = text.splitlines()
          start = next((i for i, line in enumerate(lines) if line == '## Recommended reading order'), None)
          end = next((i for i, line in enumerate(lines) if line == '## Scientific branch map'), None)
          if start is None or end is None:
              raise RuntimeError('research navigation reading-order block not found')
          block = lines[start + 1:end]
          if not any('P79 certified rational sampling-radius envelope' in line for line in block):
              new_block = []
              inserted = False
              items = []
              for line in block:
                  m = re.match(r'^(\d+)\. (.*)$', line)
                  if m:
                      items.append(m.group(2))
                  else:
                      new_block.append(line)
              # Rebuild only the list while preserving the leading blank line.
              rebuilt = ['']
              for item in items:
                  rebuilt.append(f'{len(rebuilt)}. {item}')
                  if item.startswith('[P78 certified continuous P75 model separation]'):
                      rebuilt.append(
                          f'{len(rebuilt)}. [P79 certified rational sampling-radius envelope](proposition_79_certified_sampling_radius.md) for exact-rational logarithm and square-root enclosures, a one-sided P77 sampling-radius upper certificate, and the strict P78/P79 rejection handoff.'
                      )
                      inserted = True
              if not inserted:
                  raise RuntimeError('P78 reading-order item not found')
              lines = lines[:start + 1] + rebuilt + lines[end:]
              text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          p78_branch = '| Certified continuous target-model separation | P78 | Supplies exact-rational global lower bounds for distance to the continuous P75 model family and a convergent mesh certificate | [P78](proposition_78_certified_continuous_model_separation.md) |'
          p79_branch = '| Certified sampling-radius evaluation | P79 | Converts the analytic P77 radius into an exact-rational one-sided upper certificate and supplies the strict P78/P79 comparison used for full-law rejection | [P79](proposition_79_certified_sampling_radius.md) |'
          if p79_branch not in text:
              text = replace_once(text, p78_branch, p78_branch + '\n' + p79_branch, 'navigation P79 branch row')

          # Add P79 to the complete proposition index while preserving the plain P79 first cell expected by the integration guard.
          p78_idx_match = re.search(r'^\| P78 \|.*$', text, flags=re.MULTILINE)
          if '| P79 |' not in text:
              if not p78_idx_match:
                  raise RuntimeError('navigation P78 proposition row not found')
              p79_idx = '| P79 | [Certified rational sampling-radius envelope](proposition_79_certified_sampling_radius.md) | exact-rational upper certification of the P77 sampling radius and strict P78/P79 rejection handoff |'
              text = text[:p78_idx_match.end()] + '\n' + p79_idx + text[p78_idx_match.end():]
          write(path, text)

          # ------------------------------------------------------------------
          # Detailed record and equation/citation map.
          # ------------------------------------------------------------------
          path = 'docs/detailed_proposition_record.md'
          text = read(path)
          if '**P79** closes the numerical-direction gap' not in text:
              text += r'''

---

## P79 — Certified rational sampling-radius envelope

**P79** closes the numerical-direction gap between the P77 finite-sample confidence theorem and the P78 certified continuous-family distance lower bound. The proposition constructs a mathematically valid rational upper bound for the P77 sampling radius by combining exact power-of-two argument reduction, a positive logarithm series with an explicit rational remainder, and integer-certified dyadic square-root enclosure.

The scientific role is deliberately narrow. P78 lower-bounds empirical distance to the declared continuous P75 model family; P79 upper-bounds finite-sample uncertainty. Only a strict lower-bound-greater-than-upper-bound comparison certifies the P77 rejection condition.

- [Direct proof](proposition_79_certified_sampling_radius.md)
- [Equation and provenance record](p79_equation_provenance.md)
- [Theorem figure](figures/p79_certified_sampling_radius.svg)
- [Implementation](../src/consciousness_bridge/certified_sampling_radius.py)
- [Regression tests](../tests/test_certified_sampling_radius.py)

P79 does not validate the P75 model when rejection fails, does not assign experiential meaning to a latent class, and does not close the physical-to-experiential bridge.
'''
          write(path, text)

          path = 'docs/equation_and_citation_map.md'
          text = read(path)
          if '# P79 certified rational sampling-radius envelope' not in text:
              text += r'''

---

# P79 certified rational sampling-radius envelope

P79 is the numerical-certification layer connecting the P77 finite-alphabet confidence theorem to the P78 continuous-model distance certificate.

| Object | Classification | Reader path |
| --- | --- | --- |
| P77 radius \(\sqrt{\log(2K/\alpha)/(2n)}\) | standard concentration quantity inherited from P77 | [P77 proof](proposition_77_full_law_model_set_separation.md) |
| Power-of-two logarithm reduction | standard elementary identity | [P79 provenance](p79_equation_provenance.md) |
| Positive atanh logarithm expansion | standard convergent series | [P79 provenance](p79_equation_provenance.md) |
| Explicit rational logarithm tail | elementary bound specialized for one-sided certification | [P79 proof](proposition_79_certified_sampling_radius.md) |
| Dyadic square-root floor/ceiling enclosure | integer-arithmetic certification construction | [P79 implementation](../src/consciousness_bridge/certified_sampling_radius.py) |
| Strict P78 lower-bound / P79 upper-bound gate | repository-specific assembly of P77, P78, and P79 | [P79 proof](proposition_79_certified_sampling_radius.md) |

The source-level implementation and theorem-level proof preserve the direction of every inequality. This numerical layer closes no experiential premise; the physical-to-experiential bridge remains open.
'''
          write(path, text)

          # ------------------------------------------------------------------
          # Release/citation metadata.
          # ------------------------------------------------------------------
          path = 'CITATION.cff'
          text = read(path)
          text = text.replace('version: 0.78.0', 'version: 0.79.0')
          text = text.replace('date-released: 2026-09-10', 'date-released: 2026-09-11')
          text = text.replace('Current documented theorem frontier: P78', 'Current documented theorem frontier: P79')
          text = text.replace('Version 0.78.0.', 'Version 0.79.0.')
          if 'Proposition 79 adds exact-rational one-sided certification' not in text:
              anchor = 'P78 preserves the P77 requirement that only a valid lower bound, not an ordinary best-fit upper bound, can certify full-law separation.'
              addition = (' Proposition 79 adds exact-rational one-sided certification of the P77 sampling radius using rational logarithm bounds and integer-certified dyadic square-root enclosure, so the strict P78/P79 rejection handoff compares a certified model-distance lower bound with a certified sampling-uncertainty upper bound.')
              text = replace_once(text, anchor, anchor + addition, 'CFF P79 abstract')
          write(path, text)

          path = 'CITATION.bib'
          text = read(path)
          text = text.replace('version      = {0.78.0}', 'version      = {0.79.0}')
          text = text.replace('Current documented theorem frontier: P78.', 'Current documented theorem frontier: P79.')
          write(path, text)

          path = 'CITATION.md'
          text = read(path)
          if '## Proposition 79' not in text:
              text += '''\n\n## Proposition 79 — Certified Rational Sampling-Radius Envelope\n\nFor work using the one-sided exact-rational certification of the P77 sampling radius, cite the repository and identify **Proposition 79** explicitly.\n\nReader paths: [proof](docs/proposition_79_certified_sampling_radius.md), [equation/provenance record](docs/p79_equation_provenance.md), [figure](docs/figures/p79_certified_sampling_radius.svg), [implementation](src/consciousness_bridge/certified_sampling_radius.py), and [tests](tests/test_certified_sampling_radius.py).\n'''
          write(path, text)

          path = 'CHANGELOG.md'
          text = read(path)
          if not text.startswith('# 0.79.0 - 2026-09-11'):
              text = '''# 0.79.0 - 2026-09-11\n\n- Added Proposition 79, the certified rational sampling-radius envelope for the P77/P78 full-law rejection handoff.\n- Added exact-rational logarithm bracketing, integer-certified dyadic square-root enclosure, implementation, tests, and an accessible theorem figure.\n- Integrated P79 across the main research narrative, theorem roadmap, navigation, detailed proposition record, equation/citation map, website, visual atlas, and citation metadata.\n- Corrected the theorem-roadmap SVG canvas so the P31 card and open-frontier banner remain fully contained.\n- Strengthened reader navigation so reader-facing Markdown tables provide clickable routes to proof, source, or local context.\n\n''' + text
          write(path, text)

          # ------------------------------------------------------------------
          # Website overview.
          # ------------------------------------------------------------------
          path = 'website/index.html'
          text = read(path)
          text = text.replace('<strong>78</strong><span>proposition-level results</span>', '<strong>79</strong><span>proposition-level results</span>')
          text = text.replace('<strong>v0.78.0</strong><span>current documented version</span>', '<strong>v0.79.0</strong><span>current documented version</span>')
          text = text.replace('See all 78 results grouped by scientific role', 'See all 79 results grouped by scientific role')
          text = text.replace('P71-P78 strengthen the target side of the bridge test', 'P71-P79 strengthen the target side of the bridge test')
          text = text.replace(
              'P77 asks whether the complete finite-sample confidence region is separated from the complete declared model family, while requiring certified global evidence rather than an ordinary best-fit value.',
              'P77 asks whether the complete finite-sample confidence region is separated from the complete declared model family. P78 supplies a certified global lower bound on distance to the continuous P75 family, and P79 supplies a directionally safe exact-rational upper bound on the P77 sampling radius.'
          )
          bridge_node = '<div class="flow-node"><span>10</span><h3>Bridge test</h3><p>Test whether independently justified target distinctions are determined by the declared physical information.</p></div>'
          if '<h3>Certified separation</h3>' not in text:
              text = replace_once(
                  text,
                  bridge_node,
                  '<div class="flow-node"><span>10</span><h3>Certified separation</h3><p>P78 lower-bounds continuous model distance globally; P79 upper-bounds the P77 sampling radius with exact-rational numerical direction.</p></div>\n        <div class="flow-node"><span>11</span><h3>Bridge test</h3><p>Test whether independently justified target distinctions are determined by the declared physical information.</p></div>',
                  'website certified-separation flow node'
              )
          p77_article = '<article class="result"><span>P77</span><h3>Full-law model-set separation</h3><p>The complete empirical-law confidence region is tested against the complete declared model family. Rejection requires certified separation; a local best-fit value alone is not enough.</p></article>'
          if '<span>P78</span><h3>Certified continuous model separation</h3>' not in text:
              extra = p77_article + '\n        <article class="result"><span>P78</span><h3>Certified continuous model separation</h3><p>Exact-rational multi-affine box refinement gives a global lower bound on distance from the empirical law to the entire continuous P75 model family.</p></article>\n        <article class="result"><span>P79</span><h3>Certified sampling-radius envelope</h3><p>Rational logarithm bounds and integer-certified dyadic square-root enclosure give a one-sided upper certificate for P77 sampling uncertainty.</p></article>'
              text = replace_once(text, p77_article, extra, 'website P78/P79 result cards')

          if 'p79_certified_sampling_radius.svg' not in text:
              cards = '''\n\n      <div class="figure-card"><img src="https://raw.githubusercontent.com/MahsaKeikha/mathematical-consciousness-bridge/main/docs/figures/p78_certified_continuous_model_separation.svg" alt="P78 certified continuous model separation"/><div><h3>P78 certified global model-distance lower bound</h3><p>The complete continuous P75 parameter cube is covered by exact-rational multi-affine box enclosures. The resulting minimum box bound is a mathematically valid lower bound on model distance.</p><a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/proposition_78_certified_continuous_model_separation.md">Read Proposition 78 →</a></div></div>\n\n      <div class="figure-card"><img src="https://raw.githubusercontent.com/MahsaKeikha/mathematical-consciousness-bridge/main/docs/figures/p79_certified_sampling_radius.svg" alt="P79 certified rational sampling-radius envelope"/><div><h3>P79 one-sided sampling-radius certificate</h3><p>The P77 sampling radius is enclosed with rational logarithm bounds and integer-certified dyadic square-root bounds. Full-law rejection uses a strict P78 lower-bound versus P79 upper-bound comparison.</p><a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/proposition_79_certified_sampling_radius.md">Read Proposition 79 →</a> · <a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/p79_equation_provenance.md">Open provenance →</a></div></div>\n'''
              text = insert_before(text, '    <section id="falsification"', cards, 'website P79 figure card')
          write(path, text)

          # ------------------------------------------------------------------
          # Website research map.
          # ------------------------------------------------------------------
          path = 'website/research-map.html'
          text = read(path)
          text = text.replace('through Proposition 76.', 'through Proposition 79.')
          text = text.replace('Seventy-six results, one dependency-aware scientific program', 'Seventy-nine results, one dependency-aware scientific program')
          text = text.replace('<strong>76</strong><span>proposition-level results</span>', '<strong>79</strong><span>proposition-level results</span>')
          text = text.replace('6 · P73-P76', '6 · P73-P79')
          text = text.replace('then ask whether finite data are strong enough to reject a tracked violation.', 'then ask whether finite data are strong enough to reject a tracked violation, whether the complete model family is globally separated, and whether the final sampling-radius comparison is numerically one-sided.')
          text = text.replace('None of P71-P78 is a consciousness ontology.', 'None of P71-P79 is a consciousness ontology.')
          if 'P79: Certified rational sampling-radius envelope' not in text:
              p79_html = '''\n<section><div class="section-head"><p class="eyebrow">IV-I · Certified numerical rejection handoff</p><h2>P79: Certified rational sampling-radius envelope</h2><p>P77 defines the finite-sample radius and P78 lower-bounds distance to the continuous P75 model family. P79 supplies the complementary exact-rational upper certificate for sampling uncertainty, preserving the direction needed for a formal rejection.</p></div><div class="result-grid"><article class="result"><span>P79A</span><h3>Rational logarithm enclosure</h3><p>Exact power-of-two reduction and a positive atanh series with an explicit tail produce lower and upper rational bounds on the logarithm.</p></article><article class="result"><span>P79B</span><h3>Integer-certified square root</h3><p>Dyadic floor and ceiling bounds are certified by integer comparisons rather than decimal rounding.</p></article><article class="result"><span>P79C</span><h3>Strict P78/P79 gate</h3><p>A P77 rejection is certified only when the P78 model-distance lower bound is strictly larger than the P79 sampling-radius upper bound. Otherwise the result remains inconclusive.</p></article></div><div class="figure-card"><img src="https://raw.githubusercontent.com/MahsaKeikha/mathematical-consciousness-bridge/main/docs/figures/p79_certified_sampling_radius.svg" alt="P79 certified rational sampling-radius envelope"/><div><h3>P79 certified numerical handoff</h3><p>The figure makes the lower-bound and upper-bound directions visible and auditable.</p><a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/proposition_79_certified_sampling_radius.md">Read Proposition 79 →</a> · <a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/p79_equation_provenance.md">Equation provenance →</a></div></div></section>\n\n'''
              text = insert_before(text, '<section><div class="section-head"><p class="eyebrow">V · Operational scale consistency</p>', p79_html, 'research-map P79 section')
          write(path, text)

          # ------------------------------------------------------------------
          # Visual atlas: add the new theorem figure as a permanent entry point.
          # ------------------------------------------------------------------
          path = 'website/visual-atlas.html'
          text = read(path)
          if 'p79_certified_sampling_radius.svg' not in text:
              p79_card = '''\n\n    <section class="figure-card">\n      <img src="https://raw.githubusercontent.com/MahsaKeikha/mathematical-consciousness-bridge/main/docs/figures/p79_certified_sampling_radius.svg" alt="P79 certified rational sampling-radius envelope" />\n      <div>\n        <p class="eyebrow">P79</p>\n        <h2>Certified Rational Sampling-Radius Envelope</h2>\n        <p>The figure exposes the one-sided numerical logic of the final P77/P78 rejection handoff: P78 supplies the model-distance lower bound, P79 supplies the sampling-radius upper bound, and only a strict lower-greater-than-upper comparison certifies rejection.</p>\n        <a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/proposition_79_certified_sampling_radius.md">Open the P79 proof</a> · <a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/p79_equation_provenance.md">Open provenance</a>\n      </div>\n    </section>\n'''
              text = insert_before(text, '\n</main>', p79_card, 'visual atlas P79 card')
          write(path, text)

          # ------------------------------------------------------------------
          # Reader-facing Markdown tables: every data row gets a clickable path.
          # Existing proof/source links are preserved; unlinked rows receive a
          # compact Details cell pointing to the most specific proposition or
          # the surrounding section.
          # ------------------------------------------------------------------
          def heading_slug(heading: str) -> str:
              value = heading.strip().lower()
              value = re.sub(r'[`*_~]', '', value)
              value = re.sub(r'[^\w\s-]', '', value)
              value = re.sub(r'\s+', '-', value)
              value = re.sub(r'-+', '-', value)
              return value.strip('-') or 'top'

          prop_files = {}
          for p in (ROOT / 'docs').glob('proposition_*_*.md'):
              m = re.match(r'proposition_(\d+)_', p.name)
              if m:
                  prop_files[int(m.group(1))] = p.name

          def link_for_row(row: str, md_path: Path, heading: str) -> str:
              m = re.search(r'\bP(\d{1,2})\b', row)
              if m:
                  number = int(m.group(1))
                  name = prop_files.get(number)
                  if name:
                      if md_path.name == 'README.md' or md_path.parent == ROOT:
                          target = f'docs/{name}'
                      else:
                          target = name
                      return f'[proof]({target})'
              return f'[section](#{heading_slug(heading)})'

          def enhance_tables(md_path: Path) -> None:
              source = md_path.read_text(encoding='utf-8')
              lines = source.splitlines()
              out = []
              i = 0
              current_heading = 'top'
              in_fence = False
              while i < len(lines):
                  line = lines[i]
                  if line.lstrip().startswith('```'):
                      in_fence = not in_fence
                  if not in_fence and re.match(r'^#{1,6}\s+', line):
                      current_heading = re.sub(r'^#{1,6}\s+', '', line).strip()
                  is_header = (
                      not in_fence
                      and line.lstrip().startswith('|')
                      and i + 1 < len(lines)
                      and re.match(r'^\s*\|?\s*:?-{3,}', lines[i + 1])
                  )
                  if not is_header:
                      out.append(line)
                      i += 1
                      continue

                  table = [line, lines[i + 1]]
                  j = i + 2
                  while j < len(lines) and lines[j].lstrip().startswith('|'):
                      table.append(lines[j])
                      j += 1
                  data = table[2:]
                  needs_details = any('](' not in row and 'href=' not in row for row in data if row.strip('| ').strip())
                  if needs_details:
                      def add_cell(row: str, cell: str) -> str:
                          stripped = row.rstrip()
                          if stripped.endswith('|'):
                              return stripped + f' {cell} |'
                          return stripped + f' | {cell} |'
                      table[0] = add_cell(table[0], 'Details')
                      table[1] = add_cell(table[1], '---')
                      for idx in range(2, len(table)):
                          row = table[idx]
                          if '](' in row or 'href=' in row:
                              table[idx] = add_cell(row, '—')
                          elif row.strip('| ').strip():
                              table[idx] = add_cell(row, link_for_row(row, md_path, current_heading))
                  out.extend(table)
                  i = j
              rendered = '\n'.join(out) + ('\n' if source.endswith('\n') else '')
              md_path.write_text(rendered, encoding='utf-8')

          markdown_files = [ROOT / 'README.md', ROOT / 'CITATION.md'] + sorted((ROOT / 'docs').glob('*.md'))
          for md_path in markdown_files:
              enhance_tables(md_path)

          # Permanent regression test: geometry containment + clickable table rows.
          test_path = ROOT / 'tests' / 'test_reader_navigation_links.py'
          test_path.write_text('''from pathlib import Path\nimport re\nimport xml.etree.ElementTree as ET\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef _markdown_tables(path: Path):\n    lines = path.read_text(encoding="utf-8").splitlines()\n    in_fence = False\n    i = 0\n    while i + 1 < len(lines):\n        line = lines[i]\n        if line.lstrip().startswith("```"):\n            in_fence = not in_fence\n            i += 1\n            continue\n        if (\n            not in_fence\n            and line.lstrip().startswith("|")\n            and re.match(r"^\\s*\\|?\\s*:?-{3,}", lines[i + 1])\n        ):\n            rows = []\n            j = i + 2\n            while j < len(lines) and lines[j].lstrip().startswith("|"):\n                if lines[j].strip("| ").strip():\n                    rows.append(lines[j])\n                j += 1\n            yield rows\n            i = j\n        else:\n            i += 1\n\n\ndef test_reader_facing_markdown_table_rows_are_clickable() -> None:\n    paths = [ROOT / "README.md", ROOT / "CITATION.md"] + sorted((ROOT / "docs").glob("*.md"))\n    failures = []\n    for path in paths:\n        for rows in _markdown_tables(path):\n            for row in rows:\n                if "](" not in row and "href=" not in row:\n                    failures.append(f"{path.relative_to(ROOT)}: {row}")\n    assert not failures, "Unlinked reader-facing table rows:\\n" + "\\n".join(failures[:40])\n\n\ndef test_theorem_roadmap_canvas_contains_every_rectangle() -> None:\n    path = ROOT / "docs" / "figures" / "theorem_roadmap.svg"\n    root = ET.parse(path).getroot()\n    view_box = [float(x) for x in root.attrib["viewBox"].split()]\n    _, _, width, height = view_box\n    ns = "{http://www.w3.org/2000/svg}"\n    for rect in root.findall(f".//{ns}rect"):\n        x = float(rect.attrib.get("x", 0))\n        y = float(rect.attrib.get("y", 0))\n        w = float(rect.attrib.get("width", 0))\n        h = float(rect.attrib.get("height", 0))\n        assert 0 <= x <= width\n        assert 0 <= y <= height\n        assert x + w <= width + 1e-9, rect.attrib\n        assert y + h <= height + 1e-9, rect.attrib\n\n\ndef test_p79_reader_paths_are_present() -> None:\n    readme = (ROOT / "README.md").read_text(encoding="utf-8")\n    roadmap = (ROOT / "docs" / "theorem_roadmap.md").read_text(encoding="utf-8")\n    navigation = (ROOT / "docs" / "research_navigation.md").read_text(encoding="utf-8")\n    assert "docs/proposition_79_certified_sampling_radius.md" in readme\n    assert "p79_equation_provenance.md" in readme\n    assert "[P79](proposition_79_certified_sampling_radius.md)" in roadmap\n    assert "| P79 | [Certified rational sampling-radius envelope]" in navigation\n''', encoding='utf-8')
