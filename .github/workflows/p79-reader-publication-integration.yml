name: P79 reader publication integration

on:
  push:
    branches: ["p79-certified-sampling-radius"]
    paths:
      - ".github/workflows/p79-reader-publication-integration.yml"
      - "scripts/integrate_p79_publication.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p79-certified-sampling-radius
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply P79 publication integration
        run: python scripts/integrate_p79_publication.py
      - name: Align final publication regression guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace(
              "**Figure 14. P79 one-sided numerical certification.**",
              "**P79 theorem figure. One-sided numerical certification.**",
          )
          readme.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_website_research_orientation.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = test_text.replace(
              'hero = text.index("Seventy-six results, one dependency-aware scientific program")',
              'hero = text.index("Seventy-nine results, one dependency-aware scientific program")',
          )
          test_path.write_text(test_text, encoding="utf-8")
          PY
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply safe lint fixes
        run: ruff check . --fix
      - name: Run complete test suite
        run: pytest -q
      - name: Verify lint
        run: ruff check .
      - name: Commit integrated publication record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Integrate P79 across public research surfaces"
            git push origin HEAD:p79-certified-sampling-radius
          fi
