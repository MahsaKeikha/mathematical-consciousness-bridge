name: One Shot Atlas Contract Sync

on:
  push:
    branches:
      - visual-atlas-frontier-hierarchy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: visual-atlas-frontier-hierarchy
          fetch-depth: 0

      - name: Synchronize predecessor terminology
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('tests/test_figure_publication_sync.py'),
              Path('scripts/sync_figure_publication.py'),
          ]
          old = 'Previous theorem frontier · P{previous}'
          new = 'Immediate predecessor · P{previous}'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one stale predecessor marker, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run focused publication contracts
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_figure_publication_sync.py tests/test_visual_atlas_frontier_hierarchy.py
          python scripts/sync_figure_publication.py --check
          git diff --check

      - name: Commit synchronized contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_figure_publication_sync.py scripts/sync_figure_publication.py
          git commit -m "Align figure publication with Atlas hierarchy"
          git push origin HEAD:visual-atlas-frontier-hierarchy
