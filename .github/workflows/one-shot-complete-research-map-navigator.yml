name: One Shot Complete Research Map Navigator

on:
  push:
    branches:
      - complete-p1-p100-research-map-navigator
    paths:
      - .github/workflows/one-shot-complete-research-map-navigator.yml
      - scripts/one_shot_complete_research_map_navigator.py

permissions:
  contents: write

jobs:
  build-navigator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out navigator branch
        uses: actions/checkout@v4
        with:
          ref: complete-p1-p100-research-map-navigator

      - name: Generate static P1-P100 navigator
        run: python scripts/one_shot_complete_research_map_navigator.py

      - name: Verify generated navigator contract
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('.')
          page = (root / 'website' / 'research-map.html').read_text(encoding='utf-8')
          roadmap = (root / 'docs' / 'theorem_roadmap.md').read_text(encoding='utf-8')
          styles = (root / 'website' / 'styles.css').read_text(encoding='utf-8')

          cards = re.findall(
              r'<a class="proposition-nav-card" data-proposition="P(\d+)" href="([^"]+)">',
              page,
          )
          assert [int(number) for number, _ in cards] == list(range(1, 101))
          assert len(cards) == 100
          assert page.count('class="proposition-nav-card"') == 100
          assert 'id="complete-proposition-navigator"' in page
          assert page.index('id="program-stages"') < page.index('id="complete-proposition-navigator"')
          assert page.index('id="complete-proposition-navigator"') < page.index('id="bridge-lineage"')

          block = roadmap.split('## 3. Complete proposition index', 1)[1].split(
              '## 4. Calibration branch remains separate', 1
          )[0]
          canonical = re.findall(r'^\| \[P(\d+)\]\(([^)]+)\)', block, flags=re.MULTILINE)
          assert [int(number) for number, _ in canonical] == list(range(1, 101))
          expected = {
              number: (
                  'https://github.com/MahsaKeikha/mathematical-consciousness-bridge/'
                  f'blob/main/docs/{href}'
              )
              for number, href in canonical
          }
          assert dict(cards) == expected
          assert '.proposition-nav-grid' in styles
          assert '.proposition-nav-card' in styles

          navigator = page.split('<!-- BEGIN COMPLETE PROPOSITION NAVIGATOR -->', 1)[1].split(
              '<!-- END COMPLETE PROPOSITION NAVIGATOR -->', 1
          )[0]
          assert '–' not in navigator
          assert '—' not in navigator
          PY

      - name: Verify clean diff formatting
        run: git diff --check

      - name: Commit complete Research Map navigator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/research-map.html website/styles.css tests/test_complete_research_map_proposition_navigator.py
          if git diff --cached --quiet; then
            echo "No navigator changes to commit"
            exit 0
          fi
          git commit -m "Add complete P1-P100 Research Map navigator"
          git push origin HEAD:complete-p1-p100-research-map-navigator
