name: repair-p86-publication-contract

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/repair-p86-publication-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Repair publication contract sources
        run: |
          python - <<'PY'
          from pathlib import Path

          sync_path = Path("scripts/sync_figure_publication.py")
          sync = sync_path.read_text(encoding="utf-8")
          old = 'f"[equations](../{record[\'provenance\']})" if record["provenance"] else "—"'
          new = 'f"[equations](../{record[\'provenance\']})" if record["provenance"] else "N/A"'
          if sync.count(old) != 1:
              raise SystemExit("expected exactly one Unicode provenance placeholder")
          sync_path.write_text(sync.replace(old, new, 1), encoding="utf-8")

          website_path = Path("scripts/prepare_website.py")
          website = website_path.read_text(encoding="utf-8")
          old_block = '''    frontier_figure = output / "figures" / CURRENT_FRONTIER_FIGURE
    if not frontier_figure.is_file():
        raise RuntimeError(
            "website build is missing the current P86 theorem figure: "
            f"{frontier_figure}"
        )

    visual_atlas = (output / "visual-atlas.html").read_text(encoding="utf-8")
    local_frontier_src = f'src="figures/{CURRENT_FRONTIER_FIGURE}"'
    if local_frontier_src not in visual_atlas:
        raise RuntimeError("Visual Atlas does not use the bundled P86 theorem figure")
    if f'src="{RAW_FIGURE_PREFIX}' in visual_atlas:
        raise RuntimeError("Visual Atlas still depends on raw GitHub main for figures")
'''
          new_block = '''    visual_atlas_path = output / "visual-atlas.html"
    if visual_atlas_path.is_file():
        frontier_figure = output / "figures" / CURRENT_FRONTIER_FIGURE
        if not frontier_figure.is_file():
            raise RuntimeError(
                "website build is missing the current P86 theorem figure: "
                f"{frontier_figure}"
            )

        visual_atlas = visual_atlas_path.read_text(encoding="utf-8")
        local_frontier_src = f'src="figures/{CURRENT_FRONTIER_FIGURE}"'
        if local_frontier_src not in visual_atlas:
            raise RuntimeError("Visual Atlas does not use the bundled P86 theorem figure")
        if f'src="{RAW_FIGURE_PREFIX}' in visual_atlas:
            raise RuntimeError("Visual Atlas still depends on raw GitHub main for figures")
'''
          if website.count(old_block) != 1:
              raise SystemExit("could not locate exact-commit website verification block")
          website_path.write_text(website.replace(old_block, new_block, 1), encoding="utf-8")

          test_path = Path("tests/test_reproducibility_contract.py")
          test = test_path.read_text(encoding="utf-8")
          old_test = '''def test_unified_figure_build_reapplies_documentation_metadata() -> None:
    source = _read("scripts/generate_all_figures.py")
    assert "enrich_figure_documentation.py" in source
    assert "_run_generator(ENRICHER)" in source
'''
          new_test = '''def test_unified_figure_build_reapplies_documentation_metadata() -> None:
    source = _read("scripts/generate_all_figures.py")
    assert "enrich_figure_documentation.py" in source
    assert "_run_script(ENRICHER)" in source
    assert "_run_script(PUBLICATION_SYNCER)" in source
    assert '_run_script(PUBLICATION_SYNCER, "--check")' in source
'''
          if test.count(old_test) != 1:
              raise SystemExit("could not locate stale unified figure build contract")
          test_path.write_text(test.replace(old_test, new_test, 1), encoding="utf-8")
          PY
      - name: Regenerate synchronized public figure surfaces
        run: python scripts/sync_figure_publication.py
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run targeted regression contract
        run: |
          python -m pytest -q \
            tests/test_reference_and_prose_style.py \
            tests/test_typography_policy.py \
            tests/test_reproducibility_contract.py \
            tests/test_website_build.py \
            tests/test_figure_publication_sync.py
          python -m ruff check scripts/sync_figure_publication.py scripts/prepare_website.py tests/test_reproducibility_contract.py
          python scripts/sync_figure_publication.py --check
          git diff --check
      - name: Commit guarded repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync_figure_publication.py scripts/prepare_website.py tests/test_reproducibility_contract.py figures/CURRENT_FRONTIER.md
          git commit -m "Repair P86 publication integration contracts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
