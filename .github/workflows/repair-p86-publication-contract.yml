name: repair-p86-publication-contract

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/repair-p86-publication-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Apply deterministic repair
        run: |
          python scripts/repair_p86_publication_contract.py
          python scripts/sync_figure_publication.py
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run targeted regression contract
        run: |
          python -m pytest -q tests/test_reference_and_prose_style.py tests/test_typography_policy.py tests/test_reproducibility_contract.py tests/test_website_build.py tests/test_figure_publication_sync.py
          python -m ruff check scripts/sync_figure_publication.py scripts/prepare_website.py tests/test_reproducibility_contract.py scripts/repair_p86_publication_contract.py
          python scripts/sync_figure_publication.py --check
          git diff --check
      - name: Commit guarded repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync_figure_publication.py scripts/prepare_website.py tests/test_reproducibility_contract.py figures/CURRENT_FRONTIER.md
          git commit -m "Repair P86 publication integration contracts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
