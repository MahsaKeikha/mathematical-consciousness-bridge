name: integrate-p46-once

on:
  push:
    branches:
      - p46-budget-constrained-witness-graph

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out P46 branch
        uses: actions/checkout@v4
        with:
          ref: p46-budget-constrained-witness-graph
          fetch-depth: 0

      - name: Apply guarded P46 publication integration
        run: python .github/integrate_p46_release.py

      - name: Validate on Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test and lint on Python 3.10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test and lint on Python 3.11
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and lint on Python 3.12
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Remove one-time integration scaffolding
        run: |
          rm .github/integrate_p46_release.py
          rm .github/workflows/integrate-p46-once.yml

      - name: Verify repository text discipline
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          forbidden = ("\u2013", "\u2014")
          extensions = {".md", ".py", ".svg", ".bib", ".txt", ".yml", ".yaml", ".toml", ".cff"}
          bad = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix not in extensions:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if any(mark in text for mark in forbidden):
                  bad.append(str(path))
          if bad:
              raise SystemExit('Forbidden dash characters: ' + ', '.join(bad))
          PY

      - name: Commit verified P46 release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md CITATION.cff pyproject.toml \
            docs/theorem_roadmap.md docs/research_navigation.md docs/equation_and_citation_map.md \
            tests/test_release_metadata_consistency.py tests/test_main_page_visual_paper.py \
            .github/integrate_p46_release.py .github/workflows/integrate-p46-once.yml
          git commit -m "Integrate P46 budget-constrained witness graph"
          git push origin HEAD:p46-budget-constrained-witness-graph
