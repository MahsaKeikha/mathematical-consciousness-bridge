name: P80 publication integration

on:
  push:
    branches: ["p80-simplex-coupled-box-certificate"]
    paths:
      - ".github/workflows/p80-publication-integration.yml"
      - "scripts/integrate_p80_publication.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p80-simplex-coupled-box-certificate
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harden the publication migration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/integrate_p80_publication.py")
          text = path.read_text(encoding="utf-8")
          unsafe = 'text = replace(text, "P79", "P80") if "Current documented theorem frontier: P79" in text else text'
          safe = 'text = replace(text, "Current documented theorem frontier: P79", "Current documented theorem frontier: P80")'
          if unsafe not in text:
              raise SystemExit("expected CITATION.md migration guard was not found")
          path.write_text(text.replace(unsafe, safe, 1), encoding="utf-8")
          PY

      - name: Apply P80 publication integration
        run: python scripts/integrate_p80_publication.py

      - name: Correct citation lineage and exact-arithmetic wording
        run: |
          python - <<'PY'
          from pathlib import Path

          citation = Path("CITATION.md")
          text = citation.read_text(encoding="utf-8")

          old_scope = (
              "P79 supplies that missing continuous-family lower-bound mechanism for the specific P75 four-view binary latent model. "
              "It exploits the model's multi-affine nine-parameter map to compute exact rational cell enclosures on parameter boxes, "
              "aggregates those into a global L-infinity lower bound, and proves a mesh-width convergence guarantee. "
              "P79 remains a computational certificate under the declared P75 model; it does not turn non-rejection into model validation "
              "or identify the latent state with consciousness."
          )
          new_scope = (
              "P78 supplies the continuous-family lower-bound mechanism for the specific P75 four-view binary latent model. "
              "It exploits the model's multi-affine nine-parameter map to compute exact rational cell enclosures on parameter boxes, "
              "aggregates those into a global L-infinity lower bound, and proves a mesh-width convergence guarantee.\n\n"
              "P79 certifies the finite-alphabet sampling-radius side of the P77 rejection gate with one-sided exact-rational numerical "
              "enclosures, so the comparison against the model-distance lower bound does not depend on unsafe floating-point rounding direction.\n\n"
              "P80 tightens the P78 parameter-box relaxation by intersecting the exact observed-cell intervals with probability normalization. "
              "The resulting interval-simplex distance is never weaker than the corresponding P78 coordinatewise bound, while it remains a "
              "lower bound on distance to the true continuous P75 box image. None of P78-P80 turns non-rejection into model validation or "
              "identifies the latent state with consciousness."
          )
          if old_scope in text:
              text = text.replace(old_scope, new_scope, 1)

          text = text.replace(
              "[P79 equation and provenance record](docs/p78_equation_provenance.md): multi-affine box enclosures, exact-rational global lower bounds, mesh-gap convergence, and P77 rejection handoff provenance.",
              "[P78 equation and provenance record](docs/p78_equation_provenance.md): multi-affine box enclosures, exact-rational global lower bounds, mesh-gap convergence, and P77 rejection handoff provenance.\n"
              "- [P79 equation and provenance record](docs/p79_equation_provenance.md): one-sided exact-rational sampling-radius certification and safe numerical handoff.\n"
              "- [P80 equation and provenance record](docs/p80_equation_provenance.md): probability-simplex coupling, exact interval-simplex distance, and P80/P78 dominance.",
          )
          text = text.replace(
              "[Detailed proposition record](docs/detailed_proposition_record.md): P1 through P79 chronological theorem record.",
              "[Detailed proposition record](docs/detailed_proposition_record.md): P1 through P80 chronological theorem record.",
          )

          p78_sentence = (
              "Cite [Proposition 78](docs/proposition_78_certified_continuous_model_separation.md) when relying on the exact multi-affine box enclosure for the P75 model, "
              "the certified continuous-family L-infinity lower bound, the mesh-gap convergence guarantee, the exact-rational branch-and-bound implementation, or its strict P77 rejection handoff."
          )
          extra = (
              " Cite [Proposition 79](docs/proposition_79_certified_sampling_radius.md) when relying on exact-rational one-sided certification of the finite-alphabet sampling radius or the rounding-direction-safe rejection comparison."
              " Cite [Proposition 80](docs/proposition_80_simplex_coupled_model_separation.md) when relying on probability-simplex coupling of the P78 cell intervals, the exact interval-simplex L-infinity distance, or the never-weaker P80 box lower bound."
          )
          if p78_sentence in text and "Cite [Proposition 80]" not in text:
              text = text.replace(p78_sentence, p78_sentence + extra, 1)

          citation.write_text(text, encoding="utf-8")

          source = Path("src/consciousness_bridge/simplex_coupled_model_separation.py")
          text = source.read_text(encoding="utf-8")
          text = text.replace(
              "All certification arithmetic uses\n``fractions.Fraction``; no floating optimizer is used.",
              "All certification paths use ``fractions.Fraction`` arithmetic; no floating optimizer is used.",
          )
          source.write_text(text, encoding="utf-8")
          PY

      - name: Verify public research surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          required = {
              "README.md": [
                  "Version 0.80.0",
                  "The theorem frontier is P80.",
                  "## 1.14 P80: simplex-coupled continuous-family lower bound",
                  "docs/figures/p80_simplex_coupled_model_separation.svg",
                  "docs/proposition_80_simplex_coupled_model_separation.md",
                  "docs/p80_equation_provenance.md",
              ],
              "docs/theorem_roadmap.md": [
                  "frontier is **P80**",
                  "### P80: simplex-coupled continuous P75 separation",
                  "[P80](proposition_80_simplex_coupled_model_separation.md)",
              ],
              "docs/research_navigation.md": [
                  "frontier is **P80**",
                  "P80 simplex-coupled continuous P75 separation",
                  "p80_equation_provenance.md",
              ],
              "docs/detailed_proposition_record.md": [
                  "Complete P1 to P80 chronology",
                  "## Proposition 80: Simplex-Coupled Box Certificate",
              ],
              "docs/equation_and_citation_map.md": [
                  "# P80 simplex-coupled continuous-model certificate",
                  "L_{80}(B)",
              ],
              "CITATION.md": [
                  "Version 0.80.0",
                  "theorem frontier **P80**",
                  "Proposition 80",
                  "P78 supplies the continuous-family lower-bound mechanism",
                  "P79 certifies the finite-alphabet sampling-radius side",
              ],
              "CHANGELOG.md": ["# 0.80.0 - 2026-09-11"],
              "website/index.html": ["P80: Simplex-coupled continuous-family certificate"],
              "website/research-map.html": ["P80: Simplex-coupled continuous P75 separation"],
              "website/visual-atlas.html": ["P80", "p80_simplex_coupled_model_separation.svg"],
              "docs/proposition_80_simplex_coupled_model_separation.md": [
                  "r_\\square",
                  "L_{80}(B)=\\max(r_\\square,r_A,r_C)",
                  "physical-to-experiential bridge",
              ],
              "docs/p80_equation_provenance.md": [
                  "r\\ge r_\\square",
                  "P80 dominance",
                  "Scientific scope",
              ],
              "pyproject.toml": ['version = "0.80.0"'],
          }

          failures = []
          for filename, tokens in required.items():
              text = Path(filename).read_text(encoding="utf-8")
              for token in tokens:
                  if token not in text:
                      failures.append(f"{filename}: missing {token!r}")

          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply safe lint fixes
        run: ruff check . --fix

      - name: Run complete test suite
        run: pytest -q

      - name: Verify lint
        run: ruff check .

      - name: Commit integrated P80 publication record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Integrate P80 across public research surfaces"
            git push origin HEAD:p80-simplex-coupled-box-certificate
          fi
