name: p99-plain-language-final-sync

on:
  push:
    branches: ["p99-cross-fitted-evalue-aggregation"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-clean:
    if: ${{ !contains(github.event.head_commit.message, '[p99-plain-language-synced]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p99-cross-fitted-evalue-aggregation
          fetch-depth: 0
      - name: Synchronize Plain Language to P99
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('website/plain-language.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'This is the 98-result Research II theorem program currently reaching P98.': 'This is the 99-result Research II theorem program currently reaching P99.',
              '<h3>A 98-result sufficiency and falsification architecture</h3>': '<h3>A 99-result sufficiency and falsification architecture</h3>',
              'Research II develops exact and finite-data tests for representation, scale, target provenance, model adequacy, and physical-description sufficiency, currently through P98.': 'Research II develops exact and finite-data tests for representation, scale, target provenance, model adequacy, and physical-description sufficiency, currently through P99.',
              'The 98-result proposition program asks whether a declared physical description preserves the distinctions required by an independently specified target, protects the target from circularity, and rejects inadequate measurement models. The current theorem frontier is P98.': 'The 99-result proposition program asks whether a declared physical description preserves the distinctions required by an independently specified target, protects the target from circularity, and rejects inadequate measurement models. The current theorem frontier is P99.',
              'The <a href="research-map.html">Research Map</a> shows how all 93 Research II results connect.': 'The <a href="research-map.html">Research Map</a> shows how all 99 Research II results connect.',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)

          required = (
              'This is the 99-result Research II theorem program currently reaching P99.',
              '<h3>A 99-result sufficiency and falsification architecture</h3>',
              'currently through P99.',
              'The 99-result proposition program asks whether a declared physical description preserves the distinctions required by an independently specified target',
              'The current theorem frontier is P99.',
              'shows how all 99 Research II results connect.',
              '99 results · current frontier P99',
              'id="p99-reader-frontier"',
          )
          for marker in required:
              assert marker in text, marker

          stale = (
              'This is the 98-result Research II theorem program currently reaching P98.',
              '<h3>A 98-result sufficiency and falsification architecture</h3>',
              'The current theorem frontier is P98.',
              'shows how all 93 Research II results connect.',
          )
          for marker in stale:
              assert marker not in text, marker

          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Remove helper and commit
        run: |
          rm .github/workflows/p99-plain-language-final-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/plain-language.html .github/workflows/p99-plain-language-final-sync.yml
          git commit -m "Synchronize P99 Plain Language reader surface [p99-plain-language-synced]"
          git push origin HEAD:p99-cross-fitted-evalue-aggregation
