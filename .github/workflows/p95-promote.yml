name: p95-promote

on:
  push:
    branches: ["p95-drift-aware-stratified-rejection"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p95-promote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote:
    if: ${{ !contains(github.event.head_commit.message || '', '[p95-sync]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p95-drift-aware-stratified-rejection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install repository and figure environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-figures.txt
      - name: Promote canonical P95 sources
        run: |
          python scripts/promote_p95_public_frontier.py
          python scripts/repair_p95_frontier_contracts.py
      - name: Regenerate synchronized visual publication record
        run: python scripts/generate_all_figures.py
      - name: Validate P95 repository state
        run: |
          python scripts/verify_repository.py
          python -m pytest -q tests/test_drift_aware_stratified_sign_coherence.py tests/test_p94_reader_surface_coherence.py tests/test_p95_reader_surface_coherence.py tests/test_frontier_reader_narrative.py tests/test_reader_documentation_consistency.py tests/test_research_website_integrity.py tests/test_figure_publication_sync.py
          python -m ruff check src/consciousness_bridge/drift_aware_stratified_sign_coherence.py tests/test_drift_aware_stratified_sign_coherence.py tests/test_p95_reader_surface_coherence.py scripts/promote_p95_public_frontier.py scripts/repair_p95_frontier_contracts.py
          git diff --check
      - name: Commit synchronized P95 frontier
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "P95 publication state already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote P95 publication frontier [p95-sync]"
          git push origin HEAD:p95-drift-aware-stratified-rejection
