name: finalize-p86-reader-integrity

on:
  push:
    paths:
      - ".github/workflows/finalize-p86-reader-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove duplicate stale P85 frontier and harden regression guards
        run: |
          python - <<'PY'
          from pathlib import Path

          start_path = Path("website/start-here.html")
          start = start_path.read_text(encoding="utf-8")
          stale_section = '''  <section class="theorem-frontier"><div class="section-head"><p class="eyebrow">Current frontier · P85</p><h2>P85 exact three-event shared-parameter certificate</h2><p>P85 asks whether three canonical parity observations can share one P75 parameter assignment when lower-order certificates remain silent. The exact witness gives P84 = 0 and P85 = 1/32.</p></div><p>This is a conditional model-separation theorem and does not claim that consciousness has been derived from physics. The physical-to-experiential bridge remains open.</p><p><a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/proposition_85_exact_triple_projection_parity_functional.md">Read P85</a> · <a href="visual-atlas.html">Visual Atlas</a> · <a href="research-map.html">Research Map</a></p></section>
'''
          if stale_section in start:
              start = start.replace(stale_section, "", 1)
          if "Current frontier · P85" in start:
              raise SystemExit("stale P85 current-frontier block remains in Start Here")
          if start.count("P86 is the current exact frontier.") != 1:
              raise SystemExit("Start Here must expose exactly one P86 current exact frontier statement")
          start_path.write_text(start, encoding="utf-8")

          test_path = Path("tests/test_reader_experience.py")
          test = test_path.read_text(encoding="utf-8")
          tuple_anchor = '        "<strong>85</strong><span>proposition-level results</span>,"\n'
          # Prefer inserting next to the existing stale P85 status marker.
          actual_anchor = '        "<strong>85</strong><span>proposition-level results</span>",\n'
          marker = '        "Current frontier · P85",\n'
          if marker not in test:
              if actual_anchor not in test:
                  raise SystemExit("reader stale-token anchor missing")
              test = test.replace(actual_anchor, marker + actual_anchor, 1)
          current_assert = '    assert "P86 is the current exact frontier." in start\n'
          if '    assert "Current frontier · P85" not in start\n' not in test:
              if current_assert not in test:
                  raise SystemExit("reader P86 current assertion anchor missing")
              test = test.replace(
                  current_assert,
                  current_assert + '    assert "Current frontier · P85" not in start\n',
                  1,
              )
          test_path.write_text(test, encoding="utf-8")

          verifier_path = Path("scripts/verify_repository.py")
          verifier = verifier_path.read_text(encoding="utf-8")
          verifier_anchor = '    "<strong>85</strong><span>proposition-level results</span>",\n'
          verifier_marker = '    "Current frontier · P85",\n'
          if verifier_marker not in verifier:
              if verifier_anchor not in verifier:
                  raise SystemExit("verifier stale-token anchor missing")
              verifier = verifier.replace(verifier_anchor, verifier_marker + verifier_anchor, 1)
          verifier_path.write_text(verifier, encoding="utf-8")
          PY
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run scholarly and reader integrity tests
        run: >-
          python -m pytest
          tests/test_scholarly_provenance_surface.py
          tests/test_reader_experience.py
          tests/test_p84_reader_presentation.py
          tests/test_implementation_reader_path.py
          tests/test_website_build.py
          tests/test_website_link_integrity.py
          tests/test_website_research_orientation.py
      - name: Verify repository contract
        run: python scripts/verify_repository.py
      - name: Check patch formatting
        run: git diff --check
      - name: Commit reader-integrity cleanup
        run: |
          if git diff --quiet -- website/start-here.html tests/test_reader_experience.py scripts/verify_repository.py; then
            echo "No P86 reader-integrity changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/start-here.html tests/test_reader_experience.py scripts/verify_repository.py
          git commit -m "Remove duplicate stale P85 reader frontier"
          git push
