name: fix-p91-p82-link

on:
  push:
    branches:
      - p91-mixed-prevalence-rank-two-flattening
    paths:
      - ".github/workflows/fix-p91-p82-link.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p91-mixed-prevalence-rank-two-flattening
          fetch-depth: 0
      - name: Repair one stale P82 research-map URL
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("website/research-map.html")
          text = path.read_text(encoding="utf-8")
          old = "proposition_82_nested_projection_residual_model_separation.md"
          new = "proposition_82_exact_nested_projection_contrast.md"
          if old not in text:
              raise RuntimeError("stale P82 URL was not found")
          text = text.replace(old, new)
          if old in text or new not in text:
              raise RuntimeError("P82 URL repair failed")
          path.write_text(text, encoding="utf-8")
          PY
          git rm .github/workflows/fix-p91-p82-link.yml
          git diff --check
      - name: Commit repaired map and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/research-map.html
          git commit -m "Repair P82 link in P91 research map"
          git push origin HEAD:p91-mixed-prevalence-rank-two-flattening
