name: p79-publication-patch

on:
  push:
    branches:
      - p79-bounded-target-view-dependence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p79-bounded-target-view-dependence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded P79 navigation cleanup
        run: python scripts/p79_navigation_cleanup.py
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify permanent P79 navigation contract
        run: pytest tests/test_p79_research_integration.py tests/test_readme_research_orientation.py tests/test_document_link_integrity.py
      - name: Commit navigation cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research_navigation.md
          git diff --cached --quiet && { echo "No navigation changes produced"; exit 1; }
          git commit -m "Complete P79 research navigation"
          git push origin HEAD:p79-bounded-target-view-dependence
