name: p77-publication-patch

on:
  push:
    branches:
      - p77-full-law-model-set-separation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p77-full-law-model-set-separation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded P77 publication patch
        run: python scripts/p77_publication_patch.py
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run publication regression subset
        run: >-
          pytest
          tests/test_citation_surface.py
          tests/test_public_reader_navigation_frontier.py
          tests/test_readme_research_orientation.py
          tests/test_main_page_visual_paper.py
          tests/test_research_website_integrity.py
          tests/test_document_link_integrity.py
          tests/test_p75_research_integration.py
          tests/test_p76_research_integration.py
      - name: Lint patch script
        run: ruff check scripts/p77_publication_patch.py
      - name: Commit publication integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CITATION.md CHANGELOG.md docs/theorem_roadmap.md docs/research_navigation.md docs/detailed_proposition_record.md docs/equation_and_citation_map.md website/index.html website/research-map.html website/visual-atlas.html
          git diff --cached --quiet && { echo "No publication changes produced"; exit 1; }
          git commit -m "Integrate P77 across public research surfaces"
          git push origin HEAD:p77-full-law-model-set-separation
