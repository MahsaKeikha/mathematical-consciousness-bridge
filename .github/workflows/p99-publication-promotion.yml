name: p99-publication-promotion

on:
  push:
    branches: ["p99-cross-fitted-evalue-aggregation"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p99-cross-fitted-evalue-aggregation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -e ".[dev]"
      - name: Compile P99 promoter
        run: python -m py_compile scripts/promote_p99_public_frontier.py
      - name: Promote P99 public frontier
        run: python scripts/promote_p99_public_frontier.py
      - name: Repair final P99 publication contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          if "P96" not in text:
              marker = "The current public theorem frontier is **P99**."
              history = (
                  "Historical selection-valid lineage: P96 introduced independent holdout "
                  "certification after data-dependent plan selection; P97, P98, and P99 extend "
                  "that line through finite candidate families, cross-fitting, and e-value aggregation.\n\n"
              )
              if marker not in text:
                  raise RuntimeError("README P99 frontier marker not found")
              text = text.replace(marker, history + marker, 1)
          readme.write_text(text, encoding="utf-8")

          roadmap = Path("docs/theorem_roadmap.md")
          text = roadmap.read_text(encoding="utf-8")
          text = re.sub(
              r"\nP96 closes the independent-holdout version of adaptive regime selection\. "
              r"Any P99 candidate must close a genuinely new mathematical or scientific gap\. "
              r"Natural directions include .*?The physical-to-experiential bridge remains open\.\n",
              "\n",
              text,
              count=1,
              flags=re.DOTALL,
          )
          roadmap.write_text(text, encoding="utf-8")
          final_roadmap = roadmap.read_text(encoding="utf-8")
          assert "Any P99 candidate" not in final_roadmap
          assert "## P99: cross-fitted e-value aggregation" in final_roadmap
          assert "## After P99" in final_roadmap
          assert "Any P100" not in final_roadmap

          reproducibility = Path("docs/reproducibility.md")
          text = reproducibility.read_text(encoding="utf-8")
          text = text.replace("focused P98 commands below", "focused P99 commands below")
          text = text.replace(
              "The current theorem frontier is **P98**.",
              "The current theorem frontier is **P99**.",
          )
          heading = "## 5. Focused audit of the current P99 frontier"
          start = text.index(heading)
          end = text.index("\n---", start)
          focused = r'''## 5. Focused audit of the current P99 frontier

The current theorem frontier is **P99**.

Its direct technical record is:

```text
docs/proposition_99_cross_fitted_evalue_aggregation.md
docs/p99_equation_provenance.md
src/consciousness_bridge/cross_fitted_evalue_aggregation.py
tests/test_cross_fitted_evalue_aggregation.py
docs/figures/p99_cross_fitted_evalue_aggregation.svg
figures/manifest.json
```

Run the focused theorem and publication checks with:

```bash
python -m pytest -q \
  tests/test_cross_fitted_evalue_aggregation.py \
  tests/test_p99_reader_surface_coherence.py \
  tests/test_p98_reader_surface_coherence.py \
  tests/test_p97_reader_surface_coherence.py \
  tests/test_frontier_reader_narrative.py \
  tests/test_figure_publication_sync.py \
  tests/test_frontier_publication_consistency.py
python scripts/sync_figure_publication.py --check
python scripts/verify_repository.py
```

P99 converts selection-valid cross-fitted fold rejections into exact e-values. A finite calibration fixed before own-fold evaluation remains valid, and fixed convex averaging across folds uses expectation linearity rather than a final fold-independence assumption.

For two folds with two one-step-dependent regimes each, global alpha `1/20`, and fold test level `1/25`, the local regime level is `1/50`. The mathematical crossing is `3774` observations per regime, first exact replication is `3792`, and the unique-data totals are `15096` and `15168`.

P99 does not uniformly dominate P98. Own-fold leakage, post-hoc calibration search, dependent-stream pseudo-folds, model acceptance, consciousness identification, nonphysicality, and bridge completion remain outside P99.
'''
          text = text[:start] + focused + text[end:]
          text = text.replace(
              "The current frontier figure is:\n\n```text\ndocs/figures/p98_cross_fitted_selection_valid_certification.svg\n```",
              "The current frontier figure is:\n\n```text\ndocs/figures/p99_cross_fitted_evalue_aggregation.svg\n```",
          )
          reproducibility.write_text(text, encoding="utf-8")
          final_repro = reproducibility.read_text(encoding="utf-8")
          assert "The current theorem frontier is **P99**." in final_repro
          assert "docs/proposition_99_cross_fitted_evalue_aggregation.md" in final_repro
          assert "docs/figures/p99_cross_fitted_evalue_aggregation.svg" in final_repro

          lineage = Path("website/research-lineage.html")
          text = lineage.read_text(encoding="utf-8")
          text = text.replace(
              '<strong>98</strong><span>proposition-level results</span>',
              '<strong>99</strong><span>proposition-level results</span>',
          )
          text = text.replace(
              '<strong>P98</strong><span>current theorem frontier</span>',
              '<strong>P99</strong><span>current theorem frontier</span>',
          )
          lineage.write_text(text, encoding="utf-8")

          research_map = Path("website/research-map.html")
          text = research_map.read_text(encoding="utf-8")
          text = text.replace(
              '<strong>96</strong><span>proposition-level results</span>',
              '<strong>99</strong><span>proposition-level results</span>',
          )
          text = text.replace(
              '<strong>98</strong><span>proposition-level results</span>',
              '<strong>99</strong><span>proposition-level results</span>',
          )
          text = text.replace(
              '<strong>P98</strong><span>current theorem frontier</span>',
              '<strong>P99</strong><span>current theorem frontier</span>',
          )
          text = text.replace("through Proposition 98.", "through Proposition 99.")
          text = text.replace("The current theorem frontier is P98.", "The current theorem frontier is P99.")
          text = text.replace("P77-P98", "P77-P99")
          text = text.replace(
              "P98 remains a conditional model-rejection theorem",
              "P99 remains a conditional model-rejection theorem",
          )
          text = text.replace("Continue to the current P98 frontier", "Continue to the current P99 frontier")
          text = text.replace("index.html#p98-frontier", "index.html#p99-frontier")
          text = text.replace("visual-atlas.html#p98-frontier", "visual-atlas.html#p99-frontier")
          text = text.replace("See the P98 figure", "See the P99 figure")
          text = text.replace("docs/p98_equation_provenance.md", "docs/p99_equation_provenance.md")
          text = text.replace("Audit P98 provenance", "Audit P99 provenance")
          text = re.sub(
              r"Research Map · Current theorem frontier P\d+</p>",
              "Research Map · Current theorem frontier P99</p>",
              text,
          )
          research_map.write_text(text, encoding="utf-8")

          assert "P96" in readme.read_text(encoding="utf-8")
          assert '<strong>P99</strong><span>current theorem frontier</span>' in lineage.read_text(encoding="utf-8")
          final_map = research_map.read_text(encoding="utf-8")
          assert "through Proposition 99." in final_map
          assert "Research Map · Current theorem frontier P99</p>" in final_map
          assert "P77-P99" in final_map
          assert "P99 remains a conditional model-rejection theorem" in final_map
          assert "Continue to the current P99 frontier" in final_map
          assert 'href="index.html#p99-frontier"' in final_map
          assert 'href="visual-atlas.html#p99-frontier"' in final_map
          assert 'docs/p99_equation_provenance.md' in final_map
          assert "current P98 frontier" not in final_map
          PY
      - name: Preserve full linked TRIUMF name in About surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          linked = '<strong><a href="https://triumf.ca/">TRIUMF, Canada\'s Particle Accelerator Centre</a></strong>'
          for filename in ("website/index.html", "website/about.html"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = text.replace("<strong>TRIUMF</strong>", linked)
              path.write_text(text, encoding="utf-8")

          about = Path("website/about.html").read_text(encoding="utf-8")
          home = Path("website/index.html").read_text(encoding="utf-8")
          for page in (about, home):
              assert "TRIUMF, Canada's Particle Accelerator Centre" in page
              assert 'href="https://triumf.ca/"' in page
          PY
      - name: Regenerate canonical figures
        run: python scripts/generate_all_figures.py
      - name: Synchronize figure publication record
        run: python scripts/sync_figure_publication.py
      - name: Run focused P99 and reader contracts
        run: |
          python -m pytest -q \
            tests/test_cross_fitted_evalue_aggregation.py \
            tests/test_p99_reader_surface_coherence.py \
            tests/test_p98_reader_surface_coherence.py \
            tests/test_p97_reader_surface_coherence.py \
            tests/test_p96_reader_surface_coherence.py \
            tests/test_p94_reader_surface_coherence.py \
            tests/test_figure_publication_sync.py \
            tests/test_website_link_integrity.py \
            tests/test_website_research_orientation.py \
            tests/test_main_page_visual_paper.py \
            tests/test_about_researcher_website.py
      - name: Verify repository publication state
        run: python scripts/verify_repository.py
      - name: Build deployable website artifact
        run: |
          rm -rf website-deploy
          python scripts/prepare_website.py --output website-deploy
      - name: Run Ruff
        run: python -m ruff check src tests scripts
      - name: Check formatting drift
        run: git diff --check
      - name: Commit synchronized P99 publication state
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No P99 publication changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote P99 public theorem frontier"
          git push origin HEAD:p99-cross-fitted-evalue-aggregation
