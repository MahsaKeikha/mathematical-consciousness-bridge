name: link-researcher-linkedin

on:
  push:
    branches:
      - link-researcher-linkedin

permissions:
  contents: write

jobs:
  link-and-clean:
    if: ${{ !contains(github.event.head_commit.message, '[linkedin-linked]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: link-researcher-linkedin
          fetch-depth: 0
      - name: Link researcher name to LinkedIn
        run: |
          python - <<'PY'
          from pathlib import Path

          linkedin = 'https://www.linkedin.com/in/mahsa-keikha-ph-d-p-eng-a9470b43/'
          name_link = f'<a href="{linkedin}">Mahsa Keikha, PhD</a>'

          replacements = {
              'website/index.html': [
                  ('<h3>Mahsa Keikha, PhD</h3>', f'<h3>{name_link}</h3>'),
              ],
              'website/about.html': [
                  ('About the researcher · Mahsa Keikha, PhD · <a href="https://www.connectioncare.org/">Connected Care</a>', f'About the researcher · {name_link} · <a href="https://www.connectioncare.org/">Connected Care</a>'),
                  ('<h2>Mahsa Keikha, PhD</h2>', f'<h2>{name_link}</h2>'),
                  ('Mathematical Consciousness Bridge · Mahsa Keikha, PhD · <a href="https://www.connectioncare.org/">Connected Care</a> ·', f'Mathematical Consciousness Bridge · {name_link} · <a href="https://www.connectioncare.org/">Connected Care</a> ·'),
              ],
          }

          for rel, pairs in replacements.items():
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f'expected exactly one occurrence in {rel}: {old!r}; found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/link-researcher-linkedin.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Link researcher identity to LinkedIn [linkedin-linked]"
          git push origin HEAD:link-researcher-linkedin
