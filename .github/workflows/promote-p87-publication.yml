name: promote-p87-publication

on:
  push:
    branches: ["p87-publication"]
    paths:
      - ".github/workflows/promote-p87-publication.yml"
      - "scripts/promote_p87_publication.py"
      - "scripts/run_p87_promotion.py"
      - "scripts/sync_figure_publication.py"
      - "scripts/prepare_website.py"
      - "src/consciousness_bridge/bounded_primitive_quad_projection_parity_functional_separation.py"
      - "tests/test_bounded_primitive_quad_projection_parity_functional_separation.py"
      - "docs/proposition_87_exact_bounded_primitive_quad_projection_parity_functional.md"
      - "docs/p87_equation_provenance.md"
      - "docs/figures/p87_exact_bounded_primitive_quad_projection_parity.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p87-publication
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply P87 publication migration
        run: python scripts/run_p87_promotion.py
      - name: Normalize post-sync P87 reader fragments
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "website/implementation.html": [
                  ("current P86 frontier", "current P87 frontier"),
              ],
              "website/index.html": [
                  (
                      "<strong>86</strong><span>proposition-level results</span>",
                      "<strong>87</strong><span>proposition-level results</span>",
                  ),
                  (
                      "<strong>P86</strong><span>current theorem frontier</span>",
                      "<strong>P87</strong><span>current theorem frontier</span>",
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          stale = {
              "website/implementation.html": ("current P86 frontier",),
              "website/index.html": (
                  "<strong>86</strong><span>proposition-level results</span>",
                  "<strong>P86</strong><span>current theorem frontier</span>",
              ),
          }
          offenders = {
              filename: [token for token in tokens if token in Path(filename).read_text(encoding="utf-8")]
              for filename, tokens in stale.items()
          }
          offenders = {filename: tokens for filename, tokens in offenders.items() if tokens}
          if offenders:
              raise RuntimeError(f"post-sync P87 reader normalization failed: {offenders}")
          PY
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run P87 publication regression suite
        run: >-
          python -m pytest
          tests/test_bounded_primitive_quad_projection_parity_functional_separation.py
          tests/test_figure_publication_sync.py
          tests/test_reader_experience.py
          tests/test_scholarly_provenance_surface.py
          tests/test_implementation_reader_path.py
          tests/test_website_build.py
          tests/test_website_link_integrity.py
          tests/test_website_research_orientation.py
      - name: Verify repository contract
        run: python scripts/verify_repository.py
      - name: Check patch formatting
        run: git diff --check
      - name: Commit promoted P87 publication surfaces
        run: |
          if git diff --quiet; then
            echo "No P87 publication changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote P87 across publication surfaces"
          git push origin HEAD:p87-publication
