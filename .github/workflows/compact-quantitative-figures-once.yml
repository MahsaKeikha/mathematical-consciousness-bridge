name: compact-quantitative-figures-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/compact-quantitative-figures-once.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reduce Q and QM figure scale
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in (
              "scripts/generate_quantitative_atlas.py",
              "scripts/generate_quantum_foundations_atlas.py",
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = text.replace('"figure.figsize": (7.6, 4.7)', '"figure.figsize": (5.8, 3.6)')
              text = text.replace('"font.size": 9.5', '"font.size": 8.5')
              text = text.replace('"axes.titlesize": 13', '"axes.titlesize": 11.5')
              text = text.replace('"axes.labelsize": 9.5', '"axes.labelsize": 8.5')
              path.write_text(text, encoding="utf-8")
          PY
      - name: Regenerate complete quantitative atlases
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "matplotlib>=3.8"
          python scripts/generate_quantitative_atlas.py
          python scripts/generate_quantum_foundations_atlas.py
      - name: Validate repository
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .
      - name: Commit compact figures
        run: |
          rm .github/workflows/compact-quantitative-figures-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_quantitative_atlas.py scripts/generate_quantum_foundations_atlas.py docs/figures/quantitative docs/figures/quantum .github/workflows/compact-quantitative-figures-once.yml
          git commit -m "Reduce Q01-Q40 and QM01-QM18 figure scale"
          git push origin HEAD:main
