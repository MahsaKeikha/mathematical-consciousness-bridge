name: integrate-p44-publication-once

on:
  push:
    branches:
      - p44-publication-integration

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: p44-publication-integration
          fetch-depth: 0

      - name: Apply P44 publication integration
        run: python .github/integrate_p44_publication.py

      - name: Remove one-time integration scaffolding
        run: |
          rm .github/integrate_p44_publication.py
          rm .github/workflows/integrate-p44-publication-once.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate publication state
        run: |
          pytest
          ruff check .

      - name: Commit verified publication integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md CITATION.cff pyproject.toml docs tests .github
          git commit -m "Integrate P44 into public research paper"
          git push origin p44-publication-integration
