name: temporary-p90-final-contract-migration

on:
  workflow_dispatch:
  push:
    branches:
      - p90-exact-nonlinear-rank-one-separation
    paths:
      - ".github/workflows/temporary-p90-final-contract-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p90-exact-nonlinear-rank-one-separation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Migrate stale P89 publication contracts to P90
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"missing replacement anchor in {path}: {old}")
                  text = text.replace(old, new)
              p.write_text(text, encoding="utf-8")

          edit("CITATION.cff", [
              ('version: "0.82.0"', 'version: 0.82.0'),
          ])

          edit("scripts/verify_repository.py", [
              ("expected_cff = f'version: \\"{CURRENT_VERSION}\\"'", "expected_cff = f'version: {CURRENT_VERSION}'"),
              ('if "–" in text or "—" in text:', 'if chr(0x2013) in text or chr(0x2014) in text:'),
          ])

          edit("website/implementation.html", [
              ('index.html#p89-frontier', 'index.html#p90-frontier'),
          ])
          edit("website/research-map.html", [
              ('index.html#p89-frontier', 'index.html#p90-frontier'),
          ])

          edit("tests/test_reader_experience.py", [
              ('assert "for number in range(1, 91):" in verifier', 'assert "covered: set[int] = set()" in verifier\n    assert "range(1, 91)" in verifier'),
          ])

          p = Path("tests/test_publication_contract_v2.py")
          text = p.read_text(encoding="utf-8")
          replacements = [
              ('assert "89" in start', 'assert "90" in start'),
              ('does **not** duplicate the full 89 proposition index', 'does **not** duplicate the full 90 proposition index'),
              ('assert "P89" in text', 'assert "P90" in text'),
              ('## Current theorem frontier: P89', '## Current theorem frontier: P90'),
              ('## Historical theorem frontier: P88', '## Historical theorem frontier: P89'),
              ('## Historical theorem frontier: P87', '## Historical theorem frontier: P88'),
              ('## Current theorem frontier: P88', '## Current theorem frontier: P89'),
              ('Complete P1 to P89 chronology', 'Complete P1 to P90 chronology'),
              ('P1 through P89 with explicit dependency branches', 'P1 through P90 with explicit dependency branches'),
              ('range(1, 90)', 'range(1, 91)'),
              ('"P89",\n    ):', '"P89",\n        "P90",\n    ):'),
              ('assert "P89" in figures', 'assert "P90" in figures'),
              ('assert "p89_complete_linear_parity_duality.svg" in figures', 'assert "p90_exact_nonlinear_rank_one_separation.svg" in figures'),
              ('assert "p89_equation_provenance.md" in equations', 'assert "p90_equation_provenance.md" in equations'),
              ('assert \'id="p89-source"\' in sources', 'assert \'id="p90-source"\' in sources'),
              ('Current theorem source · P89', 'Current theorem source · P90'),
              ('proposition_89_complete_linear_parity_duality.md', 'proposition_90_exact_nonlinear_rank_one_separation.md'),
              ('p89_equation_provenance.md', 'p90_equation_provenance.md'),
              ('complete_linear_parity_duality.py', 'exact_nonlinear_rank_one_separation.py'),
              ('test_complete_linear_parity_duality.py', 'test_exact_nonlinear_rank_one_separation.py'),
              ('p89_complete_linear_parity_duality.svg', 'p90_exact_nonlinear_rank_one_separation.svg'),
              ('assert "Previous theorem source · P88" in sources', 'assert "Previous theorem source · P89" in sources'),
              ('before_p89', 'before_p90'),
              ('p89 = overview.index(\'id="p89-frontier"\')', 'p90 = overview.index(\'id="p90-frontier"\')'),
              ('dashboard < journey < p89', 'dashboard < journey < p90'),
              ('89</strong><span>proposition-level results', '90</strong><span>proposition-level results'),
              ('P89 current theorem frontier · v0.82.0', 'P90 current theorem frontier · v0.82.0'),
              ('89 results · current frontier P89', '90 results · current frontier P90'),
              ('The 89 Research II propositions by scientific role', 'The 90 Research II propositions by scientific role'),
              ('P89</strong><span>current theorem frontier', 'P90</strong><span>current theorem frontier'),
              ('use_current_p89_state', 'use_current_p90_state'),
              ('assert "P89" in research_map', 'assert "P90" in research_map'),
              ('assert "P75-P89" in research_map or "P73-P89" in research_map', 'assert "P75-P90" in research_map or "P73-P90" in research_map'),
              ('id="p89-research-map"', 'id="p90-research-map"'),
              ('assert "5/168" in research_map', 'assert "5/72" in research_map'),
              ('current frontier P89', 'current frontier P90'),
              ('current documented frontier, P89', 'current documented frontier, P90'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing publication-contract anchor: {old}")
              text = text.replace(old, new)
          p.write_text(text, encoding="utf-8")

          p = Path("tests/test_scholarly_provenance_surface.py")
          text = p.read_text(encoding="utf-8")
          replacements = [
              ('audited by P75-P89', 'audited by P75-P90'),
              ('The current repository contains 89 proposition-level results', 'The current repository contains 90 proposition-level results'),
              ('P89 is the current Research II theorem frontier', 'P90 is the current Research II theorem frontier'),
              ('points_to_current_p89_and_previous_p88_p87_p86_records', 'points_to_current_p90_and_previous_p89_p88_p87_records'),
              ('assert \'id="p89-source"\' in sources\n    assert "Current theorem source · P89" in sources\n    assert "5/168" in sources\n    assert "proposition_89_complete_linear_parity_duality.md" in sources\n    assert "p89_equation_provenance.md" in sources\n    assert "complete_linear_parity_duality.py" in sources\n    assert "test_complete_linear_parity_duality.py" in sources\n\n    assert \'id="p88-source"\' in sources\n    assert "Previous theorem source · P88" in sources',
               'assert \'id="p90-source"\' in sources\n    assert "Current theorem source · P90" in sources\n    assert "5/72" in sources\n    assert "proposition_90_exact_nonlinear_rank_one_separation.md" in sources\n    assert "p90_equation_provenance.md" in sources\n    assert "exact_nonlinear_rank_one_separation.py" in sources\n    assert "test_exact_nonlinear_rank_one_separation.py" in sources\n\n    assert \'id="p89-source"\' in sources\n    assert "Previous theorem source · P89" in sources\n    assert "5/168" in sources\n    assert "proposition_89_complete_linear_parity_duality.md" in sources\n    assert "p89_equation_provenance.md" in sources\n\n    assert \'id="p88-source"\' in sources\n    assert "Previous theorem source · P88" in sources'),
              ('assert "Current theorem source · P88" not in sources\n    assert "Current theorem source · P87" not in sources', 'assert "Current theorem source · P89" not in sources\n    assert "Current theorem source · P88" not in sources'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing scholarly-contract anchor: {old[:80]}")
              text = text.replace(old, new)
          p.write_text(text, encoding="utf-8")
          PY
      - name: Install exact test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-reproducibility.txt
      - name: Validate migrated final contracts
        run: |
          python -m pytest -q \
            tests/test_citation_surface.py \
            tests/test_publication_contract_v2.py \
            tests/test_reader_experience.py \
            tests/test_reference_and_prose_style.py \
            tests/test_release_metadata_consistency.py \
            tests/test_scholarly_provenance_surface.py \
            tests/test_typography_policy.py \
            tests/test_website_link_integrity.py
          python scripts/verify_repository.py
          python -m ruff check scripts/verify_repository.py tests/test_publication_contract_v2.py tests/test_reader_experience.py tests/test_scholarly_provenance_surface.py
          git diff --check
      - name: Persist final P90 contract migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff scripts/verify_repository.py website/implementation.html website/research-map.html tests/test_publication_contract_v2.py tests/test_reader_experience.py tests/test_scholarly_provenance_surface.py
          git commit -m "Migrate remaining publication contracts to P90"
          git push origin HEAD:p90-exact-nonlinear-rank-one-separation
