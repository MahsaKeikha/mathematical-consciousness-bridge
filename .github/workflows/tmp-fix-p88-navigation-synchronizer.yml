name: temporary-fix-p88-navigation-synchronizer

on:
  push:
    branches: ["fix/p88-navigation-synchronizer-contract"]
    paths:
      - ".github/workflows/tmp-fix-p88-navigation-synchronizer.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p88-navigation-synchronizer-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Repair canonical Research Navigation contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/synchronize_p88_reader_frontier_phrases.py")
          text = path.read_text(encoding="utf-8")

          old_sync = '''def _sync_research_navigation(changed: list[str]) -> None:
              path = DOCS / "research_navigation.md"
              text = path.read_text(encoding="utf-8")
              replacements = (
          '''
          new_sync = '''def _sync_research_navigation(changed: list[str]) -> None:
              path = DOCS / "research_navigation.md"
              text = path.read_text(encoding="utf-8")
              canonical_frontier = "The current documented theorem frontier is **P88**."
              for legacy_frontier in (
                  "The public theorem frontier is **P87**.",
                  "The public theorem frontier is **P88**.",
                  "The current documented theorem frontier is **P87**.",
              ):
                  text = text.replace(legacy_frontier, canonical_frontier)
              if canonical_frontier not in text:
                  raise RuntimeError("research navigation canonical frontier declaration is missing")
              replacements = (
          '''
          if text.count(old_sync) != 1:
              raise SystemExit(f"navigation sync insertion target count={text.count(old_sync)}")
          text = text.replace(old_sync, new_sync, 1)

          old_required = '''        "research navigation": (
                      "The public theorem frontier is **P88**.",
          '''
          new_required = '''        "research navigation": (
                      "The current documented theorem frontier is **P88**.",
          '''
          if text.count(old_required) != 1:
              raise SystemExit(f"navigation assertion target count={text.count(old_required)}")
          text = text.replace(old_required, new_required, 1)

          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile scripts/synchronize_p88_reader_frontier_phrases.py
          python scripts/synchronize_p88_reader_frontier_phrases.py
          python scripts/synchronize_p88_reader_frontier_phrases.py
          git diff --check

          if ! git diff --quiet -- docs website README.md START_HERE.md figures; then
            echo "Synchronizer unexpectedly changed reader/publication surfaces."
            git diff -- docs website README.md START_HERE.md figures
            exit 1
          fi
      - name: Commit focused synchronizer repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/synchronize_p88_reader_frontier_phrases.py
          git commit -m "Align P88 navigation synchronizer with canonical wording"
          git push origin HEAD:fix/p88-navigation-synchronizer-contract
