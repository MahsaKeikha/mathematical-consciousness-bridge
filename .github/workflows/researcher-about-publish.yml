name: researcher-about-publish

on:
  push:
    branches: ["website-about-research-origin"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-about-research-origin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -e ".[dev]"
      - name: Publish About navigation and homepage section
        run: python scripts/publish_researcher_about.py
      - name: Validate About and website contracts
        run: |
          python -m pytest -q \
            tests/test_about_researcher_website.py \
            tests/test_website_link_integrity.py \
            tests/test_website_research_orientation.py \
            tests/test_main_page_visual_paper.py
          python scripts/verify_repository.py
          rm -rf website-deploy
          python scripts/prepare_website.py --output website-deploy
          git diff --check
      - name: Commit published About state
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No About publication changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website
          git commit -m "Publish researcher About section"
          git push origin HEAD:website-about-research-origin
