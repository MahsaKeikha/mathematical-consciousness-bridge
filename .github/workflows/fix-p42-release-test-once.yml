name: fix-p42-release-test-once

on:
  push:
    branches:
      - p42-quantum-regular-bridge-sample-complexity
    paths:
      - .github/workflows/fix-p42-release-test-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: p42-quantum-regular-bridge-sample-complexity
          fetch-depth: 0

      - name: Extend release integrator to synchronize metadata tests
        run: |
          cat >> .github/integrate_p42_release.py <<'PY'

# Release-consistency guards
path = Path("tests/test_release_metadata_consistency.py")
text = path.read_text(encoding="utf-8")
text = replace_once(text, "version-0.41.0-2563eb", "version-0.42.0-2563eb", "release test README version")
text = replace_once(text, 'r\'^version = "0\\.41\\.0"$\'', 'r\'^version = "0\\.42\\.0"$\'', "release test pyproject version")
text = replace_once(text, "r'^version: 0\\.41\\.0$'", "r'^version: 0\\.42\\.0$'", "release test citation version")
text = replace_once(
    text,
    '        "test_trace_ball_quantum_envelope.py",',
    '        "test_trace_ball_quantum_envelope.py",\n        "Proposition 42",\n        "p42_quantum_regular_bridge_sample_complexity.svg",\n        "quantum_regular_bridge_sample_complexity.py",\n        "test_quantum_regular_bridge_sample_complexity.py",',
    "release test P42 paths",
)
path.write_text(text, encoding="utf-8")
PY

      - name: Remove this one-time workflow
        run: rm .github/workflows/fix-p42-release-test-once.yml

      - name: Commit integrator correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize P42 release metadata tests"
          git push origin HEAD:p42-quantum-regular-bridge-sample-complexity
