name: p98-reader-surface-fix

on:
  push:
    branches: ["p98-cross-fitted-selection-valid-certification"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p98-cross-fitted-selection-valid-certification
          fetch-depth: 0
      - name: Synchronize P98 reader surfaces
        run: python scripts/fix_p98_reader_surfaces.py
      - name: Validate migration diff
        run: git diff --check
      - name: Remove temporary migration machinery
        run: rm .github/workflows/p98-reader-surface-fix.yml scripts/fix_p98_reader_surfaces.py
      - name: Commit synchronized reader surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize P98 reader surfaces"
          git push origin HEAD:p98-cross-fitted-selection-valid-certification
