name: Fix causal anatomy vertical spacing

on:
  push:
    branches: [visual-audit-causal-structure-anatomy]
    paths:
      - .github/workflows/fix-causal-anatomy-vertical.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-audit-causal-structure-anatomy
      - name: Raise minimality blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/figures/causal_structure_anatomy.svg')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'y="724" class="label">MINIMALITY RESULT': 'y="708" class="label">MINIMALITY RESULT',
              'y="748" class="body">P12: insufficient alone': 'y="732" class="body">P12: insufficient alone',
              'y="768" class="body">P13: not recoverable': 'y="752" class="body">P13: not recoverable',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 3:
                  raise SystemExit(f'expected 3 occurrences of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/figures/causal_structure_anatomy.svg
          git commit -m 'Raise causal anatomy minimality blocks'
          git push origin HEAD:visual-audit-causal-structure-anatomy
