name: temporary-p89-eof-repair

on:
  push:
    branches: ["p89-complete-linear-parity-duality"]
    paths:
      - ".github/workflows/temporary-p89-eof-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p89-complete-linear-parity-duality
          fetch-depth: 0
      - name: Normalize citation EOF in final repair workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/temporary-p89-six-contract-repair.yml')
          text = path.read_text(encoding='utf-8')
          old = "          citation.write_text(text, encoding='utf-8')"
          new = "          citation.write_text(text.rstrip() + '\\n', encoding='utf-8')"
          if old not in text:
              raise RuntimeError('citation write anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/temporary-p89-eof-repair.yml').unlink()
          PY
      - name: Commit helper patch and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize P89 citation EOF repair"
          git fetch origin p89-complete-linear-parity-duality
          git rebase origin/p89-complete-linear-parity-duality
          git push origin HEAD:p89-complete-linear-parity-duality