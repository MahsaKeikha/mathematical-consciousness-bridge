name: Regenerate figure documentation

on:
  push:
    branches:
      - p80-simplex-coupled-box-certificate

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p80-simplex-coupled-box-certificate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate figure metadata and catalog
        run: python scripts/enrich_figure_documentation.py
      - name: Validate strict SVG XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in sorted(Path("docs/figures").rglob("*.svg")):
              ET.parse(path)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/regenerate-figure-documentation.yml
      - name: Commit regenerated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated documentation changes."
            exit 0
          fi
          git commit -m "Regenerate figure catalog with detailed P75 metadata"
          git push origin HEAD:p80-simplex-coupled-box-certificate
