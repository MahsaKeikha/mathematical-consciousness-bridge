name: promote-p86-publication

on:
  push:
    branches: ["main"]
    # Re-run from the current main after retiring the obsolete P85 repair workflow.
    paths:
      - ".github/workflows/promote-p86-publication.yml"
      - "scripts/promote_p86_publication.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize P86 publication surfaces
        run: python scripts/promote_p86_publication.py
      - name: Preserve reader layout contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path("docs/theorem_roadmap.md")
          text = roadmap.read_text(encoding="utf-8")
          proof = "proposition_86_exact_minimally_weighted_quad_projection_parity_functional.md"
          text = text.replace(
              f"- Proof: [{proof}]({proof})",
              f"- Proof: [P86]({proof})",
          )
          roadmap.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          block_marker = "\n\n---\n\n## Current theorem frontier: P86"
          citation_marker = "\n# Citation\n"
          if block_marker in text:
              start = text.index(block_marker)
              p86_block = text[start:].strip()
              text = text[:start].rstrip() + "\n"
              if citation_marker not in text:
                  raise RuntimeError("README citation section marker missing")
              citation_start = text.index(citation_marker)
              text = (
                  text[:citation_start].rstrip()
                  + "\n\n---\n\n"
                  + p86_block.removeprefix("---\n\n")
                  + "\n\n"
                  + text[citation_start:].lstrip("\n")
              )
          if not text.rstrip().endswith("**[BibTeX](CITATION.bib)**"):
              raise RuntimeError("README citation block is no longer the final section")
          readme.write_text(text, encoding="utf-8")
          PY
      - name: Install test environment
        run: python -m pip install -e ".[dev]"
      - name: Verify P86 mathematics and reader contract
        run: |
          python -m pytest \
            tests/test_weighted_quad_projection_parity_functional_separation.py \
            tests/test_frontier_reader_narrative.py \
            tests/test_public_reader_navigation_frontier.py \
            tests/test_reader_documentation_consistency.py \
            tests/test_readme_research_orientation.py \
            tests/test_research_website_integrity.py \
            tests/test_citation_surface.py \
            tests/test_main_page_visual_paper.py \
            tests/test_theorem_roadmap_caption.py
          python scripts/verify_repository.py
      - name: Check patch formatting
        run: git diff --check
      - name: Commit synchronized P86 publication
        run: |
          if git diff --quiet; then
            echo "P86 publication already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md START_HERE.md CITATION.cff CITATION.md CITATION.bib \
            docs/theorem_roadmap.md docs/research_navigation.md \
            docs/detailed_proposition_record.md docs/equation_and_citation_map.md \
            docs/figure_catalog.md scripts/verify_repository.py \
            website/index.html website/plain-language.html website/start-here.html \
            website/research-map.html website/visual-atlas.html website/implementation.html
          git commit -m "Promote P86 across publication surfaces"
          git push origin HEAD:main
