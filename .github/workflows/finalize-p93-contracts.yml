name: finalize-p93-contracts

# One-run feature-branch repair. Delete before merge.
on:
  push:
    branches:
      - p93-localized-sign-coherence-rejection
    paths:
      - "scripts/finalize_p93_contracts.py"
      - ".github/workflows/finalize-p93-contracts.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p93-localized-sign-coherence-rejection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install exact repository environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-reproducibility.txt
      - name: Repair residual P93 contracts
        run: |
          # This one phrase was already promoted by the earlier publication pass.
          # Remove only that now-noop assertion from the temporary helper so the
          # remaining exact P93 repairs can run idempotently.
          sed -i '/("P75-P92", "P75-P93"),/d' scripts/finalize_p93_contracts.py
          python scripts/finalize_p93_contracts.py
          python - <<'PY'
          from pathlib import Path

          roadmap_path = Path('docs/theorem_roadmap.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          roadmap = roadmap.replace(
              "Any P93 claim must preserve one-sided certification and the repository's scientific boundary.",
              "The realized P93 theorem preserves one-sided certification and the repository's scientific boundary.",
          )
          roadmap = roadmap.replace(
              "A substantive continuation beyond P92 must close a separately stated mathematical or statistical gap",
              "A substantive continuation beyond P93 must close a separately stated mathematical or statistical gap",
          )
          roadmap = roadmap.replace(
              "None of P71-P88 identifies a latent variable with consciousness.",
              "None of P71-P93 identifies a latent variable with consciousness.",
          )
          roadmap_path.write_text(roadmap, encoding='utf-8')

          nav_path = Path('docs/research_navigation.md')
          nav = nav_path.read_text(encoding='utf-8')
          nav = nav.replace("**Results:** P75 through P92", "**Results:** P75 through P93")
          nav = nav.replace(
              "**Current frontier:** [P92: Exact Global Mixed-Prevalence Distance](proposition_92_exact_global_mixed_prevalence_distance.md)",
              "**Current frontier:** [P93: Localized Finite-Sample Sign-Coherence Rejection](proposition_93_localized_sign_coherence_rejection.md)",
          )
          nav = nav.replace("P74 through P92 via", "P74 through P93 via")
          nav = nav.replace("## P90 current frontier", "## P90 historical nonlinear frontier")
          nav = nav.replace("## P92 current frontier", "## P92 historical exact population frontier")
          nav = nav.replace(
              "## P93 current frontier\n\n| What you want | Direct link |",
              "## P93 current frontier\n\nFor P93:\n\n| What you want | Direct link |",
          )
          nav_path.write_text(nav, encoding='utf-8')

          verifier_path = Path('scripts/verify_repository.py')
          verifier = verifier_path.read_text(encoding='utf-8')
          verifier = verifier.replace(
              '    p90 = visual_atlas.index(\'id="p90-frontier"\')\n',
              '',
          )
          verifier_path.write_text(verifier, encoding='utf-8')

          figure_test_path = Path('tests/test_figure_publication_sync.py')
          figure_test = figure_test_path.read_text(encoding='utf-8')
          figure_test = figure_test.replace(
              '    p89 = text.index(\'id="p89-frontier"\')\n',
              '',
          )
          figure_test_path.write_text(figure_test, encoding='utf-8')
          PY
          git checkout -- scripts/finalize_p93_contracts.py
      - name: Regenerate derived figure publication surfaces
        run: python scripts/generate_all_figures.py
      - name: Validate exact repaired state
        run: |
          python scripts/verify_frontier_publication.py
          python -m pytest -q
          python scripts/verify_repository.py
          python scripts/prepare_website.py --source website --output _site
          python -m ruff check .
          git diff --check
          if git diff --name-only | grep -q '^\.github/workflows/'; then
            echo "Finalizer must not rewrite workflow files."
            exit 1
          fi
      - name: Commit final P93 contracts
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "P93 contracts already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize P93 publication contracts"
          git push origin HEAD:p93-localized-sign-coherence-rejection
