name: generate-quantum-atlas

on:
  workflow_dispatch:
  push:
    branches:
      - p18-scale-sufficiency
    paths:
      - scripts/generate_quantum_foundations_atlas.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "numpy>=1.26" "matplotlib>=3.8"
      - run: python scripts/generate_quantum_foundations_atlas.py
      - name: Commit generated quantum figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/figures/quantum
          if git diff --cached --quiet; then
            echo "Quantum atlas is already up to date."
          else
            git commit -m "Generate quantitative quantum foundations atlas"
            git push origin HEAD:${{ github.ref_name }}
          fi
