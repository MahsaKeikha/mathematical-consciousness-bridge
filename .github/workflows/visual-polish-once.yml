name: visual-polish-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/visual-polish-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "numpy>=1.26" "matplotlib>=3.8"
      - name: Reduce quantitative figure display scale
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in (
              Path('scripts/generate_quantitative_atlas.py'),
              Path('scripts/generate_quantum_foundations_atlas.py'),
          ):
              text = path.read_text(encoding='utf-8')
              text = text.replace('"figure.figsize": (9.6, 6.0)', '"figure.figsize": (7.6, 4.7)')
              text = text.replace('"font.size": 11', '"font.size": 9.5')
              text = text.replace('"axes.titlesize": 16', '"axes.titlesize": 13')
              text = text.replace('"axes.labelsize": 11', '"axes.labelsize": 9.5')
              path.write_text(text, encoding='utf-8')
          PY
          python scripts/generate_quantitative_atlas.py
          python scripts/generate_quantum_foundations_atlas.py
      - name: Rebuild clean state-space figure
        run: |
          cat > docs/figures/state_space_dynamics_map.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
            <title id="title">State-space dynamics, perturbations, and empirical regimes</title>
            <desc id="desc">A clean publication-style schematic showing four empirical dynamical regimes in measured state space, controlled perturbation, spontaneous transition, and a separate measurement-to-inference chain. The regimes are schematic and are not universal experiential classes.</desc>
            <defs>
              <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
                <path d="M0 0 L0 8 L10 4 z" fill="#64748b"/>
              </marker>
              <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
                <path d="M0 0 L0 8 L10 4 z" fill="#dc2626"/>
              </marker>
              <style>
                .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
                .subtitle{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
                .head{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
                .body{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#334155}
                .small{font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#64748b}
                .label{font:700 10px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.8px;fill:#64748b}
                .eq{font:600 16px Georgia,'Times New Roman',serif;fill:#0f172a}
                .axis{stroke:#64748b;stroke-width:1.8}
                .arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
              </style>
            </defs>

            <rect width="1500" height="900" fill="#ffffff"/>
            <text x="70" y="58" class="title">State-Space Dynamics, Perturbations, and Empirical Regimes</text>
            <text x="70" y="88" class="subtitle">Schematic measured-state geometry; no universal scalar ranking of consciousness is imposed.</text>

            <rect x="70" y="125" width="980" height="625" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
            <text x="100" y="158" class="label">SCHEMATIC MEASURED STATE SPACE</text>

            <rect x="120" y="180" width="405" height="78" rx="12" fill="#ffffff" stroke="#94a3b8"/>
            <text x="145" y="210" class="head">Local dynamical model</text>
            <text x="145" y="239" class="eq">dXₜ = f(Xₜ,uₜ)dt + G(Xₜ,uₜ)dWₜ</text>

            <rect x="560" y="180" width="440" height="78" rx="12" fill="#ffffff" stroke="#94a3b8"/>
            <text x="585" y="210" class="head">Intervention-response geometry</text>
            <text x="585" y="239" class="eq">dᵖτ(u,v) = ‖Pᵤ,τ(p) − Pᵥ,τ(p)‖TV</text>

            <line x1="135" y1="690" x2="990" y2="690" class="axis"/>
            <line x1="135" y1="690" x2="135" y2="295" class="axis"/>
            <text x="878" y="720" class="small">measured coordinate 1</text>
            <text x="92" y="490" class="small" transform="rotate(-90 92 490)">measured coordinate 2</text>

            <ellipse cx="355" cy="410" rx="190" ry="105" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
            <ellipse cx="355" cy="410" rx="115" ry="58" fill="#bfdbfe" opacity="0.62"/>
            <circle cx="355" cy="410" r="8" fill="#0f172a"/>
            <text x="278" y="352" class="head">Wakeful / responsive</text>
            <text x="273" y="377" class="small">broad observable dynamical repertoire</text>

            <ellipse cx="805" cy="360" rx="150" ry="88" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
            <ellipse cx="805" cy="360" rx="78" ry="42" fill="#bbf7d0" opacity="0.65"/>
            <text x="724" y="318" class="head">Dream / dissociated</text>
            <text x="724" y="342" class="small">report and overt response may dissociate</text>

            <ellipse cx="760" cy="565" rx="160" ry="92" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
            <ellipse cx="760" cy="565" rx="84" ry="44" fill="#ddd6fe" opacity="0.72"/>
            <text x="700" y="523" class="head">NREM-like regime</text>
            <text x="676" y="548" class="small">distinct temporal and perturbational structure</text>

            <ellipse cx="365" cy="585" rx="145" ry="82" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
            <ellipse cx="365" cy="585" rx="72" ry="38" fill="#fed7aa" opacity="0.75"/>
            <text x="305" y="550" class="head">Anesthetic regime</text>
            <text x="286" y="574" class="small">agent-specific dynamics; no universal pattern</text>

            <path d="M405 385 C505 315 615 305 690 335" class="arrow" stroke-dasharray="8 7"/>
            <text x="495" y="302" class="label">SPONTANEOUS / STATE TRANSITION</text>

            <circle cx="410" cy="455" r="9" fill="#dc2626"/>
            <path d="M420 458 C535 495 610 520 660 545" stroke="#dc2626" stroke-width="2.6" fill="none" marker-end="url(#redArrow)"/>
            <text x="495" y="500" style="font:700 10px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.8px;fill:#b91c1c">CONTROLLED PERTURBATION</text>

            <rect x="1085" y="125" width="345" height="625" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
            <text x="1115" y="158" class="label">MEASUREMENT → INFERENCE</text>

            <rect x="1115" y="195" width="285" height="105" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
            <text x="1140" y="228" class="head">Observed signals</text>
            <text x="1140" y="256" class="body">EEG • MEG • fMRI • intracranial</text>
            <text x="1140" y="280" class="body">physiology • behavior • report</text>
            <path class="arrow" d="M1258 300 V332"/>

            <rect x="1115" y="345" width="285" height="105" rx="12" fill="#f0fdf4" stroke="#4ade80"/>
            <text x="1140" y="378" class="head">Derived features</text>
            <text x="1140" y="406" class="body">complexity • connectivity • criticality</text>
            <text x="1140" y="430" class="body">response propagation • causal geometry</text>
            <path class="arrow" d="M1258 450 V482"/>

            <rect x="1115" y="495" width="285" height="118" rx="12" fill="#fff7ed" stroke="#fb923c"/>
            <text x="1140" y="528" class="head">Empirical state evidence</text>
            <text x="1140" y="556" class="body">wakefulness • dreaming • anesthesia</text>
            <text x="1140" y="580" class="body">recovery • covert command response</text>
            <text x="1140" y="602" class="small">labels remain model dependent</text>

            <rect x="1115" y="642" width="285" height="78" rx="12" fill="#f5f3ff" stroke="#a78bfa"/>
            <text x="1140" y="673" class="head">Bridge boundary</text>
            <text x="1140" y="700" class="eq">B̄ : QP → QE</text>

            <rect x="70" y="785" width="1360" height="78" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
            <text x="100" y="815" class="label">INTERPRETATION BOUNDARY</text>
            <text x="100" y="840" class="body">Regime basins are schematic dynamical classes, not experiential classes.</text>
            <text x="100" y="858" class="small">Bridge claims require independent experiential definitions and empirical support.</text>
          </svg>
          SVG
      - name: Validate repository
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .
      - name: Commit polished figures and remove one-time workflow
        run: |
          rm .github/workflows/visual-polish-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_quantitative_atlas.py scripts/generate_quantum_foundations_atlas.py docs/figures/quantitative docs/figures/quantum docs/figures/state_space_dynamics_map.svg .github/workflows/visual-polish-once.yml
          git commit -m "Polish main-page figure scale and state-space map"
          git push origin HEAD:main
