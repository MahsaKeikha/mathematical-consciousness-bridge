name: one-shot-roadmap-frontier-compat

on:
  push:
    branches:
      - clarify-theorem-roadmap-caption

permissions:
  contents: write

jobs:
  fix-wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clarify-theorem-roadmap-caption
      - name: Preserve frontier wording while clarifying displayed scope
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = "The displayed dependency roadmap covers **P1 through P31**; the theorem index extends the research through **P80** with later branches documented separately."
          new = "The complete theorem index spans P1 through P80 with explicit dependency branches. Figure 3 below displays the P1-P31 foundational portion; later branches are documented separately."
          if old not in text:
              raise SystemExit("Expected roadmap intro wording not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-roadmap-frontier-compat.yml
      - name: Commit wording fix
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add README.md .github/workflows/one-shot-roadmap-frontier-compat.yml
          git commit -m "Preserve P80 frontier wording in roadmap intro"
          git push origin HEAD:clarify-theorem-roadmap-caption
