name: P100 final Ruff fix

on:
  push:
    branches:
      - p100-anytime-sequential-eprocess
    paths:
      - .github/workflows/p100-ruff-final-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace deprecated regular-expression alias
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/promote_p100_public_frontier.py")
          text = path.read_text(encoding="utf-8")
          count = text.count("re.S")
          if count != 4:
              raise SystemExit(f"expected exactly 4 re.S aliases, found {count}")
          text = text.replace("re.S", "re.DOTALL")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify Ruff locally
        run: |
          python -m pip install ruff
          python -m ruff check scripts/promote_p100_public_frontier.py
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/p100-ruff-final-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/promote_p100_public_frontier.py .github/workflows/p100-ruff-final-fix.yml
          git commit -m "Fix P100 promotion helper Ruff aliases"
          git push origin HEAD:p100-anytime-sequential-eprocess
