name: repair-p88-publication-contracts

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/repair-p88-publication-contracts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-p88-publication-contracts-main
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Repair P88 publication and reader contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              (root / path).write_text(text, encoding='utf-8')

          # 1. Machine-readable citation metadata: release stays v0.82.0,
          # while the independently tracked theorem frontier is P88.
          cff = read('CITATION.cff')
          cff = cff.replace('Current documented theorem frontier: P87.', 'Current documented theorem frontier: P88.')
          cff = cff.replace('Current documented theorem frontier: P86.', 'Current documented theorem frontier: P88.')
          write('CITATION.cff', cff)

          bib = read('CITATION.bib')
          bib = re.sub(r'Current documented theorem frontier: P(?:86|87)\.',
                       'Current documented theorem frontier: P88.', bib)
          write('CITATION.bib', bib)

          # 2. Human citation guide: preserve historical method sections but make
          # all claims of *current* frontier agree with P88.
          citation = read('CITATION.md')
          citation = citation.replace('current documented frontier, P86.', 'current documented frontier, P88.')
          citation = citation.replace('Current documented theorem frontier: P86.', 'Current documented theorem frontier: P88.')
          citation = citation.replace('theorem frontier **P86**', 'theorem frontier **P88**')
          citation = citation.replace('P1 through P86 chronological theorem record', 'P1 through P88 chronological theorem record')
          citation = citation.replace('## Current theorem frontier: P85', '## Historical theorem frontier: P85')
          citation = citation.replace('## Current theorem frontier\n\nThe current documented theorem frontier is **P87**.',
                                      '## Proposition 87 method citation\n\nProposition 87 was the documented theorem frontier before P88.')
          if '## Current theorem frontier: P88' not in citation:
              citation += '''\n\n## Current theorem frontier: P88\n\nThe current documented theorem frontier is **P88**, while the formal release remains **v0.82.0**. P88 exhausts 632 primitive sign-normalized coefficient patterns across each of 330 four-event subsets, giving **208,560 exact functionals**. On the established exact rational witness, the coefficients `(1,-1,-3,2)` give empirical value `-11/8` outside the exact P75 interval `[-1,2]`, with gap `3/8`, centered norm `24`, and certified full-law lower bound `L88 = 1/64`, strictly strengthening `L87 = 1/96`.\n\nFor equation and method provenance, cite [`docs/p88_equation_provenance.md`](docs/p88_equation_provenance.md) together with [`docs/proposition_88_exact_radius_three_bounded_primitive_quad_projection_parity_functional.md`](docs/proposition_88_exact_radius_three_bounded_primitive_quad_projection_parity_functional.md).\n\n**Scientific boundary:** P88 is a conditional model-separation theorem for the declared P75 target-measurement family. It does not identify consciousness, establish nonphysicality, or close the physical-to-experiential bridge.\n'''
          write('CITATION.md', citation)

          # 3. Chronology headline/count drift.
          detail = read('docs/detailed_proposition_record.md')
          detail = detail.replace('Complete P1 to P87 chronology', 'Complete P1 to P88 chronology')
          detail = detail.replace('84 disconnected proofs', '88 disconnected proofs')
          write('docs/detailed_proposition_record.md', detail)

          # 4. Fix the P88 synchronization generator itself. A single backslash
          # before 'frac' in a Python string literal becomes a form-feed at runtime.
          sync_path = 'scripts/synchronize_p88_reader_frontier_phrases.py'
          sync = read(sync_path)
          sync = re.sub(r'(?<!\\)\\frac', lambda _m: r'\\frac', sync)
          write(sync_path, sync)

          repro = read('docs/reproducibility.md').replace('\x0c', '\\f')
          write('docs/reproducibility.md', repro)

          # 5. Keep first-reader surfaces compact, but expose precise audit routes.
          readme = read('README.md')
          anchor = 'The current public theorem frontier is **P88**. The formal release remains **v0.82.0**.\n'
          addition = '''\nThe public record contains **88 proposition-level results**, organized from P1 through P88 with explicit dependency branches. The README stays intentionally compact; the complete proof, provenance, implementation, test, and figure record lives on the deeper audit surfaces below.\n\n**Audit routes:** [Research navigation](docs/research_navigation.md) · [Theorem roadmap](docs/theorem_roadmap.md) · [Detailed proposition record](docs/detailed_proposition_record.md) · [Equation and citation map](docs/equation_and_citation_map.md) · [Citation policy](docs/citation_and_reference_policy.md) · [Reference audit](docs/reference_audit.md) · [Foundational bibliography](docs/foundational_physics_mathematics_bibliography.md) · [Literature map](docs/literature_map.md) · [Fundamental theory references](docs/fundamental_theory_references.bib) · [Calibration and optimization frontier](docs/calibration_optimization_frontier_p61_p70.md) · [Quantum foundations and bridge test](docs/quantum_foundations_and_bridge_test.md) · [Website visual atlas](website/visual-atlas.html).\n'''
          if addition.strip() not in readme:
              if anchor not in readme:
                  raise SystemExit('README frontier anchor not found')
              readme = readme.replace(anchor, anchor + addition, 1)
          write('README.md', readme)

          start = read('START_HERE.md')
          start_anchor = 'The public theorem frontier is **P88**. The formal release is **v0.82.0**.'
          start_add = ' The public record contains **88 proposition-level results**.'
          if start_add.strip() not in start:
              if start_anchor not in start:
                  raise SystemExit('START_HERE frontier anchor not found')
              start = start.replace(start_anchor, start_anchor + start_add, 1)
          write('START_HERE.md', start)

          # 6. Research Navigation is the appropriate deep surface for the full
          # proposition index. Generate it from proposition documents, not by hand.
          nav_path = 'docs/research_navigation.md'
          nav = read(nav_path)
          nav = nav.replace('The public theorem frontier is **P88**. The formal release is **v0.82.0**.',
                            'The current documented theorem frontier is **P88**. The formal release is **v0.82.0**.')
          if '[Start Here](../START_HERE.md)' not in nav:
              nav = nav.replace('The current documented theorem frontier is **P88**. The formal release is **v0.82.0**. The final bridge from physical description to experience remains open.',
                                'The current documented theorem frontier is **P88**. The formal release is **v0.82.0**. The final bridge from physical description to experience remains open. First-time readers should begin with **[Start Here](../START_HERE.md)**.')

          prop_re = re.compile(r'proposition_(\d+)_.*\.md$')
          propositions = {}
          for path in sorted((root / 'docs').glob('proposition_*_*.md')):
              m = prop_re.fullmatch(path.name)
              if not m:
                  continue
              n = int(m.group(1))
              text = path.read_text(encoding='utf-8')
              heading = next((line[2:].strip() for line in text.splitlines() if line.startswith('# ')), path.stem)
              heading = re.sub(rf'^(?:Proposition\s+{n}|P{n})\s*[:.\-–—]?\s*', '', heading, flags=re.I).strip()
              if heading:
                  heading = heading[0].upper() + heading[1:]
              propositions[n] = (heading, path.name)
          if sorted(propositions) != list(range(1, 89)):
              raise SystemExit(f'Expected proposition documents P1-P88, found {sorted(propositions)}')

          rows = [
              '## Complete proposition index',
              '',
              'This deep audit index intentionally lists every proposition. The first-reader pages remain compact.',
              '',
              '| Result | Proposition record |',
              '| --- | --- |',
          ]
          for n in range(1, 89):
              title, filename = propositions[n]
              rows.append(f'| P{n} | [{title}]({filename}) |')
          block = '\n'.join(rows) + '\n\n---\n'
          marker = '## Complete proposition index'
          if marker in nav:
              start_i = nav.index(marker)
              next_i = nav.find('\n## ', start_i + len(marker))
              if next_i == -1:
                  raise SystemExit('Could not delimit existing proposition index')
              nav = nav[:start_i] + block + nav[next_i+1:]
          else:
              insert_at = nav.index('## Audit the current frontier without searching folders')
              nav = nav[:insert_at] + block + '\n' + nav[insert_at:]
          write(nav_path, nav)

          # 7. Lineage source integrity and explicit scientific boundary.
          website_figures = root / 'website' / 'figures'
          website_figures.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(root / 'docs' / 'figures' / 'research_architecture.svg',
                          website_figures / 'research_architecture.svg')

          lineage = read('website/research-lineage.html')
          boundary = 'Bridge remains an independently testable open problem.'
          if boundary not in lineage:
              needle = 'A recovered subsystem is not automatically a conscious subject.'
              if needle not in lineage:
                  raise SystemExit('Research lineage boundary anchor not found')
              lineage = lineage.replace(needle, needle + ' ' + boundary, 1)
          write('website/research-lineage.html', lineage)

          app = read('website/app.js')
          if 'Research I → Research II' not in app:
              app = app.replace("label: 'Research lineage',",
                                "label: 'Research I → Research II → Research III',", 1)
          write('website/app.js', app)

          # Hard guards for the repair itself.
          for path in root.rglob('*'):
              if path.is_file() and path.suffix.lower() in {'.md', '.py', '.html', '.cff', '.bib'}:
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if '\x0c' in text:
                      raise SystemExit(f'Form-feed remains in {path}')
          assert 'Current documented theorem frontier: P88.' in read('CITATION.cff')
          assert 'Current documented theorem frontier: P88.' in read('CITATION.bib')
          assert '## Current theorem frontier: P88' in read('CITATION.md')
          assert 'Complete P1 to P88 chronology' in read('docs/detailed_proposition_record.md')
          assert read('docs/research_navigation.md').count('| P88 |') == 1
          assert (root / 'website/figures/research_architecture.svg').exists()
          PY
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate repaired contracts
        run: |
          python -m py_compile scripts/synchronize_p88_reader_frontier_phrases.py
          python -m pytest -q \
            tests/test_latex_source_integrity.py \
            tests/test_citation_surface.py::test_machine_readable_citation_metadata_has_preferred_research_citation \
            tests/test_citation_surface.py::test_bibtex_and_citation_guide_are_present_and_version_aligned \
            tests/test_main_page_visual_paper.py::test_detailed_proposition_chronology_is_externalized \
            tests/test_document_link_integrity.py::test_reader_navigation_exposes_the_complete_theorem_chain \
            tests/test_metric_switching_publication.py::test_p54_is_in_roadmap_navigation_and_equation_map \
            tests/test_reader_documentation_consistency.py \
            tests/test_website_link_integrity.py \
            tests/test_website_research_lineage.py::test_lineage_preserves_scientific_boundary_between_projects \
            tests/test_website_research_lineage.py::test_global_website_navigation_includes_research_lineage
          python scripts/verify_repository.py
          git diff --check
      - name: Commit publication contract repair
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "Publication contracts already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md START_HERE.md CITATION.cff CITATION.bib CITATION.md \
            docs/detailed_proposition_record.md docs/reproducibility.md docs/research_navigation.md \
            scripts/synchronize_p88_reader_frontier_phrases.py \
            website/app.js website/research-lineage.html website/figures/research_architecture.svg
          git commit -m "Repair P88 publication and audit contracts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
