name: p83-publication-cleanup

on:
  push:
    branches:
      - research/p83-exact-projection-parity
    paths:
      - scripts/cleanup_p83_publication.py
      - .github/workflows/p83-publication-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout P83 branch
        uses: actions/checkout@v4
        with:
          ref: research/p83-exact-projection-parity
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Apply publication cleanup
        run: python scripts/cleanup_p83_publication.py

      - name: Validate changed text
        run: |
          python scripts/normalize_typography.py --check
          git diff --check

      - name: Remove one-shot cleanup machinery
        run: |
          rm scripts/cleanup_p83_publication.py
          rm .github/workflows/p83-publication-cleanup.yml

      - name: Commit cleaned publication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Polish P83 publication history and navigation"
          git push origin HEAD:research/p83-exact-projection-parity
