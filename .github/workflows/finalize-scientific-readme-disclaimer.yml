name: finalize-scientific-readme-disclaimer

on:
  push:
    branches:
      - professional-scientific-main-page
    paths:
      - scripts/finalize_scientific_readme_disclaimer.py
      - .github/workflows/finalize-scientific-readme-disclaimer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: professional-scientific-main-page
          fetch-depth: 0
      - name: Patch README disclaimer
        run: python scripts/finalize_scientific_readme_disclaimer.py
      - name: Validate focused change
        run: |
          grep -Fq 'not treated as established scientific facts' README.md
          git diff --check
      - name: Commit README patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: strengthen speculative-source disclaimer"
          git push origin HEAD:professional-scientific-main-page
