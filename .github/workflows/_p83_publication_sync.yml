name: p83-publication-integration

on:
  push:
    branches:
      - p83-signed-cylinder-contrast

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout P83 branch
        uses: actions/checkout@v4
        with:
          ref: p83-signed-cylinder-contrast
          fetch-depth: 0

      - name: Set up exact reference Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install exact reproducibility environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements-reproducibility.txt

      - name: Synchronize P83 publication surfaces
        run: python scripts/_p83_publication_sync.py

      - name: Regenerate deterministic computational figures
        run: python scripts/generate_all_figures.py

      - name: Validate candidate before commit
        run: |
          python -m pytest
          python -m ruff check .
          python scripts/generate_all_figures.py --validate-only
          python scripts/verify_repository.py

      - name: Commit synchronized candidate locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No publication changes to commit.'
          else
            git commit -m 'Integrate P83 v0.83.0 publication surfaces'
          fi

      - name: Run exact end-to-end reproducibility audit
        run: python scripts/reproducibility_audit.py

      - name: Push validated P83 candidate
        run: git push origin HEAD:p83-signed-cylinder-contrast
