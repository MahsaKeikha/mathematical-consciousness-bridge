name: fix-p32-integrator-once

on:
  push:
    branches:
      - p32-delay-quotient-compatibility
    paths:
      - .github/workflows/fix-p32-integrator-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: p32-delay-quotient-compatibility
          fetch-depth: 0

      - name: Normalize generated release-consistency test imports
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/integrate_p32_release.py')
          text = path.read_text(encoding='utf-8')
          old = "Path(\"tests/test_release_metadata_consistency.py\").write_text(r'''from pathlib import Path\nimport re"
          new = "Path(\"tests/test_release_metadata_consistency.py\").write_text(r'''import re\nfrom pathlib import Path"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one generated import marker, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit import-order correction
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add .github/integrate_p32_release.py
          git commit -m "Fix P32 release consistency test imports"
          git push origin HEAD:p32-delay-quotient-compatibility
