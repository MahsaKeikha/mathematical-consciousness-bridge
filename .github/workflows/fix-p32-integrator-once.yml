name: fix-p32-integrator-once

on:
  push:
    branches:
      - p32-delay-quotient-compatibility
    paths:
      - .github/workflows/fix-p32-integrator-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: p32-delay-quotient-compatibility
          fetch-depth: 0

      - name: Correct guarded README theorem marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/integrate_p32_release.py')
          text = path.read_text(encoding='utf-8')
          old = '# 7. Theorem roadmap - P1 through P29'
          new = '# 7. Theorem roadmap - P1 through P31'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one stale theorem marker, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit marker correction
        run: |
          git config user.name "Mahsa Keikha"
          git config user.email "mahsa.keikha@gmail.com"
          git add .github/integrate_p32_release.py
          git commit -m "Fix P32 release integration roadmap marker"
          git push origin HEAD:p32-delay-quotient-compatibility
