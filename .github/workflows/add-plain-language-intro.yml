name: add-plain-language-intro

on:
  push:
    branches: ["plain-language-introduction"]
    paths:
      - "scripts/add_plain_language_intro.py"
      - ".github/workflows/add-plain-language-intro.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plain-language-introduction
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/add_plain_language_intro.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_main_page_visual_paper.py tests/test_release_metadata_consistency.py
      - run: ruff check scripts/add_plain_language_intro.py
      - name: Commit README introduction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Add plain-language project introduction"
            git push origin HEAD:plain-language-introduction
          fi
