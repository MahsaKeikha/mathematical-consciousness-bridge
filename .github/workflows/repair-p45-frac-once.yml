name: repair-p45-frac-once

on:
  push:
    branches:
      - p45-shared-preparation-graph-allocation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: p45-shared-preparation-graph-allocation
          fetch-depth: 0

      - name: Repair P45 fraction commands
        run: python .github/repair_p45_frac_once.py

      - name: Remove one-time scaffolding
        run: |
          rm .github/repair_p45_frac_once.py
          rm .github/workflows/repair-p45-frac-once.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/proposition_45_shared_preparation_graph_allocation.md .github
          git commit -m "Repair P45 fraction commands"
          git push origin p45-shared-preparation-graph-allocation
