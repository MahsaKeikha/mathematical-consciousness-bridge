name: integrate-p25-once

on:
  push:
    branches:
      - p25-directed-influence-scale-certification
    paths:
      - .github/integrate_p25_release.py
      - .github/workflows/integrate-p25-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: p25-directed-influence-scale-certification
          fetch-depth: 0

      - name: Apply P25 release integration
        run: |
          sed -i 's/^p18_marker = """/p18_marker = r"""/' .github/integrate_p25_release.py
          python .github/integrate_p25_release.py

      - name: Remove one-time integration scaffolding before validation
        run: |
          rm .github/integrate_p25_release.py
          rm .github/workflows/integrate-p25-once.yml

      - name: Validate on Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install and test on Python 3.10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and test on Python 3.11
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test on Python 3.12
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Commit verified P25 release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate P25 directed-influence scale certification"
          git push origin HEAD:p25-directed-influence-scale-certification
