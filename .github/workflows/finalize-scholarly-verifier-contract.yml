name: finalize-scholarly-verifier-contract

on:
  push:
    paths:
      - ".github/workflows/finalize-scholarly-verifier-contract.yml"
      - "scripts/finalize_scholarly_verifier_contract.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote scholarly files into permanent verifier
        run: python scripts/finalize_scholarly_verifier_contract.py
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run scholarly and publication tests
        run: >-
          python -m pytest
          tests/test_scholarly_provenance_surface.py
          tests/test_reader_experience.py
          tests/test_reference_and_prose_style.py
          tests/test_typography_policy.py
          tests/test_website_build.py
          tests/test_website_link_integrity.py
      - name: Verify repository contract
        run: python scripts/verify_repository.py
      - name: Check patch formatting
        run: git diff --check
      - name: Commit permanent scholarly verifier contract
        run: |
          if git diff --quiet -- scripts/verify_repository.py; then
            echo "No verifier changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_repository.py
          git commit -m "Make scholarly provenance part of repository verification"
          git push
