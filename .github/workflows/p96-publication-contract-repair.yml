name: p96-publication-contract-repair

on:
  push:
    branches: ["p96-selection-valid-holdout-stratification"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p96-selection-valid-holdout-stratification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -e ".[dev]"
      - name: Repair stale P95 publication contracts
        run: python scripts/repair_p96_publication_contracts.py
      - name: Finalize Research Map current-frontier wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("website/research-map.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "P95 remains a conditional model-rejection theorem and is the current drift-aware frontier under its declared finite-range dependence and common-marginal assumptions.",
              "P96 remains a conditional model-rejection theorem under its declared pilot-selection, frozen-plan, and independent-holdout assumptions. P95 remains the immediate drift-aware predecessor under its declared finite-range dependence and common-marginal assumptions.",
          )
          text = text.replace("Continue to the current P94 frontier", "Continue to the current P96 frontier")
          text = text.replace("visual-atlas.html#p94-frontier", "visual-atlas.html#p96-frontier")
          text = text.replace("See the P94 figure", "See the P96 figure")
          text = text.replace("docs/p94_equation_provenance.md", "docs/p96_equation_provenance.md")
          text = text.replace("Audit P94 provenance", "Audit P96 provenance")
          path.write_text(text.rstrip() + "\n", encoding="utf-8")
          PY
      - name: Validate repaired contracts
        run: |
          python -m pytest -q \
            tests/test_main_page_visual_paper.py \
            tests/test_p84_reader_presentation.py \
            tests/test_p92_reader_surface_coherence.py \
            tests/test_p94_reader_surface_coherence.py \
            tests/test_p95_reader_surface_coherence.py \
            tests/test_p96_reader_surface_coherence.py \
            tests/test_publication_contract_v2.py \
            tests/test_readme_research_orientation.py \
            tests/test_website_link_integrity.py \
            tests/test_website_research_orientation.py
          python scripts/sync_figure_publication.py --check
          python scripts/verify_repository.py
          rm -rf website-deploy
          python scripts/prepare_website.py --output website-deploy
          git diff --check
      - name: Commit repaired P96 contracts
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No repair changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair full P96 publication contracts"
          git push origin HEAD:p96-selection-valid-holdout-stratification
