name: promote-p94-publication

on:
  workflow_dispatch:
  push:
    branches:
      - p94-finite-range-dependent-sign-coherence
    paths:
      - "scripts/promote_p94_public_frontier.py"
      - "scripts/finalize_p94_publication.py"
      - "scripts/repair_p94_reader_contracts.py"
      - "scripts/fix_p94_generated_contracts.py"
      - ".github/workflows/promote-p94-publication.yml"

concurrency:
  group: promote-p94-publication
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p94-finite-range-dependent-sign-coherence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install exact repository environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-reproducibility.txt

      - name: Validate P93 citation baseline
        run: python scripts/fix_p94_generated_contracts.py pre

      - name: Apply P94 source publication migration
        run: python scripts/promote_p94_public_frontier.py

      - name: Repair generated P94 test contract
        run: python scripts/fix_p94_generated_contracts.py post

      - name: Finalize P94 publication contracts
        run: python scripts/finalize_p94_publication.py

      - name: Close residual P94 publication contracts
        run: python scripts/fix_p94_generated_contracts.py final

      - name: Regenerate canonical visual publication record
        run: python scripts/generate_all_figures.py

      - name: Validate promoted P94 publication state
        run: |
          python scripts/verify_frontier_publication.py
          python scripts/verify_repository.py
          python -m pytest -q \
            tests/test_finite_range_dependent_sign_coherence.py \
            tests/test_p94_reader_surface_coherence.py \
            tests/test_p93_reader_surface_coherence.py \
            tests/test_frontier_reader_narrative.py \
            tests/test_frontier_publication_consistency.py \
            tests/test_reader_documentation_consistency.py \
            tests/test_research_website_integrity.py \
            tests/test_figure_publication_sync.py \
            tests/test_figure_documentation_integrity.py \
            tests/test_website_research_orientation.py \
            tests/test_publication_contract_v2.py
          python -m pytest -q
          python -m ruff check .
          rm -rf _site website-deploy
          python scripts/prepare_website.py --source website --output _site
          python scripts/sync_figure_publication.py --check
          git diff --check
          rm -rf _site website-deploy

      - name: Reject accidental workflow mutation
        run: |
          test -z "$(git diff --name-only -- .github/workflows)"

      - name: Commit exact promoted state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No promotion changes to commit."
            exit 1
          fi
          git commit -m "Promote P94 public theorem frontier"
          git push origin HEAD:p94-finite-range-dependent-sign-coherence
