name: promote-p94-publication

on:
  workflow_dispatch:
  push:
    branches:
      - p94-finite-range-dependent-sign-coherence
    paths:
      - "scripts/promote_p94_public_frontier.py"
      - ".github/workflows/promote-p94-publication.yml"

concurrency:
  group: promote-p94-publication
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p94-finite-range-dependent-sign-coherence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install exact repository environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-reproducibility.txt
      - name: Apply P94 source publication migration
        run: python scripts/promote_p94_public_frontier.py
      - name: Repair exact publication markers and generic website builder
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          formal_path = root / 'docs/proposition_94_finite_range_dependent_sign_coherence.md'
          formal = formal_path.read_text(encoding='utf-8')
          wrong = 'certify_p94_temporal_pooling_no_go_exact()'
          right = 'certify_p94_temporal_drift_no_go_exact()'
          if formal.count(wrong) != 1:
              raise RuntimeError(f'formal P94 drift provenance marker count is {formal.count(wrong)}, expected 1')
          formal_path.write_text(formal.replace(wrong, right, 1), encoding='utf-8')

          home_path = root / 'website/index.html'
          home = home_path.read_text(encoding='utf-8')
          replacements = {
              '<strong>93</strong><span>proposition-level results</span>': '<strong>94</strong><span>proposition-level results</span>',
              'P93 current theorem frontier · v0.82.0': 'P94 current theorem frontier · v0.82.0',
              'Explore all 93 results': 'Explore all 94 results',
              'current P93 frontier': 'current P94 frontier',
              'sources.html#p93-source">P93 sources': 'sources.html#p94-source">P94 sources',
          }
          for old, new in replacements.items():
              if old not in home:
                  raise RuntimeError(f'homepage promotion marker missing: {old!r}')
              home = home.replace(old, new, 1)
          home_path.write_text(home, encoding='utf-8')

          map_path = root / 'website/research-map.html'
          research = map_path.read_text(encoding='utf-8')
          map_replacements = {
              'P71-P93 return': 'P71-P94 return',
              '<strong>93</strong><span>proposition-level results</span>': '<strong>94</strong><span>proposition-level results</span>',
              '<strong>P93</strong><span>current theorem frontier</span>': '<strong>P94</strong><span>current theorem frontier</span>',
              'P74-P93 continue': 'P74-P94 continue',
              '<span>6 · P73-P93</span>': '<span>6 · P73-P94</span>',
              'culminating in P92 exact global mixed-prevalence distance and the P93 finite-sample rejection handoff.': 'culminating in P92 exact global mixed-prevalence distance, the P93 IID finite-sample handoff, and P94 finite-range dependent rejection.',
              'P19 and P71-P93: from sufficiency to falsifiable target-model separation': 'P19 and P71-P94: from sufficiency to finite-range dependent target-model falsification',
              'href="index.html#p93-frontier">Continue to the current P93 frontier': 'href="index.html#p94-frontier">Continue to the current P94 frontier',
              'href="visual-atlas.html#p93-frontier">See the P93 figure': 'href="visual-atlas.html#p94-frontier">See the P94 figure',
              'docs/p93_equation_provenance.md">Audit P93 provenance': 'docs/p94_equation_provenance.md">Audit P94 provenance',
          }
          for old, new in map_replacements.items():
              if old not in research:
                  raise RuntimeError(f'research-map promotion marker missing: {old!r}')
              research = research.replace(old, new, 1)
          map_path.write_text(research, encoding='utf-8')

          verifier_path = root / 'scripts/verify_repository.py'
          verifier = verifier_path.read_text(encoding='utf-8')
          citation_old = 'if f"Current documented theorem frontier: {CURRENT_FRONTIER}" not in citation:\n        raise RuntimeError(f"CITATION.md does not declare {CURRENT_FRONTIER} as the current theorem frontier")'
          citation_new = 'if f"The current documented theorem frontier is **{CURRENT_FRONTIER}**." not in citation:\n        raise RuntimeError(f"CITATION.md does not declare {CURRENT_FRONTIER} as the current theorem frontier")'
          if citation_old not in verifier:
              raise RuntimeError('generic citation-integrity check was not found after P94 promotion')
          verifier = verifier.replace(citation_old, citation_new, 1)

          coverage_old = 'missing = [number for number in range(1, 94) if number not in covered]'
          coverage_new = 'frontier_number = int(CURRENT_FRONTIER.removeprefix("P"))\n    missing = [number for number in range(1, frontier_number + 1) if number not in covered]'
          if coverage_old not in verifier:
              raise RuntimeError('hard-coded proposition coverage range was not found')
          verifier = verifier.replace(coverage_old, coverage_new, 1)

          figure_old = '''    if not figure_path.endswith("p93_localized_sign_coherence_rejection.svg"):\n        raise RuntimeError("figure manifest does not point to the canonical P93 SVG")\n    figures = manifest.get("figures")\n    if not isinstance(figures, list) or len(figures) != 151:\n        raise RuntimeError("figure manifest does not contain the canonical 151 figures")'''
          figure_new = '''    frontier_number = int(CURRENT_FRONTIER.removeprefix("P"))\n    expected = sorted((ROOT / "docs" / "figures").glob(f"p{frontier_number}_*.svg"))\n    if len(expected) != 1:\n        raise RuntimeError(f"expected exactly one canonical {CURRENT_FRONTIER} SVG, found {expected}")\n    expected_path = expected[0].relative_to(ROOT).as_posix()\n    if figure_path != expected_path:\n        raise RuntimeError(\n            f"figure manifest current figure is {figure_path!r}, expected {expected_path!r}"\n        )\n    figures = manifest.get("figures")\n    canonical_count = len(list((ROOT / "docs" / "figures").rglob("*.svg")))\n    if not isinstance(figures, list) or len(figures) != canonical_count:\n        raise RuntimeError(\n            f"figure manifest contains {len(figures) if isinstance(figures, list) else 'invalid'} figures; "\n            f"canonical tree contains {canonical_count}"\n        )'''
          if figure_old not in verifier:
              raise RuntimeError('hard-coded P93 figure-manifest check was not found')
          verifier = verifier.replace(figure_old, figure_new, 1)

          atlas_old = '''    p93 = visual_atlas.index('id="p93-frontier"')\n    p92 = visual_atlas.index('id="p92-frontier"')\n    p91 = visual_atlas.index('id="p91-frontier"')\n    if not (p93 < p92 < p91):\n        raise RuntimeError("Visual Atlas does not lead with the current P93 figure")'''
          atlas_new = '''    frontier_number = int(CURRENT_FRONTIER.removeprefix("P"))\n    current_marker = f'id="p{frontier_number}-frontier"'\n    previous_marker = f'id="p{frontier_number - 1}-frontier"'\n    current_position = visual_atlas.index(current_marker)\n    previous_position = visual_atlas.index(previous_marker)\n    if current_position >= previous_position:\n        raise RuntimeError(\n            f"Visual Atlas does not lead P{frontier_number} ahead of P{frontier_number - 1}"\n        )'''
          if atlas_old not in verifier:
              raise RuntimeError('hard-coded P93 Visual Atlas ordering check was not found')
          verifier = verifier.replace(atlas_old, atlas_new, 1)
          verifier_path.write_text(verifier, encoding='utf-8')

          sync_path = root / 'scripts/synchronize_research_three_website.py'
          sync = sync_path.read_text(encoding='utf-8')
          old = 'CURRENT_HOME_MARKER = "<!-- current-frontier-home: P93 -->"'
          new = '''ROOT = Path(__file__).resolve().parents[1]\n\n\ndef _current_frontier_label() -> str:\n    verifier = (ROOT / "scripts" / "verify_repository.py").read_text(encoding="utf-8")\n    match = re.search(r'^CURRENT_FRONTIER = "(P\\d+)"$', verifier, flags=re.MULTILINE)\n    if match is None:\n        raise RuntimeError("could not determine current Research II frontier")\n    return match.group(1)\n\n\nCURRENT_FRONTIER_LABEL = _current_frontier_label()\nCURRENT_HOME_MARKER = f"<!-- current-frontier-home: {CURRENT_FRONTIER_LABEL} -->"'''
          if old not in sync:
              raise RuntimeError('Research III synchronizer P93 home marker missing')
          sync = sync.replace(old, new, 1)
          sync_path.write_text(sync, encoding='utf-8')

          prep_path = root / 'scripts/prepare_website.py'
          prep = prep_path.read_text(encoding='utf-8')
          prep = prep.replace('    """Require the deployed site to be internally consistent with P93."""', '    """Require the deployed site to match the declared current frontier."""')
          prep = prep.replace('"website build is missing the current P93 theorem figure: "', '"website build is missing the current theorem figure: "')
          prep = prep.replace('"Visual Atlas does not use the bundled P93 theorem figure"', '"Visual Atlas does not use the bundled current theorem figure"')
          prep = prep.replace('"Homepage does not use the bundled P93 theorem figure"', '"Homepage does not use the bundled current theorem figure"')
          prep = prep.replace('_require_once(visual_atlas, \'id="p93-frontier"\', "Visual Atlas")', '_require_once(visual_atlas, \'id="p94-frontier"\', "Visual Atlas")')
          prep = prep.replace('_require_once(homepage, \'id="p93-frontier"\', "Homepage")', '_require_once(homepage, \'id="p94-frontier"\', "Homepage")')
          prep = prep.replace('"Homepage Project at a glance is not synchronized to 93/P93"', '"Homepage Project at a glance is not synchronized to the current frontier"')
          prep = prep.replace('"<strong>93</strong><span>proposition-level results</span>"', '"<strong>94</strong><span>proposition-level results</span>"')
          prep = prep.replace('"<strong>P93</strong><span>current theorem frontier</span>"', '"<strong>P94</strong><span>current theorem frontier</span>"')
          prep = prep.replace('"prepared website with Research II P93 and Research III "', '"prepared website with Research II P94 and Research III "')
          prep_path.write_text(prep, encoding='utf-8')

          contract_path = root / 'tests/test_publication_contract_v2.py'
          contract = contract_path.read_text(encoding='utf-8')
          contract = contract.replace('"93</strong><span>proposition-level results"', '"94</strong><span>proposition-level results"')
          contract = contract.replace('"P93 current theorem frontier · v0.82.0"', '"P94 current theorem frontier · v0.82.0"')
          contract = contract.replace('"Explore all 93 results"', '"Explore all 94 results"')
          contract_path.write_text(contract, encoding='utf-8')
          PY
      - name: Regenerate canonical visual publication record
        run: python scripts/generate_all_figures.py
      - name: Validate promoted P94 publication state
        run: |
          python scripts/verify_frontier_publication.py
          python scripts/verify_repository.py
          python -m pytest -q \
            tests/test_finite_range_dependent_sign_coherence.py \
            tests/test_p94_reader_surface_coherence.py \
            tests/test_p93_reader_surface_coherence.py \
            tests/test_frontier_reader_narrative.py \
            tests/test_frontier_publication_consistency.py \
            tests/test_reader_documentation_consistency.py \
            tests/test_research_website_integrity.py \
            tests/test_figure_publication_sync.py \
            tests/test_figure_documentation_integrity.py \
            tests/test_website_research_orientation.py \
            tests/test_publication_contract_v2.py
          python -m pytest -q
          python -m ruff check .
          rm -rf _site website-deploy
          python scripts/prepare_website.py --source website --output _site
          python scripts/sync_figure_publication.py --check
          git diff --check
          rm -rf _site website-deploy
      - name: Commit exact promoted state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No promotion changes to commit."
            exit 1
          fi
          git commit -m "Promote P94 public theorem frontier"
          git push origin HEAD:p94-finite-range-dependent-sign-coherence
