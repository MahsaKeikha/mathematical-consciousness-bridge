name: integrate-p31-once

on:
  push:
    branches:
      - p31-intervention-quotient-compatibility
    paths:
      - .github/integrate_p31_release.py
      - .github/workflows/integrate-p31-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: p31-intervention-quotient-compatibility
          fetch-depth: 0

      - name: Apply P31 release integration
        run: python .github/integrate_p31_release.py

      - name: Remove one-time integration scaffolding before validation
        run: |
          rm .github/integrate_p31_release.py
          rm .github/workflows/integrate-p31-once.yml

      - name: Validate on Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install and test on Python 3.10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test on Python 3.11
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test on Python 3.12
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Commit verified P31 release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate P31 intervention quotient compatibility"
          git push origin HEAD:p31-intervention-quotient-compatibility
