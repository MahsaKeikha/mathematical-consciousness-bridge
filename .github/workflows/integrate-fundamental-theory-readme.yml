name: integrate-fundamental-theory-readme

on:
  workflow_dispatch:
  push:
    branches:
      - fundamental-theory-consciousness
    paths:
      - scripts/integrate_fundamental_theory_readme.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/integrate_fundamental_theory_readme.py
      - name: Commit README integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README is already integrated."
          else
            git commit -m "Integrate fundamental-theory consciousness program into main paper"
            git push origin HEAD:${{ github.ref_name }}
          fi
