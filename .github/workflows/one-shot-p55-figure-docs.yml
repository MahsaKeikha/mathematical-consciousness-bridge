name: one-shot-p55-figure-docs

on:
  push:
    branches: [visual-polish-p55]
    paths:
      - .github/workflows/one-shot-p55-figure-docs.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-polish-p55
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Integrate permanent P55 figure record and catalog row
        run: |
          python - <<'PY'
          from pathlib import Path

          records = Path("scripts/conceptual_figure_records.py")
          text = records.read_text(encoding="utf-8")
          marker = '    "docs/figures/p56_moving_start_metric_reoptimization_stability.svg": {'
          if '"docs/figures/p55_pruning_aware_switching_monotonicity.svg"' not in text:
              record = '''    "docs/figures/p55_pruning_aware_switching_monotonicity.svg": {
                  "title": "P55 pruning-aware metric switching-cost monotonicity",
                  "description": (
                      "What this figure shows: P55 proves deterministic monotonicity of the exact P54 execution optimum when a valid sequential update makes every residual demand weakly smaller, while acquisition cost, switching metric, and setup start remain fixed. Metric shortcutting makes the optimal route value nonincreasing under support deletion, so total cost release decomposes exactly into nonnegative acquisition release plus nonnegative route release. "
                      "How to read it: the three upper cards specify the fixed comparison regime, the earlier residual state, and the later componentwise-smaller state. Their attached arrows feed the central support-deletion theorem and exact cost-release identity. The lower cards separate the support-preserving case, the computable shortcut lower certificate, and the sequential experimental implication. "
                      "Main takeaway: every released residual sample saves its acquisition cost, while deleting a preparation from the positive-demand support can add further switching savings. This monotonicity depends on a fixed metric and fixed start."
                  ),
                  "status": (
                      "Deterministic scheduling theorem conditional on valid residual demands and valid pruning decisions. It does not justify pruning, prove statistical minimaxity of the underlying thresholds, identify a route or graph quantity with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness."
                  ),
              },
          '''
              if marker not in text:
                  raise SystemExit("P56 insertion marker not found")
              records.write_text(text.replace(marker, record + marker, 1), encoding="utf-8")

          catalog = Path("docs/figure_catalog.md")
          lines = catalog.read_text(encoding="utf-8").splitlines()
          replacement = "| [P55 pruning-aware metric switching-cost monotonicity](figures/p55_pruning_aware_switching_monotonicity.svg) | What this figure shows: P55 proves deterministic monotonicity of the exact P54 execution optimum when a valid sequential update makes every residual demand weakly smaller, while acquisition cost, switching metric, and setup start remain fixed. Metric shortcutting makes the optimal route value nonincreasing under support deletion, so total cost release decomposes exactly into nonnegative acquisition release plus nonnegative route release. How to read it: the three upper cards specify the fixed comparison regime, the earlier residual state, and the later componentwise-smaller state. Their attached arrows feed the central support-deletion theorem and exact cost-release identity. The lower cards separate the support-preserving case, the computable shortcut lower certificate, and the sequential experimental implication. Main takeaway: every released residual sample saves its acquisition cost, while deleting a preparation from the positive-demand support can add further switching savings. This monotonicity depends on a fixed metric and fixed start. | Deterministic scheduling theorem conditional on valid residual demands and valid pruning decisions. It does not justify pruning, prove statistical minimaxity of the underlying thresholds, identify a route or graph quantity with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness. | [Proposition 55](proposition_55_pruning_aware_switching_monotonicity.md) |"
          found = False
          for index, line in enumerate(lines):
              if "(figures/p55_pruning_aware_switching_monotonicity.svg)" in line:
                  lines[index] = replacement
                  found = True
                  break
          if not found:
              raise SystemExit("P55 catalog row not found")
          catalog.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - run: pytest -q
      - run: ruff check .
      - name: Commit audited P55 integration and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-p55-figure-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate P55 figure documentation metadata"
          git push origin HEAD:visual-polish-p55
