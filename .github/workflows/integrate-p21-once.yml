name: integrate-p21-once

on:
  push:
    branches: [p21-descriptor-refinement-residual-persistence]
    paths:
      - .github/workflows/integrate-p21-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply P21 release integration
        run: python .github/integrate_p21_release.py

      - name: Remove one-time integration scaffolding before validation
        run: |
          rm .github/workflows/integrate-p21-once.yml
          rm .github/integrate_p21_release.py

      - name: Validate on Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Commit verified P21 release state
        run: |
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find src -maxdepth 1 -type d -name '*.egg-info' -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate P21 descriptor refinement and residual persistence"
          git push origin HEAD:p21-descriptor-refinement-residual-persistence
