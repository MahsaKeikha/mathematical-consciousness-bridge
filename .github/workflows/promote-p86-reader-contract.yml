name: promote-p86-reader-contract

on:
  push:
    branches: ["research/p86-four-event-parity-functional"]
    paths:
      - ".github/workflows/promote-p86-reader-contract.yml"
      - "scripts/promote_p86_reader_contract.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote P86 publication contract
        run: python scripts/promote_p86_reader_contract.py
      - name: Enforce explicit README frontier sentence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          sentence = "The theorem frontier is P86."
          if sentence not in text:
              marker = "| Physical-to-experiential bridge | **Open** |"
              if marker not in text:
                  raise RuntimeError("README research-status table marker missing")
              text = text.replace(marker, marker + "\n\n" + sentence, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Verify promoted reader contract
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_frontier_reader_narrative.py tests/test_reader_documentation_consistency.py tests/test_public_reader_navigation_frontier.py tests/test_readme_research_orientation.py tests/test_research_website_integrity.py tests/test_citation_surface.py tests/test_p86_research_integration.py
          python scripts/verify_repository.py
      - name: Check formatting
        run: git diff --check
      - name: Commit synchronized P86 publication surfaces
        run: |
          if git diff --quiet; then
            echo "P86 reader contract already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md START_HERE.md CITATION.cff CITATION.md CITATION.bib docs website scripts/verify_repository.py
          git commit -m "Promote P86 across publication surfaces"
          git push origin HEAD:research/p86-four-event-parity-functional
