name: p96-publication-promotion

on:
  push:
    branches: ["p96-selection-valid-holdout-stratification"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p96-selection-valid-holdout-stratification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-reproducibility.txt
      - name: Promote P96 reader and publication sources
        run: |
          python - <<'PY'
          import re
          import runpy
          from pathlib import Path

          original_sub = re.sub

          def literal_sub(pattern, replacement, string, count=0, flags=0):
              if isinstance(replacement, str):
                  return original_sub(
                      pattern,
                      lambda _match: replacement,
                      string,
                      count=count,
                      flags=flags,
                  )
              return original_sub(
                  pattern,
                  replacement,
                  string,
                  count=count,
                  flags=flags,
              )

          re.sub = literal_sub
          runpy.run_path("scripts/promote_p96_public_frontier.py", run_name="__main__")

          path = Path("docs/research_navigation.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "**Current frontier:** [P95: Drift-Aware Stratified Sign-Coherence Rejection](proposition_95_drift_aware_stratified_sign_coherence.md)",
              "**Immediate predecessor:** [P95: Drift-Aware Stratified Sign-Coherence Rejection](proposition_95_drift_aware_stratified_sign_coherence.md)",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Regenerate and synchronize canonical visual record
        run: |
          python scripts/generate_all_figures.py
          python scripts/sync_figure_publication.py
      - name: Validate P96 theorem and publication contracts
        run: |
          python -m pytest -q \
            tests/test_selection_valid_holdout_stratification.py \
            tests/test_p96_reader_surface_coherence.py \
            tests/test_p95_reader_surface_coherence.py \
            tests/test_frontier_reader_narrative.py \
            tests/test_figure_publication_sync.py \
            tests/test_frontier_publication_consistency.py \
            tests/test_latex_source_integrity.py
          python -m ruff check src/consciousness_bridge/selection_valid_holdout_stratification.py tests/test_selection_valid_holdout_stratification.py tests/test_p96_reader_surface_coherence.py tests/test_p95_reader_surface_coherence.py
          python scripts/sync_figure_publication.py --check
          python scripts/verify_repository.py
          rm -rf website-deploy
          python scripts/prepare_website.py --output website-deploy
          git diff --check
      - name: Commit synchronized P96 publication state
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No publication changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize P96 public theorem frontier"
          git push origin HEAD:p96-selection-valid-holdout-stratification
