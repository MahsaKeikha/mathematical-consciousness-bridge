name: update-p64-reader-navigation

on:
  push:
    branches:
      - documentation-coherence-p64-navigation
    paths:
      - scripts/update_p64_reader_navigation.py
      - .github/workflows/update-p64-reader-navigation.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: documentation-coherence-p64-navigation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update README navigation
        run: python scripts/update_p64_reader_navigation.py
      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update public reader navigation through P64"
          git push origin HEAD:documentation-coherence-p64-navigation
