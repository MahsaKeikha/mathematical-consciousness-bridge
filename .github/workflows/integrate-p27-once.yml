name: integrate-p27-once

on:
  push:
    branches:
      - p27-partition-lattice-node-aggregation
    paths:
      - .github/integrate_p27_release.py
      - .github/workflows/integrate-p27-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: p27-partition-lattice-node-aggregation
          fetch-depth: 0

      - name: Apply P27 release integration
        run: python .github/integrate_p27_release.py

      - name: Remove one-time integration scaffolding before validation
        run: |
          rm .github/integrate_p27_release.py
          rm .github/workflows/integrate-p27-once.yml

      - name: Validate on Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install and test on Python 3.10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and test on Python 3.11
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test on Python 3.12
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Commit verified P27 release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate P27 partition-lattice node aggregation"
          git push origin HEAD:p27-partition-lattice-node-aggregation

# Rerun after tightening the canonical P27 figure copy.
