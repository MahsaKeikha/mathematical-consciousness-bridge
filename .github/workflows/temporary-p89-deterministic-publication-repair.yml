name: temporary-p89-deterministic-publication-repair

on:
  push:
    branches: ["p89-complete-linear-parity-duality"]
    paths:
      - ".github/workflows/temporary-p89-deterministic-publication-repair.yml"
      - "scripts/repair_p89_deterministic_publication.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-p89-deterministic-publication-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p89-complete-linear-parity-duality
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install exact development and figure environments
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-figures.txt
      - name: Repair deterministic publication sources
        run: python scripts/repair_p89_deterministic_publication.py
      - name: Regenerate canonical visual publication record
        run: python scripts/generate_all_figures.py
      - name: Validate P89 publication and reader contracts
        run: |
          python -m pytest -q \
            tests/test_complete_linear_parity_duality.py \
            tests/test_documentation_punctuation.py \
            tests/test_figure_publication_sync.py \
            tests/test_figure_documentation_integrity.py \
            tests/test_p89_reader_surface_coherence.py \
            tests/test_website_research_orientation.py \
            tests/test_website_link_integrity.py
          python scripts/sync_figure_publication.py --check
          python scripts/verify_repository.py
          git diff --check
          grep -q 'The most important boundary' website/start-here.html
          grep -q 'id="reader-primer"' website/start-here.html
          grep -q 'Six terms that make the rest of the project easier to follow' website/start-here.html
      - name: Require deterministic second regeneration
        run: |
          git add -A
          git diff --cached > /tmp/first-generation.patch
          git reset
          python scripts/generate_all_figures.py
          python scripts/sync_figure_publication.py --check
          git diff --check
      - name: Commit canonical P89 publication repair
        run: |
          if git diff --quiet; then
            echo "No publication repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/promote_p89_public_frontier.py docs/figure_catalog.md docs/figures figures website/start-here.html website/plain-language.html
          git commit -m "Canonicalize P89 deterministic publication generation"
          git fetch origin p89-complete-linear-parity-duality
          git rebase origin/p89-complete-linear-parity-duality
          git push origin HEAD:p89-complete-linear-parity-duality
