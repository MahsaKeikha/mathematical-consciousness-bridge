name: Fix theorem roadmap opening typography

on:
  push:
    branches: [visual-audit-theorem-roadmap]
    paths:
      - .github/workflows/fix-theorem-roadmap-opening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-audit-theorem-roadmap
      - name: Tighten opening-card copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/figures/theorem_roadmap.svg')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'P2-P3 empirical equivalence and identifiability': 'P2-P3 empirical equivalence and identity tests',
              'Cross-system coupling is a factorization defect.': 'Cross-system coupling breaks factorization.',
              'P17 coarse-graining contracts distinguishability.': 'P17 coarse-graining contracts distinctions.',
              'P18 reconstruction bounds scale distortion.': 'P18 reconstruction bounds distortion.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing guarded source phrase: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/figures/theorem_roadmap.svg
          git commit -m 'Tighten theorem roadmap opening-card copy'
          git push origin HEAD:visual-audit-theorem-roadmap
