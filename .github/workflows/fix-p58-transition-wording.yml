name: fix-p58-transition-wording

on:
  push:
    branches: ["p58-finite-data-metric-uncertainty"]
    paths: [".github/workflows/fix-p58-transition-wording.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p58-finite-data-metric-uncertainty
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Correct route-transition multiplicity wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/proposition_58_finite_data_metric_uncertainty.md")
          text = path.read_text(encoding="utf-8")
          old = "denote the set of transition edges traversed by that route, including the initial edge from a supplied setup state \\(s\\) to \\(v_1\\)."
          new = "denote the ordered transition sequence traversed by that route, with multiplicity, including the initial transition from a supplied setup state \\(s\\) to \\(v_1\\)."
          if old not in text:
              raise SystemExit("expected P58 transition wording not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/proposition_58_finite_data_metric_uncertainty.md
          git commit -m "Clarify P58 route-transition multiplicity"
          git push origin HEAD:p58-finite-data-metric-uncertainty
