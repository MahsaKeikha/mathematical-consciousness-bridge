name: validate-research-three-website

on:
  push:
    paths:
      - "website/**"
      - "docs/**"
      - "CITATION.md"
      - ".github/workflows/validate-research-three-website.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p91-mixed-prevalence-rank-two-flattening
          fetch-depth: 0

      - name: Normalize final P91 publication surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          path = "CITATION.md"
          text = read(path)
          stale = (
              "## Current theorem frontier: P91\n\n"
              "The current documented theorem frontier is **P90**, an exact nonlinear rank-one slice separation theorem for the declared strict P75 box.\n\n"
              "- Proof: [`proposition_90_exact_nonlinear_rank_one_separation.md`](docs/proposition_90_exact_nonlinear_rank_one_separation.md)\n"
              "- Equation provenance: [`p90_equation_provenance.md`](docs/p90_equation_provenance.md)\n"
              "- Implementation: [`exact_nonlinear_rank_one_separation.py`](src/consciousness_bridge/exact_nonlinear_rank_one_separation.py)\n"
              "- Exact tests: [`test_exact_nonlinear_rank_one_separation.py`](tests/test_exact_nonlinear_rank_one_separation.py)\n\n"
              "P90 is a conditional model-separation result. It does not identify consciousness or establish nonphysicality.\n\n"
          )
          text = text.replace(stale, "")
          write(path, text)

          path = "docs/claim_source_matrix.md"
          text = read(path).replace(
              "| Current frontier | P91 is the current Research II theorem frontier | repository publication status | [P90 proof](proposition_90_exact_nonlinear_rank_one_separation.md), implementation, tests, provenance, figure, and frontier publication tests | P89, P88, P87, and earlier propositions remain historical certified frontiers, not current ones |",
              "| Current frontier | P91 is the current Research II theorem frontier | repository publication status | [P91 proof](proposition_91_mixed_prevalence_rank_two_flattening_separation.md), [P91 provenance](p91_equation_provenance.md), implementation, exact tests, figure, and frontier publication tests | P90 and earlier propositions remain historical certified frontiers, not current ones |",
          )
          write(path, text)

          path = "website/research-map.html"
          text = read(path)
          replacements = (
              ('content="Scientific dependency map of the Mathematical Consciousness Bridge through Proposition 88."', 'content="Scientific dependency map of the Mathematical Consciousness Bridge through Proposition 91."'),
              ('<h1>Eighty-eight results, one dependency-aware scientific program</h1>', '<h1>Ninety-one results, one dependency-aware scientific program</h1>'),
              ('<p class="eyebrow">Current exact frontier · P87</p>', '<p class="eyebrow">Historical exact frontier · P87</p>'),
              ('<strong>Current Research II model-audit range: P75-P90.</strong>', '<strong>Current Research II model-audit range: P75-P91.</strong>'),
              ('<a href="index.html#p90-frontier">Current frontier</a>', '<a href="visual-atlas.html#p90-frontier">Historical P90 figure</a>'),
          )
          for old, new in replacements:
              text = text.replace(old, new)
          p90_start = text.find('<section id="p90-research-map"')
          html_end = text.find('</html>')
          if p90_start != -1 and html_end != -1 and p90_start > html_end:
              trailing = text[p90_start:].strip()
              text = text[:p90_start].rstrip() + "\n"
              if "</main>" not in text:
                  raise RuntimeError("Research Map has no </main> insertion point")
              text = text.replace("</main>", trailing + "\n\n</main>", 1)
          write(path, text)

          path = "website/visual-atlas.html"
          text = read(path).replace(
              '<!-- current-frontier-visual: P90 -->',
              '<!-- current-frontier-visual: P91 -->',
          )
          write(path, text)

          path = "website/plain-language.html"
          text = read(path).replace(
              "A 90-result sufficiency and falsification architecture",
              "A 91-result sufficiency and falsification architecture",
          )
          write(path, text)

          path = "docs/theorem_roadmap.md"
          text = read(path)
          text = text.replace(
              "## After P91\n\nP89 closes the complete **linear** parity-functional class on the eleven declared parity coordinates. A future P92 claim should therefore address a different gap, such as nonlinear joint parity constraints, additional observable families, or a tighter use of the nonlinear P75 image, and must include a certificate not already implied by P89.",
              "## Beyond the complete P89 linear frontier\n\nP89 closes the complete **linear** parity-functional class on the eleven declared parity coordinates. P90 and P91 move beyond that closure by using nonlinear algebraic structure of the declared P75 model image.",
              1,
          )
          text = text.replace(
              "## After P91\n\nA future P91 result should address nonlinear structure beyond the single-component boundary case, for example nonzero latent mixing where rank-one slice identities no longer hold directly.",
              "## From P90 to P91\n\nP91 addresses the nonlinear structure left open by P90's single-component boundary case by allowing nonzero latent mixing and using a rank-two bipartite flattening constraint.",
              1,
          )
          write(path, text)
          PY

      - name: Commit publication normalization
        run: |
          git restore .github/workflows/validate-research-three-website.yml
          if [ -z "$(git status --porcelain)" ]; then
            echo "P91 publication surfaces already normalized."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CITATION.md docs/claim_source_matrix.md docs/theorem_roadmap.md website/research-map.html website/visual-atlas.html website/plain-language.html
          git commit -m "Normalize final P91 publication surfaces"
          git push origin HEAD:p91-mixed-prevalence-rank-two-flattening
