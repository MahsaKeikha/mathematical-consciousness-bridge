name: validate-research-three-website

on:
  push:
    paths:
      - "website/**"
      - "scripts/prepare_website.py"
      - "scripts/synchronize_research_three_website.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/validate-research-three-website.yml"
  pull_request:
    paths:
      - "website/**"
      - "scripts/prepare_website.py"
      - "scripts/synchronize_research_three_website.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/validate-research-three-website.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify maintained Python scripts
        run: |
          python -m py_compile scripts/prepare_website.py scripts/synchronize_research_three_website.py
          python scripts/synchronize_research_three_website.py --site website --check

      - name: Build exact website artifact
        run: |
          rm -rf website-deploy _site
          cp -a website website-deploy
          python scripts/prepare_website.py --source website-deploy --output _site

      - name: Verify Research II and Research III identity
        run: |
          R3_PIN="$(python -c 'from scripts.synchronize_research_three_website import CURRENT_RESEARCH_THREE_PIN; print(CURRENT_RESEARCH_THREE_PIN)')"

          test "$(grep -o '<!-- current-frontier-home: P92 -->' _site/index.html | wc -l)" -eq 1
          test "$(grep -o 'id=\"p92-frontier\"' _site/index.html | wc -l)" -eq 1
          grep -q 'Current record:</strong> 92 proposition-level results through P92' _site/index.html
          grep -q 'all 92 propositions' _site/index.html

          grep -q 'Research III · Consciousness Measurement Science' _site/measurement-science.html
          grep -q 'Implemented now versus not yet established' _site/measurement-science.html
          grep -q 'CEP JSON schema' _site/measurement-science.html
          grep -q 'Claim JSON schema' _site/measurement-science.html
          grep -q 'Assumption registry' _site/measurement-science.html
          grep -q 'Failure-mode registry' _site/measurement-science.html
          grep -q 'Software and reproducibility' _site/measurement-science.html
          grep -q '35</strong><span>tests in each CI job' _site/measurement-science.html
          grep -q 'dependence-robust partial identification with sharp Fr&eacute;chet-Hoeffding bounds' _site/measurement-science.html
          grep -q '<strong>Two implemented fusion regimes:</strong>' _site/measurement-science.html
          grep -q 'An interval as wide as <code>\[0,1\]</code> is a valid scientific result' _site/measurement-science.html
          grep -q 'docs/partial-identification.md' _site/measurement-science.html
          ! grep -q 'planned by the roadmap' _site/measurement-science.html
          ! grep -q '23</strong><span>tests in each CI job' _site/measurement-science.html
          ! grep -q '34</strong><span>tests in each CI job' _site/measurement-science.html
          grep -q "research-three-snapshot: ${R3_PIN}" _site/measurement-science.html

          grep -q "${R3_PIN}" _site/research-lineage.html
          grep -q '<strong>92</strong><span>proposition-level results</span>' _site/research-lineage.html
          grep -q '<strong>P92</strong><span>current theorem frontier</span>' _site/research-lineage.html
          grep -q '<strong>v0.82.0</strong><span>current documented release</span>' _site/research-lineage.html

      - name: Verify P92 reader coherence
        run: |
          python - <<'PY'
          from pathlib import Path

          atlas = Path("_site/visual-atlas.html").read_text(encoding="utf-8")
          p92 = atlas.index('id="p92-frontier"')
          p91 = atlas.index('id="p91-frontier"')
          p90 = atlas.index('id="p90-frontier"')
          assert p92 < p91 < p90
          assert "<!-- current-frontier-visual: P92 -->" in atlas
          assert "Previous theorem frontier · P91" in atlas

          start = Path("_site/start-here.html").read_text(encoding="utf-8")
          assert "92 results · current frontier P92" in start
          assert "Open all 92 Research II results" in start
          assert "Read P92 theorem" in start
          assert "d_inf(P_emp, M75) = 1/24" in start

          plain = Path("_site/plain-language.html").read_text(encoding="utf-8")
          assert "This is the 92-result Research II theorem program currently reaching P92." in plain
          assert "The current theorem frontier is P92." in plain
          assert 'id="p92-reader-frontier"' in plain

          research = Path("_site/research-map.html").read_text(encoding="utf-8")
          assert "Ninety-two results, one dependency-aware scientific program" in research
          assert "Current Research II model-audit range: P75-P92." in research
          assert "The current theorem frontier is P92." in research
          assert 'id="p92-research-map"' in research
          assert "d_inf(P_emp, M75) = 1/24" in research
          assert research.index('id="p91-research-map"') < research.index('id="p92-research-map"') < research.index("</main>") < research.index("</html>")
          assert "Current exact frontier · P87" not in research
          assert "Current continuous-model frontier" not in research
          PY

      - name: Verify deployment artifact contains pinned figures
        run: |
          R3_PIN="$(python -c 'from scripts.synchronize_research_three_website import CURRENT_RESEARCH_THREE_PIN; print(CURRENT_RESEARCH_THREE_PIN)')"
          grep -q "consciousness-measurement-science/${R3_PIN}/docs/figures/measurement_architecture.svg" _site/index.html
          grep -q "consciousness-measurement-science/${R3_PIN}/docs/figures/measurement_architecture.svg" _site/measurement-science.html
          grep -q "consciousness-measurement-science/${R3_PIN}/docs/figures/measurement_architecture.svg" _site/research-lineage.html
          grep -q "consciousness-measurement-science/${R3_PIN}/docs/figures/claim_ladder.svg" _site/measurement-science.html
          grep -q "consciousness-measurement-science/${R3_PIN}/docs/figures/structural_measurement_pipeline.svg" _site/measurement-science.html
          test -f _site/figures/p92_exact_global_mixed_prevalence_distance.svg
          node --check _site/app.js

      - name: Verify clean generated surface
        run: git diff --check
