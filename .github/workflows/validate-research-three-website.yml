name: validate-research-three-website

on:
  push:
    paths:
      - "website/**"
      - "docs/**"
      - "CITATION.md"
      - "scripts/prepare_website.py"
      - "scripts/synchronize_research_three_website.py"
      - "scripts/promote_p91_public_frontier.py"
      - ".github/workflows/validate-research-three-website.yml"
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "CITATION.md"
      - "scripts/prepare_website.py"
      - "scripts/synchronize_research_three_website.py"
      - "scripts/promote_p91_public_frontier.py"
      - ".github/workflows/validate-research-three-website.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p91-mixed-prevalence-rank-two-flattening
          fetch-depth: 0

      - name: Canonicalize P91 publication semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "CITATION.md": (
                  (
                      "## Current theorem frontier: P91\n\nThe current documented theorem frontier is **P90**, an exact nonlinear rank-one slice separation theorem for the declared strict P75 box.",
                      "## Proposition 90 method citation\n\nP90 is the exact nonlinear rank-one slice separation theorem for the declared strict P75 box.",
                  ),
              ),
              "docs/claim_source_matrix.md": (
                  (
                      "[P90 proof](proposition_90_exact_nonlinear_rank_one_separation.md), implementation, tests, provenance, figure, and frontier publication tests",
                      "[P91 proof](proposition_91_mixed_prevalence_rank_two_flattening_separation.md), [P91 provenance](p91_equation_provenance.md), implementation, tests, figure, and frontier publication tests",
                  ),
              ),
              "docs/theorem_roadmap.md": (
                  (
                      "After P89, the target-side chain has a substantially clearer scientific burden:",
                      "At the P91 frontier, the target-side chain has a substantially clearer scientific burden:",
                  ),
                  (
                      "None of P71-P88 identifies a latent variable with consciousness.",
                      "None of P71-P91 identifies a latent variable with consciousness.",
                  ),
                  (
                      "## After P91\n\nA future P91 result should address nonlinear structure beyond the single-component boundary case, for example nonzero latent mixing where rank-one slice identities no longer hold directly.",
                      "### Historical P90-to-P91 gap\n\nBefore P91, the open nonlinear question was whether separation survived beyond the single-component boundary case. P91 closes that prevalence-boundary gap with a rank-two flattening certificate valid for arbitrary latent mixing.",
                  ),
              ),
              "website/research-map.html": (
                  (
                      "<h1>Eighty-eight results, one dependency-aware scientific program</h1>",
                      "<h1>Ninety-one results, one dependency-aware scientific program</h1>",
                  ),
                  (
                      "and P88 enlarges that complete primitive coefficient radius to three and raises the same exact witness bound from 1/96 to 1/64.",
                      "and P88 enlarges that complete primitive coefficient radius to three and raises the same exact witness bound from 1/96 to 1/64. P89 then closes the complete real linear parity-functional class, P90 adds exact nonlinear single-component separation, and P91 extends nonlinear separation to arbitrary latent mixing through a rank-two flattening certificate.",
                  ),
                  (
                      '<a href="index.html#p90-frontier">Current frontier</a>',
                      '<a href="visual-atlas.html#p90-frontier">Historical P90 figure</a>',
                  ),
              ),
              "website/plain-language.html": (
                  (
                      "A 90-result sufficiency and falsification architecture",
                      "A 91-result sufficiency and falsification architecture",
                  ),
              ),
              "website/visual-atlas.html": (
                  (
                      "<!-- current-frontier-visual: P90 -->",
                      "<!-- current-frontier-visual: P91 -->",
                  ),
                  (
                      '<section id="p90-frontier" class="theorem-frontier current-frontier-visual">',
                      '<section id="p90-frontier" class="theorem-frontier">',
                  ),
              ),
          }

          for relative, pairs in replacements.items():
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          promoter = Path("scripts/promote_p91_public_frontier.py")
          source = promoter.read_text(encoding="utf-8")
          if "def finalize_p91_semantics()" not in source:
              insert = r'''

def finalize_p91_semantics() -> None:
    """Remove stale current-frontier wording that older publication surfaces may retain."""

    replacements = {
        "CITATION.md": (
            (
                "## Current theorem frontier: P91\n\nThe current documented theorem frontier is **P90**, an exact nonlinear rank-one slice separation theorem for the declared strict P75 box.",
                "## Proposition 90 method citation\n\nP90 is the exact nonlinear rank-one slice separation theorem for the declared strict P75 box.",
            ),
        ),
        "docs/claim_source_matrix.md": (
            (
                "[P90 proof](proposition_90_exact_nonlinear_rank_one_separation.md), implementation, tests, provenance, figure, and frontier publication tests",
                "[P91 proof](proposition_91_mixed_prevalence_rank_two_flattening_separation.md), [P91 provenance](p91_equation_provenance.md), implementation, tests, figure, and frontier publication tests",
            ),
        ),
        "docs/theorem_roadmap.md": (
            (
                "After P89, the target-side chain has a substantially clearer scientific burden:",
                "At the P91 frontier, the target-side chain has a substantially clearer scientific burden:",
            ),
            (
                "None of P71-P88 identifies a latent variable with consciousness.",
                "None of P71-P91 identifies a latent variable with consciousness.",
            ),
            (
                "## After P91\n\nA future P91 result should address nonlinear structure beyond the single-component boundary case, for example nonzero latent mixing where rank-one slice identities no longer hold directly.",
                "### Historical P90-to-P91 gap\n\nBefore P91, the open nonlinear question was whether separation survived beyond the single-component boundary case. P91 closes that prevalence-boundary gap with a rank-two flattening certificate valid for arbitrary latent mixing.",
            ),
        ),
        "website/research-map.html": (
            (
                "<h1>Eighty-eight results, one dependency-aware scientific program</h1>",
                "<h1>Ninety-one results, one dependency-aware scientific program</h1>",
            ),
            (
                "and P88 enlarges that complete primitive coefficient radius to three and raises the same exact witness bound from 1/96 to 1/64.",
                "and P88 enlarges that complete primitive coefficient radius to three and raises the same exact witness bound from 1/96 to 1/64. P89 then closes the complete real linear parity-functional class, P90 adds exact nonlinear single-component separation, and P91 extends nonlinear separation to arbitrary latent mixing through a rank-two flattening certificate.",
            ),
            (
                '<a href="index.html#p90-frontier">Current frontier</a>',
                '<a href="visual-atlas.html#p90-frontier">Historical P90 figure</a>',
            ),
        ),
        "website/plain-language.html": (
            (
                "A 90-result sufficiency and falsification architecture",
                "A 91-result sufficiency and falsification architecture",
            ),
        ),
        "website/visual-atlas.html": (
            (
                "<!-- current-frontier-visual: P90 -->",
                "<!-- current-frontier-visual: P91 -->",
            ),
            (
                '<section id="p90-frontier" class="theorem-frontier current-frontier-visual">',
                '<section id="p90-frontier" class="theorem-frontier">',
            ),
        ),
    }
    for path, pairs in replacements.items():
        write(path, replace_many(read(path), pairs))
'''
              source = source.replace("\ndef main() -> None:\n", insert + "\n\ndef main() -> None:\n", 1)
              source = source.replace(
                  "    promote_sync_summary()\n    print(\"[P91] reader-facing publication surfaces promoted\")",
                  "    promote_sync_summary()\n    finalize_p91_semantics()\n    print(\"[P91] reader-facing publication surfaces promoted\")",
                  1,
              )
          promoter.write_text(source, encoding="utf-8")
          PY

      - name: Commit semantic cleanup
        run: |
          git restore .github/workflows/validate-research-three-website.yml
          if [ -z "$(git status --porcelain)" ]; then
            echo "P91 publication semantics already canonical."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CITATION.md docs/claim_source_matrix.md docs/theorem_roadmap.md website/research-map.html website/plain-language.html website/visual-atlas.html scripts/promote_p91_public_frontier.py
          git commit -m "Polish P91 publication semantics"
          git push origin HEAD:p91-mixed-prevalence-rank-two-flattening

      - name: Verify current website state
        run: |
          python -m py_compile scripts/prepare_website.py scripts/synchronize_research_three_website.py scripts/promote_p91_public_frontier.py
          python scripts/synchronize_research_three_website.py --site website --check
          python scripts/prepare_website.py --source website --output _site
          python - <<'PY'
          from pathlib import Path
          sources = Path("_site/sources.html").read_text(encoding="utf-8")
          assert sources.count('id="p91-source"') == 1
          assert sources.index('id="p91-source"') < sources.index("</main>") < sources.index("</html>")
          atlas = Path("_site/visual-atlas.html").read_text(encoding="utf-8")
          assert "<!-- current-frontier-visual: P91 -->" in atlas
          assert '<section id="p90-frontier" class="theorem-frontier">' in atlas
          research_map = Path("_site/research-map.html").read_text(encoding="utf-8")
          assert "Ninety-one results, one dependency-aware scientific program" in research_map
          assert "Historical P90 figure" in research_map
          PY
