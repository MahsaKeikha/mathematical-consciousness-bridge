name: validate-research-three-website

on:
  push:
    paths:
      - "website/**"
      - "docs/figures/**"
      - "figures/manifest.json"
      - "scripts/prepare_website.py"
      - "scripts/synchronize_research_three_website.py"
      - "scripts/verify_repository.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/validate-research-three-website.yml"
  pull_request:
    paths:
      - "website/**"
      - "docs/figures/**"
      - "figures/manifest.json"
      - "scripts/prepare_website.py"
      - "scripts/synchronize_research_three_website.py"
      - "scripts/verify_repository.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/validate-research-three-website.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify maintained Python and JavaScript sources
        run: |
          python -m py_compile scripts/prepare_website.py scripts/synchronize_research_three_website.py scripts/verify_repository.py
          node --check website/app.js
          node --check website/research-orientation.js
          node --check website/research-iii-atlas-refresh.js
          node --check website/atlas-architecture-refresh.js
          node --check website/three-program-evidence.js

      - name: Build exact synchronized website artifact
        run: |
          rm -rf website-deploy _site
          cp -a website website-deploy
          python scripts/prepare_website.py --source website-deploy --output _site

      - name: Verify Research II and Research III identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("figures/manifest.json").read_text(encoding="utf-8"))
          frontier_label = str(manifest["current_frontier"])
          frontier = int(frontier_label.removeprefix("P"))
          figure = Path(str(manifest["current_frontier_figure"])).name
          home = Path("_site/index.html").read_text(encoding="utf-8")
          lineage = Path("_site/research-lineage.html").read_text(encoding="utf-8")

          assert home.count(f"<!-- current-frontier-home: P{frontier} -->") == 1
          assert home.count(f'id="p{frontier}-frontier"') == 1
          assert f"Current record:</strong> {frontier} proposition-level results through P{frontier}" in home
          assert f"all {frontier} propositions" in home
          assert figure in home
          assert f'<strong>{frontier}</strong><span>proposition-level results</span>' in lineage
          assert f'<strong>P{frontier}</strong><span>current theorem frontier</span>' in lineage
          PY

          R3_PIN="$(python -c 'from scripts.synchronize_research_three_website import CURRENT_RESEARCH_THREE_PIN; print(CURRENT_RESEARCH_THREE_PIN)')"
          grep -q 'Research III · Consciousness Measurement Science' _site/measurement-science.html
          grep -q 'V1-V45' _site/measurement-science.html
          grep -q '171</strong><span>tests in each CI job' _site/measurement-science.html
          grep -q '29</strong><span>scientific visuals: 9 architecture + 20 validation' _site/measurement-science.html
          grep -q 'docs/validation-atlas.md' _site/measurement-science.html
          grep -q 'results/README.md' _site/measurement-science.html
          grep -q "research-three-snapshot: ${R3_PIN}" _site/measurement-science.html
          ! grep -q '<p class="eyebrow">Implemented now versus not yet established</p>' _site/measurement-science.html
          grep -q "${R3_PIN}" _site/research-lineage.html
          grep -q 'V1-V45' _site/research-lineage.html
          grep -q '20</strong><span>code-generated validation figures' _site/research-lineage.html
          grep -q '171</strong><span>tests in each CI job' _site/research-lineage.html
          grep -q '9</strong><span>reproducible validation runners' _site/research-lineage.html
          grep -q 'v41_v45_electromagnetic_selection_validation.svg' _site/research-lineage.html
          grep -q 'V41-V45 selection-safe inference' _site/research-lineage.html
          grep -q 'electromagnetic-selection-safe-inference.md' _site/research-lineage.html
          grep -q "${R3_PIN}" _site/research-orientation.js
          grep -q 'V1-V45 formal validation' _site/research-orientation.js
          grep -q '171</strong><span>tests in each CI job' _site/research-orientation.js
          grep -q '29 scientific visuals' _site/research-orientation.js
          grep -q '9 reproducible validation runners' _site/research-orientation.js

      - name: Verify current-frontier reader coherence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("figures/manifest.json").read_text(encoding="utf-8"))
          frontier = int(str(manifest["current_frontier"]).removeprefix("P"))
          previous = frontier - 1
          figure = Path(str(manifest["current_frontier_figure"])).name

          atlas = Path("_site/visual-atlas.html").read_text(encoding="utf-8")
          assert atlas.index(f'id="p{frontier}-frontier"') < atlas.index(f'id="p{previous}-frontier"')
          assert f"<!-- current-frontier-visual: P{frontier} -->" in atlas
          assert f"Immediate predecessor · P{previous}" in atlas
          assert figure in atlas

          start = Path("_site/start-here.html").read_text(encoding="utf-8")
          assert f"{frontier} results · current frontier P{frontier}" in start
          assert f"Open all {frontier} Research II results" in start
          assert f"Read P{frontier} theorem" in start

          plain = Path("_site/plain-language.html").read_text(encoding="utf-8")
          assert f"This is the {frontier}-result Research II theorem program currently reaching P{frontier}." in plain
          assert f"The current theorem frontier is P{frontier}." in plain

          research = Path("_site/research-map.html").read_text(encoding="utf-8")
          assert f"Current Research II model-audit range: P75-P{frontier}." in research
          assert f"The current theorem frontier is P{frontier}." in research
          assert f'id="p{previous}-research-map"' in research
          assert f'id="p{frontier}-research-map"' in research

          for path in Path("_site").glob("*.html"):
              assert path.read_text(encoding="utf-8").rstrip().endswith("</html>"), path
          PY

      - name: Verify Research III architecture, validation, and provenance galleries
        run: |
          R3_PIN="$(python -c 'from scripts.synchronize_research_three_website import CURRENT_RESEARCH_THREE_PIN; print(CURRENT_RESEARCH_THREE_PIN)')"
          grep -q "${R3_PIN}" _site/research-iii-atlas-refresh.js
          grep -q 'research-iii-complete-figure-gallery' _site/research-iii-atlas-refresh.js
          grep -q 'research-iii-validation-figure-gallery' _site/research-iii-atlas-refresh.js
          grep -q 'research-iii-source-validation-gallery' _site/research-iii-atlas-refresh.js
          grep -q 'V1-V45' _site/sources.html
          grep -q '20 result figures' _site/sources.html
          grep -q '171 tests' _site/sources.html
          grep -q 'V26-V30 electromagnetic resolution and information program' _site/sources.html
          grep -q 'V31-V35 electromagnetic design and spatial specificity program' _site/sources.html
          grep -q 'V36-V40 finite-sample electromagnetic inference program' _site/sources.html
          grep -q 'V41-V45 multiplicity and selection-safe electromagnetic inference program' _site/sources.html
          grep -q 'V1-V45' _site/visual-atlas.html
          grep -q '20</strong><span>code-generated validation figures' _site/visual-atlas.html
          grep -q '171</strong><span>tests in each CI job' _site/visual-atlas.html
          grep -q 'v26_v30_electromagnetic_resolution_validation.svg' _site/visual-atlas.html
          grep -q 'v31_v35_electromagnetic_design_validation.svg' _site/visual-atlas.html
          grep -q 'v36_v40_electromagnetic_finite_sample_validation.svg' _site/visual-atlas.html
          grep -q 'v41_v45_electromagnetic_selection_validation.svg' _site/visual-atlas.html
          grep -q '9 / 9 visible' _site/research-iii-atlas-refresh.js
          grep -q '20 / 20 visible' _site/research-iii-atlas-refresh.js
          grep -q 'V1-V45 result record' _site/research-iii-atlas-refresh.js
          grep -q 'Result data' _site/research-iii-atlas-refresh.js
          grep -q 'finite_sample_identification.svg' _site/research-iii-atlas-refresh.js
          grep -q 'resolution_abstention_frontier.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v11_missingness_information_law.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v12_v13_multisite_heterogeneity.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v14_resolution_sample_size.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v15_independent_pilot_gate.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v16_v20_electromagnetic_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v21_v25_electromagnetic_inverse_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v26_v30_electromagnetic_resolution_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v31_v35_electromagnetic_design_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v36_v40_electromagnetic_finite_sample_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v41_v45_electromagnetic_selection_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_inverse_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_resolution_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_design_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_finite_sample_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_selection_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic-source-identifiability.md' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic-resolution-program.md' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic-design-spatial-specificity.md' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic-finite-sample-inference.md' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic-selection-safe-inference.md' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic-field-program.md' _site/research-iii-atlas-refresh.js
          grep -q 'v11_missingness_information_law.csv' _site/research-iii-atlas-refresh.js
          grep -q 'v15_independent_pilot_gate.csv' _site/research-iii-atlas-refresh.js
          grep -q 'v16_v20_electromagnetic_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'Electromagnetic Field Measurement Program' _site/research-iii-atlas-refresh.js
          grep -q 'Electromagnetic Source Identifiability Program' _site/research-iii-atlas-refresh.js
          node --check _site/app.js
          node --check _site/research-orientation.js
          node --check _site/research-iii-atlas-refresh.js
          node --check _site/atlas-architecture-refresh.js
          node --check _site/three-program-evidence.js

      - name: Verify deployment artifact structure and pinned Research III evidence
        run: |
          R3_PIN="$(python -c 'from scripts.synchronize_research_three_website import CURRENT_RESEARCH_THREE_PIN; print(CURRENT_RESEARCH_THREE_PIN)')"
          export R3_PIN
          python - <<'PY'
          import os
          from pathlib import Path

          pin = os.environ["R3_PIN"]
          home = Path("_site/index.html").read_text(encoding="utf-8")
          orientation = Path("_site/research-orientation.js").read_text(encoding="utf-8")
          refresh = Path("_site/research-iii-atlas-refresh.js").read_text(encoding="utf-8")
          lineage = Path("_site/research-lineage.html").read_text(encoding="utf-8")
          measurement = Path("_site/measurement-science.html").read_text(encoding="utf-8")

          assert 'id="research-iii-overview"' in home
          assert "Research III · Consciousness measurement science" in home
          assert pin in orientation
          assert pin in refresh
          assert "V1-V45 formal validation" in orientation
          assert "formal-validation-v11-v15" in refresh
          assert "v15_independent_pilot_gate.svg" in refresh
          assert "v15_independent_pilot_gate.csv" in refresh
          assert "v16_v20_electromagnetic_validation.svg" in refresh
          assert "electromagnetic_validation_summary.json" in refresh
          assert "electromagnetic-field-program.md" in refresh
          assert "v16-v20-em-field-program" in refresh
          assert "v21_v25_electromagnetic_inverse_validation.svg" in refresh
          assert "electromagnetic_inverse_validation_summary.json" in refresh
          assert "v21-v25-em-source-identifiability" in refresh
          assert "Electromagnetic Source Identifiability Program" in refresh
          assert "run_electromagnetic_inverse_validation.py" in refresh
          assert f"research-three-snapshot: {pin}" in measurement
          assert "Implemented now versus not yet established</p>" not in measurement
          assert pin in lineage
          PY

      - name: Verify clean generated surface
        run: |
          rm -rf website-deploy _site
          git diff --check
          test -z "$(git status --porcelain)"
