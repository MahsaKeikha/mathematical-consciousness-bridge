name: integrate-p52-publication

on:
  push:
    branches:
      - p52-publication-integration

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply P52 publication integration
        run: python scripts/integrate_p52_publication.py

      - name: Remove one-time integration scaffolding
        run: |
          git rm scripts/integrate_p52_publication.py
          git rm .github/workflows/integrate-p52-publication.yml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run lint
        run: ruff check .

      - name: Commit publication integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate P52 into the main research paper"
          git push
