name: patch-triumf-homepage

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/patch-triumf-homepage.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Link full TRIUMF name in homepage About section
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("website/index.html")
          text = path.read_text(encoding="utf-8")
          old = "<strong>TRIUMF</strong>"
          new = '<strong><a href="https://triumf.ca/">TRIUMF, Canada\'s Particle Accelerator Centre</a></strong>'
          if old not in text and new not in text:
              raise SystemExit("TRIUMF homepage marker not found")
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          assert "TRIUMF, Canada's Particle Accelerator Centre" in text
          assert 'href="https://triumf.ca/"' in text
          PY
      - name: Remove one-time migration workflow and commit
        run: |
          rm .github/workflows/patch-triumf-homepage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/index.html .github/workflows/patch-triumf-homepage.yml
          git commit -m "Link TRIUMF in homepage About section"
          git push origin HEAD:main
