name: integrate-p29-once

on:
  push:
    branches:
      - p29-response-geometry-node-aggregation
    paths:
      - .github/integrate_p29_release.py
      - .github/workflows/integrate-p29-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: p29-response-geometry-node-aggregation
          fetch-depth: 0

      - name: Apply P29 release integration
        run: python .github/integrate_p29_release.py

      - name: Normalize P29 roadmap card copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/figures/theorem_roadmap.svg")
          text = path.read_text(encoding="utf-8")
          old = "Every intervention-pair distance is controlled at every delay"
          new = "Response geometry controlled across every delay"
          if text.count(old) != 1:
              raise RuntimeError("P29 roadmap heading marker not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove one-time integration scaffolding before validation
        run: |
          rm .github/integrate_p29_release.py
          rm .github/workflows/integrate-p29-once.yml

      - name: Validate on Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install and test on Python 3.10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and test on Python 3.11
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test on Python 3.12
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Commit verified P29 release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate P29 response geometry node aggregation"
          git push origin HEAD:p29-response-geometry-node-aggregation
