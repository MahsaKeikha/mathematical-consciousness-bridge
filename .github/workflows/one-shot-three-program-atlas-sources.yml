name: One Shot Three Program Atlas Sources

on:
  push:
    branches:
      - three-program-atlas-sources
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: three-program-atlas-sources
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Generate three-program Atlas and Sources surfaces
        run: python scripts/one_shot_three_program_atlas_sources.py

      - name: Preserve sitewide traceability boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('website/research-orientation.js')
          text = path.read_text(encoding='utf-8')
          old = 'Traceability establishes an inspectable research record, not scientific truth. Each program still has to earn its own mathematical, computational, empirical, external-validation, or clinical claims at the level appropriate to that program.'
          new = 'Traceability is necessary for rigor, but an inspectable research record is not scientific truth by itself. Each program still has to earn its own mathematical, computational, empirical, external-validation, or clinical claims at the level appropriate to that program.'
          if text.count(old) != 1:
              raise RuntimeError('expected one generated Sources traceability sentence')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Normalize generated text endings
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              'website/styles.css',
              'website/visual-atlas.html',
              'website/sources.html',
              'website/research-orientation.js',
              'tests/test_visual_atlas_frontier_hierarchy.py',
              'tests/test_three_program_atlas_sources.py',
          ):
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Run focused reader and publication contracts
        run: |
          python -m pytest -q \
            tests/test_three_program_atlas_sources.py \
            tests/test_visual_atlas_frontier_hierarchy.py \
            tests/test_sitewide_scientific_orientation.py \
            tests/test_website_build.py \
            tests/test_website_link_integrity.py \
            tests/test_public_reader_punctuation.py
          python -m ruff check \
            tests/test_three_program_atlas_sources.py \
            tests/test_visual_atlas_frontier_hierarchy.py
          python scripts/sync_figure_publication.py --check
          git diff --check

      - name: Commit permanent three-program surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            website/visual-atlas.html \
            website/sources.html \
            website/research-orientation.js \
            website/styles.css \
            tests/test_visual_atlas_frontier_hierarchy.py \
            tests/test_three_program_atlas_sources.py
          git commit -m "Present all three research programs in Atlas and Sources"
          git push origin HEAD:three-program-atlas-sources
