name: deploy-research-website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/figures/**"
      - "figures/manifest.json"
      - "scripts/prepare_website.py"
      - "scripts/synchronize_research_three_website.py"
      - "scripts/verify_repository.py"
      - "scripts/verify_frontier_publication.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Resolve canonical theorem frontier
        shell: bash
        run: |
          FRONTIER="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('scripts/verify_repository.py').read_text(encoding='utf-8')
          match = re.search(r'^CURRENT_FRONTIER = "(P[0-9]+)"$', text, re.MULTILINE)
          if match is None:
              raise SystemExit('CURRENT_FRONTIER is missing from scripts/verify_repository.py')
          print(match.group(1))
          PY
          )"
          FIGURE_PATH="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('figures/manifest.json').read_text(encoding='utf-8'))
          frontier = manifest.get('current_frontier')
          figure = manifest.get('current_frontier_figure')
          if not isinstance(frontier, str) or not isinstance(figure, str):
              raise SystemExit('figure manifest is missing current frontier metadata')
          print(figure)
          PY
          )"
          MANIFEST_FRONTIER="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('figures/manifest.json').read_text(encoding='utf-8'))['current_frontier'])
          PY
          )"
          R3_PIN="$(python -c 'from scripts.synchronize_research_three_website import CURRENT_RESEARCH_THREE_PIN; print(CURRENT_RESEARCH_THREE_PIN)')"
          test "${FRONTIER}" = "${MANIFEST_FRONTIER}"
          echo "FRONTIER=${FRONTIER}" >> "${GITHUB_ENV}"
          echo "FRONTIER_NUMBER=${FRONTIER#P}" >> "${GITHUB_ENV}"
          echo "FRONTIER_FIGURE=$(basename "${FIGURE_PATH}")" >> "${GITHUB_ENV}"
          echo "R3_PIN=${R3_PIN}" >> "${GITHUB_ENV}"

      - name: Verify repository and synchronize public Research III source
        run: |
          python -m py_compile scripts/prepare_website.py scripts/synchronize_research_three_website.py scripts/verify_repository.py scripts/verify_frontier_publication.py
          python scripts/synchronize_research_three_website.py --site website --write
          python scripts/synchronize_research_three_website.py --site website --check
          python scripts/verify_repository.py
          node --check website/app.js
          node --check website/research-orientation.js
          node --check website/atlas-architecture-refresh.js
          node --check website/research-iii-atlas-refresh.js
          node --check website/three-program-evidence.js

      - name: Build exact main website
        run: |
          rm -rf website-deploy _site
          cp -a website website-deploy
          python scripts/prepare_website.py --source website-deploy --output _site
          cp figures/manifest.json _site/figures/manifest.json

      - name: Verify canonical built frontier and Research III V1-V50 record
        shell: bash
        run: |
          FRONTIER_LOWER="$(printf '%s' "${FRONTIER}" | tr '[:upper:]' '[:lower:]')"
          test -f "_site/figures/${FRONTIER_FIGURE}"
          test -f "_site/figures/manifest.json"
          test -f "_site/atlas-architecture-refresh.js"
          test -f "_site/research-iii-atlas-refresh.js"
          test -f "_site/three-program-evidence.js"
          test -f "_site/research-orientation.js"
          grep -q "Current theorem frontier · ${FRONTIER}" _site/index.html
          grep -q "Current theorem frontier · ${FRONTIER}" _site/visual-atlas.html
          grep -q "id=\"${FRONTIER_LOWER}-frontier\"" _site/index.html
          grep -q "id=\"${FRONTIER_LOWER}-frontier\"" _site/visual-atlas.html
          grep -q "${FRONTIER_FIGURE}" _site/index.html
          grep -q "${FRONTIER_FIGURE}" _site/visual-atlas.html
          grep -q "${FRONTIER_NUMBER} proposition-level results" _site/index.html
          grep -q 'Research I · Physical-system identification' _site/index.html
          grep -q 'Research III · Consciousness measurement science' _site/index.html
          grep -q 'physical-to-experiential bridge' _site/plain-language.html
          grep -q 'physical-to-experiential bridge' _site/start-here.html
          grep -q 'measurement-science.html' _site/app.js
          grep -q "${R3_PIN}" _site/measurement-science.html
          # Research III V1-V50 four-surface gate
          grep -q "${R3_PIN}" _site/research-lineage.html
          grep -q 'V1-V50' _site/research-lineage.html
          grep -q '21</strong><span>code-generated validation figures' _site/research-lineage.html
          grep -q '182</strong><span>tests in each CI job' _site/research-lineage.html
          grep -q '10</strong><span>reproducible validation runners' _site/research-lineage.html
          grep -q 'v36_v40_electromagnetic_finite_sample_validation.svg' _site/research-lineage.html
          grep -q 'V36-V40 · finite-sample electromagnetic inference' _site/research-lineage.html
          grep -q 'electromagnetic-finite-sample-inference.md' _site/research-lineage.html
          grep -q 'Seven linked validation layers' _site/research-lineage.html
          grep -q 'v41_v45_electromagnetic_selection_validation.svg' _site/research-lineage.html
          grep -q 'V41-V45 selection-safe inference' _site/research-lineage.html
          grep -q 'electromagnetic-selection-safe-inference.md' _site/research-lineage.html
          grep -q 'v41-v45-electromagnetic-selection-safe-inference' _site/measurement-science.html
          grep -q 'v41_v45_electromagnetic_selection_validation.svg' _site/measurement-science.html
          grep -q 'electromagnetic_selection_validation_summary.json' _site/measurement-science.html
          grep -q 'run_electromagnetic_selection_validation.py' _site/measurement-science.html
          grep -q 'v41-v45-em-selection-safe-inference' _site/research-iii-atlas-refresh.js
          grep -q 'v41_v45_electromagnetic_selection_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_selection_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic-selection-safe-inference.md' _site/research-iii-atlas-refresh.js
          grep -q 'Multiplicity and Selection-Safe Electromagnetic Inference Program' _site/research-iii-atlas-refresh.js
          grep -q 'run_electromagnetic_selection_validation.py' _site/research-iii-atlas-refresh.js
          grep -q 'V41-V45 multiplicity and selection-safe electromagnetic inference program' _site/sources.html
          grep -q 'v41_v45_electromagnetic_selection_validation.svg' _site/visual-atlas.html
          grep -q "${R3_PIN}" _site/research-orientation.js
          grep -q "${R3_PIN}" _site/research-iii-atlas-refresh.js
          grep -q 'V1-V50' _site/measurement-science.html
          grep -q '182</strong><span>tests in each CI job' _site/measurement-science.html
          grep -q '29</strong><span>scientific visuals: 9 architecture + 20 validation' _site/measurement-science.html
          grep -q 'V1-V50 formal validation' _site/research-orientation.js
          grep -q '182</strong><span>tests in each CI job' _site/research-orientation.js
          grep -q '30 scientific visuals' _site/research-orientation.js
          grep -q '10 reproducible validation runners' _site/research-orientation.js
          grep -q 'research-i-complete-figure-gallery' _site/three-program-evidence.js
          grep -q 'research-ii-complete-core-gallery' _site/atlas-architecture-refresh.js
          grep -q 'research-iii-complete-figure-gallery' _site/research-iii-atlas-refresh.js
          grep -q 'research-iii-curated-visual-story' _site/research-iii-atlas-refresh.js
          grep -q 'research-iii-validation-figure-gallery' _site/research-iii-atlas-refresh.js
          grep -q 'research-iii-source-validation-gallery' _site/research-iii-atlas-refresh.js
          grep -q 'V1-V50' _site/sources.html
          grep -q '21 result figures' _site/sources.html
          grep -q '182 tests' _site/sources.html
          grep -q 'V26-V30 electromagnetic resolution and information program' _site/sources.html
          grep -q 'V31-V35 electromagnetic design and spatial specificity program' _site/sources.html
          grep -q 'V36-V40 finite-sample electromagnetic inference program' _site/sources.html
          grep -q 'V41-V45 multiplicity and selection-safe electromagnetic inference program' _site/sources.html
          grep -q 'V1-V50' _site/visual-atlas.html
          grep -q '21</strong><span>code-generated validation figures' _site/visual-atlas.html
          grep -q '182</strong><span>tests in each CI job' _site/visual-atlas.html
          grep -q 'v26_v30_electromagnetic_resolution_validation.svg' _site/visual-atlas.html
          grep -q 'v31_v35_electromagnetic_design_validation.svg' _site/visual-atlas.html
          grep -q 'v36_v40_electromagnetic_finite_sample_validation.svg' _site/visual-atlas.html
          grep -q 'v41_v45_electromagnetic_selection_validation.svg' _site/visual-atlas.html
          grep -q 'const RESEARCH_II_CORE_EXPECTED = 100' _site/atlas-architecture-refresh.js
          grep -q '9 / 9 visible' _site/research-iii-atlas-refresh.js
          grep -q '21 / 21 visible' _site/research-iii-atlas-refresh.js
          grep -q 'V1-V50 result record' _site/research-iii-atlas-refresh.js
          grep -q 'v16_v20_electromagnetic_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v21_v25_electromagnetic_inverse_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v26_v30_electromagnetic_resolution_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v31_v35_electromagnetic_design_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v36_v40_electromagnetic_finite_sample_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v41_v45_electromagnetic_selection_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_inverse_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_resolution_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_design_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_finite_sample_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_selection_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic-source-identifiability.md' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic-resolution-program.md' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic-design-spatial-specificity.md' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic-finite-sample-inference.md' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic-selection-safe-inference.md' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'Electromagnetic Field Measurement Program' _site/research-iii-atlas-refresh.js
          grep -q 'Electromagnetic Source Identifiability Program' _site/research-iii-atlas-refresh.js
          grep -q 'Electromagnetic Resolution and Information Program' _site/research-iii-atlas-refresh.js
          grep -q 'Electromagnetic Design and Spatial Specificity Program' _site/research-iii-atlas-refresh.js
          grep -q 'Finite-Sample Electromagnetic Inference Program' _site/research-iii-atlas-refresh.js
          grep -q 'Multiplicity and Selection-Safe Electromagnetic Inference Program' _site/research-iii-atlas-refresh.js
          grep -q 'run_electromagnetic_inverse_validation.py' _site/research-iii-atlas-refresh.js
          grep -q 'run_electromagnetic_resolution_validation.py' _site/research-iii-atlas-refresh.js
          grep -q 'run_electromagnetic_design_validation.py' _site/research-iii-atlas-refresh.js
          grep -q 'run_electromagnetic_finite_sample_validation.py' _site/research-iii-atlas-refresh.js
          grep -q 'run_electromagnetic_selection_validation.py' _site/research-iii-atlas-refresh.js
          grep -q 'v21-v25-em-source-identifiability' _site/research-iii-atlas-refresh.js
          grep -q 'v31-v35-em-design-spatial-specificity' _site/research-iii-atlas-refresh.js
          grep -q 'v36-v40-em-finite-sample-inference' _site/research-iii-atlas-refresh.js
          grep -q 'v41-v45-em-selection-safe-inference' _site/research-iii-atlas-refresh.js
          grep -q 'Result data' _site/research-iii-atlas-refresh.js
          grep -q 'v11_missingness_information_law.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v12_v13_multisite_heterogeneity.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v14_resolution_sample_size.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v15_independent_pilot_gate.svg' _site/research-iii-atlas-refresh.js
          grep -q 'v16_v20_electromagnetic_validation.svg' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic_validation_summary.json' _site/research-iii-atlas-refresh.js
          grep -q 'electromagnetic-field-program.md' _site/research-iii-atlas-refresh.js
          grep -q 'v11_missingness_information_law.csv' _site/research-iii-atlas-refresh.js
          grep -q 'v15_independent_pilot_gate.csv' _site/research-iii-atlas-refresh.js
          ! grep -q '<p class="eyebrow">Implemented now versus not yet established</p>' _site/measurement-science.html
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('_site/figures/manifest.json').read_text(encoding='utf-8'))
          figures = manifest.get('figures')
          if not isinstance(figures, list):
              raise SystemExit('deployed figure manifest is missing figures list')
          core = [
              record
              for record in figures
              if isinstance(record, dict)
              and record.get('category') == 'theorem-or-architecture'
          ]
          paths = [record.get('path') for record in core]
          if len(core) != 100 or len(set(paths)) != 100:
              raise SystemExit('deployed Research II core gallery contract is not exactly 100 unique figures')
          if manifest.get('figure_count') != 158:
              raise SystemExit('deployed canonical figure count is not 158')
          PY
          node --check _site/app.js
          node --check _site/research-orientation.js
          node --check _site/atlas-architecture-refresh.js
          node --check _site/research-iii-atlas-refresh.js
          node --check _site/three-program-evidence.js

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
