name: deploy-research-website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/figures/**"
      - "scripts/prepare_website.py"
      - "scripts/synchronize_research_three_website.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["promote-p88-public-frontier"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify website source synchronization
        run: |
          python -m py_compile scripts/prepare_website.py scripts/synchronize_research_three_website.py
          python scripts/synchronize_research_three_website.py --site website --check

      - name: Verify website JavaScript parses
        run: node --check website/app.js

      - name: Build research website
        run: |
          rm -rf website-deploy _site
          cp -a website website-deploy
          python scripts/prepare_website.py --source website-deploy --output _site

      - name: Verify canonical Research II and Research III identity
        run: |
          R3_PIN="$(python -c 'from scripts.synchronize_research_three_website import CURRENT_RESEARCH_THREE_PIN; print(CURRENT_RESEARCH_THREE_PIN)')"

          grep -q 'What would a scientifically testable bridge from physical description to experience actually require?' _site/index.html
          grep -q 'Explore all 88 results' _site/index.html
          grep -q 'Current record:</strong> 88 proposition-level results through P88' _site/index.html
          grep -q 'Current theorem frontier · P88' _site/index.html
          test "$(grep -o 'id=\"p88-frontier\"' _site/index.html | wc -l)" -eq 1
          test "$(grep -o '<!-- current-frontier-home: P88 -->' _site/index.html | wc -l)" -eq 1
          grep -q '#reproduce .equation' _site/reader-experience-v2.css
          grep -q 'contain: inline-size' _site/reader-experience-v2.css
          ! grep -q 'Current record:</strong> 87 proposition-level results through P87' _site/index.html
          ! grep -q 'Current record:</strong> 86 proposition-level results through P86' _site/index.html

          grep -q 'What are we actually trying to find out?' _site/plain-language.html
          grep -q 'The whole project in plain English' _site/plain-language.html
          grep -q 'Research I' _site/plain-language.html
          grep -q 'Research II' _site/plain-language.html
          grep -q 'Research III' _site/plain-language.html
          grep -q 'What the 88 results are doing' _site/plain-language.html
          grep -q '<strong>88</strong><span>Research II proposition-level results</span>' _site/plain-language.html
          grep -q '<strong>P88</strong><span>current Research II theorem frontier</span>' _site/plain-language.html
          grep -q 'P88 is a checkpoint, not the destination' _site/plain-language.html
          grep -q 'The physical-to-experiential bridge' _site/plain-language.html

          grep -q 'the 88-result theorem program and current P88 frontier' _site/start-here.html
          grep -q '<strong>88</strong><span>proposition-level results</span>' _site/start-here.html
          grep -q '<strong>P88</strong><span>current theorem frontier</span>' _site/start-here.html

          grep -q 'Eighty-eight results, one dependency-aware scientific program' _site/research-map.html
          grep -q 'P88: Does the next complete coefficient radius expose a stronger incompatibility?' _site/research-map.html
          test "$(grep -o 'id=\"p88-research-map\"' _site/research-map.html | wc -l)" -eq 1

          grep -q '<!-- current-frontier-visual: P88 -->' _site/visual-atlas.html
          grep -q 'Current theorem frontier · P88' _site/visual-atlas.html
          grep -q 'p88_exact_radius_three_bounded_primitive_quad_projection_parity.svg' _site/visual-atlas.html
          test "$(grep -o 'id=\"p88-frontier\"' _site/visual-atlas.html | wc -l)" -eq 1

          test -f _site/measurement-science.html
          grep -q 'Research III · Consciousness Measurement Science' _site/measurement-science.html
          grep -q 'what can be identified, bounded, predicted, or falsified' _site/measurement-science.html
          grep -q 'Implemented now versus not yet established' _site/measurement-science.html
          grep -q 'CEP JSON schema' _site/measurement-science.html
          grep -q 'Claim JSON schema' _site/measurement-science.html
          grep -q 'Assumption registry' _site/measurement-science.html
          grep -q 'Failure-mode registry' _site/measurement-science.html
          grep -q 'Software and reproducibility' _site/measurement-science.html
          grep -q '34</strong><span>tests in each CI job' _site/measurement-science.html
          grep -q 'dependence-robust partial identification with sharp Fr&eacute;chet-Hoeffding bounds' _site/measurement-science.html
          grep -q '<strong>Two implemented fusion regimes:</strong>' _site/measurement-science.html
          grep -q 'An interval as wide as <code>\[0,1\]</code> is a valid scientific result' _site/measurement-science.html
          grep -q 'docs/partial-identification.md' _site/measurement-science.html
          ! grep -q 'planned by the roadmap' _site/measurement-science.html
          ! grep -q '23</strong><span>tests in each CI job' _site/measurement-science.html
          grep -q "research-three-snapshot: ${R3_PIN}" _site/measurement-science.html
          grep -q "consciousness-measurement-science/${R3_PIN}/docs/figures/measurement_architecture.svg" _site/measurement-science.html
          grep -q "consciousness-measurement-science/blob/${R3_PIN}/schemas/cep.schema.json" _site/measurement-science.html
          grep -q "consciousness-measurement-science/blob/${R3_PIN}/schemas/claim.schema.json" _site/measurement-science.html

          grep -q 'Research III · consciousness measurement science' _site/research-lineage.html
          grep -q '<strong>88</strong><span>proposition-level results</span>' _site/research-lineage.html
          grep -q '<strong>P88</strong><span>current theorem frontier</span>' _site/research-lineage.html
          grep -q '<strong>v0.82.0</strong><span>current documented release</span>' _site/research-lineage.html
          grep -q "${R3_PIN}" _site/research-lineage.html
          ! grep -q '<strong>P81</strong>' _site/research-lineage.html
          ! grep -q 'v0.81.0' _site/research-lineage.html

          grep -q 'measurement-science.html' _site/app.js
          grep -q 'Research III' _site/app.js
          node --check _site/app.js

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
