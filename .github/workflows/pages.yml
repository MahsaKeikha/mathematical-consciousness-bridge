name: deploy-research-website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/figures/**"
      - "figures/manifest.json"
      - "scripts/prepare_website.py"
      - "scripts/synchronize_research_three_website.py"
      - "scripts/verify_repository.py"
      - "scripts/verify_frontier_publication.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Resolve canonical theorem frontier
        shell: bash
        run: |
          FRONTIER="$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path('scripts/verify_repository.py').read_text(encoding='utf-8')
          match = re.search(r'^CURRENT_FRONTIER = "(P[0-9]+)"$', text, re.MULTILINE)
          if match is None:
              raise SystemExit('CURRENT_FRONTIER is missing from scripts/verify_repository.py')
          print(match.group(1))
          PY
          )"
          FIGURE_PATH="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('figures/manifest.json').read_text(encoding='utf-8'))
          frontier = manifest.get('current_frontier')
          figure = manifest.get('current_frontier_figure')
          if not isinstance(frontier, str) or not isinstance(figure, str):
              raise SystemExit('figure manifest is missing current frontier metadata')
          print(figure)
          PY
          )"
          MANIFEST_FRONTIER="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('figures/manifest.json').read_text(encoding='utf-8'))['current_frontier'])
          PY
          )"
          test "${FRONTIER}" = "${MANIFEST_FRONTIER}"
          echo "FRONTIER=${FRONTIER}" >> "${GITHUB_ENV}"
          echo "FRONTIER_NUMBER=${FRONTIER#P}" >> "${GITHUB_ENV}"
          echo "FRONTIER_FIGURE=$(basename "${FIGURE_PATH}")" >> "${GITHUB_ENV}"

      - name: Verify repository and website source synchronization
        run: |
          python -m py_compile scripts/prepare_website.py scripts/synchronize_research_three_website.py scripts/verify_repository.py scripts/verify_frontier_publication.py
          python scripts/synchronize_research_three_website.py --site website --check
          python scripts/verify_repository.py
          node --check website/app.js

      - name: Build exact main website
        run: |
          rm -rf website-deploy _site
          cp -a website website-deploy
          python scripts/prepare_website.py --source website-deploy --output _site
          cp figures/manifest.json _site/figures/manifest.json

      - name: Verify canonical built frontier
        shell: bash
        run: |
          FRONTIER_LOWER="$(printf '%s' "${FRONTIER}" | tr '[:upper:]' '[:lower:]')"
          test -f "_site/figures/${FRONTIER_FIGURE}"
          test -f "_site/figures/manifest.json"
          grep -q "Current theorem frontier · ${FRONTIER}" _site/index.html
          grep -q "Current theorem frontier · ${FRONTIER}" _site/visual-atlas.html
          grep -q "id=\"${FRONTIER_LOWER}-frontier\"" _site/index.html
          grep -q "id=\"${FRONTIER_LOWER}-frontier\"" _site/visual-atlas.html
          grep -q "${FRONTIER_FIGURE}" _site/index.html
          grep -q "${FRONTIER_FIGURE}" _site/visual-atlas.html
          grep -q "${FRONTIER_NUMBER} proposition-level results" _site/index.html
          grep -q 'Research I · Physical-system identification' _site/index.html
          grep -q 'Research III · Consciousness measurement science' _site/index.html
          grep -q 'physical-to-experiential bridge' _site/plain-language.html
          grep -q 'physical-to-experiential bridge' _site/start-here.html
          grep -q 'measurement-science.html' _site/app.js
          node --check _site/app.js

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
