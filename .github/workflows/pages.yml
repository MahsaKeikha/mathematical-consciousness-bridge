name: deploy-research-website

on:
  push:
    branches: ["main"]
    # Final clean P86 resynchronization: exact figures, required scholarly provenance, collegial research-origin context, responsive reader layout, and HTML deploy from one commit artifact.
    paths:
      - "website/**"
      - "docs/figures/**"
      - "figures/**"
      - "scripts/prepare_website.py"
      - "scripts/sync_figure_publication.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Require synchronized figure publication state
        run: python scripts/sync_figure_publication.py --check
      - name: Prepare exact-commit navigable website
        run: |
          python scripts/prepare_website.py --source website --output _site
          test -f _site/figures/p86_exact_minimally_weighted_quad_projection_parity.svg
          grep -q 'src="figures/p86_exact_minimally_weighted_quad_projection_parity.svg"' _site/index.html
          grep -q 'src="figures/p86_exact_minimally_weighted_quad_projection_parity.svg"' _site/visual-atlas.html
          grep -q 'styles.css?v=20260913-mobile16-p86' _site/implementation.html
          grep -q 'reader-experience-v2.css?v=20260913-mobile16-p86' _site/implementation.html
          grep -q 'grid-template-columns: minmax(0, 1fr) !important' _site/reader-experience-v2.css
          grep -q 'overflow-wrap: break-word' _site/reader-experience-v2.css
          grep -q 'Site-wide grid containment contract:' _site/reader-experience-v2.css
          grep -q 'minmax(310px, 1fr)' _site/implementation.html
          grep -q 'Stage 06 · P73-P86' _site/implementation.html
          grep -q 'weighted_quad_projection_parity_functional_separation.py' _site/implementation.html
          grep -q 'id="research-origin"' _site/start-here.html
          grep -q '<strong>Research context:</strong>' _site/start-here.html
          grep -q 'important conceptual starting point' _site/start-here.html
          grep -q 'P86 is the current exact frontier.' _site/start-here.html
          grep -q '10.1016/j.chaos.2015.03.014' _site/start-here.html
          grep -q 'arXiv:1401.1219' _site/start-here.html
          grep -q 'id="research-origins"' _site/sources.html
          grep -q '<strong>Role of this reference:</strong>' _site/sources.html
          grep -q 'important conceptual starting point' _site/sources.html
          grep -q 'distinct mathematical framework' _site/sources.html
          grep -q 'Current theorem source · P86' _site/sources.html
          grep -q 'claim_evidence_standard.md' _site/sources.html
          grep -q 'claim_source_matrix.md' _site/sources.html
          if grep -q 'href="styles.css"' _site/implementation.html; then
            echo "Implementation page still exposes an unversioned base stylesheet."
            exit 1
          fi
          if grep -q 'Current joint shared-parameter parity frontier' _site/implementation.html; then
            echo "Implementation page still labels P84 as current."
            exit 1
          fi
          if grep -q 'Current frontier · P85' _site/start-here.html; then
            echo "Start Here still contains a stale P85 current-frontier block."
            exit 1
          fi
          if grep -q "this origin citation does not make Tegmark's paper evidence" _site/start-here.html _site/sources.html; then
            echo "Defensive Tegmark research-origin wording returned."
            exit 1
          fi
          if grep -q "not evidence for the repository's later original propositions" _site/start-here.html _site/sources.html; then
            echo "Defensive Tegmark source-role wording returned."
            exit 1
          fi
          python -c "from pathlib import Path; t=Path('_site/index.html').read_text(encoding='utf-8'); p=t.index('id=\"p86-frontier\"'); assert p < t.index('id=\"plain-language\"'); assert p < t.index('id=\"p84-frontier\"'); assert p < t.index('id=\"p85-frontier\"'); assert 'Current theorem frontier · P85' not in t; assert 'The 84 results form several dependency branches.' not in t; assert 'all 84 propositions' not in t"
          python -c "from pathlib import Path; t=Path('_site/visual-atlas.html').read_text(encoding='utf-8'); assert t.index('id=\"p86-frontier\"') < t.index('id=\"p85-frontier\"')"
          if grep -q 'src="https://raw.githubusercontent.com/MahsaKeikha/mathematical-consciousness-bridge/main/docs/figures/' _site/index.html _site/visual-atlas.html; then
            echo "Website still depends on mutable raw-GitHub main figure URLs."
            exit 1
          fi
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
