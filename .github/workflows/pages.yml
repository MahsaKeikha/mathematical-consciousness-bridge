name: deploy-research-website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/figures/**"
      - "scripts/prepare_website.py"
      - "scripts/sync_figure_publication.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Require synchronized figure publication state
        run: python scripts/sync_figure_publication.py --check
      - name: Prepare and validate coherent P1-P87 website
        run: |
          python scripts/prepare_website.py --source website --output _site
          test -f _site/research-navigation.html
          grep -q 'Explore all 87 results' _site/index.html
          grep -q 'Channel recovery and model testing' _site/research-map.html
          grep -q 'P73-P87' _site/research-navigation.html
          grep -q 'Current theorem frontier' _site/visual-atlas.html
          grep -q 'Reproducibility' _site/implementation.html
          if grep -R -E 'Explore all 86 results|86 proposition-level results|all 86 propositions|Current theorem frontier · P86|Current frontier · P86' _site/*.html; then
            echo "Website contains stale pre-P87 public status text."
            exit 1
          fi
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
