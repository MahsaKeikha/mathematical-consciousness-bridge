name: deploy-research-website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/figures/**"
      - "scripts/prepare_website.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build restored website
        run: |
          rm -rf website-deploy _site
          cp -a website website-deploy
          python scripts/prepare_website.py --source website-deploy --output _site

      - name: Verify restored full-site identity
        run: |
          grep -q 'What would a scientifically testable bridge from physical description to experience actually require?' _site/index.html
          grep -q 'Explore all 87 results' _site/index.html
          grep -q 'What are we actually trying to find out?' _site/plain-language.html
          grep -q 'Explain it in 60 seconds' _site/plain-language.html
          grep -q 'Seven questions have to be kept separate' _site/plain-language.html
          grep -q 'What the 87 results are doing' _site/plain-language.html
          grep -q 'P87' _site/plain-language.html

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
