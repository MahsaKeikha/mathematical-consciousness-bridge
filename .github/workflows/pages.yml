name: deploy-research-website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/figures/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build exact-commit website
        run: |
          rm -rf _site
          cp -a website _site
          mkdir -p _site/figures
          cp -a docs/figures/. _site/figures/
          python -c "from pathlib import Path; prefix='https://raw.githubusercontent.com/MahsaKeikha/mathematical-consciousness-bridge/main/docs/figures/'; [(p.write_text(p.read_text(encoding='utf-8').replace('src=\"'+prefix, 'src=\"figures/'), encoding='utf-8')) for p in Path('_site').glob('*.html')]"

      - name: Validate canonical P1-P87 public state
        run: |
          test -f _site/index.html
          test -f _site/research-map.html
          test -f _site/research-navigation.html
          test -f _site/visual-atlas.html
          test -f _site/figures/p87_exact_bounded_primitive_quad_projection_parity.svg
          grep -q 'Explore all 87 results' _site/index.html
          grep -q 'P87 is result 87, not result 86' _site/index.html
          grep -q 'P45-P60' _site/index.html
          grep -q 'Adaptive evidence acquisition' _site/index.html
          grep -q 'P73-P87' _site/index.html
          grep -q 'Channel recovery and model testing' _site/index.html
          grep -q 'Explore all 87 results' _site/research-map.html
          grep -q 'P45-P60' _site/research-map.html
          grep -q 'P73-P87' _site/research-map.html
          grep -q 'Open all 87 results' _site/research-navigation.html
          grep -q 'src="figures/p87_exact_bounded_primitive_quad_projection_parity.svg"' _site/index.html
          grep -q 'src="figures/p87_exact_bounded_primitive_quad_projection_parity.svg"' _site/visual-atlas.html
          if grep -R -E 'Explore all 86 results|86 proposition-level results|all 86 propositions|Current theorem frontier · P86|Current frontier · P86' _site/*.html; then
            echo "Website contains stale pre-P87 public status text."
            exit 1
          fi
          python -c "from pathlib import Path; labels=['Foundations','Physical description','Candidate bridge class','Operational scale','Quantum interface','Adaptive evidence acquisition','Calibration and optimization','Target provenance','Target measurement','Channel recovery and model testing']; ranges=['P1-P10','P11-P18','P19-P24','P25-P37','P38-P44','P45-P60','P61-P70','P71','P72','P73-P87']; [(lambda t,f: (assert_order(t,labels,f),assert_order(t,ranges,f)))(Path('_site',f).read_text(encoding='utf-8'),f) for f in ('index.html','research-map.html','research-navigation.html')]" 2>/dev/null || python - <<'PY'
          from pathlib import Path
          labels = ['Foundations','Physical description','Candidate bridge class','Operational scale','Quantum interface','Adaptive evidence acquisition','Calibration and optimization','Target provenance','Target measurement','Channel recovery and model testing']
          ranges = ['P1-P10','P11-P18','P19-P24','P25-P37','P38-P44','P45-P60','P61-P70','P71','P72','P73-P87']
          for filename in ('index.html', 'research-map.html', 'research-navigation.html'):
              text = Path('_site', filename).read_text(encoding='utf-8')
              assert [text.index(x) for x in labels] == sorted(text.index(x) for x in labels), f'{filename}: branch order is not canonical'
              assert [text.index(x) for x in ranges] == sorted(text.index(x) for x in ranges), f'{filename}: proposition ranges are not canonical'
          PY

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
