name: deploy-research-website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/figures/**"
      - "scripts/prepare_website.py"
      - "scripts/synchronize_research_three_website.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["promote-p89-public-frontier"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify website source synchronization
        run: |
          python -m py_compile scripts/prepare_website.py scripts/synchronize_research_three_website.py
          python scripts/synchronize_research_three_website.py --site website --check

      - name: Verify website JavaScript parses
        run: node --check website/app.js

      - name: Build research website
        run: |
          rm -rf website-deploy _site
          cp -a website website-deploy
          python scripts/prepare_website.py --source website-deploy --output _site

      - name: Verify canonical Research I, II and III identity
        run: |
          R3_PIN="$(python -c 'from scripts.synchronize_research_three_website import CURRENT_RESEARCH_THREE_PIN; print(CURRENT_RESEARCH_THREE_PIN)')"

          grep -q 'What would a scientifically testable bridge from physical description to experience actually require?' _site/index.html
          grep -q 'Explore all 89 results' _site/index.html
          grep -q 'Current record:</strong> 89 proposition-level results through P89' _site/index.html
          grep -q 'Current theorem frontier · P89' _site/index.html
          test "$(grep -o 'id=\"p89-frontier\"' _site/index.html | wc -l)" -eq 1
          test "$(grep -o '<!-- current-frontier-home: P89 -->' _site/index.html | wc -l)" -eq 1
          grep -q 'Research I · Physical-system identification' _site/index.html
          grep -q 'Research III · Consciousness measurement science' _site/index.html
          ! grep -q 'id="p88-frontier"' _site/index.html
          grep -q '#reproduce .equation' _site/reader-experience-v2.css
          grep -q 'contain: inline-size' _site/reader-experience-v2.css

          grep -q 'What are we actually trying to find out?' _site/plain-language.html
          grep -q 'id="three-stage-progress"' _site/plain-language.html
          grep -q 'What the whole research program is doing' _site/plain-language.html
          grep -q '<strong>Research I</strong><span>physical-system identification</span>' _site/plain-language.html
          grep -q '<strong>Research II</strong><span>89 results · current frontier P89</span>' _site/plain-language.html
          grep -q '<strong>Research III</strong><span>measurement science under uncertainty</span>' _site/plain-language.html
          grep -q '<strong>Open</strong><span>final physical-to-experiential bridge</span>' _site/plain-language.html
          ! grep -q '<strong>89</strong><span>Research II proposition-level results</span>' _site/plain-language.html
          ! grep -q '<strong>P89</strong><span>current Research II theorem frontier</span>' _site/plain-language.html

          grep -q 'id="program-stages"' _site/start-here.html
          grep -q 'The whole research program' _site/start-here.html
          grep -q '<strong>Research I</strong><span>physical-system identification</span>' _site/start-here.html
          grep -q '<strong>Research II</strong><span>89 results · current frontier P89</span>' _site/start-here.html
          grep -q '<strong>Research III</strong><span>measurement science under uncertainty</span>' _site/start-here.html
          grep -q 'The 89 Research II propositions by scientific role' _site/start-here.html
          ! grep -q '<strong>89</strong><span>proposition-level results</span>' _site/start-here.html

          grep -q 'P89: What is the strongest possible real linear certificate' _site/research-map.html
          grep -q 'complete real linear' _site/research-map.html
          grep -q '5/168' _site/research-map.html
          test "$(grep -o 'id=\"p89-research-map\"' _site/research-map.html | wc -l)" -eq 1
          grep -q 'index.html#p89-frontier' _site/research-map.html
          ! grep -q 'index.html#p88-frontier' _site/research-map.html

          grep -q '<!-- current-frontier-visual: P89 -->' _site/visual-atlas.html
          grep -q 'Current theorem frontier · P89' _site/visual-atlas.html
          grep -q 'p89_complete_linear_parity_duality.svg' _site/visual-atlas.html
          test "$(grep -o 'id=\"p89-frontier\"' _site/visual-atlas.html | wc -l)" -eq 1
          grep -q 'Previous theorem frontier · P88' _site/visual-atlas.html

          test -f _site/measurement-science.html
          grep -q 'Research III · Consciousness Measurement Science' _site/measurement-science.html
          grep -q 'what can be identified, bounded, predicted, or falsified' _site/measurement-science.html
          grep -q 'Implemented now versus not yet established' _site/measurement-science.html
          grep -q 'CEP JSON schema' _site/measurement-science.html
          grep -q 'Claim JSON schema' _site/measurement-science.html
          grep -q 'Assumption registry' _site/measurement-science.html
          grep -q 'Failure-mode registry' _site/measurement-science.html
          grep -q 'Software and reproducibility' _site/measurement-science.html
          grep -q '34</strong><span>tests in each CI job' _site/measurement-science.html
          grep -q 'dependence-robust partial identification with sharp Fr&eacute;chet-Hoeffding bounds' _site/measurement-science.html
          grep -q '<strong>Two implemented fusion regimes:</strong>' _site/measurement-science.html
          grep -q 'An interval as wide as <code>\[0,1\]</code> is a valid scientific result' _site/measurement-science.html
          grep -q 'docs/partial-identification.md' _site/measurement-science.html
          ! grep -q 'planned by the roadmap' _site/measurement-science.html
          grep -q "research-three-snapshot: ${R3_PIN}" _site/measurement-science.html

          grep -q 'Research III · consciousness measurement science' _site/research-lineage.html
          grep -q '<strong>89</strong><span>proposition-level results</span>' _site/research-lineage.html
          grep -q '<strong>P89</strong><span>current theorem frontier</span>' _site/research-lineage.html
          grep -q '<strong>v0.82.0</strong><span>current documented release</span>' _site/research-lineage.html
          grep -q "${R3_PIN}" _site/research-lineage.html

          grep -q 'measurement-science.html' _site/app.js
          grep -q 'Research III' _site/app.js
          node --check _site/app.js

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
