name: One Shot Complete Theorem Roadmap Figure

on:
  push:
    branches:
      - complete-p1-p100-research-map-navigator
    paths:
      - .github/workflows/one-shot-complete-theorem-roadmap-figure.yml
      - scripts/one_shot_complete_theorem_roadmap_figure.py

permissions:
  contents: write

jobs:
  build-roadmap:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out roadmap branch
        uses: actions/checkout@v4
        with:
          ref: complete-p1-p100-research-map-navigator

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install exact figure environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-figures.txt

      - name: Generate complete P1-P100 roadmap source
        run: python scripts/one_shot_complete_theorem_roadmap_figure.py

      - name: Synchronize canonical visual publication record
        run: python scripts/generate_all_figures.py

      - name: Run roadmap regression contracts
        run: |
          python -m pytest -q \
            tests/test_theorem_roadmap_caption.py \
            tests/test_theorem_roadmap_opening_geometry.py

      - name: Build website with bundled roadmap
        run: |
          rm -rf _site
          python scripts/prepare_website.py --source website --output _site
          python - <<'PY'
          import re
          from pathlib import Path

          figure = Path('docs/figures/theorem_roadmap.svg').read_text(encoding='utf-8')
          nodes = sorted(int(value) for value in re.findall(r'data-proposition="P(\d+)"', figure))
          assert nodes == list(range(1, 101))
          assert 'Complete theorem dependency map for P1-P100' in figure

          atlas = Path('_site/visual-atlas.html').read_text(encoding='utf-8')
          research = Path('_site/research-map.html').read_text(encoding='utf-8')
          for page in (atlas, research):
              assert 'src="figures/theorem_roadmap.svg"' in page
              assert 'Complete theorem roadmap: P1-P100' in page
          assert Path('_site/figures/theorem_roadmap.svg').is_file()
          assert 'id="complete-theorem-roadmap-figure"' in research
          PY

      - name: Verify clean formatting
        run: git diff --check

      - name: Commit complete roadmap figure and synchronized publication files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No complete-roadmap changes to commit"
            exit 0
          fi
          git commit -m "Complete theorem roadmap figure through P100"
          git push origin HEAD:complete-p1-p100-research-map-navigator
