name: One Shot Atlas Enricher Sync

on:
  push:
    branches:
      - visual-atlas-frontier-hierarchy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: visual-atlas-frontier-hierarchy
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact figure environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-figures.txt

      - name: Teach figure enricher the modern Atlas reading rule
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/enrich_figure_documentation.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if legacy_reading_key.strip() in text and reading_key.strip() in text:\n        text = text.replace(legacy_reading_key, "", 1)\n    elif legacy_reading_key.strip() in text:\n'''
          new = '''    current_reading_rule = (\n        '<section class="boundary" id="atlas-reading-rule"><h2>How to read every figure</h2>'\n    )\n    if current_reading_rule in text:\n        pass\n    elif legacy_reading_key.strip() in text and reading_key.strip() in text:\n        text = text.replace(legacy_reading_key, "", 1)\n    elif legacy_reading_key.strip() in text:\n'''
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'expected one Atlas reading-key branch, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Regenerate complete visual publication record
        run: python scripts/generate_all_figures.py

      - name: Require zero unintended generator drift
        run: |
          git diff --check
          unexpected="$(git diff --name-only | grep -v '^scripts/enrich_figure_documentation.py$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated drift:"
            echo "$unexpected"
            exit 1
          fi

      - name: Run focused publication contracts
        run: |
          python scripts/sync_figure_publication.py --check
          python -m pytest -q tests/test_figure_publication_sync.py tests/test_visual_atlas_frontier_hierarchy.py

      - name: Commit permanent generator compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/enrich_figure_documentation.py
          git commit -m "Keep figure enrichment compatible with Atlas hierarchy"
          git push origin HEAD:visual-atlas-frontier-hierarchy
