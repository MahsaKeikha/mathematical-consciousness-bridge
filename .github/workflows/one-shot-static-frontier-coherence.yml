name: One Shot Static Frontier Coherence

on:
  push:
    branches:
      - static-p100-reader-metadata-coherence
    paths:
      - .github/workflows/one-shot-static-frontier-coherence.yml
      - scripts/one_shot_static_frontier_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out coherence branch
        uses: actions/checkout@v4
        with:
          ref: static-p100-reader-metadata-coherence

      - name: Patch static P100 frontier sources
        run: python scripts/one_shot_static_frontier_patch.py

      - name: Verify static frontier contract
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          start = (root / 'START_HERE.md').read_text(encoding='utf-8')
          repro = (root / 'docs' / 'reproducibility.md').read_text(encoding='utf-8')
          citation = (root / 'CITATION.md').read_text(encoding='utf-8')

          assert 'The public theorem frontier is **P100**.' in start
          assert 'You do not need to read 100 propositions' in start
          assert '[P100](docs/proposition_100_anytime_sequential_eprocess.md)' in start
          assert 'The public theorem frontier is **P99**.' not in start

          assert 'Run only the current P100 theorem checks' in repro
          assert 'focused P100 commands below' in repro
          assert 'Run only the current P99 theorem checks' not in repro

          assert 'current documented frontier, P100' in citation
          assert 'Current documented theorem frontier: P100' in citation
          assert 'theorem frontier **P100**' in citation
          assert '## Current theorem frontier: P100' in citation
          assert '## Immediate predecessor theorem frontier: P99' in citation
          assert 'At the preceding stage, the documented theorem frontier was **P99**.' in citation
          assert '## Earlier theorem frontier: P98' in citation
          assert 'At that stage, the documented theorem frontier was **P98**.' in citation
          assert '## Earlier theorem frontier: P97' in citation
          assert 'At that stage, the documented theorem frontier was **P97**.' in citation
          assert 'current documented frontier, P99' not in citation
          assert 'theorem frontier **P99**' not in citation
          PY

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit verified static frontier files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add START_HERE.md docs/reproducibility.md CITATION.md tests/test_static_p100_frontier_docs.py
          if git diff --cached --quiet; then
            echo "No static frontier changes to commit"
            exit 0
          fi
          git commit -m "Synchronize static reader docs to P100"
          git push origin HEAD:static-p100-reader-metadata-coherence
