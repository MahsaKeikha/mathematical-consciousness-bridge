name: integrate-p54-publication

on:
  push:
    branches:
      - p54-publication-integration

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Correct P54 metadata marker
        run: |
          sed -i 's/residual-demand reoptimization after safe pruning, robust experiment design/residual-demand reoptimization, robust experiment design/g' scripts/integrate_p54_publication.py
          sed -i 's/residual-demand reoptimization after safe pruning, metric switching-cost residual scheduling, robust experiment design/residual-demand reoptimization, metric switching-cost residual scheduling, robust experiment design/g' scripts/integrate_p54_publication.py

      - name: Apply P54 publication integration
        run: python scripts/integrate_p54_publication.py

      - name: Remove one-time integration scaffolding
        run: |
          rm scripts/integrate_p54_publication.py
          rm .github/workflows/integrate-p54-publication.yml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run lint
        run: ruff check .

      - name: Commit publication integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate P54 into the main research paper"
          git push origin HEAD:p54-publication-integration
