name: p78-readme-cleanup

on:
  push:
    branches:
      - p78-certified-continuous-model-separation

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p78-certified-continuous-model-separation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair final P78 README numbering and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '**Figure 26. Evidence provenance.**'
          new = '**Figure 27. Evidence provenance.**'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one README numbering anchor, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/p78-readme-cleanup.yml
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run frontier integration regressions
        run: >-
          pytest
          tests/test_p77_research_integration.py
          tests/test_p78_research_integration.py
          tests/test_readme_research_orientation.py
          tests/test_main_page_visual_paper.py
          tests/test_release_metadata_consistency.py
      - name: Commit clean permanent state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/p78-readme-cleanup.yml
          git diff --cached --quiet && { echo "No cleanup changes produced"; exit 1; }
          git commit -m "Finalize P78 reader integration guards"
          git push origin HEAD:p78-certified-continuous-model-separation
