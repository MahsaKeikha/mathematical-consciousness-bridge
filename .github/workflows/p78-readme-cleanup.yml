name: p78-readme-cleanup

on:
  push:
    branches:
      - p78-certified-continuous-model-separation

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p78-certified-continuous-model-separation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded P78 README cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  '- make the P77 full-law criterion computationally decisive for the continuous P75 latent family using certified global lower bounds or equivalent feasibility certificates;',
                  "- extend P78's certified continuous-family computation with tighter pruning, sharper relaxations, and power-aware stopping criteria;",
              ),
              (
                  '**Figure 26. Evidence provenance.**',
                  '**Figure 27. Evidence provenance.**',
              ),
              (
                  '**[Read the complete P1 to P76 detailed proposition record](docs/detailed_proposition_record.md).**',
                  '**[Read the complete P1 to P78 detailed proposition record](docs/detailed_proposition_record.md).**',
              ),
              (
                  '| Public theorem frontier | **P76** |',
                  '| Public theorem frontier | **P78** |',
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guard failed: expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused P78 reader regressions
        run: |
          python -m pip install -e ".[dev]"
          pytest tests/test_p77_research_integration.py tests/test_p78_research_integration.py tests/test_readme_research_orientation.py tests/test_main_page_visual_paper.py tests/test_release_metadata_consistency.py tests/test_document_link_integrity.py
      - name: Commit README cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && { echo "No README changes produced"; exit 1; }
          git commit -m "Finish P78 README frontier cleanup"
          git push origin HEAD:p78-certified-continuous-model-separation
