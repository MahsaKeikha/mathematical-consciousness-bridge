name: p98-core-check

on:
  push:
    branches: ["p98-cross-fitted-selection-valid-certification"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -e ".[dev]"
      - name: Validate P98 mathematical core
        run: |
          python -m pytest -q \
            tests/test_cross_fitted_selection_valid_certification.py \
            tests/test_simultaneous_candidate_family_selection.py \
            tests/test_selection_valid_holdout_stratification.py \
            tests/test_drift_aware_stratified_sign_coherence.py \
            tests/test_finite_range_dependent_sign_coherence.py
          python -m ruff check \
            src/consciousness_bridge/cross_fitted_selection_valid_certification.py \
            tests/test_cross_fitted_selection_valid_certification.py
          git diff --check
