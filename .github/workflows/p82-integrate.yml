name: p82-publication-integration

on:
  push:
    branches:
      - p82-exact-nested-projection-contrast

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p82-exact-nested-projection-contrast
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install exact repository environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements-reproducibility.txt
      - name: Synchronize P82 publication surfaces
        run: |
          python scripts/_integrate_p82_publication.py
          python scripts/_integrate_p82_reader_frontier.py
      - name: Regenerate and enrich figures
        run: python scripts/generate_all_figures.py
      - name: Validate synchronized repository
        run: |
          python -m pytest
          python -m ruff check .
          python scripts/verify_repository.py
      - name: Commit synchronized P82 publication record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md START_HERE.md CHANGELOG.md CITATION.cff CITATION.md CITATION.bib docs figures website src tests scripts
          if git diff --cached --quiet; then
            echo 'No publication changes to commit.'
            exit 0
          fi
          git commit -m 'Synchronize P82 publication frontier'
          git push origin HEAD:p82-exact-nested-projection-contrast
