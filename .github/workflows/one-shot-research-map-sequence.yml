name: One Shot Research Map Sequence

on:
  push:
    branches:
      - research-map-p77-p100-coherent-sequence
    paths:
      - scripts/one_shot_research_map_sequence.py
      - .github/workflows/one-shot-research-map-sequence.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research-map-p77-p100-coherent-sequence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Normalize Research Map sequence
        run: python scripts/one_shot_research_map_sequence.py

      - name: Run focused sequence contracts
        run: |
          python -m pytest -q \
            tests/test_website_research_orientation.py \
            tests/test_research_map_p77_p100_sequence.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit normalized permanent files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/research-map.html tests/test_website_research_orientation.py tests/test_research_map_p77_p100_sequence.py
          git commit -m "Normalize Research Map P77-P100 sequence"
          git push origin HEAD:research-map-p77-p100-coherent-sequence
