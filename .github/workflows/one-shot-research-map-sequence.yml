name: One Shot Research Map Sequence

on:
  push:
    branches:
      - research-map-p77-p100-coherent-sequence
    paths:
      - scripts/one_shot_research_map_sequence.py
      - .github/workflows/one-shot-research-map-sequence.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research-map-p77-p100-coherent-sequence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Normalize Research Map sequence
        run: python scripts/one_shot_research_map_sequence.py

      - name: Preserve direct provenance and overview audit paths
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('website/research-map.html')
          text = path.read_text(encoding='utf-8')

          p92_old = '>Open P92 theorem</a></p>'
          p92_new = (
              '>Open P92 theorem</a> · '
              '<a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/'
              'blob/main/docs/p92_equation_provenance.md">Audit P92 provenance</a></p>'
          )
          if p92_old not in text:
              raise SystemExit('P92 theorem link insertion point not found')
          text = text.replace(p92_old, p92_new, 1)

          p100_old = '<a class="button primary" href="#p100-research-map">Jump to P100</a>'
          p100_new = (
              p100_old
              + '\n    <a class="button" href="index.html#p100-frontier">Open P100 overview</a>'
          )
          if p100_old not in text:
              raise SystemExit('P100 overview insertion point not found')
          text = text.replace(p100_old, p100_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused sequence contracts
        run: |
          python -m pytest -q \
            tests/test_website_research_orientation.py \
            tests/test_research_map_p77_p100_sequence.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit normalized permanent files
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/research-map.html tests/test_website_research_orientation.py tests/test_research_map_p77_p100_sequence.py
          git commit -m "Normalize Research Map P77-P100 sequence"
          git push origin HEAD:research-map-p77-p100-coherent-sequence
