name: figures

# P87 visual publication gate.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_all_figures.py"
      - "scripts/generate_quantitative_atlas.py"
      - "scripts/generate_quantum_foundations_atlas.py"
      - "scripts/enrich_figure_documentation.py"
      - "scripts/sync_figure_publication.py"
      - "scripts/prepare_website.py"
      - "requirements-figures.txt"
      - "requirements-reproducibility.txt"
      - "docs/figures/**"
      - "docs/figure_catalog.md"
      - "docs/reproducibility.md"
      - "figures/**"
      - "website/**"
      - "tests/test_figure_publication_sync.py"
      - "tests/test_figure_documentation_integrity.py"
      - "tests/test_svg_layout_integrity.py"
      - "pyproject.toml"
      - ".github/workflows/figures.yml"
  pull_request:
    paths:
      - "scripts/generate_all_figures.py"
      - "scripts/generate_quantitative_atlas.py"
      - "scripts/generate_quantum_foundations_atlas.py"
      - "scripts/enrich_figure_documentation.py"
      - "scripts/sync_figure_publication.py"
      - "scripts/prepare_website.py"
      - "requirements-figures.txt"
      - "requirements-reproducibility.txt"
      - "docs/figures/**"
      - "docs/figure_catalog.md"
      - "docs/reproducibility.md"
      - "figures/**"
      - "website/**"
      - "tests/test_figure_publication_sync.py"
      - "tests/test_figure_documentation_integrity.py"
      - "tests/test_svg_layout_integrity.py"
      - "pyproject.toml"
      - ".github/workflows/figures.yml"

jobs:
  generate-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install repository and exact figure environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-figures.txt
      - name: Regenerate and synchronize complete visual publication record
        run: python scripts/generate_all_figures.py
      - name: Require byte-identical regeneration and publication sync
        run: |
          python scripts/sync_figure_publication.py --check
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated or synchronized figure artifacts differ from the committed publication record."
            git status --short
            git diff --stat
            exit 1
          fi
      - name: Run visual publication and layout contracts
        run: |
          python -m pytest -q \
            tests/test_figure_publication_sync.py \
            tests/test_figure_documentation_integrity.py \
            tests/test_svg_layout_integrity.py
      - name: Build exact commit website artifact
        run: |
          python scripts/prepare_website.py --source website --output _site
          test -f _site/research-navigation.html
          test -f _site/figures/p87_exact_bounded_primitive_quad_projection_parity.svg
          grep -q 'Explore all 87 results' _site/index.html
          grep -q 'P73-P87' _site/research-map.html
          grep -q 'Current theorem frontier' _site/visual-atlas.html
          if grep -R -E 'Explore all 86 results|86 proposition-level results|Current theorem frontier · P86|Current frontier · P86' _site/*.html; then
            echo "Stale pre-P87 public state found in website artifact."
            exit 1
          fi
      - name: Verify repository publication surfaces
        run: python scripts/verify_repository.py
      - name: Upload reproduced visual record
        uses: actions/upload-artifact@v4
        with:
          name: complete-figure-record-python-3.12.14
          path: |
            docs/figures/quantitative
            docs/figures/quantum
            docs/figures/p87_exact_bounded_primitive_quad_projection_parity.svg
            figures/current_frontier.svg
            figures/README.md
            figures/CURRENT_FRONTIER.md
            figures/manifest.json
            _site/figures/p87_exact_bounded_primitive_quad_projection_parity.svg
            _site/index.html
            _site/research-map.html
            _site/visual-atlas.html
          if-no-files-found: error
