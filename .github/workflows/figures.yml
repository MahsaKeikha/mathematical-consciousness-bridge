name: figures

# Certified current-frontier visual-publication gate. This workflow is permanently read-only.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "START_HERE.md"
      - "docs/**"
      - "figures/**"
      - "website/**"
      - "src/consciousness_bridge/**"
      - "scripts/generate_all_figures.py"
      - "scripts/sync_figure_publication.py"
      - "scripts/prepare_website.py"
      - "scripts/verify_repository.py"
      - "tests/test_*sign_coherence*.py"
      - "tests/test_figure_publication_sync.py"
      - "tests/test_frontier_reader_narrative.py"
      - "requirements-figures.txt"
      - ".github/workflows/figures.yml"
  pull_request:
    paths:
      - "README.md"
      - "START_HERE.md"
      - "docs/**"
      - "figures/**"
      - "website/**"
      - "src/consciousness_bridge/**"
      - "scripts/generate_all_figures.py"
      - "scripts/sync_figure_publication.py"
      - "scripts/prepare_website.py"
      - "scripts/verify_repository.py"
      - "tests/test_*sign_coherence*.py"
      - "tests/test_figure_publication_sync.py"
      - "tests/test_frontier_reader_narrative.py"
      - "requirements-figures.txt"
      - ".github/workflows/figures.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install repository and exact figure environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-figures.txt
      - name: Regenerate canonical visual publication record
        run: python scripts/generate_all_figures.py
      - name: Verify zero visual-publication drift
        run: |
          python scripts/sync_figure_publication.py --check
          python scripts/verify_repository.py
          git diff --check
          if [ -n "$(git status --porcelain)" ]; then
            echo "Canonical figure generation changed committed files."
            git status --short
            git diff --stat
            exit 1
          fi
      - name: Run current-frontier figure and reader contracts
        run: |
          python -m pytest -q \
            tests/test_localized_sign_coherence_rejection.py \
            tests/test_finite_range_dependent_sign_coherence.py \
            tests/test_figure_publication_sync.py \
            tests/test_frontier_reader_narrative.py \
            tests/test_reader_documentation_consistency.py \
            tests/test_research_website_integrity.py
      - name: Build and inspect exact website artifact
        run: |
          rm -rf _site
          python scripts/prepare_website.py --source website --output _site
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("figures/manifest.json").read_text(encoding="utf-8"))
          frontier = str(manifest["current_frontier"]).lower()
          frontier_number = int(frontier.removeprefix("p"))
          previous = f"p{frontier_number - 1}"
          figure = Path(str(manifest["current_frontier_figure"])).name

          home = Path("_site/index.html").read_text(encoding="utf-8")
          atlas = Path("_site/visual-atlas.html").read_text(encoding="utf-8")
          plain = Path("_site/plain-language.html").read_text(encoding="utf-8")
          start = Path("_site/start-here.html").read_text(encoding="utf-8")
          research = Path("_site/research-map.html").read_text(encoding="utf-8")

          assert Path(f"_site/figures/{figure}").is_file()
          assert home.count(f'id="{frontier}-frontier"') == 1
          assert figure in home
          assert atlas.index(f'id="{frontier}-frontier"') < atlas.index(f'id="{previous}-frontier"')
          assert figure in atlas
          plain_phrase = f"{frontier_number} linked results · technical endpoint P{frontier_number}"
          start_phrase = f"{frontier_number} results · current frontier P{frontier_number}"
          assert plain_phrase in plain
          assert "A note about proposition numbers" in plain
          assert "reader-frontier" not in plain
          assert start_phrase in start
          assert start.count(f'id="{frontier}-reader-frontier"') == 1
          assert research.count(f'id="{frontier}-research-map"') == 1
          assert f"The current theorem frontier is P{frontier_number}." in research
          for path in sorted(Path("_site").glob("*.html")):
              assert path.read_text(encoding="utf-8").rstrip().endswith("</html>"), path
          PY
      - name: Upload exact current-frontier visual record
        uses: actions/upload-artifact@v4
        with:
          name: current-frontier-visual-publication-record
          path: |
            figures/current_frontier.svg
            figures/manifest.json
            _site/figures
          if-no-files-found: error
