name: figures

on:
  pull_request:
    paths:
      - "website/research-map.html"
      - ".github/workflows/figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-p91-reader-surface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p91-mixed-prevalence-rank-two-flattening
          fetch-depth: 0

      - name: Remove legacy duplicate and restore permanent figure gate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("website/research-map.html")
          text = path.read_text(encoding="utf-8")
          sentence = "P89 closes the complete real linear parity-functional class, P90 adds exact nonlinear single-component separation, and P91 extends nonlinear separation to arbitrary latent mixing through a rank-two flattening certificate."
          while text.count(sentence) > 1:
              text = text.replace(sentence + " " + sentence, sentence, 1)
          if text.count(sentence) != 1:
              raise RuntimeError(f"expected exactly one P89/P90/P91 summary, found {text.count(sentence)}")
          path.write_text(text, encoding="utf-8")
          PY

          git show HEAD^:.github/workflows/figures.yml > .github/workflows/figures.yml
          git diff --check

      - name: Commit final stable P91 state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "P91 reader surface already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/research-map.html .github/workflows/figures.yml
          git commit -m "Finalize stable P91 publication state"
          git push origin HEAD:p91-mixed-prevalence-rank-two-flattening
