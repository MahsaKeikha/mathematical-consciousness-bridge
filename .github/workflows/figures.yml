name: figures

# Certified P93 visual-publication gate. This workflow is permanently read-only.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "START_HERE.md"
      - "docs/**"
      - "figures/**"
      - "website/**"
      - "src/consciousness_bridge/localized_sign_coherence_rejection.py"
      - "scripts/generate_all_figures.py"
      - "scripts/sync_figure_publication.py"
      - "scripts/prepare_website.py"
      - "scripts/verify_repository.py"
      - "tests/test_localized_sign_coherence_rejection.py"
      - "tests/test_figure_publication_sync.py"
      - "tests/test_p93_reader_surface_coherence.py"
      - "requirements-figures.txt"
      - ".github/workflows/figures.yml"
  pull_request:
    paths:
      - "README.md"
      - "START_HERE.md"
      - "docs/**"
      - "figures/**"
      - "website/**"
      - "src/consciousness_bridge/localized_sign_coherence_rejection.py"
      - "scripts/generate_all_figures.py"
      - "scripts/sync_figure_publication.py"
      - "scripts/prepare_website.py"
      - "scripts/verify_repository.py"
      - "tests/test_localized_sign_coherence_rejection.py"
      - "tests/test_figure_publication_sync.py"
      - "tests/test_p93_reader_surface_coherence.py"
      - "requirements-figures.txt"
      - ".github/workflows/figures.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install repository and exact figure environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-figures.txt
      - name: Regenerate canonical visual publication record
        run: python scripts/generate_all_figures.py
      - name: Verify zero visual-publication drift
        run: |
          python scripts/sync_figure_publication.py --check
          python scripts/verify_repository.py
          git diff --check
          if [ -n "$(git status --porcelain)" ]; then
            echo "Canonical figure generation changed committed files."
            git status --short
            git diff --stat
            exit 1
          fi
      - name: Run P93 figure and reader contracts
        run: |
          python -m pytest -q \
            tests/test_localized_sign_coherence_rejection.py \
            tests/test_figure_publication_sync.py \
            tests/test_p93_reader_surface_coherence.py
      - name: Build and inspect exact website artifact
        run: |
          rm -rf _site
          python scripts/prepare_website.py --source website --output _site
          python - <<'PY'
          from pathlib import Path

          figure = "p93_localized_sign_coherence_rejection.svg"
          home = Path("_site/index.html").read_text(encoding="utf-8")
          atlas = Path("_site/visual-atlas.html").read_text(encoding="utf-8")
          plain = Path("_site/plain-language.html").read_text(encoding="utf-8")
          start = Path("_site/start-here.html").read_text(encoding="utf-8")
          research = Path("_site/research-map.html").read_text(encoding="utf-8")

          assert Path(f"_site/figures/{figure}").is_file()
          assert home.count('id="p93-frontier"') == 1
          assert 'id="p92-frontier"' not in home
          assert figure in home
          assert atlas.index('id="p93-frontier"') < atlas.index('id="p92-frontier"') < atlas.index('id="p91-frontier"')
          assert figure in atlas
          assert "93 results · current frontier P93" in plain
          assert "93 results · current frontier P93" in start
          assert plain.count('id="p93-reader-frontier"') == 1
          assert start.count('id="p93-reader-frontier"') == 1
          assert research.count('id="p93-research-map"') == 1
          assert "Current theorem frontier P93" in research
          for path in sorted(Path("_site").glob("*.html")):
              assert path.read_text(encoding="utf-8").rstrip().endswith("</html>"), path
          PY
      - name: Upload exact P93 visual record
        uses: actions/upload-artifact@v4
        with:
          name: p93-visual-publication-record
          path: |
            docs/figures/p93_localized_sign_coherence_rejection.svg
            figures/current_frontier.svg
            figures/manifest.json
            _site/figures/p93_localized_sign_coherence_rejection.svg
