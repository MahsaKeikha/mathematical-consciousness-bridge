name: figures

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - docs-first-reader-experience-p81
    paths:
      - "scripts/generate_all_figures.py"
      - "scripts/generate_quantitative_atlas.py"
      - "scripts/generate_quantum_foundations_atlas.py"
      - "docs/figures/**"
      - "docs/reproducibility.md"
      - "pyproject.toml"
      - ".github/workflows/figures.yml"
  pull_request:
    paths:
      - "scripts/generate_all_figures.py"
      - "scripts/generate_quantitative_atlas.py"
      - "scripts/generate_quantum_foundations_atlas.py"
      - "docs/figures/**"
      - "docs/reproducibility.md"
      - "pyproject.toml"
      - ".github/workflows/figures.yml"

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository and figure dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Regenerate computational figure atlases
        run: python scripts/generate_all_figures.py
      - name: Verify repository publication surfaces
        run: python scripts/verify_repository.py
      - name: Show generated working-tree changes
        run: git status --short
      - name: Upload generated figure atlases
        uses: actions/upload-artifact@v4
        with:
          name: generated-figure-atlases-python-3.12
          path: |
            docs/figures/quantitative
            docs/figures/quantum
          if-no-files-found: error
