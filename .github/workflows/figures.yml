name: figures

on:
  pull_request:
    paths:
      - "website/**"
      - "tests/test_p91_reader_surface_coherence.py"
      - ".github/workflows/figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-p91-reader-surfaces:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p91-mixed-prevalence-rank-two-flattening
          fetch-depth: 0

      - name: Canonicalize P91 reader surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          def rewrite(relative: str, pairs: tuple[tuple[str, str], ...]) -> str:
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
              return text

          start = rewrite(
              "website/start-here.html",
              (
                  ("current Research II P90 frontier", "current Research II P91 frontier"),
                  ("Open all 90 Research II results", "Open all 91 Research II results"),
                  ("The 90 propositions are the formal theorem record of Research II", "The 91 propositions are the formal theorem record of Research II"),
                  ("P1-P90 build the mathematical conditions", "P1-P91 build the mathematical conditions"),
                  ("P75-P90 test the declared target-measurement model itself", "P75-P91 test the declared target-measurement model itself"),
                  ("<span>P75-P90</span>", "<span>P75-P91</span>"),
                  ("P78-P90 progressively tighten global separation from the declared continuous model family", "P78-P91 develop certified nonlinear separation from the declared continuous model family"),
                  ("Read P90 theorem", "Read P91 theorem"),
                  ("docs/proposition_90_exact_nonlinear_rank_one_separation.md", "docs/proposition_91_mixed_prevalence_rank_two_flattening_separation.md"),
                  ("You do not need to read 89 Research II proofs in order", "You do not need to read 91 Research II proofs in order"),
                  ("P19 and P71-P90", "P19 and P71-P91"),
                  ("P74-P89", "P74-P91"),
              ),
          )
          p90 = '<p><strong>P90 moves beyond that complete linear envelope.</strong> On the strict P75 box, prevalence is fixed at zero, so the active observable law is a single product Bernoulli component and a canonical two-by-two slice must satisfy <strong>ad = bc</strong>. The empirical determinant residual gives a lower radius of <strong>5/72</strong>, and an explicit rational P75 point attains the same full-law distance. Thus <strong>L90 = 5/72 = (7/3)L89</strong>.</p>'
          p91 = '<p><strong>P91 extends the nonlinear result to arbitrary latent prevalence.</strong> For every two-component P75 law, the declared (X1,X4) versus (X2,X3) 4 by 4 flattening has rank at most two, so every 3 by 3 minor vanishes. On the established empirical witness, exact nonnegative interval certification excludes the closed full-law L-infinity ball of radius <strong>1/42</strong>, while an explicit rational point with prevalence <strong>4/5</strong> lies at distance <strong>1/24</strong>. Thus <strong>1/42 &lt; d_inf(P_emp, M75) &lt;= 1/24</strong>. The upper endpoint is not claimed to be the exact global optimum.</p>'
          if p91 not in start:
              if p90 not in start:
                  raise RuntimeError("P90 historical paragraph anchor not found in Start Here")
              start = start.replace(p90, p90 + "\n      " + p91, 1)
              Path("website/start-here.html").write_text(start, encoding="utf-8")

          plain = rewrite(
              "website/plain-language.html",
              (
                  ("This is the 90-result Research II theorem program currently reaching P90.", "This is the 91-result Research II theorem program currently reaching P91."),
                  ("A 90-result sufficiency and falsification architecture", "A 91-result sufficiency and falsification architecture"),
                  ("The 90-result proposition program", "The 91-result proposition program"),
                  ("The current theorem frontier is P90.", "The current theorem frontier is P91."),
                  ("P90 is the current checkpoint, not the destination", "P91 is the current checkpoint, not the destination"),
                  ("P90 is the current mathematical checkpoint inside a much larger research program.", "P91 is the current mathematical checkpoint inside a much larger research program."),
                  ("The destination is not Proposition 90, 100, or 200.", "The destination is not Proposition 91, 100, or 200."),
                  ("shows how all 90 Research II results connect", "shows how all 91 Research II results connect"),
              ),
          )

          research_path = Path("website/research-map.html")
          research = research_path.read_text(encoding="utf-8")
          trailing_marker = '<section id="p90-research-map" class="theorem-frontier">'
          close_html = research.find("</html>")
          trailing_start = research.find(trailing_marker)
          if trailing_start != -1 and close_html != -1 and trailing_start > close_html:
              trailing = research[trailing_start:].strip()
              base = research[:trailing_start].rstrip()
              close_main = base.find("</main>")
              if close_main == -1:
                  raise RuntimeError("research-map.html is missing </main>")
              research = base[:close_main] + trailing + "\n" + base[close_main:] + "\n"

          research_pairs = (
              ("through Proposition 88.", "through Proposition 91."),
              ("Eighty-eight results, one dependency-aware scientific program", "Ninety-one results, one dependency-aware scientific program"),
              ("<strong>88</strong><span>proposition-level results</span>", "<strong>91</strong><span>proposition-level results</span>"),
              ("<span>6 · P73-P88</span>", "<span>6 · P73-P91</span>"),
              (
                  "Recover the declared binary target channel, test the model itself, then strengthen rejection from selected constraints to exact global separation of the continuous P75 family, culminating in P88 exact radius-three bounded primitive four-event shared-parameter parity-functional separation.",
                  "Recover the declared binary target channel, test the model itself, then strengthen rejection from selected constraints through complete linear parity closure and nonlinear model-image constraints, culminating in P91 mixed-prevalence rank-two flattening separation.",
              ),
              (
                  "and P88 enlarges that complete primitive coefficient radius to three and raises the same exact witness bound from 1/96 to 1/64.",
                  "and P88 enlarges that complete primitive coefficient radius to three and raises the same exact witness bound from 1/96 to 1/64. P89 closes the complete real linear parity-functional class, P90 adds exact nonlinear single-component separation, and P91 extends nonlinear separation to arbitrary latent mixing through a rank-two flattening certificate.",
              ),
              ("Current Research II model-audit range: P75-P90.", "Current Research II model-audit range: P75-P91."),
              ('<a href="index.html#p90-frontier">Current frontier</a>', '<a href="visual-atlas.html#p90-frontier">Historical P90 figure</a>'),
          )
          for old, new in research_pairs:
              research = research.replace(old, new)
          research_path.write_text(research, encoding="utf-8")

          required = {
              "website/start-here.html": (
                  "Open all 91 Research II results",
                  "P91 extends the nonlinear result to arbitrary latent prevalence",
                  "Read P91 theorem",
              ),
              "website/plain-language.html": (
                  "This is the 91-result Research II theorem program currently reaching P91.",
                  "P91 is the current checkpoint, not the destination",
                  "shows how all 91 Research II results connect",
              ),
              "website/research-map.html": (
                  "Ninety-one results, one dependency-aware scientific program",
                  "<strong>91</strong><span>proposition-level results</span>",
                  "culminating in P91 mixed-prevalence rank-two flattening separation",
                  "Historical P90 figure",
              ),
          }
          for relative, markers in required.items():
              text = Path(relative).read_text(encoding="utf-8")
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  raise RuntimeError(f"{relative} P91 migration incomplete: {missing}")

          research = Path("website/research-map.html").read_text(encoding="utf-8")
          assert research.index('id="p90-research-map"') < research.index('id="p91-research-map"') < research.index("</main>") < research.index("</html>")
          PY

      - name: Commit P91 reader-surface migration
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "P91 reader surfaces already canonical."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/start-here.html website/plain-language.html website/research-map.html
          git commit -m "Canonicalize P91 reader surfaces"
          git push origin HEAD:p91-mixed-prevalence-rank-two-flattening
