name: figures

# One-run P93 feature-branch migration. This file restores itself to read-only
# before the generated publication commit is pushed.
on:
  pull_request:
    paths:
      - "README.md"
      - "START_HERE.md"
      - "scripts/promote_p93_public_frontier.py"
      - "scripts/fix_p93_publication_contracts.py"
      - "scripts/generate_all_figures.py"
      - "scripts/sync_figure_publication.py"
      - "scripts/prepare_website.py"
      - "scripts/verify_repository.py"
      - "docs/**"
      - "figures/**"
      - "website/**"
      - "tests/test_figure_publication_sync.py"
      - "tests/test_p93_reader_surface_coherence.py"
      - ".github/workflows/figures.yml"
      - ".github/workflows/promote-p93-branch.yml"

permissions:
  contents: write

jobs:
  migrate-p93:
    if: github.head_ref == 'p93-localized-sign-coherence-rejection' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p93-localized-sign-coherence-rejection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install repository and exact figure environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-figures.txt
      - name: Promote P93 publication surfaces
        run: python scripts/promote_p93_public_frontier.py
      - name: Repair exact P93 publication labels
        run: python scripts/fix_p93_publication_contracts.py
      - name: Regenerate canonical visual publication record
        run: python scripts/generate_all_figures.py
      - name: Normalize reader-facing punctuation
        run: python scripts/normalize_documentation_punctuation.py
      - name: Restore permanent read-only P93 figure gate
        run: |
          git show origin/main:.github/workflows/figures.yml > /tmp/figures.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/figures.yml').read_text(encoding='utf-8')
          replacements = (
              ('Certified P92 visual publication gate.', 'Certified P93 visual publication gate.'),
              ('scripts/promote_p92_public_frontier.py', 'src/consciousness_bridge/localized_sign_coherence_rejection.py'),
              ('tests/test_p92_reader_surface_coherence.py', 'tests/test_p93_reader_surface_coherence.py'),
              ('p92_exact_global_mixed_prevalence_distance.svg', 'p93_localized_sign_coherence_rejection.svg'),
              ('Current theorem frontier · P92', 'Current theorem frontier · P93'),
              ('proposition_92_exact_global_mixed_prevalence_distance.md', 'proposition_93_localized_sign_coherence_rejection.md'),
              ('exact_global_mixed_prevalence_distance.py', 'localized_sign_coherence_rejection.py'),
              ('test_exact_global_mixed_prevalence_distance.py', 'test_localized_sign_coherence_rejection.py'),
              ('The 92 results form several dependency branches.', 'The 93 results form several dependency branches.'),
              ('all 92 propositions', 'all 93 propositions'),
              ("assert 'P92' in r and '92' in r", "assert 'P93' in r and '93' in r"),
          )
          for old, new in replacements:
              source = source.replace(old, new)
          source = source.replace(
              "p=t.index('id=\\\"p92-frontier\\\"')",
              "p=t.index('id=\\\"p93-frontier\\\"')",
          )
          source = source.replace(
              "p92=t.index('id=\\\"p92-frontier\\\"'); p91=t.index('id=\\\"p91-frontier\\\"'); p90=t.index('id=\\\"p90-frontier\\\"'); assert p92 < p91 < p90",
              "p93=t.index('id=\\\"p93-frontier\\\"'); p92=t.index('id=\\\"p92-frontier\\\"'); p91=t.index('id=\\\"p91-frontier\\\"'); assert p93 < p92 < p91",
          )
          Path('.github/workflows/figures.yml').write_text(source, encoding='utf-8')
          PY
          rm -f .github/workflows/promote-p93-branch.yml
          rm -f scripts/promote_p93_public_frontier.py
          rm -f scripts/fix_p93_publication_contracts.py
      - name: Validate generated patch
        run: |
          git diff --check
          git status --short
      - name: Commit synchronized P93 publication state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "P93 publication state already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote P93 public frontier"
          git push origin HEAD:p93-localized-sign-coherence-rejection
