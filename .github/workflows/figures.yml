name: figures

# Certified P88 visual publication gate.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "scripts/generate_all_figures.py"
      - "scripts/generate_quantitative_atlas.py"
      - "scripts/generate_quantum_foundations_atlas.py"
      - "scripts/enrich_figure_documentation.py"
      - "scripts/sync_figure_publication.py"
      - "scripts/prepare_website.py"
      - "scripts/verify_repository.py"
      - "requirements-figures.txt"
      - "requirements-reproducibility.txt"
      - "docs/figures/**"
      - "docs/figure_catalog.md"
      - "docs/reproducibility.md"
      - "figures/**"
      - "website/index.html"
      - "website/visual-atlas.html"
      - "tests/test_figure_publication_sync.py"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "README.md"
      - "scripts/generate_all_figures.py"
      - "scripts/generate_quantitative_atlas.py"
      - "scripts/generate_quantum_foundations_atlas.py"
      - "scripts/enrich_figure_documentation.py"
      - "scripts/sync_figure_publication.py"
      - "scripts/prepare_website.py"
      - "scripts/verify_repository.py"
      - "requirements-figures.txt"
      - "requirements-reproducibility.txt"
      - "docs/figures/**"
      - "docs/figure_catalog.md"
      - "docs/reproducibility.md"
      - "figures/**"
      - "website/index.html"
      - "website/visual-atlas.html"
      - "tests/test_figure_publication_sync.py"
      - "pyproject.toml"
      - ".github/workflows/**"

jobs:
  generate-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install repository and exact figure environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-figures.txt
      - name: Regenerate and synchronize complete visual publication record
        run: python scripts/generate_all_figures.py
      - name: Normalize rerunnable P88 reader markers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          marker_specs = (
              (Path("website/index.html"), "<!-- current-frontier-home: P88 -->"),
              (Path("website/visual-atlas.html"), "<!-- current-frontier-visual: P88 -->"),
          )
          for path, marker in marker_specs:
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  rf"(?:{re.escape(marker)}\s*)+",
                  marker + "\n",
                  text,
                  flags=re.MULTILINE,
              )
              path.write_text(text, encoding="utf-8")

          research_map = Path("website/research-map.html")
          text = research_map.read_text(encoding="utf-8")
          text = re.sub(
              r'\n{3,}(?=<section id="p88-research-map")',
              "\n\n",
              text,
          )
          research_map.write_text(text, encoding="utf-8")
          PY
      - name: Require byte-identical regeneration and publication sync
        run: |
          python scripts/sync_figure_publication.py --check
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated or synchronized figure artifacts differ from the committed publication record."
            git status --short
            git diff --stat
            git diff
            exit 1
          fi
      - name: Run permanent figure publication contract
        run: python -m pytest -q tests/test_figure_publication_sync.py tests/test_figure_documentation_integrity.py
      - name: Build exact-commit website figure artifact
        run: |
          python scripts/prepare_website.py --source website --output _site
          test -f _site/figures/p88_exact_radius_three_bounded_primitive_quad_projection_parity.svg
          grep -q 'src="figures/p88_exact_radius_three_bounded_primitive_quad_projection_parity.svg"' _site/visual-atlas.html
          grep -q 'src="figures/p88_exact_radius_three_bounded_primitive_quad_projection_parity.svg"' _site/index.html
          python -c "from pathlib import Path; t=Path('_site/index.html').read_text(encoding='utf-8'); p=t.index('id=\"p88-frontier\"'); assert p < t.index('id=\"plain-language\"'); assert p < t.index('id=\"p87-frontier\"'); assert p < t.index('id=\"p86-frontier\"'); assert 'Current theorem frontier · P87' not in t"
          python -c "from pathlib import Path; t=Path('_site/visual-atlas.html').read_text(encoding='utf-8'); p=t.index('id=\"p88-frontier\"'); assert p < t.index('id=\"p87-frontier\"'); assert p < t.index('id=\"p86-frontier\"')"
      - name: Verify repository publication surfaces
        run: python scripts/verify_repository.py
      - name: Upload complete reproduced visual record
        uses: actions/upload-artifact@v4
        with:
          name: complete-figure-record-python-3.12.14
          path: |
            docs/figures/quantitative
            docs/figures/quantum
            docs/figures/p88_exact_radius_three_bounded_primitive_quad_projection_parity.svg
            figures/current_frontier.svg
            figures/README.md
            figures/CURRENT_FRONTIER.md
            figures/manifest.json
            _site/figures/p88_exact_radius_three_bounded_primitive_quad_projection_parity.svg
            _site/index.html
            _site/visual-atlas.html
          if-no-files-found: error
