name: figures

# Certified P91 visual publication gate.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "scripts/generate_all_figures.py"
      - "scripts/generate_quantitative_atlas.py"
      - "scripts/generate_quantum_foundations_atlas.py"
      - "scripts/enrich_figure_documentation.py"
      - "scripts/sync_figure_publication.py"
      - "scripts/promote_p91_public_frontier.py"
      - "scripts/prepare_website.py"
      - "scripts/verify_repository.py"
      - "requirements-figures.txt"
      - "requirements-reproducibility.txt"
      - "docs/figures/**"
      - "docs/figure_catalog.md"
      - "docs/reproducibility.md"
      - "figures/**"
      - "website/index.html"
      - "website/visual-atlas.html"
      - "website/plain-language.html"
      - "website/start-here.html"
      - "tests/test_figure_publication_sync.py"
      - "tests/test_p91_reader_surface_coherence.py"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "README.md"
      - "scripts/generate_all_figures.py"
      - "scripts/generate_quantitative_atlas.py"
      - "scripts/generate_quantum_foundations_atlas.py"
      - "scripts/enrich_figure_documentation.py"
      - "scripts/sync_figure_publication.py"
      - "scripts/promote_p91_public_frontier.py"
      - "scripts/prepare_website.py"
      - "scripts/verify_repository.py"
      - "requirements-figures.txt"
      - "requirements-reproducibility.txt"
      - "docs/figures/**"
      - "docs/figure_catalog.md"
      - "docs/reproducibility.md"
      - "figures/**"
      - "website/index.html"
      - "website/visual-atlas.html"
      - "website/plain-language.html"
      - "website/start-here.html"
      - "tests/test_figure_publication_sync.py"
      - "tests/test_p91_reader_surface_coherence.py"
      - "pyproject.toml"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p91-mixed-prevalence-rank-two-flattening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install repository and exact figure environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-figures.txt
      - name: Repair residual P91 Start Here wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("website/start-here.html")
          text = path.read_text(encoding="utf-8")
          replacements = (
              ("current Research II P90 frontier", "current Research II P91 frontier"),
              ("Open all 90 Research II results", "Open all 91 Research II results"),
              ("The 90 propositions are the formal theorem record of Research II", "The 91 propositions are the formal theorem record of Research II"),
              ("P1-P90 build the mathematical conditions", "P1-P91 build the mathematical conditions"),
              ("P75-P90 test the declared target-measurement model itself", "P75-P91 test the declared target-measurement model itself"),
              ("<span>P75-P90</span>", "<span>P75-P91</span>"),
              ("P78-P90 progressively tighten global separation from the declared continuous model family", "P78-P91 develop certified nonlinear separation from the declared continuous model family"),
              ("Read P90 theorem", "Read P91 theorem"),
              ("docs/proposition_90_exact_nonlinear_rank_one_separation.md", "docs/proposition_91_mixed_prevalence_rank_two_flattening_separation.md"),
              ("You do not need to read 89 Research II proofs in order", "You do not need to read 91 Research II proofs in order"),
              ("P19 and P71-P90", "P19 and P71-P91"),
              ("P74-P89", "P74-P91"),
          )
          for old, new in replacements:
              text = text.replace(old, new)

          p90 = '<p><strong>P90 moves beyond that complete linear envelope.</strong> On the strict P75 box, prevalence is fixed at zero, so the active observable law is a single product Bernoulli component and a canonical two-by-two slice must satisfy <strong>ad = bc</strong>. The empirical determinant residual gives a lower radius of <strong>5/72</strong>, and an explicit rational P75 point attains the same full-law distance. Thus <strong>L90 = 5/72 = (7/3)L89</strong>.</p>'
          p91 = '<p><strong>P91 extends the nonlinear result to arbitrary latent prevalence.</strong> For every two-component P75 law, the declared (X1,X4) versus (X2,X3) 4 by 4 flattening has rank at most two, so every 3 by 3 minor vanishes. On the established empirical witness, exact nonnegative interval certification excludes the closed full-law L-infinity ball of radius <strong>1/42</strong>, while an explicit rational point with prevalence <strong>4/5</strong> lies at distance <strong>1/24</strong>. Thus <strong>1/42 &lt; d_inf(P_emp, M75) &lt;= 1/24</strong>. The upper endpoint is not claimed to be the exact global optimum.</p>'
          if p91 not in text:
              if p90 not in text:
                  raise RuntimeError("P90 historical paragraph anchor not found")
              text = text.replace(p90, p90 + "\n      " + p91, 1)

          required = (
              "current Research II P91 frontier",
              "Open all 91 Research II results",
              "The 91 propositions are the formal theorem record of Research II",
              "P1-P91 build the mathematical conditions",
              "P75-P91 test the declared target-measurement model",
              "<span>P75-P91</span>",
              "P91 extends the nonlinear result to arbitrary latent prevalence",
              "Read P91 theorem",
              "You do not need to read 91 Research II proofs in order",
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise RuntimeError(f"P91 Start Here repair incomplete: {missing}")

          path.write_text(text, encoding="utf-8")
          PY
      - name: Regenerate and synchronize complete visual publication record
        run: python scripts/generate_all_figures.py
      - name: Commit synchronized Start Here page
        if: github.event_name == 'pull_request'
        run: |
          git show HEAD^:.github/workflows/figures.yml > .github/workflows/figures.yml
          if [ -z "$(git status --porcelain)" ]; then
            echo "P91 Start Here is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/start-here.html .github/workflows/figures.yml figures docs/figures
          git commit -m "Synchronize P91 Start Here surface"
          git push origin HEAD:p91-mixed-prevalence-rank-two-flattening
      - name: Capture publication drift diagnostics
        run: |
          {
            echo "# git status --short"
            git status --short
            echo
            echo "# git diff --stat"
            git diff --stat
            echo
            echo "# git diff"
            git diff
          } > "${RUNNER_TEMP}/figure-publication-drift.txt"
      - name: Upload publication drift diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: figure-publication-drift-python-3.12.14
          path: ${{ runner.temp }}/figure-publication-drift.txt
          if-no-files-found: error
      - name: Require byte-identical regeneration and publication sync
        run: |
          python scripts/sync_figure_publication.py --check
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated or synchronized figure artifacts differ from the committed publication record."
            git status --short
            git diff --stat
            git diff
            exit 1
          fi
      - name: Run permanent figure publication contract
        run: python -m pytest -q tests/test_figure_publication_sync.py tests/test_figure_documentation_integrity.py tests/test_p91_reader_surface_coherence.py
      - name: Build exact-commit website figure artifact
        run: |
          python scripts/prepare_website.py --source website --output _site
          test -f _site/figures/p91_mixed_prevalence_rank_two_flattening_separation.svg
          grep -q 'src="figures/p91_mixed_prevalence_rank_two_flattening_separation.svg"' _site/visual-atlas.html
          grep -q 'src="figures/p91_mixed_prevalence_rank_two_flattening_separation.svg"' _site/index.html
          python -c "from pathlib import Path; t=Path('_site/index.html').read_text(encoding='utf-8'); r1=t.index('id=\"research-i-overview\"'); p=t.index('id=\"p91-frontier\"'); r3=t.index('id=\"research-iii-overview\"'); paths=t.index('id=\"reader-paths\"'); assert r1 < p < r3 < paths < t.index('id=\"plain-language\"'); assert 'id=\"p88-frontier\"' not in t"
          python -c "from pathlib import Path; t=Path('_site/visual-atlas.html').read_text(encoding='utf-8'); p91=t.index('id=\"p91-frontier\"'); p90=t.index('id=\"p90-frontier\"'); p89=t.index('id=\"p89-frontier\"'); assert p91 < p90 < p89"
          python -c "from pathlib import Path; p=Path('_site/plain-language.html').read_text(encoding='utf-8'); s=Path('_site/start-here.html').read_text(encoding='utf-8'); assert 'id=\"three-stage-progress\"' in p and 'id=\"program-stages\"' in s; assert all(x in p for x in ('Research I','Research II','Research III')); assert all(x in s for x in ('Research I','Research II','Research III'))"
      - name: Verify repository publication surfaces
        run: python scripts/verify_repository.py
      - name: Upload complete reproduced visual record
        uses: actions/upload-artifact@v4
        with:
          name: complete-figure-record-python-3.12.14
          path: |
            docs/figures/quantitative
            docs/figures/quantum
            docs/figures/p91_mixed_prevalence_rank_two_flattening_separation.svg
            figures/current_frontier.svg
            figures/README.md
            figures/CURRENT_FRONTIER.md
            figures/manifest.json
            _site/figures/p91_mixed_prevalence_rank_two_flattening_separation.svg
            _site/index.html
            _site/plain-language.html
            _site/start-here.html
            _site/visual-atlas.html
          if-no-files-found: error
