name: One Shot Sources P1-P100 Sequence

on:
  push:
    branches:
      - sources-p1-p100-coherent-sequence
    paths:
      - .github/workflows/one-shot-sources-sequence.yml
      - scripts/one_shot_sources_sequence.py

permissions:
  contents: write

jobs:
  build-sources-sequence:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Sources sequence branch
        uses: actions/checkout@v4
        with:
          ref: sources-p1-p100-coherent-sequence

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install repository environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-figures.txt

      - name: Rebuild Sources page as a complete ordered theorem path
        run: python scripts/one_shot_sources_sequence.py

      - name: Run focused sequence contracts
        run: |
          python -m pytest -q \
            tests/test_sources_p1_p100_sequence.py \
            tests/test_complete_research_map_proposition_navigator.py \
            tests/test_theorem_roadmap_caption.py

      - name: Build exact website
        run: |
          rm -rf _site
          python scripts/prepare_website.py --source website --output _site
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path('_site/sources.html').read_text(encoding='utf-8')
          begin = '<!-- BEGIN COMPLETE SOURCE SEQUENCE -->'
          end = '<!-- END COMPLETE SOURCE SEQUENCE -->'
          block = source.split(begin, 1)[1].split(end, 1)[0]
          numbers = [int(value) for value in re.findall(r'data-proposition="P(\d+)"', block)]
          assert numbers == list(range(1, 101))
          details = [int(value) for value in re.findall(r'<section id="p(\d+)-source"', source)]
          assert details == list(range(86, 101))
          assert 'Follow every theorem source from P1 through P100 in order' in source
          assert 'Complete theorem roadmap P1-P100' in source
          PY

      - name: Run repository publication verification
        run: python scripts/verify_repository.py

      - name: Verify clean formatting
        run: git diff --check

      - name: Commit coherent Sources sequence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Sources sequence changes to commit"
            exit 0
          fi
          git commit -m "Make Sources theorem sequence coherent through P100"
          git push origin HEAD:sources-p1-p100-coherent-sequence
