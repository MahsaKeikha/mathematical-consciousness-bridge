name: one-shot-p57-figure-docs

on:
  push:
    branches: [visual-polish-p57]
    paths:
      - .github/workflows/one-shot-p57-figure-docs.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-polish-p57
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Integrate permanent P57 figure record and catalog row
        run: |
          python - <<'PY'
          from pathlib import Path

          records = Path("scripts/conceptual_figure_records.py")
          text = records.read_text(encoding="utf-8")
          marker = '    "docs/figures/p58_finite_data_metric_uncertainty.svg": {'
          if '"docs/figures/p57_switching_metric_perturbation.svg"' not in text:
              record = '''    "docs/figures/p57_switching_metric_perturbation.svg": {
                  "title": "P57 deterministic switching-metric perturbation stability",
                  "description": (
                      "What this figure shows: P57 controls exact P54 reoptimization when residual demand, setup origin, and a declared finite switching metric all change. The theorem assumes two valid finite metrics on one common relevant point set and measures their uniform difference by delta. "
                      "How to read it: the three upper input cards specify the old exact state, the new exact state, and the sharp q-times-delta stability bound for changing only the metric at a fixed support and start. All three feed the central P55-P56-P57 certificate, where the fixed-geometry release is reduced by the smaller of two valid start-motion-plus-metric-drift penalties. The lower cards explain the sharp route-edge factor, the sufficient strict-decrease condition, and a route-reuse upper bound that can be tighter than the uniform perturbation penalty. "
                      "Main takeaway: if the fixed-geometry release exceeds the certified perturbation penalty then the new exact total cost is strictly smaller, but the converse is not claimed because the penalty is worst-case."
                  ),
                  "status": (
                      "Deterministic robustness theorem for operational scheduling under two declared finite metrics. It does not estimate a metric from data, validate pruning, prove minimax adaptive efficiency, identify a metric or route quantity with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness."
                  ),
              },
          '''
              if marker not in text:
                  raise SystemExit("P58 insertion marker not found")
              records.write_text(text.replace(marker, record + marker, 1), encoding="utf-8")

          catalog = Path("docs/figure_catalog.md")
          lines = catalog.read_text(encoding="utf-8").splitlines()
          replacement = "| [P57 deterministic switching-metric perturbation stability](figures/p57_switching_metric_perturbation.svg) | What this figure shows: P57 controls exact P54 reoptimization when residual demand, setup origin, and a declared finite switching metric all change. The theorem assumes two valid finite metrics on one common relevant point set and measures their uniform difference by delta. How to read it: the three upper input cards specify the old exact state, the new exact state, and the sharp q-times-delta stability bound for changing only the metric at a fixed support and start. All three feed the central P55-P56-P57 certificate, where the fixed-geometry release is reduced by the smaller of two valid start-motion-plus-metric-drift penalties. The lower cards explain the sharp route-edge factor, the sufficient strict-decrease condition, and a route-reuse upper bound that can be tighter than the uniform perturbation penalty. Main takeaway: if the fixed-geometry release exceeds the certified perturbation penalty then the new exact total cost is strictly smaller, but the converse is not claimed because the penalty is worst-case. | Deterministic robustness theorem for operational scheduling under two declared finite metrics. It does not estimate a metric from data, validate pruning, prove minimax adaptive efficiency, identify a metric or route quantity with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness. | [Proposition 57](proposition_57_switching_metric_perturbation.md) |"
          found = False
          for index, line in enumerate(lines):
              if "(figures/p57_switching_metric_perturbation.svg)" in line:
                  lines[index] = replacement
                  found = True
                  break
          if not found:
              raise SystemExit("P57 catalog row not found")
          catalog.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - run: pytest -q
      - run: ruff check .
      - name: Commit audited P57 integration and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-p57-figure-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate P57 figure documentation metadata"
          git push origin HEAD:visual-polish-p57
