name: temporary-p90-finalize-publication

on:
  push:
    branches:
      - p90-exact-nonlinear-rank-one-separation
    paths:
      - .github/workflows/temporary-p90-finalize-publication.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P90 branch
        uses: actions/checkout@v4
        with:
          ref: p90-exact-nonlinear-rank-one-separation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact canonical P90 repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          promoter = Path("scripts/promote_p90_public_frontier.py")
          text = promoter.read_text(encoding="utf-8")

          # 1. Put P90 into the actual scientific dependency ladder.
          anchor = '    text = append_once(text, "## P90: exact nonlinear rank-one slice separation",'
          insertion = '''    p89_dependency = "&\\\\text{P89: complete linear parity-functional duality closes all real linear directions on the eleven canonical parity coordinates}"
    p90_dependency = "&\\\\text{P90: exact nonlinear rank-one slice separation exploits product-law image structure beyond the complete P89 linear envelope}"
    if p90_dependency not in text:
        if p89_dependency not in text:
            raise RuntimeError("P89 dependency-map anchor missing")
        text = text.replace(p89_dependency, p89_dependency + "\\\\\\\\n&\\\\Downarrow\\\\\\\\n" + p90_dependency, 1)

'''
          if 'p90_dependency = "&\\\\text{P90:' not in text:
              if anchor not in text:
                  raise SystemExit("P90 roadmap append anchor missing")
              text = text.replace(anchor, insertion + anchor, 1)

          # 2. Promote the exact homepage dependency-branch sentence.
          index_anchor = '        ("Current theorem frontier · P89", "Current theorem frontier · P90"),\n'
          index_add = (
              '        ("The 89 results form several dependency branches.", "The 90 results form several dependency branches."),\n'
              '        ("all 89 propositions", "all 90 propositions"),\n'
          )
          if '("The 89 results form several dependency branches.", "The 90 results form several dependency branches.")' not in text:
              if index_anchor not in text:
                  raise SystemExit("homepage replacement anchor missing")
              text = text.replace(index_anchor, index_anchor + index_add, 1)

          # Keep README footer and P90 implementation/test links permanent.
          readme_anchor = '        ("The current public theorem frontier is **P89**.", "The current public theorem frontier is **P90**."),\n'
          readme_add = '        ("**Public theorem frontier:** P89", "**Public theorem frontier:** P90"),\n'
          if '"**Public theorem frontier:** P89", "**Public theorem frontier:** P90"' not in text:
              if readme_anchor not in text:
                  raise SystemExit("README frontier anchor missing")
              text = text.replace(readme_anchor, readme_anchor + readme_add, 1)

          links_old = f'<a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/{{PROVENANCE_NAME}}">{{PROVENANCE_NAME}}</a></p>'
          links_new = (
              f'<a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/{{PROVENANCE_NAME}}">{{PROVENANCE_NAME}}</a> · '
              f'<a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/src/consciousness_bridge/{{SOURCE_NAME}}">{{SOURCE_NAME}}</a> · '
              f'<a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/tests/{{TEST_NAME}}">{{TEST_NAME}}</a></p>'
          )
          if 'blob/main/src/consciousness_bridge/{SOURCE_NAME}' not in text:
              if links_old not in text:
                  raise SystemExit("P90 homepage links anchor missing")
              text = text.replace(links_old, links_new, 1)

          # Keep future-work wording beyond P90.
          roadmap_anchor = '        ("## After P89", "## After P90"),\n'
          if '("continuation beyond P89", "continuation beyond P90")' not in text:
              if roadmap_anchor not in text:
                  raise SystemExit("roadmap future-work anchor missing")
              text = text.replace(
                  roadmap_anchor,
                  roadmap_anchor
                  + '        ("continuation beyond P89", "continuation beyond P90"),\n'
                  + '        ("A future P90 claim", "A future P91 claim"),\n',
                  1,
              )

          # Avoid invalid escape warnings in the LaTeX theorem block.
          old = 'append_once(text, "## P90: exact nonlinear rank-one slice separation", f\'\'\''
          new = 'append_once(text, "## P90: exact nonlinear rank-one slice separation", fr\'\'\''
          if old in text:
              text = text.replace(old, new, 1)

          promoter.write_text(text, encoding="utf-8")

          contracts = Path("scripts/advance_p90_publication_contracts.py")
          ctext = contracts.read_text(encoding="utf-8")

          # 3. P89 is the immediate historical section, so test it in [p89:p88].
          old = '("Previous theorem frontier · P88", "Previous theorem frontier · P89"),\n'
          new = old + '            ("text[p88:p87]", "text[p89:p88]"),\n'
          if '("text[p88:p87]", "text[p89:p88]")' not in ctext:
              if old not in ctext:
                  raise SystemExit("historical atlas assertion anchor missing")
              ctext = ctext.replace(old, new, 1)

          # Ensure p89 remains explicitly defined after the P90 variable migration.
          marker = '    patch(\n        ".github/workflows/figures.yml",\n'
          repair = '''    target = ROOT / "tests/test_figure_publication_sync.py"\n    test_text = target.read_text(encoding="utf-8")\n    old = "    p90 = text.index('id=\\\"p90-frontier\\\"')\\n    p88 = text.index('id=\\\"p88-frontier\\\"')"\n    new = "    p90 = text.index('id=\\\"p90-frontier\\\"')\\n    p89 = text.index('id=\\\"p89-frontier\\\"')\\n    p88 = text.index('id=\\\"p88-frontier\\\"')"\n    if old in test_text:\n        test_text = test_text.replace(old, new, 1)\n    test_text = test_text.replace('text[p88:p87]', 'text[p89:p88]', 1)\n    target.write_text(test_text, encoding="utf-8")\n\n'''
          if 'test_text = test_text.replace(\'text[p88:p87]\', \'text[p89:p88]\', 1)' not in ctext:
              if marker not in ctext:
                  raise SystemExit("figure-test repair insertion anchor missing")
              ctext = ctext.replace(marker, repair + marker, 1)

          contracts.write_text(ctext, encoding="utf-8")
          PY

      - name: Regenerate P90 publication surfaces
        run: |
          python scripts/promote_p90_public_frontier.py
          python scripts/advance_p90_publication_contracts.py
          python scripts/normalize_documentation_punctuation.py
          python scripts/sync_figure_publication.py

      - name: Validate focused P90 publication state
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest \
            tests/test_exact_nonlinear_rank_one_separation.py \
            tests/test_citation_surface.py \
            tests/test_frontier_publication_consistency.py \
            tests/test_frontier_reader_narrative.py \
            tests/test_main_page_visual_paper.py \
            tests/test_p84_reader_presentation.py \
            tests/test_reader_documentation_consistency.py \
            tests/test_readme_research_orientation.py \
            tests/test_research_website_integrity.py \
            tests/test_figure_publication_sync.py \
            tests/test_reader_experience.py
          python scripts/sync_figure_publication.py --check
          python scripts/verify_repository.py
          python -m ruff check \
            scripts/promote_p90_public_frontier.py \
            scripts/advance_p90_publication_contracts.py \
            scripts/sync_figure_publication.py \
            src/consciousness_bridge/exact_nonlinear_rank_one_separation.py \
            tests/test_exact_nonlinear_rank_one_separation.py
          git diff --check

      - name: Commit finalized P90 publication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CITATION.cff CITATION.md CITATION.bib START_HERE.md docs figures website tests scripts \
            .github/workflows/figures.yml \
            .github/workflows/validate-research-three-website.yml
          if git diff --cached --quiet; then
            echo "No P90 publication changes to commit"
            exit 0
          fi
          git commit -m "Finalize P90 publication surfaces"
          git push origin HEAD:p90-exact-nonlinear-rank-one-separation
