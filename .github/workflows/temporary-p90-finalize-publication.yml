name: temporary-p90-finalize-publication

on:
  push:
    branches:
      - p90-exact-nonlinear-rank-one-separation
    paths:
      - .github/workflows/temporary-p90-finalize-publication.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P90 branch
        uses: actions/checkout@v4
        with:
          ref: p90-exact-nonlinear-rank-one-separation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair canonical P90 publication sources
        run: |
          python - <<'PY'
          from pathlib import Path

          promoter = Path("scripts/promote_p90_public_frontier.py")
          text = promoter.read_text(encoding="utf-8")

          # Keep all roadmap future-work language beyond the current P90 frontier.
          anchor = '        ("## After P89", "## After P90"),\n'
          additions = (
              '        ("continuation beyond P89", "continuation beyond P90"),\n'
              '        ("A future P90 claim", "A future P91 claim"),\n'
          )
          if '("continuation beyond P89", "continuation beyond P90")' not in text:
              if anchor not in text:
                  raise SystemExit("roadmap migration insertion point not found")
              text = text.replace(anchor, anchor + additions, 1)

          # Promote both README declarations, not only the introductory one.
          anchor = '        ("The current public theorem frontier is **P89**.", "The current public theorem frontier is **P90**."),\n'
          addition = '        ("**Public theorem frontier:** P89", "**Public theorem frontier:** P90"),\n'
          if '"**Public theorem frontier:** P89", "**Public theorem frontier:** P90"' not in text:
              if anchor not in text:
                  raise SystemExit("README footer migration insertion point not found")
              text = text.replace(anchor, anchor + addition, 1)

          # Make the current homepage frontier card expose implementation and exact tests.
          links_old = f'<a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/{{PROVENANCE_NAME}}">{{PROVENANCE_NAME}}</a></p>'
          links_new = (
              f'<a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/{{PROVENANCE_NAME}}">{{PROVENANCE_NAME}}</a> · '
              f'<a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/src/consciousness_bridge/{{SOURCE_NAME}}">{{SOURCE_NAME}}</a> · '
              f'<a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/tests/{{TEST_NAME}}">{{TEST_NAME}}</a></p>'
          )
          if 'blob/main/src/consciousness_bridge/{SOURCE_NAME}' not in text:
              if links_old not in text:
                  raise SystemExit("homepage implementation-link insertion point not found")
              text = text.replace(links_old, links_new, 1)

          # Promote the Research Lineage validation tokens in prepare_website.py.
          anchor = '    text = text.replace(\'CURRENT_RECORD_TEXT = "Current record:</strong> 89 proposition-level results through P89"\', \'CURRENT_RECORD_TEXT = "Current record:</strong> 90 proposition-level results through P90"\')\n'
          additions = (
              '    text = text.replace("<strong>89</strong><span>proposition-level results</span>", "<strong>90</strong><span>proposition-level results</span>")\n'
              '    text = text.replace("<strong>P89</strong><span>current theorem frontier</span>", "<strong>P90</strong><span>current theorem frontier</span>")\n'
          )
          if 'text.replace("<strong>P89</strong><span>current theorem frontier</span>, "<strong>P90</strong><span>current theorem frontier</span>")' not in text:
              if anchor not in text:
                  raise SystemExit("prepare_website promotion insertion point not found")
              if 'text.replace("<strong>P89</strong><span>current theorem frontier</span>", "<strong>P90</strong><span>current theorem frontier</span>")' not in text:
                  text = text.replace(anchor, anchor + additions, 1)

          # Avoid Python invalid-escape warnings in the LaTeX roadmap block.
          marker = 'append_once(text, "## P90: exact nonlinear rank-one slice separation", f\'\'\''
          if marker in text:
              text = text.replace(marker, marker[:-4] + "fr'''", 1)

          promoter.write_text(text, encoding="utf-8")

          contracts = Path("scripts/advance_p90_publication_contracts.py")
          ctext = contracts.read_text(encoding="utf-8")

          anchor = '            ("internally consistent with P89", "internally consistent with P90"),\n'
          extra = (
              '            ("<strong>89</strong><span>proposition-level results</span>", "<strong>90</strong><span>proposition-level results</span>"),\n'
              '            ("<strong>P89</strong><span>current theorem frontier</span>", "<strong>P90</strong><span>current theorem frontier</span>"),\n'
          )
          if '"<strong>P89</strong><span>current theorem frontier</span>", "<strong>P90</strong><span>current theorem frontier</span>"' not in ctext:
              if anchor not in ctext:
                  raise SystemExit("prepare_website contract insertion point not found")
              ctext = ctext.replace(anchor, extra + anchor, 1)

          # Permanently repair the migrated P90/P89/P88 atlas ordering test.
          marker = '    patch(\n        ".github/workflows/figures.yml",\n'
          repair = '''    target = ROOT / "tests/test_figure_publication_sync.py"\n    test_text = target.read_text(encoding="utf-8")\n    old = """    p90 = text.index('id=\\\"p90-frontier\\\"')\n    p88 = text.index('id=\\\"p88-frontier\\\"')"""\n    new = """    p90 = text.index('id=\\\"p90-frontier\\\"')\n    p89 = text.index('id=\\\"p89-frontier\\\"')\n    p88 = text.index('id=\\\"p88-frontier\\\"')"""\n    if old in test_text:\n        test_text = test_text.replace(old, new, 1)\n    target.write_text(test_text, encoding="utf-8")\n\n'''
          if 'p89 = text.index(\'id="p89-frontier"\')' not in ctext:
              if marker not in ctext:
                  raise SystemExit("figure-test repair insertion point not found")
              ctext = ctext.replace(marker, repair + marker, 1)

          contracts.write_text(ctext, encoding="utf-8")
          PY

      - name: Regenerate and normalize P90 publication state
        run: |
          python scripts/promote_p90_public_frontier.py
          python scripts/advance_p90_publication_contracts.py
          python scripts/normalize_documentation_punctuation.py
          python scripts/sync_figure_publication.py
          python - <<'PY'
          from pathlib import Path

          roadmap = Path("docs/theorem_roadmap.md")
          text = roadmap.read_text(encoding="utf-8")
          text = text.replace("continuation beyond P89", "continuation beyond P90")
          text = text.replace("A future P90 claim", "A future P91 claim")
          roadmap.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8").replace("**Public theorem frontier:** P89", "**Public theorem frontier:** P90")
          readme.write_text(text, encoding="utf-8")

          test = Path("tests/test_figure_publication_sync.py")
          text = test.read_text(encoding="utf-8")
          old = "    p90 = text.index('id=\"p90-frontier\"')\n    p88 = text.index('id=\"p88-frontier\"')"
          new = "    p90 = text.index('id=\"p90-frontier\"')\n    p89 = text.index('id=\"p89-frontier\"')\n    p88 = text.index('id=\"p88-frontier\"')"
          if old in text:
              text = text.replace(old, new, 1)
          test.write_text(text, encoding="utf-8")
          PY

      - name: Validate focused P90 publication state
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest \
            tests/test_exact_nonlinear_rank_one_separation.py \
            tests/test_citation_surface.py \
            tests/test_frontier_publication_consistency.py \
            tests/test_frontier_reader_narrative.py \
            tests/test_main_page_visual_paper.py \
            tests/test_p84_reader_presentation.py \
            tests/test_reader_documentation_consistency.py \
            tests/test_readme_research_orientation.py \
            tests/test_research_website_integrity.py \
            tests/test_figure_publication_sync.py \
            tests/test_reader_experience.py
          python scripts/sync_figure_publication.py --check
          python scripts/verify_repository.py
          python -m ruff check \
            scripts/promote_p90_public_frontier.py \
            scripts/advance_p90_publication_contracts.py \
            scripts/sync_figure_publication.py \
            src/consciousness_bridge/exact_nonlinear_rank_one_separation.py \
            tests/test_exact_nonlinear_rank_one_separation.py
          git diff --check

      - name: Commit finalized P90 publication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CITATION.cff CITATION.md CITATION.bib START_HERE.md docs figures website tests scripts \
            .github/workflows/figures.yml \
            .github/workflows/validate-research-three-website.yml
          if git diff --cached --quiet; then
            echo "No P90 publication changes to commit"
            exit 0
          fi
          git commit -m "Finalize P90 publication surfaces"
          git push origin HEAD:p90-exact-nonlinear-rank-one-separation
