name: reproducibility-hardening-carrier

on:
  push:
    branches:
      - reproducibility-hardening-v081

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reproducibility-hardening-v081
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Apply permanent reproducibility integration
        run: |
          python scripts/_integrate_reproducibility_hardening.py
          python scripts/_fix_enrichment_preservation.py
          python scripts/_fix_p55_catalog_preservation.py
          rm scripts/_integrate_reproducibility_hardening.py
          rm scripts/_fix_enrichment_preservation.py
          rm scripts/_fix_p55_catalog_preservation.py
          rm .github/workflows/_reproducibility_carrier.yml
      - name: Install exact reference environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-reproducibility.txt
      - name: Rebuild canonical computational artifacts
        run: python scripts/generate_all_figures.py
      - name: Validate complete repository before commit
        run: |
          python -m compileall -q src scripts
          python -m pytest
          python -m ruff check .
          python scripts/verify_repository.py
      - name: Commit full canonical reproducibility record for audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden deterministic end-to-end reproducibility"
      - name: Audit clean committed tree
        run: python scripts/reproducibility_audit.py
      - name: Prepare validated non-workflow commit for bot push
        run: |
          git reset --soft HEAD^
          git restore --source=HEAD --staged --worktree .github/workflows
          git clean -f .github/workflows
          git add -A
          git commit -m "Harden deterministic end-to-end reproducibility"
      - name: Push validated code, scripts, tests, docs, and artifacts
        run: git push origin HEAD:reproducibility-hardening-v081
