name: Repair P84 implementation placement once

on:
  push:
    paths:
      - .github/workflows/promote-p84-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move P84 implementation links into Stage 06
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('website/implementation.html')
          text = path.read_text(encoding='utf-8')

          stray = '<p>P84 implementation: <a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/src/consciousness_bridge/joint_projection_parity_contrast_separation.py">joint_projection_parity_contrast_separation.py</a> with <a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/tests/test_joint_projection_parity_contrast_separation.py">regression tests</a>.</p>'
          text = text.replace('\n' + stray, '').replace(stray + '\n', '')

          old = '''    <a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/proposition_76_finite_sample_target_model_adequacy.md"><strong>Read P76</strong><small>Finite-data adequacy rejection</small></a>\n  </div>\n  <p class="scientific-boundary"><strong>Frontier continuation:</strong> P77-P84 strengthen this branch from individual adequacy constraints to certified separation from the complete continuous model family, including exact rational parameter-box, simplex, projected-event, nested-residual, and parity certificates. See the <a href="research-map.html#continuous-model-frontier">P77-P84 frontier</a>.</p>'''
          new = '''    <a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/proposition_76_finite_sample_target_model_adequacy.md"><strong>Read P76</strong><small>Finite-data adequacy rejection</small></a>\n    <a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/proposition_84_exact_projection_parity_contrast.md"><strong>Read P84</strong><small>Current joint shared-parameter parity frontier</small></a>\n    <a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/src/consciousness_bridge/joint_projection_parity_contrast_separation.py"><strong>joint_projection_parity_contrast_separation.py</strong><small>P84 exact 220-contrast implementation</small></a>\n    <a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/tests/test_joint_projection_parity_contrast_separation.py"><strong>P84 regression tests</strong><small>Exact interval, strict witness, dominance, and branch-and-bound checks</small></a>\n  </div>\n  <p class="scientific-boundary"><strong>Frontier continuation:</strong> P77-P84 strengthen this branch from individual adequacy constraints to certified separation from the complete continuous model family, including exact rational parameter-box, simplex, projected-event, nested-residual, parity, and joint parity-contrast certificates. P84 preserves shared-parameter compatibility across pairs of P83 parity events and has an exact strict witness with L83 = 0 and L84 = 1/32. See the <a href="research-map.html#p84">P84 frontier</a>.</p>'''
          if old not in text:
              raise RuntimeError('Stage 06 insertion anchor was not found')
          text = text.replace(old, new, 1)
          text = text.replace('<strong>P1-P83 proposition record</strong>', '<strong>P1-P84 proposition record</strong>')

          if not text.rstrip().endswith('</html>'):
              raise RuntimeError('implementation page still has content after closing html')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit implementation repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/implementation.html
          if git diff --cached --quiet; then
            echo "No implementation repair was needed."
            exit 0
          fi
          git commit -m "Place P84 implementation links inside Stage 06"
          git push origin HEAD:main
