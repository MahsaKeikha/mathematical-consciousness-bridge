name: fix-p87-publication-consistency

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-p87-publication-consistency.yml"
      - "scripts/fix_p87_publication_consistency.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Repair remaining P87 consistency
        run: python scripts/fix_p87_publication_consistency.py
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-reproducibility.txt
      - name: Run focused P87 consistency checks
        run: |
          python scripts/verify_frontier_publication.py
          python scripts/verify_repository.py
          python scripts/sync_figure_publication.py --check
          python -m pytest -q \
            tests/test_citation_surface.py \
            tests/test_frontier_reader_narrative.py \
            tests/test_main_page_visual_paper.py \
            tests/test_p79_research_integration.py \
            tests/test_p84_reader_presentation.py \
            tests/test_public_reader_navigation_frontier.py \
            tests/test_reader_documentation_consistency.py \
            tests/test_readme_research_orientation.py \
            tests/test_theorem_roadmap_caption.py
      - name: Run complete test suite and static checks
        run: |
          python -m pytest -q
          python -m ruff check src scripts tests
          git diff --check
      - name: Commit clean P87 consistency state
        run: |
          rm .github/workflows/fix-p87-publication-consistency.yml
          rm scripts/fix_p87_publication_consistency.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete P87 publication consistency cleanup"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
