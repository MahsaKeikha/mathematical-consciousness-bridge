name: one-shot-p58-figure-docs
# One-shot retry after final P58 containment correction.

on:
  push:
    branches: [visual-polish-p58]
    paths:
      - .github/workflows/one-shot-p58-figure-docs.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-polish-p58
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Integrate permanent P58 figure record and catalog row
        run: |
          python - <<'PY'
          from pathlib import Path

          records = Path("scripts/conceptual_figure_records.py")
          text = records.read_text(encoding="utf-8")
          marker = '    "docs/figures/p59_optimal_transition_calibration.svg": {'
          if '"docs/figures/p58_finite_data_metric_uncertainty.svg"' not in text:
              record = '''    "docs/figures/p58_finite_data_metric_uncertainty.svg": {
                  "title": "P58 finite-data switching-metric uncertainty and robust routing",
                  "description": (
                      "What this figure shows: P58 turns noisy pairwise transition measurements into a simultaneous confidence envelope for an unknown true switching metric and propagates that envelope through the exact P54 block-route family. The empirical pairwise center is allowed to violate triangle inequalities; the true metric property remains a declared physical/model assumption. "
                      "How to read it: move left to right across the upper row from the bounded pairwise observation model, to the simultaneous Hoeffding event, to lower and upper transition envelopes. The center theorem panel brackets the unknown exact P54 route optimum with lower and upper envelope optima computed over the same fixed route family. Follow the three lower branches to the robust-route regret certificate, the strict comparison of two reoptimization states, and the common-radius sample-size certificate. "
                      "Main takeaway: finite noisy transition data can support valid route-level uncertainty and regret statements without treating the empirical cost table as an exact metric. The common-sample inequality is sufficient, not a minimax lower bound, and adaptive pair selection requires separate statistical accounting."
                  ),
                  "status": (
                      "Finite-data scheduling and confidence-envelope theorem under the declared bounded pairwise observation model. It does not validate the transition-cost measurement model, infer metric truth from noisy observations, justify unrestricted adaptive pruning, identify a scheduling variable with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness."
                  ),
              },
          '''
              if marker not in text:
                  raise SystemExit("P59 insertion marker not found")
              records.write_text(text.replace(marker, record + marker, 1), encoding="utf-8")

          catalog = Path("docs/figure_catalog.md")
          lines = catalog.read_text(encoding="utf-8").splitlines()
          replacement = "| [P58 finite-data switching-metric uncertainty and robust routing](figures/p58_finite_data_metric_uncertainty.svg) | What this figure shows: P58 turns noisy pairwise transition measurements into a simultaneous confidence envelope for an unknown true switching metric and propagates that envelope through the exact P54 block-route family. The empirical pairwise center is allowed to violate triangle inequalities; the true metric property remains a declared physical/model assumption. How to read it: move left to right across the upper row from the bounded pairwise observation model, to the simultaneous Hoeffding event, to lower and upper transition envelopes. The center theorem panel brackets the unknown exact P54 route optimum with lower and upper envelope optima computed over the same fixed route family. Follow the three lower branches to the robust-route regret certificate, the strict comparison of two reoptimization states, and the common-radius sample-size certificate. Main takeaway: finite noisy transition data can support valid route-level uncertainty and regret statements without treating the empirical cost table as an exact metric. The common-sample inequality is sufficient, not a minimax lower bound, and adaptive pair selection requires separate statistical accounting. | Finite-data scheduling and confidence-envelope theorem under the declared bounded pairwise observation model. It does not validate the transition-cost measurement model, infer metric truth from noisy observations, justify unrestricted adaptive pruning, identify a scheduling variable with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness. | [Proposition 58](proposition_58_finite_data_metric_uncertainty.md) |"
          found = False
          for index, line in enumerate(lines):
              if "(figures/p58_finite_data_metric_uncertainty.svg)" in line:
                  lines[index] = replacement
                  found = True
                  break
          if not found:
              raise SystemExit("P58 catalog row not found")
          catalog.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - run: pytest -q
      - run: ruff check .
      - name: Commit audited P58 integration and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-p58-figure-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate P58 figure documentation metadata"
          git push origin HEAD:visual-polish-p58
