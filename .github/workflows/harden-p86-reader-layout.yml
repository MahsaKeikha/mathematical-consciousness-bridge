name: harden-p86-reader-layout

on:
  push:
    paths:
      - ".github/workflows/harden-p86-reader-layout.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize Start Here with P86 and harden shared card containment
        run: |
          python - <<'PY'
          from pathlib import Path

          start_path = Path("website/start-here.html")
          start = start_path.read_text(encoding="utf-8")
          replacements = {
              "to the 85-result theorem program and current P86 frontier.": "to the 86-result theorem program and current P86 frontier.",
              "<h2>P78-P85 progressively tighten global separation from the declared continuous model family</h2>": "<h2>P78-P86 progressively tighten global separation from the declared continuous model family</h2>",
              "P83 now adds 22 exact projection-parity observables": "P83 added 22 exact projection-parity observables",
              "<strong>P84 now preserves shared-parameter compatibility between pairs of P83 parity events.</strong>": "<strong>P84 added pairwise shared-parameter compatibility between P83 parity events.</strong>",
              "<strong>P85 now tests exact three-event shared-parameter compatibility beyond the complete P84 pairwise certificate.</strong>": "<strong>P85 extended the hierarchy to exact three-event shared-parameter compatibility beyond the complete P84 pairwise certificate.</strong>",
              '<a class="button primary" href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/proposition_85_exact_triple_projection_parity_functional.md">Read P85</a>': '<a class="button primary" href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/proposition_86_exact_minimally_weighted_quad_projection_parity_functional.md">Read P86</a>',
          }
          for old, new in replacements.items():
              if old not in start:
                  raise SystemExit(f"Start Here anchor missing: {old}")
              start = start.replace(old, new, 1)

          p85_para = '      <p><strong>P85 extended the hierarchy to exact three-event shared-parameter compatibility beyond the complete P84 pairwise certificate.</strong> Its 660 sign-normalized functionals include an exact-rational witness with L84 = 0, empirical value 5/8, exact P75 interval [1,2], centered coefficient norm 12, and L85 = 1/32.</p>\n'
          p86_para = p85_para + '      <p><strong>P86 is the current exact frontier.</strong> It audits 10,560 sign-normalized four-event functionals with primitive coefficient magnitudes {1,1,1,2}. Its strict exact-rational witness satisfies <strong>L85 = 0 &lt; L86 = 1/192</strong>, so the minimally weighted four-event family can separate a P75 parameter box that remains compatible with the complete P85 certificate.</p>\n'
          if p85_para not in start:
              raise SystemExit("P85 historical paragraph anchor missing")
          start = start.replace(p85_para, p86_para, 1)
          start_path.write_text(start, encoding="utf-8")

          css_path = Path("website/reader-experience-v2.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* Site-wide grid containment contract: long scientific labels and repository paths\n"
          if marker not in css:
              anchor = "@media (max-width: 900px) {\n"
              if anchor not in css:
                  raise SystemExit("reader-experience media anchor missing")
              block = '''/* Site-wide grid containment contract: long scientific labels and repository paths
 * must stay inside their own cards at every desktop and tablet width. */
.status-grid > *,
.flow > *,
.result-grid > *,
.source-grid > *,
.falsify-grid > *,
.reader-primer-grid > *,
.reader-step-grid > *,
.research-card-grid > *,
.reader-trail-grid > *,
.lineage-callout-actions > *,
.frontier-summary-grid > *,
.implementation-index > *,
.implementation-links > * {
  min-width: 0;
  max-width: 100%;
}

.source-grid h3,
.result h3,
.flow-node h3,
.card h3,
.reader-primer-card strong,
.reader-step-card strong,
.frontier-summary-card h3,
.implementation-index strong,
.implementation-links strong,
.research-card-grid h3,
.research-card-grid strong,
.reader-trail-grid strong {
  max-width: 100%;
  overflow-wrap: anywhere;
  word-break: normal;
}

.button {
  max-width: 100%;
  overflow-wrap: anywhere;
}

'''
              css = css.replace(anchor, block + anchor, 1)
              css_path.write_text(css, encoding="utf-8")

          test_path = Path("tests/test_reader_experience.py")
          test = test_path.read_text(encoding="utf-8")
          style_anchor = '    assert \'"reader-experience-v2.css"\' in prepare\n'
          style_insert = style_anchor + '    assert "Site-wide grid containment contract" in css\n    assert ".implementation-links > *" in css\n    assert "overflow-wrap: anywhere" in css\n'
          if "Site-wide grid containment contract" not in test:
              if style_anchor not in test:
                  raise SystemExit("reader style test anchor missing")
              test = test.replace(style_anchor, style_insert, 1)

          start_anchor = '    assert "The 86 propositions by scientific role" in start\n'
          start_insert = ('    assert "86-result theorem program and current P86 frontier" in start\n'
                          '    assert "P78-P86 progressively tighten global separation" in start\n'
                          '    assert "P86 is the current exact frontier." in start\n'
                          '    assert "L85 = 0 &lt; L86 = 1/192" in start\n'
                          '    assert ">Read P86</a>" in start\n' + start_anchor)
          if 'assert "P86 is the current exact frontier." in start' not in test:
              if start_anchor not in test:
                  raise SystemExit("P86 Start Here test anchor missing")
              test = test.replace(start_anchor, start_insert, 1)

          tuple_anchor = '        "<strong>85</strong><span>proposition-level results</span>",\n'
          tuple_insert = ('        "85-result theorem program and current P86 frontier",\n'
                          '        "<h2>P78-P85 progressively tighten global separation from the declared continuous model family</h2>",\n'
                          + tuple_anchor)
          if '"85-result theorem program and current P86 frontier"' not in test:
              if tuple_anchor not in test:
                  raise SystemExit("stale token test anchor missing")
              test = test.replace(tuple_anchor, tuple_insert, 1)
          test_path.write_text(test, encoding="utf-8")

          verifier_path = Path("scripts/verify_repository.py")
          verifier = verifier_path.read_text(encoding="utf-8")
          verifier_anchor = 'STALE_READER_FRONTIER_MARKERS = (\n'
          verifier_insert = ('STALE_READER_FRONTIER_MARKERS = (\n'
                             '    "85-result theorem program and current P86 frontier",\n'
                             '    "<h2>P78-P85 progressively tighten global separation from the declared continuous model family</h2>",\n')
          if '"85-result theorem program and current P86 frontier"' not in verifier:
              if verifier_anchor not in verifier:
                  raise SystemExit("verifier stale-marker anchor missing")
              verifier = verifier.replace(verifier_anchor, verifier_insert, 1)
              verifier_path.write_text(verifier, encoding="utf-8")
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run targeted reader and website tests
        run: python -m pytest tests/test_reader_experience.py tests/test_implementation_reader_path.py tests/test_website_build.py tests/test_website_link_integrity.py tests/test_website_research_orientation.py
      - name: Verify repository contract
        run: python scripts/verify_repository.py
      - run: git diff --check
      - name: Commit P86 reader-layout hardening
        run: |
          if git diff --quiet -- website/start-here.html website/reader-experience-v2.css tests/test_reader_experience.py scripts/verify_repository.py; then
            echo "No reader-layout changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/start-here.html website/reader-experience-v2.css tests/test_reader_experience.py scripts/verify_repository.py
          git commit -m "Harden P86 reader layout and frontier freshness"
          git push
