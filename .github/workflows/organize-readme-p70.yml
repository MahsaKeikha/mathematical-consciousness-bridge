# Temporary workflow. Removed before merge.
name: organize-readme-p70

on:
  workflow_dispatch:
  push:
    branches:
      - p70_primal_dual_gap_decomposition
    paths:
      - scripts/organize_readme_p70.py
      - .github/workflows/organize-readme-p70.yml

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p70_primal_dual_gap_decomposition
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reorganize public README
        run: python scripts/organize_readme_p70.py
      - name: Validate orientation and publication coherence
        run: |
          python -m pip install -e ".[dev]"
          pytest tests/test_readme_research_orientation.py tests/test_public_reader_navigation_frontier.py tests/test_p70_figure_geometry.py tests/test_primal_dual_gap_decomposition.py tests/test_release_metadata_consistency.py tests/test_research_website_integrity.py
          ruff check tests/test_readme_research_orientation.py scripts/organize_readme_p70.py
      - name: Commit organized README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Organize P70 research front page for first-read clarity"
          git push origin HEAD:p70_primal_dual_gap_decomposition
