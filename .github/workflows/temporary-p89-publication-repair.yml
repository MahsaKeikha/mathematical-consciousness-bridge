name: temporary-p89-publication-repair

on:
  push:
    branches:
      - p89-complete-linear-parity-duality

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p89-complete-linear-parity-duality
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install exact development and figure environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-figures.txt
      - name: Repair permanent P89 publication contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def load(path):
              return (root / path).read_text(encoding='utf-8')

          def save(path, text):
              (root / path).write_text(text, encoding='utf-8')

          def replace_required(text, old, new, *, minimum=1, label='replacement'):
              count = text.count(old)
              if count < minimum:
                  raise RuntimeError(f'{label}: expected at least {minimum} matches, found {count}')
              return text.replace(old, new)

          # Tighten the status-grid parser so it cannot consume later sections.
          path = 'scripts/promote_p89_public_frontier.py'
          text = load(path)
          old_status = '''    status = re.compile(
              r'<div class="status-grid" aria-label="Current research status">.*?</div>\\s*</section>',
              re.DOTALL,
          )'''
          new_status = '''    status = re.compile(
              r'<div class="status-grid" aria-label="Current research status">\\s*'
              r'(?:<div>.*?</div>\\s*){4}</div>'
              r'(?:\\s*<p class="small-note">.*?</p>)?\\s*</section>',
              re.DOTALL,
          )'''
          text = replace_required(text, old_status, new_status, minimum=2, label='safe status-grid parser')

          # Make Research Map and Implementation promotion explicitly include P89.
          text = replace_required(
              text,
              '''            ("88 proposition-level results", "89 proposition-level results"),
              ("P1-P88", "P1-P89"),''',
              '''            ("88 proposition-level results", "89 proposition-level results"),
              ("Eighty-eight results", "Eighty-nine results"),
              ("through Proposition 88.", "through Proposition 89."),
              ("<strong>88</strong><span>proposition-level results</span>", "<strong>89</strong><span>proposition-level results</span>"),
              ("P1-P88", "P1-P89"),
              ("P73-P88", "P73-P89"),''',
              minimum=1,
              label='Research Map P89 ranges',
          )
          text = replace_required(
              text,
              '''        ("P75-P88", "P75-P89"),
              ("P77-P88", "P77-P89"),''',
              '''        ("P75-P88", "P75-P89"),
              ("P73-P88", "P73-P89"),
              ("P77-P88", "P77-P89"),
              ("P1-P88 proposition record", "P1-P89 proposition record"),''',
              minimum=1,
              label='Implementation P89 ranges',
          )
          text = text.replace(
              'and P88 enlarges that complete primitive coefficient radius to three and raises the same exact witness bound from 1/96 to 1/64.</p>',
              'and P88 enlarges that complete primitive coefficient radius to three and raises the same exact witness bound from 1/96 to 1/64, while P89 removes the finite coefficient-radius and four-observable support limits and proves the exact complete real linear parity-functional optimum 5/168.</p>',
          )
          text = text.replace(
              'culminating in P88 exact radius-three bounded primitive four-event shared-parameter parity-functional separation.',
              'culminating in P89 complete real linear parity-functional duality after the P88 radius-three certificate.',
          )
          save(path, text)

          # Normalize generated figures before their hashes and mirrors are derived.
          path = 'scripts/generate_all_figures.py'
          text = load(path)
          text = replace_required(
              text,
              'ENRICHER = ROOT / "scripts" / "enrich_figure_documentation.py"\nPUBLICATION_SYNCER = ROOT / "scripts" / "sync_figure_publication.py"',
              'ENRICHER = ROOT / "scripts" / "enrich_figure_documentation.py"\nPUNCTUATION_NORMALIZER = ROOT / "scripts" / "normalize_documentation_punctuation.py"\nPUBLICATION_SYNCER = ROOT / "scripts" / "sync_figure_publication.py"',
              label='figure punctuation normalizer declaration',
          )
          text = replace_required(
              text,
              '    _run_script(ENRICHER)\n    _run_script(PUBLICATION_SYNCER)',
              '    _run_script(ENRICHER)\n    _run_script(PUNCTUATION_NORMALIZER)\n    _run_script(PUBLICATION_SYNCER)',
              label='figure punctuation normalizer execution',
          )
          save(path, text)

          # Repair the malformed LaTeX left by an earlier one-time migration.
          path = 'docs/reproducibility.md'
          text = load(path).replace('\x0crac', '\\frac')
          save(path, text)

          # Give the citation guide one canonical current-frontier heading.
          path = 'CITATION.md'
          text = load(path)
          text = replace_required(
              text,
              '## Proposition 89 method citation',
              '## Current theorem frontier: P89\n\n### Proposition 89 method citation',
              label='citation P89 heading',
          )
          save(path, text)

          # Update stale tests that were still asserting P88 as current.
          path = 'tests/test_reader_experience.py'
          text = load(path)
          text = text.replace(
              'def test_repository_verifier_tracks_p88_and_all_88_propositions() -> None:',
              'def test_repository_verifier_tracks_p89_and_all_89_propositions() -> None:',
          )
          text = text.replace('assert \'CURRENT_FRONTIER = "P88"\' in verifier', 'assert \'CURRENT_FRONTIER = "P89"\' in verifier')
          text = text.replace('assert "for number in range(1, 89):" in verifier', 'assert "for number in range(1, 90):" in verifier')
          text = text.replace(
              'assert \'"docs/proposition_88_exact_radius_three_bounded_primitive_quad_projection_parity_functional.md"\' in verifier',
              'assert \'"docs/proposition_89_complete_linear_parity_duality.md"\' in verifier',
          )
          text = text.replace("overview.index('id=\"p88-frontier\"')", "overview.index('id=\"p89-frontier\"')")
          save(path, text)

          path = 'tests/test_scholarly_provenance_surface.py'
          text = load(path)
          text = text.replace('"audited by P75-P88"', '"audited by P75-P89"')
          text = text.replace('"The current repository contains 88 proposition-level results"', '"The current repository contains 89 proposition-level results"')
          text = text.replace('"P88 is the current Research II theorem frontier"', '"P89 is the current Research II theorem frontier"')
          source_pattern = re.compile(
              r'def test_sources_page_points_to_current_p88_and_previous_p87_p86_records\(\) -> None:\n.*?(?=\n\ndef |\Z)',
              re.DOTALL,
          )
          new_source_test = '''def test_sources_page_points_to_current_p89_and_previous_p88_p87_p86_records() -> None:
              sources = _read("website/sources.html")

              assert 'id="p89-source"' in sources
              assert "Current theorem source · P89" in sources
              assert "5/168" in sources
              assert "proposition_89_complete_linear_parity_duality.md" in sources
              assert "p89_equation_provenance.md" in sources
              assert "complete_linear_parity_duality.py" in sources
              assert "test_complete_linear_parity_duality.py" in sources

              assert 'id="p88-source"' in sources
              assert "Previous theorem source · P88" in sources
              assert "L87 = 1/96 &lt; L88 = 1/64" in sources
              assert "proposition_88_exact_radius_three_bounded_primitive_quad_projection_parity_functional.md" in sources

              assert 'id="p87-source"' in sources
              assert "Previous theorem source · P87" in sources
              assert "L86 = 1/192 &lt; L87 = 1/96" in sources

              assert 'id="p86-source"' in sources
              assert "Previous theorem source · P86" in sources
              assert "L85 = 0 &lt; L86 = 1/192" in sources
              assert "claim_source_matrix.md" in sources
              assert "Claim-to-source matrix" in sources

              assert "Current theorem source · P88" not in sources
          '''
          text, count = source_pattern.subn(new_source_test.rstrip(), text, count=1)
          if count != 1:
              raise RuntimeError('stale sources-page test block was not found')
          save(path, text)

          # Correct a stale diagnostic while this contract is being repaired.
          path = 'scripts/verify_repository.py'
          text = load(path).replace(
              'figure manifest does not point to the canonical P88 SVG',
              'figure manifest does not point to the canonical P89 SVG',
          )
          save(path, text)
          PY
      - name: Regenerate canonical P89 publication record
        run: |
          python scripts/promote_p89_public_frontier.py
          python scripts/normalize_documentation_punctuation.py
          python scripts/generate_all_figures.py
          python scripts/normalize_documentation_punctuation.py
          python scripts/sync_figure_publication.py
          python scripts/normalize_documentation_punctuation.py
          python scripts/sync_figure_publication.py --check
      - name: Run focused repaired contracts
        run: |
          python -m pytest -q \
            tests/test_complete_linear_parity_duality.py \
            tests/test_latex_source_integrity.py \
            tests/test_p84_reader_presentation.py \
            tests/test_p89_reader_surface_coherence.py \
            tests/test_publication_contract_v2.py \
            tests/test_reader_experience.py \
            tests/test_scholarly_provenance_surface.py \
            tests/test_documentation_punctuation.py \
            tests/test_public_reader_punctuation.py \
            tests/test_figure_publication_sync.py \
            tests/test_figure_documentation_integrity.py
      - name: Run full verification
        run: |
          python -m pytest -q
          python -m ruff check .
          python scripts/verify_repository.py
          python scripts/generate_all_figures.py
          python scripts/sync_figure_publication.py --check
          python scripts/normalize_documentation_punctuation.py
          git status --short
      - name: Commit repaired canonical record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No publication repair changes to commit."
            exit 0
          fi
          git commit -m "Repair deterministic P89 publication contracts"
          git push origin HEAD:p89-complete-linear-parity-duality
