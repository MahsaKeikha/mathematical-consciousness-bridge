name: temporary-p90-reader-residuals

on:
  workflow_dispatch:
  push:
    branches:
      - p90-exact-nonlinear-rank-one-separation
    paths:
      - "scripts/repair_p90_reader_residuals.py"
      - ".github/workflows/temporary-p90-reader-residuals.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p90-exact-nonlinear-rank-one-separation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Repair P90 reader residuals
        run: python scripts/repair_p90_reader_residuals.py
      - name: Validate focused reader contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_p90_reader_surface_coherence.py tests/test_frontier_reader_narrative.py tests/test_reader_documentation_consistency.py tests/test_research_website_integrity.py
          python scripts/verify_repository.py
          python -m ruff check scripts/promote_p90_public_frontier.py scripts/repair_p90_reader_residuals.py tests/test_p90_reader_surface_coherence.py
          git diff --check
      - name: Persist repaired reader surfaces
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add website/plain-language.html website/start-here.html scripts/promote_p90_public_frontier.py
            git commit -m "Close P90 reader publication residuals"
            git push origin HEAD:p90-exact-nonlinear-rank-one-separation
          fi
