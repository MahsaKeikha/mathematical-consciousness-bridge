name: p99-implementation-final-sync

on:
  push:
    branches: ["p99-cross-fitted-evalue-aggregation"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-clean:
    if: ${{ !contains(github.event.head_commit.message, '[p99-implementation-synced]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p99-cross-fitted-evalue-aggregation
          fetch-depth: 0
      - name: Synchronize implementation frontier to P99
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('website/implementation.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '<a href="#stage-06"><strong>6 · P73-P95</strong>': '<a href="#stage-06"><strong>6 · P73-P99</strong>',
              'Stage 06 · P73-P98': 'Stage 06 · P73-P99',
              'P73-P98 build a continuous chain from channel recovery to certified model-family separation.': 'P73-P99 build a continuous chain from channel recovery to certified model-family separation.',
              'See the <a href="index.html#p99-frontier">current P98 frontier</a>': 'See the <a href="index.html#p99-frontier">current P99 frontier</a>',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          old_continuation = (
              'P93-P95 carry the witness into IID, finite-range dependent, and predeclared-regime finite-data rejection, and P96 permits pilot-selected regime plans when final certification uses a frozen plan and genuinely independent holdout information.'
          )
          new_continuation = (
              'P93-P95 carry the witness into IID, finite-range dependent, and predeclared-regime finite-data rejection; P96 permits pilot-selected regime plans with genuinely independent holdout information; P97 covers a predeclared finite candidate family on the same data; P98 rotates independent holdouts across cross-fitted blocks; and P99 aggregates selection-valid fold evidence with exact e-values and fixed convex averaging.'
          )
          text = text.replace(old_continuation, new_continuation)

          required = (
              '<strong>6 · P73-P99</strong>',
              'Stage 06 · P73-P99',
              'P73-P99 build a continuous chain',
              'current P99 frontier',
              'P99 aggregates selection-valid fold evidence with exact e-values',
          )
          for marker in required:
              assert marker in text, marker

          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Remove helper and commit
        run: |
          rm .github/workflows/p99-implementation-final-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/implementation.html .github/workflows/p99-implementation-final-sync.yml
          git commit -m "Synchronize P99 implementation frontier [p99-implementation-synced]"
          git push origin HEAD:p99-cross-fitted-evalue-aggregation
