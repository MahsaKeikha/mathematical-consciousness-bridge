name: repair-current-reader-contract

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/repair-current-reader-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-current-reader-contract-main
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Repair current reader and metadata contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace(path, old, new, *, count=None):
              p = root / path
              text = p.read_text(encoding='utf-8')
              observed = text.count(old)
              if observed == 0:
                  raise SystemExit(f'{path}: expected text not found: {old!r}')
              if count is not None and observed != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {observed}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # The P88 reader synchronizer contains LaTeX in this literal. Make it raw
          # so Python cannot turn the leading f in frac into a form-feed control.
          replace(
              'scripts/synchronize_p88_reader_frontier_phrases.py',
              'section = """## 5. Focused audit of the current P88 frontier',
              'section = r"""## 5. Focused audit of the current P88 frontier',
              count=1,
          )

          # Repair the already-generated corruption in the reproducibility record.
          repro = root / 'docs/reproducibility.md'
          text = repro.read_text(encoding='utf-8')
          if '\x0c' not in text:
              raise SystemExit('docs/reproducibility.md: expected form-feed corruption was not found')
          repro.write_text(text.replace('\x0c', r'\f'), encoding='utf-8')

          # Synchronize scholarly metadata to the documented P88 frontier.
          cff = root / 'CITATION.cff'
          text = cff.read_text(encoding='utf-8')
          text = text.replace('Current documented theorem frontier: P87.', 'Current documented theorem frontier: P88.')
          if 'Current documented theorem frontier: P87.' in text:
              raise SystemExit('CITATION.cff still contains the stale P87 frontier')
          cff.write_text(text, encoding='utf-8')

          citation = root / 'CITATION.md'
          text = citation.read_text(encoding='utf-8')
          replacements = {
              'current documented frontier, P86.': 'current documented frontier, P88.',
              'Current documented theorem frontier: P86.': 'Current documented theorem frontier: P88.',
              'theorem frontier **P86**': 'theorem frontier **P88**',
              'P1 through P86 chronological theorem record': 'P1 through P88 chronological theorem record',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'CITATION.md: expected stale marker not found: {old!r}')
              text = text.replace(old, new)
          citation.write_text(text, encoding='utf-8')

          detailed = root / 'docs/detailed_proposition_record.md'
          text = detailed.read_text(encoding='utf-8')
          if 'Complete P1 to P87 chronology' not in text:
              raise SystemExit('detailed proposition record: stale P87 heading not found')
          detailed.write_text(
              text.replace('Complete P1 to P87 chronology', 'Complete P1 to P88 chronology'),
              encoding='utf-8',
          )

          # Keep the source tree link-valid while allowing prepare_website.py to
          # localize this canonical exact-commit figure into the Pages artifact.
          lineage = root / 'website/research-lineage.html'
          text = lineage.read_text(encoding='utf-8')
          local_src = 'src="figures/research_architecture.svg"'
          raw_src = (
              'src="https://raw.githubusercontent.com/MahsaKeikha/'
              'mathematical-consciousness-bridge/main/docs/figures/research_architecture.svg"'
          )
          if local_src not in text:
              raise SystemExit('research-lineage.html: expected local architecture source not found')
          text = text.replace(local_src, raw_src, 1)
          heading = '<h2>A well-defined physical subsystem still leaves the bridge question open</h2>'
          boundary = (
              heading
              + '\n      <p><strong>Bridge remains an independently testable open problem.</strong> '
              + 'Identifying a coherent physical subsystem is necessary for a precise physical description, '
              + 'but it does not by itself establish any claim about subjective experience.</p>'
          )
          if 'Bridge remains an independently testable open problem' not in text:
              if heading not in text:
                  raise SystemExit('research-lineage.html: transition heading not found')
              text = text.replace(heading, boundary, 1)
          lineage.write_text(text, encoding='utf-8')

          # Remove Unicode dash punctuation from the existing repair workflow
          # without embedding those characters in this workflow itself.
          repair = root / '.github/workflows/repair-p88-publication-contracts.yml'
          text = repair.read_text(encoding='utf-8')
          text = text.replace(chr(0x2013), '-').replace(chr(0x2014), '-')
          repair.write_text(text, encoding='utf-8')
          PY

      - name: Verify repaired source contracts
        run: |
          python -m py_compile scripts/synchronize_p88_reader_frontier_phrases.py
          python - <<'PY'
          from pathlib import Path
          assert '\x0c' not in Path('docs/reproducibility.md').read_text(encoding='utf-8')
          assert 'Current documented theorem frontier: P88.' in Path('CITATION.cff').read_text(encoding='utf-8')
          assert 'theorem frontier **P88**' in Path('CITATION.md').read_text(encoding='utf-8')
          assert 'Complete P1 to P88 chronology' in Path('docs/detailed_proposition_record.md').read_text(encoding='utf-8')
          assert 'Bridge remains an independently testable open problem' in Path('website/research-lineage.html').read_text(encoding='utf-8')
          PY
          git diff --check

      - name: Commit repaired contracts
        run: |
          if git diff --quiet; then
            echo "Reader contracts already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CITATION.cff \
            CITATION.md \
            docs/reproducibility.md \
            docs/detailed_proposition_record.md \
            website/research-lineage.html \
            scripts/synchronize_p88_reader_frontier_phrases.py \
            .github/workflows/repair-p88-publication-contracts.yml
          git commit -m "Repair P88 reader and metadata contracts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
