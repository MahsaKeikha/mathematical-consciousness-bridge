name: promote-p93-branch

on:
  push:
    branches:
      - p93-localized-sign-coherence-rejection
    paths:
      - "scripts/promote_p93_public_frontier.py"
      - ".github/workflows/promote-p93-branch.yml"

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p93-localized-sign-coherence-rejection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install repository and figure environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-figures.txt
      - name: Promote P93 publication surfaces
        run: python scripts/promote_p93_public_frontier.py
      - name: Regenerate canonical figure publication record
        run: python scripts/generate_all_figures.py
      - name: Normalize reader-facing punctuation
        run: python scripts/normalize_documentation_punctuation.py
      - name: Validate generated patch
        run: |
          git diff --check
          git status --short
      - name: Commit synchronized P93 publication state
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "P93 publication state already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote P93 public frontier"
          git push origin HEAD:p93-localized-sign-coherence-rejection
