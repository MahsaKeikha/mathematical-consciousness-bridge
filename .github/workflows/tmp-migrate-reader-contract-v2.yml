name: temporary-overview-dashboard-migration

on:
  push:
    branches: ["overview-p88-provenance-clarity"]
    paths:
      - ".github/workflows/tmp-migrate-reader-contract-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-overview-dashboard-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overview-p88-provenance-clarity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install project test environment
        run: python -m pip install -e ".[dev]"
      - name: Build full-program Overview dashboard
        run: python scripts/tmp_migrate_reader_contract_v2.py
      - name: Verify reader contract and source cleanliness
        run: |
          python -m pytest -q tests/test_publication_contract_v2.py
          python scripts/promote_p88_public_frontier.py
          python -m pytest -q tests/test_publication_contract_v2.py
          git diff --check
      - name: Commit Overview dashboard
        run: |
          if git diff --quiet; then
            echo "Overview dashboard already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/index.html website/styles.css tests/test_publication_contract_v2.py
          git commit -m "Make Overview represent all three research programs"
          git push origin HEAD:overview-p88-provenance-clarity
