name: temporary-reader-contract-v2-migration

on:
  push:
    branches: ["overview-p88-provenance-clarity"]
    paths:
      - ".github/workflows/tmp-migrate-reader-contract-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-reader-contract-v2-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: overview-p88-provenance-clarity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Migrate stale reader publication contracts
        run: |
          echo '' | base64 --decode | python
      - name: Clean imports after contract migration
        run: |
          python -m pip install --quiet ruff
          ruff check tests --fix
          ruff format tests
      - name: Verify migrated publication contract
        run: |
          python -m pytest -q tests/test_publication_contract_v2.py
          git diff --check
      - name: Commit migrated contracts
        run: |
          if git diff --quiet; then
            echo "Reader publication contracts already migrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CITATION.md docs/research_navigation.md tests
          git commit -m "Migrate reader tests to canonical publication surfaces"
          git push origin HEAD:overview-p88-provenance-clarity
