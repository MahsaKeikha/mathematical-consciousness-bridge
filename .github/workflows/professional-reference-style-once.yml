name: professional-reference-style-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/professional-reference-style-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply citation and prose standards
        run: python .github/normalize_reference_style.py
      - name: Validate repository
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .
      - name: Commit citation and style audit
        run: |
          rm .github/workflows/professional-reference-style-once.yml
          rm .github/normalize_reference_style.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Standardize citations provenance and prose style"
          git push origin HEAD:main
