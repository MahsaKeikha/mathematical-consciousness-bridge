name: Fix final thermodynamics card copy

on:
  push:
    branches: [visual-audit-thermodynamics-information-processing]
    paths:
      - .github/workflows/fix-thermodynamics-final-copy.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-audit-thermodynamics-information-processing
      - name: Tighten remaining unsafe labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/figures/thermodynamics_information_processing.svg')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'States evolve while exchanging energy': 'States exchange energy and matter',
              'and matter with the environment.': 'with the surrounding environment.',
              'are defined on fluctuating trajectories.': 'are defined for each trajectory.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/figures/thermodynamics_information_processing.svg
          git commit -m 'Finish thermodynamics top-card containment repair'
          git push origin HEAD:visual-audit-thermodynamics-information-processing
