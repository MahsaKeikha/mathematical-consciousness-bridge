name: P100 publication promotion

on:
  push:
    branches:
      - p100-anytime-sequential-eprocess
    paths:
      - scripts/promote_p100_public_frontier.py
      - .github/workflows/p100-publication-promote.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out P100 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair literal replacement handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/promote_p100_public_frontier.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)",
              "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)",
          )
          text = text.replace(
              "text, count = re.subn(old_after, p100_tail, text, count=1, flags=re.S)",
              "text, count = re.subn(old_after, lambda _match: p100_tail, text, count=1, flags=re.S)",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply synchronized P100 promotion
        run: python scripts/promote_p100_public_frontier.py

      - name: Verify figure publication contract
        run: python scripts/sync_figure_publication.py --check

      - name: Verify repository publication contract
        run: python scripts/verify_repository.py

      - name: Commit promoted frontier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "P100 publication surfaces are already synchronized."
          else
            git commit -m "Promote P100 public theorem frontier"
            git push origin HEAD:p100-anytime-sequential-eprocess
          fi
