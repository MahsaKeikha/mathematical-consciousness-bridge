name: promote-p88-public-frontier

on:
  push:
    branches:
      - p88-complete-bounded-weight-frontier
    paths:
      - scripts/promote_p88_public_frontier.py
      - .github/workflows/promote-p88-public-frontier.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p88-complete-bounded-weight-frontier
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Promote P88 reader and publication surfaces
        run: python scripts/promote_p88_public_frontier.py
      - name: Compile promotion-critical scripts
        run: |
          python -m py_compile scripts/promote_p88_public_frontier.py
          python -m py_compile scripts/sync_figure_publication.py
          python -m py_compile scripts/prepare_website.py
          python -m py_compile scripts/verify_repository.py
      - name: Commit synchronized P88 frontier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md START_HERE.md CHANGELOG.md CITATION.cff CITATION.md docs figures scripts website .github/workflows/figures.yml .github/workflows/pages.yml .github/workflows/reproducibility.yml
          if git diff --cached --quiet; then
            echo "P88 publication surfaces already synchronized"
          else
            git commit -m "Promote public frontier to P88 and 88 results"
            git push origin HEAD:p88-complete-bounded-weight-frontier
          fi
