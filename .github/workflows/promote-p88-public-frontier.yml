name: promote-p88-public-frontier

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/promote-p88-public-frontier.yml"
      - "scripts/promote_p88_public_frontier.py"
      - "scripts/sync_figure_publication.py"
      - "scripts/synchronize_p88_reader_frontier_phrases.py"
      - "scripts/prepare_website.py"
      - "scripts/verify_repository.py"
      - "scripts/verify_frontier_publication.py"
      - "docs/proposition_88_exact_radius_three_bounded_primitive_quad_projection_parity_functional.md"
      - "docs/p88_equation_provenance.md"
      - "docs/figures/p88_exact_radius_three_bounded_primitive_quad_projection_parity.svg"
      - "src/consciousness_bridge/radius_three_bounded_primitive_quad_projection_parity_functional_separation.py"
      - "tests/test_radius_three_bounded_primitive_quad_projection_parity_functional_separation.py"
      - "tests/test_figure_publication_sync.py"
      - "tests/test_p88_reader_surface_coherence.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p88-public-frontier-main
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Synchronize reader and figure publication surfaces to P88
        run: |
          python scripts/sync_figure_publication.py
          python scripts/synchronize_p88_reader_frontier_phrases.py
      - name: Validate exact P88 theorem and publication contract
        run: |
          python -m pytest -q \
            tests/test_radius_three_bounded_primitive_quad_projection_parity_functional_separation.py \
            tests/test_figure_publication_sync.py \
            tests/test_p88_reader_surface_coherence.py
          python -m py_compile \
            src/consciousness_bridge/radius_three_bounded_primitive_quad_projection_parity_functional_separation.py \
            scripts/promote_p88_public_frontier.py \
            scripts/sync_figure_publication.py \
            scripts/synchronize_p88_reader_frontier_phrases.py \
            scripts/prepare_website.py \
            scripts/verify_frontier_publication.py \
            scripts/verify_repository.py
          python scripts/sync_figure_publication.py --check
          python scripts/verify_repository.py
          git diff --check
          grep -q 'Explore all 88 results' website/index.html
          grep -q '<strong>P88</strong><span>current theorem frontier</span>' website/index.html
          grep -q 'id="p88-frontier" class="theorem-frontier current-frontier-visual"' website/index.html
          grep -q '208,560 exact P88 functionals' website/index.html
          grep -q '<strong>88</strong><span>Research II proposition-level results</span>' website/plain-language.html
          grep -q '<strong>P88</strong><span>current Research II theorem frontier</span>' website/plain-language.html
          test "$(grep -cF '<!-- current-frontier-home: P88 -->' website/index.html)" -eq 1
          test "$(grep -cF '<!-- current-frontier-visual: P88 -->' website/visual-atlas.html)" -eq 1
          grep -q '"current_frontier": "P88"' figures/manifest.json
          grep -q 'P88' README.md START_HERE.md figures/README.md figures/CURRENT_FRONTIER.md
      - name: Commit P88 public-frontier synchronization
        run: |
          if git diff --quiet; then
            echo "Publication surfaces already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md START_HERE.md website docs figures
          git commit -m "Synchronize public research frontier to P88"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
