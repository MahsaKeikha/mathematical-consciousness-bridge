name: promote-p88-public-frontier

on:
  push:
    branches: ["p88-publication-prep"]
    paths:
      - ".github/workflows/promote-p88-public-frontier.yml"
      - "scripts/promote_p88_public_frontier.py"
      - "scripts/finalize_p88_publication_consistency.py"
      - "tests/test_figure_publication_sync.py"
      - "tests/test_reader_experience.py"
      - "tests/test_website_research_orientation.py"
      - "Makefile"
      - "requirements-reproducibility.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Transform guarded checkout to P88
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/promote_p88_public_frontier.py")
          text = path.read_text(encoding="utf-8")
          old = 'text, count = pattern.subn(replacement.rstrip() + "\\n\\n", text, count=1)'
          new = 'text, count = pattern.subn(lambda _: replacement.rstrip() + "\\n\\n", text, count=1)'
          if old not in text:
              raise SystemExit("promotion helper replacement anchor not found")
          text = text.replace(old, new, 1)
          text = text.replace("import shutil\n", "", 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile \
            scripts/promote_p88_public_frontier.py \
            scripts/finalize_p88_publication_consistency.py
          python scripts/promote_p88_public_frontier.py
          python - <<'PY'
          from pathlib import Path

          roadmap_path = Path("docs/theorem_roadmap.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          p87 = r"&\text{P87: bounded primitive four-event parity functionals complete the nonzero coefficient box with |c_i| <= 2}"
          p88 = r"&\text{P88: held-out validation gives selection-valid finite-sample certification for a discovery-frozen P75 box/P87 functional}"
          if r"\text{P88:" not in roadmap:
              if p87 not in roadmap:
                  raise SystemExit("P87 dependency-map anchor was not found")
              roadmap = roadmap.replace(
                  p87,
                  p87 + "\\\\\n&\\Downarrow\\\\\n" + p88,
                  1,
              )
          if r"\text{P88:" not in roadmap:
              raise SystemExit("P88 dependency-map node was not created")
          roadmap = roadmap.replace("continuation beyond P87", "continuation beyond P88")
          roadmap = roadmap.replace(
              "Any P88 claim must close a separately stated mathematical or scientific gap and must include a strict or otherwise informative certificate that is not already implied by P86.",
              "P88 closes the held-out selection-validity gap. Any P89 claim must close a separately stated mathematical or scientific gap not already resolved through P88.",
          )
          if "continuation beyond P87" in roadmap:
              raise SystemExit("stale P87 future-work language remains")
          roadmap_path.write_text(roadmap, encoding="utf-8")

          navigation_path = Path("docs/research_navigation.md")
          navigation = navigation_path.read_text(encoding="utf-8")
          if "p88_equation_provenance.md" not in navigation:
              navigation += (
                  "\n\n### P88 frontier audit links\n\n"
                  "- [P88 formal proof](proposition_88_heldout_selected_parity_functional_certification.md)\n"
                  "- [P88 equation provenance](p88_equation_provenance.md)\n"
                  "- [P88 implementation](../src/consciousness_bridge/heldout_selected_parity_functional_certification.py)\n"
                  "- [P88 exact regression tests](../tests/test_heldout_selected_parity_functional_certification.py)\n"
              )
          navigation_path.write_text(navigation, encoding="utf-8")
          PY
          python scripts/finalize_p88_publication_consistency.py
          python scripts/sync_figure_publication.py
      - name: Install development and reproducibility environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-reproducibility.txt
      - name: Validate P88 publication and website
        run: |
          python scripts/verify_frontier_publication.py
          python scripts/sync_figure_publication.py --check
          python scripts/generate_all_figures.py --validate-only
          python scripts/verify_repository.py
          python scripts/prepare_website.py --source website --output _site
          rm -rf _site
      - name: Run complete tests and static checks
        run: |
          python -m pytest -q
          python -m ruff check src scripts tests
          git diff --check
      - name: Commit validated P88 state to prep branch only
        run: |
          rm scripts/promote_p88_public_frontier.py
          rm scripts/finalize_p88_publication_consistency.py
          rm .github/workflows/promote-p88-public-frontier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote held-out validation theorem to P88"
          git fetch origin p88-publication-prep
          git rebase origin/p88-publication-prep
          git push origin HEAD:p88-publication-prep
