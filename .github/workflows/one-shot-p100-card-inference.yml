name: One Shot P100 Card Inference

on:
  push:
    branches:
      - p100-card-inference-contract
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: p100-card-inference-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Make app proposition inference P100-safe and range-safe
        run: python scripts/one_shot_p100_card_inference.py

      - name: Run focused interaction contracts
        run: |
          python -m pytest -q \
            tests/test_p100_card_inference_contract.py \
            tests/test_range_card_affordance_clarity.py \
            tests/test_reader_resource_navigation.py \
            tests/test_website_build.py \
            tests/test_public_reader_punctuation.py
          python -m ruff check tests/test_p100_card_inference_contract.py
          git diff --check

      - name: Commit permanent app inference correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/app.js
          git commit -m "Make card proposition inference P100-safe"
          git push origin HEAD:p100-card-inference-contract
