name: Clean P84 reader narrative once

on:
  push:
    paths:
      - .github/workflows/cleanup-p84-reader-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean stale frontier language and complete reader paths
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          # Homepage: remove stale P83-era reader labels and complete the P75-P84 ladder.
          path = 'website/index.html'
          text = read(path)
          replacements = {
              'P75-P83 test the target-measurement model itself': 'P75-P84 test the target-measurement model itself',
              'You do not need to read 82 proofs in numerical order': 'You do not need to read all 84 propositions in numerical order',
              'Focus on P19 and P71-P83, then read the falsification program.': 'Focus on P19 and P71-P84, then read the falsification program.',
              'Follow P20-P24, P39-P44, P47-P60, and P74-P82.': 'Follow P20-P24, P39-P44, P47-P60, and P74-P84.',
              '<p class="eyebrow">The 83-result program</p>': '<p class="eyebrow">The 84-result program</p>',
              '<article class="result"><span>P75-P83</span><h3>Target-model adequacy</h3>': '<article class="result"><span>P75-P84</span><h3>Target-model adequacy</h3>',
              '<h2>P71-P83: from target provenance to certified full-law separation</h2>': '<h2>P71-P84: from target provenance to certified shared-parameter full-law separation</h2>',
              '<p class="eyebrow">P75 → P81 certification ladder</p>': '<p class="eyebrow">P75 → P84 certification ladder</p>',
              '<!-- Current theorem asset: docs/figures/p83_exact_projection_parity.svg -->': '<!-- Current theorem asset: docs/figures/p84_exact_joint_projection_parity_contrast.svg -->',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f'homepage cleanup anchor missing: {old}')
              text = text.replace(old, new)

          p81 = '<article class="result"><span>P81</span><h3>Projection-event tightening</h3><p>Exact parameter-box ranges for all nonempty projected binary events add marginal and cylinder-event constraints that can strictly strengthen P80.</p></article>'
          p84_grid = p81 + '\n        <article class="result"><span>P82</span><h3>Nested residual tightening</h3><p>Exact residual-event intervals preserve common-parameter structure beyond separate projected-event ranges.</p></article>\n        <article class="result"><span>P83</span><h3>Projection-parity tightening</h3><p>Twenty-two exact parity events expose dependency constraints invisible to the complete P82 nested-event family.</p></article>\n        <article class="result"><span>P84</span><h3>Joint parity compatibility</h3><p>Two individually compatible P83 parity events can still be impossible under one shared P75 parameter assignment. P84 audits 220 exact joint contrasts.</p></article>'
          if '<article class="result"><span>P84</span><h3>Joint parity compatibility</h3>' not in text:
              if p81 not in text:
                  raise RuntimeError('homepage P81 result-grid anchor missing')
              text = text.replace(p81, p84_grid, 1)

          p83_card = '''      <div class="figure-card">\n        <img src="https://raw.githubusercontent.com/MahsaKeikha/mathematical-consciousness-bridge/main/docs/figures/p83_exact_projection_parity.svg" alt="P83 exact projection-parity certificate" />\n        <div><h3>P83 · Exact projection parity</h3><p>P83 adds 22 exact parity observables whose branch probabilities reduce to a multi-affine product. Exact rational vertex extremization exposes dependence constraints that can remain invisible to every P82 nested event. A strict witness has L82 = 0 and L83 = 1/16.</p><a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/proposition_83_exact_projection_parity.md">Read P83 →</a></div>\n      </div>'''
          p84_card = '''\n\n      <div class="figure-card">\n        <img src="https://raw.githubusercontent.com/MahsaKeikha/mathematical-consciousness-bridge/main/docs/figures/p84_exact_joint_projection_parity_contrast.svg" alt="P84 exact joint projection-parity contrast certificate" />\n        <div><h3>P84 · Exact joint projection parity</h3><p>P84 keeps pairs of P83 parity events coupled through one common P75 parameter assignment. The 220-contrast audit has an exact witness with L83 = 0 and L84 = 1/32, proving strict shared-parameter separation beyond the complete scalar parity audit.</p><a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/proposition_84_exact_projection_parity_contrast.md">Read P84 →</a></div>\n      </div>'''
          if '<h3>P84 · Exact joint projection parity</h3>' not in text:
              if p83_card not in text:
                  raise RuntimeError('homepage P83 figure-card anchor missing')
              text = text.replace(p83_card, p83_card + p84_card, 1)
          write(path, text)

          # Visual atlas: historical frontiers remain visible but only P84 is labeled current.
          path = 'website/visual-atlas.html'
          atlas = read(path)
          atlas = atlas.replace('Current theorem frontier · P82', 'Earlier theorem frontier · P82')
          atlas = atlas.replace('Current theorem frontier · P83', 'Previous theorem frontier · P83')
          if 'id="p84-frontier"' not in atlas:
              block = '''\n<section id="p84-frontier">\n  <div class="section-head"><p class="eyebrow">Current theorem frontier · P84</p><h2>Exact joint projection-parity contrast certificate</h2><p>P84 preserves shared-parameter geometry across pairs of P83 parity events. It audits 220 exact coupled contrasts and can certify incompatibility even when every individual P83 parity interval remains compatible.</p></div>\n  <div class="figure-card">\n    <img src="https://raw.githubusercontent.com/MahsaKeikha/mathematical-consciousness-bridge/main/docs/figures/p84_exact_joint_projection_parity_contrast.svg" alt="P84 exact joint projection-parity contrast certificate"/>\n    <div><h3>L83 = 0, L84 = 1/32 on the strict witness</h3><p>Read the figure from separate P83 parity events to common-vertex joint extremization and then to the eight-cell full-law distance transfer. The result is a stronger certificate for the declared P75 model family, not an identification of consciousness.</p><a href="https://github.com/MahsaKeikha/mathematical-consciousness-bridge/blob/main/docs/proposition_84_exact_projection_parity_contrast.md">Open the P84 theorem →</a></div>\n  </div>\n</section>\n'''
              if '</main>' not in atlas:
                  raise RuntimeError('visual atlas closing main missing')
              atlas = atlas.replace('</main>', block + '\n</main>', 1)
          write(path, atlas)

          # Theorem roadmap: make the open-frontier discussion genuinely current.
          path = 'docs/theorem_roadmap.md'
          roadmap = read(path)
          roadmap = roadmap.replace('After P82, the target-side chain has a substantially clearer scientific burden:', 'After P84, the target-side chain has a substantially clearer scientific burden:')
          duplicated = 'P78 closes the global-lower-bound gap for the specific continuous P75 four-view binary latent family. P79 certifies the one-sided sampling-radius envelope. P80 strengthens the box relaxation by retaining probability normalization. P81 strengthens it again by retaining exact marginal and projected-event constraints implied by each parameter box. P82 then adds exact non-cylinder residual constraints from nested projected events, retaining common-parameter structure that separate event intervals discard. P82 then adds exact non-cylinder residual constraints from nested projected events, retaining common-parameter structure that separate event intervals discard.'
          current = 'P78 closes the global-lower-bound gap for the specific continuous P75 four-view binary latent family. P79 certifies the one-sided sampling-radius envelope. P80 strengthens the box relaxation by retaining probability normalization. P81 adds exact marginal and projected-event constraints. P82 adds exact non-cylinder residual constraints from nested projected events. P83 adds exact projection-parity observables. P84 then preserves shared-parameter compatibility across pairs of those parity observables through 220 exact joint contrasts.'
          if duplicated not in roadmap:
              raise RuntimeError('roadmap duplicated P82 frontier paragraph missing')
          roadmap = roadmap.replace(duplicated, current)
          old_next = 'The next computational question is therefore not another cosmetic bound. A substantive continuation beyond P82 would retain broader **simultaneous dependence among multiple overlapping events** or introduce a demonstrably tighter exact-rational convex or semialgebraic relaxation while preserving the certified lower-bound direction. Statistical extensions remain open as well, including sharper power analysis and target-view models with residual dependence, shared bias, temporal drift, or learned measurement pipelines.'
          new_next = 'The next computational question is therefore not another cosmetic bound. A substantive continuation beyond P84 should retain **higher-order simultaneous dependence among three or more overlapping observables**, or introduce a demonstrably tighter exact-rational convex or semialgebraic relaxation while preserving the certified lower-bound direction. Any P85 candidate should come with a strict witness showing information not already captured by the complete P84 audit. Statistical extensions remain open as well, including sharper power analysis and target-view models with residual dependence, shared bias, temporal drift, or learned measurement pipelines.'
          if old_next not in roadmap:
              raise RuntimeError('roadmap next-frontier paragraph missing')
          roadmap = roadmap.replace(old_next, new_next)
          roadmap = roadmap.replace('None of P71-P82 identifies a latent variable with consciousness.', 'None of P71-P84 identifies a latent variable with consciousness.')
          roadmap = roadmap.replace('## P83 frontier: exact projection-parity separation', '## P83 predecessor frontier: exact projection-parity separation')
          write(path, roadmap)

          # Research navigation: complete the proposition index and replace stale tail fragments.
          path = 'docs/research_navigation.md'
          nav = read(path)
          old_index = '''| P78 | [Certified continuous model separation](proposition_78_certified_continuous_model_separation.md) | exact-rational global lower bound for the continuous P75 model family |\n\n| P84 | [Exact joint projection-parity contrast](proposition_84_exact_projection_parity_contrast.md) | exact shared-parameter parity-event contrast separation beyond the complete P83 scalar audit |'''
          new_index = '''| P78 | [Certified continuous model separation](proposition_78_certified_continuous_model_separation.md) | exact-rational global lower bound for the continuous P75 model family |\n| P79 | [Certified rational sampling-radius envelope](proposition_79_certified_sampling_radius.md) | exact-rational one-sided upper certificate for finite-data sampling uncertainty |\n| P80 | [Simplex-coupled model separation](proposition_80_simplex_coupled_model_separation.md) | exact probability-normalization tightening of each continuous-family box certificate |\n| P81 | [Projection-event model separation](proposition_81_projection_event_model_separation.md) | exact projected-event constraints and full-law distance transfer |\n| P82 | [Exact nested projection contrast](proposition_82_exact_nested_projection_contrast.md) | exact non-cylinder residual-event constraints from nested projections |\n| P83 | [Exact projection parity](proposition_83_exact_projection_parity.md) | exact parity-event constraints beyond the complete P82 nested audit |\n| P84 | [Exact joint projection-parity contrast](proposition_84_exact_projection_parity_contrast.md) | exact shared-parameter parity-event contrast separation beyond the complete P83 scalar audit |'''
          if old_index not in nav:
              raise RuntimeError('research navigation P78/P84 index anchor missing')
          nav = nav.replace(old_index, new_index)
          if '35. [P84 equation and provenance record]' not in nav:
              anchor = '34. [P83 equation and provenance record](p83_equation_provenance.md) for exact parity identities, multi-affine box extrema, the strict P83 > P82 witness, and the scientific interpretation boundary.'
              if anchor not in nav:
                  raise RuntimeError('research navigation P83 provenance reading-order anchor missing')
              nav = nav.replace(anchor, anchor + '\n35. [P84 equation and provenance record](p84_equation_provenance.md) for common-vertex joint parity contrasts, the 220-contrast family, the strict P84 > P83 witness, and the scientific interpretation boundary.')
          figure_anchor = '| [P76 figure](figures/p76_finite_sample_target_model_adequacy.svg) | shared finite-sample confidence event, polynomial adequacy intervals, certified rejection, and the non-rejection boundary |'
          if '| [P84 figure](figures/p84_exact_joint_projection_parity_contrast.svg)' not in nav:
              if figure_anchor not in nav:
                  raise RuntimeError('research navigation figure anchor missing')
              nav = nav.replace(figure_anchor, figure_anchor + '\n| [P84 figure](figures/p84_exact_joint_projection_parity_contrast.svg) | current frontier: exact shared-parameter parity-event contrast certification with the strict L83 = 0, L84 = 1/32 witness |')
          tail_start = '''\n\n| P82 | [Exact nested projection-contrast certificate](proposition_82_exact_nested_projection_contrast.md) | exact non-cylinder residual-event constraints from nested projections |\n\n## P81 frontier update\n\n| Proposition | Reader question | Direct proof |\n| --- | --- | --- |\n| P81 | Can exact projected-event constraints strengthen P80 while preserving a certified full-law lower bound? | [Projection-event model separation](proposition_81_projection_event_model_separation.md) |\n\n\n**Current frontier provenance:** [P84 equation and provenance record](p84_equation_provenance.md).'''
          tail_new = '''\n\n## Frontier resources\n\n| Proposition | What it adds | Direct proof |\n| --- | --- | --- |\n| P81 | exact projected-event constraints | [P81](proposition_81_projection_event_model_separation.md) |\n| P82 | exact nested residual-event constraints | [P82](proposition_82_exact_nested_projection_contrast.md) |\n| P83 | exact projection-parity constraints | [P83](proposition_83_exact_projection_parity.md) |\n| P84 | exact joint parity-event shared-parameter constraints | [P84](proposition_84_exact_projection_parity_contrast.md) |\n\n**Current frontier provenance:** [P84 equation and provenance record](p84_equation_provenance.md).'''
          if tail_start not in nav:
              raise RuntimeError('research navigation stale frontier tail missing')
          nav = nav.replace(tail_start, tail_new)
          write(path, nav)

          # README status wording that still stopped at P78.
          path = 'README.md'
          readme = read(path)
          readme = readme.replace('P71-P78 formalize separate requirements on target provenance, observation, channel identifiability, finite-data recovery, model adequacy, and finite-sample model rejection before such a target can carry bridge evidence.', 'P71-P84 formalize separate requirements on target provenance, observation, channel identifiability, finite-data recovery, model adequacy, full-law separation, and increasingly strong exact-rational continuous-family certificates before such a target can carry bridge evidence.')
          write(path, readme)

          # Final sanity checks for the current reader surfaces.
          homepage = read('website/index.html')
          for stale in ('The 83-result program', 'P75-P83', 'P71-P83:', 'read 82 proofs', 'Current theorem asset: docs/figures/p83_'):
              if stale in homepage:
                  raise RuntimeError(f'stale homepage frontier text remains: {stale}')
          atlas = read('website/visual-atlas.html')
          if 'Current theorem frontier · P84' not in atlas or 'Current theorem frontier · P83' in atlas or 'Current theorem frontier · P82' in atlas:
              raise RuntimeError('visual atlas current-frontier labels are inconsistent')
          if 'After P84' not in read('docs/theorem_roadmap.md'):
              raise RuntimeError('theorem roadmap open-frontier section is stale')
          PY
      - name: Commit P84 reader cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/theorem_roadmap.md docs/research_navigation.md website/index.html website/visual-atlas.html
          git commit -m "Clean P84 reader narrative and frontier navigation"
          git push origin HEAD:main
