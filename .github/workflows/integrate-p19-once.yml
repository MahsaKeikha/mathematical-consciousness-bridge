name: integrate-p19-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrate-p19-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply P19 release and navigation integration
        run: bash .github/integrate_p19_release.sh
      - name: Keep QM atlas at 18 and extend proposition guard to P19
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_main_page_visual_paper.py")
          text = path.read_text(encoding="utf-8")
          quantum_old = '''def test_main_page_contains_complete_quantum_figure_sequence():
              text = README.read_text(encoding="utf-8")

              for index in range(1, 20):'''
          quantum_new = '''def test_main_page_contains_complete_quantum_figure_sequence():
              text = README.read_text(encoding="utf-8")

              for index in range(1, 19):'''
          proposition_old = '''def test_main_page_exposes_entire_proposition_chain():
              text = README.read_text(encoding="utf-8")

              for index in range(1, 19):'''
          proposition_new = '''def test_main_page_exposes_entire_proposition_chain():
              text = README.read_text(encoding="utf-8")

              for index in range(1, 20):'''
          if quantum_old not in text:
              raise RuntimeError("quantum guard marker not found")
          if proposition_old not in text:
              raise RuntimeError("proposition guard marker not found")
          text = text.replace(quantum_old, quantum_new, 1)
          text = text.replace(proposition_old, proposition_new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate theorem links figures citations and code
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .
      - name: Commit integrated P19 research state
        run: |
          rm .github/workflows/integrate-p19-once.yml
          rm .github/integrate_p19_release.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/theorem_roadmap.md docs/equation_and_citation_map.md docs/citation_and_reference_policy.md pyproject.toml CITATION.cff CHANGELOG.md tests/test_main_page_visual_paper.py tests/test_visual_and_terminology_quality.py .github/workflows/integrate-p19-once.yml .github/integrate_p19_release.sh
          git commit -m "Integrate P19 navigation provenance and link integrity"
          git push origin HEAD:main

# one-time release integration; this workflow removes itself after a clean run
# retry after link-audit lint correction
