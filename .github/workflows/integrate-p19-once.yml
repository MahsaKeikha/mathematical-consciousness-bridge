name: integrate-p19-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrate-p19-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integrate P19 into README and theorem roadmap
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path("README.md")
          text = readme_path.read_text(encoding="utf-8")
          text = text.replace("version-0.18.0", "version-0.19.0", 1)
          text = text.replace(
              "**P18** proves a quantitative scale-sufficiency certificate based on approximate reconstruction.",
              "**P18** proves a quantitative scale-sufficiency certificate based on approximate reconstruction. **P19** proves exact deterministic and stochastic criteria for whether an independently defined target factors through a declared physical descriptor, together with a differential no-go test.",
              1,
          )
          text = text.replace(
              "The public research record now contains **18 proposition-level results,",
              "The public research record now contains **19 proposition-level results,",
              1,
          )
          text = text.replace(
              "| **4.4 Fundamental-theory interface** | Can spacetime, quantum, causal, and experiential structure be tested as quotients of one candidate fundamental state? |",
              "| **4.4 Fundamental-theory interface** | Can spacetime, quantum, causal, and experiential structure be tested as quotients of one candidate fundamental state? |\n| **4.5 P19 physical sufficiency** | Does an independently defined target factor through the declared physical descriptor? |",
              1,
          )
          text = text.replace("| proposition-level results | **18** |", "| proposition-level results | **19** |", 1)
          text = text.replace("| research-software version | **0.18.0** |", "| research-software version | **0.19.0** |", 1)
          text = text.replace("# 7. Theorem roadmap — P1 through P18", "# 7. Theorem roadmap — P1 through P19", 1)
          p18_row = "| **P18** | approximate reconstruction gives a quantitative scale-sufficiency certificate | proved | [P18](docs/proposition_18_scale_sufficiency_certification.md) |"
          p19_row = "| **P19** | exact physical-sufficiency factorization, conditional-information residual, and differential no-go criterion | proved | [P19](docs/proposition_19_fundamental_physical_sufficiency.md) |"
          if p19_row not in text:
              text = text.replace(p18_row, p18_row + "\n" + p19_row, 1)

          p19_section = r'''
# 4.5 P19 — fundamental physical sufficiency and residual tests

![P19 fundamental physical sufficiency](docs/figures/p19_fundamental_physical_sufficiency.svg)

P19 turns the fundamental-theory interface into an exact theorem. Let

\[
T:\mathcal M\to\mathcal Q_T
\]

be the declared physical descriptor and let

\[
E:\mathcal M\to\mathcal Q_E
\]

be an independently defined target descriptor. There exists a unique bridge on the physical image,

\[
\boxed{E=B_T\circ T,}
\]

if and only if the target is constant on every physical fiber:

\[
\boxed{
T(\Omega)=T(\Omega')
\Longrightarrow
E(\Omega)=E(\Omega').
}
\]

Thus a single exact collision

\[
\boxed{
T(\Omega)=T(\Omega')
\quad\text{but}\quad
E(\Omega)\ne E(\Omega')
}
\]

rules out every deterministic bridge through that declared physical descriptor.

The stochastic extension replaces deterministic factorization by conditional independence,

\[
\boxed{E\perp\!\!\!\perp\Omega\mid T.}
\]

For finite alphabets this is equivalent to

\[
\boxed{
\mathcal I_{\perp}^{\mathrm{fund}}
:=I(E;\Omega\mid T)=0.
}
\]

For smooth local coordinates, any differentiable factorization requires

\[
\boxed{
\operatorname{rank}D(T,E)=\operatorname{rank}DT.
}
\]

Therefore

\[
\boxed{
d_{\perp}
:=\operatorname{rank}D(T,E)-\operatorname{rank}DT>0
}
\]

is a sufficient local no-factorization certificate.

The interpretation is deliberately conservative: a residual first challenges the completeness of the declared physical descriptor. Measurement error, omitted physical variables, system boundaries, timescale, and intervention coverage must be tested before introducing a new primitive.

[Read Proposition 19](docs/proposition_19_fundamental_physical_sufficiency.md).

---

'''
          marker = "# 5. Probability, distinguishability, and information geometry"
          if "# 4.5 P19 — fundamental physical sufficiency and residual tests" not in text:
              text = text.replace(marker, p19_section + marker, 1)
          readme_path.write_text(text, encoding="utf-8")

          roadmap_path = Path("docs/theorem_roadmap.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          roadmap = roadmap.replace("![P1-P18 theorem roadmap]", "![P1-P19 theorem roadmap]", 1)
          p18_doc_row = "| [P18](proposition_18_scale_sufficiency_certification.md) | approximate reconstruction and separation margin | certifies when a coarse scale preserves a declared response family | proved scale-sufficiency theorem |"
          p19_doc_row = "| [P19](proposition_19_fundamental_physical_sufficiency.md) | quotient factorization, conditional mutual information, and differential rank obstruction | tests whether an independent target is fixed by the declared physical descriptor | proved physical-sufficiency theorem |"
          if p19_doc_row not in roadmap:
              roadmap = roadmap.replace(p18_doc_row, p18_doc_row + "\n" + p19_doc_row, 1)
          p19_doc_section = r'''
# 8. Fundamental physical sufficiency: P19

P19 asks whether an independently defined target descriptor \(E\) is already fixed by the declared physical descriptor \(T\).

The deterministic criterion is

\[
\boxed{
E=B_T\circ T
\iff
T(\Omega)=T(\Omega')\Rightarrow E(\Omega)=E(\Omega').
}
\]

For finite stochastic variables, physical sufficiency is equivalent to

\[
\boxed{
I(E;\Omega\mid T)=0.
}
\]

For differentiable local coordinates, any smooth factorization requires

\[
\boxed{
\operatorname{rank}D(T,E)=\operatorname{rank}DT.
}
\]

A positive rank residual is therefore a sufficient local no-factorization certificate. Neither a positive information residual nor a positive rank residual establishes a nonphysical ontology; both first challenge the completeness of the declared physical descriptor.

---

'''
          if "# 8. Fundamental physical sufficiency: P19" not in roadmap:
              roadmap = roadmap.replace("# 8. Dependency chain", p19_doc_section + "# 9. Dependency chain", 1)
              roadmap = roadmap.replace("# 9. Current frontier", "# 10. Current frontier", 1)
          roadmap_path.write_text(roadmap, encoding="utf-8")

          pyproject = Path("pyproject.toml")
          ptext = pyproject.read_text(encoding="utf-8")
          ptext = ptext.replace('version = "0.18.0"', 'version = "0.19.0"', 1)
          ptext = ptext.replace(
              "quantitative scale-sufficiency certification by approximate reconstruction, robust experiment design",
              "quantitative scale-sufficiency certification by approximate reconstruction, fundamental physical-sufficiency and residual tests, robust experiment design",
              1,
          )
          pyproject.write_text(ptext, encoding="utf-8")

          citation = Path("CITATION.cff")
          ctext = citation.read_text(encoding="utf-8")
          ctext = ctext.replace("version: 0.18.0", "version: 0.19.0", 1)
          ctext = ctext.replace(
              "quantitative scale-sufficiency certification by approximate reconstruction, robust experiment design",
              "quantitative scale-sufficiency certification by approximate reconstruction, fundamental physical-sufficiency factorization and residual tests, robust experiment design",
              1,
          )
          citation.write_text(ctext, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          chtext = changelog.read_text(encoding="utf-8")
          if "## 0.19.0 - 2026-09-09" not in chtext:
              entry = r'''
## 0.19.0 - 2026-09-09

### Proposition 19 - fundamental physical sufficiency and residual tests

- Proved the exact factorization criterion \(E=B_T\circ T\) iff the target is constant on every fiber of the declared physical descriptor.
- Added exact collision witnesses that rule out deterministic factorization through an incomplete descriptor.
- Proved the finite stochastic equivalence between physical screening-off and \(I(E;\Omega\mid T)=0\).
- Added the deterministic-target corollary \(I(E;\Omega\mid T)=H(E\mid T)\).
- Added a differential no-go criterion based on \(\operatorname{rank}D(T,E)-\operatorname{rank}DT\).
- Added executable factorization and conditional-information utilities with regression tests.
- Added a P19 publication-style theorem map and rebuilt the theorem roadmap as a compact P1-P19 dependency map.
- Reduced the intrinsic scale of the complete quantitative and quantum visual atlases and rebuilt the state-space map for main-page readability.

'''
              chtext = chtext.replace("## 0.18.0 - 2026-09-09", entry + "## 0.18.0 - 2026-09-09", 1)
          changelog.write_text(chtext, encoding="utf-8")

          main_test = Path("tests/test_main_page_visual_paper.py")
          mtext = main_test.read_text(encoding="utf-8")
          mtext = mtext.replace("range(1, 19)", "range(1, 20)")
          main_test.write_text(mtext, encoding="utf-8")

          visual_test = Path("tests/test_visual_and_terminology_quality.py")
          vtext = visual_test.read_text(encoding="utf-8")
          if '"p19_fundamental_physical_sufficiency.svg"' not in vtext:
              vtext = vtext.replace(
                  '    "p18_scale_sufficiency_certificate.svg",',
                  '    "p18_scale_sufficiency_certificate.svg",\n    "p19_fundamental_physical_sufficiency.svg",',
                  1,
              )
          visual_test.write_text(vtext, encoding="utf-8")
          PY
      - name: Validate complete P19 release
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .
      - name: Commit integrated P19 release
        run: |
          rm .github/workflows/integrate-p19-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/theorem_roadmap.md pyproject.toml CITATION.cff CHANGELOG.md tests/test_main_page_visual_paper.py tests/test_visual_and_terminology_quality.py .github/workflows/integrate-p19-once.yml
          git commit -m "Integrate Proposition 19 into main research paper"
          git push origin HEAD:main
