name: integrate-p19-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrate-p19-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply P19 release integration
        run: bash .github/integrate_p19_release.sh
      - name: Validate complete P19 release
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .
      - name: Commit integrated P19 release
        run: |
          rm .github/workflows/integrate-p19-once.yml
          rm .github/integrate_p19_release.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/theorem_roadmap.md pyproject.toml CITATION.cff CHANGELOG.md tests/test_main_page_visual_paper.py tests/test_visual_and_terminology_quality.py .github/workflows/integrate-p19-once.yml .github/integrate_p19_release.sh
          git commit -m "Integrate Proposition 19 into main research paper"
          git push origin HEAD:main

# one-time release integration; this workflow removes itself after a clean run
