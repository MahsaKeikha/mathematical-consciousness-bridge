name: one-shot-p59-figure-docs

on:
  push:
    branches: [visual-polish-p59]
    paths:
      - .github/workflows/one-shot-p59-figure-docs.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-polish-p59
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Integrate permanent P59 figure record and catalog row
        run: |
          python - <<'PY'
          from pathlib import Path

          records = Path("scripts/conceptual_figure_records.py")
          text = records.read_text(encoding="utf-8")
          marker = '    "docs/figures/p60_integer_transition_calibration.svg": {'
          if '"docs/figures/p59_optimal_transition_calibration.svg"' not in text:
              record = '''    "docs/figures/p59_optimal_transition_calibration.svg": {
                  "title": "P59 exact continuous transition-calibration allocation",
                  "description": (
                      "What this figure shows: P59 solves one declared continuous calibration resource-allocation problem exactly. P58 supplies an inverse-square-root uncertainty law for each calibrated transition, a predeclared positive sensitivity weight converts that uncertainty into the chosen separable route surrogate, and a fixed continuous budget must be divided across the edges. Strict convexity then gives a unique two-thirds-power allocation, the exact minimum surrogate uncertainty, and an exact target-budget threshold. "
                      "How to read it: read the three upper cards as the declared ingredients: P58 uncertainty scale, scientific sensitivity weight, and continuous total budget. Their attached arrows feed the central optimization theorem. From that theorem, follow the three lower branches to the two-thirds allocation law, the necessary-and-sufficient target-budget condition, and the continuous-to-integer handoff to P60 and P61. "
                      "Main takeaway: P59 is an exact continuous optimum for the stated separable surrogate; the weights must be justified independently and fractional allocations require a separate integer implementation."
                  ),
                  "status": (
                      "Continuous convex resource-allocation theorem for experimental calibration. It does not establish that the declared weights are uniquely scientifically correct, solve the full minimax robust-routing design problem, identify a physical quantity with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness."
                  ),
              },
          '''
              if marker not in text:
                  raise SystemExit("P60 insertion marker not found")
              records.write_text(text.replace(marker, record + marker, 1), encoding="utf-8")

          catalog = Path("docs/figure_catalog.md")
          lines = catalog.read_text(encoding="utf-8").splitlines()
          replacement = "| [P59 exact continuous transition-calibration allocation](figures/p59_optimal_transition_calibration.svg) | What this figure shows: P59 solves one declared continuous calibration resource-allocation problem exactly. P58 supplies an inverse-square-root uncertainty law for each calibrated transition, a predeclared positive sensitivity weight converts that uncertainty into the chosen separable route surrogate, and a fixed continuous budget must be divided across the edges. Strict convexity then gives a unique two-thirds-power allocation, the exact minimum surrogate uncertainty, and an exact target-budget threshold. How to read it: read the three upper cards as the declared ingredients: P58 uncertainty scale, scientific sensitivity weight, and continuous total budget. Their attached arrows feed the central optimization theorem. From that theorem, follow the three lower branches to the two-thirds allocation law, the necessary-and-sufficient target-budget condition, and the continuous-to-integer handoff to P60 and P61. Main takeaway: P59 is an exact continuous optimum for the stated separable surrogate; the weights must be justified independently and fractional allocations require a separate integer implementation. | Continuous convex resource-allocation theorem for experimental calibration. It does not establish that the declared weights are uniquely scientifically correct, solve the full minimax robust-routing design problem, identify a physical quantity with consciousness, establish a physical-to-experiential bridge, or imply quantum incompleteness. | [Proposition 59](proposition_59_optimal_transition_calibration.md) |"
          found = False
          for index, line in enumerate(lines):
              if "(figures/p59_optimal_transition_calibration.svg)" in line:
                  lines[index] = replacement
                  found = True
                  break
          if not found:
              raise SystemExit("P59 catalog row not found")
          catalog.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - run: pytest -q
      - run: ruff check .
      - name: Commit audited P59 integration and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-p59-figure-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate P59 figure documentation metadata"
          git push origin HEAD:visual-polish-p59
