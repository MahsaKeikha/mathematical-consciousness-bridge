name: about-wording-cleanup

on:
  push:
    branches:
      - about-question-wording-cleanup

permissions:
  contents: write

jobs:
  update-and-clean:
    if: ${{ !contains(github.event.head_commit.message, '[about-wording-synced]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: about-question-wording-cleanup
          fetch-depth: 0
      - name: Update About wording and remove temporary P99 helper
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "A question I never stopped asking"
          new = "The question that kept drawing me deeper."
          for rel in ("website/about.html", "website/index.html"):
              path = Path(rel)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected exactly one old heading in {rel}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          helper = Path("scripts/repair_p99_promoter_syntax.py")
          if helper.exists():
              helper.unlink()
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/about-wording-cleanup.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine About question wording and remove temporary P99 helper [about-wording-synced]"
          git push origin HEAD:about-question-wording-cleanup
