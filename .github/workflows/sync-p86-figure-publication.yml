name: sync-p86-figure-publication

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-p86-figure-publication.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Permanently harden Visual Atlas synchronization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/sync_figure_publication.py")
          text = path.read_text(encoding="utf-8")

          matcher_old = r'''r'<section id="p86-frontier"\b.*?</section>' '''.strip()
          matcher_new = r'''r'<section id="p86-frontier".*?</section>' '''.strip()
          text = text.replace(matcher_old, matcher_new, 1)

          start = text.index("def _normalize_visual_atlas(text: str) -> str:")
          end = text.index("\ndef _expected_outputs()", start)
          replacement = '''def _normalize_visual_atlas(text: str) -> str:
    start_marker = "<!-- current-frontier-visual: P86:start -->"
    end_marker = "<!-- current-frontier-visual: P86:end -->"
    block = start_marker + "\\n" + _p86_visual_section() + "\\n" + end_marker

    has_start = start_marker in text
    has_end = end_marker in text
    if has_start or has_end:
        if not (has_start and has_end):
            raise RuntimeError("incomplete P86 Visual Atlas synchronization markers")
        pattern = re.compile(
            re.escape(start_marker) + r".*?" + re.escape(end_marker),
            re.DOTALL,
        )
        text, count = pattern.subn(block, text, count=1)
        if count != 1:
            raise RuntimeError(
                f"expected exactly one marked P86 Visual Atlas block, found {count}"
            )
        return text

    legacy = re.compile(r'<section id="p86-frontier".*?</section>', re.DOTALL)
    text, count = legacy.subn("", text, count=1)
    if count != 1:
        raise RuntimeError(f"expected exactly one P86 Visual Atlas section, found {count}")

    boundary = re.search(r'<section class="boundary">.*?</section>', text, re.DOTALL)
    if boundary is None:
        raise RuntimeError("could not locate Visual Atlas reading-boundary section")

    return text[: boundary.end()] + "\\n" + block + "\\n" + text[boundary.end() :]

'''
          text = text[:start] + replacement + text[end + 1 :]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate synchronizer syntax
        run: python -m py_compile scripts/sync_figure_publication.py
      - name: Synchronize every public figure surface
        run: |
          python scripts/sync_figure_publication.py
          python scripts/sync_figure_publication.py --check
      - name: Require only declared publication outputs to change
        run: |
          python - <<'PY'
          import subprocess

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
          )
          allowed = {
              "scripts/sync_figure_publication.py",
              "figures/README.md",
              "figures/CURRENT_FRONTIER.md",
              "figures/manifest.json",
              "docs/figures/README.md",
              "website/visual-atlas.html",
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(
                  "unexpected synchronization changes: "
                  + ", ".join(sorted(unexpected))
              )
          missing = allowed - changed
          if missing:
              raise SystemExit(
                  "expected synchronization changes were absent: "
                  + ", ".join(sorted(missing))
              )
          print("guarded outputs:", ", ".join(sorted(changed)))
          PY
          git diff --check
      - name: Validate P86 is dominant and manifest is complete
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / 'figures/manifest.json').read_text())
          assert manifest['current_frontier'] == 'P86'
          assert manifest['current_frontier_figure'].endswith(
              'p86_exact_minimally_weighted_quad_projection_parity.svg'
          )
          svg_paths = sorted((root / 'docs/figures').rglob('*.svg'))
          assert manifest['figure_count'] == len(svg_paths)
          by_path = {item['path']: item for item in manifest['figures']}
          assert len(by_path) == len(svg_paths)
          for path in svg_paths:
              relative = path.as_posix()
              item = by_path[relative]
              raw = path.read_bytes()
              assert item['bytes'] == len(raw)
              assert item['sha256'] == hashlib.sha256(raw).hexdigest()

          atlas = (root / 'website/visual-atlas.html').read_text()
          p86 = atlas.index('id="p86-frontier"')
          p84 = atlas.index('id="p84-frontier"')
          p85 = atlas.index('id="p85-frontier"')
          assert p86 < p84 < p85
          assert 'current-frontier-visual: P86:start' in atlas
          assert 'current-frontier-visual: P86:end' in atlas
          assert 'L85 = 0 &lt; L86 = 1/192' in atlas
          assert 'weighted_quad_projection_parity_functional_separation.py' in atlas
          assert 'test_weighted_quad_projection_parity_functional_separation.py' in atlas

          gateway = (root / 'figures/CURRENT_FRONTIER.md').read_text()
          assert gateway.startswith('# Current visual frontier: P71-P86')
          assert '## Current theorem frontier: P86' in gateway
          assert 'L85 = 0 < L86 = 1/192' in gateway
          PY
      - name: Commit synchronized figure publication surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync_figure_publication.py figures/README.md figures/CURRENT_FRONTIER.md figures/manifest.json docs/figures/README.md website/visual-atlas.html
          git commit -m "Synchronize complete P86 figure publication record"
          git push origin HEAD:main
