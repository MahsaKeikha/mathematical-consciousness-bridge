# Temporary organization workflow. Removed before merge.
name: organize-public-research-map

on:
  workflow_dispatch:
  push:
    branches:
      - organize-public-research-map
    paths:
      - scripts/organize_website_research_map.py
      - .github/workflows/organize-public-research-map.yml

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: organize-public-research-map
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Organize research map
        run: python scripts/organize_website_research_map.py
      - name: Validate research orientation
        run: |
          python -m pip install -e ".[dev]"
          pytest tests/test_website_research_orientation.py tests/test_research_website_integrity.py tests/test_document_link_integrity.py tests/test_typography_policy.py
          ruff check tests/test_website_research_orientation.py scripts/organize_website_research_map.py
      - name: Commit organized research map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/research-map.html
          git diff --cached --quiet && exit 0
          git commit -m "Organize public research map for first-read clarity"
          git push origin HEAD:organize-public-research-map
