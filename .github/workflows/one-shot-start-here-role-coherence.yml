name: One Shot Start Here Role Coherence

on:
  push:
    branches:
      - start-here-inference-role-coherence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: start-here-inference-role-coherence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Split model adequacy from inference validity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('website/start-here.html')
          text = path.read_text(encoding='utf-8')

          old_flow = '<div class="flow-node"><span>05</span><h3>Model adequacy</h3><p>P75-P100 test the declared target-measurement model itself, from overidentification to exact continuous-family separation certificates.</p></div>\n        <div class="flow-node"><span>06</span><h3>Finite-data decision</h3><p>Separate certified rejection from inconclusive non-rejection under explicit sampling and numerical uncertainty.</p></div>'
          new_flow = '<div class="flow-node"><span>05</span><h3>Model adequacy and separation</h3><p>P75-P92 test the declared target-measurement model itself, from overidentification through exact continuous-family separation.</p></div>\n        <div class="flow-node"><span>06</span><h3>Finite-data and adaptive inference</h3><p>P93-P100 carry population separation into IID finite data, finite-range dependence, declared drift, selection-valid holdout and candidate selection, cross-fitting, e-value aggregation, and anytime-valid sequential evidence.</p></div>'

          old_role = '<article class="result"><span>P75-P100</span><h3>Target-model adequacy</h3><p>Overidentification, finite-data rejection, full-law model-set separation, and exact-rational continuous-family certificates.</p></article>'
          new_role = '<article class="result"><span>P75-P92</span><h3>Target-model adequacy and separation</h3><p>Overidentification, finite-data rejection, full-law model-set separation, exact-rational continuous-family certificates, parity functionals, nonlinear rank constraints, and exact global population distance.</p></article>\n        <article class="result"><span>P93-P100</span><h3>Finite-data and adaptive inference</h3><p>IID rejection, finite-range dependence, declared drift, selection-valid holdout and candidate-family analysis, cross-fitting, e-value aggregation, and anytime-valid sequential evidence across fresh rounds.</p></article>'

          for old, new, label in (
              (old_flow, new_flow, 'inference chain'),
              (old_role, new_role, 'scientific role grid'),
          ):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'expected exactly one {label} target, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused coherence contracts
        run: |
          python -m pytest -q \
            tests/test_start_here_inference_role_coherence.py \
            tests/test_p100_reader_surface_coherence.py \
            tests/test_reader_resource_navigation.py \
            tests/test_public_reader_punctuation.py
          python -m ruff check tests/test_start_here_inference_role_coherence.py
          git diff --check

      - name: Commit permanent Start Here correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/start-here.html
          git commit -m "Clarify late Research II inference roles on Start Here"
          git push origin HEAD:start-here-inference-role-coherence
