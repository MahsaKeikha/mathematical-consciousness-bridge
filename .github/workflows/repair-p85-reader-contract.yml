name: repair-p85-reader-contract

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/repair-p85-reader-contract.yml"
      - "scripts/repair_p85_reader_contract.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make repair helper idempotent
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/repair_p85_reader_contract.py")
          source = path.read_text(encoding="utf-8")
          marker = "    if 'CURRENT_FRONTIER = \"P85\"' not in text or \"range(1, 86)\" not in text:\n"
          if "    p85_core = (\n" not in source:
              addition = '''    p85_core = (
                  '    "docs/proposition_85_exact_triple_projection_parity_functional.md",\\n'
                  '    "docs/p85_equation_provenance.md",\\n'
              )
              while p85_core + p85_core in text:
                  text = text.replace(p85_core + p85_core, p85_core)
              p84_stale = (
                  '        "current P84 frontier",\\n'
                  '        "through Proposition 84",\\n'
                  '        "Eighty-four results",\\n'
              )
              while p84_stale + p84_stale in text:
                  text = text.replace(p84_stale + p84_stale, p84_stale)
          '''
              if marker not in source:
                  raise RuntimeError("could not locate verifier-promotion guard in repair helper")
              source = source.replace(marker, addition + marker, 1)

          reader_test_guard = '''def update_reader_test() -> None:
              path = "tests/test_reader_experience.py"
              text = read(path)
          '''
          guarded_reader_test = reader_test_guard + '''    if "test_first_reader_surfaces_match_p85_frontier" in text:
              return
          '''
          if 'if "test_first_reader_surfaces_match_p85_frontier" in text:' not in source:
              if reader_test_guard not in source:
                  raise RuntimeError("could not locate reader-test promotion function")
              source = source.replace(reader_test_guard, guarded_reader_test, 1)

          path.write_text(source, encoding="utf-8")
          PY
      - name: Repair P85 reader contract
        run: python scripts/repair_p85_reader_contract.py
      - name: Normalize Plain Language P85 status
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("website/plain-language.html")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "<strong>84</strong><span>proposition-level results</span>": "<strong>85</strong><span>proposition-level results</span>",
              "<strong>P84</strong><span>current theorem frontier</span>": "<strong>P85</strong><span>current theorem frontier</span>",
              "What the 84 results are doing": "What the 85 results are doing",
              "P75-P84": "P75-P85",
              "actual P84 research frontier": "actual P85 research frontier",
              "shows how all 83 results connect": "shows how all 85 results connect",
              "shows how all 84 results connect": "shows how all 85 results connect",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          required = (
              "<strong>85</strong><span>proposition-level results</span>",
              "<strong>P85</strong><span>current theorem frontier</span>",
              "What the 85 results are doing",
              "P75-P85",
              "actual P85 research frontier",
              "shows how all 85 results connect",
          )
          for token in required:
              if token not in text:
                  raise RuntimeError(f"Plain Language page missing P85 status token: {token}")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Normalize P84 and P85 Research Map semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("website/research-map.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '<a class="button primary" href="#p84">Continue to the current P85 frontier</a>',
              '<a class="button primary" href="index.html#p85-frontier">Continue to the current P85 frontier</a>',
              1,
          )
          text = text.replace(
              '<p class="eyebrow">Current certified frontier</p>\n      <h2>P84:',
              '<p class="eyebrow">Previous certified frontier · P84</p>\n      <h2>P84:',
              1,
          )
          if 'href="index.html#p85-frontier">Continue to the current P85 frontier</a>' not in text:
              raise RuntimeError("P85 frontier navigation was not normalized")
          if '<p class="eyebrow">Previous certified frontier · P84</p>' not in text:
              raise RuntimeError("P84 historical frontier label was not normalized")
          if '<p class="eyebrow">Current certified frontier</p>\n      <h2>P84:' in text:
              raise RuntimeError("stale P84 current-frontier label remains")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify targeted publication tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_p84_reader_presentation.py tests/test_reader_experience.py tests/test_frontier_reader_narrative.py tests/test_reader_documentation_consistency.py tests/test_research_website_integrity.py
          python scripts/verify_repository.py
      - name: Check patch formatting
        run: git diff --check
      - name: Commit repaired reader contract
        run: |
          if git diff --quiet; then
            echo "Reader contract already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/index.html website/plain-language.html website/visual-atlas.html website/start-here.html website/research-map.html scripts/verify_repository.py scripts/repair_p85_reader_contract.py tests/test_reader_experience.py
          git commit -m "Repair P85 reader and verification contract"
          git push origin HEAD:main
