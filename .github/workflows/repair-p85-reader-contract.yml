name: repair-p85-reader-contract

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/repair-p85-reader-contract.yml"
      - "scripts/repair_p85_reader_contract.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair P85 reader contract
        run: python scripts/repair_p85_reader_contract.py
      - name: Verify targeted publication tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/test_p84_reader_presentation.py tests/test_reader_experience.py tests/test_frontier_reader_narrative.py tests/test_reader_documentation_consistency.py tests/test_research_website_integrity.py
          python scripts/verify_repository.py
      - name: Check patch formatting
        run: git diff --check
      - name: Commit repaired reader contract
        run: |
          if git diff --quiet; then
            echo "Reader contract already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/index.html website/visual-atlas.html website/start-here.html website/research-map.html scripts/verify_repository.py tests/test_reader_experience.py
          git commit -m "Repair P85 reader and verification contract"
          git push origin HEAD:main
