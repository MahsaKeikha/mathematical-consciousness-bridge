name: integrate-p41-once

on:
  push:
    branches:
      - p41-trace-ball-quantum-envelope
    paths:
      - .github/integrate_p41_release.py
      - .github/workflows/integrate-p41-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: p41-trace-ball-quantum-envelope
          fetch-depth: 0

      - name: Apply P41 publication integration
        run: python .github/integrate_p41_release.py

      - name: Remove one-time integration scaffolding
        run: |
          rm .github/integrate_p41_release.py
          rm .github/workflows/integrate-p41-once.yml

      - name: Validate on Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test on Python 3.10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test on Python 3.11
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test on Python 3.12
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Commit verified P41 release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate P41 trace-ball quantum envelope"
          git push origin HEAD:p41-trace-ball-quantum-envelope
