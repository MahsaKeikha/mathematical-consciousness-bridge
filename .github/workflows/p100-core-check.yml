name: p100-core-check

on:
  push:
    branches:
      - p100-anytime-sequential-eprocess

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Compile P100
        run: python -m py_compile src/consciousness_bridge/anytime_sequential_eprocess.py tests/test_anytime_sequential_eprocess.py
      - name: Run focused P99-P100 tests
        run: python -m pytest -q tests/test_anytime_sequential_eprocess.py tests/test_cross_fitted_evalue_aggregation.py
      - name: Run Ruff
        run: python -m ruff check src/consciousness_bridge/anytime_sequential_eprocess.py tests/test_anytime_sequential_eprocess.py
      - name: Check formatting drift
        run: git diff --check
