name: p97-publication-promotion

on:
  push:
    branches: ["p97-simultaneous-candidate-family-selection"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p97-simultaneous-candidate-family-selection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install -e ".[dev]"
      - name: Promote P97 publication surfaces
        run: python scripts/promote_p97_public_frontier.py
      - name: Synchronize figure publication record
        run: python scripts/sync_figure_publication.py
      - name: Repair stale publication contracts
        run: python scripts/repair_p97_publication_contracts.py
      - name: Validate P97 publication state
        run: |
          python -m pytest -q \
            tests/test_simultaneous_candidate_family_selection.py \
            tests/test_p97_reader_surface_coherence.py \
            tests/test_p96_reader_surface_coherence.py \
            tests/test_p95_reader_surface_coherence.py \
            tests/test_p94_reader_surface_coherence.py \
            tests/test_main_page_visual_paper.py \
            tests/test_publication_contract_v2.py \
            tests/test_readme_research_orientation.py \
            tests/test_website_link_integrity.py \
            tests/test_website_research_orientation.py \
            tests/test_figure_publication_sync.py \
            tests/test_frontier_publication_consistency.py
          python -m ruff check src/consciousness_bridge/simultaneous_candidate_family_selection.py tests/test_simultaneous_candidate_family_selection.py
          python scripts/sync_figure_publication.py --check
          python scripts/verify_repository.py
          rm -rf website-deploy
          python scripts/prepare_website.py --output website-deploy
          git diff --check
      - name: Commit promoted P97 publication state
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No promotion changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote P97 public theorem frontier"
          git push origin HEAD:p97-simultaneous-candidate-family-selection
