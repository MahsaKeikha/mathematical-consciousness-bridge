name: integrate-p71-figure-record

on:
  push:
    branches:
      - visual-polish-p71

permissions:
  contents: write

jobs:
  integrate-regenerate-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Integrate permanent P71 figure record
        run: python scripts/integrate_p71_figure_record.py
      - name: Regenerate figure metadata and catalog
        run: python scripts/enrich_figure_documentation.py
      - name: Validate regenerated record
        run: |
          pytest -q
          ruff check .
      - name: Commit audited record and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/integrate_p71_figure_record.py
          rm .github/workflows/integrate-p71-figure-record.yml
          git add -A
          if git diff --cached --quiet; then
            echo "P71 figure record is already current."
          else
            git commit -m "Integrate audited P71 figure documentation"
            git push origin HEAD:${{ github.ref_name }}
          fi
