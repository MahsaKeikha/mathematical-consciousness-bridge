name: p75-release-polish

on:
  push:
    branches:
      - p75-target-model-adequacy-overidentification
    paths:
      - scripts/p75_release_polish.py

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p75-target-model-adequacy-overidentification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/p75_release_polish.py
      - name: Commit release polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/equation_and_citation_map.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Complete P71-P75 release and provenance history"
          git push origin HEAD:p75-target-model-adequacy-overidentification
