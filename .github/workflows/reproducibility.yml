name: reproducibility

# Exact-reference P90 release audit on the same commit used by the publication gate.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p90-exact-nonlinear-rank-one-separation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install exact reference environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-reproducibility.txt
      - name: Canonicalize P90 reader and figure publication state
        run: |
          python scripts/repair_p90_reader_residuals.py
          python scripts/generate_all_figures.py
      - name: Validate canonicalized P90 publication state
        run: |
          python -m pytest -q \
            tests/test_p90_reader_surface_coherence.py \
            tests/test_frontier_reader_narrative.py \
            tests/test_reader_documentation_consistency.py \
            tests/test_research_website_integrity.py \
            tests/test_figure_publication_sync.py \
            tests/test_figure_documentation_integrity.py
          python scripts/sync_figure_publication.py --check
          python scripts/verify_repository.py
          python -m ruff check scripts/promote_p90_public_frontier.py scripts/repair_p90_reader_residuals.py tests/test_p90_reader_surface_coherence.py
          git diff --check
      - name: Persist canonical P90 publication outputs
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              website/plain-language.html \
              website/start-here.html \
              scripts/promote_p90_public_frontier.py \
              docs/figure_catalog.md \
              docs/figures/p90_exact_nonlinear_rank_one_separation.svg \
              figures/current_frontier.svg \
              figures/manifest.json
            git commit -m "Close P90 reader and figure publication residuals"
            git push origin HEAD:p90-exact-nonlinear-rank-one-separation
          fi
      - name: Run end-to-end reproducibility audit
        run: python scripts/reproducibility_audit.py
      - name: Upload reproduced P90 visual record
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-visual-record-v0.82.0-p90
          path: |
            docs/figures/quantitative
            docs/figures/quantum
            docs/figures/p90_exact_nonlinear_rank_one_separation.svg
            figures/current_frontier.svg
            figures/manifest.json
          if-no-files-found: error
