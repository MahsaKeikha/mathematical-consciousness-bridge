name: reproducibility

# Exact-reference P93 release audit. This workflow is permanently read-only.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install exact reference environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-reproducibility.txt
      - name: Validate committed P93 publication state
        run: |
          python -m pytest -q \
            tests/test_localized_sign_coherence_rejection.py \
            tests/test_p93_reader_surface_coherence.py \
            tests/test_frontier_reader_narrative.py \
            tests/test_reader_documentation_consistency.py \
            tests/test_research_website_integrity.py \
            tests/test_figure_publication_sync.py \
            tests/test_figure_documentation_integrity.py
          python scripts/sync_figure_publication.py --check
          python scripts/verify_repository.py
          python -m ruff check \
            src/consciousness_bridge/localized_sign_coherence_rejection.py \
            scripts/verify_repository.py \
            scripts/synchronize_research_three_website.py \
            tests/test_p93_reader_surface_coherence.py
          git diff --check
          if [ -n "$(git status --porcelain)" ]; then
            echo "Committed P93 publication state is not clean."
            git status --short
            exit 1
          fi
      - name: Run end-to-end reproducibility audit
        run: python scripts/reproducibility_audit.py
      - name: Upload reproduced P93 visual record
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-visual-record-v0.82.0-p93
          path: |
            docs/figures/quantitative
            docs/figures/quantum
            docs/figures/p93_localized_sign_coherence_rejection.svg
            figures/current_frontier.svg
            figures/manifest.json
          if-no-files-found: error
