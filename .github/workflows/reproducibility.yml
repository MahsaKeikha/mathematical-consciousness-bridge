name: reproducibility

# Exact-reference P87 release audit on the same commit used by the publication gate.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install exact reference environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-reproducibility.txt
      - name: Run end-to-end reproducibility audit
        run: python scripts/reproducibility_audit.py
      - name: Upload reproduced P87 visual record
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-visual-record-v0.82.0-p87
          path: |
            docs/figures/quantitative
            docs/figures/quantum
            docs/figures/p87_exact_bounded_primitive_quad_projection_parity.svg
            figures/current_frontier.svg
            figures/manifest.json
          if-no-files-found: error
