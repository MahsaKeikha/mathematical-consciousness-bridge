name: integrate-p40-once

on:
  push:
    branches:
      - p40-continuous-quantum-region-regularity
    paths:
      - .github/integrate_p40_release.py
      - .github/workflows/integrate-p40-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: p40-continuous-quantum-region-regularity
          fetch-depth: 0

      - name: Apply P40 publication integration
        run: python .github/integrate_p40_release.py

      - name: Remove one-time integration scaffolding
        run: |
          rm .github/integrate_p40_release.py
          rm .github/workflows/integrate-p40-once.yml

      - name: Validate on Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test on Python 3.10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test on Python 3.11
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Validate on Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test on Python 3.12
        run: |
          python -m pip install -e ".[dev]"
          pytest
          ruff check .

      - name: Commit verified P40 release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate P40 continuous quantum-region regularity"
          git push origin HEAD:p40-continuous-quantum-region-regularity
