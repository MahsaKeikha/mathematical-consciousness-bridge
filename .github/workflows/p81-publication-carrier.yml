name: p81-reader-publication-carrier

on:
  push:
    branches: ["p81-projection-event-certificate"]
    paths:
      - ".github/workflows/p81-publication-carrier.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p81-projection-event-certificate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract and run P81 integration script
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/integrate-p81-publication.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          obsolete_lines = {
              'text = replace_required(text, "P71-P80 return to the P19 target-sufficiency lineage", "P71-P81 return to the P19 target-sufficiency lineage", label="README roadmap caption", count=1)',
              'text = replace_required(text, "Current documented theorem frontier: P80", "Current documented theorem frontier: P81", label="README BibTeX frontier")',
          }
          for line in body.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              if line.strip() in obsolete_lines:
                  continue
              lines.append(line)
          Path('/tmp/p81_integration.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/p81_integration.py
          python - <<'PY'
          from pathlib import Path

          # Repair stale README citation example that predates the P80 release.
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('version      = {0.78.0}', 'version      = {0.81.0}')
          text = text.replace('Current documented theorem frontier: P78.', 'Current documented theorem frontier: P81.')
          path.write_text(text, encoding='utf-8')

          # Keep both scientific-boundary phrases explicit and line-wrap independent.
          path = Path('src/consciousness_bridge/projection_event_model_separation.py')
          text = path.read_text(encoding='utf-8')
          old = (
              'All certification arithmetic uses ``fractions.Fraction``. This is a numerical and statistical certification result for the declared P75\n'
              'latent model. It does not validate that model, does not identify any latent state\n'
              'with consciousness, and does not solve the physical-to-experiential bridge.\n'
          )
          new = (
              'All certification arithmetic uses ``fractions.Fraction``. This is a numerical\n'
              'and statistical certification result for the declared P75 latent model.\n'
              'It does not validate that model.\n'
              'It does not identify any latent state with consciousness.\n'
              'It does not solve the physical-to-experiential bridge.\n'
          )
          if old not in text:
              raise RuntimeError('P81 scientific-boundary integration marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Synchronize website counts and frontier wording with the actual theorem files.
          path = Path('website/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('<strong>80</strong><span>proposition-level results</span>', '<strong>81</strong><span>proposition-level results</span>')
          text = text.replace('See all 80 results grouped by scientific role', 'See all 81 results grouped by scientific role')
          text = text.replace('P71-P80 strengthen the target side of the bridge test', 'P71-P81 strengthen the target side of the bridge test')
          path.write_text(text, encoding='utf-8')

          # Advance the release-level README caption guard; the static figure remains P1-P31.
          path = Path('tests/test_theorem_roadmap_caption.py')
          text = path.read_text(encoding='utf-8')
          old = 'assert "P1 through P80 with explicit dependency branches" in text'
          new = 'assert "P1 through P81 with explicit dependency branches" in text'
          if old not in text:
              raise RuntimeError('roadmap-caption release guard marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate complete P81 publication
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .
      - name: Remove temporary workflows and commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/integrate-p81-publication.yml
          git rm .github/workflows/p81-publication-carrier.yml
          git add -A
          git commit -m "Integrate P81 across publication surfaces"
          git push origin HEAD:p81-projection-event-certificate
