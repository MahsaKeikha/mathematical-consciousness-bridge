name: p81-reader-publication-carrier

on:
  push:
    branches: ["p81-projection-event-certificate"]
    paths:
      - ".github/workflows/p81-publication-carrier.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p81-projection-event-certificate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract and run P81 integration script
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/integrate-p81-publication.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          for line in body.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/p81_integration.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/p81_integration.py
      - name: Validate complete P81 publication
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
          ruff check .
      - name: Remove temporary workflows and commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/integrate-p81-publication.yml
          git rm .github/workflows/p81-publication-carrier.yml
          git add -A
          git commit -m "Integrate P81 across publication surfaces"
          git push origin HEAD:p81-projection-event-certificate
