name: One Shot Research Map Frontier Links

on:
  push:
    branches:
      - complete-p1-p100-research-map-navigator
    paths:
      - .github/workflows/one-shot-research-map-frontier-links.yml
      - scripts/one_shot_research_map_frontier_links.py

permissions:
  contents: write

jobs:
  repair-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out navigator branch
        uses: actions/checkout@v4
        with:
          ref: complete-p1-p100-research-map-navigator

      - name: Repair stale current-frontier links
        run: python scripts/one_shot_research_map_frontier_links.py

      - name: Verify current P100 links
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('website/research-map.html').read_text(encoding='utf-8')
          assert 'visual-atlas.html#p100-frontier">See the current P100 figure</a>' in page
          assert 'visual-atlas.html#p100-frontier">Current P100 frontier</a>' in page
          assert 'visual-atlas.html#p96-frontier">Current frontier</a>' not in page
          assert '>See the P96 figure</a>' not in page
          PY

      - name: Verify clean diff formatting
        run: git diff --check

      - name: Commit repaired frontier links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/research-map.html tests/test_complete_research_map_proposition_navigator.py
          git commit -m "Point Research Map historical links to P100 frontier"
          git push origin HEAD:complete-p1-p100-research-map-navigator
