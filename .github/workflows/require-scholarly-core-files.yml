name: require-scholarly-core-files

on:
  push:
    paths:
      - ".github/workflows/require-scholarly-core-files.yml"
      - "scripts/require_scholarly_core_files.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require scholarly core files
        run: python scripts/require_scholarly_core_files.py
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run scholarly and publication tests
        run: >-
          python -m pytest
          tests/test_scholarly_provenance_surface.py
          tests/test_reader_experience.py
          tests/test_reference_and_prose_style.py
          tests/test_typography_policy.py
          tests/test_website_build.py
          tests/test_website_link_integrity.py
      - name: Verify repository contract
        run: python scripts/verify_repository.py
      - name: Prove scholarly files are required core artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("scripts/verify_repository.py").read_text(encoding="utf-8")
          start = text.index("CORE_FILES = (")
          end = text.index("\n)\n\nLINK_SURFACES", start)
          core = text[start:end]
          for path in (
              "docs/claim_source_matrix.md",
              "docs/reference_audit.md",
              "docs/literature_map.md",
          ):
              assert f'    "{path}",' in core, path
          PY
      - name: Check patch formatting
        run: git diff --check
      - name: Commit permanent verifier repair
        run: |
          if git diff --quiet -- scripts/verify_repository.py; then
            echo "No verifier repair needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_repository.py
          git commit -m "Require scholarly provenance as core artifacts"
          git push
