name: p43-notation-fix-once

on:
  push:
    branches:
      - p43-optimal-quantum-target-allocation
    paths:
      - .github/workflows/p43-notation-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p43-optimal-quantum-target-allocation
          fetch-depth: 0
      - name: Repair P43 LaTeX notation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/proposition_43_optimal_quantum_target_allocation.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'rac{a^{1/3}}{s},': r'\frac{a^{1/3}}{s},',
              'rac{b^{1/3}}{s}.': r'\frac{b^{1/3}}{s}.',
          }
          for bad, good in replacements.items():
              count = text.count(bad)
              if count != 1:
                  raise SystemExit(f'expected exactly 1 occurrence of {bad!r}, found {count}')
              start = text.index(bad)
              if start > 0 and text[start - 1] == '\x0c':
                  text = text[:start - 1] + text[start:]
                  start -= 1
              text = text[:start] + text[start:].replace(bad, good, 1)
          if '\x0c' in text:
              raise SystemExit('form-feed control character remains in P43 proof')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/p43-notation-fix-once.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/proposition_43_optimal_quantum_target_allocation.md .github/workflows/p43-notation-fix-once.yml
          git commit -m "Repair P43 fraction notation"
          git push origin HEAD:p43-optimal-quantum-target-allocation