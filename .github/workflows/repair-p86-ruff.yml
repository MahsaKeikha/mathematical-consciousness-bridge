name: repair-p86-ruff

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/repair-p86-ruff.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Correct exception type semantics
        run: |
          python -c 'from pathlib import Path; p=Path("scripts/verify_repository.py"); s=p.read_text(); old="raise RuntimeError(\"figure manifest does not contain a figure record list\")"; new="raise TypeError(\"figure manifest does not contain a figure record list\")"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("src/consciousness_bridge/weighted_quad_projection_parity_functional_separation.py"); s=p.read_text(); old="if isinstance(coefficient, bool) or not isinstance(coefficient, int):\n            raise ValueError(\"P86 functional coefficients must be nonzero integers\")"; new="if isinstance(coefficient, bool) or not isinstance(coefficient, int):\n            raise TypeError(\"P86 functional coefficients must be nonzero integers\")"; assert s.count(old)==1; p.write_text(s.replace(old,new,1))'
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate semantics and static analysis
        run: |
          python -m pytest -q tests/test_weighted_quad_projection_parity_functional_separation.py tests/test_figure_publication_sync.py tests/test_reproducibility_contract.py
          python -m ruff check .
          python scripts/verify_repository.py
          git diff --check
      - name: Commit guarded repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_repository.py src/consciousness_bridge/weighted_quad_projection_parity_functional_separation.py
          git commit -m "Correct P86 exception type semantics"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
