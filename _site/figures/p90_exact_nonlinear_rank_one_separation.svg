<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">P90 Exact Nonlinear Rank-One Slice Separation</title>
<desc id="desc">What this figure shows: Figure 2. P90 exact nonlinear rank-one slice separation. P90 moves beyond the complete P89 linear parity-functional envelope. On the established strict P75 box, prevalence is fixed at zero, so the observable family is a single product Bernoulli law and the canonical two-by-two slice must satisfy ad = bc. The empirical slice has exact determinant residual 5/192, forcing full-law L-infinity distance at least 5/72; an explicit rational P75 point attains exactly 5/72. Thus the exact nonlinear distance is L90 = 5/72 = (7/3)L89. How to read it: follow only the labeled arrows, axes, panels, set relations, or inequalities shown in the visual and interpret them using the adjacent research text. Main takeaway: the figure summarizes the stated mathematical or scientific dependency; visual proximity alone does not add a claim. Scientific status: Reader-facing research figure; formal status is controlled by the linked proof or source record.</desc>
<rect width="1440" height="900" fill="#ffffff"/>
<text x="72" y="78" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#111827">P90 · Exact nonlinear rank-one slice separation</text>
<text x="72" y="122" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#374151">A nonlinear model-image constraint gives an exact distance beyond the complete P89 linear envelope.</text>
<rect x="60" y="170" width="400" height="500" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
