<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">P71 target-provenance non-circularity</title>
  <desc id="desc">What this figure shows: P71 separates mathematical factorization from scientific target provenance. The left panel shows a descriptor-derived target E=h(T), for which the exact bridge and zero conditional residual are guaranteed by construction. The right panel uses the repository's synthetic four-state example to show that a separately declared target can create a same-descriptor/different-target collision and a positive conditional residual. The lower comparison states the provenance limitation: a zero residual observed from values alone cannot establish that the target was independently specified. How to read it: read the left and right panels as contrasting target-construction protocols, follow only the attached labeled arrows, then compare the two synthetic residual cards. Main takeaway: a target manufactured from the tested descriptor cannot serve as independent evidence that the same descriptor is sufficient for that target. Scientific status: Proved target-provenance non-circularity theorem plus a synthetic finite example. The synthetic target is not asserted to represent experience; passing P71 is necessary but not sufficient for a serious physical-to-experiential bridge test.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, Helvetica, sans-serif; fill: #475569; }
      .panelTitle { font: 700 20px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .body { font: 400 14px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, Helvetica, sans-serif; fill: #64748b; }
      .eq { font: 600 15px Georgia, 'Times New Roman', serif; fill: #0f172a; }
      .white { font: 400 14px Arial, Helvetica, sans-serif; fill: #e2e8f0; }
      .whiteBold { font: 700 17px Arial, Helvetica, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f8fafc"/>
  <rect x="34" y="28" width="1132" height="704" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="68" y="76" class="title">P71 Target-Provenance Non-Circularity</text>
  <text x="68" y="106" class="subtitle">Factorization can be mathematically true yet evidentially vacuous when the target was built from the tested descriptor</text>

  <!-- Left: descriptor-derived target -->
  <rect x="68" y="140" width="500" height="332" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="94" y="178" class="panelTitle">A. Descriptor-derived target</text>
  <text x="94" y="204" class="body">Construction itself forces the target to respect every T-fiber.</text>

  <rect x="96" y="244" width="110" height="62" rx="11" fill="#e2e8f0" stroke="#64748b" stroke-width="1.8"/>
  <text x="151" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Omega</text>
  <text x="151" y="291" text-anchor="middle" class="small">{0,1,2,3}</text>

  <line x1="206" y1="275" x2="276" y2="275" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="278" y="244" width="112" height="62" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="334" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">T</text>
  <text x="334" y="291" text-anchor="middle" class="small">Omega mod 2</text>

  <line x1="390" y1="275" x2="458" y2="275" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="424" y="260" text-anchor="middle" class="small">h</text>

  <rect x="460" y="244" width="80" height="62" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="500" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#166534">E_h</text>
  <text x="500" y="291" text-anchor="middle" class="small">h(T)</text>

  <rect x="96" y="338" width="444" height="106" rx="13" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="118" y="367" class="eq">E_h = h(T)</text>
  <text x="118" y="394" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#166534">I(E_h; Omega | T) = 0</text>
  <text x="118" y="420" class="body">No same-T / different-E_h collision can occur.</text>
  <text x="118" y="439" class="small">Bridge sufficiency is satisfied by construction, not independently tested.</text>

  <!-- Right: separately declared synthetic target -->
  <rect x="600" y="140" width="532" height="332" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="626" y="178" class="panelTitle">B. Separately declared synthetic target</text>
  <text x="626" y="204" class="body">Synthetic example: E_ext(Omega) = 1{Omega &gt;= 2}, declared without using T.</text>

  <rect x="630" y="236" width="94" height="50" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
  <text x="677" y="267" text-anchor="middle" class="body">Omega = 0</text>
  <rect x="630" y="320" width="94" height="50" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
  <text x="677" y="351" text-anchor="middle" class="body">Omega = 2</text>

  <rect x="806" y="273" width="92" height="60" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="852" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">same T</text>
  <text x="852" y="319" text-anchor="middle" class="small">T = 0</text>

  <line x1="724" y1="261" x2="804" y2="290" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blueArrow)"/>
  <line x1="724" y1="345" x2="804" y2="316" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blueArrow)"/>

  <rect x="1004" y="232" width="98" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.7"/>
  <text x="1053" y="264" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#166534">E_ext = 0</text>
  <rect x="1004" y="322" width="98" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.7"/>
  <text x="1053" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#991b1b">E_ext = 1</text>

  <line x1="724" y1="261" x2="1002" y2="258" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#greenArrow)"/>
  <line x1="724" y1="345" x2="1002" y2="348" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#redArrow)"/>

  <rect x="630" y="398" width="472" height="50" rx="11" fill="#fff7ed" stroke="#f97316" stroke-width="1.7"/>
  <text x="650" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#9a3412">Collision witness:</text>
  <text x="650" y="439" class="body">same T = 0, but different E_ext; exact factorization through T fails.</text>

  <!-- Lower residual comparison -->
  <text x="68" y="510" class="panelTitle">Synthetic finite-example residual</text>

  <rect x="68" y="534" width="500" height="82" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="94" y="563" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#14532d">Descriptor-derived E_circ = T</text>
  <text x="94" y="590" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#166534">I(E_circ; Omega | T) = 0</text>
  <text x="370" y="590" class="small">guaranteed by construction</text>

  <rect x="600" y="534" width="532" height="82" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="626" y="563" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Separately declared synthetic E_ext</text>
  <text x="626" y="590" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1e40af">I(E_ext; Omega | T) = log 2 ≈ 0.6931 nats</text>

  <!-- Provenance / scientific boundary -->
  <rect x="68" y="642" width="1064" height="70" rx="14" fill="#0f172a"/>
  <text x="94" y="670" class="whiteBold">Provenance boundary</text>
  <text x="94" y="694" class="white">A zero residual cannot, from observed values alone, prove independent target provenance. The synthetic E_ext is not a claim about measured experience.</text>

  <text x="68" y="735" class="small">P71 is a non-circularity theorem and protocol requirement. Passing it is necessary, not sufficient, for a serious physical-to-experiential bridge test.</text>
</svg>
