<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">P84 joint parity compatibility certificate</title>
  <desc id="desc">What this figure shows: P84 frontier figure. P84 preserves the common parameter geometry of pairs of P83 parity events. The strict witness L83 = 0 &lt; L84 = 1/32 demonstrates a genuine strengthening while retaining the P78 mesh upper certificate and P79 one-sided finite-data rejection gate. How to read it: follow only the labeled arrows, axes, panels, set relations, or inequalities shown in the visual and interpret them using the adjacent research text. Main takeaway: the figure summarizes the stated mathematical or scientific dependency; visual proximity alone does not add a claim. Scientific status: Reader-facing research figure; formal status is controlled by the linked proof or source record.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="780" fill="#f8fafc"/>
  <rect x="34" y="28" width="1132" height="724" rx="24" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>

  <text x="70" y="76" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">P84 Joint Parity Compatibility Certificate</text>
  <text x="70" y="108" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475569">Two parity checks can pass separately yet fail under one shared P75 parameter assignment</text>

  <!-- PANEL 1 -->
  <rect x="70" y="145" width="310" height="430" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="145" width="310" height="82" rx="18" fill="#eef2ff"/>
  <rect x="70" y="209" width="310" height="18" fill="#eef2ff"/>
  <circle cx="101" cy="178" r="17" fill="#4f46e5"/>
  <text x="101" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">1</text>
  <text x="128" y="173" font-family="Arial, Helvetica, sans-serif" font-size="17.6" font-weight="700" fill="#1e1b4b">Keep the parameters coupled</text>
  <text x="94" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12.9" fill="#475569">Do not optimize two P83 events independently</text>

  <rect x="94" y="248" width="262" height="118" rx="12" fill="#f8faff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="114" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14.7" font-weight="700" fill="#312e81">Two P83 parity events</text>
  <text x="114" y="304" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#4338ca">H1 = H(J1,b1)</text>
  <text x="114" y="328" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#4338ca">H2 = H(J2,b2), with J1 != J2</text>
  <text x="114" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12.4" fill="#4338ca">C = P(H1) - P(H2)</text>

  <path d="M225 366 L225 392" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="94" y="392" width="262" height="108" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <text x="114" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14.7" font-weight="700" fill="#9a3412">Why P83 can miss this</text>
  <text x="114" y="446" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#c2410c">Each probability may lie inside its own</text>
  <text x="114" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#c2410c">exact interval while no single parameter</text>
  <text x="114" y="490" font-family="Arial, Helvetica, sans-serif" font-size="12.2" fill="#c2410c">choice realizes both values together.</text>

  <rect x="94" y="518" width="262" height="39" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="225" y="543" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.4" font-weight="700" fill="#334155">220 genuinely coupled contrasts</text>

  <path d="M380 360 L445 360" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- PANEL 2 -->
  <rect x="445" y="145" width="310" height="430" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="445" y="145" width="310" height="82" rx="18" fill="#ecfdf5"/>
  <rect x="445" y="209" width="310" height="18" fill="#ecfdf5"/>
  <circle cx="476" cy="178" r="17" fill="#059669"/>
  <text x="476" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">2</text>
  <text x="503" y="173" font-family="Arial, Helvetica, sans-serif" font-size="17.6" font-weight="700" fill="#064e3b">Extremize the pair exactly</text>
  <text x="469" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12.9" fill="#475569">Use common endpoint vertices of J1 union J2</text>

  <rect x="469" y="248" width="262" height="130" rx="12" fill="#f0fdf4" stroke="#34d399" stroke-width="1.8"/>
  <text x="489" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14.7" font-weight="700" fill="#065f46">Branchwise exact contrast</text>
  <text x="489" y="303" font-family="Arial, Helvetica, sans-serif" font-size="11.9" fill="#047857">C_s = 1/2 [(-1)^b1 prod(J1)</text>
  <text x="489" y="325" font-family="Arial, Helvetica, sans-serif" font-size="11.9" fill="#047857">             - (-1)^b2 prod(J2)]</text>
  <text x="489" y="349" font-family="Arial, Helvetica, sans-serif" font-size="12.0" fill="#047857">multi-affine in the shared response coordinates</text>
  <text x="489" y="369" font-family="Arial, Helvetica, sans-serif" font-size="12.0" fill="#047857">at most 2^4 common vertices per branch</text>

  <path d="M600 378 L600 403" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="469" y="403" width="262" height="99" rx="12" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="489" y="431" font-family="Arial, Helvetica, sans-serif" font-size="14.7" font-weight="700" fill="#155e75">Exact full-box interval</text>
  <text x="489" y="457" font-family="Arial, Helvetica, sans-serif" font-size="12.0" fill="#155e75">combine exact minus/plus branch intervals</text>
  <text x="489" y="479" font-family="Arial, Helvetica, sans-serif" font-size="12.0" fill="#155e75">then evaluate affine prevalence at endpoints</text>
  <text x="489" y="497" font-family="Arial, Helvetica, sans-serif" font-size="11.8" fill="#155e75">Fraction arithmetic; no floating optimizer</text>

  <rect x="469" y="518" width="262" height="39" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="600" y="543" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.0" font-weight="700" fill="#334155">L84(B) = max(L83(B), L_joint(B))</text>

  <path d="M755 360 L820 360" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- PANEL 3 -->
  <rect x="820" y="145" width="310" height="430" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="820" y="145" width="310" height="82" rx="18" fill="#fff7ed"/>
  <rect x="820" y="209" width="310" height="18" fill="#fff7ed"/>
  <circle cx="851" cy="178" r="17" fill="#ea580c"/>
  <text x="851" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">3</text>
  <text x="878" y="173" font-family="Arial, Helvetica, sans-serif" font-size="17.5" font-weight="700" fill="#7c2d12">Certify joint incompatibility</text>
  <text x="844" y="205" font-family="Arial, Helvetica, sans-serif" font-size="12.9" fill="#475569">Strict exact-rational witness: P84 &gt; P83</text>

  <rect x="844" y="248" width="262" height="120" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="864" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#312e81">Named coupled witness</text>
  <text x="864" y="302" font-family="Arial, Helvetica, sans-serif" font-size="11.9" fill="#4338ca">H1 = H((1,3), 0)</text>
  <text x="864" y="324" font-family="Arial, Helvetica, sans-serif" font-size="11.9" fill="#4338ca">H2 = H((1,2,3), 1)</text>
  <text x="864" y="346" font-family="Arial, Helvetica, sans-serif" font-size="11.9" fill="#4338ca">model contrast interval: [0, 1/2]</text>
  <text x="864" y="364" font-family="Arial, Helvetica, sans-serif" font-size="11.9" fill="#4338ca">empirical contrast: -1/4</text>

  <path d="M975 368 L975 393" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="844" y="393" width="262" height="109" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <text x="864" y="421" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#9a3412">Exact separation</text>
  <text x="864" y="447" font-family="Arial, Helvetica, sans-serif" font-size="12.1" fill="#c2410c">contrast gap = 1/4</text>
  <text x="864" y="469" font-family="Arial, Helvetica, sans-serif" font-size="12.1" fill="#c2410c">coefficient support = 8 cells</text>
  <text x="864" y="491" font-family="Arial, Helvetica, sans-serif" font-size="13.1" font-weight="700" fill="#c2410c">L83 = 0,  L84 = 1/32</text>

  <rect x="844" y="518" width="262" height="39" rx="9" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="975" y="543" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.9" font-weight="700" fill="#14532d">P79 gate: L84 &gt; epsilon_upper =&gt; reject</text>

  <!-- BOTTOM BAND -->
  <rect x="70" y="600" width="1060" height="105" rx="16" fill="#0f172a"/>
  <text x="98" y="632" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">What P84 adds</text>
  <text x="98" y="660" font-family="Arial, Helvetica, sans-serif" font-size="14.2" fill="#e2e8f0">P83 can accept every parity event separately while two of those events are impossible under one shared P75 parameter assignment.</text>
  <text x="98" y="685" font-family="Arial, Helvetica, sans-serif" font-size="14.2" fill="#86efac">P84 preserves that shared-parameter geometry with 220 exact contrasts and a strictly stronger certified lower bound.</text>

  <text x="70" y="736" font-family="Arial, Helvetica, sans-serif" font-size="12.7" fill="#64748b">P84 strengthens a declared model-distance certificate. It is not a consciousness-identification theorem. The physical-to-experiential bridge remains open.</text>
</svg>