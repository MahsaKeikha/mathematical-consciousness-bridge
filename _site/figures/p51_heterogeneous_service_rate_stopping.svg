<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Proposition 51: Heterogeneous finite-window service-rate stopping</title>
  <desc id="desc">What this figure shows: Proved instance-dependent global-round stopping theorem under preparation-specific finite-window service guarantees.. Visible guideposts include: Each preparation gets its own service window and quota, yielding instance-dependent edge stopping times.; Preparation-specific service; (Wᵢ,qᵢ), 1 ≤ qᵢ ≤ Wᵢ; If i stays active for Wᵢ rounds,; it is sampled at least qᵢ times.; Exact finite-time growth. How to read it: follow the diagram in the direction of its arrows and use each box, panel, inequality, or highlighted region only with the meaning printed beside it. Main takeaway: this is the visual companion to Proposition 51; the proposition document supplies the assumptions, proof, and exact scope of every implication. Scientific status: Proposition 51 theorem/certificate visual. It is not independent empirical evidence and does not, by itself, identify a physical or latent variable with consciousness.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .box-title { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .math { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .small { font: 400 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .flow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">P51: Heterogeneous finite-window service-rate stopping</text>
  <text x="60" y="88" class="subtitle">Each preparation gets its own service window and quota, yielding instance-dependent edge stopping times.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="130" width="315" height="160" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <text x="90" y="166" class="box-title">Preparation-specific service</text>
    <text x="90" y="202" class="math">(Wᵢ,qᵢ), 1 ≤ qᵢ ≤ Wᵢ</text>
    <text x="90" y="235" class="body">If i stays active for Wᵢ rounds,</text>
    <text x="90" y="262" class="body">it is sampled at least qᵢ times.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="445" y="130" width="315" height="160" rx="18" fill="#eef2ff" stroke="#6366f1"/>
    <text x="475" y="166" class="box-title">Exact finite-time growth</text>
    <text x="475" y="205" class="math">Nᵢ(T) ≥ qᵢ⌊T/Wᵢ⌋</text>
    <text x="475" y="242" class="math">Tᵢ(N)=Wᵢ⌈N/qᵢ⌉</text>
    <text x="475" y="268" class="small">No asymptotic approximation is needed.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="130" width="315" height="160" rx="18" fill="#ecfdf5" stroke="#10b981"/>
    <text x="860" y="166" class="box-title">Edge bottleneck time</text>
    <text x="860" y="205" class="math">e={i,j}</text>
    <text x="860" y="242" class="math">Tₑ=max{Tᵢ(Nₑ),Tⱼ(Nₑ)}</text>
    <text x="860" y="268" class="small">The slower endpoint controls certification.</text>
  </g>

  <path d="M375 210 L445 210" class="flow"/>
  <path d="M760 210 L830 210" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="85" y="365" width="470" height="150" rx="19" fill="#ecfdf5" stroke="#10b981"/>
    <text x="115" y="402" class="box-title">Positive witness family</text>
    <text x="115" y="438" class="math">T₊ = min{Tₑ : Mₑ &gt; 0}</text>
    <text x="115" y="474" class="math">Pr(τ₊ ≤ T₊) ≥ 1−αY−αQ</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="645" y="365" width="470" height="150" rx="19" fill="#fff7ed" stroke="#f97316"/>
    <text x="675" y="402" class="box-title">All-negative family</text>
    <text x="675" y="438" class="math">T₋ = max{Tₑ : e∈E}</text>
    <text x="675" y="474" class="math">Pr(τ₀ ≤ T₋) ≥ 1−αY−αQ</text>
  </g>

  <path d="M985 290 C920 325 520 325 330 365" class="flow"/>
  <path d="M985 290 C1010 325 955 340 885 365" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="85" y="585" width="470" height="105" rx="18" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="115" y="622" class="box-title">P50 recovered exactly</text>
    <text x="115" y="657" class="math">Wᵢ=H, qᵢ=1 ⇒ Tᵢ(N)=HN</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="645" y="585" width="470" height="105" rx="18" fill="#fef2f2" stroke="#ef4444"/>
    <text x="675" y="622" class="box-title">Finite-window condition matters</text>
    <text x="675" y="657" class="body">An asymptotic sampling fraction alone permits arbitrarily long finite starvation intervals.</text>
  </g>

  <text x="60" y="730" class="small">Scientific boundary: P51 sharpens scheduling complexity only; it does not alter the meaning of the underlying physical-to-target regularity witness.</text>
</svg>
